slug: backend-collaborative-editor
title: "The collaborative editor interview"
summary: "A backend design interview for a real-time collaborative editor like Google Docs, run step by step on one whiteboard: requirements, entities, the API, a high-level design, then five ways to let many people edit one document and the final design with its versions."
outline: "The collaborative editor lessons follow the five-step order and the drawings of InterviewWithBunny's System Design 10, Design a Real-time Collaborative Text Editor like Google Docs (youtube.com/watch?v=-eMtcFqj8vI), section by section; no text is taken from it, and its factual slips are corrected in the article."
lessons:
  - slug: collaborative-editor
    title: "The collaborative editor interview: the problem, requirements, entities and API"
    summary: "The problem at the top of the board, functional and non-functional requirements side by side, the four entities, and three endpoints, one of them a websocket."
    parts:
      - { title: "The problem, then two lists", minutes: 9, packs: [backend/collaborative-editor/end-to-end/problem-statement, backend/collaborative-editor/end-to-end/requirements] }
      - { title: "Entities, then the API", minutes: 6, packs: [backend/collaborative-editor/end-to-end/entities, backend/collaborative-editor/end-to-end/api] }
  - slug: collaborative-editor-design
    title: "The collaborative editor interview: high-level design, then the metadata service"
    summary: "Clients, a gateway, a metadata service and an editor service with a database and blob storage; then the low-level design opens the metadata service: a queue, a consumer and Cassandra."
    parts:
      - { title: "A gateway, two services, two stores", minutes: 8, packs: [backend/collaborative-editor/end-to-end/high-level-design] }
      - { title: "The metadata service", minutes: 6, packs: [backend/collaborative-editor/end-to-end/lld-metadata] }
  - slug: collaborative-editor-approaches
    title: "The collaborative editor interview: replace the file, lock it, or send events"
    summary: "The editor service's first three approaches, numbered as on the board: replacing the whole file, a locking protocol, then small edit events over a websocket, and the conflict that breaks them."
    parts:
      - { title: "Replace the whole file", minutes: 4, packs: [backend/collaborative-editor/end-to-end/lld-file-replacement] }
      - { title: "A locking protocol", minutes: 4, packs: [backend/collaborative-editor/end-to-end/lld-locking] }
      - { title: "Events over a websocket, and the conflict", minutes: 10, packs: [backend/collaborative-editor/end-to-end/lld-events] }
  - slug: collaborative-editor-ot-crdt
    title: "The collaborative editor interview: operational transformation and CRDTs"
    summary: "Approaches four and five, side by side as on the board: OT transforms user B's insert so both copies read ABCD, a CRDT gives every character a fixed position; their limits, and why Google Docs uses OT."
    parts:
      - { title: "Operational transformation", minutes: 8, packs: [backend/collaborative-editor/end-to-end/lld-ot] }
      - { title: "CRDTs", minutes: 7, packs: [backend/collaborative-editor/end-to-end/lld-crdt] }
  - slug: collaborative-editor-final
    title: "The collaborative editor interview: the editor service, and finishing"
    summary: "The final design: a websocket gateway, OT at both ends, one server per document, the operation log, the canonical copy in Redis, snapshots and versions, the replay job, cursors and two version endpoints."
    parts:
      - { title: "The editor service and its versions", minutes: 20, packs: [backend/collaborative-editor/end-to-end/lld-editor] }
