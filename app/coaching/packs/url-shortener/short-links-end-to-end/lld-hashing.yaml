# URL shortener interview, low-level design 1: hash the long URL and keep the first seven characters. Under "5. Low-level design: 1. Hash logic": the logic as one line, two URLs whose hashes share a prefix, and the server-to-database latency sum that doubles with each collision, as in the video (hashing, not encryption).
id: url-shortener/short-links-end-to-end/lld-hashing
title: "Low-level design, 1: hash and truncate"
source:
  hash: "fbf91bd99ecc"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: url-shortener/short-links-end-to-end/high-level-design
  assumes:
    - "The high-level design is a client, one server that generates the short URL, and a database holding the mapping."
    - "Non-functional: about 200 ms, 1B URLs, every short URL unique."
  carries:
    - "Hashing the long URL with MD5 or SHA-1 and keeping 7 characters collides: a short prefix has too few values for 1B links."
    - "Each collision costs another hash and another database look-up: 16 ms a try in the illustrative numbers, 32 ms after one collision."
    - Hash and truncate is fine for a small service and rejected at a billion links.
  terms:
    - term: hash function
      means: "Turns any input into a fixed-length value (MD5 32 hex characters, SHA-1 40); one way, nothing to decrypt."
    - term: collision
      means: Two different long URLs ending up with the same short code.
