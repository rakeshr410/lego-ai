# URL shortener interview, requirements: "1. Functional requirements" on the left and "Non-functional requirements" on the right, under the problem statement, as the video lays them out; every non-functional line with its number.
id: url-shortener/short-links-end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "5fc5b71868b3"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: url-shortener/short-links-end-to-end/problem-statement
  assumes:
    - "A shortener maps each long URL to a short one, one to one, and redirects from the short one."
  carries:
    - "Functional: create a short URL from a long one; optional custom URL (premium); optional expiry, 90 days by default; a short URL redirects to the original."
    - "Non-functional: about 200 ms for create and redirect; 100M daily users and 1B URLs; every short URL unique; availability over consistency, eventual is fine."
    - Requirements are gathered within the first 10 to 15 minutes of 45.
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system (latency, scale, availability), stated with a number and where it applies."
    - term: eventual consistency
      means: A new link may take a moment to become readable everywhere, but it gets there.
