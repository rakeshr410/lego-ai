beats:
  - point: "The two core functional requirements: create a short URL from a long URL, and redirect anyone who opens the short URL to the original."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: functional requirements, what the system does. The first is to create a short URL from a long URL."
      - "The second is the other direction: whoever opens the short URL is redirected to the original. These two are the heart of it."
    draw: [fr, fr-create, fr-redirect]
    check: What are the two requirements a shortener cannot do without?
    answer: Create a short URL from a long one, and redirect from the short URL to the original.
  - point: "Two optional ones ride on create: a custom URL instead of a generated code, for premium users, and an expiry date, 90 days by default."
    kind: requirement
    weight: supporting
    teach:
      - "The interviewer may add features. A custom URL, an alias the user picks instead of a generated code, perhaps only for premium users."
      - "And an expiry date: links expire after 90 days by default, and premium users may choose their own."
    draw: [fr-custom, fr-expiry]
    check: Who gets to choose a custom URL in this design?
    answer: Premium users; everyone else gets a generated code.
  - point: "Non-functional requirements are qualities with numbers: low latency, about 200 ms for both creating and redirecting, at a scale of 100 million daily users and a billion URLs."
    kind: metric
    weight: core
    teach:
      - "On the right, the non-functional requirements: the qualities. Low latency first, and say where it applies, on create and on redirect, and how much: about 200 milliseconds."
      - "Then the scale. Ask for it: say 100 million daily active users and a billion URLs. These numbers drive the database and the architecture later."
    draw: [nfr, nfr-latency, nfr-scale]
    check: Why ask for the number of users at all?
    answer: Because the scale decides the architecture and the database; a design for a thousand users fails at a hundred million.
  - point: "Every short URL must be unique, and the system favours availability over consistency: a link is shared seconds after it is made, so eventual consistency is fine."
    kind: requirement
    weight: core
    teach:
      - "Every short URL is unique; two long URLs never share one."
      - "Then CAP. At this scale the data is on many machines, so when the network splits we pick availability or consistency. A ticket booking needs consistency; here a link is created and then shared by hand, so nobody opens it in the first second. Availability wins, and eventual consistency is enough."
    draw: [nfr-unique, nfr-cap]
    check: Why is eventual consistency acceptable for a shortener but not for booking a seat?
    answer: A new link is shared by hand after it is made, so a brief delay before it resolves everywhere costs nothing; two buyers for one seat is a real failure.
    misconceptions:
      - "A shortener must be strongly consistent so the link works instantly -> the gap between creating and sharing a link hides the delay; availability matters more."
  - point: "Keep requirement gathering inside 10 to 15 minutes of a 45-minute interview, or there is no time left to design."
    kind: rule
    weight: supporting
    teach:
      - "Watch the clock: the requirements take 10 to 15 minutes at most. Spend longer and you gather everything and design nothing."
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should this shortener do? Tell me the features one at a time, and I'll write them down."
    hints:
      - What does a user give it, and what do they get back?
      - And what happens when someone opens the short link?
  - list: nfr-list
    beats: [3, 4]
    question: "Now the qualities. How fast, how big, how reliable should it be? A number if you have one."
    hints:
      - Think about how long a redirect may take, and how many users there are.
      - And what matters more when machines fail, staying up or staying exact?
