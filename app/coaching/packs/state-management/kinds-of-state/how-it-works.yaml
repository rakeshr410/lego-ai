beats:
  - point: Any value finds its home by five questions asked in order, stopping at the first yes, with component state as the default when every answer is no.
    kind: decision
    weight: core
    teach:
      - Draw the path top to bottom. Can it be computed from other state? Then derive it. Does the server own the truth? Server cache. Should a reload, Back or a shared link bring it back? The URL. Is it an edit not yet sent? The form. Do components far apart read or change it? A small shared store. Otherwise, component state.
      - The order matters. Mossgrove's cart count is both shared and computable; ask about sharing first and it becomes a stored field, ask about computing first and it is stored nowhere, which is right.
      - When a value seems to fit two homes it is usually two values. The pot size a customer picked belongs in the URL; that pot's price belongs to the server cache.
    draw: [placement, q-computed, home-derived, yes-computed, q-server, home-cache, yes-server, q-url, home-url, yes-url, q-form, home-form, yes-form, q-shared, home-store, yes-shared]
    check: The customer picks the 17 cm pot on a product page, and the page shows that pot's price. Where does each value live, and why?
    answer: The pot pick goes in the URL, because a reload, Back or a shared link should bring it back; the price belongs to the server cache, because the server owns it. They are two values with two homes.
    misconceptions:
      - "Anything two components share goes in the global store -> ask first whether it can be computed or is the server's; the cart count is shared but derived, so it is stored nowhere."
  - point: Derived state has no home of its own, so it is computed during render or in a selector instead of being stored as a copy.
    kind: rule
    weight: core
    teach:
      - The bag badge's count, the subtotal, the label that says 2 filters and the plants that pass the filters are all functions of state that already has an owner.
      - A stored copy means every path that changes the source must remember to update the copy, for good. Computing it costs a loop over a few cart lines; memoise only when a measured calculation takes about a millisecond or more.
    draw: [badge-derived, memo-1ms]
    check: Why should Mossgrove's bag badge compute its count from the cart lines rather than keep a count field in the store?
    answer: The count is a function of the lines, which already have an owner. A stored copy must be updated by every code path that changes the lines, and can drift; computing it is cheap.
    misconceptions:
      - "Store the computed value so it is not recalculated every render -> the recalculation is cheap; memoise only when a measured calculation reaches about a millisecond."
  - point: Server state is a cache of the server's truth, kept in a request cache keyed by what was asked so it can go stale and be fetched again, and never hand-copied into the app's store.
    kind: rule
    weight: core
    teach:
      - Mossgrove's stock count was true when it arrived and stops being true when someone else buys. At T plus 14 minutes another shopper takes the last Fiddle-leaf fig, and this copy still says 1 left.
      - So it lives in a cache keyed by the request, a product, the wishlist, page 2 of a search, which can mark it stale and refetch. Copied into the app's own store, nothing would ever refresh it.
    draw: [lifetimes, life-cache, fig-stale, no-copy-stock]
    check: A developer copies each product's stock count into the app's shared store when the page loads. What goes wrong?
    answer: The store never refetches, so once someone else buys, the copy keeps showing stock that is gone. Stock belongs in the server cache, keyed by the query, which can mark it stale and fetch again.
    misconceptions:
      - "Server data is app state like any other -> it is a cache of the server's truth; keep it in a request cache that can refetch, not in the client store."
  - point: Each home keeps state for a different time, component state until unmount, a shared store until reload, the URL through reloads, history and links, the server cache only until it is dropped, and bugs sit where a value's need and its home do not match.
    kind: mechanism
    weight: core
    teach:
      - Read the homes as promises. Component state lasts while the component renders at the same place in the tree. A shared store lasts as long as the JavaScript holding it, the tab until a reload. The URL comes back on reload, waits in history and travels in a pasted link. The server cache can be thrown away whenever, since the server can answer again.
      - Follow one visit. A review draft held in the product page's component is lost when the guest goes back to the catalogue. A filter held only in memory forgets itself on reload. The guest cart in a memory-only store vanishes on reload too, unless the store persists it.
    draw: [life-component, life-store, life-url, bug-draft, bug-filter]
    check: A guest has two lines in a memory-only cart store and reloads the page. What survives, the cart or the ?light=low filter in the URL, and why?
    answer: The URL filter survives, because the URL is reloaded with the page; the cart is lost, because a memory-only store lives only until the tab reloads.
    misconceptions:
      - "A shared store keeps state for good -> it lives as long as the JavaScript holding it; a reload clears it unless it is persisted."
  - point: State starts in the component that uses it and moves up only when a second component needs it, to their closest common parent, or to a small shared store when that parent is the whole app.
    kind: decision
    weight: core
    teach:
      - When every question is answered no, the value is component state. Colocated state is easy to find, thrown away with its component, and re-renders only that component. Only the Gallery cares which photo shows, so it keeps that itself.
      - The quantity is shown by the stepper and sent by AddToCart, two siblings, so it moves up to BuyBox, their closest parent, and no further. Each value keeps one owner; the owner just moved.
      - The cart lines are read by the header badge, the drawer and the Add button, whose only common parent is the app, so a small store owns them and the badge derives its count. The pot pick lives in the URL and StockLabel reads stock from the cache; the pot and its price are two values with two homes, which is how to read any value that seems to fit two.
    draw: [home-component, no-shared, owners, own-gallery, own-buybox, own-stepper, own-addtocart, buybox-stepper, buybox-add, own-lines, own-badge, derives-count, own-pot, own-stock, two-values]
    check: On Mossgrove's product page, the quantity stepper shows a number and the AddToCart button sends it. Where should the quantity live?
    answer: In BuyBox, the closest common parent of the two siblings, and no higher; it is not a global value.
    misconceptions:
      - "Lifting state means moving it to a global store -> lift only to the closest common parent; a store is for when that parent is the whole app."
task:
  prompt: For Mossgrove's product page, draw the five questions as a decision path and place the gallery photo, the quantity, the cart lines, the badge count, the pot size and the stock in their homes.
  expects: [1, 5]
