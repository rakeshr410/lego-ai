# Where a value lives: five questions in order, derived state with no home, server state as a cache, how long each home keeps state, and colocating before lifting.
id: state-management/kinds-of-state/how-it-works
title: Kinds of state and where they live
source:
  hash: 7752c4cb1b06
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "Five questions, asked in order, place a value: computable, server-owned, wanted after a reload or link, an unsent edit, read far apart; otherwise component state."
    - Derived state is computed in render or a selector and never stored.
    - Server state is a cache keyed by the query that fetched it, never hand-copied into the app's store.
    - Each home keeps state for a different time; bugs sit where a value's need and its home's lifetime do not match.
    - State starts in the component that uses it and is lifted only to the closest common parent, or to a small shared store when that parent is the whole app.
  terms:
    - term: derived state
      means: A value computed from state that already has an owner, such as the cart badge's count; it has no home of its own.
    - term: server cache
      means: The client's copy of facts the server owns, keyed by what was asked and refetched when stale.
    - term: URL state
      means: State in the path or query string, which a reload, Back or a shared link brings back.
    - term: form draft
      means: An edit the person has typed but not yet sent, held by the form until submit.
    - term: shared store
      means: A small store outside the component tree that owns state distant components read or change; it lives until the tab reloads.
    - term: colocation
      means: Keeping state in the component that uses it, as low in the tree as possible.
