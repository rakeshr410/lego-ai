beats:
  - point: Each entity type becomes a table, byId for a one-read lookup and allIds for order, and each reply is taken apart on arrival so every record is upserted into its table by id.
    kind: mechanism
    weight: core
    teach:
      - byId maps an id to the one record for it, so finding a product is a single property read instead of a search. allIds keeps an order, because an object is a poor place for one, integer-like keys get reordered and re-sorting means rebuilding it. A screen's own list, the catalogue by price or the wishlist in saved order, is a small array of ids into the table.
      - The work happens where data enters. Mossgrove's cart reply carries the Monstera inside its line; the mapping step upserts the Monstera into products.byId, the same table the catalogue filled, and the line keeps only productId p-mon20.
    draw: [tables, cart-reply, reply-line, reply-product, products-byid, split, cartlines-byid, line-product, line-keeps-id, products-allids]
    check: The cart reply arrives with the Monstera nested inside its line. What does the store keep after the mapping step?
    answer: The Monstera is upserted into products.byId, merged if the catalogue already had it, and the cart line keeps only productId p-mon20 and its quantity; the line's id joins cartLines.allIds.
    misconceptions:
      - "Keep the order in the byId object's keys -> integer-like keys are reordered numerically and re-sorting rebuilds the object; keep order in an id array."
  - point: Relations are stored as ids on the side that owns them, many to many in a join table, and anything derived is computed by a selector rather than stored.
    kind: rule
    weight: core
    teach:
      - Many to one sits on the many side, each cart line holds a productId and the product does not list its lines. One to many is an ordered id array owned by the parent, the wishlist's productIds, because the order is the wishlist's.
      - A plant in several collections, Pet-safe and Low light, is many to many, so a join table holds collectionId and productId pairs and anything about the pair. A product's lines in the cart are derived, a selector computes them; storing them on the product would be a second copy of one fact.
    draw: [wishlist-ids, collection-items]
    check: A plant can be in several collections, such as Pet-safe and Low light. How is that relation stored?
    answer: In a join table of collectionId and productId pairs, which can also hold anything about the pair itself.
    misconceptions:
      - "Store each product's cart lines on the product -> that is a second copy of the same fact; a selector derives it from cartLines."
  - point: Views read the store only through selectors, and a selector that builds a new array or object is memoised so it returns the same reference while its inputs are unchanged.
    kind: mechanism
    weight: core
    teach:
      - A selector maps the store to what one view needs, the product with this id, the wishlist as records, the cart total. Views never touch the tables, so the layout can change under them, and derived values are computed in one place.
      - A lookup or a sum that returns a number gives the same value when nothing changed and needs no memo. A join that maps the wishlist's ids to records builds a new array every call, so wrap it in createSelector, which reruns the join only when an input is a different reference.
      - Reselect 5 keeps one cache entry per argument set, so one selectProduct shared by 48 cards, each with its own id, does not thrash.
    draw: [selectors, sel-product, reads-product, sel-wish, joins-wish, sel-total, sel-count, counts-lines, memo-join, per-arg-cache]
    check: Which of these needs a memoised selector, selectCartCount, which returns a number, or selectWishlistProducts, which maps ids to product records? Why?
    answer: selectWishlistProducts. It builds a new array on every call, so without memoising a reference check sees a change every time; a number compares by value and needs no memo.
    misconceptions:
      - "Memoise every selector -> a lookup or a number already returns the same value when nothing changed; memoise the joins that build new arrays or objects."
  - point: An update never edits the store in place; it copies only the objects on the path from the root to the change and shares the rest, so a single === check tells whether anything changed.
    kind: mechanism
    weight: core
    teach:
      - The Monstera's price drops. The new state copies the root, the products table, its byId map and the Monstera's record, four new objects. The cart lines, the wishlist, allIds and the other 47 records are the same objects, referenced from the new root. The byId copy is shallow, one pointer per product.
      - That turns did this change into is this the same reference. If the Snake plant's record is the object it was, nothing in it changed, and its card can skip rendering.
      - Editing in place breaks the promise, the data changes but no reference does, so every check concludes nothing happened and no view updates. Immer, inside Redux Toolkit, lets you assign to a draft and copies the path for you.
    draw: [copy-path, new-root, new-products, root-products, new-byid, products-byid-path, new-record, byid-record, same-lines, root-shares, same-records, byid-shares, ref-check, in-place]
    check: The Monstera's price drops from 2400 cents. Which objects in the store are new after the update, and which are reused?
    answer: Four are new, the root, products, products.byId and the Monstera's record; everything else, cartLines, the wishlist, products.allIds and the other 47 records, is the same object as before.
    misconceptions:
      - "Just set the new price on the existing record -> the reference stays the same, so every === check says nothing changed and no view updates."
      - "Object.freeze protects the whole store -> on its own it freezes only the top level; Immer freezes what it produces."
  - point: After every action each mounted selector runs and its component re-renders only if the result is a different reference, so what a component selects decides how often it renders.
    kind: metric
    weight: core
    teach:
      - With useSelector every selector runs after every dispatched action, and the component re-renders only when the result is not === to last time; useSyncExternalStore compares with Object.is the same way.
      - Select the whole state and the root is new after any update, so on Mossgrove's catalogue one price drop re-renders all 51 mounted components. Select per id and only the Monstera's card, the wishlist and the cart drawer re-render, 3, however many cards are on the page.
      - Select a value rebuilt on every call and the component renders after every action, even one that changed nothing. Selectors run on every action, so they must stay cheap.
    draw: [subscriptions, runs-every-action, re-render-rule, whole-store, per-id, three-renders, render-card, render-wish, render-drawer, per-id-renders, fresh-array]
    check: On a catalogue with 48 product cards, a wishlist panel, the cart drawer and the badge, the Monstera's price drops. How many components re-render with whole-store subscriptions, and with per-id selectors?
    answer: 51 with whole-store subscriptions, because the root is new; 3 with per-id selectors, the Monstera's card, the wishlist panel and the cart drawer.
    misconceptions:
      - "A component re-renders only when its data really changed -> it re-renders when its selected result is a different reference, so a selector that rebuilds an array re-renders it after every action."
task:
  prompt: Draw Mossgrove's store as tables after the cart reply is mapped, then show which objects are new when the Monstera's price drops and which views re-render with per-id selectors.
  expects: [1, 4, 5]
