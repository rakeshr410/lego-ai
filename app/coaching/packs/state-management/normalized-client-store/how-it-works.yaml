# A normalized client store: tables keyed by id, relations as ids, selectors, writes that copy only the changed path, and subscriptions to a slice.
id: state-management/normalized-client-store/how-it-works
title: A normalized client store
source:
  hash: a5b995a9add1
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: state-management/kinds-of-state/how-it-works
  assumes:
    - A small shared store owns state that components far apart in the tree read or change.
    - Derived state is computed in render or a selector and never stored.
  carries:
    - Each entity type is a table, byId for lookups and allIds for order; a screen's list is its own array of ids.
    - Replies are split on arrival, each record upserted into its table by id.
    - Relations are stored as ids, with a join table for many to many and selectors for anything derived.
    - Views read through selectors; joins that build new arrays are memoised.
    - An update copies only the objects on the path to the change, so a reference check tells what changed.
    - A component re-renders only when the slice it selects is a different reference.
  terms:
    - term: normalized store
      means: Server records kept once each, in tables keyed by id, with relations and lists held as ids.
    - term: byId and allIds
      means: A table's two parts, a map from id to the one record and an array that keeps the order.
    - term: upsert
      means: Add a record if its id is new, merge it into the existing one if it is known.
    - term: selector
      means: A function from the store to the value one view needs.
    - term: structural sharing
      means: A new state that reuses every object not on the path to the change.
