# Persisting and syncing: the query string as a small public store, push or replace, a versioned envelope in storage read back on boot, and the storage event between tabs.
id: state-management/persisting-and-syncing-state/how-it-works
title: URL, storage and tabs
source:
  hash: 166554a76435
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: state-management/persisting-and-syncing-state/key-idea
  assumes:
    - The home for persisted state is chosen by who must see it again, a link recipient, this device later, or another tab right now.
    - State anyone with the address should see goes in the URL, which is public and limited in length.
    - State for this person on this device goes in storage, which outlives the code that wrote it.
    - Tabs share storage but not memory.
  carries:
    - The query string is a store with two pure functions, parse and serialize, writing one canonical form.
    - The URL is parsed as untrusted input and a cleaned link is rewritten with replaceState.
    - pushState adds a history entry, replaceState rewrites the current one, and popstate fires only on history moves.
    - Storage holds the least that rebuilds the state, in a versioned envelope that is migrated and validated on boot.
    - A write to localStorage fires a storage event in other same-origin tabs, which read storage again through the same loader.
  terms:
    - term: canonical form
      means: The one string a set of filters serializes to, defaults left out and keys sorted.
    - term: pushState and replaceState
      means: History API calls that change the address without loading a document, adding an entry or rewriting the current one.
    - term: envelope
      means: The stored value wrapped with a version number and a timestamp, so later code can migrate it.
    - term: rehydration
      means: Reading persisted state back into the store after the page boots.
    - term: storage event
      means: The event other same-origin tabs receive when one tab changes localStorage; the writer gets none.
