# State that outlives the page: pick its home by who must see it again, a link recipient, this device later, or another tab now, and know each home's cost.
id: state-management/persisting-and-syncing-state/key-idea
title: State that outlives the page
source:
  hash: b00992dbbbc0
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - Each home keeps state for a different time; component state ends on unmount, a shared store on reload, the URL survives reloads and links.
    - Server state is a cache of the server's truth, refetched rather than copied.
  carries:
    - Everything held only in a tab's memory is gone on reload.
    - The home for persisted state is chosen by who must see it again, a link recipient, this device later, or another tab right now.
    - State anyone with the address should see goes in the URL, which is public and limited in length.
    - State for this person on this device goes in storage, which outlives the code that wrote it.
    - Tabs share storage but not memory, so keeping them in step needs a signal, not just a place to write.
  terms:
    - term: sessionStorage
      means: Synchronous string storage for one tab, about 5 MiB per origin, kept across reloads of that tab.
    - term: localStorage
      means: Synchronous string storage for the browser profile, about 5 MiB per origin, kept after a restart and visible to other tabs.
    - term: IndexedDB
      means: Asynchronous storage for the browser profile that keeps structured values, with a large shared quota.
