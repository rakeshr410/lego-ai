# In practice: the Today screen through each state, queue or warn or disable per action, the banner and stale-marker rules, testing without a crowded market, failure modes, and the interview answer.
id: state-management/network-connectivity/in-practice
title: The offline screen in practice
source:
  hash: "dcb24b8e9b7d"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: state-management/network-connectivity/live-updates-and-slow-links
  assumes:
    - "The monitor's statuses (online, slow, checking, offline) and lastOkAt, and that Offline is shown only after Checking confirms it."
    - Writes allowed offline go to a durable outbox with idempotency keys, show 'Not sent yet', and can be refused on replay.
    - OrderFeed pauses when offline and catches up from its cursor before the outbox replays.
  carries:
    - "Through a morning the screen goes from no banner, to a quiet Slow label, to an offline banner with dated rows and 'not sent' markers, to syncing, to a refused replay kept on screen."
    - "Each action is decided offline: queue it, queue it with a warning about what has not changed yet, or disable it with a reason."
    - "The banner is a role=status message that never takes focus or blocks the list; data older than 2 minutes, or any data while offline, carries its time."
    - "Test the hang, not just Offline: a route that accepts and never answers reproduces the crowded hall; aborting the reply proves the idempotency key."
    - The usual failures are trusting navigator.onLine, no timeouts, retries without jitter, writes kept in memory, replay without keys, and resuming without catching up.
  terms:
    - term: stale marker
      means: "The time shown on data the app could not refresh ('updated 11:04'), computed from lastOkAt."
    - term: status region
      means: "An element with role=status: a screen reader announces its change once, politely, without moving focus."
