# Reacting: timeouts on every request, retries with backoff and full jitter, what to retry, the outbox with idempotency keys, and optimistic rows that can be taken back.
id: state-management/network-connectivity/retries-and-queued-writes
title: Retries and queued writes
source:
  hash: "0db8328a5b48"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: state-management/network-connectivity/how-it-works
  assumes:
    - "One ConnectivityMonitor owns the status (online, slow, checking, offline) and every part of the app reads it."
    - "Only a TypeError or a timeout counts against the connection; two in a row start Checking, and a probe settles it."
    - "Offline, a cash sale is still recorded and sent later; a card refund is disabled with a reason."
  carries:
    - "fetch has no timeout of its own; every call gets one sized to its purpose: 8 s reads, 15 s writes, 4 s probe."
    - "Reads retry with full jitter, a random wait from zero to min(30 s, 1 s times 2 to the attempt), at most 5 times."
    - "Retry network errors, timeouts, 408, 429, 502, 503 and 504; honour Retry-After; never retry other 4xx; nothing retries while Offline."
    - Writes allowed offline go to a durable outbox in IndexedDB before the screen shows them, and replay in order, one at a time, after the catch-up read.
    - "Each entry's id is its Idempotency-Key, so a retry after a lost reply is recognised and not recorded twice."
    - "Queued rows are optimistic and say 'Not sent yet'; a 409 or 422 on replay rolls the row back and keeps the problem on screen."
  terms:
    - term: full jitter
      means: Waiting a random time between zero and the current backoff cap, so phones that failed together come back spread out.
    - term: outbox
      means: "The IndexedDB store of writes made on this phone that the server has not confirmed: id, kind, payload, createdAt, attempts, state."
    - term: idempotency key
      means: "A client-made id sent with a write and reused on every retry, so the server can recognise a repeat and return the first result."
    - term: lost reply
      means: The server did the work but the answer never arrived, so the client sees an error for a write that succeeded.
