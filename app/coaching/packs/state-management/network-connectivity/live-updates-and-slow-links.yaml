# Reacting: pausing the poll and sockets when offline or hidden, catching up from a cursor before replaying, what a poll costs a phone's radio, network switches, and adapting to slow links.
id: state-management/network-connectivity/live-updates-and-slow-links
title: Live updates, battery and slow links
source:
  hash: "23207afd2975"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: state-management/network-connectivity/retries-and-queued-writes
  assumes:
    - "The monitor learns Offline from failed requests and a probe, and confirms Online with a probe answered by Stallhand."
    - Writes made offline wait in a durable outbox and replay in order with idempotency keys.
    - "Slow is a status: the rolling round-trip average is over 1,000 ms."
  carries:
    - OrderFeed polls with a cursor every 20 s, and stops when the monitor says Offline or the page is hidden.
    - "On return it catches up from the cursor first (a full reload if the server says the cursor is too old), then restarts the timer, and only then does the outbox replay."
    - "A poll's cost on a phone is the radio waking and staying in its high-power tail, not the bytes or an idle connection; 20 s polls cost about 29 per cent of a battery in a 7 h market day, 60 s about 10."
    - "A switch from Wi-Fi to cellular kills TCP connections, and the next request pays about 3 round trips of setup; QUIC can migrate."
    - "On Slow or Save-Data the app polls every 60 s, asks for small images, stops prefetching and lengthens read timeouts."
  terms:
    - term: cursor
      means: "The server's position in the order log as of the last answer; GET /api/orders?since=cursor returns only what changed."
    - term: radio tail
      means: The seconds a phone's cellular radio stays in its high-power state after the last packet, in case more data follows.
    - term: connection migration
      means: "QUIC's ability, under HTTP/3, to keep a connection when the phone's address changes, because connections are named by IDs."
    - term: Save-Data
      means: "The person's request for less data use, sent as the Save-Data: on header and readable as navigator.connection.saveData."
