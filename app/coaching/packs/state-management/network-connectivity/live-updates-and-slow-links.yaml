beats:
  - point: "OrderFeed polls GET /api/orders?since=cursor every 20 s, and stops its timer when the monitor leaves Online for Offline or the page is hidden, because polls that cannot succeed only pile up failures."
    kind: mechanism
    weight: core
    teach:
      - "Draw the outage as lanes over two minutes. The cell stops carrying data at 30 s and recovers at 150 s; navigator.onLine stays true throughout."
      - "The cursor is the server's position in the order log as of the last answer, so each poll returns only what changed. The poll at 40 s times out at 48, the monitor checks, the probe fails, and OrderFeed pauses."
      - "It also pauses when user 1 locks the phone or switches to the card reader's app. Hidden pages have their timers throttled anyway, to at least a second and in Chrome eventually to once a minute, so a hidden loop runs unpredictably rather than not at all."
    draw: [outage, lbl-cell, cell-4g, cell-dead, cell-back, lbl-mon, mon-online, mon-checking, mon-offline, lbl-feed, feed-polls, feed-paused]
    check: Why does OrderFeed stop its timer when the page is hidden, when the browser throttles hidden timers anyway?
    answer: "Throttled timers still fire, just unpredictably, waking the network for nothing; stopping makes the behaviour deliberate, and the catch-up on return fills the gap."
    misconceptions:
      - "Keep polling while offline so you notice the return -> the monitor's probes do that; failed polls only pile up errors."
  - point: "Resuming is a sequence: once Online is confirmed, OrderFeed first fetches everything since its cursor, then restarts the timer, and only then does the outbox replay, so queued writes meet the latest state."
    kind: flow
    weight: core
    teach:
      - "Finish the lanes. The link is back at 150 s, but the monitor only notices with its probe at 170 s. Then the catch-up since c812, possibly several pages, then the two queued sales replay, 201 each."
      - "Catching up first means a queued 'collected' is judged against an order's latest state, and user 1 sees the current list before their own changes land. If the cursor is too old for the server's log it answers 410 and OrderFeed reloads today's list in full."
      - "A WebSocket gets the same treatment, plus an application-level ping, because the page cannot send protocol pings."
    draw: [mon-back, feed-catchup, lbl-outbox, box-sale1, box-sale2, box-sent, then-replay, lbl-screen, scr-none, scr-banner, scr-sync]
    check: "When connectivity returns, why does OrderFeed catch up before the outbox replays?"
    answer: "So queued writes are checked against the orders' latest state, such as a cancellation made meanwhile, and the screen is current before user 1's changes are reconciled."
    misconceptions:
      - "Restart the poll timer and carry on -> orders placed during the outage would be missed; fetch since the cursor first."
  - point: "On a phone, a poll's real cost is the cellular radio waking to high power and staying in its tail for seconds after the last packet, so how often you poll sets the battery bill."
    kind: metric
    weight: core
    teach:
      - "An idle radio draws very little. To send anything it is promoted to a high-power state, and after the last packet it stays there for a tail in case more follows. LTE phones were measured at about 11.6 s at about 1 W (Huang et al.)."
      - "Draw two polls with their tails. Each poll is about 12.8 J. A 20 s poll keeps the radio in the tail more than half the time."
      - "Over a 7 hour market day that is 1,260 polls, about 16 kJ, some 29 per cent of a 4,000 mAh battery. Every 60 s is about 10. Newer networks often have shorter tails, so treat this as an upper bound."
    draw: [radio, poll-wake, tail, idle-gap, next-poll, tail-again, awake-note, sixty-note]
    check: "Polling every 60 s instead of every 20 s: roughly how does the radio energy change, and why?"
    answer: "About three times less, since each poll pays roughly the same wake-up and tail and there are a third as many; about 29 per cent of the battery becomes about 10."
  - point: "It is not the open connection or the header bytes that cost energy: an idle connection sends nothing and headers are small and compressed; it is how often the radio is woken."
    kind: rule
    weight: supporting
    teach:
      - "An idle TCP connection sends nothing, so the radio can sleep. Request headers are a few hundred bytes, and HTTP/2 and HTTP/3 compress repeated ones to a few bytes each."
      - "A socket heartbeat every 30 s pays the same tail per beat; it is cheaper than a 20 s poll only because it wakes the radio less often."
    draw: [idle-conn, headers-tiny]
    check: What mainly makes a 20-second poll expensive on a phone?
    answer: Waking the radio and holding it in its high-power tail after each request; not the headers and not keeping a connection open.
    misconceptions:
      - "Keeping a connection open drains the battery -> an idle connection sends nothing; wake-ups do."
  - point: "Switching from Wi-Fi to cellular gives the phone a new address and kills every TCP connection, so the next request pays DNS, TCP and TLS setup, about 3 round trips; QUIC under HTTP/3 can migrate instead."
    kind: failure
    weight: supporting
    teach:
      - "Handing over between cells usually keeps the address; changing networks does not. TCP connections are tied to the addresses at both ends."
      - "At 150 ms a round trip, setup is about 450 ms before the request's own round trip. QUIC names connections by IDs, so it can move to the new network without a new handshake."
    draw: [slow-and-switch, wifi-cell, tcp-dies, address-changes, new-conn, to-new-conn, quic, to-quic]
    check: "User 1 leaves the café Wi-Fi for cellular. What happens to Stallhand's open HTTP/2 connection?"
    answer: "It dies, because the phone's address changed; the next request pays for a new connection, about 3 round trips. HTTP/3 over QUIC could have migrated."
  - point: "When the status is Slow or saveData is on, Stallhand spends its bandwidth on what user 1 needs now: polls every 60 s, small thumbnails, no prefetch, and longer read timeouts so slow but working requests are not cut off."
    kind: decision
    weight: core
    teach:
      - "Draw the changes off the Slow box. Poll every 60 s not 20; 120 px thumbnails not 320; no prefetch of tomorrow's orders; stall photo uploads wait for a better link unless they ask."
      - "Read timeouts go from 8 to 15 s: cutting off a slow but working request and retrying it only adds load."
      - "The server sees the same preference without script: the browser sends Save-Data: on with every request, so image endpoints can pick smaller files."
    draw: [slow-box, poll-60, spend-less, thumbs, to-thumbs, read-15, to-reads, save-data-note]
    check: "On a Slow link, why does Stallhand lengthen its read timeout instead of keeping 8 s?"
    answer: "Requests still succeed, just slowly; an 8 s timeout would cut them off and retry them, adding load to a link that is already struggling."
    misconceptions:
      - "Shorter timeouts on slow links fail faster and help -> they abort requests that would have worked and pile on retries."
