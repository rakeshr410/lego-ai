# The idea: connectivity is a piece of state with five situations, one owner and a shape every screen reads.
id: state-management/network-connectivity/key-idea
title: Connectivity is state
source:
  hash: "7babbe6b2a2d"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - State has kinds and owners; a value many screens read is held in one place and subscribed to.
  carries:
    - "Networks do not fail cleanly: online, slow, flaky, offline, and connected but cut off are five different situations."
    - Every situation needs a decision for what the screen shows and what each action does (runs, queues, or is disabled with a reason).
    - Connectivity is one value, owned by one ConnectivityMonitor, that every screen reads.
    - "Its shape: status (online, slow, checking, offline), since, lastOkAt, a rolling RTT, saveData and pendingWrites."
    - A Checking status between Online and Offline keeps one failed request off the screen; lastOkAt is a time, so the screen can say how old its data is.
    - Connected but cut off looks exactly like offline to the app, so it shares Offline's behaviour and only the wording differs.
  terms:
    - term: connectivity state
      means: The one value that says how good the path to the server is right now, written by ConnectivityMonitor and read by every screen.
    - term: Checking
      means: The short status between Online and Offline while the app confirms that requests really stopped coming back.
    - term: lastOkAt
      means: The last time any response came back from Stallhand; the stale markers and the banner's wording come from it.
    - term: connected but cut off
      means: The device has a network, but requests never reach the server, as behind a Wi-Fi sign-in page or a firewall.
