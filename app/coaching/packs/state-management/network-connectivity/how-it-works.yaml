# Knowing the state: navigator.onLine and its events, real request outcomes, the ping probe, captive portals, probing on a backoff, and link quality with hysteresis.
id: state-management/network-connectivity/how-it-works
title: Knowing the connection
source:
  hash: "b7de319ddbdb"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: state-management/network-connectivity/key-idea
  assumes:
    - "Five situations: online, slow, flaky, offline, and connected but cut off."
    - "One ConnectivityMonitor owns the state (status online, slow, checking or offline; since; lastOkAt; rolling RTT; saveData; pendingWrites) and every screen reads it."
    - Checking sits between Online and Offline so one failed request does not change the screen.
  carries:
    - "navigator.onLine false is reliable and moves the monitor to Offline at once; true only means some interface is up, so the online event starts Checking."
    - "Any HTTP response, even a 404 or a 5xx, proves the path works; only a TypeError or a timeout counts against it, and two in a row start Checking."
    - "The probe, GET /api/ping with no-store and a 4 s timeout, must return 204 with a header only Stallhand sets, or the monitor says Offline."
    - Over HTTPS a captive portal makes fetch fail exactly like no network, so the app cannot tell them apart and the banner says both.
    - "While Offline the monitor probes after 2, 4, 8, 16 and then every 30 s, jittered; the online event, coming back into view and Retry probe at once."
    - "Link quality comes from the app's own rolling RTT: Slow above 1,000 ms, back to Online below 600 ms; the Network Information API is a Chromium-only extra."
  terms:
    - term: probe
      means: "A tiny request, GET /api/ping, sent only when in doubt, whose specific answer proves Stallhand itself replied."
    - term: captive portal
      means: A network that diverts requests to its own sign-in page until the person accepts its terms.
    - term: hysteresis
      means: Two thresholds, one to enter a state and a lower one to leave it, so a value near the line does not flip back and forth.
    - term: effectiveType
      means: "The Network Information API's rough class of link, slow-2g, 2g, 3g or 4g, from recent RTT and throughput; Chromium only."
