beats:
  - point: "navigator.onLine false is reliable, so the offline event moves the monitor to Offline at once; true only means some network interface is up, so the online event starts Checking, never Online."
    kind: mechanism
    weight: core
    teach:
      - "navigator.onLine is a boolean, and the window fires offline and online when it flips. false means no network at all: Wi-Fi off, airplane mode, no data. That is trustworthy."
      - true means only that an interface is up; in Chrome and Safari, that a local network or router is reachable. It says nothing about the internet, let alone Stallhand.
      - "In the crowded hall the phone stays attached to the cell, so onLine is true for the whole outage and no offline event fires. In the café the Wi-Fi counts as a network. A banner driven only by the offline event shows nothing in either case."
      - So the events are triggers, not verdicts. Draw the states as you name them.
    draw: [monitor-states, st-online, st-offline, ev-offline, at-once, st-checking, ev-online, starts-check]
    check: The online event fires as user 1's phone joins the café Wi-Fi. Why doesn't Stallhand go straight to Online?
    answer: "onLine true only means an interface is up, not that Stallhand is reachable; the event moves the monitor to Checking, and only a probe answered by Stallhand makes it Online."
    misconceptions:
      - "Listen for the offline event and show a banner -> in a crowded cell or behind a portal onLine stays true and the event never fires."
      - "navigator.onLine true means the internet works -> it only means some interface or router is reachable."
  - point: "The real evidence is the app's own traffic: any HTTP response, even a 404 or a 5xx, proves the path works, only a TypeError or a timeout counts against it, and two failures in a row start Checking."
    kind: rule
    weight: core
    teach:
      - Every request goes through the request layer, which reports its outcome to the monitor. A 200, a 404 or a 401 all came back across the network, so each updates lastOkAt and feeds the round-trip time into the average.
      - "A 5xx also proves the path: the server is unwell, which gets its own message, 'Stallhand is having trouble', not the offline banner."
      - Only fetch rejecting with a TypeError, no response at all, or a timeout counts against the connection. One can be noise on a mobile link, so it takes two in a row.
    draw: [two-failures, any-response]
    check: "A request to Stallhand returns 503. What does the monitor conclude about connectivity?"
    answer: "The path works, since a response came back; it updates lastOkAt and RTT. The server is having trouble, which is a different message, not Offline."
    misconceptions:
      - "Any error status means offline -> any response, even 5xx, proves the network path; only no response or a timeout counts."
      - "One failed request means offline -> it takes two in a row, then a probe, before the screen changes."
  - point: "In Checking the monitor sends a probe, GET /api/ping with cache no-store and a 4 s timeout, and only a 204 carrying a header only Stallhand sets means Online; anything else means Offline."
    kind: mechanism
    weight: core
    teach:
      - "no-store so no cache can answer for the server; 4 seconds because the probe is tiny and an answer that slow is no answer."
      - "The answer must be 204 with x-stallhand set to 1. A network that answers on the server's behalf, a proxy's error page or a portal over plain HTTP, then counts as a failure."
      - Draw the probe between Checking and the two ways out.
    draw: [st-probe, sends-probe, probe-ok, probe-fails]
    check: Why does the probe insist on a 204 with an x-stallhand header instead of accepting any 2xx?
    answer: "So a reply from something other than Stallhand, a proxy or a portal on plain HTTP, cannot make the app believe it is online; only Stallhand sets that status and header."
  - point: "Over HTTPS a Wi-Fi sign-in page cannot impersonate Stallhand: the TLS handshake fails and fetch rejects like no network at all, so the app cannot tell the two apart and the banner says both."
    kind: failure
    weight: core
    teach:
      - "Draw the request path in the café. The phone sends an HTTPS request, the café Wi-Fi diverts it to its sign-in page, and Stallhand is never reached."
      - "Over plain HTTP the portal would answer 200 with its own page, which is why the probe checks the header. Over HTTPS, all Stallhand uses, the portal cannot present Stallhand's certificate, so TLS fails and fetch throws a TypeError."
      - "Operating systems spot portals with their own plain-HTTP probes; a web app usually cannot. So the banner adds: if you are on public Wi-Fi, you may need to sign in."
    draw: [portal-path, phone, cafe-wifi, https-request, signin-page, diverted, api-unreached, never-reached, tls-fails, to-tls, plain-200, to-plain, wording-note]
    check: "Behind the café's sign-in page, what does Stallhand's HTTPS probe actually see, and what does the banner say?"
    answer: "A TypeError, because the TLS handshake fails, exactly as with no network; the monitor stays Offline and the banner suggests signing in to public Wi-Fi rather than claiming to know."
    misconceptions:
      - "The app can detect the portal and say so for sure -> over HTTPS it only sees a network error, the same as no signal."
  - point: "While Offline the monitor keeps probing on a backoff, after 2, 4, 8 and 16 seconds and then every 30, each jittered; the online event, the app coming back into view and the Retry button probe at once."
    kind: flow
    weight: core
    teach:
      - Draw the failed probes on a line with growing gaps. Each wait doubles up to a 30 second cap, and each is randomised a little.
      - "Three things skip the wait: the online event, the page becoming visible again, and user 1 tapping Retry on the banner. Without them, a phone that got signal back one second into a 30 second wait would sit offline 29 seconds longer than it needs to."
    draw: [retry-timer, probe-backoff, p0, p2, wait-2, p6, wait-4, p14, wait-8, p30, wait-16, doubling, trigger, probe-now, skip-wait]
    check: "The monitor has been Offline for a minute and is waiting 30 s for its next probe. User 1 unlocks their phone. What happens?"
    answer: "Becoming visible triggers a probe at once instead of waiting out the timer; a 204 with the header brings it back to Online."
    misconceptions:
      - "Probe every second while offline -> that wastes battery and requests; back off, and let the events and Retry cut the wait."
  - point: "Working is not usable: the app measures link quality from its own rolling average of the last 10 round trips, Slow above 1,000 ms and back to Online only below 600 ms; the Network Information API is a Chromium-only extra."
    kind: metric
    weight: core
    teach:
      - "Chromium exposes navigator.connection: effectiveType slow-2g, 2g, 3g or 4g, from recent round-trip time and throughput, not the radio, so a link over 270 ms reads 3g even on a 5G phone. rtt and downlink are rounded, saveData mirrors the person's choice. Safari and Firefox lack it."
      - So Stallhand times its own requests and keeps a rolling average of the last 10. Above 1,000 ms the status becomes Slow; it returns to Online only below 600 ms.
      - "The gap is hysteresis. With one threshold, an average wandering around a second would flip the label every few requests, and image sizes and the poll rate would flap with it."
    draw: [st-slow, slow-online, link-quality, last-ten, band-slow, band-hold, band-online, averaged, net-info, five-g, no-flap]
    check: "The rolling RTT wanders between 700 and 1,100 ms. Why use 1,000 ms to enter Slow but 600 ms to leave it?"
    answer: "So the status, and everything that reacts to it, does not flap on a link near one threshold; between 600 and 1,000 ms it keeps whatever it was."
    misconceptions:
      - "effectiveType 4g means a fast link everywhere -> it is Chromium only, rounded, and describes recent traffic, so measure your own requests."
task:
  prompt: "Draw ConnectivityMonitor's states and what moves it between them: the two browser events, two failed requests, the probe and its answer, the retry timer, and the round-trip average that separates Slow from Online."
  expects: [1, 2, 3, 5, 6]
