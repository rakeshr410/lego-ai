beats:
  - point: Each format has a job, AVIF and WebP for photos, JPEG as the fallback every browser reads, PNG for screenshots and UI with hard edges, SVG for icons and logos, and video instead of GIF.
    kind: decision
    weight: core
    teach:
      - Go through Saltbox's images. Photos want AVIF, the smallest of the raster formats, with WebP when AVIF is not available and JPEG as the universal fallback; AVIF is slow to encode and never renders progressively.
      - PNG is lossless, so it suits screenshots, diagrams and UI with text and hard edges, never photos. SVG is shapes, not pixels, sharp at any size and often a few hundred bytes.
      - GIF has nothing new to offer, animations go in video and stills in PNG or WebP. JPEG XL is only in Safari for now, worth watching, not a primary format.
    draw: [formats, fmt-avif, fmt-webp, fmt-jpeg, fmt-png, fmt-svg, fmt-gif, avif-note, jxl-note]
    check: Which format suits Saltbox's step photos, which its logo, and which a screenshot of the recipe editor?
    answer: AVIF (with WebP and JPEG fallbacks) for the photos, SVG for the logo, and PNG for the screenshot with its text and hard edges.
    misconceptions:
      - "PNG is the high-quality choice for photos -> PNG is lossless and makes photos huge; it is for hard edges and UI."
  - point: A lossy encoder keeps brightness sharp and stores colour at lower resolution, then describes each block as smooth patterns whose weights the quality setting rounds.
    kind: mechanism
    weight: core
    teach:
      - Pixels are split into brightness and two colour-difference channels. The eye resolves detail in brightness far better than in colour, so 4:2:0 keeps one colour sample per 2 × 2 block, 6 numbers instead of 12, before any real compression.
      - Then each block is written as a sum of smooth patterns, and quality decides how coarsely the weights are rounded; heavy rounding smears texture and in JPEG shows the block seams. WebP and AVIF predict a block from its neighbours and encode the difference, which is why they win on photos and why AVIF encodes slowly.
      - Quality numbers do not translate between formats or encoders. Pick each setting by encoding sample photos and looking at them on the readers' devices.
    draw: [lossy, px-block, s-444, s-420, full-colour, shared-colour, luma-note, quality-note]
    check: How many samples does 4:2:0 keep for one 2 × 2 block of pixels, and why is that usually invisible in a photo?
    answer: Six instead of twelve, all four brightness samples and one of each colour difference; the eye sees fine detail in brightness much better than in colour.
    misconceptions:
      - "Quality 75 means the same in every format -> each format and encoder has its own scale; compare by looking at the output."
  - point: With a picture element the formats are in the markup, and the browser skips every source whose type it cannot decode, without fetching it, and takes the first one it can.
    kind: mechanism
    weight: core
    teach:
      - A browser that cannot parse a format draws nothing, so a site serving AVIF needs a fallback.
      - Saltbox lists an AVIF source, then WebP, then an img with a JPEG src. The browser reads top to bottom, skips types it does not support without a request, and uses the first that fits; with none it falls back to the img.
      - The img is not just the fallback. It is the element that is laid out, styled and carries the alt text; the chosen source is drawn in its box. Each format has its own URL, so caches need no extra rules.
    draw: [picking, src-avif, src-webp, img-jpeg, skip-avif, fall-to-img, first-wins]
    check: A browser decodes WebP but not AVIF. What does it download from that picture element?
    answer: Only the WebP; it rules out the AVIF source by its type before any request, and the JPEG src is used only when no source fits.
    misconceptions:
      - "The browser tries the AVIF and falls back when it fails -> the type attribute lets it skip the source without downloading it."
  - point: With negotiation one URL serves every browser, the server picks the format from the Accept header, and the response must carry Vary Accept so a shared cache never hands one browser's format to another.
    kind: mechanism
    weight: core
    teach:
      - Option two keeps one URL. The browser's Accept header says which image types it decodes, and the server or image CDN chooses; the .jpg in the URL means nothing, Content-Type says what the bytes are.
      - Vary Accept tells every cache that the body depends on Accept. Without it, whichever format was cached first is served to everyone.
      - Preference is in q-values, not order. Safari lists webp before avif with equal weights, so the server may send the smaller AVIF.
    draw: [accept, server-picks, vary, sent-with, answers-with, q-values]
    check: An image CDN negotiates the format from Accept but forgets Vary. What can go wrong?
    answer: A shared cache treats the URL as having one answer, so it can store the AVIF and hand it to a browser that cannot decode AVIF.
    misconceptions:
      - "The first type in Accept is the browser's favourite -> preference is given by q-values; equal weights leave the choice to the server."
  - point: An image CDN keeps one master per photo and derives each width, format and quality from parameters in the URL, so the first request transforms and every later one is a cache hit.
    kind: component
    weight: core
    teach:
      - Saltbox has tens of thousands of photos and new uploads every minute, too many to pre-render. Each URL carries w, f, q and a version v.
      - The first request for a combination misses at the edge; the transformer fetches the 2.9 MB master, resizes and encodes it. After that the same URL is an ordinary hit.
      - Because the URL names the output fully it is cached for a year as immutable, and a replaced photo gets a new v rather than a purge. Masters stay private and the transformer only accepts an allow-list of widths and qualities.
    draw: [image-cdn, cdn-url, edge-cache, transformer, master, get-url, on-miss, fetch-master, cdn-hit, cdn-version]
    check: An editor replaces a step photo. How does every cached variant get replaced without a purge?
    answer: The master's version parameter is bumped, so every variant gets a new URL; the old ones simply stop being requested.
  - point: Compression only helps on the wire; to paint, every image becomes a bitmap of about 4 bytes per pixel, so memory and decode time follow the pixel count, not the file size.
    kind: rule
    weight: core
    teach:
      - The butter-folding photo at 800 × 533 is 46 KB as AVIF and 620 KB as PNG, and both decode to the same 1.7 MB bitmap. A 4032 × 3024 phone original becomes about 48.8 MB, which is why a page must never hand the browser a camera original to shrink.
      - Decoding is CPU work proportional to pixels, and newer codecs spend more per pixel. On a low-end phone an oversized photo can leave an empty box after its bytes have arrived.
      - img.decode() resolves once the image can paint without a blank frame, so script can wait before swapping pictures; the decoding attribute is only a hint.
    draw: [pixels, file-avif, file-png, bitmap, decode-avif, decode-png, phone-original, decode-note]
    check: The photo is 46 KB as AVIF and 92 KB as JPEG, both 800 × 533. How do their decoded bitmaps compare?
    answer: The same, about 1.7 MB each, 4 bytes for each of the 426,400 pixels; decoded memory depends only on width × height.
    misconceptions:
      - "A smaller file uses less memory on the page -> once decoded, every format costs about 4 bytes per pixel."
task:
  prompt: Draw the two ways a browser ends up with a format it can decode, a picture element with type sources and one URL negotiated from Accept, and mark the header the negotiated response must carry.
  expects: [3, 4]
