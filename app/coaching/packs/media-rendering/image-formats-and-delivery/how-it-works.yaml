# Image formats and delivery: what each format is for, what a lossy encoder drops, picture sources versus Accept negotiation, an image CDN, and the decoded bitmap.
id: media-rendering/image-formats-and-delivery/how-it-works
title: Formats, compression and image CDNs
source:
  hash: 5161defdc5d5
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "Each format has a job: AVIF and WebP for photos, JPEG as the universal fallback, PNG for hard edges, SVG for icons, video instead of GIF."
    - A lossy encoder stores colour at lower resolution than brightness and rounds each block's pattern weights; quality numbers do not compare across formats.
    - A picture element lists formats by type and the browser takes the first it can decode without fetching the others.
    - "Negotiation keeps one URL, the server picks the format from Accept, and the response must say Vary: Accept."
    - An image CDN derives every width, format and quality from one master, named fully by the URL and cached for a year.
    - A decoded image costs about 4 bytes per pixel whatever its file format, so pixel count, not file size, sets memory and decode time.
  terms:
    - term: lossy
      means: Compression that throws away detail the eye is unlikely to miss, to make the file smaller.
    - term: chroma subsampling
      means: Keeping colour samples at a lower resolution than brightness; 4:2:0 shares one colour sample per 2 × 2 pixels.
    - term: content negotiation
      means: The client says in Accept what it can take and the server chooses which form of the resource to send.
    - term: "Vary: Accept"
      means: A response header telling caches the body depends on the request's Accept header.
    - term: master
      means: The one full-size original of a photo that an image CDN derives every variant from.
    - term: decoded bitmap
      means: The image as pixels in memory, about 4 bytes each for red, green, blue and alpha.
