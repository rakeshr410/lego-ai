# Lazy loading and placeholders: the loading attribute and why the hero stays eager, fetchpriority on the hero, an IntersectionObserver with a lead distance, and the slot a placeholder holds.
id: media-rendering/lazy-loading-and-placeholders/how-it-works
title: Lazy loading and placeholders
source:
  hash: a8786d37b46a
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: media-rendering/image-formats-and-delivery/how-it-works
  assumes:
    - fetchpriority changes a request's rank, not when it is found.
    - A decoded image costs about 4 bytes per pixel whatever its file format, and img.decode() waits until it can paint.
  carries:
    - loading=lazy holds an image's request until it is near the viewport, at a distance the browser chooses.
    - A lazy image cannot be requested until CSS and layout have run, so the hero, the LCP image, stays eager.
    - Eager is not early; the hero also wants fetchpriority high.
    - An IntersectionObserver with a rootMargin lets the page choose the distance, which should be scroll speed times fetch time.
    - A placeholder starts with a reserved box from width and height, so swapping in the photo is a repaint, not a layout.
  terms:
    - term: lazy loading
      means: Holding an image or iframe request until the element is close to the viewport.
    - term: lazy load scroll margin
      means: How far outside the viewport a lazy element starts loading; the browser chooses it.
    - term: rootMargin
      means: An IntersectionObserver option that grows the root's box like a CSS margin, the page's own prefetch distance.
    - term: lead distance
      means: How far ahead a request must start, scroll speed times the time to fetch and decode one photo.
    - term: placeholder
      means: What fills an image's reserved box until the photo is ready, from a grey shape to a blurred miniature.
