beats:
  - point: loading=lazy holds an image's request until the element is close to the viewport, at a distance each browser chooses, while eager, the default, fetches as soon as the image is found.
    kind: mechanism
    weight: core
    teach:
      - On a Saltbox recipe the hero is at the top and ten step photos run far below it. A missing or misspelled loading value means eager, fetched the moment the browser finds it; lazy waits until the image nears the viewport.
      - How near is left to the browser. Chromium uses 1,250 px below the viewport on 4G and 2,500 px on 3G or slower; Firefox and Safari pick their own.
      - So once layout has run, steps one and two, inside the margin, are requested; steps three to ten wait until the reader scrolls them into the margin.
    draw: [recipe-page, viewport-frame, hero-img, margin-frame, steps-near, steps-far, margin-note]
    check: Who decides how far from the viewport a lazy image starts loading?
    answer: The browser; the standard leaves the distance implementation-defined, and Chromium uses 1,250 px on 4G and 2,500 px on slower connections.
  - point: A lazy image cannot be requested when the preload scanner finds it, only once CSS has arrived and layout has placed it, so the hero, the LCP image, must never be lazy.
    kind: rule
    weight: core
    teach:
      - An eager img can be requested the moment the preload scanner sees it in the HTML, before any CSS. A lazy one cannot, because its distance from the viewport is only known after layout, and layout waits for the stylesheets.
      - That lost head start costs nothing for step seven and a lot for the hero. A lazy hero sitting in the first viewport still waits for CSS and layout.
      - Lazy is for images below the fold; the hero stays eager.
    draw: [request-starts, scanner-finds, css-layout, waits-for, eager-get, eager-path, lazy-get, lazy-path, lazy-hero-note]
    check: Why does a lazy img in the first viewport load later than an eager one?
    answer: The browser needs CSS and layout before it knows the lazy image is near the viewport, so its request cannot start at discovery as an eager one's can.
    misconceptions:
      - "Lazy-load every image, the hero too -> a lazy hero waits for CSS and layout; lazy is for images below the fold, never the LCP image."
      - "An image already in view loads at once even when lazy -> it still waits for layout before it is requested."
  - point: Eager is not the same as early, so the hero also gets fetchpriority high to start at high priority the moment it is found instead of waiting for layout to raise it.
    kind: rule
    weight: core
    teach:
      - Chrome starts ordinary images low and raises the ones layout shows in view; the first five large images start at medium.
      - fetchpriority high on the hero skips that guess. It is a hint, and it does nothing for an image the browser cannot see in the HTML.
    check: Saltbox's hero is a plain eager img. What does adding fetchpriority high change?
    answer: It starts at high priority from discovery instead of low or medium, without waiting for layout to raise it.
  - point: Native lazy loading has edges, with scripts off or when printing every image loads, CSS background images are not covered, and iframes can be lazy too.
    kind: rule
    weight: supporting
    teach:
      - With JavaScript disabled lazy is ignored, because deferring requests could let a page track scrolling. Printing fetches every lazy image so the printout is complete.
      - A background image in a stylesheet has no loading attribute; deferring it needs an observer that adds a class. An embedded map far down the page can be lazy, like an image.
    draw: [js-off-note, bg-note, map-iframe]
    check: What happens to loading=lazy when JavaScript is disabled, and why?
    answer: It is ignored and the images load eagerly, because otherwise the timing of image requests could reveal the reader's scroll position.
  - point: When the browser's margin is not the right one, an IntersectionObserver with a rootMargin lets the page choose, and the distance should be the reader's scroll speed times the time to fetch and decode a photo.
    kind: mechanism
    weight: core
    teach:
      - Saltbox's feed tiles render with the real URL in data-src. An IntersectionObserver whose rootMargin grows the viewport downward calls back when a tile enters the grown box; the code sets src and unobserves the tile.
      - The browser computes intersections during its own rendering work and calls back later as a task, so a hundred tiles need no scroll listeners and no forced layouts.
      - Read rootMargin as lead distance. A 3,000 px per second fling and a 600 ms fetch need 1,800 px; a 200 px margin shows blank tiles on any real fling.
    draw: [observer, tile, grown-root, enters, set-src, callback, lead-sum]
    check: A reader flings at 3,000 px per second and a photo takes about 500 ms to fetch and decode. Roughly what rootMargin keeps the tiles from showing only placeholders?
    answer: About 1,500 px, speed times fetch time, 3,000 × 0.5.
    misconceptions:
      - "A 200 px margin is plenty -> a real fling covers thousands of pixels a second, so 200 px leaves blank tiles."
  - point: A placeholder starts with a reserved box from the photo's width and height, so the photo swaps in as a repaint, not a layout, and what fills the box is bytes traded against fidelity.
    kind: mechanism
    weight: core
    teach:
      - The img needs width and height attributes or a CSS aspect-ratio; for reader uploads the API must send each photo's width and height with its URL, or nothing can be reserved.
      - Fill it with a skeleton for no bytes, a dominant colour for about seven, a BlurHash for 20 to 30, or a tiny inline preview for a few hundred.
      - Set src, wait for img.decode(), then fade the photo in over the blur. Since Chrome 112 a blurry, low-information preview is not counted as the LCP element, so the real photo still has to arrive.
    draw: [slot, slot-reserved, slot-preview, preview-ready, slot-requested, enters-margin, slot-shown, decoded, slot-failed, rejects, bytes-note, repaint-note]
    check: A blurred preview later sharpens into the photo. What keeps that swap from shifting the layout?
    answer: Both fill the same box, reserved in advance from the photo's width and height or aspect ratio, so the swap is only a repaint.
    misconceptions:
      - "A blurred preview improves LCP -> a low-entropy preview is not counted as the LCP element; the real photo still has to arrive."
      - "The fade-in hides the shift -> only a reserved box of the right shape prevents it."
