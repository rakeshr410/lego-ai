beats:
  - point: Compression shrinks only the bytes on the wire; the engine parses the unpacked text, so Tallybook's main.js costs 360 KB of transfer but 1,320 KB of parsing.
    kind: metric
    weight: core
    teach:
      - Tallybook's main.js travels as 360 KB with Brotli or 410 KB with gzip. Brotli saves 50 KB, about a quarter of a second at 200 KB a second.
      - But the parser reads the unpacked file, 1,320 KB either way. Compression helps only the download.
      - Minifying is different. It removes whitespace, comments and long names the engine would otherwise scan, so unminified the parser would face about 2,100 KB.
    draw: [bytes, brotli, gzip, parsed, unpacked-br, unpacked-gz, unminified, minify-rule]
    check: Tallybook switches from gzip to Brotli and main.js shrinks from 410 KB to 360 KB on the wire. How much less does the engine have to parse?
    answer: Nothing; the parser works on the unpacked 1,320 KB either way. Only minifying or shipping less code reduces parsing.
    misconceptions:
      - "A 360 KB script costs the same as a 360 KB image -> the script unpacks to 1,320 KB that must be parsed, compiled and run on the phone's processor."
      - "Better compression makes parsing faster -> compression only changes the transfer; the parser always reads the unpacked text."
  - point: A script loaded from a URL is parsed and compiled on a background thread as it streams in, but functions not needed at load are only preparsed and get compiled on the main thread the first time they are called.
    kind: mechanism
    weight: core
    teach:
      - V8 starts reading before the last byte arrives. A src script is parsed and compiled on a background thread while it streams, so on a slow network much of that hides behind the download. An inline script gets no such head start; it is parsed on the main thread.
      - Most functions are not called at startup, so V8 preparses them, checks syntax and skips the body. On the first call the full compile happens right then, on the main thread, in the middle of whatever was running.
      - That is why a profile of Tallybook's start shows compile slices sprinkled through execution, and why code that is never called still costs a download and a scan.
    draw: [engine, eng-bg, bg-thread, eng-main, main-thread, bytecode, preparse, first-call, called, inline-rule]
    check: A function in main.js is never called during startup. What does it cost at load?
    answer: Its download and a quick preparse to skip over it; it is fully compiled, on the main thread, only if it is ever called.
    misconceptions:
      - "Code that is never called is free -> it is still downloaded and scanned by the preparser."
      - "All parsing happens off the main thread -> streamed src scripts compile in the background, but inline scripts and first calls of lazy functions compile on the main thread."
  - point: The code cache lets a repeat visit skip compiling, a second visit within 72 hours stores the compiled code and a third reuses it, but it is tied to one URL, and executing the startup code is paid on every visit.
    kind: mechanism
    weight: core
    teach:
      - User 1's Monday visit is cold, everything downloaded and compiled, usable at 3.15 s, and only the file is cached. Tuesday, within 72 hours, it compiles again and stores the compiled functions beside the file.
      - Wednesday is hot. The file comes from disk, the code is loaded instead of rebuilt, and the dashboard is usable at 1.24 s.
      - What no cache removes is execution, about 1.1 s of running module top levels, starting the framework and rendering. That is the floor.
      - A deploy that renames main.js is a new URL, so there is no cache entry and no code cache, and user 1 pays a cold run again even if most of the code is unchanged.
    draw: [visits, cold, warm, second-visit, hot, third-visit, exec-floor, new-url]
    check: On a hot visit with the file and its compiled code cached, what is still paid in full, and what happens the day Tallybook ships a new hashed main.js?
    answer: Executing the startup code is still paid in full; a new hashed name is a new URL, so the HTTP cache entry and code cache are gone and the visit is cold again.
    misconceptions:
      - "A cached script costs nothing -> caching removes the download and most compiling, but the startup code still runs every visit."
  - point: Download time is set by the network but parse, compile and execution are set by the processor, so the same file costs a low-end phone over six times the processor time it costs a high-end one.
    kind: metric
    weight: core
    teach:
      - On one 200 KB a second connection the download is 1.8 s on every phone. Parsing, compiling and running take 0.45 s on a high-end phone and 2.8 s on a low-end one.
      - Budget phones have slower and fewer fast cores, smaller caches and less memory, and they throttle sooner when hot. They are 40% of Tallybook's sessions.
      - So profile on a real mid-range or budget phone, or with the CPU throttled, and read field data split by device class rather than one average.
    draw: [flagship, flagship-cpu, budget-phone, budget-cpu]
    check: Why does the same main.js take far longer to become usable on a low-end phone when the download time is identical?
    answer: Parse, compile and execution run on the phone's processor, which is several times slower on a budget phone; only the download depends on the network.
    misconceptions:
      - "Testing on a developer laptop shows what users get -> a laptop hides most of the processor bill; profile on a real budget phone or with CPU throttling."
  - point: Tree shaking can drop unused code only when imports are static ES modules and the code does nothing on import, or the package says which parts do.
    kind: rule
    weight: core
    teach:
      - The bundler reads the import graph before anything runs. ES import and export sit at the top level with fixed names, so it can see which exports are used and drop the rest.
      - CommonJS hides that. require can take a computed path or sit in an if, and module.exports can change at run time, so the whole module is kept.
      - Dropping must also be safe. A module that registers a locale or patches a prototype on import is kept unless the package sets sideEffects in package.json, or a call is marked with a PURE comment.
    draw: [shaking, shake-drop, esm, shake-keep, cjs, side-effects, pure, shake-needs]
    check: Tallybook imports one helper from a utility package that ships only CommonJS and registers its locales on import. Why does the whole package end up in main.js?
    answer: The bundler cannot see statically which exports are used in CommonJS, and it must keep code that runs on import, so neither condition for tree shaking holds.
    misconceptions:
      - "Named imports always tree-shake -> only from ES modules whose code is safe to drop; CommonJS and import-time side effects keep the module."
  - point: V8 can be told to compile eagerly code that is known to run at load, but the hint wastes time and memory on anything else.
    kind: rule
    weight: supporting
    teach:
      - Wrapping a function expression in parentheses makes V8 compile it eagerly, and from Chrome 136 a file that starts with the allFunctionsCalledOnLoad comment is compiled eagerly in the background.
      - Use it only for small startup files where every function runs. Later, hot functions are recompiled by faster tiers, but startup gets almost none of that benefit.
    draw: [eager-hint]
