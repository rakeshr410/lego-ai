# What a byte of JavaScript costs: compressed vs parsed size, streaming and lazy compilation, the code cache across visits, device spread, and what tree shaking can remove.
id: javascript-performance/bundle-cost/how-it-works
title: What a byte of JavaScript costs
source:
  hash: 9eaca79dbc67
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - Compression shrinks only the transfer; the engine parses the unpacked text, so minifying and shipping less are what cut parse work.
    - A script from a src URL is parsed and compiled on a background thread as it streams; running it, and compiling lazily called functions, happen on the main thread.
    - Functions not needed at load are only preparsed, then compiled on the main thread the first time they are called.
    - The code cache lets a third visit skip compiling, but it is tied to one URL, and executing the startup code is paid every visit.
    - The same bundle costs a low-end phone several times the processor time of a high-end one.
    - Tree shaking needs static ES module imports and code that does nothing on import, or says which parts do.
  terms:
    - term: preparse
      means: A quick pass that checks a function's syntax and skips its body; the full compile waits until the first call.
    - term: code cache
      means: Compiled code the browser stores beside a script's HTTP cache entry so a later visit can skip compiling.
    - term: tree shaking
      means: The bundler dropping exports no one imports, by reading the static import graph before anything runs.
    - term: side effect
      means: Work a module does just by being imported, such as registering a locale or patching a prototype.
