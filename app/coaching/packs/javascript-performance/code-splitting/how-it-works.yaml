# How code splitting works: import() as the split point, the chunks a bundler writes, React's lazy, the request chain a nested chunk creates, head starts, and names that survive a deploy.
id: javascript-performance/code-splitting/how-it-works
title: Code splitting and loading on demand
source:
  hash: bfbe15b3cb12
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: javascript-performance/bundle-cost/how-it-works
  assumes:
    - Compression shrinks only the transfer; the engine parses the unpacked text, so minifying and shipping less are what cut parse work.
    - The code cache lets a third visit skip compiling, but it is tied to one URL, and executing the startup code is paid every visit.
    - Tree shaking needs static ES module imports and code that does nothing on import, or says which parts do.
  carries:
    - import() is an expression that returns a promise of the module; the bundler turns each literal import() into its own chunk.
    - A module is evaluated once per page; later import() calls reuse it without a request.
    - Modules needed on both sides of a split go into the entry chunk or a shared chunk.
    - A chunk whose dependencies are discovered only after it is parsed adds a round trip; bundlers flatten that, nested lazy imports they cannot.
    - Prefetching or modulepreloading on a signal of intent moves the fetch, and with modulepreload the compile, ahead of the tap.
    - Content-hashed chunk names cached for a year mean a release re-fetches only the chunks that changed.
  terms:
    - term: split point
      means: An import() call with a literal path; the bundler starts a new chunk there.
    - term: chunk
      means: One JavaScript file the bundler writes, named after a hash of its content, such as insights-81c2.js.
    - term: entry chunk
      means: The chunk the HTML loads at startup, holding what the first screen needs.
    - term: request chain
      means: Files discovered one after another, each only once the previous one is parsed, so their round trips add up in series.
