# ResizeObserver: the four ways to react to size, the boxes and the entry, delivery after layout and before paint with the depth rule and the loop error, the panel toolbar with hysteresis, canvas sizing, and the flapping tile.
id: dom-and-virtual-dom/observers/resize-observer
title: Watching sizes
source:
  hash: "920629b8eac0"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: dom-and-virtual-dom/observers/mutation-observer
  assumes:
    - ResizeObserver reports changes to an element's box size; one observer takes many targets and calls back with an array of entries.
    - A ResizeObserver callback runs after style and layout and before paint, so what it writes is painted in the same frame.
    - A callback that writes into what it observes can keep calling itself.
  carries:
    - Prefer a media or container query when the change is only visual; use ResizeObserver when script needs the number.
    - "observe takes a box: content-box (the default), border-box, or device-pixel-content-box; the entry's sizes are arrays of inline and block size."
    - After each delivery layout runs again and only deeper targets are delivered in the same frame; a change at the same depth or above waits a frame and fires the loop error.
    - Thresholds need a hysteresis band and writes only on a change, or a nudge such as a scrollbar flips the mode back and forth.
    - A ResizeObserver callback must be idempotent and must never change the size it reads.
  terms:
    - term: content box
      means: The area inside padding and border; what ResizeObserver measures by default.
    - term: border box
      means: Content plus padding plus border.
    - term: inline size
      means: The size along the direction text runs; the width in horizontal writing, the height in vertical writing.
    - term: depth rule
      means: Within one frame, each round of delivery only reports targets deeper in the tree than the shallowest one just reported.
    - term: loop error
      means: "The window error event 'ResizeObserver loop completed with undelivered notifications', fired when a size change is left for the next frame."
    - term: hysteresis
      means: Using two thresholds, one to switch and another to switch back, so a small nudge cannot flip the state back.
