# Observers in practice: choosing the tool by the question, IntersectionObserver in brief, one shared observer per kind with cleanup, and the habits an interview answer names.
id: dom-and-virtual-dom/observers/in-practice
title: Choosing and sharing observers
source:
  hash: "b58547f08e2b"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: dom-and-virtual-dom/observers/resize-observer
  assumes:
    - "All three observers share one shape: a callback, observe per target, an array of entries, unobserve or disconnect."
    - MutationObserver reports tree changes in a microtask after the script; its cost is the records it causes.
    - ResizeObserver reports element sizes after layout and before paint; a callback must write only on a change and never change the size it reads.
    - Container queries restyle a component from its container's size with no script.
  carries:
    - Pick the tool by the question; CSS first when the change is only visual, then the observer that answers exactly what the code needs.
    - IntersectionObserver takes root, rootMargin and threshold in its constructor and reports threshold crossings, not continuous scroll positions.
    - One observer per kind and configuration, shared through a map from element to handler; unobserve on unmount and disconnect on teardown.
  terms:
    - term: rootMargin
      means: How much an IntersectionObserver grows or shrinks its root before testing intersection, which gives a look-ahead.
    - term: threshold
      means: The fraction, or list of fractions, of a target that must be visible for a change to be reported.
    - term: shared observer
      means: One observer for every component of a kind, with a map from element to that component's handler.
