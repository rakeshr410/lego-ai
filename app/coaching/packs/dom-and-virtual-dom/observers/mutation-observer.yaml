# MutationObserver: the options and how they combine, what a record carries, delivery in one microtask, the heading shortcut, the late support launcher, the self-write loop, and what subtree costs.
id: dom-and-virtual-dom/observers/mutation-observer
title: Watching the tree
source:
  hash: "10035e0df9a5"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: dom-and-virtual-dom/observers/key-idea
  assumes:
    - An observer is registered once and the browser calls it with a batch of entries; one observer takes many targets.
    - MutationObserver reports changes to the DOM tree itself.
    - A MutationObserver callback runs in a microtask after the script that changed the DOM, before rendering.
  carries:
    - childList, attributes and characterData choose the kinds of change; subtree extends them to every descendant; at least one of the three must end up true or observe throws.
    - "A record carries type, target, added and removed nodes, attributeName and oldValue; for characterData the target is the Text node itself."
    - Records are queued as each change happens and delivered together in one microtask after the script, never during it.
    - A callback that writes into what it observes queues itself again in the same checkpoint and freezes the tab.
    - The cost of an observer is roughly the records it causes, so observe the smallest root with the fewest options.
  terms:
    - term: MutationRecord
      means: One change to the tree, as delivered to the callback; records are a log in order, not a diff of the end state.
    - term: subtree
      means: The option that applies the other options to every descendant of the target, not only the target itself.
    - term: characterData
      means: The data of a Text or Comment node; typing usually edits a Text node in place.
    - term: takeRecords
      means: Returns the records queued but not yet delivered, and empties the queue.
