# Observers' idea: why polling and per-event measuring were replaced, the three observers, their shared shape, and where each one's callback lands in a frame.
id: dom-and-virtual-dom/observers/key-idea
title: Let the browser tell you
source:
  hash: "a35512be8171"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - The DOM is a live tree of objects that scripts change, and the browser draws the page from it.
    - Writes to the DOM are deferred to the next frame, but reading a size or position brings layout up to date at once.
  carries:
    - Polling and measuring in scroll or resize handlers run on the main thread whether or not anything changed, can force layout, and lag by up to the polling interval.
    - An observer is a standing question registered once; the browser, which already knows what it inserted and what layout computed, answers in batches.
    - MutationObserver reports changes to the tree, ResizeObserver changes to an element's box size, IntersectionObserver an element crossing into or out of a root.
    - "All three share one shape: a constructor taking a callback, observe per target, a callback that receives an array of entries, and disconnect."
    - MutationObserver delivers in a microtask after the changing script; ResizeObserver after style and layout, before paint; IntersectionObserver as a task after the rendering steps.
  terms:
    - term: polling
      means: Asking on a timer whether something changed, whether or not it did.
    - term: observer
      means: An object holding a callback and a list of targets, which the browser calls with a batch of entries when something it watches changes.
    - term: entry
      means: One item in the array a callback receives, about one target (a MutationRecord is MutationObserver's kind of entry).
    - term: microtask
      means: A job run as soon as the current script ends, before the browser does anything else, rendering included.
