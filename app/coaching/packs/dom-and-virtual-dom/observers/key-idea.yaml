beats:
  - point: Before observers, Ledgerleaf polled six panel widths every 100 ms and measured every chart in a scroll handler, main-thread work that ran whether or not anything changed, could force a layout, and was still up to 100 ms late.
    kind: failure
    weight: core
    teach:
      - Ledgerleaf's Q3 churn review page needs three facts no event reports. How wide each chart panel is, to switch its seven-button toolbar to icons. When a chart comes near the screen, to fetch its data. And when user 1 types a hash and a space at the start of a block, whatever produced the text.
      - The first version asked. A 100 ms timer read offsetWidth on six panels, sixty reads a second while nothing moved, and each read forced a layout if anything had changed since the last frame. A scroll handler called getBoundingClientRect on every chart on every scroll.
      - Both ran on the thread user 1 types on, and the timer was still up to 100 ms late when a panel really did change. A window resize handler is no better, it never ran when the sidebar collapsed, because the window kept its size.
    draw: [old-way, poll-timer, scroll-handler, measure-layout, timer-reads, scroll-reads, poll-cost]
    check: Ledgerleaf's timer read six panel widths every 100 ms. Name two things that are wrong with that.
    answer: "Any two of: it runs when nothing changed, sixty reads a second; each read can force a layout; it is on the main thread user 1 types on; and it is up to 100 ms late when a panel does change."
    misconceptions:
      - "A window resize handler tells you when a panel's width changes -> it only describes the window; a collapsing sidebar resizes the panels without resizing the window."
  - point: An observer turns the question around, you register the targets once, the browser records what changed while it works, and it calls you with a batch, so nothing runs while nothing changes and sizes come from a layout already done.
    kind: mechanism
    weight: core
    teach:
      - The browser already has the answers. It knows which nodes it inserted, because it inserted them, and it computes every box's size and position once per frame in layout.
      - An observer hands you that knowledge instead of making you derive it again. Your code says once what it cares about; when something changes, the browser calls back with a batch of entries.
      - Two gains follow. Nothing runs while nothing changes, and reading a size from an entry forces nothing, because the layout it comes from is already done.
    draw: [new-way, your-code, the-browser, observe-once, batch-callback, on-change, quiet-note]
    check: Why does reading a panel's width from a ResizeObserver entry not force a layout, when reading offsetWidth in a timer can?
    answer: The entry's size comes from the layout the browser has just computed for the frame; offsetWidth asks for a size now, so if anything changed since the last layout the browser has to lay out early to answer.
    misconceptions:
      - "An observer is just a timer the browser runs for you -> it runs nothing while nothing changes; the browser records changes it makes anyway and reports them at a fixed point."
  - point: Three observers cover the common UI cases, MutationObserver for the tree itself, ResizeObserver for an element's box size, IntersectionObserver for an element crossing into or out of the viewport or a scroll container.
    kind: component
    weight: core
    teach:
      - Map them to Ledgerleaf. The text blocks need MutationObserver, to hear about children added or removed, attributes changed and text edited.
      - Each panel's toolbar and each chart canvas need ResizeObserver. The charts further down need IntersectionObserver, to fetch data as they come near the screen.
      - Two more share the shape for other jobs, PerformanceObserver for timing entries and ReportingObserver for browser reports, but they are not about the page's layout.
    draw: [three-kinds, mo-kind, ro-kind, io-kind]
    check: Which observer would Ledgerleaf use to fetch a chart's data when its panel nears the screen, and which to switch a panel's toolbar by its width?
    answer: IntersectionObserver for nearing the screen; ResizeObserver for the panel's width.
  - point: All three share one shape, a constructor that takes a callback, observe called once per target, a callback that always receives an array of entries, and disconnect to stop, so one observer serves many targets and a frame's changes arrive together.
    kind: mechanism
    weight: core
    teach:
      - "Walk the flow: create the observer with its callback, call observe for each target, the browser calls the callback with entries, and you unobserve one target or disconnect them all."
      - Ledgerleaf does not make six ResizeObservers for six panels; it makes one and calls observe six times. If three panels change size in one frame, one callback runs with three entries, and the code loops over them and reads entry.target.
      - "The differences are small: IntersectionObserver takes root, rootMargin and threshold in its constructor, the others take options in observe; MutationObserver has no unobserve; takeRecords exists on Mutation and Intersection only; Intersection always reports a first entry after observe and Resize does so for a rendered, non-empty element, while Mutation only calls back after the first change."
    draw: [shape, shape-new, shape-observe, shape-then, shape-entries, shape-batch, shape-stop, shape-done, many-targets, three-entries]
    check: Ledgerleaf observes all six panels with one ResizeObserver, and three of them change width in the same frame. What does the code receive?
    answer: One callback with three entries, one for each panel whose size changed.
    misconceptions:
      - "One observer per element is needed -> one observer takes many targets and batches their entries into one callback."
      - "MutationObserver has unobserve like the others -> it only has disconnect; to stop watching one target you disconnect and observe the others again."
  - point: Each observer delivers at a different point, MutationObserver in a microtask right after the script that changed the DOM, ResizeObserver right after style and layout and before paint, IntersectionObserver as its own task after the rendering steps.
    kind: flow
    weight: core
    teach:
      - Draw one frame. User 1 types a hash and a space while a panel's width changes. The input task runs; the moment that script ends, the MutationObserver callback runs as a microtask, before anything is rendered.
      - Later the frame's rendering steps run style and layout. Right after them, with every size known, ResizeObserver callbacks run, still before paint.
      - The intersection check happens in the same rendering steps, but its callback is queued as a task, so it usually runs after the frame is painted.
    draw: [frame, lane-main, lane-callbacks, input-task, mo-delivery, style-layout, to-rendering, ro-delivery, paint-step, to-paint, io-delivery]
    check: Which of the three observers' callbacks runs before the browser has rendered the change that triggered it, and when exactly?
    answer: MutationObserver; its callback runs in a microtask as soon as the script that changed the DOM ends, before any rendering.
    misconceptions:
      - "All observers fire at the next animation frame -> MutationObserver runs in a microtask after the script, ResizeObserver inside the rendering steps after layout, and IntersectionObserver in a later task."
  - point: When a callback runs decides what it can safely do, changes made in MutationObserver and ResizeObserver callbacks are painted in the same frame, while what an IntersectionObserver callback changes shows a frame later at the earliest.
    kind: rule
    weight: core
    teach:
      - A MutationObserver callback sees the DOM as your code left it, nothing drawn yet, so its changes reach the same frame. Changes it makes to what it observes queue another microtask at once.
      - A ResizeObserver callback reads sizes from the layout just done. Style it writes is laid out again and painted in the same frame, which is useful and is also why it can loop.
      - An IntersectionObserver callback runs after the frame is usually painted, so it suits fetching and lazy work, not pixel-exact effects.
    draw: [same-frame, next-frame-io]
    check: Why is an IntersectionObserver callback a poor place for an effect that must line up exactly with what is painted?
    answer: Its callback is queued as a task after the rendering steps, so the frame is usually painted already and what it changes appears a frame later at the earliest.
task:
  prompt: Draw one frame as two lanes, the main thread and the callbacks, and place where a MutationObserver, a ResizeObserver and an IntersectionObserver callback each run, then say which of their changes reach this frame's paint.
  expects: [5, 6]
