# The DOM's idea: HTML is parsed once into a tree of objects, that tree is the page, writes are drawn later, and geometry reads may force work now.
id: dom-and-virtual-dom/the-dom-as-a-live-tree/key-idea
title: A live tree
source:
  hash: fba8f72323bf
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - After the DOM or CSS changes, the browser recalculates style, lays out, paints and composites to draw the next frame.
    - Reading a layout value such as a height right after a write can make the browser lay out early, inside the script.
  carries:
    - The HTML string is parsed once into a tree of objects; from then on that tree is the page.
    - The tree holds Element nodes and Text nodes, including the whitespace between tags; children lists elements, childNodes every node.
    - Changing a node's property changes the page; the redraw waits for the next rendering opportunity, so many writes in one task are drawn in one pass.
    - Writes are deferred, but a geometry read has to bring style and layout up to date before it can answer.
  terms:
    - term: DOM
      means: The tree of live objects the browser builds from the HTML; scripts and the renderer both read it.
    - term: node
      means: One object in the tree, such as the Document, an Element for a tag, or a Text node for a run of characters.
    - term: text node
      means: A node holding characters only, including the line breaks and spaces between tags.
    - term: rendering opportunity
      means: The point after the current task ends when the browser updates style, layout and paint for the next frame.
