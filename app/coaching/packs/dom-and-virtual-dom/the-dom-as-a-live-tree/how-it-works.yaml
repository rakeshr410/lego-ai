# How the DOM works: node types and the two APIs, attributes against properties, live and static lists, the calls that change the tree, building many rows, and MutationObserver.
id: dom-and-virtual-dom/the-dom-as-a-live-tree/how-it-works
title: Finding and changing nodes
source:
  hash: 0c494bedd2ea
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: dom-and-virtual-dom/the-dom-as-a-live-tree/key-idea
  assumes:
    - The HTML string is parsed once into a tree of objects; from then on that tree is the page.
    - The tree holds Element nodes and Text nodes, including the whitespace between tags; children lists elements, childNodes every node.
    - Writes are deferred to the next rendering opportunity, but a geometry read brings style and layout up to date at once.
  carries:
    - Every node shares the Node tree API; the element-only API (children, firstElementChild, querySelector) skips text and comment nodes.
    - For form controls the attribute is the starting value and the property is the live state.
    - getElementsBy* and children return live collections; querySelectorAll returns a static snapshot of the matching nodes.
    - A node is in one place; appending an attached node moves it, and a move drops focus and restarts animations.
    - innerHTML and replaceChildren replace the objects themselves; old references point at detached nodes.
    - Doing every write first and every read after keeps a batch of inserts to one layout.
  terms:
    - term: Element
      means: A node for a tag; the only node type with attributes and a tag name.
    - term: attribute
      means: A string from the markup stored on the element.
    - term: property
      means: A field on the element's JavaScript object; for form controls, the live state.
    - term: live collection
      means: A list that re-reads the tree each time you look at it, so it changes as the tree changes.
    - term: static NodeList
      means: The snapshot querySelectorAll returns, fixed at the moment of the call.
    - term: detached node
      means: A valid node object no chain of parents connects to the document; isConnected is false and nothing on screen is drawn from it.
