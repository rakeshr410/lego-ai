beats:
  - point: Pages and likes are ordinary request and response calls over HTTP, while new-post notices only flow from server to client, so they use server-sent events, with polling as a fallback.
    kind: decision
    weight: core
    teach:
      - Choose the transport per kind of traffic. A page or a like is a request with a response, plain HTTP; GETs are safe to retry, and the like calls set state, so they are too.
      - New-post notices go one way and are small, which is what server-sent events are for. The browser reconnects by itself and resends the last event id, and over HTTP/2 the stream does not use up the small per-host connection limit of HTTP/1.1.
      - A WebSocket is not needed, nothing is sent back on this channel. The app has a chat socket, but the feed keeps its own stream so the home page never waits on the chat layer. If the stream fails three times in a row, poll every 60 s.
    draw: [transport, t-rest, t-sse, t-poll, t-not]
    check: Why are server-sent events chosen over a WebSocket for new-post notices?
    answer: The notices only flow from server to client; SSE reconnects and replays with Last-Event-ID over plain HTTP, and likes go over ordinary HTTP anyway.
    misconceptions:
      - "Live features always need a WebSocket -> these notices are one-way, so server-sent events are enough."
      - "The notices should ride on the chat socket -> they could, but the feed would then depend on the chat layer for no gain."
  - point: The feed is paged with an opaque cursor that points into the server's ranked snapshot; the first page needs none because it is in the HTML, next_cursor null marks the end, and an expired cursor means a fresh first page with duplicates dropped.
    kind: mechanism
    weight: core
    teach:
      - Write GET /api/feed with feed, limit 10 and cursor c1. The cursor means nothing to the client; it marks a place in the server's ranked snapshot for this feed session.
      - The response hands back next_cursor, c2, for the next call, or null at the end, when FeedList removes the sentinel. The response is private and never stored by caches.
      - If the session ends, the server answers 410 cursor_expired. The client keeps what is shown, fetches a fresh first page, drops the ids it already has and appends the rest.
    draw: [endpoints, get-feed, cursor-rule]
    check: Loading page 4 returns 410 cursor_expired. What does the client do?
    answer: It keeps what is shown, fetches a fresh first page, drops ids already in the list and appends the rest, showing the end state if nothing new is left.
    misconceptions:
      - "A cursor is a page number -> it is opaque and points into a ranked snapshot; the client only passes it back."
      - "On an expired cursor, clear the list and start again -> keep the reader's place and dedupe the fresh page by id."
  - point: The like calls set the viewer's like rather than toggle it, so repeating one leaves the same state, one automatic retry is safe, and the store keeps at most one request in flight per post.
    kind: rule
    weight: core
    teach:
      - POST to /api/posts/{id}/like sets the like and DELETE removes it, each with a CSRF token. Sending POST twice still leaves the post liked and returns the same state, so the client may retry once by itself.
      - The response carries the confirmed liked flag and count, which the store copies into the post before dropping the intent.
      - Three quick taps only flip the intent's desired state. When the request settles, the store sends one follow-up only if desired differs from what the server confirmed.
    draw: [like-endpoint, set-rule]
    check: The reader taps Like three times quickly. How many like requests can be in flight for that post at once?
    answer: One, plus at most one follow-up afterwards if the final desired state differs from the confirmed one.
    misconceptions:
      - "A like endpoint should toggle -> a toggle repeated by a retry would undo itself; setting state makes repeats harmless."
  - point: New-post notices come from an EventSource stream that replays from the last event id, and the posts they name are fetched by id, up to 20 at a time.
    kind: mechanism
    weight: core
    teach:
      - Live Updates opens GET /api/feed/stream with EventSource. Each new_posts event has an id and lists post ids; the ids are hints, so the client still dedupes. A comment line every 25 s keeps proxies from closing the stream.
      - On its own reconnect the browser sends the Last-Event-ID header. When Live Updates reopens the stream itself, a new EventSource cannot send that header, so it puts last_event_id in the URL; the server replays from either.
      - GET /api/posts with up to 20 ids prefetches the pending posts while the tab is visible. Ids the viewer can no longer see are left out, and the client drops them from pending.
    draw: [stream-endpoint, replay-rule, get-posts]
    check: Live Updates reopens the stream after a backoff. How does the server know which notices were missed?
    answer: A new EventSource cannot send the Last-Event-ID header, so the client passes last_event_id in the URL and the server replays from it.
    misconceptions:
      - "Every new EventSource sends Last-Event-ID -> only the browser's own automatic reconnect does; a manual reopen puts it in the URL."
  - point: Components never call each other, they dispatch named actions to the store, which alone talks to Feed Service; and FeedList renders ids through renderItem, never post payloads.
    kind: component
    weight: core
    teach:
      - PostCard dispatches like/toggled, FeedList feed/loadMoreRequested, the pill feed/pendingShown. Each action has a source, a payload and an effect on the store.
      - Only the store calls Feed Service, and Feed Service reports back with actions like feed/pageLoaded and like/failed.
      - FeedList takes items, the ordered ids, and renderItem, which renders a PostCard for each. It knows nothing about posts, so the same list serves both tabs and could serve other collections.
    draw: [actions, a-dispatch, a-only-store, a-like-once, a-feedlist]
    check: What does FeedList receive to render the feed, and why not the post payloads?
    answer: The ordered post ids and a renderItem function that renders PostCard; keeping it to ids lets one list serve both tabs and other collections.
    misconceptions:
      - "PostCard calls FeedList or Feed Service directly -> it dispatches an action; only the store talks to Feed Service."
task:
  prompt: Draw the endpoints the feed uses, with the method, path and cursor, and mark which transport each one is, and write why the like call is safe to retry.
  expects: [1, 2, 3]
