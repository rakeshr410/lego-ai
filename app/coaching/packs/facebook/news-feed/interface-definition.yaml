# News feed interface: HTTP for pages and likes, server-sent events for notices, the cursor, the set-not-toggle like calls, and the store actions between components.
id: facebook/news-feed/interface-definition
title: Endpoints, cursors and store actions
source:
  hash: e57f9ce45849
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: facebook/news-feed/data-model
  assumes:
    - "Data flows one way: Feed Service fetches, Feed Store normalises and holds state, FeedList renders ids."
    - Live Updates holds an SSE stream; new post ids wait in the store's pending ids until the pill is pressed.
    - Each tab has one Feed, its ordered ids, next_cursor, status, pending ids and error.
    - A LikeIntent is a client-only overlay; the card shows its desired state if one exists, otherwise the confirmed state.
    - Server-sent events are one-way over plain HTTP; a WebSocket is a two-way channel.
  carries:
    - Pages and likes are request and response over HTTP; new-post notices use server-sent events, with 60 s polling as a fallback.
    - The feed cursor is opaque and points into the server's ranked snapshot; next_cursor null means the end, and an expired cursor means a fresh first page.
    - The like calls set state rather than toggle it, so one automatic retry is safe.
    - The browser's own reconnect resends Last-Event-ID; a manual reopen passes last_event_id in the URL.
    - Components dispatch store actions and never call each other; only the store talks to Feed Service.
    - FeedList renders ids through renderItem and never sees post payloads.
  terms:
    - term: cursor
      means: An opaque token from the server marking where the next page starts in its ranked snapshot for this feed session.
    - term: idempotent
      means: Safe to repeat, sending the call twice leaves the same state as sending it once.
    - term: Last-Event-ID
      means: The id of the last event received, which lets the server replay what was missed on reconnect.
    - term: store action
      means: A named message a component dispatches to the store (like/toggled, feed/loadMoreRequested), never a direct call.
