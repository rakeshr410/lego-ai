# News feed optimizations: a rubric picks four deep dives, virtualisation, media loading, a stable reading position and the accessible infinite list.
id: facebook/news-feed/optimizations
title: Four deep dives for long sessions
source:
  hash: 1a8d554242c3
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: facebook/news-feed/interface-definition
  assumes:
    - "Targets: 60 fps with at most 20 posts mounted, CLS < 0.1, no shift from new posts, WCAG 2.1 AA, at most 500 posts cached."
    - "Data flows one way: Feed Service fetches, Feed Store normalises and holds state, FeedList renders ids."
    - New post ids wait in the store's pending ids until the pill is pressed.
    - Media width, height and placeholder arrive in the API before the image does.
    - A ScrollSnapshot saves the top visible post's id and offset, not a pixel scroll position.
    - Windowing mounts only the items near the viewport and keeps spacers for the rest.
  carries:
    - A rubric scores each area on impact, users affected and frequency, and the top four get deep dives.
    - FeedList mounts the viewport plus 3 posts each side, caches measured heights by post id and pins the focused post.
    - Every media item gets its box before its bytes; only the first post's media skips lazy loading.
    - Content under the reader moves only when the reader asks; the pill is an overlay and FeedList corrects scrollTop itself.
    - The list follows the feed pattern, role feed, one article per post, position from Feed.ids, aria-busy while it changes.
  terms:
    - term: overscan
      means: Posts mounted just outside the viewport, 3 above and 3 below, so a fast scroll shows no blanks.
    - term: spacer
      means: Empty space standing in for unmounted posts, sized from measured or estimated heights.
    - term: anchor
      means: The post the reader is on, whose position is kept when things change above it or on return.
    - term: feed pattern
      means: The WAI-ARIA pattern for an endless list, a role feed container of articles with position and busy state.
