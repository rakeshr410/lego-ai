beats:
  - point: A rubric scores each optimisation area from 1 to 3 on impact if it fails, users affected and how often it matters, and the top four become deep dives.
    kind: decision
    weight: supporting
    teach:
      - Long sessions are where a feed goes wrong, so do not try to optimise everything. Score each area on three questions and go deep on the top four.
      - Rendering and DOM size, media and layout stability, a stable reading position and accessibility of the endless list come out on top. First-load speed, network efficiency, memory, offline and SEO are handled elsewhere in the design or matter less here.
    draw: [rubric]
    check: Why is SEO left out of the deep dives for the home feed?
    answer: It scores lowest on all three questions; the home feed is personal and behind login.
  - point: FeedList mounts only the posts in the viewport plus 3 above and 3 below, stands spacers in for the rest, caches each measured height by post id and pins the focused post.
    kind: mechanism
    weight: core
    teach:
      - After 300 posts the DOM would hold thousands of nodes and scrolling would stutter on a mid-range phone. So only the posts near the viewport exist, at most 20, and spacers above and below keep the scrollbar the right size.
      - Reading post 41 of 120, posts 39 to 44 are mounted. A post starts at an estimate of 520 px, is measured with ResizeObserver once mounted, and its height is cached by id, so its spacer is exact after it unmounts. When a card above the viewport changes size, scrollTop is corrected by the difference in the same frame.
      - The focused article is pinned so focus never falls to the body. See more and video position live in the store by post id, and past 500 posts the furthest payloads are evicted and refetched by id if the reader scrolls back.
    draw: [opt-window, w-spacer-above, w-mounted-above, w-viewport, w-in-view, w-mounted-below, w-spacer-below, w-mounted, w-spacers, w-cache, w-evict]
    check: The focused post scrolls out of the mounted window. What happens, and why?
    answer: It stays mounted, pinned, so a keyboard or screen reader user does not lose focus to the page body.
    misconceptions:
      - "An unmounted post's space is guessed again every time -> its measured height stays cached by post id, so its spacer is exact."
      - "Expanded text can live in the card's own state -> a remounted card would lose it; it is kept in the store by post id."
  - point: Every image and video gets its box before its bytes, sized from the API's width and height, and only the first post's media skips lazy loading.
    kind: mechanism
    weight: core
    teach:
      - Media is most of the bytes and most of the layout risk. The API sends width and height, so MediaBox sets aspect-ratio before the image arrives and the image fills a box whose size never changes.
      - The first post's media is likely the LCP element, so it gets fetchpriority high and no lazy loading; everything else is lazy. A srcset of 480, 960 and 1440 lets phones take small images, and the smallest is chosen under Save-Data.
      - The dominant colour from the API fills the box until the image lands, and a failed image keeps its box with a retry icon. Video uses preload none with a poster and plays muted only while at least half is visible.
    draw: [opt-media, m-box, m-first, m-srcset, m-video]
    check: An image above the viewport finishes loading. Why doesn't the page jump?
    answer: Its box was already sized with aspect-ratio from the width and height in the API response, so the image fills it without changing its size.
    misconceptions:
      - "Lazy-load every image, including the first -> that delays the likely LCP image; the first post's media gets fetchpriority high instead."
  - point: Content under the reader moves only when the reader asks, new posts wait behind an overlay pill, FeedList corrects scrollTop itself for height changes above, and the position is restored by anchor.
    kind: rule
    weight: core
    teach:
      - New ids go to pending and their payloads are prefetched while the tab is visible. The pill sits over the top of the list, outside its flow, so showing it moves nothing; past 50 pending it reads 50+ and reloads the first page instead of prepending.
      - A re-measured card, a late font or an expanded post above the reader would push everything down, so FeedList fixes scrollTop by the measured difference. Browser scroll anchoring helps where it exists, but not every browser has it, so the design does not depend on it.
      - Coming back, render from the store, scroll the anchor post into place and keep it there as cards are measured. After a full reload a sessionStorage snapshot younger than 30 minutes restores ids and cursor. On pagehide the EventSource is closed so the page can enter the back/forward cache, and reopened on pageshow with last_event_id in the URL.
    draw: [opt-stable, s-overlay, s-scrolltop, s-cap, s-restore]
    check: Why doesn't the design rely on the browser's scroll anchoring to keep the reader's post still?
    answer: Not every browser supports it, so FeedList corrects scrollTop by the measured difference itself and treats anchoring only as a help.
    misconceptions:
      - "The pill can sit at the top of the list in normal flow -> it would push content down when it appears; it is an overlay."
      - "Keep the stream open while the page is hidden -> an open connection can keep the page out of the back/forward cache; close it on pagehide."
  - point: The endless list follows the feed pattern, a named role feed with one article per post, its position taken from Feed.ids, aria-busy while it changes, and keys that move focus between posts.
    kind: rule
    weight: core
    teach:
      - Without structure a screen reader hears one endless run of text. The list is role feed with a name, and each post an article labelled by its author and time.
      - Only a window is mounted, so each article's aria-posinset comes from its index in Feed.ids, and aria-setsize is -1 while more can load. aria-busy is true while a page is appended or pending posts are prepended.
      - Page Down and Page Up move focus between articles. New posts get one polite live-region message per batch, at most once a minute, and nothing is placed below the feed, since infinite scroll would make it unreachable.
    draw: [opt-a11y, a-role, a-posinset, a-busy, a-keys]
    check: Only posts 39 to 44 of 120 are mounted. How does a screen reader user learn they are on post 41?
    answer: The article carries aria-posinset 41, taken from its index in Feed.ids, with aria-setsize -1 while more can load.
    misconceptions:
      - "Announce every new post as it arrives -> one polite message per batch, at most once a minute, so the reader is not interrupted."
