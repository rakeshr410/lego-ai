beats:
  - point: Start from the page the reader sees, two tabs, a pill that floats over the list, post cards with an author header, text, media and counts, and a sentinel at the end, then give each part a component.
    kind: component
    weight: supporting
    teach:
      - Sketch the feed on the left as the reader sees it. The Top and Recent tabs, a pill floating over the list when new posts are waiting, and one post card, avatar, name and time on top, then the text with See more, the media, then the like and comment counts.
      - Under the cards an invisible end sentinel, and the footer that says loading, offline or the end.
      - Each part becomes a component on the right, the list FeedList, each card PostCard with its AuthorHeader and MediaBox inside, the pill NewPostsPill. The mock-up is how you check nothing on screen is left without an owner.
    draw: [mockup, mock-tabs, mock-pill, mock-post, mock-author, mock-text, mock-media, mock-counts, mock-next, mock-sentinel, mock-footer]
    check: Which component owns the new-posts pill, and why is it drawn floating over the list rather than in it?
    answer: NewPostsPill; it is an overlay so new posts can wait behind it without pushing the list down.
  - point: Data flows one way, Feed Service fetches from the server, Feed Store normalises and holds the state, and the feed page renders what the store gives it.
    kind: component
    weight: core
    teach:
      - Draw the browser and, inside it, the feed page with its two tabs. FeedList is the scrolling list, PostCard one post.
      - Below them the Feed Store, the one place state lives. It hands the page ids, a status and a pending count. Under it Feed Service, which does the HTTP calls with a CSRF token, a 10 s timeout and one safe retry, and returns a typed result or an error.
      - The server on the right is the ranking black box. Point out the direction, requests go down through the store, data comes back up through it; the page never talks to the network.
    draw: [browser, feed-page, mock-split, feed-list, post-card, feed-store, store-to-page, feed-service, store-service, server, service-server]
    check: Which component is allowed to call Feed Service, and what does the page receive?
    answer: Only Feed Store calls Feed Service; the page gets ids, a status and a pending count from the store and renders them.
    misconceptions:
      - "Each card fetches its own data -> the store fetches through Feed Service and cards render from the store by id."
  - point: The first ten posts arrive inside the server-rendered HTML, and the next page is asked for when the end sentinel enters a margin of 150% ahead of the viewport.
    kind: flow
    weight: core
    teach:
      - On a normal visit the HTML already holds the first ten posts plus the same data as JSON, so the store hydrates from it with the next cursor, c1, and nothing waits on a fetch. A skeleton only shows on client navigation with an empty store or a tab opened for the first time.
      - As the reader scrolls, the sentinel enters a margin about one and a half screens ahead. FeedList asks the store to load more; the store ignores repeats while it is already loading and fetches with c1.
      - The page comes back with posts, users and c2. Ids already shown are dropped before the rest are appended. A null next cursor means the end, the sentinel goes and the footer says so.
    draw: [ssr-note, sentinel-note, load-more, end-note]
    check: The sentinel fires twice in quick succession while page 2 is loading. How many requests go out, and why?
    answer: One; the store ignores load-more while its status is already loading more.
    misconceptions:
      - "The first page is fetched by the client after load -> it is rendered on the server into the HTML; the store hydrates from it."
  - point: New-post notices arrive over a server-sent event stream held by Live Updates, and their ids wait in the store's pending list while the pill shows a count, so the list does not move.
    kind: flow
    weight: core
    teach:
      - Live Updates opens the stream when the page starts. When the server ranks in two new posts it sends a new_posts event with their ids.
      - Live Updates passes the ids to the store, which puts them in pending, not in the list. The pill shows 2 new posts and the reader's post stays exactly where it was.
      - Only pressing the pill prepends them, skipping any already shown, and moves the reader to the top.
    draw: [live-updates, server-stream, add-pending, new-posts-pill, pending-note]
    check: A new_posts event arrives while the reader is mid-feed. Which state changes?
    answer: Only the pending ids (and their prefetched data); the ordered list and the scroll position stay as they were.
    misconceptions:
      - "New ids go straight to the front of the list -> they wait in pending until the reader presses the pill."
  - point: PostCard sends a like intent to the store, which shows the like at once and, if the request fails, restores the confirmed state and offers Retry.
    kind: flow
    weight: core
    teach:
      - The reader likes Mira's post, which has 24 likes. The card sends likeToggled to the store, and the store shows it liked with 25 in the same frame while the request goes out.
      - The POST fails with 503, again after one retry. The store goes back to the confirmed state, not liked and 24, rather than subtracting one, and a toast offers Retry.
      - The card does not call the endpoint itself. Virtualisation can unmount it mid-request; the store outlives it, knows the confirmed state and owns the rollback.
    draw: [like-toggled, like-rollback]
    check: Why does PostCard send like intents to the store instead of calling the like endpoint itself?
    answer: The card can be unmounted mid-request by virtualisation, while the store outlives it, knows the confirmed state, coalesces taps and owns the rollback.
    misconceptions:
      - "On failure, subtract one from the count -> restore the last confirmed state, so repeated taps and retries cannot leave it off by one."
  - point: Each failure has an owner and a recovery, an expired cursor fetches a fresh first page and drops posts already shown, and offline keeps the loaded posts and retries when the network returns.
    kind: failure
    weight: supporting
    teach:
      - A 410 cursor_expired keeps what is on screen, fetches a fresh first page, drops ids already shown and appends the rest. A 429 counts down the server's wait in the footer, then retries once.
      - A timeout or offline keeps the posts, says offline in the footer and retries when the browser fires online. A 401 opens a login modal over the feed and retries after sign-in.
    draw: [offline-note, error-map]
    check: Loading page 4 returns 410 cursor_expired. What does the client do with the posts already shown?
    answer: Keeps them, fetches a fresh first page, drops ids already in the list and appends the rest.
