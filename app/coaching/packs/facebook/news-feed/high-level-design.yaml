# News feed high-level design: the components, data flowing one way through the store, and the session's four stories (first page, next page, new posts, a failed like).
id: facebook/news-feed/high-level-design
title: Components and how data moves
source:
  hash: 0e87aaed5c5b
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: facebook/news-feed/requirements-exploration
  assumes:
    - Ranking is a server black box; the client shows ordered pages fast, pages smoothly, keeps the reader's place and makes likes instant.
    - New posts are announced by a pill and never inserted under the reader.
    - An end sentinel watched by an IntersectionObserver asks for the next page before the reader reaches the end.
    - Server-sent events carry one-way notices from server to page over HTTP, and the browser reconnects with Last-Event-ID.
  carries:
    - "Data flows one way: Feed Service fetches, Feed Store normalises and holds state, FeedList renders ids."
    - The first page arrives in the server-rendered HTML; the store hydrates from it.
    - The sentinel entering a 150% margin asks the store to load more; repeats are ignored while loading.
    - Live Updates holds an SSE stream; new post ids wait in the store's pending ids until the pill is pressed.
    - PostCard sends like intents to the store, which shows the like at once and restores the confirmed state if the request fails.
  terms:
    - term: Feed Store
      means: The client store holding posts, users and media by id, each tab's feed, and like intents; the only caller of Feed Service.
    - term: Feed Service
      means: The client module that makes the HTTP calls (CSRF, 10 s timeout, one safe retry) and returns a typed result or error.
    - term: Live Updates
      means: The client module that holds the SSE stream of new-post notices, with a polling fallback.
    - term: pending ids
      means: New post ids held in the store, counted by the pill, not yet in the list.
    - term: confirmed state
      means: A post's like count and liked flag as the server last returned them.
