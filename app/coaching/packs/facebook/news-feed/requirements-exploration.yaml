context:
  after: null
  assumes: []
  carries:
    - Ranking is a server black box that returns ordered pages; the client shows them fast, pages smoothly, keeps the reader's place and makes likes instant.
    - "Working numbers: 10 posts per page, heavy sessions of 300 posts, a mid-range Android phone on 4G."
    - Top and Recent are two separate feeds, each with its own cursor and position.
    - New posts are announced by a pill and never inserted under the reader.
    - "Targets: FCP < 1.5 s, LCP < 2.5 s, INP < 200 ms, 60 fps with at most 20 posts mounted, CLS < 0.1, at most 500 posts cached."
  terms:
    - term: functional requirement
      means: Something the user can do or see on the feed, written so it can be checked.
    - term: non-functional requirement
      means: How well the feed must behave (speed, smoothness, stability, access, resilience, memory), with a number to meet.
    - term: heavy session
      means: The design's budget case, a reader who scrolls through 300 or more posts.
