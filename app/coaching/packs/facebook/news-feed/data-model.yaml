beats:
  - point: A page of the feed arrives as ranked posts with their media inline, a map of users and a next cursor, and Feed Service normalises it before it reaches the store.
    kind: mechanism
    weight: core
    teach:
      - Start from what the server sends for GET /api/feed, posts in ranked order, each with its media inside it, the users who wrote them keyed by id, and next_cursor, absent at the end.
      - That is server data as sent. Feed Service splits it up before the store keeps it, which is the next step.
    draw: [response, page-response, response-fields, response-cursor, service-normalises]
    check: What three things does a feed page response carry?
    answer: The ranked posts (with media inline), a map of users by id, and the next cursor, which is missing or null at the end.
  - point: Posts, users and media are stored once each, by id, so one update reaches every place a post appears and dropping duplicates is a set lookup.
    kind: rule
    weight: core
    teach:
      - Split the response into three entity tables, Post, User and Media, each keyed by id. A post keeps media_ids instead of the media itself.
      - The same post can show up in Top, in Recent and in a new-posts fetch. Stored once, a like updates it everywhere, and checking for a duplicate is just asking whether the id is already there.
      - The Post holds the confirmed like_count and viewer_has_liked from the server. Media carries width, height and a placeholder colour, known before any image bytes arrive.
    draw: [entities, post-entity, user-entity, media-entity, normalise, post-confirmed, media-size]
    check: Why are posts stored by id rather than inside each tab's list?
    answer: A post can appear in both tabs and in new-post fetches; one record means a like updates it everywhere, and duplicates are dropped with an id lookup.
    misconceptions:
      - "Storing by id is about saving space -> it is about one record per post, so updates reach every place and dedupe is easy."
  - point: Each tab has one Feed, an ordered list of post ids with its own next cursor, status, pending ids and error, so the list holds ids, never posts.
    kind: component
    weight: core
    teach:
      - A Feed exists per tab, top and recent. Its ids are the order to show, next_cursor says where the next page starts, and status is one of idle, loading, loading-more, error or end.
      - pending_ids are the new posts waiting behind the pill, capped at 50. error holds the last failure for the footer.
    draw: [lists, feed-top, to-lists, list-fields, list-pending]
    check: What does the Feed for the Recent tab hold, and what does it not hold?
    answer: Its ordered post ids, next cursor, status, pending ids and error; it holds no post data, which lives in the entity tables.
    misconceptions:
      - "Both tabs share one list and one cursor -> each tab has its own Feed with its own ids and cursor."
  - point: The like intent lives only on the client and overlays the post's confirmed state; a card shows the intent's desired state if one exists, otherwise the confirmed one, so rolling back just deletes the intent.
    kind: rule
    weight: core
    teach:
      - LikeIntent holds a post id, the state the reader wants, and whether a request is in flight. The server never sees it.
      - What the card shows is derived. If there is an intent, show its desired state; if not, show the post's confirmed like_count and viewer_has_liked.
      - The intent copies nothing from the post, so undoing a failed like is deleting the intent. When a request succeeds, the confirmed fields are updated from the response and the intent goes.
    draw: [client-only, like-intent, intent-rule, rollback-rule]
    check: Which part of the like state never comes from the server, and how is a failed like undone?
    answer: The LikeIntent (desired and in flight); a failed like is undone by deleting it, which leaves the confirmed state showing.
    misconceptions:
      - "The optimistic count is written into the post -> it sits in a separate intent, so the confirmed state is never overwritten until the server answers."
  - point: To restore the reading position the client saves the top visible post's id and the offset within it, not a pixel scroll value.
    kind: mechanism
    weight: core
    teach:
      - ScrollSnapshot is the other client-only piece. It records the feed, the anchor post id, the offset inside that post, the first 200 ids, the cursor and when it was saved.
      - Heights may differ when the reader comes back, fonts load, the window is resized, cards are not yet measured. A post id plus an offset still lands on the right content when pixel totals have changed.
    draw: [scroll-snapshot, saved, snapshot-fields]
    check: What does the design save in order to restore the reading position, and why not window.scrollY?
    answer: The id of the top visible post and the offset within it; pixel totals can change on return, while an anchor post still finds the same content.
    misconceptions:
      - "Saving scrollY is enough -> heights can differ on return, so a pixel offset can land on different content."
task:
  prompt: Draw the store as it holds the feed, the Post, User and Media entities by id, a Feed per tab with its fields, and the client-only LikeIntent and ScrollSnapshot, and write what a card shows for a post with an intent.
  expects: [2, 3, 4]
