# News feed data model: the page response split into entities by id and one id list per tab, plus the two client-only pieces, the like intent and the scroll snapshot.
id: facebook/news-feed/data-model
title: Entities by id, lists of ids
source:
  hash: 71e3d0b629a2
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: facebook/news-feed/high-level-design
  assumes:
    - "Data flows one way: Feed Service fetches, Feed Store normalises and holds state, FeedList renders ids."
    - Top and Recent are two separate feeds, each with its own cursor and position.
    - New post ids wait in the store's pending ids until the pill is pressed.
    - PostCard sends like intents to the store, which restores the confirmed state if the request fails.
    - A normalized store keeps each entity once, by id, and lists refer to entities by id.
  carries:
    - The page response carries ranked posts with media inline, a users map and next_cursor; Feed Service normalises it.
    - Posts, users and media are stored once by id; media width, height and placeholder are known before the image loads.
    - Each tab has one Feed, its ordered ids, next_cursor, status, pending ids (at most 50) and error.
    - A LikeIntent is a client-only overlay; the card shows its desired state if one exists, otherwise the post's confirmed state, and rollback deletes it.
    - A ScrollSnapshot saves the top visible post's id and offset, not a pixel scroll position.
  terms:
    - term: entity
      means: One server record (a post, a user, a media item) stored once in the store, by id.
    - term: Feed
      means: One tab's ordered list of post ids with its cursor, status, pending ids and error.
    - term: LikeIntent
      means: Client-only overlay per post, the desired liked state and whether a request is in flight.
    - term: ScrollSnapshot
      means: The anchor post's id and the offset within it, plus the first ids and the cursor, saved to restore a position.
