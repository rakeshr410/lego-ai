# The service worker's idea: your own script on the request path, answering from a cache you control before the network, with a strategy per request and a lifecycle per version.
id: network-performance/service-worker-caching/key-idea
title: A proxy in the browser
source:
  hash: f0c56cec1dd7
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - The HTTP cache only does what response headers say, and with no signal the browser shows its own offline error page.
    - A service worker is a script the page registers that receives a fetch event for every request from pages in its scope and answers it with a Response it chooses.
    - The worker answers from Cache Storage, the network, a race of the two, or a reply it builds; the page's own fetch calls do not change.
    - A worker takes the network off the shell's critical path; it does not make the network faster.
    - Each kind of request gets its own strategy, cache first for files whose URL changes with their content, network first with a dated fallback for live data.
    - A new worker version installs beside the old one and waits until no open tab depends on the old one.
  terms:
    - term: service worker
      means: A script the page registers that sits between its pages and the network and answers their requests.
    - term: scope
      means: The set of URLs whose pages the worker controls.
    - term: fetch event
      means: What the browser hands the worker for each request a controlled page makes.
    - term: Cache Storage
      means: Named caches of request and response pairs that the worker's own code fills and reads.
    - term: app shell
      means: The HTML, scripts and styles every page boots from, before its data arrives.
    - term: strategy
      means: The order in which a worker tries the cache and the network for one kind of request.
