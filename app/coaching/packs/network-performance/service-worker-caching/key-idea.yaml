beats:
  - point: The browser's HTTP cache only does what response headers told it to, so with a weak signal the HTML still waits on the server and with none the reader gets the browser's error page.
    kind: requirement
    weight: core
    teach:
      - Tidewatch's regulars open the same few spot pages each morning, often from a beach car park with one bar of signal.
      - The HTTP cache keeps the hashed scripts and styles, but the HTML must be checked with the server first, and the forecast past its short max-age goes to the network every time.
      - With no signal at all the browser shows its own offline page. Nothing lets the page say, give me what you had yesterday and tell the reader how old it is.
    draw: [no-worker, nw-page, http-cache, asks-cache, offline-error, nw-offline, headers-note]
    check: With no signal, what does a Tidewatch reader see without a service worker, and why can't the page help?
    answer: The browser's own offline error page; nothing of Tidewatch's runs before the navigation succeeds, and the HTTP cache only follows the headers it was given.
  - point: A service worker is a script the page registers that the browser hands a fetch event for every request from pages in its scope, and the worker answers each with a Response it chooses.
    kind: component
    weight: core
    teach:
      - The page registers sw.js. From then on every request from a page in its scope goes to the worker first, the navigation, the scripts, the photos, even calls to the API on another origin.
      - The worker can answer from a copy in Cache Storage, go to the network, race the two, or build a reply itself.
      - The page's code does not change. It still calls fetch for the forecast and gets an answer.
    draw: [sw-path, sw-page, sw, fetch-event, network, to-network, cache-storage, match-put, every-request, answers]
    check: Which of Tidewatch's requests does its service worker see, and what can it answer them with?
    answer: Every request from a page in its scope, the navigation, scripts, photos and API calls even to another origin; it can answer from Cache Storage, from the network, by racing them, or with a reply it builds.
    misconceptions:
      - "The page has to call the service worker -> the page just calls fetch as before; the browser routes the request through the worker."
  - point: A worker takes the network off the shell's critical path, so a repeat visit paints from the cache in a fraction of the time, and offline it can show a stored forecast labelled with its age.
    kind: metric
    weight: core
    teach:
      - On beach 4G with cold connections, the shell without a worker waits for a connection and an HTML revalidation and paints at about 760 ms.
      - With a worker, it boots in about 40 ms, answers the navigation from Cache Storage, and the shell paints at about 180 ms. The forecast still has to connect to the API.
      - Offline, the shell still comes from the cache and the forecast fetch fails fast, so the worker returns the copy stored at 06:10 and the page says so.
    draw: [morning, m-no-sw, m-sw, m-offline, not-faster]
    check: Does a service worker make Tidewatch's forecast request faster on a good signal?
    answer: No; the forecast still needs a connection to the API. The worker takes the network off the shell's path, so the shell paints from the cache sooner.
    misconceptions:
      - "A service worker speeds up the network -> it does not; it lets the cache answer before the network gets a say."
  - point: Each kind of request gets its own strategy, a file whose URL changes with its content comes straight from the cache, while the forecast tries the network first and falls back to a stored copy labelled with its age.
    kind: decision
    weight: core
    teach:
      - A hashed script can never be stale, because a new version means a new URL, so the cache can answer it.
      - A forecast changes and matters, so the worker asks the network and only falls back to the stored copy, which the page must date.
    draw: [two-ideas, idea-strategy, strategy-note]
    check: Why can Tidewatch's hashed app script come straight from the cache while the forecast cannot?
    answer: The script's URL changes whenever its content does, so a cached copy is always right; the forecast changes under the same URL, so it tries the network first and falls back to a dated copy.
  - point: The worker is itself a file that ships with each release, and the browser installs a new version beside the old one and holds it back until no open tab still depends on the old one.
    kind: mechanism
    weight: core
    teach:
      - Every release ships a new sw.js. The browser installs it next to the running one rather than swapping it in.
      - The new version waits until no open tab still uses the old one. Most service-worker bugs come from not understanding this step; the next part walks through it.
    draw: [idea-lifecycle, lifecycle-note]
    check: Tidewatch deploys a new worker while a reader has a spot page open. Does the new worker take over that tab at once?
    answer: No; it is installed beside the old one and waits until no open tab still depends on the old version.
