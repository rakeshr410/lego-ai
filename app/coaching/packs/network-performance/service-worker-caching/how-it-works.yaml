beats:
  - point: The page registers sw.js for a scope, by default the folder the script sits in, and only on a secure origin, because a script that can rewrite every response must not be injectable.
    kind: mechanism
    weight: core
    teach:
      - Tidewatch calls register for /sw.js once the page has loaded, so installing never competes with a first visit's critical requests.
      - The scope is a URL prefix, by default the script's own folder, which is why sw.js sits at the root and not under /static/. A wider scope needs the server to send Service-Worker-Allowed with the script.
      - Service workers only exist over HTTPS, or localhost while developing.
    draw: [registration, register-call, scope-box, sc-spots, sc-forecast, sc-controls, allowed-note, https-note]
    check: Tidewatch's sw.js is served from /static/sw.js. Which pages can it control by default, and how would you widen that?
    answer: Only pages under /static/, its own folder; to cover the whole site, serve it from the root or send a Service-Worker-Allowed header with the script.
  - point: The worker runs on its own thread with no DOM, and the browser stops it when idle and starts it for the next event, so anything kept in a global can vanish between two requests.
    kind: rule
    weight: core
    teach:
      - Once a page is controlled, every request it makes passes through the worker, including requests to static.tidewatch.example and api.tidewatch.example. Pages on other origins are never controlled by it.
      - The worker is not part of the page. It runs on its own thread, without a DOM, and is stopped when idle, so state that must survive goes in Cache Storage or IndexedDB.
    draw: [thread-note]
    check: Tidewatch's worker counts forecast requests in a global variable. Why does the count keep resetting?
    answer: The browser stops an idle worker and starts it again for the next event, so globals are lost; anything that must last belongs in Cache Storage or IndexedDB.
    misconceptions:
      - "The service worker runs on the page's main thread -> it runs on its own thread with no DOM, between the page and the network."
      - "A worker keeps running in the background -> the browser stops it when idle and restarts it per event."
  - point: Each version installs, fills its precache, then waits as installed until the old version has no clients left, and only then activates, deletes old caches and handles fetches.
    kind: mechanism
    weight: core
    teach:
      - Walk release v42 while two tabs run v41. A navigation finds a byte-different sw.js, so v42 installs beside v41 and caches its shell under its own name. If one precache URL returns 404, addAll fails as a whole, v42 is discarded and v41 keeps running.
      - Then v42 waits, because a tab that booted on v41's HTML expects v41's scripts and chunks. A reload does not end the wait, since the old page stays a client until the new response arrives.
      - When the last v41 tab closes, v42 activates, its activate handler deletes the v41 shell cache, and the next visit runs v42.
    draw: [lifecycle, lc-parsed, lc-installing, lc-install, lc-installed, lc-ok, lc-redundant, lc-fail, lc-activating, lc-no-clients, lc-activated, lc-done, reload-note]
    check: A reader reloads a Tidewatch tab after v42 has installed. Which worker serves the reloaded page, and why?
    answer: Still v41; during a reload the old page remains a client until the new response arrives, so v41 never has zero clients and v42 keeps waiting.
    misconceptions:
      - "A reload picks up the new worker -> the old page stays a client through the reload; the wait ends only when every old tab closes."
  - point: skipWaiting() activates the new version at once and puts every open tab under it, which can break a v41 page whose chunks the v42 worker has deleted, so Tidewatch calls it only when the reader asks and then reloads every tab.
    kind: decision
    weight: core
    teach:
      - Called from install, skipWaiting makes v42 take over tabs still running v41 code. Its activate handler has already deleted the v41 cache, so the next lazy v41 chunk misses, and on bad signal fails.
      - Tidewatch instead shows a New version ready toast. A tap posts a message, the worker calls skipWaiting, and every tab reloads on controllerchange, so page and worker are the same release.
      - clients.claim() during activate is the other lever, it takes control of in-scope tabs that loaded without any worker, such as the very first visit.
    draw: [skip-waiting, lc-skip, mismatch-note, claim-note]
    check: Why is calling skipWaiting() unconditionally in the install handler risky for Tidewatch?
    answer: Tabs already running v41 come under the v42 worker, whose activate handler deleted v41's cache, so a v41 chunk they request later misses and can fail offline.
    misconceptions:
      - "skipWaiting() is a harmless way to update faster -> it puts old pages under the new worker and its caches; it is safe only if old pages can live with them."
  - point: The browser checks for a new sw.js on navigation, on registration.update() and on some background events, and compares it byte for byte, so the worker's URL must stay the same across releases.
    kind: rule
    weight: supporting
    teach:
      - Any byte difference starts an install. By default the check ignores the HTTP cache for sw.js itself, though the scripts it imports can still come from it.
      - If each release registered its own file, a user holding v41's cached shell would keep registering v41's worker and stay stuck. Keep one URL and change its content.
    draw: [url-note]
    check: Why must Tidewatch never rename sw.js to sw-42.js in a release?
    answer: A user on v41's cached shell would keep registering the v41 script, which serves v41's shell, so they would never see v42; one stable URL lets the byte comparison find the update.
  - point: A strategy is just an order of attempts, cache-first for files named by their content, network-first with a timeout for live data, stale-while-revalidate for things that rarely change, network-only and cache-only at the ends.
    kind: decision
    weight: core
    teach:
      - Cache-first suits hashed scripts, styles, fonts and photos whose URL holds an id. Network-first with a 3-second timeout suits the forecast, falling back to the stored copy, which the page dates.
      - Stale-while-revalidate answers the spot list from the cache at once and refreshes it in the background, so a new spot shows on the next visit.
      - Network-only is for POSTs, search-as-you-type and analytics; Tidewatch's worker simply does not handle them. Cache-only serves the shell precached at install.
    draw: [strategies, st-cache-group, st-net-group, st-cache-first, st-network-first, dated-note, st-swr, swr-note, st-network-only, st-cache-only]
    check: Which strategy fits Tidewatch's forecast, which its spot list, and which a search request?
    answer: Network-first with a timeout for the forecast, falling back to a dated copy; stale-while-revalidate for the spot list; network-only for search.
    misconceptions:
      - "Cache-first is fine for the forecast -> it would show an old forecast forever; cache-first is safe only when a new version means a new URL."
  - point: Cache Storage never expires anything, reads a response body only once, stores an addAll batch all or nothing, and counts each opaque cross-origin response heavily against quota.
    kind: rule
    weight: core
    teach:
      - It is named caches mapping requests to responses. Cache-Control means nothing to match, so an entry stays until code deletes it, which is why Tidewatch versions its shell cache and deletes old ones in activate.
      - A body can be read once, so to return a response and store it, put a clone. addAll fails as a whole if any response is outside 2xx.
      - A cross-origin request without CORS comes back opaque, unreadable and in Chrome counted as roughly 7 MB, so Tidewatch loads its static origin with CORS headers.
    draw: [cache-rules, shell-cache, forecast-cache, rule-expiry, cr-reply, cr-clone, cr-precache, cr-all-or-nothing, rule-opaque]
    check: Tidewatch sets a one-hour max-age on its forecast responses. Does a forecast stored in Cache Storage expire after an hour?
    answer: No; Cache Storage ignores Cache-Control, so the entry stays until Tidewatch's code deletes it or the browser evicts the origin's storage.
    misconceptions:
      - "Cache Storage honours max-age like the HTTP cache -> nothing expires; every cache needs code that deletes it."
task:
  prompt: Draw one worker version's lifecycle from installing to activated, mark where v42 waits while v41 tabs are open and what skipWaiting() does, and write which strategy the forecast, the spot list and the hashed app script each use.
  expects: [3, 4, 6]
