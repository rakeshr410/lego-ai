# How a service worker works: registration and scope, its own thread, the lifecycle and why versions wait, skipWaiting and clients.claim, update checks, the five strategies, and Cache Storage's rules.
id: network-performance/service-worker-caching/how-it-works
title: Strategies, updates and offline
source:
  hash: b122e6dcf9d0
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: network-performance/service-worker-caching/key-idea
  assumes:
    - A service worker receives a fetch event for every request from pages in its scope and answers it with a Response it chooses.
    - Each kind of request gets its own strategy over Cache Storage and the network.
    - A new worker version installs beside the old one and waits until no open tab depends on the old one.
  carries:
    - A worker's scope is by default the folder its script lives in, and service workers only run on secure origins.
    - The worker runs on its own thread with no DOM and is stopped when idle, so state that must last goes in Cache Storage or IndexedDB.
    - "A version goes installing, installed (waiting), activating, activated, and the waiting ends when the old worker has no clients or skipWaiting() is called."
    - skipWaiting() puts old pages under the new worker; Tidewatch only calls it when the reader asks, and reloads every tab.
    - "Five strategies: cache-first, network-first with a timeout, stale-while-revalidate, network-only and cache-only."
    - Nothing in Cache Storage expires; every cache needs code that deletes it.
  terms:
    - term: client
      means: A page or tab that a service worker version controls.
    - term: waiting
      means: The installed state in which a new version is ready but the old one still controls open tabs.
    - term: skipWaiting()
      means: A call that makes the installed version activate at once and take over every tab the registration controls.
    - term: clients.claim()
      means: A call during activate that makes the worker control in-scope tabs that loaded without it.
    - term: stale-while-revalidate
      means: Answer from the cache now and refresh the cache from the network in the background.
    - term: opaque response
      means: A cross-origin response fetched without CORS, unreadable to code and counted heavily against quota.
