beats:
  - point: "Keep runtime state small: ids are tiny, payloads grow, so only payloads within three pages of the reader stay in memory; pages that leave this window are written to IndexedDB in idle time and dropped, and read back a screen before the reader scrolls back to them."
    kind: mechanism
    weight: core
    teach:
      - "The store's shape is settled; now where it lives. Draw the feed as pages of 10. Five thousand ids are well under 100 KB; it is the payloads that grow. The reader is on page 7, so pages 4 to 10 stay in memory, three on each side."
      - "As the reader moves on, a page that falls out of the window is written to IndexedDB in idle time and dropped from memory. Scrolling back, it is read back a screen early. Pages past the cursor are not loaded yet."
      - "The same disk copy serves the offline requirement."
    draw: [storage, strip, idb, window, pages-before, page-reader, pages-after, pages-unloaded, offload]
    check: The reader is on page 8 and page 11 arrives. What happens to page 4?
    answer: It falls out of the window, is written to IndexedDB in idle time and dropped from memory; it is read back if the reader scrolls back toward it.
  - point: "Each other kind of state has its place: Cache Storage for the shell and images, sessionStorage for the scroll anchor, localStorage only for tiny preferences because it is synchronous, and component state for press and hover."
    kind: rule
    weight: core
    teach:
      - "Cache Storage: the service worker keeps the app shell and the images there. sessionStorage: the scroll anchor, for this tab's back navigation."
      - "localStorage is synchronous and strings only, so a large write blocks the thread: theme and text size, never feed data. Component state: pressed and hover, lost harmlessly when the card unmounts."
    draw: [cache-storage, cache-note, session-storage, session-note, local-storage, local-note, component-state, component-note]
    check: Why offload pages to IndexedDB rather than localStorage?
    answer: localStorage is synchronous and stores only strings, so large reads and writes block the UI thread; IndexedDB is asynchronous and stores structured records.
    misconceptions:
      - "localStorage is fine for feed pages -> its synchronous calls cause long tasks while scrolling; it is for a few small preferences."
