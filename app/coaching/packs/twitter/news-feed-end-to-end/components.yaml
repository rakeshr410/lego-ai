beats:
  - point: The breakdown is the component tree, FeedScreen is the route shell, FeedList the virtual list inside it, and each TweetCard is made of AuthorRow, TweetText, ImageBox and ActionRow.
    kind: component
    weight: core
    teach:
      - "Now that the requirements are written, turn the drawing into components. FeedScreen is the shell for the home route: it ships a skeleton in its HTML, hosts the list and the new-tweets pill, and restores the reading position."
      - "FeedList is the virtual list: two sentinels and a pool of recycled nodes, which the rendering section draws. Each tweet is a TweetCard, built from the four parts you just drew."
    draw: [components, c-feed-screen, c-feed-list, screen-holds-list, c-tweet-card, list-holds-card, c-author, c-text, c-image, c-actions]
    check: Why break one tweet into four parts on the mock-up?
    answer: The parts are the component tree, and their fields are the data each card needs, both reused by the later sections.
  - point: Behind the UI sit the Feed Store, the Feed Client, the Live Channel and the Offline Cache; the list reads ids from the store, cards read their tweet by id and never fetch, and only the client calls the server.
    kind: component
    weight: core
    teach:
      - "Feed Store holds every entity by id and the feed's ids in order. FeedList reads the ids in range and calls loadMore; each TweetCard reads its tweet by id."
      - "Feed Client is the only caller of the tweets endpoint and hands pages to the store. Live Channel exists because of the new-tweets requirement, announced within about 10 seconds. Offline Cache, the service worker plus IndexedDB, exists because of the offline requirement."
      - Outside the browser are the Image CDN, which the cards' images come from, and the Feed API, the black box.
    draw: [c-store, list-reads-store, c-client, store-calls-client, c-live, c-cache]
    check: Does a TweetCard fetch its own tweet? Where does it get it from?
    answer: No; it reads its tweet by id from the Feed Store, and only the Feed Client calls the server.
    misconceptions:
      - "Each card fetches its own data -> the store owns the data, the client fetches pages for it, and cards read by id."
