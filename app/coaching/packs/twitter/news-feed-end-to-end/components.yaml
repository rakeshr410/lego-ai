# News feed interview, components: drawn once the mock-up and the requirements are on the board; the UI tree from the mock-up, and the store, client, live channel and offline cache the requirements call for.
id: twitter/news-feed-end-to-end/components
title: Then the components
source:
  hash: "6dee6814fbb2"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/requirements
  assumes:
    - "A TweetCard is an author row, text, an image box sized before the image arrives, and an action row with counts."
    - "The requirements are written: newest first, endless with no repeats, images only, new tweets within about 10 s behind a pill, offline reading of the last 100 tweets."
  carries:
    - "The UI: FeedScreen (shell), FeedList (virtual list), TweetCard of AuthorRow, TweetText, ImageBox and ActionRow."
    - "Behind the UI: Feed Store, Feed Client, Live Channel and Offline Cache; outside, the Image CDN and the Feed API."
    - Cards read their tweet from the store by id and never fetch; only the Feed Client calls the server.
    - The component diagram comes after the requirements, because the requirements decide what sits behind the UI.
  terms:
    - term: FeedList
      means: The virtual list that renders the tweets in range and asks for more.
    - term: Feed Store
      means: The client store holding entities by id and the feed's ordered ids.
