# News feed interview, API: the tweets endpoint written as requests (first page, then with a cursor), one page of its response written as JSON, why a cursor and not an offset, and REST over GraphQL. New tweets arriving live are the next pack.
id: twitter/news-feed-end-to-end/api
title: One endpoint and a cursor
source:
  hash: "109714c797d1"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/storage
  assumes:
    - "The Feed Store keeps tweets, users and images by id, and the order in feed ids with a cursor."
    - Feed Client is the only caller of the tweets endpoint.
    - "Initial JavaScript is budgeted at no more than 100 KB."
  carries:
    - "GET /api/tweets?limit=10, then with &cursor=c1; the limit fills about two screens, 6 on a phone and 10 on desktop; the session cookie identifies the reader."
    - "A page returns tweets, users and images by id, and nextCursor, null at the end; ten tweets are about 3 KB with Brotli."
    - "Cursor, not offset: new tweets at the top shift offsets and repeat tweets; a cursor anchored on the last tweet seen does not move."
    - REST fits this client better than GraphQL (one shape, read-heavy, HTTP caching, no client cache library in the bundle).
  terms:
    - term: cursor
      means: An opaque token from the server (the last tweet's created time and id, encoded) that says where the next page starts.
    - term: limit
      means: How many tweets a page holds, set from the viewport to fill about two screens.
