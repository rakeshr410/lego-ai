beats:
  - point: "The feed needs one endpoint, GET /api/tweets with a limit; the limit follows the viewport, about two screens, 6 tweets on a phone and 10 on a desktop, and the session cookie identifies the reader, never a token in the URL."
    kind: component
    weight: core
    teach:
      - "Everything the feed shows is a read of what one endpoint returns. Write the request: GET slash api slash tweets, with a limit. The first page has no cursor and starts from now."
      - "The limit fills about two screens, 6 on a phone, 10 on a desktop. The session cookie says who is reading; a token never goes in the URL."
    draw: [api, endpoint, limit-note]
    check: Why does the limit depend on the viewport?
    answer: So one request fills about two screens on any device.
  - point: "A page holds the tweets newest first, the users and images they refer to keyed by id, ready for the store, and the next cursor, null at the end."
    kind: component
    weight: core
    teach:
      - "Write the response as JSON, a key at a time: tweets, each with its own fields and its author and images by id; users by id; images by id with url, width and height."
      - "Then nextCursor, where the next page starts, null at the end of the feed. Ten tweets are about 3 KB compressed."
    draw: [page, res-open, res-tweet-more, res-users, res-images, res-cursor, size-note]
    check: What tells the client it has reached the end of the feed?
    answer: nextCursor comes back null.
  - point: "The next page sends the cursor: GET /api/tweets?limit=10&cursor=c1. A cursor, not an offset: five new tweets at the top would push five old ones into the next offset page and the reader would see them twice, while a cursor anchored on the last tweet seen does not move."
    kind: decision
    weight: core
    teach:
      - "Write the next request: the same endpoint with cursor c1, from the last response. The cursor marks the last tweet seen."
      - "With an offset, five tweets posted while the reader is on page 2 shift everything down five places, so page 3 starts with five tweets already seen. The cursor does not move."
    draw: [endpoint-next, cursor-note, offset-bad]
    check: Five new tweets are posted while the reader is on page 2. With offset pagination, what happens on page 3?
    answer: The five oldest tweets of page 2 shift into page 3, so the reader sees them twice; a cursor would not move.
    misconceptions:
      - "Offsets are stable because pages are fixed -> new tweets at the top shift every later position."
  - point: "REST fits this client better than GraphQL: one screen and one read-only shape, HTTP caching, and no client cache library eating into the JavaScript budget; GraphQL pays off with many screens asking for different shapes."
    kind: decision
    weight: supporting
    teach:
      - "One screen, one shape, read only: REST with HTTP caching. GraphQL would bring a client library and its own cache into a budget of 100 KB; it pays off when many screens need different shapes."
    draw: [rest-note]
    check: Name two reasons REST fits Twitter's feed better than GraphQL.
    answer: Any two of one read-only shape, HTTP caching, and no GraphQL client library in a small JavaScript budget.
