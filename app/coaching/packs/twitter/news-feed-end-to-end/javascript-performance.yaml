# News feed interview, JavaScript performance and wrap-up: the UI thread kept free (small tasks, one store update per page, only the window rendered) and what moves off it or is deferred (workers, idle callbacks, IndexedDB, the service worker, less code, stream events batched per frame), then the recap.
id: twitter/news-feed-end-to-end/javascript-performance
title: Keep the UI thread free, then recap
source:
  hash: "81ae1a727e2d"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/rendering-performance
  assumes:
    - "CPU budget: no task over 50 ms while scrolling, INP 200 ms or less; initial JavaScript 100 KB or less compressed."
    - Pages outside the in-memory window are offloaded to IndexedDB; localStorage is only for small preferences.
    - "New-tweet ids arrive over server-sent events, wait in pending ids and are counted by the pill."
    - Route splitting and one modern build were covered in the network bucket.
  carries:
    - "Never block the UI thread: keep every task under 50 ms, apply a page in one store update, render only the window, and split long loops into chunks that yield."
    - "Web Workers for genuinely heavy work (a search index, image decoding), not for parsing a 12 KB page."
    - "Background chores run in requestIdleCallback with a timeout, with a setTimeout fallback where it is not supported (Safari)."
    - "The service worker serves hashed assets and images cache-first from Cache Storage and the feed network-first, falling back to tweets in IndexedDB offline."
    - "Stream updates are buffered and applied once per animation frame; minimizing runtime state means normalizing and offloading."
  terms:
    - term: UI thread
      means: The browser's main thread, which runs JavaScript, style, layout and input handling for the page.
    - term: long task
      means: A task on the UI thread longer than 50 ms, which delays frames and the next interaction.
    - term: Web Worker
      means: A background thread for JavaScript that cannot touch the DOM; data is copied to and from it.
    - term: service worker
      means: A worker that sits between the page and the network, serving requests from Cache Storage.
