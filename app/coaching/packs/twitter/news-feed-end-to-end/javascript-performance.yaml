beats:
  - point: "Everything the reader does waits for the UI thread, so never block it: keep every task under 50 ms, apply a page to the store in one update, render only the cards in the window, and split any loop that might run long into chunks that yield."
    kind: rule
    weight: core
    teach:
      - "Scrolling, tapping like and opening a tweet all wait for the main thread. One long task, say normalizing a large page or writing to storage, delays the next frame and the reader's next tap; INP should stay at 200 ms or less."
      - "Do as little as possible per task and make the rest asynchronous: one store update per page, only the window's cards rendered, and long loops broken into chunks that yield back to the browser."
    draw: [javascript, ui-thread, input-task, render-window, one-update]
    check: What is the rule of thumb for work on the UI thread while the reader scrolls?
    answer: No task over 50 ms; do as little per task as possible, render only the window, and chunk or defer the rest.
  - point: "Move genuinely heavy work to a Web Worker, such as building a search index over cached tweets or decoding and resizing images before upload; parsing a 12 KB page is not heavy, and copying it to and from a worker would cost more than it saves."
    kind: decision
    weight: core
    teach:
      - CPU-heavy jobs on the main thread freeze scrolling. A worker runs them on another thread, but the data is copied across, and DOM work must stay on the main thread.
      - "So the worker is for big jobs: an index over thousands of cached tweets, image decoding. Not for a page of ten tweets."
    draw: [off-thread, worker]
    check: Which is worth moving to a Web Worker, parsing one 12 KB page or building a search index over thousands of cached tweets?
    answer: The search index; a small page costs more to copy to a worker than it saves.
    misconceptions:
      - "Move all data processing to a worker -> small jobs cost more to copy than they save; workers are for heavy CPU work."
  - point: "Background chores such as offloading pages to IndexedDB are scheduled with requestIdleCallback and a timeout so they run when the browser has nothing else to do; Safari does not support it, so fall back to setTimeout there."
    kind: mechanism
    weight: core
    teach:
      - "Offloading a page that left the window is a chore; run mid-scroll it costs a frame. Queue it for idle time, with a timeout so it still happens eventually."
      - requestIdleCallback is not in Safari; a setTimeout fallback covers it.
    draw: [idle, later]
    check: Why schedule offloading with requestIdleCallback, and what do you do in Safari?
    answer: So it runs when the browser is idle rather than mid-scroll; Safari lacks it, so fall back to setTimeout.
  - point: "Storage stays asynchronous: IndexedDB for anything sizeable, as in the state section, and localStorage, which is synchronous and blocks the thread, only for a few small preferences read once at start."
    kind: rule
    weight: core
    teach:
      - "Point back at IndexedDB in the state section. Its reads and writes are asynchronous; localStorage's are synchronous and would block the thread on every write of a page."
    draw: [idb-async]
    check: Why is localStorage the wrong place for offloaded feed pages?
    answer: Its reads and writes are synchronous and block the UI thread; IndexedDB is asynchronous and structured.
  - point: "A service worker between the page and the network makes repeat visits cheap and the feed readable offline: hashed assets and images are cache-first from Cache Storage, the feed endpoint is network-first, and offline the store renders the tweets saved in IndexedDB."
    kind: mechanism
    weight: core
    teach:
      - "Without it, the app does not even open offline and every visit redownloads the shell. The service worker keeps responses, the shell and images, in Cache Storage, not in IndexedDB."
      - "Hashed assets and images are cache-first. The feed is network-first; when there is no network the store reads the tweets it saved in IndexedDB. A new deploy installs a new worker with new hashed files."
    draw: [service-worker]
    check: Where does the service worker keep the responses it caches, and where do the offline tweets come from?
    answer: Responses go in Cache Storage (the Cache API); the normalized tweets the store reads offline are in IndexedDB.
    misconceptions:
      - "The service worker stores the feed in IndexedDB -> it caches request and response pairs in Cache Storage; IndexedDB holds the store's offloaded tweets."
  - point: "Ship less JavaScript: every kilobyte is downloaded, then parsed and compiled, which is costly on a mid-range phone, so route splitting and the modern build come back here, each dependency's cost is checked before it is added, and the 100 KB initial budget is enforced in CI."
    kind: rule
    weight: supporting
    teach:
      - "The cheapest main-thread work is code that never ships. Check a dependency's size before adding it, and fail the build when the initial bundle passes 100 KB compressed."
    draw: [less-js]
    check: How is the 100 KB initial JavaScript budget kept from creeping up?
    answer: Route splitting and a modern build keep it small, each dependency is checked before it is added, and CI fails the build over budget.
  - point: "To wrap up: Live Channel buffers bursts of stream events and applies them once per animation frame (the pill's count, never an insert above the reader); minimizing runtime state means normalizing and offloading; then recap the board and name the stretch topics."
    kind: flow
    weight: core
    teach:
      - "Twenty new-tweet events in a second should not mean twenty renders. Buffer them and apply them in one requestAnimationFrame: the pill's count changes once. For streamed text, the same buffering appends one chunk per frame so it grows without flicker."
      - "Minimizing runtime state is the state and storage sections together: store less by normalizing, keep less by offloading pages outside the window to IndexedDB."
      - "Then a short recap, top to bottom: mock-up, requirements, state, API, the three buckets. With time left, take the parking lot: accessibility of the virtual list first, then cache invalidation for the offline copy."
    draw: [batch-frame]
    check: Twenty new-tweet events arrive within a second. How should Live Channel update the UI?
    answer: Buffer them and apply them to the store once per animation frame, updating the pill's count once; never insert tweets above the reader.
