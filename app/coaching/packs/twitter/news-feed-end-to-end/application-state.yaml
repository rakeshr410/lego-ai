beats:
  - point: "Derive the state from the components, not from the API: walk the tree and ask what each one reads. FeedList reads the tweets in order; a TweetCard reads one tweet, its author's name and avatar, the text and time, the images and the counts."
    kind: component
    weight: core
    teach:
      - "Start from the components we just drew, not from a store shape. Walk the tree: FeedList needs the tweets, in order. Each TweetCard needs one tweet."
      - "Write what one card reads as JSON, a key at a time: the tweet's text, time and images for TweetText and ImageBox; the author with name and avatar for AuthorRow; the reply, retweet and like counts for ActionRow."
    draw: [state, naive, need-tweet, need-author, need-counts]
    check: Where do you start when deciding the client's state?
    answer: From the components; walk the tree and write down what each one reads.
  - point: "Kept as the card reads it, the state is a list of nested tweets with the author inside each; the same author is copied into every tweet they wrote, so a new avatar means updating every copy, and finding one tweet means a scan."
    kind: failure
    weight: supporting
    teach:
      - "A list of these works for one screen. But user 1 wrote ten of the tweets, so user 1 is copied ten times."
      - "A new avatar means finding and updating every copy, and finding one tweet means scanning the list."
    draw: [naive-note]
    check: In the nested shape, what does it cost when an author changes their avatar?
    answer: Every tweet that author wrote holds a copy of the author, so each must be found and updated.
  - point: "Normalize what the components read: every record gets an id and nested objects become ids (first normal form), every field lives on the record it depends on (second), which gives tweets, users and images keyed by id, each read in constant time."
    kind: decision
    weight: core
    teach:
      - "So normalize it. Open the store as JSON and add one key at a time. Tweets by id: t1 keeps its own fields, text, time and its reply, retweet and like counts, and points to its author and images by id."
      - "Users by id: u1 with name, handle and avatar, stored once. Images by id: url, width and height. That is first normal form, nested objects become ids, and second, each field lives on its own record."
      - User 1's new avatar is now one write under users, and every card that shows them reads it from there.
    draw: [feed-store, normalize, js-open, js-tweet, js-tweet-refs, js-users, js-images]
    check: An author changes their avatar. In the normalized store, how many records change?
    answer: One, the user under users; every card showing that author reads it from there.
    misconceptions:
      - "Normalizing means a full database schema -> on the client, records by id with fields on their own record are enough."
  - point: "Replies are not loaded with the feed: a replyIds key maps a tweet id to its reply ids, filled only when the reader opens that tweet's thread, since the feed shows only counts."
    kind: component
    weight: supporting
    teach:
      - "Add one more key, replyIds by tweet. It stays empty until the reader opens a thread; the card only shows the count."
    draw: [js-replies]
    check: When does replyIds get filled for a tweet?
    answer: Only when the reader opens that tweet's reply thread.
  - point: "The feed's order is not a property of any tweet, so it gets its own key: feed, with ids newest first, sorted by created time then id, the next cursor, a status, and the pending ids the new-tweets pill counts."
    kind: component
    weight: core
    teach:
      - "Last key: feed. Its ids hold the order, newest first, sorted by created time and then id, so two tweets in the same millisecond keep a fixed order."
      - "Beside the ids: the cursor for the next page, the status (idle, loading, error or end), and pending, the new tweets the pill counts. Close the store."
      - "The list reads only feed ids; each card looks its tweet up by id."
    draw: [js-feed, js-meta, js-pending, order-note]
    check: Where does the order of the feed live, and why there?
    answer: In feed ids, newest first by created time then id; order belongs to the feed, not to a tweet.
    misconceptions:
      - "Each tweet stores its position -> positions shift whenever tweets arrive; the order is one list of ids on the feed."
