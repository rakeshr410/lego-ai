# News feed interview, application state: what each component reads, written as one nested tweet, then normalized into a store written as JSON that grows key by key: tweets, users and images by id, reply ids on open, and the feed's order. Where it is stored is the next pack.
id: twitter/news-feed-end-to-end/application-state
title: Derive the state, then normalize it
source:
  hash: "078e05404c52"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/components
  assumes:
    - "A TweetCard shows an author row, text, up to four images and counts; FeedList shows the tweets in order."
    - Reply threads are out of scope; the feed shows counts only.
  carries:
    - "State is derived from the components: FeedList reads the tweets in order; a TweetCard reads one tweet: author name and avatar, text, time, images, counts."
    - "The store is normalized: tweets, users and images by id, each stored once; a tweet refers to its author and images by id."
    - "Reply ids by tweet are filled only when a thread opens."
    - "The order lives in feed ids, newest first by created time then id; the feed also holds the cursor, a status and pending ids."
  terms:
    - term: normalized store
      means: A store where each record is kept once in a map by id, and records refer to each other by id instead of nesting.
    - term: feed ids
      means: The feed's order as a list of tweet ids, newest first by created time and then id.
