beats:
  - point: Start with a drawing of what the user sees, a starting point to agree on with the interviewer; the feed is a phone screen with the app's header and tweets stacked under it, the newest at the top.
    kind: component
    weight: core
    teach:
      - "Draw a phone frame with the Twitter header at the top and tweets stacked under it: user 1's tweet, then user 2's, and more below as the user scrolls."
      - "Say what each part is for the user: the header names the app, each tweet is one card, the newest at the top, and the list carries on below."
      - Only what the screen shows. No technical detail here (loading, pages, the API, sizes); that is discussed later, once the requirements are written.
    draw: [mock-up, phone, mock-header, tweet-one, tweet-two, more-below]
    check: What does the user see on the feed screen, top to bottom?
    answer: The app's header, then tweets stacked one under another, the newest at the top, with more below as they scroll.
  - point: "Zoom into one tweet and name its parts, top to bottom: the author row (profile pic, name, handle, time), the tweet's text, its images, and the action row with reply, retweet and like, and their counts."
    kind: component
    weight: core
    teach:
      - "Break user 1's tweet into its parts, top to bottom, saying what each shows the user."
      - "The author row: who posted it, their profile pic, display name and handle, and how long ago. The text: what they wrote. The images: up to four photos with the tweet. The action row: reply, retweet and like, each with its count."
      - Only the parts and what they show. How they are built and fed comes later; no technical detail here.
    draw: [author-row, tweet-text, image-box, action-row]
    check: What are the four parts of one tweet, top to bottom?
    answer: The author row (profile pic, name, handle, time), the text, the images, and the action row with reply, retweet and like, and their counts.
asks:
  - ids: [mock-header, tweet-one, tweet-two, more-below]
    beats: [1]
    question: "Picture the Twitter home screen on a phone. What do you see, top to bottom? I'll draw it as you say it."
    hints:
      - What's at the very top of the screen?
      - And what happens as you scroll past the first couple of tweets?
  - ids: [author-row, tweet-text, image-box, action-row]
    beats: [2]
    question: "Now zoom into one tweet. What does it show, top to bottom?"
    hints:
      - Who posted it, and when?
      - And what can you do with a tweet, right under it?
task:
  prompt: Draw the Twitter feed on a phone with two tweets, and break one into its four parts.
  expects: [1, 2]
