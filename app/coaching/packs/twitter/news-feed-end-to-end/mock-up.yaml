# News feed interview, mock-up: a phone screen of tweets top to bottom and one tweet broken into its four parts. Only what the screen shows: no technical detail (loading, the API, sizes), which comes later.
id: twitter/news-feed-end-to-end/mock-up
title: Draw the feed
source:
  hash: "7563ed4c8194"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/approach
  assumes:
    - The interview designs the client of Twitter's feed; the server is a black box.
  carries:
    - "The feed is tweets stacked top to bottom on the screen, the newest at the top, with more below as the reader scrolls."
    - "A tweet shows an author row (profile pic, name, handle, time), the text, up to four images, and an action row with reply, retweet and like, and their counts."
    - The mock-up is only what the screen looks like, the parts of one tweet; how it works is discussed later, from the requirements on.
  terms:
    - term: tweet
      means: One Twitter post, short text with up to four optional images.
    - term: TweetCard
      means: The card on the screen that shows one tweet.
