# News feed interview, network performance: the request and asset path from a phone on slow 4G over HTTP/2 to a CDN, the origin and an image service, with each technique (split and modern bundles, deferred extras, Brotli, long caching, image formats and widths, fonts) placed where it acts.
id: twitter/news-feed-end-to-end/network-performance
title: Fewer bytes, fewer trips
source:
  hash: "84e5b195ad4d"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/live-updates
  assumes:
    - "Network budgets: LCP 2.5 s or less on Lighthouse mobile throttling, first load 300 KB or less, initial JavaScript 100 KB or less compressed."
    - "Pages of tweets come from GET /api/tweets; new-tweet ids come over a server-sent event stream."
    - "Attachments carry width and height; offline reading keeps images at 480 px wide."
  carries:
    - "Serve over HTTP/2 (or HTTP/3): many requests multiplex on one connection instead of queuing behind about six HTTP/1.1 connections."
    - "Split the bundle by route, ship one modern build with type=module, and load analytics after the load event."
    - "Brotli for static text, precompressed at quality 11, gzip as the fallback; never recompress images or fonts."
    - "Static files and images come from a CDN; hashed names are cached for a year as immutable."
    - "Images come from an image service in AVIF, then WebP, with a JPEG fallback, at 480, 960 or 1440 px chosen by srcset."
    - "Fonts are WOFF2, subset, font-display swap or optional, and only the one used above the fold is preloaded."
  terms:
    - term: multiplexing
      means: Many requests sent as streams over one HTTP/2 connection at the same time.
    - term: Brotli
      means: A text compression format; precompressed at its top quality it typically comes out 15 to 20 percent smaller than gzip.
    - term: CDN
      means: A content delivery network, servers close to the reader that cache static files and images.
    - term: srcset
      means: An image attribute listing the widths available, so the browser picks one for its screen.
