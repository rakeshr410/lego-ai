# News feed interview, rendering performance: the virtual list as drawn on the board (a container as tall as every tweet, two sentinels, a viewport, a pool of about 20 recycled cards placed by transform with heights cached by id), then flat selectors, compositor-only animation, reserved image boxes, a skeleton, and the accessibility caveat.
id: twitter/news-feed-end-to-end/rendering-performance
title: A constant number of nodes
source:
  hash: "b4baf7bde53b"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/network-performance
  assumes:
    - "CPU and memory budget: 25 cards or fewer in the DOM, no task over 50 ms while scrolling; CLS 0.1 or less."
    - "FeedList reads feed ids and a range of it; each TweetCard reads its tweet by id."
    - Attachments carry width and height, so a card knows its image box size before the image arrives.
    - Accessibility of the virtual list is parked as the first stretch topic.
  carries:
    - "Virtualization keeps the DOM to a pool of about 20 cards and two sentinels however long the session, so memory and style and layout costs stay flat."
    - "Two sentinels watched by an IntersectionObserver with a one-screen root margin mount the next tweets (and ask for the next page) before the reader gets there."
    - "Cards leaving the top are recycled: given new tweets and moved to the bottom with translateY; y of a card is the one above plus its height plus the gap."
    - "Heights are measured, cached by tweet id and updated by a ResizeObserver; the container is as tall as all tweets so the scrollbar is right."
    - "Flat single-class selectors, animate only transform and opacity, image boxes reserved from width and height, and a skeleton in the initial HTML."
    - "Keep DOM order equal to visual order when recycling, and use the feed pattern (aria-posinset, aria-setsize -1, aria-busy)."
  terms:
    - term: virtualization
      means: Mounting only the cards near the viewport and leaving the rest of the list as measured empty space.
    - term: sentinel
      means: An empty element at the edge of the mounted cards; when it enters the observer's margin, the list mounts more.
    - term: node pool
      means: The fixed set of card elements reused as tweets enter and leave the range.
    - term: compositor
      means: The part of the browser that moves and fades painted layers without layout or paint.
