beats:
  - point: "The rule that matters most for an endless list is a constant number of DOM nodes; draw the viewport as a frame over the tweets and two sentinels at the edges of the mounted cards, watched by an IntersectionObserver with a margin of about one screen."
    kind: mechanism
    weight: core
    teach:
      - "After 500 tweets a naive list holds tens of thousands of elements; style, layout and memory all grow and scrolling stutters. The CPU and memory line says 25 cards at most."
      - "Draw the list's container, the viewport over it, and a sentinel just above the first mounted card and just below the last. An IntersectionObserver with a root margin of about one screen fires before the reader gets there."
      - "When the bottom sentinel comes into range, the list mounts the next tweets and, if the store has none, asks for the next page. The top sentinel does the same in reverse on the way back up."
    draw: [rendering, container, space-above, top-sentinel, viewport, tweet-42, tweet-43, bottom-sentinel, space-below, observer-note]
    check: Why give the IntersectionObserver a root margin of about one screen?
    answer: So the sentinel fires a screen before the reader reaches the edge, and the next cards (or the next page) are ready in time.
  - point: "FeedList keeps a pool of about 20 card nodes and recycles them: a card that has scrolled well out of view at the top is given a new tweet and moved to the bottom instead of creating a new element."
    kind: mechanism
    weight: core
    teach:
      - Creating and discarding cards costs allocation, style and garbage collection. Instead the card that held tweet 41 is freed as it leaves the top.
      - It goes back to the pool and comes out at the bottom holding tweet 47. The DOM holds the pool and two sentinels whatever the session length, so memory stays flat.
    draw: [card-old, pool, freed, card-below, reused]
    check: After the reader scrolls through 500 tweets, how many card elements exist?
    answer: Still the pool, about 20, plus the two sentinels; cards are recycled, not created.
    misconceptions:
      - "Virtualization deletes old cards and creates new ones -> it reuses the same nodes, giving them new tweets."
  - point: "Each card is positioned absolutely and moved with translateY, at the card above's position plus its height plus the gap; heights are measured once rendered and cached by tweet id, a ResizeObserver catches later changes, and the container is set to the total height so the scrollbar is right."
    kind: mechanism
    weight: core
    teach:
      - "Cards are taken out of normal flow and placed with a transform, so moving one does not reflow its neighbours. y of card n is y of card n minus one, plus that card's height, plus the gap."
      - "Heights vary, so each card is measured after it renders and its height cached by tweet id; unseen ones use an estimate. A ResizeObserver catches a card that grows, say when text is expanded, and the positions below are recomputed."
      - The container's height is the sum of all heights and gaps, measured or estimated, so the scroll range is right even though most of the list does not exist.
    draw: [heights, transform-note]
    check: How does the list keep the scrollbar the right size when most tweets are not in the DOM?
    answer: It sets the container's height to the sum of all measured or estimated heights plus gaps.
    misconceptions:
      - "Place card n at n times a fixed height -> heights vary; positions are a running sum of measured heights cached by id."
  - point: "Keep style and layout cheap: one class per element instead of long descendant selectors, and move or animate only with transform and opacity, which can skip layout and paint and run on the compositor."
    kind: rule
    weight: core
    teach:
      - "Flat selectors, one class per element as in BEM. On its own this rarely costs much in modern engines; it matters because it multiplies with element count, which virtualization already caps."
      - "Moving or animating with top, height or margin forces layout every frame. Transform and opacity can skip layout and paint; use will-change sparingly, only on elements that really animate."
    draw: [flat-css, compositor]
    check: Why are recycled cards placed with transform rather than top?
    answer: Changing top is a layout change that reflows; a transform moves the already-painted card and can be handled by the compositor.
  - point: "Nothing jumps under the reader: image boxes take their size from the attachment's width and height (or aspect-ratio) with the placeholder colour until the image decodes, and the initial HTML carries a skeleton of three card-shaped placeholders the height of real cards."
    kind: rule
    weight: core
    teach:
      - "This serves CLS 0.1 or less. The API sent width and height, so the image box is reserved and filled with the dominant colour; the image arrives without pushing anything down."
      - "So the reader does not stare at a blank page while the JavaScript downloads, the HTML has a skeleton of three placeholders the same height as real cards; swapping them shifts nothing."
    draw: [reserved, skeleton]
    check: Which requirement do reserved image boxes serve, and what makes them possible?
    answer: Layout stability (CLS 0.1 or less); the API sends each image's width and height, so the box is sized before the image arrives.
  - point: "Recycling has an accessibility cost: screen readers follow DOM order, so keep DOM order equal to visual order when a node moves, follow the feed pattern (role feed, aria-posinset, aria-setsize -1 while more can load, aria-busy during loads), and keep the focused card mounted."
    kind: rule
    weight: supporting
    teach:
      - "A recycled node moved to the bottom by a transform can sit first in the DOM while showing tweet 47, and a screen reader loses its place. Move the node in the DOM too."
      - "This is the first stretch topic. Some large feeds give up part of the reflow savings for it, re-rendering a small window of 10 to 20 items in order."
    check: A recycled card shows tweet 47 at the bottom but is still first in the DOM. What breaks, and what is the fix?
    answer: Screen readers follow DOM order and lose their place; move the node in the DOM as well so DOM order matches visual order, and use the feed pattern's aria attributes.
