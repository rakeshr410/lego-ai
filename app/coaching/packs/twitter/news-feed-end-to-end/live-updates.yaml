beats:
  - point: "Pages are plain GETs; new tweets posted while the reader scrolls need a channel of their own. Short polling is mostly empty requests that wake the phone's radio, and long polling costs a new request per message."
    kind: decision
    weight: core
    teach:
      - "New tweets need their own channel. Lay out the options. Short polling: a request every few seconds, mostly empty, and each one wakes the phone's radio."
      - "Long polling: the server holds the request until there is news, but every message costs a new request."
    draw: [live, opt-short, opt-short-note, opt-long, opt-long-note]
    check: Why is short polling a poor fit on a phone?
    answer: Most polls find nothing, and each wakes the cellular radio, costing battery and data.
  - point: "A WebSocket is two-way, but the feed never sends on this channel and it needs stateful infrastructure; server-sent events are one-way over plain HTTP and the browser reconnects by itself, so they fit."
    kind: decision
    weight: core
    teach:
      - "A WebSocket is fast and two-way, but the feed never sends anything back, and it needs sticky connections and its own reconnect logic."
      - "Server-sent events are one-way over plain HTTP, and the browser reconnects by itself. That is the fit."
    draw: [opt-ws, opt-ws-note, opt-sse, opt-sse-note]
    check: Why server-sent events rather than a WebSocket for new tweets?
    answer: The channel is one-way, and SSE gives reconnection and replay over plain HTTP without stateful socket infrastructure.
  - point: "The stream endpoint, GET /api/tweets/stream, sends a new_tweets event with ids, not payloads; the store adds them to pending ids, the pill shows the count and the list does not move."
    kind: flow
    weight: core
    teach:
      - "Write the endpoint: GET slash api slash tweets slash stream. When two tweets are posted, the server sends their ids, not the tweets."
      - "EventSource hands them to the store, they go into pending ids, and the pill says 2 new tweets. The list stays where it is until the reader presses it."
    draw: [stream-endpoint, stream, event-source, new-ids, pill, to-pending]
    check: A new_tweets event with two ids arrives while the reader is mid-feed. What changes on screen?
    answer: The pill shows 2 new tweets; the ids wait in pending ids and the list stays where it is.
  - point: "If the connection drops, the browser reconnects and sends Last-Event-ID so missed events are replayed; over HTTP/2 the stream is one among many on a single connection."
    kind: mechanism
    weight: supporting
    teach:
      - "If the connection drops, the browser reconnects by itself and sends Last-Event-ID, so nothing is missed."
      - "Over HTTP/2 the stream shares one connection with everything else, so it never starves the page."
    draw: [sse-note, http2-note]
    check: How does the client avoid missing new tweets after a dropped connection?
    answer: The browser reconnects and sends Last-Event-ID, and the server replays the events after it.
