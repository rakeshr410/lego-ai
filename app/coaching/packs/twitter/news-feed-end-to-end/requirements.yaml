# News feed interview, requirements: the functional and non-functional lists written next to the mock-up, each non-functional line with a number the performance sections are checked against, and what is named but not designed.
id: twitter/news-feed-end-to-end/requirements
title: Two short lists, each with a number
source:
  hash: "3241195f1acf"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: twitter/news-feed-end-to-end/mock-up
  assumes:
    - "A feed is tweets top to bottom, newest first, loaded as the reader goes, with no end."
    - "A TweetCard is an author row, text, an image box sized before the image arrives, and an action row with counts."
    - Requirements are frozen once written; the components are drawn after the requirements.
  carries:
    - "Functional: newest first with counts; endless, no duplicates or gaps; images only, up to four; new tweets announced within about 10 s behind a pill; the end is announced."
    - "Non-functional, one metric a line: phones to desktops, 360 to 1440 px; LCP less than 2.5 s on a slow phone network; first load below 300 KB; initial JavaScript no more than 100 KB."
    - "Non-functional: no more than 25 cards mounted; no task longer than 50 ms while scrolling; INP less than 200 ms; CLS below 0.1; offline, the last 100 tweets readable."
    - "Named, not designed: posting, reply threads, video and polls, ranking; accessibility of the virtual list is the first stretch topic."
  terms:
    - term: functional requirement
      means: What the feed does.
    - term: non-functional requirement
      means: How well it must do it on real devices and networks, stated with a number that can be checked.
    - term: LCP
      means: Largest Contentful Paint, when the largest piece of content shows; good is 2.5 s or less.
    - term: INP
      means: Interaction to Next Paint, how long a tap or key takes to show its result; good is 200 ms or less.
    - term: CLS
      means: Cumulative Layout Shift, how much content jumps under the reader; good is 0.1 or less.
