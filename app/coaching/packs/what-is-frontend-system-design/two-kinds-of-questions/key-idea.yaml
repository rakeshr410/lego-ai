# Two kinds of question: an application prompt hands you a product, a component prompt one widget; name the shape before drawing.
id: what-is-frontend-system-design/two-kinds-of-questions/key-idea
title: Applications and components
source:
  hash: 23d940ff6fc8
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: what-is-frontend-system-design/the-client-is-the-system/key-idea
  assumes:
    - A frontend design details everything inside the browser tab and draws the server as one box known by its contract.
    - "Inside the tab the parts are views, a client store and a data-access layer that talks to the server."
  carries:
    - "A frontend prompt is either an application (a product) or a component (one widget); name which before drawing."
    - "An application prompt is about views and navigation, a server contract, data that changes under you and product priorities."
    - "A component prompt is about one widget other developers embed: its props, events and render hooks, its state and who owns its value, and its keyboard, focus and ARIA behaviour."
    - The shape decides what your interface is and where the minutes go.
  terms:
    - term: application prompt
      means: A prompt about a product, how its screens, data and a server fit together.
    - term: component prompt
      means: A prompt about one reusable widget and how it behaves for everyone who uses it, including the developers who embed it.
    - term: host page
      means: A page that embeds the component and supplies what it needs, such as the fetch for suggestions.
