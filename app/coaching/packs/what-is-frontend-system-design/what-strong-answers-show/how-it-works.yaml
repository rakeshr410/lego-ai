# What strong answers show: the trace each signal leaves on the trip board, three answers to one prompt, and the 0 to 3 scale.
id: what-is-frontend-system-design/what-strong-answers-show/how-it-works
title: What a strong answer shows
source:
  hash: 5eb51239873d
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: what-is-frontend-system-design/two-kinds-of-questions/key-idea
  assumes:
    - A frontend design details everything inside the browser tab and draws the server as one box known by its contract.
    - "An application prompt is about views and navigation, a server contract, data that changes under you and product priorities."
    - "Waiting, failure, offline and keyboard or screen-reader use are frontend questions from the start."
  carries:
    - "A reviewer looks for six signals: scoping, decomposition, browser depth, options weighed, user care and narration."
    - Each signal counts only as a trace you can point to, tied to this prompt's requirements and numbers.
    - Depth applied before the problem is sized earns little and leaves other signals empty.
    - "A choice counts as options weighed only when it sits beside alternatives, is tied to a stated requirement and names its cost."
    - "Each signal scores 0 to 3: nothing, only when prompted, unprompted but generic, unprompted and tied to this prompt."
  terms:
    - term: signal
      means: One kind of evidence a reviewer scores, such as scoping or user care.
    - term: out-list
      means: The things you say aloud you are leaving out of scope.
    - term: check-in
      means: A question to the interviewer at a turn in the session, such as whether the plan works for them.
