# The client is the system: the frontend design draws the tab in detail and the server as one box with a contract.
id: what-is-frontend-system-design/the-client-is-the-system/key-idea
title: The client is the system
source:
  hash: b5b984d15d89
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - A frontend design details everything inside the browser tab and draws the server as one box known by its contract.
    - "The server's contract covers its endpoints, its JSON shapes, how fast it usually answers and how it fails."
    - "Inside the tab the parts are views, a client store and a data-access layer that talks to the server."
    - "Waiting, failure, offline and keyboard or screen-reader use are frontend questions from the start."
    - "Bytes shipped, devices and networks take the place of a backend's capacity estimate."
  terms:
    - term: contract
      means: "What the server promises the client: endpoints, JSON shapes, usual speed and ways of failing."
    - term: client store
      means: The part of the page that holds its copy of the data, such as the trip and its places.
    - term: data-access layer
      means: The part of the page that loads and saves through the server's endpoints.
