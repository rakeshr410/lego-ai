# Infinite scroll's idea: watch a marker at the end rather than the scroll, fetch while the reader is still a screen or two away, ask once, fail in place and say when the list is over.
id: infinite-scroll-vs-pagination/infinite-scroll-mechanics/key-idea
title: Loading before the end
source:
  hash: 2373bc43ea45
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - The page is a live tree of DOM nodes; appending a node adds it to what the browser styles, lays out and paints.
  carries:
    - Waiting for the reader to reach the last card makes every batch a visible wait; the request must start a screen or two earlier.
    - A sentinel is an invisible element after the last card; an IntersectionObserver with a grown bottom margin reports when it comes within reach.
    - The next batch is requested with the cursor from the previous answer.
    - Only one request may be in flight; the observer's callback can fire again before the answer arrives.
    - A failed batch keeps every card already shown and turns the footer into a Try again button.
    - The list ends when the server returns no next cursor; the sentinel is removed and the footer says so.
  terms:
    - term: sentinel
      means: A tiny invisible element placed right after the last card, whose only job is to be observed.
    - term: IntersectionObserver
      means: A browser API that calls back when an observed element enters or leaves a region around a root such as the viewport.
    - term: rootMargin
      means: How far the observer's region is grown beyond the root's own box before the test; Secondloop grows only the bottom, by 150%.
    - term: cursor
      means: The token the previous answer returned, sent with the next request to ask for the batch after it.
    - term: batch
      means: One page of results from the server; 24 cards on Secondloop.
