beats:
  - point: If the app waits until the reader reaches the last card, every batch becomes a visible wait, so the next batch has to be requested while they are still a screen or two away.
    kind: requirement
    weight: core
    teach:
      - "User 1 is browsing Secondloop's Just listed on their phone. The first 24 cards came with the page, and nothing tells them that card 25 does not exist yet."
      - Ask only when they reach card 24 and they get a spinner and half a second of network every 24 cards; a few of those and browsing turns into waiting.
      - Ask while there is still a screen and a half below them, and the round trip happens while they are still reading.
    draw: [feed-page, viewport, card-18, card-19, card-20, card-24, late-ask]
    check: Why ask for the next batch while user 1 is still well above the last card rather than when they reach it?
    answer: So the request and the rendering happen while they are still reading, and the next cards are already in place when they get there; asking at the end shows them a spinner every batch.
  - point: Instead of watching the scroll, the app places an invisible sentinel after the last card and lets an IntersectionObserver, with its region grown 1.5 screens downward, report when the sentinel comes within reach.
    kind: mechanism
    weight: core
    teach:
      - Put a 1-pixel element right after card 24. It draws nothing; it only marks where the list ends.
      - Register it with an IntersectionObserver whose region is the viewport grown downward by 150%, about 1,170 pixels on user 1's 780-pixel screen.
      - When the sentinel crosses into that grown region the browser calls back, and the app asks for the next 24, sending the cursor from the previous answer.
      - The sentinel only reports a position. Deciding whether to fetch belongs to the pager.
    draw: [margin-zone, card-21, card-22, card-23, sentinel, pager, observer, watches, fetch-next, api, fetch-api, cursor-note]
    check: What does the sentinel do, and what decides whether a request is sent?
    answer: It is an invisible marker after the last card that the observer reports when it nears the viewport; the pager decides whether to fetch, using the cursor from the last answer.
    misconceptions:
      - "The sentinel fetches the next batch -> it only marks the end; the observer reports it and the pager decides."
      - "You still need a scroll listener to notice the sentinel -> the observer reports it by itself; no scroll handler is involved."
  - point: Only one request may be in flight, because the observer can call back again before the first answer arrives.
    kind: rule
    weight: core
    teach:
      - A round trip takes a few hundred milliseconds, and in that time the observer can report the sentinel again for the same end of the list.
      - So the trigger goes through one check first. If a request is already out, the trigger is dropped; the server hears once per batch.
    draw: [in-flight, callback, go, ignore-note]
    check: The observer's callback fires again while batch 2 is still loading. What should happen, and why?
    answer: Nothing; the pager ignores triggers while a request is in flight, otherwise the same batch would be requested twice.
  - point: A failed batch must not cost the reader what they have seen; every card stays, the loading row becomes a Try again button, and nothing retries on its own.
    kind: failure
    weight: core
    teach:
      - On a weak connection batch 4 fails. The failure is about the next batch only, so all the cards above stay where they are.
      - The footer, which said it was loading, now offers a real Try again button, and user 1 decides when to tap it.
      - Clearing the list punishes them for the network, and retrying every second could hammer a server that is already struggling.
    draw: [footer, footer-loading, footer-error, fails, kept-note]
    check: The request for the next batch fails. What should happen to the 72 cards user 1 has already scrolled past, and to the footer?
    answer: All 72 stay on screen; only the footer changes, from a loading row to a Try again button they can tap.
    misconceptions:
      - "Retry automatically until it works -> an automatic loop can hammer a struggling server; the reader taps to retry."
  - point: The list has to know when it is over, so when the server sends no next cursor the sentinel is removed and the footer says the list is complete.
    kind: rule
    weight: core
    teach:
      - With the filter Lamps within 10 miles, the third batch holds only 11 cards and the answer has no next cursor.
      - Stop observing, remove the sentinel and replace the footer with a plain line, That's all 59 lamps near you. A spinner that never stops would be a lie.
    draw: [footer-end, end-note]
    check: How does the list know it has reached the end, and what does it do then?
    answer: The server returns no next cursor; the list stops observing, removes the sentinel and says in the footer that it is complete.
