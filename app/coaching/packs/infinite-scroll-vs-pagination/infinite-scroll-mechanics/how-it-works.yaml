# How infinite scroll works: the observer against a scroll handler, the margin and its headroom, the pager's states, the sentinel that never leaves the margin, failure and the end, and what appended cards cost.
id: infinite-scroll-vs-pagination/infinite-scroll-mechanics/how-it-works
title: Sentinels, observers and pages
source:
  hash: 672a0304cf16
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: infinite-scroll-vs-pagination/infinite-scroll-mechanics/key-idea
  assumes:
    - A sentinel after the last card, watched by an IntersectionObserver with a grown bottom margin, triggers the next batch.
    - Only one request may be in flight; a failed batch keeps the cards and offers Try again; no next cursor ends the list.
    - Reading a layout value such as getBoundingClientRect after a DOM change can force a layout inside the script.
  carries:
    - The browser computes intersections from the layout it already did for the frame and queues the callback only when the state changes.
    - A percentage rootMargin is a share of the root's size, so the lead time scales in screens; headroom is the margin divided by scroll speed.
    - The pager is a state machine that starts a request only from idle and resets, aborting the request, on a filter change.
    - Entries arrive only when isIntersecting changes, so a sentinel that stays inside the margin after an append must be re-observed.
    - The end is nextCursor null, not a short batch.
    - Infinite scroll only appends; past a few hundred heavy cards the list needs windowing.
  terms:
    - term: entry
      means: One record the observer delivers per change; isIntersecting on the latest one says whether the sentinel is inside the region.
    - term: headroom
      means: The time between the trigger and the reader arriving at the old end of the list, the margin in pixels divided by scroll speed.
    - term: pager
      means: The small state machine that owns the cursor and decides whether a trigger starts a request.
    - term: re-arm
      means: Unobserving and observing the sentinel again after an append, so the browser reports its current state afresh.
