beats:
  - point: A scroll handler runs on every scroll event on the main thread and its measurements can force a layout, while an IntersectionObserver lets the browser compute the answer from the frame's layout and calls back only when it changes.
    kind: decision
    weight: core
    teach:
      - The older way listens for scroll and, each time, measures how far the end of the list is from the bottom of the window. During a fling that is many runs a second, on the thread that also has to answer taps.
      - The measuring itself, getBoundingClientRect or offsetHeight, can force a layout if the DOM changed since the last frame. Throttling it makes the trigger late.
      - The observer turns the question around. The browser already knows where everything is after layout, works out the intersection while preparing the frame and queues the callback as a task, only when the answer changes.
    draw: [two-ways, scroll-handler, observer-way, turn-around, forced-read, frame-layout]
    check: Why is an IntersectionObserver cheaper than a scroll handler that calls getBoundingClientRect?
    answer: The browser computes the intersection from layout it already did for the frame and calls back only when the state changes, so your code neither runs on every scroll event nor forces a layout.
    misconceptions:
      - "The observer's callback runs inside the scroll event -> it is queued as a task after the browser computes intersections for the frame; no scroll handler is involved."
      - "The observer runs in a worker -> it is part of the browser's own rendering update on the page."
  - point: rootMargin grows the root's box before the test, and a percentage is a share of the root's own size, so the lead stays in screens; the headroom it buys is the margin divided by scroll speed.
    kind: metric
    weight: core
    teach:
      - "Secondloop grows only the bottom: rootMargin 0px 0px 150% 0px, with the default threshold of 0, so one pixel of overlap counts."
      - On user 1's 780-pixel phone that reaches 1,170 pixels below the screen; on a 1,000-pixel desktop window, 1,500. Reading speed scales roughly with the screen, so the lead does too.
      - At a reading pace of 600 pixels a second that is 1.95 seconds of headroom against a 450-millisecond batch. A fling at 4,000 a second leaves about 160 milliseconds on the loading row.
      - If the list scrolls inside its own panel, make that panel the root, or the panel's clipping hides the margin.
    draw: [margin-math, pct-rule, screen-780, margin-1170, reading-pace, fling-pace, headroom-rule]
    check: "With rootMargin '0px 0px 150% 0px', how far below the visible area does the trigger reach on a 1,000-pixel desktop window, and why?"
    answer: 1,500 pixels, because a percentage in rootMargin is of the root's size, here the viewport.
    misconceptions:
      - "150% means 150% of the whole document -> it is of the root's box, the viewport or the scrolling panel."
  - point: The pager is a small state machine that starts a request only from idle, ignores triggers while loading, and on a filter change aborts the request in flight and starts again from the first batch.
    kind: mechanism
    weight: core
    teach:
      - The observer only reports positions; it has no idea a request is out. A small flick up and down, or a re-render that creates a new observer, fires it again.
      - "Put the decision in one place with an explicit status: Idle, Loading, Failed, Ended. Only Idle starts a request; the request carries the previous cursor, and cards are appended by id as a safety net."
      - A filter or sort change makes everything obsolete, the batch in flight included. The pager aborts it with its AbortController, clears the cards and cursor and starts from the first batch, so an old answer cannot land in the new list.
    draw: [pager-states, first-batch, idle, loading, first-ok, trigger, repeat-note, reset-note]
    check: User 1 changes the filter while batch 3 is loading. What does the pager do, and why?
    answer: It aborts the request in flight, clears the cards and the cursor, and loads the first batch for the new filter, so the old answer cannot be appended to the new list.
    misconceptions:
      - "The observer knows not to fire twice -> it only reports positions; the pager's status is what blocks a duplicate request."
  - point: The observer delivers an entry only when isIntersecting changes, so if an append leaves the sentinel inside the margin nothing fires again; re-observing after each append gets a fresh first entry.
    kind: failure
    weight: core
    teach:
      - Observing an element always delivers one first entry with its current state. After that, an entry is queued only when the state flips; moving while staying inside is not a change.
      - Usually a batch pushes the sentinel thousands of pixels down, and the next crossing is real. On a tall desktop window, or with a filter that returns a few cards, the sentinel can be inside before and after the append. The pager sits in idle and the list looks finished though the server has more.
      - "The cure: after each append, unobserve the sentinel and observe it again. If it is still in range the next batch starts at once; if not, nothing happens."
    draw: [stall, short-batch, rearm, cure, flips-only]
    check: After a short batch is appended the sentinel is still inside the margin, and no further batch ever loads. Why, and what fixes it?
    answer: Entries are queued only when isIntersecting changes, and it stayed true. Unobserving and observing the sentinel again delivers a fresh first entry, which starts the next batch if it is still in range.
    misconceptions:
      - "The observer reports where the sentinel is -> it reports when its state changes."
  - point: A failed batch keeps the cards and the cursor, and the Try again button resends the same cursor; the end is signalled by nextCursor null, not by a short batch.
    kind: rule
    weight: core
    teach:
      - Each batch gets 8 seconds; a timeout, a dropped network or a server error all land in Failed. The cards and the cursor stay, so tapping Try again asks for exactly the batch that failed.
      - Beyond the API client's one quiet retry for a transient error, nothing retries on its own. A sentinel firing into a failed state, or a timer, would keep requesting for someone who may have left.
      - A short batch is not the end, since server-side filtering can return fewer than 24 while more exist. Only nextCursor null ends the list.
      - "While a batch is appended the feed carries aria-busy true, and it must go back to false; a real button gives keyboard and switch users a way forward that does not need scrolling."
    draw: [failed, fail-retry, ended, last-batch, retry-note, aria-note]
    check: The last batch of a filtered list holds 11 cards instead of 24. Is the list over, and what tells you?
    answer: Not necessarily; filtering can return fewer than 24 while more exist. The list is over only when the server returns nextCursor null.
    misconceptions:
      - "Fewer than 24 cards means the end -> only nextCursor null ends the list."
  - point: Infinite scroll only ever appends, so a long session keeps hundreds of cards in the DOM for every style and layout pass; past a few hundred heavy items the list needs windowing.
    kind: failure
    weight: supporting
    teach:
      - Each batch adds 24 cards and none are removed. Twenty batches is 480 cards, each with an image and nested elements, and every recalculation walks them all.
      - The loader only keeps asking. Windowing keeps a few dozen in the DOM; Secondloop's home feed also stops after four batches, 96 cards, and switches to a Show more button.
    draw: [growth, per-batch, twenty-batches, grows, windowing-next, needs, cap-note]
    check: What does a long evening of infinite scroll cost the page, and what keeps it in bounds?
    answer: Every batch stays in the DOM, so style and layout walk hundreds of cards; windowing keeps only a few dozen mounted, and a cap with a Show more button limits growth.
