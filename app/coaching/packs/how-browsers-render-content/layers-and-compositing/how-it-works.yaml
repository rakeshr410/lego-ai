beats:
  - point: Paint records commands that point to nodes in four property trees, transform, clip, effect and scroll, so a transform, clip, opacity or scroll offset can change without touching the commands, and the compositor keeps its own copy of the trees.
    kind: mechanism
    weight: core
    teach:
      - Pick up where paint left off on Copperpot's page. Each drawing command is tagged with the context it is drawn in, and in Chromium that context is a place in four property trees. Commands in a row that share a context form a paint chunk.
      - "Name a node in each tree on the casserole page: the basket bar's translateY and the page's scroll offset in the transform tree, the gallery's overflow box in the clip tree, the bar's fade in the effect tree, the page and the gallery in the scroll tree."
      - The point is that those values are not baked into the commands. Change the node and everything under it moves, fades or scrolls. The compositor thread holds its own copy, so it can change a node and draw the next frame without asking the main thread.
    draw: [property-trees, transform-tree, transform-slide, transform-bar, transform-to-slide, transform-to-bar, clip-tree, effect-tree, scroll-tree, one-chunk, chunk-transform, chunk-clip, chunk-effect, chunk-scroll, chunk-points, compositor-copy]
    check: Why can the compositor scroll or fade part of the page without new drawing commands from the main thread?
    answer: Scroll offsets, transforms and opacity live in property tree nodes that the commands point to, not in the commands; the compositor has its own copy of the trees and changes the node.
  - point: After paint, layerization decides which paint chunks share a layer, merging saves GPU memory and keeping a chunk apart lets it move without the layer under it being redrawn, and Chromium splits where it expects a property to change on the compositor.
    kind: mechanism
    weight: core
    teach:
      - In current Chromium the decision comes after paint, on the compositor side of the commit, with the whole painted result in hand. This is Composite After Paint, shipped in M94.
      - Each choice has a price. Chunks merged into one layer share one bitmap and save GPU memory. A chunk kept apart can move without the layer beneath being drawn again.
      - Chromium splits where it expects change on the compositor, a scroller, a running transform or opacity animation, a will-change hint.
    draw: [layerize, paint-chunks, page-layer, own-layer, merged, kept-apart, split-where]
    check: What does keeping a paint chunk in its own layer buy, and what does it cost?
    answer: It can be moved or faded without redrawing the layer under it; it costs GPU memory, which merging chunks into one layer would save.
    misconceptions:
      - "Layers are decided while the HTML is parsed or during layout -> in current Chromium layerization runs after paint, on the painted result."
  - point: An element earns a layer through a will-change hint, a running transform or opacity animation, content such as video or a WebGL canvas, or a scroller, and anything that overlaps a composited layer and paints above it needs one too.
    kind: rule
    weight: core
    teach:
      - Go through the list on the board. Some reasons you ask for directly, will-change or a running animation; some the browser decides, a video, a WebGL canvas, an iframe, a sticky header over a composited scroll.
      - The surprise is overlap. The compositor stacks layers in a fixed order, so Copperpot's Free delivery badge, painted over the gallery, would end up hidden under it if it stayed in the page layer. It gets pulled up into a layer too. Chromium squashes overlapping elements into shared layers, but a careless hint can still multiply them.
      - will-change has the side effects the real property would. The element becomes a stacking context, and will-change transform makes it the containing block for position fixed descendants, so a fixed close button inside a promoted panel sticks to the panel.
    draw: [layer-reasons, wc-hint, running-anim, own-content, sticky-over, badge-overlap, wc-effects]
    check: A panel gets will-change transform, and its position fixed close button now scrolls with the panel. Why?
    answer: The hint has the same effects as a real transform, so the panel becomes the containing block for its fixed descendants; fixed now means fixed to the panel.
    misconceptions:
      - "will-change is only a performance hint with no visible effect -> it creates a stacking context and, for transform, a containing block for fixed descendants."
      - "Only the elements you promote get layers -> anything that overlaps a composited layer and paints above it is given a layer too."
  - point: The compositor cuts each layer into tiles and has them rastered viewport first, and it never waits for pixels, so a hard fling keeps moving on time but can show unrastered tiles as blank for a frame or two.
    kind: mechanism
    weight: core
    teach:
      - A layer can be far wider than the screen. Copperpot's gallery is five photos, about 1,965 CSS pixels. It is cut into tiles, and raster workers fill the ones in the viewport first, then the ones just outside; far ones may never be rastered.
      - At rest on photo 1, photo 2 is already rastered, so a normal swipe has every frame complete and photo 3 is queued as it comes near.
      - A hard fling reaches photo 5 in about 150 ms. The compositor still moves the layer on time, but those tiles were never rastered, so they show as plain background until raster catches up. Smooth motion, late content, and no main-thread work at all.
    draw: [tiles-region, tile-p1, tile-p2, tile-p3, tile-p4, tile-p5, gallery-width, fling-blank]
    check: During a hard fling, photo 5 shows as a blank area for a frame, yet the motion never stutters. What happened?
    answer: The compositor moved the layer on time, but photo 5's tiles had not been rastered yet; it does not wait for pixels, so they showed as background until raster caught up.
    misconceptions:
      - "A blank area while flinging means the main thread dropped frames -> the motion was on time; the tiles simply had not been rastered."
  - point: The compositor scrolls by itself unless a touch or wheel listener could call preventDefault; a non-passive listener on an element makes it ask the main thread first, while a passive listener or touch-action lets it scroll at once.
    kind: mechanism
    weight: core
    teach:
      - Threaded scrolling means the compositor turns finger and wheel input into a new scroll offset itself. A scroll listener cannot stop that, because the scroll event fires after the page has already moved.
      - A touchstart, touchmove or wheel listener can cancel the scroll, so over the area it covers the compositor must send the event to the main thread and wait. If the 180 ms reviews task is running, the swipe waits too.
      - "Passing { passive: true } promises no preventDefault, so the compositor scrolls first and runs the listener later. Listeners on window, document and body are already passive by default; the trap is one on an element like the gallery. touch-action, such as pan-y, says up front which gestures the browser may take."
    draw: [threads-scroll, compositor-thread, main-busy, asks-first, passive-rule, touch-action]
    check: An analytics script adds a wheel listener to the gallery with no options. Why can scrolling over the gallery now stall during the reviews task?
    answer: The listener might call preventDefault, so the compositor must wait for the main thread before scrolling that area; passing passive true lets it scroll at once.
    misconceptions:
      - "A scroll listener makes scrolling wait -> scroll events cannot cancel and fire after the move; touch and wheel listeners are the ones that can block."
  - point: Animating width, height, top or bottom reruns layout and paint every frame, animating background colour reruns paint, and animating transform or opacity on an already rastered layer reruns only compositing, on the compositor thread.
    kind: rule
    weight: core
    teach:
      - Take Copperpot's basket bar sliding up over 250 ms. Animating bottom changes geometry, so every frame needs style, layout and paint on the main thread. A colour or shadow skips layout but repaints every frame.
      - Moved to transform and opacity, the bar's layout never changes. Once its layer is rastered, the compositor samples the new values each frame with no layout and no paint.
      - Put the 180 ms reviews task under it. The bottom version freezes, then jumps to about nine tenths of the way up when the task ends. The transform version reaches its place on time.
    draw: [routes, route-layout, route-paint, route-composite, bar-jump]
    check: Copperpot's basket bar animates bottom while the reviews widget holds the main thread for 180 ms. What does the shopper see, and what changes if it animates transform instead?
    answer: The bar freezes, then jumps most of the way up when the task ends, because every frame needs layout and paint on the main thread; animated with transform and opacity on its own rastered layer, it is moved by the compositor and stays smooth.
    misconceptions:
      - "Transforms are fast because they run on the GPU -> they skip layout and paint because the compositor can change them on a layer that is already rastered."
      - "A slow animation of top is fine if the main thread is idle -> it still spends part of every frame on layout and paint, and any task longer than what is left drops a frame."
  - point: A layer makes moving cheap but not content changes; new content in the bar still needs a repaint, so the hint is best added just before the motion and removed when it settles.
    kind: rule
    weight: supporting
    teach:
      - Follow the bar through its life. will-change gives it a layer on the next commit, its tiles are rastered once, the transition runs on the compositor, and when it settles the hint is removed so it merges back and stops holding GPU memory.
      - If the count changes from 3 items to 4 while it is a layer, that is new content. The main thread repaints the bar and its tiles are rastered again; the only saving is that the rest of the page is not.
    draw: [layer-life, in-page, promoted, promote, count-change, promote-briefly]
    check: The basket bar has its own layer and its text changes from 3 items to 4. What work does that cause?
    answer: A repaint of the bar on the main thread and a new raster of its tiles; the layer only spares the rest of the page.
    misconceptions:
      - "Once an element has a layer, every change to it is cheap -> moving and fading are; changing its content still needs paint and raster."
task:
  prompt: Draw Copperpot's basket bar sliding up two ways, animating bottom and animating transform, and for each mark which stages run on every frame and what a 180 ms task on the main thread does to it.
  expects: [6]
