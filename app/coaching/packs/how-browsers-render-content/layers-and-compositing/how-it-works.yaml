# How the painted page becomes layers the compositor moves on its own: property trees, layerization, what earns a layer, tiles, threaded scrolling, and which stages each animated property reruns.
id: how-browsers-render-content/layers-and-compositing/how-it-works
title: Layers and the compositor
source:
  hash: "fee3bcd147c2"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - "Rendering is a chain of stages: parse, style, layout tree, layout, paint, raster, composite."
    - Paint records drawing commands; raster turns them into pixels; compositing stacks the rasterized layers into the frame.
    - Parsing, style, layout and paint run on the main thread; raster and compositing run on other threads.
    - The browser keeps every stage's output, so a change reruns only the stages whose inputs it changed.
  carries:
    - Transforms, clips, opacity and scroll offsets live in property trees the drawing commands point to; the compositor keeps its own copy.
    - Layerization, after paint, decides which paint chunks share a layer; Chromium splits where a property is expected to change on the compositor.
    - Content that overlaps a composited layer and paints above it needs a layer too; will-change also makes a stacking context and a containing block for fixed descendants.
    - The compositor cuts layers into tiles, rasters near the viewport first, and never waits for pixels, so a fast fling can show blank tiles.
    - The compositor scrolls on its own unless a non-passive touch or wheel listener could cancel the scroll.
    - Animating width or top reruns layout and paint every frame; background colour reruns paint; transform and opacity on a rastered layer rerun only compositing.
  terms:
    - term: property trees
      means: Chromium's four trees, transform, clip, effect and scroll, that hold what drawing commands point to instead of baking it in.
    - term: paint chunk
      means: A run of consecutive drawing commands that share the same property tree state.
    - term: layerization
      means: The step after paint that decides which paint chunks share a bitmap and which get a layer of their own.
    - term: tile
      means: A piece of a layer that is rastered on its own; tiles near the viewport go first.
    - term: checkerboard
      means: Tiles that reach the screen before they are rastered, drawn as plain background until raster catches up.
    - term: threaded scrolling
      means: The compositor turning input into a new scroll offset itself, without the main thread.
    - term: passive listener
      means: An event listener that promises not to call preventDefault, so the compositor need not wait for it.
