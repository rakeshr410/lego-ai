# Each pipeline stage on Copperpot's page: decoding and tokens, tree construction, style, the layout tree, layout, paint to composite, and the first load on one clock.
id: how-browsers-render-content/from-bytes-to-pixels/how-it-works
title: Each stage and what it produces
source:
  hash: "b22d5a961117"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: how-browsers-render-content/from-bytes-to-pixels/key-idea
  assumes:
    - "Rendering is a chain of stages: parse, style, layout tree, layout, paint, raster, composite."
    - Paint records drawing commands; raster turns them into pixels; compositing stacks the rasterized layers into the frame.
    - Parsing, style, layout and paint run on the main thread; raster and compositing run on other threads.
  carries:
    - The HTML parser repairs markup as it builds the DOM (inserted html, head, body and tbody), never fails, and appends nodes while bytes still arrive.
    - Selectors match the DOM the parser built, not the markup as written.
    - Style gives every element a computed value for every property, from the cascade, inheritance or the initial value.
    - "The layout tree differs from the DOM: display none makes no box, ::before makes one, display contents gives up its own, visibility hidden keeps it."
    - Widths flow down from the parent and heights flow up from the content; layout's output is geometry.
    - Paint order is not DOM order; raster works in tiles off the main thread and decodes images; moving a layer is recompositing, not repainting.
    - The first frame cannot be drawn until the stylesheets in head have arrived.
  terms:
    - term: tokenizer
      means: The state machine that reads characters and emits tokens, start tags, end tags, text, comments, to tree construction one at a time.
    - term: tree construction
      means: The parser step that places each token's node in the DOM, keeping a stack of open elements and repairing what the markup left out.
    - term: cascade
      means: The order that decides which competing declaration wins, origin and importance, then layers, then specificity, then order of appearance.
    - term: reflow
      means: A layout after the first one, rerun because something changed.
    - term: paint order
      means: The order paint records boxes in, backgrounds under borders under content, positioned boxes where their stacking context puts them.
    - term: first contentful paint
      means: The first frame showing text, an image, a non-blank canvas or an SVG from the DOM.
