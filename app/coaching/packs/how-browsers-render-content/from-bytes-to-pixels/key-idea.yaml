# The rendering pipeline's idea: a chain of conversions from bytes to a frame, who runs each stage, and which stages a change reruns.
id: how-browsers-render-content/from-bytes-to-pixels/key-idea
title: The pipeline at a glance
source:
  hash: "3b7be6a8c1e5"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "Rendering is a chain of stages: parse, style, layout tree, layout, paint, raster, composite."
    - Each stage turns one data structure into the next, from bytes to DOM and CSSOM to styles, boxes, geometry, drawing commands, tiles and a frame.
    - Paint records drawing commands; raster turns them into pixels; compositing stacks the rasterized layers into the frame.
    - Parsing, style, layout and paint run on the main thread; raster and compositing run on other threads.
    - The browser keeps every stage's output, so a change reruns only the stages whose inputs it changed.
  terms:
    - term: DOM
      means: The tree of nodes the HTML parser builds from the markup.
    - term: CSSOM
      means: The stylesheet parsed into rules, each a selector and its declarations; on its own it says nothing about any element.
    - term: computed style
      means: The value every property ends up with for one element, after matching, the cascade and inheritance.
    - term: layout tree
      means: The tree of boxes layout works on, built from the DOM and the computed styles.
    - term: display list
      means: Paint's output, drawing commands in the order they must run.
    - term: raster
      means: Running drawing commands to get pixels, tile by tile.
    - term: composite
      means: Stacking the rasterized layers, with their offsets and opacities, into the frame sent to the screen.
