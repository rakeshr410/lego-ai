# Amazon checkout interview, high level design: drawn once the requirements are on the board (the review page's mock-up opens the lesson in the requirements pack, so this pack starts at the components). The components the page splits into and what sits behind them, one shopper's run before the press, then one order attempt as states (placing, the bank's challenge, an unknown outcome, the ways placing ends), where a new key is made, the answers that change the review at submit, and leaving the flow.
id: amazon/checkout-and-payment/high-level-design
title: The components, and one order attempt
source:
  hash: "b15a03a53ad4"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/checkout-and-payment/requirements-exploration
  assumes:
    - "Tax, fraud, the payment processor and the backend are black boxes; the design is the UI."
    - "The review page is drawn; the requirements are written: totals from the quote, card data never ours, never a second order, an unknown outcome checked, Back never to a live checkout."
  carries:
    - "CheckoutPage holds AddressForm and PaymentFrame (saved cards, hosted fields, challenge dialog); CheckoutStore holds quote and attempt and feeds the page; CheckoutService alone calls the API."
    - "The page holds tokens and a quote id, never a card number or a total of its own."
    - "One order attempt: Ready, Placing, Bank challenge, Outcome unknown, Total changed, Declined, Confirmed; the key exists from Ready, retries and polls keep it, a new one comes only back at Ready."
    - "From Outcome unknown: processing means poll again, found goes to Confirmed, declined to Declined, and a 404 unknown key after 90 s sends the same key once more."
    - "After success the checkout's history entry is replaced by the confirmation URL, and Back lands on the emptied cart."
  terms:
    - term: CheckoutStore
      means: "The client store that holds the server's quote, each section's status, and the one order attempt, and gives the page what it renders."
    - term: CheckoutService
      means: "The only caller of the checkout endpoints; it adds CSRF and the Idempotency-Key, times out the submit and polls by key."
    - term: order attempt
      means: "One try at placing the order: its key, the quote id, the payment method and a status."
    - term: token
      means: "What the processor gives back for a card: a reference the page can send, never the card's digits."
