# Amazon checkout interview, requirements: the prompt as a title (the server and the processor black boxes, the UI designed), a mock-up of the review page drawn only from what this section names (the article's own screen sits in high level design; the interview order puts the mock-up before the lists, so it opens here), the clarifying questions in two short beats, the functional and non-functional lists as numbered lines with one metric a line, then the assumptions and what is out of scope.
id: amazon/checkout-and-payment/requirements-exploration
title: What checkout must do, and how well
source:
  hash: "d779a886e232"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "The interview designs the client of an Amazon-like checkout, up to an order number; tax, fraud, the payment processor and the backend are black boxes."
    - "The review page as the shopper sees it: the address, a section per shipment with its delivery options, the payment, the order summary, a gift card or promo code field and Place order."
    - "Functional: one review page edited in place; address errors by field and summary; delivery per shipment, totalled by the server; saved or new card and codes; challenge, decline, no second order."
    - "Non-functional, one metric a line: zero duplicate orders, client totals and card numbers in our code; CSP on /checkout; LCP under 2.5 s, INP under 200 ms, route JS no more than 90 KB."
    - "Resilience and access: the submit waits no more than 25 s, the outcome is known within 90 s; WCAG 2.2 AA with Redundant Entry; address fields carry autocomplete tokens; paste never blocked."
    - "Assumptions: up to 4 shipments, 2 or 3 options each; a quote lives 20 minutes. Out: settlement, signing in, cart editing, a stay's re-check, wallets, tax, fraud and stock holds."
  terms:
    - term: quote
      means: The server's priced total for the cart, with an id; the client shows it and sends the id back with the order.
    - term: payment processor
      means: The outside service whose own fields take the card number and security code, so they never reach our code.
    - term: bank challenge
      means: "A 3-D Secure check the card's issuer may ask for to confirm the cardholder; the page shows it and carries on with the same attempt."
    - term: LCP
      means: Largest Contentful Paint, when the largest piece of content shows.
    - term: INP
      means: Interaction to Next Paint, how long a tap or key takes to show its result.
