beats:
  - point: "The prompt is checkout and payment for an Amazon-like marketplace, up to an order number; tax, fraud, the payment processor and the backend are black boxes, so what we design is the UI in the browser."
    kind: rule
    weight: core
    teach:
      - "Write the title: design the Amazon checkout and payment. A shopper starts from the cart and finishes with an order number."
      - "Tax, fraud, the payment processor and the backend are black boxes; we design the UI that runs in the browser. Then go straight to the mock-up."
      - Two or three sentences, no question, and nothing about how the board is laid out; the learner sees that from the board itself.
    draw: [title]
  - point: "Start with what the shopper sees: one review page with the address, a section for each shipment with its delivery options, the payment, and beside them the order summary, a gift card or promo code field and Place order."
    kind: component
    weight: core
    teach:
      - "Draw the review page as the shopper sees it, everything on one page. First the address the order goes to, typed in or picked from the saved ones."
      - "Under it, one section per shipment, here two, each offering its delivery options. Then the payment: a saved card, or a new one."
      - "Beside them, the order summary listing items, discounts, shipping, tax and the total, a field for a gift card or promo code, and Place order. Only what the screen shows; how it works comes later."
    draw: [review, rp-deliver, rp-ship1, rp-ship2, rp-paying, rp-summary, rp-promo, rp-place]
    check: What does the shopper see on the review page?
    answer: "The address, a section per shipment with its delivery options, the payment, and beside them the order summary, a gift card or promo code field and Place order."
  - point: "A few questions shape the design: up to 4 parcels; a saved or new card plus a gift card or promo code; card numbers only in the processor's fields; a possible bank challenge; totals from the server as a quote; one order per intent to buy."
    kind: requirement
    weight: supporting
    teach:
      - "Ask before writing. One order may ship in up to 4 parcels. Payment is a saved or new card, with a gift card or promo code on top; wallets and pay-later wait for a later round."
      - "Card numbers are typed into the processor's own fields, which keeps PCI DSS work small; we keep brand, last four and expiry. The issuer may ask for a 3-D Secure challenge, after which the same attempt goes on."
      - "The server prices everything as a quote with an id, and one intent to buy must make one order. The lists hold the details; say the questions briefly and move on."
    check: Where is a new card number typed, and what do we keep of it?
    answer: "Into the payment processor's own fields; we keep only the brand, the last four digits and the expiry."
    misconceptions:
      - "Our form can take the card number and pass it on -> card numbers and security codes go into the processor's own fields and never reach our code, servers or logs; we keep brand, last four and expiry."
  - point: "Functional, first half: one review page edited in place; address errors by the field and in a top summary, with a suggestion to take or ignore; delivery per shipment, totalled by the server; a saved or new card, and codes the server accepts or rejects."
    kind: requirement
    weight: core
    teach:
      - "Now the requirements, one numbered fact a line, the functional list first. One review page holds the address, a delivery choice for each shipment, the payment and the summary, and each section is changed right where it sits."
      - "The address is typed or picked; errors appear beside the field and in a summary at the top, and the server's suggestion can be taken or ignored. Delivery is chosen per shipment, and the server works out the new total."
      - "Payment is a saved card or a new one, plus a gift card or promo code that the server accepts, or turns down with a reason."
    draw: [requirements, fr-heading, fr-review, fr-address, fr-delivery, fr-pay]
    check: The shopper picks a faster delivery option for one shipment. Who works out the new total?
    answer: The server; the page sends the choice and shows the total that comes back.
    misconceptions:
      - "The page adds the new shipping price to the total itself -> the server recomputes the total for every delivery choice."
  - point: "Second half: a bank challenge returns to the same attempt; a decline keeps everything and points at payment; no press, reload or lost answer makes a second order; changes are confirmed again; after success an order number, and Back never to a live checkout."
    kind: requirement
    weight: core
    teach:
      - "A bank challenge is done in a labelled dialog or on the bank's own page, and comes back to the same attempt. A decline clears nothing and sends the shopper to the payment section."
      - "Pressing twice, reloading or losing the connection never creates a second order. When the outcome is unknown, the page checks it; it never retries blindly."
      - "If the price, the stock or a promo changed, the shopper sees what changed and confirms again before any charge. After success an order number shows, Back does not lead to a live checkout, and the confirmation opens again from its own URL."
    draw: [fr-challenge, fr-decline, fr-once, fr-changed, fr-after]
    check: The shopper presses Place order and the connection drops before any answer comes. What must the page do?
    answer: Check whether that attempt created an order, without submitting it again.
    misconceptions:
      - "After a lost answer, press Place order again for the shopper -> an unknown outcome is checked, not resubmitted; a blind retry could make a second order."
  - point: "Non-functional, money and safety first, one metric a line: duplicate orders and client-computed totals must stay at zero, card numbers in our JS, logs or URLs must be zero, CSP must be enforced on /checkout, the submit should wait no more than 25 s and the outcome be known within 90 s."
    kind: metric
    weight: core
    teach:
      - "Now the non-functional list, one metric per line, each tied to its target. Duplicate orders must stay at zero, and so must totals computed on the client: one order per intent, at a total the server quoted."
      - "Card numbers in our JavaScript, logs, URLs or analytics must be zero, since card data never enters our code, and CSP must be enforced on the checkout route, so only our scripts and the processor's run."
      - "A slow or dropped submit must end in a known outcome: the submit should wait no more than 25 seconds, and the outcome should be known within 90. Read each line, then one short sentence on what it protects."
    draw: [nfr-heading, nfr-duplicates, nfr-totals, nfr-cards, nfr-csp, nfr-timeout, nfr-outcome]
    check: Why is "totals computed on the client" a metric whose target is zero?
    answer: Every amount the shopper is charged must be one the server quoted; the client shows money, it never calculates it.
  - point: "Then speed and access, on a mid-range phone over 4G with a cold cache: LCP should be less than 2.5 s, INP less than 200 ms, route JS no more than 90 KB before the SDK; WCAG 2.2 AA and Redundant Entry should pass; every address field has an autocomplete token, and paste is never blocked."
    kind: metric
    weight: core
    teach:
      - "Measured on a mid-range phone over 4G with a cold cache: LCP should be less than 2.5 seconds, so the review paints fast; INP less than 200 milliseconds, so Place order answers at once; route JavaScript no more than 90 KB compressed, before the processor's SDK."
      - "Accessibility should meet WCAG 2.2 AA, by keyboard and screen reader on every step, the bank's dialog too, and Redundant Entry, criterion 3.3.7, should pass."
      - "Address and card fields should autofill in one go: every address field should have an autocomplete token, and paste should never be blocked."
    draw: [nfr-lcp, nfr-inp, nfr-js, nfr-wcag, nfr-redundant, nfr-autofill, nfr-paste]
    check: Which step is easy to forget when you check keyboard and screen reader access here?
    answer: "The bank's challenge dialog; the requirement covers every step, the dialog included."
  - point: "Pin the numbers, up to 4 shipments with 2 or 3 options each and a quote that lives 20 minutes, and name what is out: settlement, signing in, editing the cart, a stay's re-check, wallets and the payment sheet, tax, fraud scoring and stock holds."
    kind: rule
    weight: supporting
    teach:
      - "Write the assumptions for the exercise: up to 4 shipments an order, each with 2 or 3 options; a quote lives 20 minutes, then the server prices it again. The 25 second submit wait and the 90 second checking window are already on the list."
      - "In scope: the review page and its sections; the address form with autofill, checks and the suggestion; delivery per shipment priced by a quote; saved cards by token and a new card in an iframe; codes; the bank challenge in a dialog, or a redirect and a resume; a Place order safe to repeat; the failures at submit; and the confirmation and Back."
      - "Out of scope: charging, ledgers and settlement; signing in, a topic of its own; editing cart lines; a stay's price and availability re-check, which is the Airbnb reserve flow; wallets and the browser's payment sheet, which are later work; and tax, fraud scoring and stock holds."
    draw: [scope, as-heading, as-shipments, as-quote, out-heading, out-charging, out-signin, out-stay, out-wallets, out-tax]
    check: The interviewer asks how the payment is settled with the bank. What fits the plan?
    answer: Say charging, ledgers and settlement are out of scope, behind the black box, and carry on with the client.
asks:
  - ids: [rp-deliver, rp-ship1, rp-ship2, rp-paying, rp-summary, rp-promo, rp-place]
    beats: [2]
    question: "Picture the checkout page for an order of two parcels. What does the shopper see on it? I'll draw it as you say it."
    hints:
      - What do they check before paying, from the address down?
      - And what sits beside it all, with the money?
  - list: fr-list
    beats: [4, 5]
    question: "What should this checkout let the shopper do, from the review page to the order number? Tell me one at a time, and I'll write them down."
    hints:
      - Think about each part of the page, the address, the delivery and the payment.
      - And what can go wrong once they press Place order?
  - list: nfr-list
    beats: [6, 7]
    question: "Now, how well must it work? Name a quality, and a number if you have one in mind."
    hints:
      - Think about money and card data first.
      - Then the phone it runs on, and a slow or dropped network.
task:
  prompt: "Write the functional and non-functional lists as numbered lines, one short line each and a target on every non-functional line, then the assumptions and what is out of scope."
  expects: [4, 5, 6, 7]
