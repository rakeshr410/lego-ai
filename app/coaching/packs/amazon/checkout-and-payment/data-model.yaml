beats:
  - point: "Derive the state from the components, written as what each reads: AddressForm the typed address and its errors, PaymentFrame gives a token with brand and last four, CheckoutPage the quote and section statuses, CheckoutService the one order attempt."
    kind: component
    weight: core
    teach:
      - "Start from the components we drew and write what each one reads, as JSON. AddressForm: the address as it was typed, and its errors. PaymentFrame gives back a payment method token, the brand and the last four, never the card itself."
      - "CheckoutPage: the quote, which comes from the server, and each section's status. CheckoutService: the order attempt, which belongs to the client and has to outlive a reload or a trip to the bank's page."
    draw: [state, need-address, need-payment, need-summary, need-attempt]
    check: Where do you start when deciding the checkout's state?
    answer: "From the components and what each reads: the typed address and its errors, a payment token, the server's quote with section statuses, and the order attempt."
  - point: "The store keeps the quote exactly as the server sent it, its id, expiry, currency, shipments, total rows, total_minor in minor units and the promo results; the page formats those amounts and adds nothing up."
    kind: component
    weight: core
    teach:
      - "Open CheckoutStore as JSON, a key at a time. First the quote, as sent: its id, when it expires, twenty minutes on, and the currency. Then the shipments, each with its line ids, options and the selected one."
      - "The rows, each a kind, a label and an amount: items, promo, shipping, tax. The total in minor units: 14363 is 143 dollars and 63 cents. And what happened to each promo code."
      - The page formats those amounts with the locale's currency formatter; it never adds them up or rounds them itself.
    draw: [store-json, js-quote, js-quote-more]
    check: The summary has to show 14363 in US dollars. What does the page do with that number?
    answer: "Formats the minor units with the locale's currency formatter; it adds nothing up and recomputes nothing."
    misconceptions:
      - "Recompute the total from the rows to double-check -> the client formats amounts, it never calculates them."
  - point: "Beside the quote sit quote_status, which is fresh, refreshing or stale, and a status for each section of the review: complete, editing or invalid."
    kind: component
    weight: supporting
    teach:
      - "Add quote_status: fresh, refreshing or stale. Then sections, one status per section of the review: complete, editing or invalid."
      - There is one such state per checkout tab.
    draw: [js-status, js-sections, js-sections-more]
    check: What can a section's status be?
    answer: Complete, editing or invalid.
  - point: "The address draft holds what was typed, kept through errors, and the payment choice is a reference, never card data: saved or new card, the payment_method_id token, brand, last four and expiry; the attempt and the errors close the store."
    kind: component
    weight: core
    teach:
      - "Add address: full name, two lines, city, region, postal code and country; it is what was typed, and it stays while there are errors."
      - "Add payment: a saved card or a new card, the payment method id, which is a token, then the brand, last four and expiry. That is all the store ever knows about a card. Close the store with the attempt and the errors."
    draw: [js-address, js-address-more, js-payment, js-payment-more, js-attempt]
    check: The shopper typed a new card into the processor's fields. Which parts of it end up in CheckoutStore?
    answer: A payment method token, the brand, the last four digits and the expiry; never the number or the security code.
    misconceptions:
      - "Keep the number and expiry so the form can be refilled after a decline -> the processor's iframe keeps what was typed; the store holds only the token, brand, last four and expiry."
  - point: "The order attempt, an idempotency key from crypto.randomUUID with the quote_id, the payment_method_id, a status and later the order id, is written to this tab's sessionStorage before the first request, so a reload or the bank's redirect can still ask about that key."
    kind: mechanism
    weight: core
    teach:
      - "Now where it is kept. Draw sessionStorage, this tab only, and write the attempt: its idempotency key, made with crypto.randomUUID, the quote id, the payment method id, a status, and the order id once one exists. The status is submitting, challenge, checking, confirmed, declined or repriced, the states drawn earlier."
      - "Write it before the first request leaves, not when the answer comes back. A reload or the bank's redirect can strike while the request is still out, and the page then needs the key to ask what happened."
      - "Think of an attempt as three things together: quote id, payment method id and key. A new quote or a new card means a new key; sending the same three again gets the same answer back."
    draw: [storage, session-json, ss-open, ss-more, ss-note]
    check: The bank's redirect takes the tab away while the order request is still out. What lets the page find out what happened when it comes back?
    answer: The attempt and its key were saved to this tab's sessionStorage before the request left, so the page reads the key and asks the server by it.
    misconceptions:
      - "Save the attempt once the answer arrives -> the answer may never arrive; the key has to be stored already while the request is out, which is when a reload or redirect hits."
  - point: "Each kind of data has one home: card number and code only in the processor's iframe; token, brand, last four and expiry in the store and the order; the quote only as sent; the key in the store and this tab's sessionStorage; the address draft in the store, never analytics."
    kind: rule
    weight: core
    teach:
      - "Card number and security code: the processor's iframe, then the processor; never our JavaScript, servers, URLs, logs, analytics or session replay. Token, brand, last four and expiry: the store and the order, outside PCI scope."
      - "Quote and totals: the store, only as the server sent them, never anything the client computed. The key: the store and this tab's sessionStorage; never localStorage, cookies, or anything built from personal data. The address draft: the store, the address book only when asked, never analytics payloads."
    draw: [where-card, where-token, where-quote, where-key, where-address]
    check: Where may the card number appear on our side?
    answer: "Nowhere: it lives in the processor's iframe and the processor, never in our JavaScript, servers, URLs, logs, analytics or replay."
    misconceptions:
      - "The idempotency key can go in localStorage -> it belongs to this tab's attempt, so it lives in the store and this tab's sessionStorage only."
