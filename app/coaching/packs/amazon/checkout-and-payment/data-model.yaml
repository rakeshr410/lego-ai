# Amazon checkout interview, data model: what each component reads, written as JSON lines, then CheckoutStore written as JSON that grows key by key (the quote as the server sent it, statuses, the address draft, the payment choice by token, the attempt). Where it is kept is its own area: the attempt in this tab's sessionStorage, and where each kind of data may and may not live.
id: amazon/checkout-and-payment/data-model
title: A quote, a draft and one attempt
source:
  hash: "56064f01e299"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/checkout-and-payment/high-level-design
  assumes:
    - "CheckoutStore holds the server's quote and the one order attempt and feeds the page; PaymentFrame hands back tokens, never card data."
    - "The attempt's states are drawn: Ready, Placing, Bank challenge, Outcome unknown, Total changed, Declined, Confirmed; the page asks by key when the outcome is unknown."
  carries:
    - "State comes from who owns it: money from the server as a quote, what the shopper typed from the form, the order attempt from the client."
    - "CheckoutStore: the quote as sent (amounts in minor units), quote_status, each section's status, the address draft, the payment choice by token, the attempt and the errors."
    - "An attempt is quote_id, payment_method_id and key together; a new quote or a new card means a new key."
    - "The attempt is written to this tab's sessionStorage before the first request; card numbers live only in the processor's iframe."
  terms:
    - term: minor units
      means: "Amounts as whole numbers of the currency's smallest unit: 14363 is 143 dollars and 63 cents."
    - term: order attempt
      means: "The triple of quote_id, payment_method_id and idempotency key, with its status and, once there is one, the order id."
    - term: payment_method_id
      means: "The processor's token for a card: a reference the page may keep and send, never card data."
