# Amazon checkout interview, interface definition: plain HTTP from CheckoutService, then the quote, address check and order calls written as requests with JSON answers. Polling by key and the error codes get their own area: which answers keep the attempt's key and which need a new one. What passes between components, and the two components' props, each get a small area of their own.
id: amazon/checkout-and-payment/interface-definition
title: Four calls and a key
source:
  hash: "4de938082426"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/checkout-and-payment/data-model
  assumes:
    - "CheckoutService is the only caller of the network; the attempt is quote_id, payment_method_id and key, saved before the request."
    - "Totals come only from the server's quote, in minor units; the payment choice is a token."
  carries:
    - "Plain HTTP from CheckoutService, each call with the CSRF token and session cookie: POST for quotes and orders, GET by key for status; polling only while the outcome is unknown, up to 90 s."
    - "POST /api/checkout/quote whenever money changes, a newer call aborting the older; a rejected code is still a 200. POST /api/addresses/verify offers a suggestion."
    - "POST /api/orders with an Idempotency-Key: 201 confirmed, 202 requires_action, 402 card_declined; a repeat with the same key gets the first answer."
    - "GET /api/orders/by-key/{key}: processing, confirmed or declined, or 404 unknown_key, trusted only after 90 s."
    - "400, 401, 409 attempt_in_progress, 5xx and timeouts keep the key; 402, 409 quote_changed, 409 out_of_stock, 410 and 422 lead to a new key."
    - "AddressForm takes purpose, country, errors, suggestion, onSubmit and variant; PaymentFrame's props never carry card digits, only completeness, brand, last four and a token."
  terms:
    - term: Idempotency-Key
      means: "The request header that names one order attempt; the server returns its first answer to any repeat of it."
    - term: polling by key
      means: "Asking GET /api/orders/by-key/{key} what happened to an attempt, without placing it again."
    - term: requires_action
      means: "The 202 answer to an order the bank wants to challenge; the challenge runs, then the page polls by key."
    - term: publishable key
      means: "PaymentFrame's processorKey: a key that can only create tokens."
