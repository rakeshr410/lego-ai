# Amazon checkout interview, optimizations: the priority rubric that picks five deep dives, then each as a row of techniques under a short heading: a Place order safe to repeat and an unknown outcome checked, card data and page hardening, form UX and accessibility, the bank's challenge and coming back, and the review page's speed. The lesson opens on the board so far: the review page, the scope, the requirements, the components and the order attempt's states with all their arrows, and CheckoutStore's JSON; the API, storage, polling and errors areas stay with lesson 2 so the kept board stays under 120 ids.
id: amazon/checkout-and-payment/optimizations
title: Where a bug costs money or trust
source:
  hash: "46e0ae259112"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/checkout-and-payment/interface-definition
  assumes:
    - "The attempt is quote_id, payment_method_id and key, saved to sessionStorage before the request; the server answers a repeated key with its first answer."
    - "Targets: zero duplicate orders, zero card numbers in our code, LCP less than 2.5 s, INP less than 200 ms, route JS no more than 90 KB before the SDK."
    - "GET /api/orders/by-key/{key} tells an unknown outcome without placing the order again; Outcome unknown on the board polls it."
  carries:
    - "Areas are scored 1 to 3 on money or trust lost, shoppers affected and how often; the top five get a deep dive, and internationalisation is covered elsewhere."
    - "One key per attempt, saved before the POST, and the store's in-flight flag; an unknown outcome is polled at 1.5 s, 3 s, then every 5 s up to 90 s."
    - "Hosted card fields, a CSP on /checkout that allows only our scripts and the processor, SRI on our versioned bundles, no third-party tags, and nothing card-shaped in telemetry."
    - "Shipping autocomplete tokens, billing same as delivery by default, an error summary that takes focus, and focus moved to where the fix is."
    - "The challenge in a labelled dialog, unsandboxed; a redirect resumes from the stored attempt. The review is server-rendered with its quote, and the SDK loads after first paint."
  terms:
    - term: in-flight flag
      means: "The store's status, set at once when Place order is pressed, so further presses are ignored until the attempt ends."
    - term: CSP
      means: "The checkout route's policy header: scripts from our origins, a nonce and the processor; frames from the processor and its challenge host; connections to our API and the processor's."
    - term: SRI
      means: "The sha384 integrity hash, with crossorigin, on our versioned bundles; the processor's SDK, updated in place, is allowed by origin instead."
