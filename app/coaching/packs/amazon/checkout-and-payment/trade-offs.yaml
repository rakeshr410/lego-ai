# Amazon checkout interview, trade-offs: the seven choices an interviewer will push on, each written as the chosen option and what it beat (page structure, card fields, when the key is made, after an unknown outcome, the challenge, Back after paying, who computes totals), then a short recap of what the board holds.
id: amazon/checkout-and-payment/trade-offs
title: The choices, and what they cost
