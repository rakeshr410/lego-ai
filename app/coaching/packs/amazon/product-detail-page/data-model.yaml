beats:
  - point: "Derive the state from the components: Gallery reads the product's media, VariantPicker its option groups and SKUs, BuyBox the price, stock and delivery of the picked SKU, and the header badge the cart's count."
    kind: component
    weight: core
    teach:
      - "Start from the components on the board, not from an API. Walk them and write what each one reads, as JSON, a key at a time."
      - "Gallery reads the product's media; VariantPicker its option groups and which SKUs exist; BuyBox the price, stock and delivery of the SKU that is picked; the badge the cart's count."
    draw: [data-model, naive, need-product, need-skus, need-cart]
    check: Where do you start when deciding the page's state?
    answer: From the components; walk them and write down what each one reads.
  - point: "Kept as the components read it, the price sits inside the product; but the product is rendered into the shell, cached a day and purged only on edits, so a price inside it would go stale or force constant purges."
    kind: failure
    weight: supporting
    teach:
      - "This shape puts price and stock on each SKU of the product. But the product is what the catalog shell is rendered from, cached for a day and purged only when the product is edited."
      - "A price inside it would be up to a day old, or the shell would need a purge every time a price moved."
    draw: [naive-note]
    check: Why does the catalog's product carry no prices?
    answer: "The product lives in the shell, kept a day and purged only when it is edited; a price there would either be out of date or need a purge every time it moved."
  - point: "So split by lifetime: the catalog holds the product with its media, option groups and SKUs, and no prices; a SKU is one buyable combination, and a combination that is never made simply has no SKU."
    kind: decision
    weight: core
    teach:
      - "Split it by lifetime: the catalog is cached for a day, the offers for seconds, and the rest lives in the tab. Open the store as JSON. The catalog first: the product's id, KW2210, its title and brand, and its media, each with a kind, width, height and alt text."
      - "Option groups, each with a key such as finish, a label, a kind, swatches or tiles, and its values. Then the SKUs: each has an id such as KW-BLK-09, its option values and its media ids."
      - "A combination that is never made has no SKU at all. And no prices anywhere in the catalog."
    draw: [store, normalize, js-open, js-media, js-options, js-skus, life-note]
    check: How does the catalog say that a combination is never made?
    answer: There is simply no SKU for it.
  - point: "Offers are a separate type, one per SKU, the whole product's map at once: the price in minor units with a currency, the availability, a stock hint only when low, the delivery, public or private scope and when it was true; only the SKU id joins them to the catalog."
    kind: component
    weight: core
    teach:
      - "Next key: offers, by SKU id. KW-BLK-09's price is an amount in minor units, 4800, with its currency, USD. Availability is in_stock, low_stock or out_of_stock, and stock_hint, 3, appears only when stock is low."
      - "Then the delivery window, the scope, public or private, and as_of, when the offer was true. One offer per SKU, and the whole product's map comes at once."
      - "Catalog and offers meet only at the SKU id: one is cached for a day, the other for seconds."
    draw: [js-offers, js-offer-price, js-offer-more, js-offer-tail, join-note]
    check: What joins the catalog to the offers?
    answer: Only the SKU id.
    misconceptions:
      - "An offer is fetched when its variant is picked -> there is one offer per SKU, and the whole product's map comes at once."
  - point: "KW2210's matrix is three finishes by three capacities, nine cells: eight SKUs and one never made; steel 0.6 L and black 1.2 L are sold out, black 0.9 L has 3 left, and copper 0.6 L does not exist."
    kind: component
    weight: core
    teach:
      - "Write the matrix, a line per finish, with the capacities 0.6, 0.9 and 1.2 litres and each SKU's price."
      - "Brushed steel: 0.6 L sold out, 0.9 L at $48, 1.2 L at $54. Matte black: 0.6 L at $42, 0.9 L at $48 with 3 left, 1.2 L sold out. Copper: 0.6 L never made, 0.9 L at $58, 1.2 L at $64."
      - "The page answers every question about this grid from data it already has: which SKUs exist from the catalog, their stock from the offers."
    draw: [matrix, m-steel, m-black, m-copper]
    check: How many SKUs does KW2210 have, and why not nine?
    answer: Eight; copper 0.6 L is never made, so it has no SKU.
  - point: "An option's status is judged against the picks in the other groups, never its own: no matching SKU means not made, all matching SKUs out of stock means sold out; both strike the option, which stays focusable, with different words, and the status is derived, never stored."
    kind: rule
    weight: core
    teach:
      - "To mark a capacity, look at the SKUs with that capacity that match the other groups' picks. None: not made. All of them out of stock: sold out. Otherwise it is available."
      - "Its own group is never part of the test, so the shopper can always move to another value in the same group. An offer that hasn't arrived yet counts as buyable; the server checks at the add."
      - "Either way the option is struck but stays on screen and can still take focus; only the words change. Sold out can end when stock returns, while a combination that was never made will not appear, so there is no point waiting. The status is worked out each time, never stored."
      - "When the offers are refetched, the statuses are worked out again: a shopper back on the tab after twenty minutes finds black 0.9 L sold out, and the pick is cleared with a message before Add is pressed."
    draw: [m-rule, m-status, m-words, status-note]
    check: "With copper picked, how is the 0.6 L capacity shown?"
    answer: "Struck and still focusable, with not available in copper rather than sold out, because that combination is never made."
    misconceptions:
      - "Not made and sold out are the same state -> both strike the option, but one can come back and the other never will, so the shopper is told which."
      - "Store each option's status -> it is derived from the SKUs, the offers and the other picks every time."
  - point: "The selection is the picks by group, null for a cleared one, and the SKU derived from them, mirrored in the query string; a new pick that makes another group's pick impossible clears it to null."
    kind: component
    weight: core
    teach:
      - "Next key: selection. The picks by group, finish black and capacity null, because the switch to black cleared it. The SKU is derived from the picks, null until every group has one."
      - "VariantPicker owns it, and it is mirrored in the query string. When a pick in one group makes another group's pick impossible, that pick becomes null."
    draw: [js-selection, js-picks, m-clear]
    check: "The shopper switches to matte black with 1.2 L picked. What does the selection hold afterwards?"
    answer: "Finish black, capacity null and SKU null; 1.2 L was impossible in black, so it was cleared."
  - point: "The cart state holds the confirmed count and the cart version from the server, plus the pending adds, each with its add id, SKU, quantity and status; the badge is the confirmed count plus the pending quantities."
    kind: component
    weight: core
    teach:
      - "Last key: cart, which CartStore owns. The confirmed count and the version, as the server last gave them."
      - "Pending holds the adds sent but not confirmed, each with its add_id, SKU, quantity and status, sending or retrying. Close the store."
      - "The badge is the confirmed count plus the pending quantities. Undoing an add just takes it out of pending; nobody has to work out what the number should go back to."
    draw: [js-cart, js-pending, badge-note]
    check: How is the badge's number computed while an add is in flight?
    answer: The server's confirmed count plus the quantities of the pending adds.
    misconceptions:
      - "A counter goes up on every press -> the badge is the confirmed count plus pending adds, so a failed add is simply removed from pending."
