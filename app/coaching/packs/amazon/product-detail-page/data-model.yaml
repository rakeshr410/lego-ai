# Product detail page interview, data model: what the components read, written first as JSON, then split by lifetime into a client store that grows key by key (the catalog with no prices, offers by SKU, the selection, the cart's pending adds), with the variant matrix and the rule that marks each option.
id: amazon/product-detail-page/data-model
title: Catalog, offers and the picks
source:
  hash: "8b28fb2a1658"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/product-detail-page/high-level-design
  assumes:
    - "VariantPicker and BuyBox read from PricingService's offers map; CartStore holds what the badge shows."
    - "The catalog shell is cached a day and purged on edit; public offers 30 s; private offers never in a shared cache."
    - "An impossible pick is cleared and said; the URL keeps the selection."
  carries:
    - "The catalog (product, media, option groups, SKUs) has no prices; offers are one per SKU, the whole product's map at once; the two are joined only by the SKU id."
    - "An offer's price is amount_minor and currency; availability is in_stock, low_stock or out_of_stock; stock_hint only when low; scope public or private; as_of."
    - "KW2210 is three finishes by three capacities: nine cells, eight SKUs, copper 0.6 L never made."
    - "An option's status, available, sold_out or not_made, is judged against the other groups' picks, and derived, never stored."
    - "Selection is the picks by group, null when cleared, and the SKU derived from them, mirrored in the query string."
    - "The cart state is the confirmed count, the version and pending adds keyed by add_id; the badge is confirmed plus pending."
  terms:
    - term: variant matrix
      means: The product's finishes by its capacities, each cell either a SKU or a combination never made.
    - term: option status
      means: "available, sold_out or not_made, worked out for each option value from the SKUs, the offers and the other picks."
    - term: pending add
      means: An add sent but not yet confirmed, kept by its add_id and counted in the badge.
