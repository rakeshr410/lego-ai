beats:
  - point: "With the requirements written, the drawing becomes components: ProductPage is the route shell, Gallery, VariantPicker and BuyBox sit above the fold and hydrate first, and BelowFold holds what comes as the shopper scrolls."
    kind: component
    weight: core
    teach:
      - "Now turn the mock-up into components, inside the browser. ProductPage is the shell for the product's route: it reads the selection from the query string, decides which parts hydrate when, and keeps the URL in step with the picks."
      - "Above the fold, hydrated first: Gallery, the hero image, thumbnails and video; VariantPicker, one radio group per option; BuyBox, with price, stock, delivery, quantity, Add to cart and Buy now. Only the buy box needs JavaScript right away."
      - "BelowFold holds the description, reviews summary, questions and similar items; each part hydrates only as it nears the viewport."
    draw: [components, browser, c-product-page, above-fold, page-fold, c-gallery, c-picker, c-buy-box, c-below, page-below]
    check: Which parts of the page hydrate first, and which wait?
    answer: "Gallery, VariantPicker and BuyBox, above the fold, hydrate first; BelowFold waits until each part nears the viewport."
  - point: "Two small stores sit behind the UI: PricingService holds the offers for every SKU in one map, the public ones from the HTML and private ones fetched, and never computes a price; CartStore holds what the badge shows."
    kind: component
    weight: core
    teach:
      - "PricingService keeps one map of offers by SKU, for every SKU of the product. The public offers arrive with the HTML; a signed-in shopper's private ones are fetched. It never computes a price."
      - "BuyBox reads the offer for the picked SKU from it. CartStore is the header badge's truth: the confirmed count and the cart version from the server, plus the adds still waiting for an answer. BuyBox hands it each add."
    draw: [c-pricing, pricing-buy, c-cart-store, buy-cart]
    check: Where does BuyBox get the price it shows for the picked SKU?
    answer: "From PricingService's map of offers by SKU, which came with the HTML; nothing in the browser computes a price."
    misconceptions:
      - "The page works the price out itself -> PricingService only holds the offers the server sent; it never computes a price."
  - point: "Outside the browser, the CDN edge caches the catalog shell for a day and the public offers fragment for 30 seconds and stitches them into one HTML response, storing nothing personal; the Commerce APIs below are a black box that PricingService, CartStore and BelowFold call."
    kind: component
    weight: core
    teach:
      - "The page arrives as one HTML response from the CDN edge. It keeps the shell for a day, purged when the product is edited, and the offers fragment for 30 seconds, and joins the two; no cookie is part of either cache key."
      - "When it misses, the edge goes to the Commerce APIs: catalog, pricing, inventory, delivery and carts, a black box that prices every cart line itself."
      - "Three parts of the browser talk to them directly: PricingService fetches offers, CartStore posts the cart lines, and BelowFold asks for reviews, questions and similar items."
    draw: [c-edge, edge-html, c-server, edge-miss, pricing-server, cart-server, below-server]
    check: What does the edge send the browser on a visit, and what does it never store?
    answer: "One HTML response, the day-old shell with the seconds-old public offers stitched in; it never stores anything personal."
  - point: "The page's data is sorted by how fast it goes stale and whose it is: the catalog shell changes a few times a month and is cached a day, public offers change in seconds and are cached 30 s by product and region, and a private offer belongs to one shopper and is never shared."
    kind: decision
    weight: core
    teach:
      - "Sort what the page shows by how long it stays true. The catalog shell, title, brand, images, description, option lists and the SKU matrix, changes a few times a month: the CDN keeps it a day and purges it by product tag on an edit."
      - "Public offers, price, list price, availability and a regional delivery estimate for every SKU, change in seconds to minutes: cached 30 seconds, keyed by product and region."
      - "A private offer, a member price or delivery to the shopper's saved address, belongs to one shopper, so no shared cache ever holds it."
    draw: [layers, l-shell, l-shell-note, l-offers, l-offers-note, l-private, l-private-note]
    check: Why is the offers fragment cached apart from the catalog shell?
    answer: "A price can be wrong within seconds, while the shell stays right for days; one lifetime can't suit both, so the shell gets a day, purged on edit, and the offers seconds."
    misconceptions:
      - "The shell is private and the fragment public -> both are public; they are split because they go stale at different speeds."
  - point: "The cart count changes on every add and is never cached, and ratings, reviews and questions change over minutes to hours and are cached 10 minutes below the fold; the rule is to cache each piece only as long as it stays true."
    kind: rule
    weight: core
    teach:
      - "Two more layers. The cart count changes on every add, in any tab, so it is not cached: it comes from the cart API and CartStore."
      - "The community layer, ratings summary, reviews and questions, changes over minutes to hours: the CDN keeps it 10 minutes and it is fetched below the fold."
      - "The rule under the table: give each piece a cache life no longer than the time it stays right, and keep anything made for one shopper out of any cache key a public response uses."
    draw: [l-cart, l-cart-note, l-community, l-community-note, statement]
    check: What must never share a cache key with a public response?
    answer: "A per-shopper response, such as a member price or delivery to a saved address."
  - point: "A pick runs across the diagram: on matte black, VariantPicker reads availability from PricingService, the sold-out 1.2 L pick is cleared and said, and Gallery takes the black images; 0.9 L shows $48, only 3 left, with no request; the URL is replaced."
    kind: flow
    weight: core
    teach:
      - "Trace one visit. The shopper lands on the brushed steel 1.2 L kettle: one HTML from the edge, a day-old shell with a 12-second-old offers fragment, and the hero paints first. Steel 0.6 L is sold out, so its tile is already struck. Thumbnails are small lazy buttons; hovering or focusing one starts the full-size image, and the main image keeps its box."
      - "They pick matte black. VariantPicker reads availability from PricingService: black 1.2 L is sold out, so the capacity pick is cleared, the stock line says why and the price becomes From $42.00. VariantPicker hands Gallery the black finish's image set, and the URL is replaced, not pushed."
      - "Arrowing along the capacity tiles, the struck 1.2 L still takes focus and is read out with its reason, but it can't be picked."
      - "They pick 0.9 L, and VariantPicker hands BuyBox that SKU: $48.00, only 3 left. The offer was already in the map that came with the HTML, so nothing is fetched, and the live region speaks once the pick settles."
    draw: [pricing-picker, picker-gallery, picker-buy]
    check: "The shopper picks matte black while 1.2 L is selected, and black 1.2 L is sold out. What happens to the capacity pick?"
    answer: "It is cleared, and the stock line says 1.2 L is sold out in matte black; the price shows a range until a capacity is picked."
    misconceptions:
      - "Jump to the nearest size in stock without saying so -> the pick is cleared and said out loud, so the shopper can't end up adding a size they never chose."
  - point: "Add to cart moves the badge from 2 to 3 before the server answers, and the button, busy, takes no second tap; the request carries the SKU, quantity and a new add id, never a price, and the server confirms cart version 7, or a failed add rolls the badge back."
    kind: flow
    weight: core
    teach:
      - "They press Add to cart. BuyBox hands the add to CartStore and the badge goes from 2 to 3 at once; while the add is in flight the button shows it is busy, and pressing it again does nothing."
      - "CartStore sends the SKU, the quantity and a new add id, never a price. The server prices the line, checks stock and answers cart version 7 with three items, and the badge shows the server's count."
      - "A second add that fails, even after its retry with the same add id, rolls the badge back to 3, and the selection is kept."
    check: What does the add request carry, and what does it leave out?
    answer: "The SKU, the quantity and an add id; never a price, which the server sets when it prices the line."
