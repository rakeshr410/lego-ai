# Product detail page interview, high level design: the components, drawn once the requirements are written (the page's parts, the two stores behind them, the CDN edge above and the Commerce APIs below), then the page's data sorted by how fast it goes stale, then one pick and one add traced across the diagram.
id: amazon/product-detail-page/high-level-design
title: Components, and what changes how often
source:
  hash: "49a1df97a232"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/product-detail-page/requirements-exploration
  assumes:
    - "The page shows images, title, price and availability, one value per option group, quantity, Add to cart and Buy now, the delivery estimate, and more below."
    - "Picks update without a reload, unbuyable options say why, the badge updates at once; LCP at most 2.5 s, Add to cart within 2 s."
    - "Price and stock change within seconds, content a few times a month; no personal price in a shared cache."
  carries:
    - "The UI: ProductPage, the route shell; Gallery, VariantPicker and BuyBox above the fold, hydrated first; BelowFold as the shopper scrolls."
    - "VariantPicker hands Gallery the finish's image set and BuyBox the SKU or null; PricingService holds every SKU's offer in one map, never computing a price; CartStore holds what the badge shows."
    - "The CDN edge caches the shell a day and the offers fragment 30 s and stitches them into one HTML; the Commerce APIs, a black box, serve PricingService, CartStore and BelowFold."
    - "Cache each piece only as long as it stays true; a per-shopper response never shares a cache key with a public one."
    - "A finish change that makes the capacity impossible clears it; picks are answered from the offers map with no request; the badge moves before the server answers."
  terms:
    - term: catalog shell
      means: "Title, brand, images, description, option lists, the SKU matrix and the HTML around them, with no prices; cached at the CDN for a day."
    - term: public offers fragment
      means: "Price, list price, availability and a regional delivery estimate for every SKU of the product, cached for 30 seconds."
    - term: private offer
      means: "A member price or delivery to the shopper's saved address; it never touches a shared cache."
    - term: above the fold
      means: "The group of Gallery, VariantPicker and BuyBox, the parts hydrated first."
