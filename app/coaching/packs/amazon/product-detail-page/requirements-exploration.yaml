# Product detail page interview, requirements: the prompt as a title note (the server a black box, we design the UI), a mock-up read off the functional checklist (only what the shopper sees), then the functional and non-functional lists, one fact a line, each line taught with the clarifying answer behind it; the scope is said, not written.
id: amazon/product-detail-page/requirements-exploration
title: The page, then two lists
source:
  hash: "7a4335cb6f1a"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "The interview designs the product detail page of an Amazon-like store, the UI in the browser; pricing, inventory and the delivery promise are a server black box."
    - "The page shows images, title, brand, rating, price and availability, one value per option group, quantity, Add to cart and Buy now, the delivery estimate, and more below."
    - "Functional: a pick updates price, stock, image and URL with no reload; unbuyable options say why; an impossible pick is cleared and said; the URL keeps the picks; the badge updates at once."
    - "Non-functional, one metric a line, on a mid-range phone on 4G with nothing cached: LCP no more than 2.5 s at p75, Add to cart working within 2 s, INP no more than 200 ms, CLS no more than 0.1."
    - "Also: public offer at most 60 s old, no personal price in a shared cache, no client price sent, one line per add id, WCAG 2.2 AA, offer in the HTML, JSON-LD equal to the visible price."
    - "Price and stock change within seconds, content a few times a month; the shown price is advisory until the cart prices the line."
  terms:
    - term: shopper
      means: The person on the page, who most often arrives cold from a search engine, an ad or a shared link.
    - term: SKU
      means: One buyable combination of a product's option values, such as the matte black 0.9 L kettle.
    - term: add id
      means: The id an add request carries, so a double tap or a retry never adds a second line.
    - term: LCP
      means: "Largest Contentful Paint; on this page, the target for the hero image and the price painting on a cold visit."
    - term: INP
      means: Interaction to Next Paint; the target for how quickly a tap is answered.
    - term: CLS
      means: Cumulative Layout Shift; the target for how still the page stays while it loads.
