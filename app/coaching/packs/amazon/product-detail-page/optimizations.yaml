# Product detail page interview, optimizations: eight areas scored, five deep dives each in its own area (caching by volatility, the hero image, the accessible variant picker, hydration cost, a reliable Add to cart), then a line each for the areas that scored lower. The lesson opens on the board so far, minus the secondary notes that do not fit the keep.
id: amazon/product-detail-page/optimizations
title: Fast first load, reliable adds
source:
  hash: "1e18c7eceaec"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/product-detail-page/interface-definition
  assumes:
    - "Targets: LCP at most 2.5 s at p75, Add to cart within 2 s, INP at most 200 ms, CLS at most 0.1, a public offer at most 60 s old."
    - "The edge stitches a day-long catalog shell and a 30 s offers fragment into one HTML; private offers come from the offers API, private, no-store."
    - "Option status is derived and an impossible pick cleared; the badge is confirmed plus pending adds keyed by add_id."
  carries:
    - "Caching: shell a day, offers 30 s, stitched at the edge; no cookies in a cache key; stale-if-error 5 min or an empty slot; old tabs refetch past 60 s, or show the offer's age."
    - "Hero: a plain img in the HTML, never lazy, fetchpriority high on it alone, srcset 480, 960 and 1440 with sizes, width and height reserved; thumbnails, video and zoom wait."
    - "Picker: radio groups; aria-disabled keeps unbuyable options reachable with a reason; one polite announcement 400 ms after the last change; replaceState keeps picks in the URL."
    - "Hydration: islands, gallery, picker and buy box first in at most 70 KB; below the fold within 600 px; a real form with early clicks replayed; offers embedded once."
    - "Add to cart: badge is confirmed plus pending; busy button; one retry with the same add_id; rollback on 409, 422 or a second failure; never a price; no offline queue."
  terms:
    - term: fetchpriority
      means: An attribute that tells the browser how early to fetch a resource; high on the hero image only.
    - term: aria-disabled
      means: Marks an option unavailable while keeping it focusable, unlike the disabled attribute; the page must refuse to check it itself.
    - term: island
      means: A part of the page whose code loads and hydrates on its own schedule.
    - term: stale-while-revalidate
      means: Lets a cache serve a slightly old response at once while it fetches a fresh one.
