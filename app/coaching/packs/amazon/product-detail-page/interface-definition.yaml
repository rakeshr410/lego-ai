# Product detail page interview, interface definition: why HTML from the edge then plain HTTP, the page and the catalog as requests, the offers request with its JSON response (public or private), the add as a request with its body, response and replay, the errors in one shape, the store actions the components talk through, and the picker's props. Nothing is pushed.
id: amazon/product-detail-page/interface-definition
title: Requests, responses and errors
source:
  hash: "49193260064b"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/product-detail-page/data-model
  assumes:
    - "PricingService holds offers by SKU; CartStore holds the confirmed count, the version and pending adds keyed by add_id."
    - "The edge caches the catalog shell a day and the public offers fragment 30 s; nothing personal enters a shared cache."
    - "An offer carries its price as amount_minor and currency, availability, stock_hint, delivery, scope and as_of."
  carries:
    - "HTML from the edge, then plain HTTP: GETs cache at the CDN by URL; no GraphQL, no socket; a changed price is caught when the tab returns or when the cart prices the line."
    - "GET /p/kw2210?finish=black&cap=0.9l returns one HTML with the page, the offers as embedded JSON and the JSON-LD; if the fragment fails, the price slot ships empty."
    - "GET /api/offers?product=KW2210&region=us-w refreshes offers: anonymous is public, s-maxage 30; signed in is private, no-store, with the member price."
    - "POST /api/cart/lines sends sku, quantity and add_id with a CSRF token, no price, no If-Match; 201 returns version, item_count and the priced line; a repeated add_id gets 200 and the first result."
    - "Errors share one shape; 409 and 422 roll back, a timeout or 5xx retries once with the same add_id, offline sends nothing."
    - "BuyBox, CartStore and PricingService talk through store actions; VariantPicker takes data and events only, and never fetches."
  terms:
    - term: add_id
      means: An id made once per press of Add to cart; a retry of that press reuses it, so the server can return the first result.
    - term: "private, no-store"
      means: Cache headers that keep a response out of shared caches and out of every cache.
    - term: replay
      means: The server answering a repeated add_id with the result of the first request instead of adding again.
