# Cart interview, interface: how changes travel (in an area of their own), then the API written as requests: the cart with one response written as JSON, the PATCH that names its version, the 412 and 409 answers, the other writes, the remaining errors, and inside a tab the actions and CartLine's props.
id: amazon/cart/interface-definition
title: Requests that name their version
source:
  hash: "65325bd4391e"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/cart/data-model
  assumes:
    - "The store keeps the server's Cart whole as confirmed at its version, with pending target quantities per line laid over it."
    - "CartService is the one caller of the Cart API; TabSync tells other tabs about a committed version."
    - "The guest cart in localStorage holds SKUs and quantities, no prices."
  carries:
    - "Plain HTTP for the cart; BroadcastChannel between tabs with the storage event as a fallback; a refetch on visibilitychange for other devices; no server push, no polling."
    - "GET /api/cart returns the whole priced cart with an ETag, or a 304 for If-None-Match while the version is unchanged."
    - "PATCH /api/cart/lines/{lineId} sets a target quantity with If-Match; 200 is the whole cart at the next version, 412 means the cart moved, 409 means too little stock."
    - "DELETE returns what Undo needs; POST /api/cart/lines re-adds at a position; quote prices a guest cart; merge takes a merge_id so a retry gets the first answer."
    - "Inside a tab, lines send quantityIntended; the store flushes 400 ms later; committed, conflicted, refetched and remoteChanged follow. CartLine renders only from props."
  terms:
    - term: If-Match
      means: "The request header carrying the version a write is based on; when it no longer matches, the server applies nothing and answers 412."
    - term: If-None-Match
      means: "The request header carrying the version a tab shows; when it still matches, the answer is a 304 with no body."
    - term: CSRF token
      means: The token every cart mutation carries in X-CSRF-Token, renewed once if the server rejects it with a 403.
