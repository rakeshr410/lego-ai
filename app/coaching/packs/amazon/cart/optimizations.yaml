context:
  after: amazon/cart/interface-definition
  assumes:
    - "A line intent is a target quantity; the store keeps one mutation in flight per cart with its base version."
    - "PATCH names its base version with If-Match; a 412 means the cart moved and nothing was applied."
    - "TabSync posts cart changed with the version and the whole cart; other devices refetch with If-None-Match when visible."
    - "The guest cart in localStorage holds SKUs and quantities; quote prices it and merge takes a merge_id."
  carries:
    - "The cart is tiny; what makes it hard is timing and location: presses outrunning the network, one cart changed in two spots, a guest cart running into an account cart."
    - "One target per line, sent 400 ms after the last press; one mutation in flight per cart; a 412 is refetched and replayed, at most twice, with one banner."
    - "Tabs post the whole cart and a higher version wins with the receiver's intents on top; a device refetches when shown after 30 s; TabSync runs on every page with the badge."
    - "The guest merge keeps the larger quantity per SKU, capped at the limit, repeatable by merge_id, and clears localStorage only after the 200."
    - "Accessibility: the badge named with its count, one polite announcement once settled, focus to the next line, an Undo that waits, and every change said in words."
  terms:
    - term: coalescing
      means: "Holding a line's presses until 400 ms after the last one and sending only the latest target quantity."
    - term: replay
      means: "After a 412, applying the kept intents again on the refetched version and sending them anew."
    - term: settled
      means: "Nothing pending and nothing in flight, the moment the subtotal is announced."
