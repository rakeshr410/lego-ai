# Cart interview, optimizations: the rubric that picks four deep dives (coalescing and conflicts, tabs and devices, the guest merge, accessibility), each in its own area of the board, the next-morning screen said in words, and the lower-scoring areas said and not written.
id: amazon/cart/optimizations
title: Time and place
source:
  hash: "66266cdfa220"
review:
  status: draft
  provenance: ai-drafted
