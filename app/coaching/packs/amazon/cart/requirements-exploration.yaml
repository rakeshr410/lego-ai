# Cart interview, requirements: the prompt as a title, the cart sketched as the shopper sees it (only what the requirements name), then the functional and non-functional lists, one fact a line, every non-functional line tied to its target, and the assumptions and scope. The components come next.
id: amazon/cart/requirements-exploration
title: The cart, then two lists
source:
  hash: "559dae634d5c"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "We design the browser side of an Amazon-like store's cart page and header badge; the server is a black box that keeps the cart and owns prices, discounts, tax and the free-delivery threshold."
    - "On screen: the header and Cart badge; lines with image, title, variant, stepper, line total, Delete and Save for later; the summary with free-delivery progress; a Saved for later list."
    - "Functional: server totals, an instant stepper, delete with undo, Save for later, price and stock changes on open, free-delivery progress, tabs and devices in step, no lost edit, guest merge."
    - "Non-functional: correctness first (no client total, no silent overwrite), feedback in one frame, INP at most 200 ms, other tabs under 1 s, LCP at most 2.5 s, JS at most 90 KB."
    - "Also: no more than 1 request per line per burst and 1 mutation in flight per cart, WCAG 2.2 AA with one announcement per settled change, every supported locale."
    - "Assumed: 1 to 8 lines, presses gathered for 400 ms, a 10 s Undo, free delivery from $75; left out: checkout, adding to the cart, holding stock, promo rules, pricing and tax."
  terms:
    - term: line
      means: One product in the cart with its quantity, shown with its image, title, variant and line total.
    - term: summary
      means: "The server's subtotal, delivery, estimated tax and total for the whole cart."
    - term: Saved for later
      means: A list of items the shopper set aside from this order; each can be moved back into the cart.
    - term: guest cart
      means: The cart of a signed-out shopper, kept on the device and joined to the account cart at sign-in.
    - term: INP
      means: "The responsiveness target for presses, Delete and Undo: no more than 200 ms."
