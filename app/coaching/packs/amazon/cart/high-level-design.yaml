beats:
  - point: "The cart is a versioned server resource: the browser holds the newest version it has seen, lays the shopper's unconfirmed intents over it, sends one change at a time naming the version it started from, and repaints from any newer version."
    kind: rule
    weight: core
    teach:
      - "With the lists written, the overall shape. The server keeps the cart as numbered versions, and each change produces the next number."
      - "The browser holds the most recent version it has received and puts over it the presses the server has not confirmed yet. It sends a single change at a time, saying which version it started from, and redraws whenever a higher version comes in."
    draw: [components]
    check: What does the browser keep of the cart, and what does it add on top?
    answer: "The newest version the server sent; on top of it, the shopper's intents that no version has confirmed yet."
    misconceptions:
      - "The client keeps its own running cart and syncs it later -> the server's version is the cart; the client only adds unconfirmed intents on top of the last one it saw."
  - point: "The UI is CartPage, the /cart route rendered on the server with the cart inside, laying out the lines, the Saved for later list and the summary column; each CartLine with its QuantityStepper, LineActions and LineWarning; and CartBadge in the header."
    kind: component
    weight: core
    teach:
      - "Turn the sketch into components. CartPage is the /cart route: it arrives rendered by the server with the cart already in it, and lays out the lines, the Saved for later list and the summary column."
      - "Each product is a CartLine, which finds its line in the store by id. Inside it, a QuantityStepper that shows the pending intent, LineActions for Delete and Save for later, and LineWarning for a moved price or a sold-out item."
      - "CartBadge is the header's cart link, named Cart, 5 items, with a polite live region."
    draw: [c-page, c-line, c-stepper, c-actions, c-warning, c-badge]
    check: Where does a CartLine get its line from?
    answer: "From the store, by its id; the line hands the store the shopper's intents."
  - point: "CartStore holds the confirmed cart and version, pending intents, one mutation in flight and undo entries; lines hand it intents and it feeds the page and the badge; CartService alone calls the Cart API, with If-Match, the CSRF token, a 10 s timeout and typed results."
    kind: component
    weight: core
    teach:
      - "CartStore is the browser's copy: the confirmed cart at its version, a pending quantity per line, at most one mutation on its way, and the undo entries. Lines give it intents; it gives the page its lines, summary and updating marks, and the badge its count."
      - "CartService is the only thing that talks to the Cart API. It adds If-Match and the CSRF token, stops waiting after 10 seconds, and reports back with a typed result: committed, conflict or failed."
    draw: [c-store, store-to-page, line-to-store, store-to-badge, c-service, store-to-service, c-api, service-to-api]
    check: Which component is the only one that calls the Cart API?
    answer: CartService; lines and the badge only talk to CartStore.
    misconceptions:
      - "Each line saves its own quantity to the server -> lines hand intents to CartStore, which sends one mutation at a time through CartService."
  - point: "TabSync swaps versions with the other tabs over a BroadcastChannel named cart, uses the storage event where that is missing, and refetches once the tab is visible; GuestCart keeps a signed-out cart in localStorage as SKUs and quantities only."
    kind: component
    weight: core
    teach:
      - "TabSync trades versions with the other tabs over a BroadcastChannel called cart. Where that is missing it uses the storage event, and it refetches when the tab becomes visible."
      - "GuestCart holds a signed-out shopper's cart in localStorage, nothing but SKUs and quantities, and passes those lines to the store to be priced or merged."
    draw: [c-tabsync, store-tabsync, c-guest, guest-to-store]
    check: What does GuestCart keep in localStorage?
    answer: "Only SKUs and quantities; nothing priced."
  - point: "One edit: two presses on the filters show 3 in the stepper at once while totals keep version 7 marked Updating; 400 ms after the last press one PATCH goes with If-Match c7, version 8 comes back whole (past $75, so delivery is free, badge 5), and the pending 3 now matches, so it is dropped."
    kind: flow
    weight: core
    teach:
      - "Walk one change through. Both tabs start on version 7. Two presses on the paper filters: the stepper says 3 straight away, while the filters' total and the summary keep their version 7 figures with an Updating mark."
      - "Once 400 ms pass with no press, a single PATCH for quantity 3 goes out with If-Match c7. The reply is the whole cart at version 8: the subtotal is now over $75, so delivery is free, and the badge takes the server's 5. The pending 3 now equals the confirmed quantity, so the store drops it."
    draw: [flow, fl-tab1, fl-server, tab1-to-server, fl-reply]
    check: The shopper presses plus twice on the filters. What does the line show before the server answers?
    answer: "Quantity 3 in the stepper; the line total and the summary keep the server's last values, marked Updating."
    misconceptions:
      - "Show the new line total as 3 times the unit price at once -> every amount is the server's, so the totals wait for the next version."
  - point: "Tab 1 posts cart changed with version 8 and the whole cart on the cart channel; tab 2 takes it with no request because 8 is above its 7, and any version not above the one a tab shows is ignored."
    kind: flow
    weight: core
    teach:
      - "Tab 2 is still on version 7. Tab 1 puts a cart changed message on the channel carrying version 8 and the full cart; 8 beats 7, so tab 2 switches to it without asking the server."
      - "A message may be delayed or overtaken by another, so a tab accepts a version only when it is higher than the one on its screen."
    draw: [fl-tab2, tab1-to-tab2, fl-newer]
    check: Tab 2 hears cart changed with version 8 while it already shows version 9. What does it do?
    answer: It ignores it; only a higher version replaces what a tab shows.
    misconceptions:
      - "Apply every message as it arrives -> a late or repeated message would roll a tab back; only a higher version wins."
  - point: "Delete removes the dripper on screen and sends the DELETE without waiting, so tab 2 gets version 9 and no checkout can still hold it; Undo puts it back where it was with a POST, and version 10 arrives priced again in both tabs."
    kind: flow
    weight: supporting
    teach:
      - "Now the shopper removes the dripper. It leaves the screen immediately, focus lands on the next line's title, and the DELETE is not held back: tab 2 receives version 9 and no checkout could still contain the dripper. Below $75 again, delivery is charged."
      - "Undo returns the dripper to its old place with a POST; both tabs get version 10, priced afresh."
    check: Why is the DELETE sent at once instead of after the Undo toast?
    answer: So no other tab and no checkout can still count a line the shopper has taken out.
  - point: "A phone asleep at version 7 catches up when it is looked at again: GET /api/cart with If-None-Match c7 returns version 8, or a 304 with no body when nothing changed."
    kind: flow
    weight: supporting
    teach:
      - "The phone has been in a pocket showing version 7. When it is visible again it asks for the cart with If-None-Match c7."
      - "Here the cart did move, so version 8 comes back. Usually nothing changed while it slept, and then the answer is a 304 without a body, which costs next to nothing."
    draw: [fl-phone, phone-to-server]
    check: Why does the phone send If-None-Match when it becomes visible again?
    answer: So an unchanged cart costs only a 304 with no body.
