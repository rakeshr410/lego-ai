# Cart interview, high-level design: drawn once the requirements are on the board; the cart as a versioned server resource, the components (the UI from the sketch, then the store, service, tab sync and guest cart behind it), then one edit followed through two tabs and a phone.
id: amazon/cart/high-level-design
title: Then the components
source:
  hash: "f3ce75bf1dde"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/cart/requirements-exploration
  assumes:
    - "The server owns the cart, prices, discounts, tax and the free-delivery threshold; the client never computes a total."
    - "A line shows image, title, variant, a stepper with the line total, Delete and Save for later; the summary is the server's."
    - "Other tabs follow in less than 1 s and other devices when looked at; no edit is silently overwritten; one mutation in flight per cart."
  carries:
    - "The server numbers each cart version; the browser holds the newest it saw, keeps unconfirmed intents over it, sends one change at a time naming its base version, and repaints from newer ones."
    - "UI: CartPage (the /cart route, server-rendered with the cart inside), CartLine with QuantityStepper, LineActions and LineWarning, and CartBadge in the header."
    - "Behind the UI: CartStore, CartService (the one caller of the Cart API), TabSync and GuestCart; a line hands the store intents and never calls the server."
    - "One edit: the stepper shows the intent at once, totals stay Updating, one PATCH with If-Match goes 400 ms after the last press, the whole cart returns, and the matching intent is dropped."
    - "Another tab takes a cart changed message only when its version is higher; a phone asks with If-None-Match when it is looked at again."
  terms:
    - term: version
      means: "The cart's number on the server, raised by every change (7, then 8), and sent as its ETag."
    - term: intent
      means: "What the shopper asked of a line (set the filters to 3), shown at once and kept until a version confirms it."
    - term: CartStore
      means: "The browser's copy: the confirmed cart and its version, pending intents per line, one mutation in flight, and undo entries."
    - term: CartService
      means: "The one caller of the Cart API: adds If-Match and the CSRF token, gives up after 10 s, and returns typed results."
    - term: TabSync
      means: "Trades cart versions with other tabs on a BroadcastChannel, uses the storage event where that is missing, and refetches once the tab is visible again."
