  hash: "3c4933e23bf0"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/cart/optimizations
  assumes:
    - "Tabs exchange the whole cart over a BroadcastChannel and devices refetch when visible; nothing is pushed."
    - "Quantities are target intents gathered for 400 ms; writes carry If-Match, and a 412 is refetched and replayed."
    - "Delete is sent at once and Undo re-adds the line at its position; the guest merge takes the larger quantity per SKU."
  carries:
    - "Each choice was taken over named alternatives, its cost said out loud: a device current only when looked at, a 400 ms wait, totals a round trip behind, an extra trip on conflict."
    - "Delete at once makes Undo a request that can fail; the larger quantity can undercount; a kept sold-out line takes space; a read-only offline cart cannot be edited on a train."
  terms:
    - term: trade-off
      means: A choice taken for what it gives, with what it gives up said out loud.
