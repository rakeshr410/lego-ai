# Cart interview, data model: what each view reads, then the store written as JSON key by key: the server's Cart kept whole as confirmed at one version, the client-only keys laid over it (pending intents, the mutation in flight, undo entries, status), money in minor units, and, in an area of their own, the guest cart in localStorage and the message between tabs.
id: amazon/cart/data-model
title: One cart, one version
source:
  hash: "3401e1e74ea3"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/cart/high-level-design
  assumes:
    - "CartLine finds its line in CartStore by id; CartBadge shows the item count; the summary is the server's."
    - "The browser holds the newest version the server sent and lays the shopper's unconfirmed intents over it."
    - "A guest cart lives on the device until sign-in; TabSync tells other tabs when a version is committed."
  carries:
    - "Every priced number comes in one Cart at one version, held whole as confirmed and swapped only for a higher version, never patched."
    - "On top, the store keeps only what the server has no way to know: pending intents per line, the mutation in flight with its base version, undo entries, a status and the last fetch time."
    - "A line intent is a target quantity, never a step; rolling back is deleting the intent."
    - "Money is an integer of minor units with its currency, formatted with Intl.NumberFormat, never a float and never summed by the client."
    - "Outside the store: the guest cart in localStorage keeps SKUs, quantities and times, no prices; the tab message carries the version and the whole cart."
  terms:
    - term: confirmed
      means: "The last whole Cart the server returned, at its version; every figure with money on the screen reads from it."
    - term: pending
      means: "The shopper's intents by line id, target quantities not yet confirmed by a version."
    - term: minor units
      means: "Money counted in the currency's smallest unit as an integer, cents for USD: $6.50 is 650."
