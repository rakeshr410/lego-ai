beats:
  - point: "Derive the state from the views: a line reads title, variant, image, quantity and its limit, unit price, price when added, line total, availability and notices; the summary reads item count, subtotal, delivery, free-delivery remaining, tax and total; the badge reads the item count."
    kind: component
    weight: core
    teach:
      - "Begin from the components on the board, not from a store shape: ask what each one needs on screen, and write it as JSON, a key at a time."
      - "A CartLine needs its title, variant, image, quantity and the most allowed, the unit price and the price when it was added, the line total, and its availability and notices for the warning. The summary needs the item count, subtotal, delivery, what is left for free delivery, estimated tax and total; the badge takes the item count from it."
      - "All of these are the server's. The only number on screen the shopper sets is the quantity in the stepper."
    draw: [state, reads, rd-open, rd-line-more, rd-avail, rd-summary, rd-summary-more]
    check: Where do you start when deciding the cart's client state?
    answer: "From the views: what each one reads, a line, the summary and the badge."
  - point: "Everything with a price comes as one Cart at one version, from GET /api/cart and from every mutation; the store keeps it whole as confirmed, every line as sent, and replaces it only with a higher version, never patching a number."
    kind: decision
    weight: core
    teach:
      - "So the store keeps the server's Cart just as it came. Open CartState: confirmed, the whole Cart, with its id, version 7 and its lines, each one exactly as the server sent it, then the saved list, the summary and the notices. The version also travels as the ETag, c7."
      - "A notice gives a line's reason for changing: price up, price down, out of stock or limit lowered. Availability is in stock, low stock or out of stock."
      - "The read and every mutation answer with the whole priced cart, so confirmed is simply exchanged for a higher version."
    draw: [cart-state, st-open, st-rest]
    check: A response with version 8 arrives while the store already holds version 9. What happens to confirmed?
    answer: Nothing; confirmed is replaced only by a higher version.
    misconceptions:
      - "Update the subtotal in the store when a quantity changes -> the client never computes totals; the next confirmed Cart brings them."
  - point: "The first client-only key is pending: a target quantity per line, never a step, so resending it or replaying it on a later version never applies it twice; the stepper shows pending if there is one, else confirmed, and rolling back is deleting the intent."
    kind: decision
    weight: core
    teach:
      - "Now add only what the server has no way of knowing. First pending: by line id, the quantity the shopper asked for, the filters at 3."
      - "It is a target, set to 3, never a step like plus 2. Sent a second time after a timeout or a conflict, a target leaves the cart where it should be; a step sent twice is applied twice."
      - "The stepper reads pending when there is one, otherwise confirmed; the money figures, the badge and the warnings read confirmed only. Undoing an intent means deleting it."
    draw: [st-pending]
    check: Why does a line intent hold an absolute quantity rather than a change like plus 2?
    answer: "Sending a target again, or replaying it on a later version, gives the same cart; a step would be applied twice."
    misconceptions:
      - "Plus 2 and set to 3 are the same thing -> after a retry or a replay, plus 2 is added again; set to 3 is not."
  - point: "The rest of the client-only state is the mutation in flight with its kind and base version, the undo entries with what re-adding needs (SKU, quantity, position, title, expiry), a status of idle, syncing, refetching or offline, and the last fetch time."
    kind: component
    weight: supporting
    teach:
      - "in_flight is the single mutation on its way: its kind, one of set, delete, add, save or merge, and the version it started from."
      - "undo keeps, for each removed line, what it takes to put it back: SKU, quantity, position, title and when the offer runs out. Then status, idle, syncing, refetching or offline, and the time of the last fetch; close the store."
    draw: [st-flight, st-undo, st-status]
    check: What does an undo entry need to hold?
    answer: "Enough to re-add the line: its SKU, quantity and position, its title, and when the offer expires."
  - point: "Money travels as an integer of minor units with its currency, 650 and USD for $6.50, never a float; the client only formats it, with Intl.NumberFormat in the shopper's locale, and does no sums."
    kind: rule
    weight: core
    teach:
      - "Every amount in the Cart has one shape: amount_minor, a whole number of cents, beside the currency code. $6.50 travels as 650 and USD."
      - "Decimal arithmetic in floating point drifts by tiny amounts, and how a price is written depends on its currency. So the client only formats these integers, with Intl.NumberFormat in the shopper's locale, and never sums them."
    draw: [money]
    check: Why is money sent as amount_minor and currency rather than a decimal number?
    answer: "Floating-point sums drift, and the currency decides the formatting; the client only formats integers of minor units."
    misconceptions:
      - "A decimal like 6.5 is fine for prices -> float arithmetic drifts; prices travel as integers of minor units with a currency."
  - point: "Outside the store, the guest cart sits in localStorage under a versioned key with SKUs, quantities and the time each went in, and never a price, since stored data can be old or hand-edited; the server prices it whenever the cart opens."
    kind: component
    weight: supporting
    teach:
      - "Two things live outside the store. First the guest cart, written as JSON: a schema number, lines of SKU, quantity and the time each was added, and when it was last updated."
      - "It never holds a price: what sits in localStorage may be old or changed by hand, so the server prices the guest cart every time it is opened."
    draw: [outside, guest-json, g-open, g-close]
    check: What does the guest cart in localStorage contain?
    answer: "SKUs, quantities and the time each went in, with a schema number and update time; nothing priced."
  - point: "The message TabSync posts after a commit carries its type, cart changed, the version, the whole cart and the sending tab, so a receiving tab can take it without a request."
    kind: component
    weight: supporting
    teach:
      - "Second, what TabSync posts after every commit: its type, cart changed, the new version, the full cart and the tab it came from."
      - "Because the cart rides along, the tab that receives it makes no request; the version tells it whether to take it."
    draw: [tab-json, t-line]
    check: Why does the tab message carry the whole cart and not just a notice that something changed?
    answer: So the receiving tab can take the newer cart without making a request.
asks:
  - ids: [rd-open, rd-line-more, rd-avail, rd-summary, rd-summary-more]
    beats: [1]
    question: "Walk the components: what does each one need to read? Name the fields and I'll write them as JSON."
    hints:
      - Look at one line on the sketch. What does it show, and what could its warning need?
      - And the summary, and the badge in the header?
  - ids: [st-pending, st-flight, st-undo, st-status]
    beats: [3, 4]
    question: "The server sends the whole cart. What does the client need to keep that the server can't know yet?"
    hints:
      - The shopper has pressed plus, but nothing is confirmed. Where does that live?
      - And a line that was just deleted, which the shopper may want back?
task:
  prompt: "Write CartState as JSON: confirmed, the whole Cart at its version, then pending, in_flight, undo and status; then the guest cart and the tab message outside it."
  expects: [2, 3, 4, 6, 7]
