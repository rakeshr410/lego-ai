# Product listing interview, requirements: the prompt (the server a black box, we design the UI), the results page drawn as a mock-up of what the shopper sees (following the article's gooseneck kettle results screen, only the parts the functional list names), then the functional and non-functional lists, one fact a line, and the assumptions and scope.
id: amazon/product-listing/requirements-exploration
title: The page, then two lists
source:
  hash: "63fb97495e98"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "The interview designs the client of an Amazon-like store's search results page; retrieval, ranking and counting are a server black box."
    - "The page: the query with the total and the sort, chips for applied filters, filters for delivery, rating, price and brand, a grid of product cards and numbered page links."
    - "A card shows its image, title and brand, rating and price, badges and a delivery line, and Add to cart; it links to the product page."
    - "Functional: products for a query or department; filters for delivery, rating, price and brand, with counts; chips; sort; numbered pages."
    - "Functional: the URL reproduces the page; cards link to the product and offer Add to cart; an empty result offers ways out; on a phone a filter sheet."
    - "Non-functional: LCP less than 2.5 s at p75; route JS no more than 90 KB; INP less than 200 ms; new results in less than 600 ms at p75; zero frames with another query's counts."
    - "Non-functional: CLS below 0.1 at p75; WCAG 2.2 AA; the APG multi-thumb slider; a crawlable link per page; noindex on sort variants."
    - "Assumptions: 24 results a page, page one server-rendered; 3 to 6 filters a session; 20 responses kept by query; API fresh 60 s, then stale for 300 s while refreshing."
  terms:
    - term: facet
      means: "A filter group with its options and their counts: delivery speed, rating, price range and brand."
    - term: chip
      means: An applied filter shown above the results, removable one by one or all at once.
    - term: p75
      means: The 75th percentile of page loads.
