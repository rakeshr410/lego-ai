beats:
  - point: "Rank the areas by impact if they fail, shoppers affected and how often they matter: the URL as state, racing requests and counts, first load, accessibility and caching go deep; internationalisation and security get a few lines; offline comes last."
    kind: decision
    weight: supporting
    teach:
      - "Before any technique, rank the areas. Score each from 1 to 3 on how bad a failure would be, how many shoppers it touches, and how often it comes up."
      - "Five come out on top and get a deep dive: the URL as state with Back and Forward, racing requests and consistent counts, first load and layout stability, accessibility, and caching. Internationalisation and security get a few lines each."
      - "Offline scores lowest: a search needs the network anyway, and cached entries still render on Back."
    check: Why does offline rank lowest for this page?
    answer: "Searching needs the network; at most, cached entries still render on Back."
  - point: "The URL is the only copy of the filters: UrlState drops tracking tags and defaults, tidies q and sorts the pairs by name into a canonical key; only UrlState writes the URL, pushing committed changes and replacing fixes; scroll is restored by hand; and a filter change resets the page."
    kind: rule
    weight: core
    teach:
      - "If a store held the filters and the URL mirrored it, every Back press would be a sync problem; here the URL is the only copy. A pasted link loses utm_source, sort featured and page 1; q is trimmed, its spaces collapsed and lowercased; and the pairs are sorted by name, so a pasted link and a click share one key. replaceState writes that form once."
      - "Only UrlState touches location; the others call setParams and hear urlChanged. A committed filter, sort, page or the sheet's Apply is pushed; canonicalising, a bad-param fix and saving scroll are replaced, so Back never crawls through twenty price values. popstate takes the same path as a click."
      - "Scroll restoration is manual: scrollY is saved in history.state and applied once the results render. A change to the query, filters or sort drops page and snapshot."
    draw: [opt-url, o-url-drop, o-url-norm, o-url-writer, o-url-push, o-url-scroll, o-url-reset]
    check: "The shopper is on page 4 and adds a filter that leaves only one page. What should happen to the URL?"
    answer: "page and snapshot are dropped, so the shopper lands on page 1 of the new results instead of an empty page 4."
    misconceptions:
      - "Push an entry for every price value while dragging -> Back would crawl through them; only a committed change is pushed."
  - point: "Apply a response only when its key is the URL's, whatever order it arrived in; abort the request nobody wants but keep the check, since a body can be read just before abort(); and cache a late answer under its own key."
    kind: mechanism
    weight: core
    teach:
      - "Two clicks 160 milliseconds apart. With no abort and no key check, the slow older reply lands last, and 97 kettles of every brand appear under a Brightwell chip."
      - "So compare the response's key with currentKey. A request counter would break on Back, where the older key is the right one again. Abort the old request through its AbortController and swallow the AbortError, but keep the check; an answer that fails it goes into the LRU of 20 under its own key."
    draw: [opt-race, o-race-key, o-race-abort, o-race-late]
    check: "The shopper clicks a filter and then presses Back. Why would a rule of 'the newest request wins' go wrong here?"
    answer: "After Back the older key is the one the URL wants again; a request counter would throw its correct answer away, while a key comparison accepts it."
    misconceptions:
      - "Aborting the old request is enough -> a body can be read just before abort(), so the key check still runs."
  - point: "Read every number from the applied entry together, keep the old cards dimmed rather than blank while loading, and leave the filters usable."
    kind: mechanism
    weight: core
    teach:
      - "Grid, total, facet counts, price bounds and relaxations all come from the applied entry; nothing is adjusted locally, so the page can never say 212 while the options add up to 97."
      - "While loading, the old cards keep their size, faded, with aria-busy on the region; after 1 second a thin progress bar shows. FacetPanel stays live, so fixing a misclick is just a newer key."
    draw: [o-race-one, o-race-dim]
    check: Why not replace the grid with a spinner while the next answer loads?
    answer: "The page would collapse and the shopper would lose their place; the old cards stay full size, faded, with aria-busy, until the new answer is applied."
  - point: "A grid of images makes LCP an image: the server renders page one with its response embedded, the first row is fetched first, every image box is reserved, srcset right-sizes, the filters work as a form before hydration, and the grid keeps its height."
    kind: mechanism
    weight: core
    teach:
      - "Rendered in the client, the route loads a shell, then JavaScript, then results, then images, so the LCP image is found last. Instead the server runs the search and streams the toolbar, facets and 24 cards as HTML with the response embedded, so image URLs arrive in the first bytes. First-row images get fetchpriority high and are never lazy; the rest load lazily."
      - "Width and height from the API on every image, and aspect-ratio 1 on its box, give each card its final height before any image byte. A srcset of 160, 320 and 640 wide lets a phone pick a small file."
      - "Facets are real inputs in a form that submits to slash s, so they work before hydration. When fewer results land, the old cards stay while dimmed, and the footer moves up once."
    draw: [opt-load, o-load-ssr, o-load-priority, o-load-reserve, o-load-srcset, o-load-form, o-load-height]
    check: "Of the 24 images on page one, which should the browser fetch first, and how do you tell it?"
    answer: "The first row, where the LCP image usually is: fetchpriority high and no lazy loading; the rest load lazily."
    misconceptions:
      - "Lazy-load every image -> the first row holds the LCP image, so it loads eagerly at high priority; only the rest are lazy."
  - point: "Native checkboxes and radios in a fieldset per facet; focus stays on the option clicked and moves only on a page change; one polite count per applied response; aria-busy while the keys differ; each price thumb a slider in the tab order."
    kind: rule
    weight: core
    teach:
      - "Native checkboxes and radios, a fieldset with a legend per facet, the count in the label: Brightwell, 54 results. Options are keyed by facet and value, so the one clicked keeps its focus; only a page change moves focus, to the results heading."
      - "A status region outside the grid changes only when a response is applied, saying 212 results, once. aria-busy is true on the results region while currentKey and appliedKey differ."
      - "Each price thumb has role slider, sits in the tab order and reads its formatted price; the min and max fields are the way round dragging."
    draw: [opt-a11y, o-a11y-native, o-a11y-focus, o-a11y-heading, o-a11y-status, o-a11y-busy, o-a11y-slider]
    check: "A keyboard user ticks a brand and the results update. Where is their focus now?"
    answer: "Still on that checkbox; focus moves only on a page change, to the results heading."
    misconceptions:
      - "Announce every response as it arrives -> only the applied response is announced, once, in a polite status region."
  - point: "Call the API with the canonical URL so repeats share one cache entry, keep anything personal out of the body, let caches serve stale for up to 300 s while revalidating, apply store entries under 60 s old with no request, and prefetch the likely next step."
    kind: mechanism
    weight: core
    teach:
      - "Searches repeat across shoppers and on every Back. With the canonical query string, a pasted link, a click and a relaxation with the same filters hit one entry at the edge and in the browser. Only public product data and a coarse zone's delivery line go in the body."
      - "With stale-while-revalidate 300, for five minutes after expiry a cache may hand out the old response while fetching a new one, so for those five minutes shoppers are not all kept waiting for the origin."
      - "The store's entries under 60 seconds old are applied with no request; older ones at once, then revalidated. Prefetch page one when the sheet's count arrives, and the next page when the pointer rests on Next. A cached price may be stale; the product page and checkout confirm it."
    draw: [opt-cache, o-cache-url, o-cache-private, o-cache-swr, o-cache-store, o-cache-prefetch]
    check: "What could go wrong if the search response carried the shopper's name?"
    answer: "The response is cached publicly and shared, so a shared cache could hand one shopper's details to another."
    misconceptions:
      - "The same search spelled two ways still shares a cache entry -> only the canonical URL makes it one entry; two spellings are two entries and neither stays warm."
  - point: "Briefly, prices and counts follow the shopper's locale with Intl.NumberFormat and Intl.PluralRules, layouts use logical properties for right-to-left, the reflected query is rendered as text, and unknown params are dropped by an allowlist."
    kind: rule
    weight: supporting
    teach:
      - "Intl.NumberFormat formats prices from minor units and a currency code, and counts too; Intl.PluralRules picks 1 result or 3 results. Logical CSS properties flip the facet column and the slider for Arabic or Hebrew."
      - "The query shows in the heading, so it is rendered as text, never HTML, and capped at 200 characters. UrlState keeps an allowlist of params and values, and sort variants and deep filter mixes get noindex."
    draw: [opt-intl, o-intl-format, o-intl-rtl, o-sec-text, o-sec-allow]
    check: "Someone shares a link with markup hidden in q. What stops it running on the page?"
    answer: "The query is rendered as text, never as HTML, and capped at 200 characters."
asks:
  - ids: [o-load-ssr, o-load-priority, o-load-reserve, o-load-srcset, o-load-form, o-load-height]
    beats: [5]
