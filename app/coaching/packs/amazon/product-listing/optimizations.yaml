# Product listing interview, optimizations: the areas ranked, then five deep dives each in its own board area, techniques as short boxes (the URL as the source of truth, racing requests and consistent counts, first load and layout, accessibility, caching), and internationalisation and security in brief. The lesson opens on the page, the requirements, the components, the question and the store, and the search request and response; the rest of lesson 2's detail is left off so the whole of this lesson's board stays in view to the end.
id: amazon/product-listing/optimizations
title: Five deep dives, two in brief
