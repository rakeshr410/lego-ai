context:
  after: amazon/product-listing/interface-definition
  assumes:
    - "Targets: LCP less than 2.5 s and CLS below 0.1 at p75, INP less than 200 ms, route JavaScript no more than 90 KB, zero frames with another query's counts, WCAG 2.2 AA."
    - "UrlState owns the URL and the query key; ResultsStore keeps entries by key with currentKey and appliedKey; SearchService aborts per key."
    - "The search is a GET with the canonical query, public for 60 s with stale-while-revalidate 300; the response carries image width and height."
  carries:
    - "Areas are scored on impact, reach and frequency: five go deep, internationalisation and security briefly, offline last."
    - "The URL is the only copy of the filters: a canonical key, one writer, push for committed changes and replace for fixes, manual scroll restoration, filters reset page."
    - "A response is applied by key, not arrival order; old requests are aborted; late answers are cached; every number comes from one entry; results dim, never blank."
    - "First load: the server renders 24 cards with the response embedded, the first row is prioritised, image boxes are reserved, srcset right-sizes, filters work as a form."
    - "Accessibility: native controls, focus kept, focus to the heading only on a page change, one polite count, aria-busy, a two-thumb slider."
    - "Caching: one URL per question, nothing personal in the body, stale up to 300 s, store entries under 60 s with no request, prefetching the next step."
  terms:
    - term: canonical key
      means: "The search params with tracking tags and defaults dropped, q normalised and pairs sorted by name, so equal questions are equal strings."
    - term: LCP element
      means: On this page, usually an image in the first row.
    - term: status region
      means: "A polite region outside the grid, with role status, updated only when a response is applied."
