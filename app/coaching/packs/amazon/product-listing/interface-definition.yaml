# Product listing interview, interface definition: why the search is a cacheable GET, the request and one page of its response written as JSON, then the empty answer, the count and cart endpoints in a column of their own, all in the API area; then, in the band below, the error cases, the events between components, and the props of FacetPanel and PriceRange.
id: amazon/product-listing/interface-definition
title: A GET with the canonical query
source:
  hash: "1a30e20425f4"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/product-listing/data-model
  assumes:
    - "The query key is the URL's search params, sorted, defaults left out; ResultsStore keeps entries by key and shows the one at appliedKey."
    - "SearchService is the only caller of the Search API, with one AbortController per key, an 8 s timeout and one retry for a 5xx."
    - "On a phone the sheet edits a FacetDraft and asks for counts only; PriceDraft holds a dragged thumb."
  carries:
    - "Searching is a GET with the canonical query string, cacheable by URL; not GraphQL over POST, no streaming, and a count endpoint only for the phone sheet."
    - "GET /api/search with canonical params plus zone; a page returns key, total, page, page_count, snapshot, items and facets, with Cache-Control public, max-age=60, stale-while-revalidate=300."
    - "An empty result returns total 0 and relaxations, each a link to the URL without that param, or a spelling."
    - "GET /api/search/count answers a draft's total and facet counts; POST /api/cart/items adds an offer, quantity 1."
    - "Errors have one shape: 400 drops a param, 404 goes to the last page, 410 drops the snapshot, 429 waits, 5xx retries once, a timeout or offline shows a banner."
    - "Components talk through the URL and events; FacetPanel takes facets and the selection and reports a whole next selection; PriceRange commits on release, Enter, Go or 400 ms still."
  terms:
    - term: zone
      means: "A coarse delivery zone, the only search input not in the page's URL, needed for the delivery promise."
    - term: snapshot
      means: "An opaque token from page 1 that keeps later pages on the same ranking for 10 minutes."
