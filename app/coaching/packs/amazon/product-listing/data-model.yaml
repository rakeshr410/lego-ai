# Product listing interview, data model: what each component reads, the question parsed from the URL as JSON with its query key, the store of answers by key written key by key, the two client-only drafts, and the results region's states. The lesson opens on the board so far without the assumptions and scope.
id: amazon/product-listing/data-model
title: The question, the answer, the store
source:
  hash: "806311184d86"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/product-listing/high-level-design
  assumes:
    - "UrlState is the only reader and writer of the URL; ResultsStore keeps responses by query key; SearchService is the only caller of the Search API."
    - "A click writes params to the URL; the store fetches the URL's key on a miss and applies a response only when its key is the URL's."
    - "On a phone the filter sheet edits a draft and asks for counts only until Apply."
  carries:
    - "The URL holds the question, the response the answer, and the store keeps answers by question."
    - "Search params: q, dept, delivery, rating, price, brand, sort and page, defaults left out; the query key is the params sorted, built by the client."
    - "ResultsStore: entries by query key, an LRU of 20, each with status, response, error and fetched_at; currentKey from the URL, appliedKey on screen."
    - "A response carries facets (key, label, kind, options with counts or price bounds) and, when empty, relaxations (a param to remove and the total it leaves)."
    - "The screen shows only the entry at appliedKey; results, total, facet counts and relaxations are read from it together, never edited in place."
    - "Only two drafts are client-only: FacetDraft for the phone sheet and PriceDraft while a thumb is dragged."
    - "The results region is showing, dimmed, empty with ways out, or failed with the old results under a banner."
  terms:
    - term: search params
      means: "The choices parsed and validated from the URL: q, dept, delivery, rating, price, brand, sort and page."
    - term: entry
      means: "One answer in the store, under its query key: a status, the response, an error and when it was fetched."
    - term: minor units
      means: "A price as a whole number of the currency's smallest unit, with its currency code."
