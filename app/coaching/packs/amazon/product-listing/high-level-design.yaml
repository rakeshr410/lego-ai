beats:
  - point: "Turn the mock-up into components: ResultsPage is the shell for the route /s; inside it FacetPanel holds the check groups, the rating radio group, PriceRange and the applied chips, and turns a click into the next params; each ProductCard holds ProductImage, PriceLine and AddToCart."
    kind: component
    weight: core
    teach:
      - "Now that the requirements are written, split the page into components. ResultsPage is the shell for the route slash s: it holds the toolbar, the filter column, the grid and the page links."
      - "FacetPanel is the filter column: CheckGroup for delivery and brand, RadioGroup for rating, PriceRange with two thumbs and a Go button, and AppliedChips, which removes one filter or clears them all. Whatever the shopper clicks, FacetPanel turns it into the next set of params and hands that on."
      - "ProductCard is one result: ProductImage in a reserved square box, PriceLine, which formats the price from minor units, and AddToCart, which hands off to the cart."
    draw: [components, c-page, c-card, c-image, c-price, c-cart, c-facets, c-check, c-radio, c-range, c-chips]
    check: Which component turns a filter click into new search params, and which one shows a single result?
    answer: "FacetPanel turns a click into the next params; ProductCard shows one result."
  - point: "Behind the UI sit three modules: UrlState parses and validates the URL, builds the canonical key and pushes or replaces history; ResultsStore keeps each response under its key, with currentKey from the URL and appliedKey on screen; SearchService is the only caller of the Search API, a black box."
    kind: component
    weight: core
    teach:
      - "UrlState parses and validates the params, builds the canonical key, and owns pushState, replaceState and popstate."
      - "ResultsStore keeps entries by key, each a status and a response. currentKey is what the URL asks for; appliedKey is what is on screen."
      - "SearchService is the only caller of the search endpoints: one AbortController per key, an 8 second timeout and one retry for a 5xx. Outside the browser is the Search API: retrieval, ranking, facet counts and snapshot tokens, a black box."
    draw: [url-state, results-store, search-service, search-api]
    check: What is the difference between currentKey and appliedKey?
    answer: "currentKey is the key the URL asks for; appliedKey is the key of the response on screen. They differ while a new response is loading."
  - point: "Data flows in one loop: a click never fetches; FacetPanel calls setParams, UrlState writes the URL and reports the new key, ResultsStore fetches that key through SearchService only on a miss, and ResultsPage shows the applied entry."
    kind: flow
    weight: core
    teach:
      - "Draw the loop. FacetPanel calls setParams with the next params. UrlState writes them to the URL and reports urlChanged with the new key."
      - "The store fetches that key through SearchService only on a miss; the service calls GET slash api slash search and hands back the response or an error. The store gives the applied entry and its status to ResultsPage."
      - "A filter click, a chip removal, a sort, a page link, Back and Forward all change the URL. Results change only because the URL did."
    draw: [set-params, url-changed, store-service, service-api, store-page, loop-note]
    check: "The shopper ticks a brand box. What changes first, and what follows from it?"
    answer: "Only the address bar, through UrlState, at first; the chip reads it, and the new key triggers the fetch."
    misconceptions:
      - "The checkbox sends its own request -> clicks only write params; the request follows from the key the new URL gives, so Back and a shared link behave like a click."
  - point: "The screen moves in three steps: the first page arrives inside the HTML; a click updates the URL and the chip at once while the old results dim; the response swaps results, total and counts together, announced once."
    kind: flow
    weight: core
    teach:
      - "Walk the screen. The HTML carried the first 24 results and, embedded as JSON, the response itself, so the store begins with one entry and fetches nothing."
      - "The shopper ticks Arrives tomorrow. UrlState pushes the new address and the chip appears straight away, since chips are read from the URL. The old cards stay, faded, with aria-busy, and the total still matches them; focus stays on the checkbox."
      - "When that key's answer lands, the cards, the total and every count change in one render, the fading lifts, and the status region announces 212 results, once."
    draw: [screen, s-first, s-click, first-to-click, s-applied, click-to-applied, s-note]
    check: Why does the old total stay on screen while the new results are loading?
    answer: "Because the total, the counts and the grid must all describe one and the same response; they change together when it lands."
    misconceptions:
      - "Clear the grid and show a spinner while loading -> the old results stay, dimmed with aria-busy, until the new results, total and counts land together."
  - point: "Two quick clicks, 4 stars and up then Brightwell: the first request is aborted, and even if its body had arrived the store would refuse it, because its key is not the URL's; it is cached under its own key, and only the Brightwell response is applied."
    kind: failure
    weight: core
    teach:
      - "The shopper picks 4 stars and up, then Brightwell a moment later. The URL changes twice, and with it the key the store is after."
      - "When the newer key comes, SearchService cancels the first request. Even if that body was already read, the store compares keys, finds it is not the URL's, and only caches it."
      - "Just the answer for the URL's key is shown: three Brightwell kettles. The 97 from the step in between never reach the screen or the screen reader."
    draw: [s-race]
    check: "A reply for a key the URL has already left arrives. What does the store do with it?"
    answer: "Stores it under its own key and leaves the screen alone; only the URL's key is ever applied, and having the older answer cached lets Back to that state skip the network."
    misconceptions:
      - "Apply whatever arrives last -> the last to arrive can be the older query; only the response whose key matches the URL is applied."
  - point: "When narrowing the price to 12 to 20 dollars leaves nothing, the response brings relaxations: a filter to drop with the count that leaves, each a link to the URL without that filter."
    kind: flow
    weight: supporting
    teach:
      - "The shopper drags the price to 12 to 20 dollars and lets go. No kettle is left, so the response comes with relaxations, such as dropping Brightwell for 6 results."
      - "Each relaxation is a link to the same URL minus that one filter."
    draw: [s-empty]
    check: "Narrowing the price to 12 to 20 dollars leaves zero kettles. What does the page offer?"
    answer: "Relaxations from the same response: a filter to remove and how many results that gives, each a link to the URL without it."
  - point: "On a phone the filters open in a sheet that edits a draft; after a 300 ms pause it asks for counts only and its button reads Show 212 results; pressing it pushes one history entry and puts focus back on the Filters button."
    kind: flow
    weight: core
    teach:
      - "At phone width the filter column turns into a sheet and the grid into a list, still rendered on the server. What the shopper picks in the sheet is a draft: the URL and the results behind it stay as they were."
      - "Ticking Arrives tomorrow and pausing for 300 milliseconds makes FacetPanel ask for counts only, and the button now says Show 212 results. Within 2 days still shows 371, because picks in one group are alternatives."
      - "Pressing the button closes the sheet, pushes one history entry for the whole draft, and returns focus to the Filters button. The page has often been prefetched, so the list changes at once."
    draw: [phone, p-sheet, p-count, sheet-to-count, p-apply, count-to-apply]
    check: "On a phone, the shopper ticks two filters in the sheet. What happens to the URL before they press the button?"
    answer: "Nothing; the sheet edits a draft and asks only for counts. Pressing the button pushes one history entry for the whole draft."
    misconceptions:
      - "Each tick in the sheet reloads the results -> the sheet edits a draft; only counts are asked for until Apply."
  - point: "Pages: the page links are real anchors that work before hydration; page 2 carries page one's snapshot token so it keeps the same ranking; and Back renders page one from the cache and scrolls back to the card the shopper was on."
    kind: flow
    weight: core
    teach:
      - "Back on the wide screen, the numbered links at the bottom are ordinary anchors, so they already work before the JavaScript hydrates, open in a new tab and are followed by crawlers. Once hydrated, a click pushes the new page, sends focus to the results heading and scrolls up to it."
      - "On the phone, the shopper taps 2. UrlState pushes page 2, the rows fade, and when it arrives focus goes to the results heading. The request takes page one's snapshot token, so page 2 continues the same ranking even if the index has changed."
      - "Back fires popstate. Page one is in the cache, so it shows without a request, and the scroll saved with that history entry puts the shopper back at the Brightwell kettle they were looking at."
    draw: [s-pages, p-page2, p-back]
    check: "On a phone the shopper goes to page 2 and then presses Back. What do they see, and does it cost a request?"
    answer: "Page one, straight from the cache with no request, scrolled back to where they were by the position saved in that history entry."
