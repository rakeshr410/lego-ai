# Product listing interview, high level design: drawn once the requirements are on the board; the UI split into components, the modules behind it and the one loop from a click to the screen, then the results screen step by step and the same search on a phone.
id: amazon/product-listing/high-level-design
title: Components and one loop
source:
  hash: "464e1ddba3cf"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/product-listing/requirements-exploration
  assumes:
    - "The page is the query with the total and sort, chips, the filters, a grid of product cards and page links."
    - "The URL reproduces the page; results, total and every count describe the URL's query; on a phone filters apply together from a sheet."
    - The components are drawn after the requirements.
  carries:
    - "UI: ResultsPage, the shell for the route /s, holds FacetPanel (CheckGroup, RadioGroup, PriceRange, AppliedChips) and ProductCard (ProductImage, PriceLine, AddToCart)."
    - "Behind it: UrlState, the only reader and writer of the URL; ResultsStore, responses by query key with currentKey and appliedKey; SearchService, the only caller of the Search API."
    - "One loop: a click writes params to the URL, the store derives a key and fetches it on a miss, and the page shows the applied entry."
    - "While a key loads the old results stay dimmed with aria-busy; a response is applied only if its key is the URL's, and results, total and counts swap together."
    - "An empty result carries relaxations; page links are real anchors."
    - "On a phone the sheet edits a draft, asks for counts only, and Apply pushes one history entry; page 2 carries page one's snapshot token, and Back restores page one from the cache."
  terms:
    - term: query key
      means: "The URL's search params in one canonical order, naming one question and one entry in the store."
    - term: currentKey
      means: The key the URL asks for right now.
    - term: appliedKey
      means: The key of the response on screen.
    - term: relaxation
      means: "A filter to remove from an empty result, with the total that would leave."
