beats:
  - point: "Numbered pages of 24 over load more or endless scroll: shoppers can share and return to page 2, the footer stays reachable, each page is a link crawlers follow, and Back lands on a known page; the cost is a click and a wait, and offsets that hold only while the ranking does, hence the snapshot."
    kind: decision
    weight: core
    teach:
      - "Write each call as the choice over what it lost to. First, numbered pages of 24. A shopper can send or come back to page 2, the footer with its help and store links stays in reach, every page is a plain link for crawlers, and Back lands on page 2 itself, not on a scroll position the page has to rebuild."
      - "The price: a click and a wait to see more, and page numbers are offsets that only hold while the ranking stays put, which is what the snapshot token is for. A cursor would not need one, but it gives up numbered pages a shopper can share."
      - "Load more keeps earlier results on screen, but the URL then has to count the batches or Back drops them. Endless scroll needs no click, but the footer is out of reach, a place in the list is hard to share or find again, and crawlers still need page URLs."
    draw: [trade-offs, td-pages, td-pages-not]
    check: "The results are already split into numbered pages. Why does the API still hand out a snapshot token?"
    answer: "Page numbers are offsets that only hold while the ranking stays still; the snapshot keeps page 2 on page 1's ranking."
    misconceptions:
      - "Endless scroll suits every listing -> it fits aimless browsing; shoppers comparing products need pages they can share, a footer they can reach and a known place on Back."
  - point: "Live filters on desktop and a sheet with Apply on a phone: on desktop each click shows its effect beside the filters, while on a phone the sheet hides the results, so choices go in together with a count preview; the cost is two modes for one component and the count endpoint."
    kind: decision
    weight: core
    teach:
      - "On desktop each click shows its result right next to the filters. On a phone the sheet covers the results, so the choices go in together, and the button's count tells the shopper what they will get."
      - "It costs one component with two modes, and a count endpoint for the phone. Live everywhere would reload results hidden under the sheet on every tick, each with its own history entry; Apply everywhere would add an extra click on desktop that people forget."
    draw: [td-apply, td-apply-not]
    check: Why not apply every filter live on a phone too?
    answer: "The sheet hides the results, so every tick would reload results nobody can see and add a history entry each."
  - point: "Filter state lives in the URL with the store derived from it, over a client store mirrored to the URL: links, reloads, Back and Forward rebuild the page and there is one copy to keep; the cost is a string form and validation for every value, and long URLs."
    kind: decision
    weight: core
    teach:
      - "With the filters only in the URL, a link, a reload, Back or Forward always rebuilds the page, and there is no second copy to keep in step."
      - "In exchange, every value needs a string form and a check, and long mixes of filters make long URLs. A store mirrored into the URL could keep rich types, but then two copies must agree, popstate being the hard case, and a reload before the mirror catches up loses the state."
    draw: [td-url, td-url-not]
    check: "If the filters lived in a client store and were copied into the URL, what would break?"
    answer: "The two copies have to be reconciled, especially on popstate, and a reload before the copy is written loses the state."
  - point: "Push a history entry per committed change and replace for fixes, over replacing every time: Back undoes the last filter and canonical rewrites leave no trace; the cost is that after six filters, leaving takes six Back presses."
    kind: decision
    weight: supporting
    teach:
      - "Pushing on each committed change lets Back undo the last filter, while canonical rewrites and bad-param fixes leave nothing behind. The catch: after six filters it takes six presses of Back to leave the page."
      - "Replacing every time leaves in one press, but Back can no longer undo a filter, and Forward does nothing within the page."
    draw: [td-history, td-history-not]
    check: What does the shopper lose if every filter change replaces the history entry?
    answer: "Back can no longer undo a filter, and Forward is useless inside the page."
  - point: "Abort the old request and check the key on arrival, over abort alone or request numbers: it saves bandwidth, is safe when a body beats abort(), and is right after Back as well as after fast clicks; the cost is two mechanisms to maintain."
    kind: decision
    weight: core
    teach:
      - "Using both saves bandwidth, stays safe when a body is read just before abort(), and gives the right answer after Back as well as after quick clicks; the cost is keeping two mechanisms."
      - "Abort on its own is simpler, yet a response already delivered still gets applied. A request counter needs no abort support, but it downloads answers no one will read and turns away the right answer after Back."
    draw: [td-stale, td-stale-not]
    check: "Why isn't numbering the requests and keeping only the newest enough?"
    answer: "After Back the older query is the right one again, and a counter would reject its correct response; it also downloads answers nobody reads."
  - point: "Total and facet counts come in the same response as the results, over a separate facets request: the page can never show numbers from two queries and each change costs one request; the cost is a slightly larger response and counting on every results request."
    kind: decision
    weight: core
    teach:
      - "With one response, the numbers on screen can never come from two different queries, and each filter change costs a single request."
      - "The response grows a little, and the server counts on every results request. A separate facets call would let results show before the counts are ready, but for a moment the two answers can disagree."
    draw: [td-counts, td-counts-not]
    check: What can a separate facets request show the shopper that one response never can?
    answer: "For a moment, counts from one query beside results from another, because the two responses can disagree."
  - point: "The first page is rendered on the server and streamed with its data embedded, over a client-rendered page: images are found in the first bytes, crawlers get real content and filters work as a form before hydration; the cost is a server path that runs the search, and hydration time on slow phones."
    kind: decision
    weight: core
    teach:
      - "Streaming the first page from the server with its data embedded puts image URLs in the first bytes, which helps LCP, gives crawlers and link previews real content, and lets the filters work as a form before hydration. In return the server needs a rendering path that runs the search, and slow phones pay for hydration."
      - "A client-rendered page gets a static shell that caches well, but results and images wait on JavaScript and a second request, and the department pages that ought to be indexed come off worse."
      - "Then recap from the top of the board down: the mock-up and the requirements, the components and their loop, the question in the URL and the store of answers, the request and its response, the deep dives, and these seven calls."
    draw: [td-render, td-render-not]
    check: Which requirement does server rendering the first page mainly serve, and what does it cost?
    answer: "LCP less than 2.5 s, since images are found in the first bytes, and crawlable department pages; the cost is a server path that runs the search and hydration time on slow phones."
