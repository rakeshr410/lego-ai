beats:
  - point: "Rate each area on impact, users affected and how often it matters, and dive into the top five, the polling budget first; a request goes out only while the tab is visible, only for cards on screen, and only for orders whose status is still active."
    kind: mechanism
    weight: core
    teach:
      - "The hard parts are what staying fresh costs, actions that race the warehouse, and a status that changes while someone reads or listens. Score each area 1 to 3 on impact, users affected and how often it matters, and take the top five. The polling budget scores highest, because naive polling multiplies load by every idle tab."
      - "First, whether a request goes out at all. Only while the tab is visible: the timer is cleared when the tab is hidden or the page is left, and on return it checks at once if the last check is older than the base wait. A tab left open overnight asks nothing."
      - "Only cards on screen: an IntersectionObserver on each active card unwatches it once it scrolls away. Only active statuses: terminal ones have no base wait, so they are never watched."
    draw: [opt, opt-rubric, opt-poll, opt-visible, opt-onscreen, opt-active]
    check: "The shopper leaves the tab hidden for 17 minutes. What goes out, and what happens on return?"
    answer: "Nothing while hidden; on return the last check is older than the base wait, so the poller checks at once."
    misconceptions:
      - "The browser already throttles hidden tabs, so nothing is needed -> the poller clears its own timer; throttling is browser policy, not design."
  - point: "Then how often: one batched GET per page on one timer at the smallest base; an unchanged answer is a 304 with no body; each 304 doubles the wait up to 4 times the base and any change resets it; failures back off with jitter, never before Retry-After."
    kind: mechanism
    weight: core
    teach:
      - "Three active cards make one request, not three: one GET for the sorted ids, on one timer that uses the smallest base among them."
      - "It sends the set's last ETag in If-None-Match, so a check that finds nothing new downloads nothing. A parcel resting at a hub for two days needs no check every 5 minutes: each 304 doubles the wait, up to 4 times the base, and any change brings it back to the base."
      - "When the server is struggling, the open tabs must not all hit it together: back off exponentially with jitter, up to 10 minutes, and never sooner than Retry-After."
    draw: [opt-batched, opt-304, opt-doubling, opt-backoff]
    check: "A parcel sits at a hub for two days. How does the poller avoid checking it every 5 minutes?"
    answer: "Each 304 doubles the wait, up to 4 times the base, so 20 minutes; any change resets it to the base."
  - point: "In numbers: one tab with a shipped order, open an hour and visible for 20 minutes, makes 120 requests on a fixed 30 s poll, 40 when paused while hidden, about 2 with backoff; across 400,000 tabs, about 13,300 a second becomes about 190."
    kind: metric
    weight: core
    teach:
      - "Start with one tab holding a shipped order, open an hour and visible for 20 minutes. A fixed 30 second poll makes 120 requests; pausing while hidden cuts that to 40; backing off from 5 minutes, about 2."
      - "Across the fleet, assume 400,000 orders tabs open at peak: a fixed 30 second poll is about 13,300 requests a second. Half show an active order on screen and 35 percent of those are visible, so 70,000 tabs poll at all; at an average wait of 6 minutes that is about 190 a second, some 70 times fewer."
      - "Most of the saving comes from not asking, rather than from a longer interval, and most of what is left are 304s with no body."
    draw: [opt-per-tab, opt-naive, opt-ours]
    check: "Where does most of the saving come from?"
    answer: "From not asking at all, in hidden tabs and for orders nobody is looking at, rather than from the interval."
  - point: "Actions race the warehouse: one allowedActions function for list and detail; a 409 carries the current shipment, which the store applies, with a message chosen by its code; focus moves to the card heading; one pending action per shipment and one Idempotency-Key per cancel stop a double cancel."
    kind: mechanism
    weight: core
    teach:
      - "allowedActions is one pure function of the status plus two facts from the server, the return-by date and whether the address is locked. Both pages use it, so the list can't offer Cancel while the order page doesn't."
      - "On a refusal the store applies the shipment that came with the 409, and the card picks its message by the error code instead of showing the server's wording. The pressed button is gone, so focus moves to the card heading and the message is announced politely."
      - "A double click or a retry must not send two cancels: one pending action per shipment disables its buttons, and every attempt reuses the same key until it settles."
    draw: [opt-races, opt-one-table, opt-409, opt-pending]
    check: "The shopper double-clicks Cancel. Why does only one cancel happen?"
    answer: "The first click records the shipment's one pending action, which disables its buttons, and every attempt reuses the same Idempotency-Key until it settles."
    misconceptions:
      - "Show the server's error text -> the message is chosen by the error code, and the card shows the new status."
  - point: "Status changes are accessible: the timeline is an ordered list with aria-current on exactly one step, badges say the status in words, one polite region present from the first render says one sentence per check that changed something, and polling never moves focus."
    kind: rule
    weight: core
    teach:
      - "A coloured bar tells a screen reader nothing. The timeline is an ordered list, one item per step, with aria-current step on exactly one, and CSS draws the bar from it. Badges name the status in words, not only in colour."
      - "One role status region, there from the first render, speaks one sentence per check that changed something: 2 orders updated, blender out for delivery, skillet shipped. Cards update in place by key, so polling never takes focus; only the shopper's own action moves it."
    draw: [opt-access, opt-timeline, opt-polite]
    check: "Two orders change in one check. What does a screen reader user hear?"
    answer: "One polite sentence for the batch, naming both changes; focus stays where it was."
  - point: "A delivery date is a calendar date, not an instant: estimates arrive as dates and are formatted in UTC, or Tuesday turns into Monday west of UTC; near dates read as today and tomorrow; money comes in minor units with its currency; the timeline follows right to left."
    kind: rule
    weight: core
    teach:
      - "A date-only string parses as midnight UTC. Shown in local time, an estimate of Tuesday 13 October turns into Monday 12 for a shopper west of UTC, so the API sends estimates as dates and the client formats them in the UTC time zone."
      - "Close to today, words beat dates: today and tomorrow, against the viewer's own date. Event times are instants, shown in the viewer's zone. Money comes as whole minor units with its currency, never as a floating-point number, and counts go through plural rules, so never 1 orders."
      - "In Arabic or Hebrew the timeline must run the other way, so it uses logical properties, inline start and end, and follows the document's direction."
    draw: [opt-locale, opt-dates, opt-words, opt-rtl]
    check: "An estimate of Tuesday 13 October shows as Monday for a shopper west of UTC. What went wrong, and what is the fix?"
    answer: "The date-only string was parsed as UTC midnight and shown in local time; format estimates with the UTC time zone."
  - point: "Order ids in URLs are guessable, so the server checks ownership on every read and write and answers 404; a cancel needs SameSite=Lax cookies and a CSRF token; nothing goes to browser storage, responses are private, and sign-out clears the store."
    kind: rule
    weight: core
    teach:
      - "Changing W4-58213 to W4-58214 in the URL must not show a stranger's address: the server checks ownership on every read and write and answers 404. Against another site posting a cancel: SameSite=Lax session cookies and a CSRF token on every POST; the idempotency key replaces neither."
      - "On a library computer, nothing goes to localStorage or IndexedDB, responses are private, no-cache, and sign-out clears the store. Telemetry carries action names and status codes, never search queries; the invoice is rendered on the server under the same checks, noindex and private."
    draw: [opt-security, opt-owner, opt-csrf, opt-storage]
    check: "Why does the Idempotency-Key not protect against a forged cancel?"
    answer: "It only makes repeats safe; a forged POST is stopped by SameSite=Lax cookies and the CSRF token."
  - point: "Loading, empty and offline states say what to do next: skeleton rows only on a client navigation with nothing cached, an empty search repeats the query and range and offers all time, and offline the shown orders keep their last update time while actions say they need a connection."
    kind: rule
    weight: supporting
    teach:
      - "Skeleton rows show only when a client navigation has nothing cached, such as picking 2025 as the range; they hold the cards' height and stay hidden from assistive tech while the list is busy."
      - "A search with no match repeats the query and range and offers the same search across all time. Offline, the shown orders stay, marked with their last update time; polling pauses until the connection is back, and actions say they need one."
    draw: [opt-edge]
    check: "A search for a toaster in 2025 finds nothing. What should the page offer?"
    answer: "It repeats the query and the range, and offers the same search across all time."
