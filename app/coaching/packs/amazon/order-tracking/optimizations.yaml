# Orders and tracking interview, optimizations: the five deep dives the rubric picks, each in its own area. The polling budget (filters that decide whether a request goes out, then how often, and what it saves for one tab and across every open tab), status-gated actions and their races, accessibility of status and timeline, dates, money and locales, security and privacy, then the loading, empty and offline states. The keep leaves out the functional lines, the first state sketch and most of the mock-up, to stay within 120 ids.
id: amazon/order-tracking/optimizations
title: Fresh for almost nothing, and honest buttons
source:
  hash: "e881133d9220"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/order-tracking/interface-definition
  assumes:
    - "Targets: zero requests while hidden, 304 for unchanged checks, no polling at terminal statuses; every 409 shows the new status, zero duplicate cancels; WCAG 2.2 AA, CLS below 0.1."
    - "StatusPoller sends one batched GET /api/orders/status with If-None-Match; base wait 5 min, 2 min out for delivery, 30 s cancel requested."
    - "POST /api/orders/{id}/cancel carries an Idempotency-Key and answers 200, 202 or 409 with the current shipment."
    - "OrdersPage owns the one polite live region; OrderCard reports whether it is on screen."
  carries:
    - "A request goes out only while the tab is visible, only for cards on screen, and only for active statuses."
    - "One batched GET per page; 304 with no body when unchanged; each 304 doubles the wait up to 4 times the base; failures back off with jitter."
    - "One tab open an hour: 120 requests at a fixed 30 s, 40 paused while hidden, about 2 with backoff; across 400,000 tabs, about 13,300 a second becomes about 190."
    - "One allowedActions table, a 409 that carries the truth, focus to the card heading, one pending action and one key per cancel."
    - "Timeline as an ordered list, one polite message per check; estimates formatted in UTC; ownership checked on the server, nothing in browser storage."
    - "Edge states: skeletons only on a client navigation with nothing cached; an empty search offers all time; offline keeps the last update time."
  terms:
    - term: catch-up check
      means: The check StatusPoller makes at once when the tab becomes visible and the last check is older than the base wait.
    - term: jitter
      means: A random share of the backoff wait, so tabs that failed together do not all retry at the same moment.
    - term: date-only estimate
      means: A delivery estimate sent as a calendar date, not an instant, and formatted in UTC so it never moves a day.
