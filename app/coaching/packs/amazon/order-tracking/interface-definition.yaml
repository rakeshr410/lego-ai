beats:
  - point: "Plain HTTP fits: conditional GETs for pages, details and the status check, and one POST for cancel; server-sent events would keep a connection per tab open for hours for perhaps one change, a WebSocket has nothing to carry upward, and push and email are the backend's job."
    kind: decision
    weight: core
    teach:
      - "Choose the transport first: plain HTTP. Reads are conditional GETs, which answer 304 when nothing has changed; the only write that can race is a POST that is safe to send twice and explains a refusal."
      - "A shipment moves a few times over several days, so a batched GET every few minutes while the page is visible is cheaper than an open connection. A server-sent stream would sit open per tab for hours to carry maybe one change. A WebSocket has nothing to send upward, and no change here must land within the second."
      - "Push notifications and email belong to the backend, for when the page is closed; they add to the page rather than replace it."
    draw: [api, if-transport]
    check: "Why not server-sent events for status changes?"
    answer: "A shipment changes only a few times over days; a stream would hold a connection per tab for hours for perhaps one event, while a batched GET every few minutes costs less."
  - point: "The list is GET /api/orders with tab, range, q, page and as_of: ten orders by placed_at then id, both descending; page 1 returns as_of and later pages send it back, so new orders don't shift them."
    kind: component
    weight: core
    teach:
      - "Write the request: GET slash api slash orders, with the tab (Orders, Buy again or Not yet shipped), the range (30 days, 3 months, a year or all), the search q, which matches titles and order numbers, and the page. Same-origin cookies say who is asking."
      - "Write the response as JSON: orders, each with id, placed date, total, ship-to name, its ETag and its shipments inline; then page, page count, total count and as_of. It is sent private, no-cache."
      - "Ten orders a page, by placed date and then id, both descending. Page 1 returns as_of; later pages pass it back, the as_of from page one, so orders placed since don't shift them."
    draw: [if-reads, if-get-orders, if-orders-res1, if-orders-res2, if-orders-res3]
    check: "A new order is placed while the shopper is on page 1. Why does page 2 not shift?"
    answer: "Page 2 sends back as_of from page 1, so it is cut from the same snapshot."
    misconceptions:
      - "Page 2 is cut from the orders as they are now -> it passes page 1's as_of back, so new orders don't shift it."
  - point: "One order is GET /api/orders/{id}, with its lines, totals, address, payment and shipment events; on a matching If-None-Match it answers 304 with no body, and another shopper's order answers 404, never 403."
    kind: mechanism
    weight: core
    teach:
      - "Write the order page's request: GET slash api slash orders slash W4-58213, sending the ETag it holds in If-None-Match."
      - "Changed, it answers 200 with the order: id, placed date, total, ship-to, payment, and each shipment with its status, return-by date and events, from preparing to delivered, plus a new ETag. Unchanged, it answers 304 with no body; the ETag and Cache-Control repeat, and the store only moves fetched_at and fresh_until on."
      - "An order id that belongs to another shopper answers 404, never 403."
    draw: [if-get-order, if-order-res, if-order-res2, if-order-304, if-order-404]
    check: "The order has not changed since its last ETag. What comes back, and what does the store do?"
    answer: "A 304 with no body; the store only bumps fetched_at and fresh_until."
    misconceptions:
      - "A 304 sends the order again -> it has no body; only the ETag and Cache-Control repeat."
  - point: "The poller's check is one batched GET /api/orders/status?ids= for up to 20 orders, the ids sorted so a set always has one URL and one validator; with If-None-Match it gets 200 with the shipments and a new ETag, or 304, and then the wait doubles, up to 4 times the base."
    kind: mechanism
    weight: core
    teach:
      - "Write the status check: GET slash api slash orders slash status, with the ids of the skillet and the blender, sorted. Up to 20 orders go in one request, and a given set always has the same URL and the same validator."
      - "It sends If-None-Match e41. Changed: 200 with each shipment's id, order id, status, when it changed and its estimate, and the new ETag e42. Unchanged: 304, and the poller doubles its wait, up to 4 times the base."
      - "The script sends it with the default cache mode, so the browser passes it on as it is and the page sees the 304 itself."
    draw: [if-status, if-get-status, if-status-etag, if-status-res1, if-status-res2, if-status-304]
    check: "Why sort the ids in the status request?"
    answer: "So the same set of orders always has the same URL and the same validator."
  - point: "Cancel is POST /api/orders/{id}/cancel with an Idempotency-Key; the server decides from the status at that moment: 200 cancelled with a refund, 202 cancel_requested, or 409 not_cancellable with the current shipment, and the same key always gets the same answer."
    kind: decision
    weight: core
    teach:
      - "Write the cancel: POST slash api slash orders slash W4-58190 slash cancel, with the item ids and a reason, the Idempotency-Key k-3fa1 and the CSRF token."
      - "Three answers. 200: the shipment is cancelled, with the refund. 202: cancel requested; the card says so, and it is polled at a 30 second base. 409 not_cancellable: the error plus the shipment as it is now; OrderActions applies the shipment and shows its own message."
      - "A key, once used, always gets the same answer back. So after a server error the cancel is retried once with the same key, and it can never cancel twice."
    draw: [if-cancel, if-post-cancel, if-cancel-key, if-cancel-200, if-cancel-202, if-cancel-409]
    check: "The cancel gets a 5xx and is retried once. Why can it not cancel twice?"
    answer: "It carries the same Idempotency-Key, and the same key always gets the same answer."
    misconceptions:
      - "A 409 is just an error to show -> it carries the current shipment, which the store applies."
  - point: "Errors share one shape, a code and a message plus the current shipment where it matters, and who reacts depends on whether it was a page, a poll or an action: a 401 signs in and repeats, a 429 makes a poll wait for Retry-After and an action re-enable."
    kind: rule
    weight: core
    teach:
      - "Every error has one shape: a code and a message, plus the current shipment when the status explains the refusal. Who reacts depends on whether it was a page, a poll or an action."
      - "401 means the session ran out. The page stays as it is, polling stops, sign-in opens, and then the request goes again; a cancel goes again with the key it already had."
      - "429 or 503: a poll waits at least as long as Retry-After; an action turns its button back on with a message, and a POST is never retried on a timer."
    draw: [if-error-shape, if-error-note]
    check: "A poll and a cancel both get 429 with Retry-After. What does each do?"
    answer: "The poll waits at least Retry-After before checking again; the cancel re-enables its button with a message and is never retried on a timer."
  - point: "Cards and pages never fetch: they read the store and dispatch actions such as pageRequested, statusesUnchanged and cancelRequested; an OrderCard takes an order id and reports a pressed action and whether it is on screen."
    kind: component
    weight: supporting
    teach:
      - "Between components it is store actions, not fetches. A URL change requests a page, drawn at once if cached and fetched if missing or older than 60 seconds. An unchanged check only bumps freshness, so nothing re-renders. A cancel request records a pending action, so only that card's buttons disable."
      - "OrderCard knows nothing of HTTP or timers: it takes an order id, reports the button pressed, and reports from an IntersectionObserver whether it is on screen, which watches or unwatches it."
    check: "A status check comes back 304. What does the store do, and does anything re-render?"
    answer: "It bumps fetched_at and fresh_until only; nothing re-renders."
  - point: "StatusPoller's loop: a terminal order is never watched; a new id set drops the old ETag; the timer stops while hidden or once the page is left, and a return checks at once if the last check is older than the base; a 200 resets the wait, a 304 doubles it, a failure backs off."
    kind: mechanism
    weight: supporting
    teach:
      - "Watching an order at a terminal status does nothing, and a new set of ids drops the old ETag, since the set needs a validator of its own. The timer is cleared when the tab is hidden or the page is left. Back on the tab or back from the back-forward cache, it checks at once if the last check is older than the base wait; coming online, it checks too."
      - "A 200 resets the wait to the base, a 304 doubles it up to 4 times the base, and a failure backs off with jitter, up to 10 minutes and never sooner than Retry-After."
    check: "Why does the poller drop its ETag when an order is added to the watched set?"
    answer: "The ETag belongs to the answer for one exact set of ids; a new set needs a new validator."
