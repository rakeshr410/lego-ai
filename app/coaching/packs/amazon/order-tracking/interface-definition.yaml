# Orders and tracking interview, interface: plain HTTP, then the endpoints written as requests with their JSON responses. Pages and the order page on one side (as_of, ETag and 304, 404), the batched status check and the cancel in areas of their own on the other (Idempotency-Key, 200, 202, 409), the error cases, and how the store and StatusPoller use them.
id: amazon/order-tracking/interface-definition
title: Conditional GETs and one racing POST
source:
  hash: "384e0091adbc"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/order-tracking/data-model
  assumes:
    - "OrdersStore keeps orders and shipments by id, each with its ETag, fetched_at and fresh_until, and list pages by query with as_of."
    - "OrdersService is the only HTTP caller; StatusPoller watches active orders on screen; OrderActions sends the cancel."
    - "A cancel while preparing is only a request the warehouse confirms; delivered, cancelled and returned are never polled."
  carries:
    - "Plain HTTP: conditional GETs that return 304 when nothing changed, and one POST that is safe to repeat; no SSE or WebSocket."
    - "GET /api/orders with tab, range, q, page and as_of: ten orders by placed_at then id, descending; page 1 returns as_of, later pages send it back."
    - "GET /api/orders/{id} answers 304 with no body on a matching If-None-Match, and 404, never 403, for another shopper's order."
    - "GET /api/orders/status?ids= is the poller's batched check, up to 20 sorted ids; 200 with shipments and a new ETag, or 304."
    - "POST /api/orders/{id}/cancel with an Idempotency-Key: 200 cancelled, 202 cancel_requested, or 409 not_cancellable with the current shipment."
    - "Cards and pages never fetch; they read the store and dispatch actions. A 304 only bumps freshness, with no re-render."
  terms:
    - term: conditional GET
      means: A GET that sends the last ETag in If-None-Match, so the server can answer 304 Not Modified with no body.
    - term: ETag
      means: A validator the server sends with a response; the client sends it back to ask whether anything changed.
    - term: as_of
      means: The time of page 1's snapshot, returned with page 1 and sent back with later pages so new orders don't shift them.
    - term: Idempotency-Key
      means: A key sent with the cancel; the same key always gets the same answer, so a retry never cancels twice.
