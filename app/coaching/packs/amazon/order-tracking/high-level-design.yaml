# Orders and tracking interview, high level design: drawn once the requirements are on the board. A mock-up of Your Orders first (only what the shopper sees; it comes after the requirements here because the article draws the screen in its high level design section), then the components derived from it (OrdersPage with its OrderCards, the order page, and OrdersStore, StatusPoller, OrderActions, OrdersService and CartStore behind them), one visit walked over them, then the shipment's status as a state machine that decides the buttons and the polling.
id: amazon/order-tracking/high-level-design
title: Components, then the status machine
source:
  hash: "f2b4df999653"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/order-tracking/requirements-exploration
  assumes:
    - "A delivery status lives on the shipment; a card shows one status line per shipment."
    - "The requirements are written: only actions the status allows, live updates while the page is open, zero requests while hidden, 304 for unchanged checks, no polling at terminal statuses."
    - "Base wait 5 min, 2 min out for delivery; 0 to 3 active orders on a page."
  carries:
    - "The mock-up: Your Orders with three tabs, search, a range, a count, a card per order (blender, skillet, socks, lamp) and page links; a card shows the order, a status line and its buttons."
    - "The UI: OrdersPage (route /orders, URL query, the one polite live region) holding OrderCards (a ShipmentStatusLine per shipment, ActionButtons), and OrderDetailPage (/orders/{id})."
    - "Behind the UI: OrdersStore (orders and shipments by id, pages by query), StatusPoller, OrderActions, OrdersService (the only HTTP caller) and the cart topic's CartStore; the Orders API is a black box."
    - "OrdersPage loads a page from the store by query; cards never fetch: they read the store, ask the poller to watch them, and pass pressed buttons to OrderActions."
    - "Page 2 carries page 1's as_of and a stable order (placed date, then id); a search goes into the URL, resets to page 1 and widens to all time."
    - "Shipment status is a server-owned state machine: placed, preparing, shipped, out for delivery, delivered, with cancelled, cancellation requested, a failed delivery attempt and returned."
    - "allowedActions(status) is one table for list and detail; the status sets the base wait (5 min, 2 out for delivery, 30 s cancel requested); delivered, cancelled, returned are never polled."
  terms:
    - term: OrdersStore
      means: The client store holding orders and shipments by id, each with its ETag and a freshness deadline, and list pages by query.
    - term: StatusPoller
      means: Keeps active orders on screen fresh with one batched conditional request per page, paused while the tab is hidden.
    - term: OrderActions
      means: Derives the allowed actions from status, sends a cancel with an idempotency key, and turns a 409 into the new status plus an explanation.
    - term: allowedActions
      means: One pure table from a shipment's status (plus facts from the server) to the buttons a card or the order page shows.
    - term: base wait
      means: The poll interval a status sets; 5 minutes, 2 out for delivery, 30 seconds while a cancel is requested.
