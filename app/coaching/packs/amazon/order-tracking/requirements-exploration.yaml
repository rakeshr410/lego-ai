# Orders and tracking interview, the prompt and the requirements: the title on the board (Your Orders and the order page of an Amazon-like store; the server a black box, we design the UI), the questions that shape the design, then the functional and non-functional lists, one fact a line, the working numbers and what is out of scope.
id: amazon/order-tracking/requirements-exploration
title: The prompt, then two lists
source:
  hash: "888d8470e9cb"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - "The interview designs Your Orders and the order page of an Amazon-like store; the server is a black box that owns every status and rule, and we design the UI in the browser."
    - "A delivery status lives on the shipment, not the order: one order can split into shipments that move independently, so a card shows one status line per shipment."
    - "We assume a status should be fresh within one polling interval while the page is visible: about 2 minutes once out for delivery, 5 before."
    - "Functional: newest first with a status per shipment; range, tabs, search and pages in the URL; live updates; only allowed actions; detail page, Buy it again, invoice, offline reading."
    - "Non-functional: LCP below 2.5 s; route JS at most 80 KB; a change shown within 2 min out for delivery, 5 before; zero requests while hidden; unchanged checks get 304; no polling at terminal statuses."
    - "Non-functional: every 409 shows the new status; zero duplicate cancels; CLS below 0.1; WCAG 2.2 AA; at most one polite announcement a batch; every locale; no order data stored; Cache-Control private."
    - "Working numbers: 10 orders a page, page 1 rendered on the server; 0 to 3 active orders on a page; base wait 5 min, 2 min out for delivery; the longest wait no more than 4 times the base."
  terms:
    - term: order
      means: One purchase on Your Orders, with its date, total and ship-to; it can split into several shipments.
    - term: shipment
      means: The part of an order that travels as one parcel and carries a delivery status.
    - term: active order
      means: An order with a shipment that is not yet delivered, cancelled or returned; most orders on a page are delivered, so only 0 to 3 are active.
    - term: functional requirement
      means: What the shopper can see or do on the orders pages.
    - term: non-functional requirement
      means: How well the pages must work, one metric a line, tied to a target that can be checked.
    - term: LCP
      means: Largest Contentful Paint, when the largest piece of content shows; here it should be less than 2.5 s on a phone.
    - term: CLS
      means: Cumulative Layout Shift, how much content jumps under the reader; here a status that changes or grows must not push the cards below it.
