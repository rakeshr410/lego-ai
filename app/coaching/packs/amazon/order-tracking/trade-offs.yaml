# Orders and tracking interview, trade-offs: six decisions, each written as the choice and the cost it accepts, with the options it was weighed against said aloud: keeping status fresh, paging the history, where allowed actions come from, cancel feedback, searching, and keeping history on the device. Then a short recap of the board; the keep holds each earlier area's frame and its main contents, within the 120 ids allowed.
id: amazon/order-tracking/trade-offs
title: Six choices, each with its cost
source:
  hash: "e795f4bb136d"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/order-tracking/optimizations
  assumes:
    - "StatusPoller checks only active orders on screen while the tab is visible, with one batched conditional GET and a doubling wait."
    - "Pages are numbered, ordered by placed_at then id, pinned by as_of, and kept in the URL with tab, range and search."
    - "allowedActions(status) is one table for list and detail, and the server re-checks every action; a 409 carries the current shipment."
    - "Nothing about orders is kept in browser storage; sign-out clears the store."
  carries:
    - "Conditional polling over server-sent events or push and reload: it matches how rarely a shipment changes; a change can take one base wait to show."
    - "Numbered pages with as_of in the URL over infinite scroll or Load more: shareable and easy to return to; offsets need as_of."
    - "Actions derived on the client and re-checked by the server over a server-sent list: same render as the status; a policy change needs a deploy."
    - "Cancel waits for the server over an optimistic cancel; server search over filtering loaded pages; memory and the back-forward cache over IndexedDB."
  terms:
    - term: trade-off
      means: A choice written with what it gains and the cost it accepts, with the options it was weighed against.
    - term: back-forward cache
      means: The browser keeping a page in memory so Back and Forward return to it as it was.
