# Orders and tracking interview, data model: what an OrderCard reads, written as one nested order, then normalized into OrdersStore written as JSON that grows key by key (orders and shipments by id, list pages by query, pending actions), the client-only state, and how long each order stays fresh.
id: amazon/order-tracking/data-model
title: Derive the state, then normalize it
source:
  hash: "8dfdfc6256d8"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: amazon/order-tracking/high-level-design
  assumes:
    - "An OrderCard shows one order, its date, total and ship-to, and a status line per shipment with the buttons its status allows."
    - "OrdersStore holds what the cards read; StatusPoller watches active orders on screen; OrderActions sends a cancel."
    - "A shipment's status is a server-owned state machine, from placed to delivered, cancelled or returned."
  carries:
    - "State is derived from the components: an OrderCard reads one order (date, total, ship-to) with each shipment's status, estimate and items; the page response sends shipments inline."
    - "OrdersStore keeps orders and shipments by id, stored once whichever page or search brought them in; an order points to its shipments by id."
    - "List pages are kept by query (tab, range, search, page) and hold only ids, with the total, page count and as_of."
    - "Client only: one pending action per shipment with its idempotency key; StatusPoller's watched ids, ETag, wait and failures; one announcement per check."
    - "fresh_until comes from the least settled shipment: 0 s cancel requested, 30 s active, 1 h delivered, the session once final; list pages 60 s."
  terms:
    - term: normalized store
      means: A store where each order and shipment is kept once in a map by id, and records refer to each other by id instead of nesting.
    - term: fresh_until
      means: The time until which the store trusts an order without asking the server, set from its least settled shipment.
    - term: query key
      means: The tab, range, search and page that name one list page in the store.
    - term: least settled shipment
      means: The order's shipment whose status the store can trust for the shortest time; it sets fresh_until for the whole order.
