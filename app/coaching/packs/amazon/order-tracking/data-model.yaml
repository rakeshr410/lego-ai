beats:
  - point: "Derive the state from the components: an OrderCard reads one order, its date, total and ship-to name, and for each shipment its status, delivery estimate and items; the page response sends each order this way, shipments inline."
    kind: component
    weight: core
    teach:
      - "Start from the components we just drew, not from a store shape. Each OrderCard needs one order, so write what it reads as JSON, a key at a time."
      - "The order's placed date, its total and the ship-to name for the card's header. Then its shipments, each with a status for the status line, a delivery estimate, and the items."
      - "The page response sends each order like this, shipments inline, along with its id and ETag, plus the page number, page count, total count and as_of."
    draw: [state, naive, need-order, need-shipments, need-items]
    check: "Where do you start when deciding the client's state?"
    answer: "From the components: walk them and write down what each one reads."
  - point: "Kept as each response sends it, the same order arrives on page 1 and again from a search, so it is held twice and a fresher status on one copy leaves the other behind."
    kind: failure
    weight: supporting
    teach:
      - "That shape works for one page. But the blender is on page 1 and turns up again in a search for blender, so it is held twice."
      - "When the poller learns it is out for delivery, one copy changes and the other still says shipped."
    draw: [naive-note]
    check: "In the nested shape, what goes wrong when the same order is on a page and in a search result?"
    answer: "It is held twice, so a newer status on one copy leaves the other copy stale."
  - point: "Normalize: OrdersStore keeps orders and shipments by id, each stored once whichever page or search brought it in; an order points to its shipments by id and carries its ETag, fetched_at and fresh_until, and the shipment is the unit that has a status."
    kind: decision
    weight: core
    teach:
      - "So normalize, splitting each response into records by id. Open the store and add orders by id: the blender's order keeps its placed date and total (minor units plus a currency), the ship-to name, its shipment ids, its ETag, when it was fetched and until when it is fresh."
      - "Then shipments by id, the unit that has a status: its order id, the status and when it last changed, its estimate as a date-only range, when it was delivered, the return-by date and its items."
      - "Now the search result and page 1 point at one blender, and a new status is one write that every card showing it reads."
    draw: [store, normalize, js-orders, js-order-more, js-order-end, js-shipments, js-shipments-more, js-shipments-end]
    check: "The blender goes out for delivery. In the normalized store, what changes?"
    answer: "One shipment record under shipments; every card showing the blender reads it from there."
    misconceptions:
      - "Status belongs on the order record -> the shipment is the unit with a status; an order lists its shipment ids."
  - point: "List pages are their own key, kept by query (tab, range, search and page): each holds only the ids in order, the total and page count, the as_of time and when it was fetched; the cards read the orders from the store."
    kind: component
    weight: core
    teach:
      - "The list's order is not a property of any order, so it gets its own key: pages, one entry per query key, made of tab, range, search and page."
      - "Each holds the ids in order, the total count, the page count, the as_of time from the server, and when it was fetched. Ids only: the cards read the orders from the store, so a fresher copy of an order always wins."
    draw: [js-pages, js-pages-more]
    check: "Why does a list page hold only ids?"
    answer: "So each order is kept once; the cards read it from the store, and the freshest copy wins whichever page shows it."
  - point: "Some state is the client's own: one pending action per shipment with its idempotency key and state; StatusPoller's watched ids, ETag for that id set, wait, last check and failures; and one announcement per check."
    kind: component
    weight: core
    teach:
      - "Close the store with pendingActions by shipment: at most one, of kind cancel, with its idempotency_key and whether it is in flight or failed. The server never sends this; it is the client's own."
      - "Beside the store, StatusPoller keeps one poll state per page: the watched order ids, the ETag for that exact set of ids, the current wait, the last check and the count of failures."
      - "And an announcement, batched per check: its text and the order ids it is about."
    draw: [js-pending, js-pending-more, client, poll-watch, poll-more, announce]
    check: "Which of these never comes from the server: a shipment's status, a pending action, or the poller's wait?"
    answer: "The pending action and the poller's wait; they are client-only state."
  - point: "fresh_until follows the least settled shipment: 0 s while a cancel is requested, 30 s while active, 1 h once delivered, the session once final, 60 s for a list page; a fresh order renders with no request, a stale one renders at once and revalidates."
    kind: mechanism
    weight: core
    teach:
      - "How long the store trusts an order depends on its least settled shipment. While a cancel is requested, 0 seconds: a decision is pending, so every render checks. Placed through out for delivery, or after a failed attempt, 30 seconds, because the warehouse and the carrier change it."
      - "Delivered, an hour: only the shopper's own return changes it, through this client. Cancelled or returned are final, kept until a reload or sign-out. A list page is fresh for 60 seconds."
      - "A fresh order renders from the store with no request. A stale one still renders at once, then revalidates with its ETag."
    draw: [fresh-req, fresh-active, fresh-final, fresh-pages]
    check: "The store fetched the socks' order 20 minutes ago, and the list renders its card again. Does it ask the server?"
    answer: "No. A delivered order is trusted for an hour after it was fetched, so the card renders from the store."
    misconceptions:
      - "A stale order shows a spinner until it is fetched again -> it renders at once from the store and revalidates with its ETag."
  - point: "One field, the shipment's status, drives four decisions: which buttons show, whether it is polled, how long the store trusts it, and how a change is announced."
    kind: rule
    weight: supporting
    teach:
      - "Point at the status key on the shipment. It picks the buttons, decides whether the poller watches it, sets fresh_until, and shapes the announcement when it changes."
    check: "Name the four things a shipment's status decides."
    answer: "The buttons shown, whether it is polled, how long the store trusts it, and how a change is announced."
