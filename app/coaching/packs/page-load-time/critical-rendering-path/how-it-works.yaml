# The critical rendering path: what lands on it, the three numbers that describe it, why depth in round trips wins, the 14 KB first flight, and FCP.
id: page-load-time/critical-rendering-path/how-it-works
title: The critical rendering path
source:
  hash: 14adbdd424dc
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - The browser parses HTML into the DOM and CSS into styles, then lays out and paints.
  carries:
    - The critical rendering path is the blocking stylesheets and parser-blocking scripts, plus the HTML up to the body, that the first paint waits for.
    - "A critical path is described by three numbers: critical resources, critical bytes, and path length in round trips."
    - Depth usually wins, because each round trip on a phone costs 100 to 200 ms and small files are dominated by round trips, not size.
    - A file found only inside another file (an @import, an injected script) adds a link to the chain, and the preload scanner cannot see it.
    - The first round trip of a new connection carries about 14 KB, so a small inlined critical CSS rides with the HTML and a large one does not.
    - First Contentful Paint marks the end of the critical rendering path.
  terms:
    - term: critical rendering path
      means: The files and round trips the first paint must wait for, from the HTML to the blocking CSS and scripts.
    - term: round trip
      means: A request going out and its first byte coming back; 100 to 200 ms on a phone network.
    - term: preload scanner
      means: The part of the browser that reads ahead in the raw HTML to find files to request early.
    - term: first flight
      means: What a fresh TCP connection may send before waiting for acknowledgements, about ten segments or 14 KB.
    - term: FCP
      means: First Contentful Paint, the moment the first text or image is drawn.
