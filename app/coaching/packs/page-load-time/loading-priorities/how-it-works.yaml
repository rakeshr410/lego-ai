# Resource hints, priorities and fonts: discovery and rank, connection and fetch hints, fetchpriority, 103 Early Hints, and font-display with a matched fallback.
id: page-load-time/loading-priorities/how-it-works
title: Resource hints, priorities and fonts
source:
  hash: 1a6d93aa2969
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: page-load-time/critical-rendering-path/how-it-works
  assumes:
    - The critical rendering path is the blocking stylesheets and parser-blocking scripts the first paint waits for.
    - Depth usually wins, because each round trip on a phone costs 100 to 200 ms.
    - A file found only inside another file adds a link to the chain, and the preload scanner cannot see it.
  carries:
    - Every request has two clocks, when its URL is found and its rank in the queue once it is.
    - preconnect warms DNS, TCP and TLS to another origin; dns-prefetch only does the lookup.
    - preload moves discovery earlier for a file found late; it needs the right as, and crossorigin for fonts, or the file downloads twice.
    - fetchpriority changes a request's rank, not when it is found; an img in the HTML wants fetchpriority, not preload.
    - 103 Early Hints let a server send preconnect and preload while it is still building the HTML.
    - "A font face goes through a block, a swap and a failure period; font-display sets their lengths, and no value avoids both invisible and changing text on a slow link."
  terms:
    - term: discovery
      means: The moment the browser learns a file's URL and can request it.
    - term: priority
      means: The rank the browser gives a request, deciding which go first and how a shared connection is split.
    - term: preload
      means: A hint to fetch a file this page will use now, for files the preload scanner cannot see.
    - term: fetchpriority
      means: An attribute or fetch option, high, low or auto, that moves a known request up or down.
    - term: block period
      means: The time text that wants a web font is laid out with an invisible fallback.
    - term: swap period
      means: The time a visible fallback is drawn and still replaced if the web font arrives.
