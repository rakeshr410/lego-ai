beats:
  - point: Every request has two clocks, when its URL is found and its rank once it is, and the browser's default ranks are a guess that is wrong for a few important files.
    kind: mechanism
    weight: core
    teach:
      - Discovery is when the browser learns a URL; priority is where the request stands in the queue, and over HTTP/2 and HTTP/3 how it shares the connection. Hints act on one clock or the other.
      - "Chrome's defaults show the guesses. A stylesheet in the head is Highest and rightly so. An image starts Low until layout shows it is in view; a font is Highest but only requested once layout finds text that uses it; prefetch is Lowest by design."
      - The values are not standardised; Chromium documents its own, and the other engines follow the same broad order.
    draw: [two-clocks, clock-found, clock-rank, p-css, p-hero, p-font, p-prefetch]
    check: Ferrymark's web font is requested at Highest priority, yet it arrives late. Which clock is the problem?
    answer: Discovery; it is ranked high but only requested once layout finds text that uses it, often hundreds of milliseconds after the HTML.
    misconceptions:
      - "A Highest priority means a file arrives early -> rank only orders known requests; a file found late is still late."
  - point: preconnect does the DNS, TCP and TLS work for another origin ahead of time and dns-prefetch only the lookup, and a preconnect only pays off for an origin the page uses straight away.
    kind: rule
    weight: core
    teach:
      - A fresh connection costs about three round trips with TLS 1.3, 300 ms on a 100 ms phone link. preconnect does all of it early; dns-prefetch does only the lookup, which is cheap enough to spread wider.
      - It only helps for other origins, since the page's own already has the connection the HTML came over. A font host's preconnect needs crossorigin, because fonts are fetched in anonymous CORS mode and use a separate connection.
      - A warm connection unused for about 10 seconds is closed, and each costs sockets and CPU, so two or three preconnects for critical origins is the usual ceiling.
    draw: [hints, h-preconnect, h-dns]
    check: Ferrymark adds a preconnect for its own origin and eight more for origins used later. What is wrong with that?
    answer: Its own origin already has a connection, and preconnects to origins not used right away are closed after about 10 seconds while costing sockets and CPU; keep two or three for critical origins and use dns-prefetch for the rest.
    misconceptions:
      - "Preconnect to every origin the page might use -> each costs sockets and handshakes and is dropped after about 10 s unused; two or three is the ceiling."
  - point: preload starts the fetch of a file the preload scanner cannot see, and it must carry the right as, and crossorigin for a font, or the browser cannot match it and downloads the file twice.
    kind: rule
    weight: core
    teach:
      - preload is for files found late, a font named only in CSS, an image set as a CSS background, a script another script injects. as tells the browser what kind of request it is, which priority to use and which cache entry the real use will look up.
      - Preload only downloads. modulepreload also parses and compiles a module and puts it in the module map; prefetch is for the next navigation, at Lowest, same-site only, and Safari ignores it.
    draw: [h-preload, h-modulepreload, h-prefetch, cors-note]
    check: A team preloads Ferrymark's Keelson font without crossorigin. What happens?
    answer: The preloaded copy is a different request from the real one, which fonts make in anonymous CORS mode, so the browser cannot match them and downloads the font twice.
    misconceptions:
      - "crossorigin only matters for fonts on other origins -> fonts are always fetched in CORS mode, so even a same-origin font preload needs it."
      - "preload runs the script -> preload only downloads; modulepreload also parses and compiles a module."
  - point: fetchpriority leaves discovery alone and changes the rank, so an image already in the HTML wants fetchpriority high, and only a file found late needs a preload.
    kind: decision
    weight: core
    teach:
      - Preload moves the first clock, discovery; fetchpriority moves the second, rank. They are easy to confuse.
      - Ferrymark's harbour photo is an img near the top of the HTML, so the scanner finds it at once; what it lacks is rank. fetchpriority high starts it at High instead of waiting for layout to promote it.
      - A low value helps too. Three card photos marked low leave Chrome's Medium head start for the first five large images, so the hero gets through. If everything is high, nothing is.
    draw: [h-fetchpriority]
    check: The hero is an img tag near the top of the HTML. What single hint helps it most, and why not a preload?
    answer: fetchpriority high on the img; the scanner already finds it early, so a preload adds nothing, while the hint lifts its rank from Low or Medium to High from the start.
    misconceptions:
      - "Preload the hero image -> an img in the HTML is found early anyway; it needs rank, which is fetchpriority."
  - point: With 103 Early Hints a server sends preconnect and preload links while it is still building the HTML, so the browser uses the idle wait.
    kind: mechanism
    weight: supporting
    teach:
      - Today's sailings page is built per request, so the connection sits idle for a few hundred milliseconds. The server or CDN sends a 103 carrying Link headers, then the real 200 when ready.
      - Browsers act on preconnect and preload in a 103; Safari acts on preconnect but not preload. The hints go out before the page is known, so they should name what every version needs, the stylesheet, the heading font, the image CDN.
    draw: [early-hints, e-103, e-200, then-200, e-safari, e-common]
    check: What does a 103 Early Hints response let the browser do, and what should it name?
    answer: Act on preconnect and preload links while the server is still building the HTML; it should name things every version of the page needs.
  - point: A font face goes through a block period of invisible text, a swap period of visible fallback, and a failure period where the fallback stays, and font-display sets how long the first two last.
    kind: mechanism
    weight: core
    teach:
      - The timer starts when layout first needs the face. In the block period the text takes space but is invisible; in the swap period the fallback is drawn and replaced when the file lands; in the failure period the browser keeps the fallback.
      - swap has an almost zero block period and an endless swap. block has a short block period, which the spec suggests is about 3 seconds, so it is a recommendation, not a fixed number. optional has a tiny block period and no swap, so a font that misses it waits for the next page. auto is the browser's choice; Chromium and Firefox behave like block.
      - Hidden text is FOIT and a change of face is FOUT. No value avoids both on a slow link; preload the face so it usually lands before the first paint.
    draw: [font-face, ff-declared, ff-block, ff-needed, ff-swap, ff-timer, ff-loaded, ff-arrives, ff-failed, ff-gives-up, font-display, fd-swap, fd-block, fd-optional, fd-auto]
    check: Which font-display value can leave the fallback on screen for the whole page view even if the font arrives a second later, and why?
    answer: optional; it has a tiny block period and no swap period, so a font that misses that window goes straight to failure for this view, and the downloaded file helps the next page.
    misconceptions:
      - "Every browser hides text for exactly 3 s -> 3 s is the spec's suggestion for a short block period; auto leaves it to the browser."
      - "swap avoids every flash -> it trades invisible text for a change of face when the font lands."
  - point: A change of face moves nothing when the fallback is declared as its own font face over a local font with size-adjust and the line-box overrides set to the web font's metrics.
    kind: rule
    weight: core
    teach:
      - Text shifts at the swap when the fallback's letters are wider or narrower or its line box taller or shorter, so lines rewrap and everything below moves.
      - Declare a fallback face over local Arial with size-adjust for width and ascent, descent and line-gap overrides for the line box; the numbers come from the fonts' metric tables. Safari supports size-adjust but not the overrides as of 2026.
      - Ship WOFF2 and subset each face with unicode-range; a preload fetches its URL regardless, so preload only the first screen's subset.
    draw: [fd-metrics]
    check: Why does a swap from Arial to Keelson make the text below jump, and what removes the jump?
    answer: The two fonts have different widths and line heights, so lines rewrap; a fallback face over Arial with size-adjust and the ascent, descent and line-gap overrides matched to Keelson keeps the box the same.
task:
  prompt: Draw the two clocks of a request and put preload and fetchpriority on the clock each one moves, then draw a font face's block, swap and failure periods and mark where swap and optional differ.
  expects: [1, 3, 4, 6]
