# How layout thrashing works: layout as a debt paid once per frame, which reads force it early, what one forced layout costs, and putting reads and writes where they cost nothing extra.
id: rendering-performance/layout-thrashing/how-it-works
title: Batching reads and writes
source:
  hash: "8204486774e4"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: rendering-performance/layout-thrashing/key-idea
  assumes:
    - Layout is lazy; a write only marks what changed, and the browser normally lays out once, before the next frame.
    - A geometry read such as getBoundingClientRect after a write forces style and layout right then, inside the script.
    - A loop that alternates writes and geometry reads forces one layout per item; that is layout thrashing.
    - The fix is to reorder the same work, every read first, then the writes.
  carries:
    - In a frame's rendering update, requestAnimationFrame callbacks run, then style and layout settle every pending mark at once, then paint.
    - Size, offset and scroll reads, getBoundingClientRect, layout-dependent getComputedStyle and innerText force layout when marks are pending; plain DOM state and observer entries never do.
    - A layout's cost grows with how far the change can spread and with the size of the document; a forcing loop multiplies both.
    - Inside one task, do every read before the first write; a shared scheduler can run all queued reads, then all queued writes, once per frame.
    - Read in the event handler and write in a requestAnimationFrame callback.
    - ResizeObserver reports sizes from the frame's own layout, after layout and before paint, so nothing is forced.
  terms:
    - term: rendering update
      means: The browser's per-frame step that runs rAF callbacks, then style and layout, then paint.
    - term: requestAnimationFrame
      means: A callback the browser runs in the rendering update, just before style and layout.
    - term: layout containment
      means: "contain: layout on an element, so a change inside it cannot move anything outside."
    - term: ResizeObserver
      means: An API that calls you with the elements whose size changed, after the frame's layout and before paint.
