beats:
  - point: Layout is a debt normally paid once per frame, writes mark the touched nodes and their ancestors, and in the rendering update rAF callbacks run, then style and layout settle every mark at once, then paint.
    kind: mechanism
    weight: core
    teach:
      - When script changes a class, a style, some text or the tree, the engine flags the touched nodes as needing style and, if geometry could change, layout, and flags their ancestors as holding something dirty. Nothing is recomputed yet.
      - The marks are cleared in the frame's rendering update. requestAnimationFrame callbacks run first, then style and layout settle every pending mark together, then paint. Ten writes or a thousand, the frame pays one bill.
      - A forced read pays the same bill early, inside your task. If more writes follow, the frame has to pay it again.
    draw: [frame-update, raf-callbacks, style-layout, paint-step, then-style, then-paint, one-bill]
    check: In what order does a frame's rendering update run requestAnimationFrame callbacks, style and layout, and paint, and why does that make many writes cost one layout?
    answer: rAF callbacks first, then style and layout, then paint; style and layout settle every pending mark at once, so however many writes came before, they share one layout.
    misconceptions:
      - "A forced layout is extra work on top of the frame's -> it is the same work moved earlier; it only adds up when writes follow and the frame must lay out again."
  - point: Offset, client and scroll sizes, getBoundingClientRect, layout-dependent getComputedStyle values and innerText force layout when marks are pending, while textContent, classList, dataset, inline styles and observer entries never do.
    kind: rule
    weight: core
    teach:
      - Go down the left list. Any read whose answer is a position, a size, a scroll offset, or depends on them, needs a current layout. That includes getComputedStyle for width, whose resolved value is the used value, and innerText, which depends on CSS.
      - The right list is plain DOM or inline-style state, textContent, classList, dataset, el.style. A computed colour needs style but not layout. ResizeObserver and IntersectionObserver entries arrive after the browser has computed layout.
      - "The test: could the answer change because of a write earlier in this task? If yes, the browser must lay out first. That is why one read at the very start of a handler is almost always fine."
    draw: [forcing-reads, offset-reads, client-scroll, rect-reads, computed-width, inner-text, test-q, free-reads, text-content, class-contains, inline-style, computed-colour, observer-entries, intersection]
    check: Tasklane copies a card title to the clipboard with innerText, right after a class change. Does that force layout, and what would not?
    answer: Yes, innerText depends on CSS, so it forces style and layout when marks are pending; textContent reads plain DOM state and forces nothing.
    misconceptions:
      - "Only getBoundingClientRect forces layout -> offset, client and scroll properties, layout-dependent getComputedStyle values and innerText do too."
      - "Reading el.style.height forces layout -> it is the inline style as written; no layout is needed."
  - point: A layout's cost depends on how far the change can spread and on the size of the document around it, so a forcing loop multiplies both, while layout containment can keep a column's change inside it.
    kind: metric
    weight: core
    teach:
      - Compare two changes on Tasklane's board. A gap above one Review card can push only that column's cards down, though the engine still starts from the root to confirm the others. A collapsed sidebar widens every column, so all 400 cards can re-wrap.
      - Layout is almost always scoped to the whole document, and larger DOMs generally cost more. A loop over N cards forces N layouts that each grow with the board, so double the cards and the loop costs three to four times as much; one batched layout grows roughly in line.
      - With contain layout on each column, what happens inside one cannot move anything outside, so the gap's layout stays in Review.
    draw: [layout-cost, one-card, sidebar, whole-doc, contain-layout, two-x]
    check: Why does a forcing loop over twice as many cards cost three to four times as much, rather than twice?
    answer: There are twice as many forced layouts, and each one grows with the size of the board, which has also doubled, so both factors multiply.
    misconceptions:
      - "A small change makes a small layout -> the engine still starts from the root and confirms the rest still fits, so page size matters too."
  - point: Inside one task, do every read before the first write; across components that do not know each other, a small shared scheduler can run every queued read, then every queued write, once per frame.
    kind: rule
    weight: core
    teach:
      - The fixed drop gap keeps midpoints measured before any gap was opened, which is what keeps the cache valid, and skips the write when the target card has not changed, so most moves touch nothing.
      - By hand, the rule is simple inside one task, reads first. Across separate components it is hard to keep, so one way out is a shared scheduler. Components queue reads and writes instead of touching the DOM, and once per frame it runs all the reads, then all the writes.
    draw: [scheduler, queued-reads, queued-writes, then-writes, skip-write, read-before]
    check: Two components each read a size and then write a style in the same frame. How does a shared scheduler stop them forcing a layout each?
    answer: Both queue their reads and writes; once per frame it runs all the reads first, from one layout, then all the writes, so no read follows a write.
  - point: Writes made in a requestAnimationFrame callback are settled by the layout that runs right after, so the safe pattern is to read in the event handler and write in rAF; a read inside rAF after another callback's write still forces layout.
    kind: rule
    weight: core
    teach:
      - rAF callbacks run inside the rendering update, after the frame's resize and scroll events and just before style and layout. A write there costs nothing extra; the layout that follows was going to run anyway.
      - Reads there are another matter. If an earlier callback in the same frame wrote something, the read forces layout.
      - So split the work. Read in the event handler, while layout is still the one the last frame computed, and hand the write to a rAF callback.
    draw: [raf-ro, handler-read, raf-write, hands-off]
    check: Why is requestAnimationFrame a good place for writes but a risky place for reads?
    answer: Its writes are settled by the layout that runs right after it; a read there can follow another callback's write and force layout, so reads belong in the event handler.
    misconceptions:
      - "Anything inside requestAnimationFrame is free -> writes are; a read after another callback's write still forces layout."
  - point: ResizeObserver answers whether something changed size without a read, calling back after the frame's layout and before paint, and its callback must converge or the leftover changes wait a frame and raise a loop error.
    kind: mechanism
    weight: core
    teach:
      - Many reads exist only to learn whether something resized, a column narrowed when the sidebar opened, a card grew under a long title. Register the elements, and after layout, before paint, the browser calls back with the ones whose size changed, using the layout it just did.
      - Tasklane's old window resize handler read every column's width and wrote a density, read, write, read, write, and missed the sidebar toggle entirely. The observer version gets the toggle too, and the first value arrives as soon as observing starts.
      - If the callback changes sizes again, the browser lays out again and reports only deeper elements; the rest wait for the next frame with the error ResizeObserver loop completed with undelivered notifications. Make it converge, the same width giving the same density, or move the write to rAF.
    draw: [resize-observer, ro-timing, ro-loop]
    check: Why does Tasklane's ResizeObserver set a column's density without forcing layout, and what keeps it out of the loop error?
    answer: Its sizes come from the layout the browser just did, delivered after layout and before paint; it only writes when the density actually changes, so the same width always gives the same answer and the callback converges.
    misconceptions:
      - "A window resize listener catches every size change -> it misses changes like the sidebar toggle, where the window does not resize."
task:
  prompt: Draw one frame's rendering update, mark where Tasklane's drop gap should read and where it should write, and add where a ResizeObserver callback fires.
  expects: [1, 5, 6]
