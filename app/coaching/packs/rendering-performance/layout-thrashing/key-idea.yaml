# Layout thrashing's idea: writes only mark layout dirty, a geometry read after a write forces layout now, and a loop that alternates them pays a layout per item.
id: rendering-performance/layout-thrashing/key-idea
title: When layout runs early
source:
  hash: "5501f5296cd9"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - "Rendering is a chain of stages: parse, style, layout tree, layout, paint, raster, composite."
    - Parsing, style, layout and paint run on the main thread; raster and compositing run on other threads.
    - The first read after a DOM change forces one layout; later reads reuse it as long as nothing is written between them.
  carries:
    - Layout is lazy; a write only marks what changed, and the browser normally lays out once, before the next frame.
    - A geometry read such as getBoundingClientRect after a write forces style and layout right then, inside the script.
    - A loop that alternates writes and geometry reads forces one layout per item; that is layout thrashing.
    - The fix is to reorder the same work, every read first, then the writes.
  terms:
    - term: dirty
      means: Marked as changed since the last layout, with nothing recomputed yet.
    - term: forced layout
      means: A layout the browser runs inside a script because a read needs geometry that a write has made stale.
    - term: layout thrashing
      means: Alternating writes and geometry reads in a loop, so every turn forces a full layout.
    - term: frame budget
      means: The time between screen refreshes, 16.7 ms at 60 Hz, that all of a frame's work must fit in.
