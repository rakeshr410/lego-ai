beats:
  - point: Layout is lazy, a write such as a class change only marks what changed, and the browser normally works out the geometry once, just before it draws the next frame.
    kind: mechanism
    weight: core
    teach:
      - Start with what a write really does. Adding a class or changing a style recomputes nothing; the browser notes that something is dirty and moves on, so the write itself is cheap.
      - The bill is paid later, once, when the browser gets ready to draw the next frame. Many writes in one task still mean one layout.
    draw: [lazy, write-class, dirty-marks, frame-layout, marks, settled-by, writes-cheap, colour-key]
    check: Your script adds a class to a card. What does the browser do at that moment, and when does it lay the page out?
    answer: It only marks the change as dirty; it recomputes style and layout later, once, before drawing the next frame.
    misconceptions:
      - "Every class change runs layout immediately -> it only marks the change; layout runs once per frame unless something forces it sooner."
  - point: A geometry read such as getBoundingClientRect right after a write cannot be answered from the old layout, so the browser recalculates styles and lays the page out right then, inside the script.
    kind: mechanism
    weight: core
    teach:
      - Now ask the browser a question. After adding gap-before to a Review card, Tasklane's script reads the card's rectangle.
      - The answer depends on whether the class moved the card, and the browser has not worked that out yet. So it stops the script, runs style and layout for everything dirty, and only then returns the rectangle.
      - The same read with nothing pending is cheap; it returns what the last frame already computed.
    draw: [forced, gap-added, rect-read, forced-now, then-read-rect, forces, read-clean]
    check: Why is getBoundingClientRect cheap at the start of a handler but expensive right after a class change?
    answer: At the start nothing is pending, so the last layout answers it; after a write the geometry may have changed, so the browser must run style and layout before it can return.
    misconceptions:
      - "getBoundingClientRect is always slow -> it is cheap when nothing is pending; only a read after a write forces layout."
  - point: Tasklane's drop gap tries the gap on all 50 Review cards per pointer move, writing, reading and writing again for each, so one move forces 50 layouts, about 20 ms, more than the 16.7 ms frame.
    kind: failure
    weight: core
    teach:
      - Tasklane's launch board has 400 cards in 8 columns. On mid-range laptops dragging feels sticky, the card trails the pointer and the drop gap jumps.
      - On every pointermove the script walks the 50 cards in the column under the pointer. For each one it adds gap-before, reads the rectangle, and removes the class again.
      - Every read follows a write, so every read forces a layout. 50 layouts in a row come to about 20 ms on this laptop, longer than the whole 16.7 ms frame, and half the frames are missed.
    draw: [drop-loop, card-1, card-2, card-rest, next-card, next-cards, fifty-layouts, frame-due]
    check: How many layouts does one pointer move cost in the original drop-gap loop over 50 cards, and why does the drag feel sticky?
    answer: 50, one per card, because each rectangle read follows a class write; together they take about 20 ms, past the 16.7 ms frame, so frames are missed and the card lags the pointer.
    misconceptions:
      - "The drag is slow because a class change is expensive -> each step is cheap on its own; the cost comes from a read after every write."
  - point: Nothing in the loop is slow on its own; the cost comes from the order, and alternating writes and reads in a loop is layout thrashing, fixed by reading everything first and writing after.
    kind: rule
    weight: core
    teach:
      - Name the pattern. A read after a write forces a layout; a loop that alternates them forces one per item. That is layout thrashing.
      - The fix is almost always the same work in a different order. When the drag begins, read all 50 Review rectangles in one pass, while layout is clean, so it costs at most one layout, and keep their midpoints.
    draw: [fix, drag-start-read, midpoints, keeps]
    check: How does Tasklane fix the drop gap without measuring less?
    answer: It reads all 50 card rectangles once, at drag start, before any write, and keeps their midpoints; reads with no write between them cost at most one layout.
    misconceptions:
      - "The fix is to stop measuring -> the fix is to do every read before any write, so the reads share one layout."
  - point: After the fix each pointer move compares the pointer with the cached midpoints and writes one class, so nothing is forced, the frame lays out once, and the move costs well under a millisecond.
    kind: mechanism
    weight: core
    teach:
      - On each move the handler finds the first cached midpoint below the pointer and sets gap-before on that one card. No read follows the write.
      - So nothing is forced. The frame lays the board out once, as it planned to, and the gap follows the pointer on time.
    draw: [move-write, compares, per-move, under-ms]
    check: After the fix, what does one pointer move read and write, and how many layouts does it cause?
    answer: It reads no geometry, only the cached midpoints, and writes one class; the only layout is the frame's own, once.
task:
  prompt: Draw one pointer move of the drop-gap loop over three cards, marking every write, every read and every forced layout, then redraw it with the reads moved to drag start.
  expects: [2, 3, 4]
