# FLIP on Tasklane's board: First, Last, Invert, Play inside one task, the frame budget, inverting size, interrupted glides, reduced motion, and view transitions.
id: rendering-performance/compositor-animations/how-it-works
title: Animating layout changes with FLIP
source:
  hash: "0be2e647fc2c"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: how-browsers-render-content/layers-and-compositing/how-it-works
  assumes:
    - Animating transform or opacity on a rastered layer reruns only compositing, on the compositor thread.
    - Animating width, height, top or bottom reruns layout and paint every frame.
    - Paint records drawing commands; raster turns them into pixels; compositing stacks the rasterized layers into the frame.
  carries:
    - "FLIP: read every First rect before any write, apply the change, read every Last rect, invert with a transform, play it to none."
    - The first read after a DOM change forces one layout; later reads reuse it as long as nothing is written between them.
    - The whole FLIP runs in one task, so the browser paints once, with the inverting transforms already in place.
    - Animate only the cards the user can see; measuring and committing every moved card can miss the frame.
    - getBoundingClientRect includes a running transform, so an interrupted FLIP starts from where the card is drawn.
    - Reduced motion swaps travel for colour or opacity changes; it does not delete the information the motion carried.
  terms:
    - term: FLIP
      means: First, Last, Invert, Play; measure before and after a layout change, then animate a transform from the old place to none.
    - term: invert
      means: The transform that puts an element back where it was drawn before the change, first minus last.
    - term: forced layout
      means: A layout the browser runs inside a script because a read needs geometry that a write has made stale.
    - term: reduced motion
      means: The user's operating-system setting, exposed as prefers-reduced-motion reduce, asking for less movement on screen.
    - term: view transition
      means: The browser's own version of the idea, document.startViewTransition, animating snapshots of named elements.
