beats:
  - point: "Searching titles straight from the video DB means a pattern scan over every row, which does not scale."
    kind: failure
    weight: core
    teach:
      - "Third, search. A title search on the database is a pattern match, like percent night percent, and an ordinary index cannot help it, so the database scans every row."
      - "That is the wrong tool for searching, however small the catalogue."
    draw: [lld-search, q-svc, q-scan]
    check: Why can't an ordinary index speed up a search for a word in the middle of a title?
    answer: A pattern with a leading wildcard cannot use a sorted index, so the database scans every row.
  - point: "Put Elasticsearch between the search service and the data: it answers full-text, fuzzy and ranked queries from an inverted index, a page at a time."
    kind: component
    weight: core
    teach:
      - "So the search service calls Elasticsearch instead. It keeps an inverted index, each word pointing to the titles that contain it, and answers full-text, fuzzy and ranked queries from it."
      - "It searches its own index, not the database. Results go back a page at a time, with the partial metadata the list needs."
    draw: [q-es, q-svc-es, q-index, q-fuzzy, q-paged]
    check: Where does Elasticsearch run the user's query?
    answer: Against its own inverted index, not against the video DB.
    misconceptions:
      - "Elasticsearch searches the database faster -> it searches its own copy of the data, an index built for search."
  - point: "A CDC pipeline keeps the index in step: it streams every insert and update of the video DB into Elasticsearch within seconds."
    kind: mechanism
    weight: core
    teach:
      - "The index is a copy, so how does a new title get there? A CDC pipeline, change data capture, Debezium for example, reads the video DB's change log and streams every change into Elasticsearch."
      - "Within seconds, near real time. The uploader writes to one place, and the title becomes searchable on its own."
    draw: [q-vdb, q-vdb-es, q-cdc-note]
    check: How does a newly uploaded title become searchable without the uploader writing to Elasticsearch?
    answer: CDC reads the video DB's change log and streams the new row into the index within seconds.
asks:
  - ids: [q-es]
    beats: [2]
    question: "Scanning the database for every search won't do. What would you put in front of the data for search?"
    hints:
      - A tool built for full-text search.
      - It keeps an index of words to titles.
  - ids: [q-cdc-note]
    beats: [3]
    question: "That search engine holds a copy. How does it stay in step with the video DB?"
    hints:
      - Every database keeps a log of its changes.
      - Something could stream that log out.
