# OTT streaming interview, low-level design 5: playback and the CDN, the second half of the video's play service: the play service returning the manifest from the video DB, the player fetching 10-second segments that change quality with the bandwidth (the video's segment strip, laid out the same way), the CDN near the users with S3 behind it, a Redis cluster for manifests, and HLS against DASH. Corrected: 2 Mbps is about 480p and 10 Mbps about 1080p; the player switches at segment boundaries, by its buffer, not at an I-frame; both protocols are adaptive.
