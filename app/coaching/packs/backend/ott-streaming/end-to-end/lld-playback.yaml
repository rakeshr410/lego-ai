beats:
  - point: "Pressing play returns the manifest, not the video: the play service reads it from the video DB and sends it to the player."
    kind: flow
    weight: core
    teach:
      - "Now playback. The request reaches the play service, but instead of going to S3 it fetches the title's manifest from the video DB and sends it back."
      - "From here everything is on the client: the manifest tells the player every rendition and every segment."
    draw: [lld-play, v-player, v-play, v-player-play, v-vdb, v-play-vdb]
    check: What does the play endpoint return?
    answer: The title's manifest, which lists the renditions and their segments; not the video itself.
  - point: "The player measures its throughput and buffer and fetches segments one at a time at the rendition that fits: at 2 Mbps, 480p segments."
    kind: mechanism
    weight: core
    teach:
      - "The player first measures the network, and keeps measuring. At 2 megabits a second it asks for the first 10-second segment from the low rendition, about 480p."
      - "Six seconds in, still 2 megabits: it fetches the second segment, again at 480p, before the first one ends. The video says 2K here; 2 Mbps only carries about 480p."
    draw: [v-measure, v-bw-1, v-seg-1, v-bw-2, v-seg-2]
    check: Who decides the quality of the next segment, the server or the player?
    answer: The player, from its measured throughput and how full its buffer is.
  - point: "When the bandwidth rises to 10 Mbps, the next segment comes from a higher rendition, about 1080p; quality follows the network, segment by segment."
    kind: mechanism
    weight: core
    teach:
      - "Later the network rises to 10 megabits. The player asks for segment three from a higher rendition, about 1080p. 4K needs roughly 15 megabits or more."
      - "If the network falls again, the next segment comes from a lower rendition: the picture softens instead of freezing. That is the zero-buffering requirement met."
    draw: [v-bw-3, v-seg-3]
    check: The network drops from 10 to 2 Mbps mid-film. What happens?
    answer: The player requests the next segment from a lower rendition, so quality drops but playback continues.
  - point: "Switching happens only between segments, each of which starts with a keyframe; the next request is driven by how full the buffer is, not by an I-frame."
    kind: rule
    weight: supporting
    teach:
      - "The video ties the next request to an I-frame six seconds in. What really happens: every segment begins with a keyframe, so it can be decoded alone and the rendition can change between segments."
      - "The player requests ahead whenever its buffer falls below a target, typically several segments ahead."
    draw: [v-seg-len, v-keyframe]
    check: Why must every segment start with a keyframe?
    answer: So it can be decoded on its own, which lets the player switch to another rendition at that segment.
    misconceptions:
      - "The player asks for the next segment when it reaches an I-frame -> it asks when its buffer runs low; keyframes at segment starts are what make switching possible."
  - point: "Fetching every segment through the gateway, the play service and S3 is too long a trip; a CDN near the viewer caches the segments popular in its region and fetches from S3 on a miss."
    kind: component
    weight: core
    teach:
      - "Every few seconds the player wants a segment. Through the load balancer, the play service and S3 each time is a long hop and adds latency."
      - "So segments are served from a CDN, servers near the viewer holding the segments people in that region watch. On a miss the CDN fetches from S3 once and keeps it."
    draw: [v-cdn, v-player-cdn, v-s3, v-cdn-s3, v-cdn-note]
    check: What happens when a viewer asks the CDN for a segment it does not have?
    answer: The CDN fetches it from S3, serves it, and keeps it cached for the next viewer in the region.
  - point: "A Redis cluster in front of the video DB holds the manifests of titles being played, so pressing play starts faster."
    kind: decision
    weight: supporting
    teach:
      - "One small enhancement: pressing play still reads the video DB for the manifest. Put a Redis cluster in front of it; the play service checks the cache first, and the first load gets faster."
    draw: [v-redis, v-play-redis, v-redis-vdb]
    check: What does the Redis cluster speed up?
    answer: Fetching the manifest when the user presses play, so the start-up time drops.
  - point: "HLS and DASH are both adaptive and multi-bitrate: HLS uses .m3u8 text and is native on Apple devices, DASH uses an XML .mpd and is an open standard, so services ship both."
    kind: decision
    weight: core
    teach:
      - "Last, the two protocols. HLS keeps its manifest in m3u8, plain text, and is Apple's, native on Apple devices. DASH keeps it in an MPD, XML, an open ISO standard. HLS segments are often about 6 seconds, DASH often 2 to 4."
      - "Both switch bitrate per segment and both let the player buffer several segments ahead; the video says HLS cannot, which is wrong. Large services ship both, often from the same fragmented MP4 segments."
      - "Then read the non-functional list back against the board: scale from services and a CDN, availability first, buffering kept away by segments, a ladder and nearby caches."
    draw: [v-hls, v-dash, v-both, v-seglen]
    check: What is a real difference between HLS and DASH?
    answer: The manifest format, m3u8 text against XML MPD, and device support, HLS native on Apple, DASH an open standard; both are adaptive.
    misconceptions:
      - "Only DASH can prefetch segments or carry several bitrates -> both protocols are adaptive, multi-bitrate and buffer ahead."
asks:
  - ids: [v-play]
    beats: [1]
    question: "The user presses play. If not the whole video, what should the play service send back?"
    hints:
      - Something small that describes the whole film.
      - We wrote it during processing.
  - ids: [v-seg-3]
    beats: [3]
    question: "The network jumps from 2 to 10 megabits. What does the player fetch next?"
    hints:
      - The manifest lists other renditions.
      - The change happens at the next segment.
  - ids: [v-cdn]
    beats: [5]
    question: "Every segment still travels through our gateway and S3. How would you cut that trip?"
    hints:
      - Put the segments closer to the viewer.
      - Popular films are watched by many people in one region.
  - ids: [v-redis]
    beats: [6]
    question: "Pressing play still reads the video DB every time. How would you make the start faster?"
    hints:
      - The same manifests are read again and again.
      - Something in memory, in front of the database.
task:
  prompt: "Draw the playback design: the player asking the play service for a manifest, read through a Redis cluster from the video DB, then fetching segments of changing quality from a CDN that falls back to S3."
