beats:
  - point: "The user service keeps users in MySQL: simple relational rows that must stay consistent, with userId, name, email, a password hash, the subscription status and its expiry date."
    kind: decision
    weight: core
    teach:
      - "Step five, the low-level design: copy the high-level picture and open the services one at a time, easiest first. The user service registers users and persists them."
      - "The data is simple and relational, one row per user, and must be consistent, so MySQL. Write the schema beside it: userId, name, email, the password, stored as a salted hash, never as itself, the subscription status and the expiry date."
    draw: [lld-user, u-svc, u-db, u-svc-db, u-schema-1, u-schema-2, u-schema-3]
    check: What does the user table store for the password, and why?
    answer: A salted one-way hash such as bcrypt, so a leaked table does not reveal passwords.
    misconceptions:
      - "Store the password so login can compare it -> store a salted hash and compare hashes; the password itself is never kept."
  - point: "On login the service checks the hash and issues a JWT; the client sends it with every call, and the gateway verifies it without asking the user service."
    kind: mechanism
    weight: core
    teach:
      - "Second login: the service checks the credentials against the row. If they match, it issues a JWT, a signed token that says who the user is."
      - "The client sends that token with every call, and the gateway verifies the signature itself, so the other services trust the caller without a round trip to the user service."
    draw: [u-jwt, u-jwt-use]
    check: How does the play service know who is calling without asking the user service?
    answer: The call carries the signed JWT from login, which the gateway verifies.
asks:
  - ids: [u-db]
    beats: [1]
    question: "The user service has to persist each user. What kind of database would you pick, and why?"
    hints:
      - The data is a few fixed columns per user.
      - Should a user's plan ever be read wrong?
  - ids: [u-jwt]
    beats: [2]
    question: "A user logs in. How do the other services know it's them on every later call?"
    hints:
      - Something the client carries.
      - Signed, so it can be checked without a database call.
