beats:
  - point: "The plans live in a subscription DB, MySQL since the data is small and simple: subscriptionId, name, price, currency and validity; GET plans reads it."
    kind: decision
    weight: core
    teach:
      - "Second, the subscription service. After login the first thing a user sees is the plans, so they need a home: a subscription DB."
      - "One month, a year, the price and when it runs out: small, straightforward rows, so MySQL again. Write the schema: subscriptionId, name, price, currency, validity. The GET plans endpoint reads this table."
    draw: [lld-sub, s-sub-db, s-sub-svc, s-sub-db-arrow, s-sub-schema-1, s-sub-schema-2]
    check: Which endpoint reads the subscription DB?
    answer: GET /v1/subscription/plans, which lists every plan.
  - point: "Checkout goes to a payment service, which hands the charge to the third-party payment gateway; the gateway takes the card details, talks to the bank and answers success or failure."
    kind: flow
    weight: core
    teach:
      - "The user picks a plan and lands on payment. Add a payment service between the subscription service and the gateway."
      - "The card details go to the payment gateway itself, so they never sit on our servers. It talks to the bank and sends back an acknowledgement: success or failure."
    draw: [s-pay-svc, s-sub-pay, s-pay-gw, s-pay-gw-arrow]
    check: Why let the gateway take the card details rather than our payment service?
    answer: So card numbers never touch our servers; the gateway handles the bank and the compliance, and returns a result.
  - point: "Every result is saved in a payment DB, MySQL because payments must be consistent: paymentId, userId, amount, currency and time."
    kind: decision
    weight: core
    teach:
      - "Success or failure, the result is saved: a payment DB. A payment must be recorded exactly once, so it is MySQL, with transactions."
      - "Its schema: paymentId, userId, amount, currency and the time of the payment. Then the payment service acknowledges the subscription service."
    draw: [s-pay-db, s-pay-db-arrow, s-pay-schema-1, s-pay-schema-2, s-pay-consistent]
    check: Why is the payment DB relational and consistent when the catalogue is not?
    answer: A payment lost or recorded twice is real money; a title appearing late harms nobody.
  - point: "After a payment two things must happen, notify the user and update their record, so the subscription service publishes one event to Kafka instead of doing both in turn."
    kind: decision
    weight: core
    teach:
      - "Once the payment result arrives, two jobs: tell the user the plan is active, and update the user DB so next time they log in they see the status and when it ends."
      - "Do them concurrently and independently: the subscription service posts one event to a Kafka broker, and does not call either job itself."
    draw: [s-kafka, s-sub-kafka]
    check: Why put an event on Kafka instead of calling the notifier and then the user DB?
    answer: The two jobs run independently; a slow or failed notifier does not hold up activating the plan, and events stay on the log to be retried.
  - point: "Two consumer groups read each event: a notification service tells the user, and a consumer service updates the subscription status and expiry date in the user DB, idempotently."
    kind: mechanism
    weight: core
    teach:
      - "Two readers of the topic, each in its own consumer group so each gets every event: a notification service that messages the user, and a consumer service that writes the status and expiry date into the user DB."
      - "The video calls this Kafka Connect; it is just two Kafka consumer groups. An event can be read twice after a failure, so the update is keyed by the payment id and safe to repeat."
    draw: [s-notify, s-kafka-notify, s-consumer, s-kafka-consumer, s-user-db, s-consumer-db]
    check: The consumer crashes after updating the user DB but before committing its offset. What must be true of the update?
    answer: It must be idempotent, keyed by the payment id, because the event will be read again.
    misconceptions:
      - "Kafka Connect is how services read a topic -> services read topics as consumer groups; Kafka Connect moves data between Kafka and external systems."
asks:
  - ids: [s-pay-svc, s-pay-gw]
    beats: [2]
    question: "The user picks a plan and wants to pay. What pieces handle the money? Name them and I'll draw them."
    hints:
      - We don't talk to banks ourselves.
      - Something of ours sits between the subscription service and that third party.
  - ids: [s-pay-db]
    beats: [3]
    question: "Where does the payment result go, and what kind of store should it be?"
    hints:
      - Think back to the CAP choice for billing.
      - A payment must be recorded exactly once.
  - ids: [s-kafka]
    beats: [4]
    question: "A payment succeeds. We must notify the user and update their record. How would you trigger both without one blocking the other?"
    hints:
      - Something the subscription service writes once and forgets.
      - Several readers could each act on it.
  - ids: [s-notify, s-consumer]
    beats: [5]
    question: "Who reads that event, and what does each do?"
    hints:
      - One talks to the user.
      - One writes to the user DB.
