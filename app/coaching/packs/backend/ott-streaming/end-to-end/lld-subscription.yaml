# OTT streaming interview, low-level design 2: subscriptions and payments, as the video opens the subscription service: a MySQL subscription DB with its schema, a payment service between the subscription service and the third-party gateway, a MySQL payment DB with its schema, then Kafka feeding a notification service and a consumer service that updates the user's status and expiry. The video wires the two readers with Kafka Connect; here they are plain Kafka consumer groups.
