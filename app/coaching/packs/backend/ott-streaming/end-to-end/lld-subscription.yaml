  after: backend/ott-streaming/end-to-end/lld-user-service
  assumes:
    - "The subscription service takes payment through a third-party gateway and records the plan in the user DB."
    - "The user DB is MySQL with the subscription status and expiry date."
    - "Payments and subscriptions must be consistent."
  carries:
    - "Plans live in a MySQL subscription DB: subscriptionId, name, price, currency, validity."
    - "A payment service calls the payment gateway and saves each result in a MySQL payment DB: paymentId, userId, amount, currency, time."
    - "The subscription service publishes the payment result to Kafka; a notification service and a consumer service read it independently, and the consumer updates the user's status and expiry."
  terms:
    - term: consumer group
      means: "A set of readers of a Kafka topic; each group gets every event, so two groups act on the same event independently."
    - term: idempotent
      means: "Safe to apply twice: an update keyed by the payment id has the same effect if the event is read again."
