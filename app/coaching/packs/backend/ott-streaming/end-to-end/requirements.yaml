# OTT streaming interview, requirements: "1. Functional requirement" on the left and "Non-functional requirement" on the right, under the title, as the video lays them out; the recommendation engine written out of scope, and the scale read as a reason for microservices.
id: backend/ott-streaming/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "bc4c7cb72db5"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ott-streaming/end-to-end/problem-statement
  assumes:
    - "An OTT platform streams films and shows to subscribers over the internet."
  carries:
    - "Functional: create an account and opt for a plan; search movies and shows by title or name; watch at 480p, 720p, 1080p or 4K."
    - "Out of scope: the recommendation engine, and uploading, done by an internal team."
    - "Non-functional: 200M users and 10,000 videos of about an hour; availability over consistency, except payments; zero or negligible buffering."
    - "At this scale the design is separate services, not a monolith."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, with a number where there is one: scale, availability, buffering."
