beats:
  - point: "The account requirement takes three endpoints: POST register (with login, logout and update named), GET the subscription plans, and POST a subscription with the user and the plan id."
    kind: flow
    weight: core
    teach:
      - "Step three, the API: one group per functional requirement. Registering submits data, so a POST to v1 user register, with name, email and password in the body. Name login, logout and update profile beside it and move on."
      - "Then a GET on v1 subscription plans that lists every plan, and a POST on v1 subscription with the user and the plan they picked."
    draw: [api, api-register, api-plans, api-subscribe]
    check: Why is registering a POST and listing plans a GET?
    answer: Registering creates data on the server; listing plans only reads it.
  - point: "Search is a GET with the name as a query, returning video ids with partial metadata, title, thumbnail, a short description, a page at a time."
    kind: flow
    weight: core
    teach:
      - "Search: a GET on v1 videos search with q equal to the name. It returns the matching video ids, and with each a little metadata, the thumbnail, a title, a short description, so the list can be drawn."
      - "Many titles can match, so the result is paginated; sending all of them at once would swamp the client."
    draw: [api-search]
    check: Why does the search result come back paginated and partial?
    answer: A query can match many titles; a page of ids with a thumbnail and title is enough for the list, and the rest comes from the details endpoint.
  - point: "Then a GET on one video id for its full metadata as JSON, and a GET on play with the video id to start watching."
    kind: flow
    weight: core
    teach:
      - "The user clicks a result: a GET on v1 videos slash the video id returns its full metadata as JSON for the details page."
      - "Last, play: a GET on v1 videos play slash the video id. Six endpoints for three requirements."
    draw: [api-details, api-play]
    check: Which endpoint does the details page call, and what does it get?
    answer: GET on the video id, which returns that title's full metadata as JSON.
asks:
  - list: api-list
    beats: [1, 2, 3]
    question: "Take the requirements one by one. What endpoints do we need? Give me the method and the path and I'll write them."
    hints:
      - The first requirement needs an account and a plan; how many calls is that?
      - After search, what does the user click, and then what?
