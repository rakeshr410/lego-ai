  hash: "94903472b5cc"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ott-streaming/end-to-end/entities
  assumes:
    - "Functional: create an account and subscribe, search titles, watch at a chosen resolution."
    - "Entities: user, user metadata, video, video metadata."
  carries:
    - "Account and plan: POST /v1/user/register (plus login, logout, update), GET /v1/subscription/plans, POST /v1/subscription with the user and plan id."
