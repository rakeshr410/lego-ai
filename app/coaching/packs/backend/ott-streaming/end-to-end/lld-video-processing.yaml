# OTT streaming interview, low-level design 4: processing the video, the first half of the video's play service: uploader, S3, chunker, Kafka and video encoder laid out as on its board (chunker right of S3, Kafka right of the chunker, the encoder under Kafka writing back to S3), the encoder's formats and bitrates, the streaming protocols, the manifests, and the video DB in MongoDB holding them. Corrected: HLS takes .ts or fMP4, DASH fMP4; m3u8 is text, MPD is XML; the final manifests are written once the renditions exist.
