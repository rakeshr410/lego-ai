beats:
  - point: "Play cannot send a whole video file: the video puts a 4K hour at about 40 GB and a long film near 100 GB, master sizes no phone downloads before playing."
    kind: failure
    weight: core
    teach:
      - "Now the play service, where the real logic is. The high-level design had it fetch the file from S3, but the video puts a one-hour 4K file at about 40 gigabytes, a two-and-a-half-hour film near 100. Those are master files; even the compressed 4K stream is several gigabytes an hour."
      - "No phone waits for that, and many networks cannot hold top quality all the time. So before a title is published, it is processed."
    draw: [lld-proc, p-big, p-big-2]
    check: Why can the play service not just stream the file from S3 as it is?
    answer: It is tens of gigabytes at one quality; the viewer would wait, and a slow network could never keep up.
  - point: "The internal uploader writes the metadata to the video DB and the master file to an S3 bucket."
    kind: flow
    weight: supporting
    teach:
      - "Start where the high-level design left it: the internal team's uploader writes titles and descriptions to the video DB, and the master video and thumbnails to an S3 bucket."
    draw: [p-uploader, p-vdb, p-up-vdb, p-s3, p-up-s3, p-s3-note]
    check: What two places does the uploader write to?
    answer: The video DB for the text metadata, and S3 for the video and thumbnails.
  - point: "S3 notifies a chunker that splits the master into small segments of 2 to 10 seconds and puts them on Kafka for further processing."
    kind: mechanism
    weight: core
    teach:
      - "When a new video lands, S3 notifies a chunker. It splits the film into small segments, 2 to 10 seconds each: a 20-minute video in 10-second segments is 120 of them."
      - "It puts the segments on a stream, Kafka, so the heavy work after it can run on many machines in parallel."
    draw: [p-chunker, p-s3-chunker, p-chunk-note, p-kafka, p-chunker-kafka, p-kafka-note]
    check: How many segments is a 20-minute video in 10-second segments?
    answer: "120."
  - point: "Video encoders take segments off Kafka and transcode each into a bitrate ladder, 480p, 720p, 1080p and 4K, with H.264 or H.265, as .ts or fragmented MP4, back into S3."
    kind: mechanism
    weight: core
    teach:
      - "A fleet of video encoders reads the queue. Each segment is encoded with H.264, or H.265 which is smaller at the same quality, and compressed into several bitrates: 480p, 720p, 1080p, 4K."
      - "They are packaged for the streaming protocol: HLS takes MPEG-TS, dot ts, or fragmented MP4; DASH uses fragmented MP4. Every rendition goes back into S3."
    draw: [p-encoder, p-kafka-encoder, p-encoder-s3, p-enc-1, p-enc-2]
    check: Why encode the same segment several times?
    answer: So the player can pick, segment by segment, the quality its network can sustain.
    misconceptions:
      - "HLS uses MP4 and DASH uses TS -> HLS takes .ts or fragmented MP4; DASH uses fragmented MP4."
  - point: "Two streaming protocols, HLS and DASH, each describe a title with a manifest: a master that lists the renditions by bandwidth and resolution, and per rendition a playlist of its segments in order."
    kind: mechanism
    weight: core
    teach:
      - "Thousands of files need an order, or the player cannot stitch them back. The streaming protocols, HLS, HTTP Live Streaming, and DASH, dynamic adaptive streaming over HTTP, use a manifest: for HLS an m3u8 file, plain text; for DASH an mpd file, XML."
      - "A master playlist lists each rendition with its bandwidth and resolution, low, medium, high, each pointing to its own playlist, and that playlist lists its segments in order."
    draw: [p-proto, p-manifest, p-master, p-variants, p-media]
    check: What does the master playlist point to?
    answer: One playlist per rendition, with its bandwidth and resolution; each of those lists that rendition's segments in order.
  - point: "The manifest is kept with the title in the video DB, MongoDB, because films, series and episodes differ in shape; it is written once the renditions exist."
    kind: decision
    weight: core
    teach:
      - "In the video, the chunker writes the manifest into the video DB. The final lists can only be written once each rendition's segments exist, so in practice the packaging step after encoding writes them; either way they end up with the title."
      - "The video DB: a film, a series with seasons, a single episode all have different shapes, so a document store, MongoDB. Its document: title, description, metadata, and the manifest."
    draw: [p-chunker-vdb, p-vdb-1, p-vdb-2, p-mongo]
    check: Why a document store for the video metadata?
    answer: Films, series and episodes have different shapes, and a document store takes a different structure per title.
asks:
  - ids: [p-chunker]
    beats: [3]
    question: "The film is too big to send whole. What's the first thing you'd do to it after upload?"
    hints:
      - Think small pieces.
      - How many seconds should each piece be?
  - ids: [p-encoder]
    beats: [4]
    question: "Viewers have very different networks. What has to happen to each piece so every one of them can watch?"
    hints:
      - Think of the resolutions in the requirements.
      - The same piece, more than once.
  - ids: [p-manifest]
    beats: [5]
    question: "We now have thousands of small files per film. How does a player know which comes next, and at what quality?"
    hints:
      - Some file has to list them.
      - And it would list the qualities too.
