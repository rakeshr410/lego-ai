# OTT streaming interview, high-level design: "4. High Level Design" under the API, as in the video: users on the left, a tall load balancer and API gateway with its roles, a column of four services (user, subscription, search, play), the user DB and the payment gateway beside them, and on the right the internal uploader writing to the video DB and blob storage.
