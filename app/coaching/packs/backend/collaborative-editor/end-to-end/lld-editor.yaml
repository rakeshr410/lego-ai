# Collaborative editor interview, the editor service's final design under "5. Low level design", as the video redraws it: clients with OT on the left, the API gateway above a separate websocket gateway, the metadata service, Redis (canonical copy) and the document editor service in a column, Kafka, S3 and the operations path on the right, then snapshots and versions, the reconciliation service, the CDN, cursors, and the two version endpoints added to the API list. The video routes by user, calls Redis persistent and leaves cursors untransformed; the pack corrects those.
id: backend/collaborative-editor/end-to-end/lld-editor
title: "Low-level design: the editor service and its versions"
source:
  hash: "259ce8371119"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/collaborative-editor/end-to-end/lld-crdt
  assumes:
    - "OT transforms concurrent operations; client-server OT needs every operation of a document to go through one server."
    - "The metadata service writes metadata through Kafka and a metadata consumer; the content is in S3."
    - "Edits must reach collaborators within about 100 ms."
  carries:
    - "A separate websocket gateway; OT in the client and in the editor service; consistent hashing on the document id puts a document's editors on one server."
    - "Every edit is appended to Kafka and written to the operations database; the server applies it to the canonical copy in Redis, in memory, with a TTL."
    - "Snapshots go to S3 on save or every 10 to 20 seconds, with a version row and a URL update through Kafka; a joiner gets the canonical copy and the operations after it."
    - "A reconciliation service replays a session's operations into the next version and deletes the minor versions; cursors travel on the websocket, transformed, kept in Redis."
    - "GET versions lists a document's versions and GET with a version id opens one."
  terms:
    - term: canonical copy
      means: "The server's live copy of a document being edited, to which every transformed operation is applied."
    - term: websocket registry
      means: "The record of which editor server holds which document's connections."
    - term: snapshot
      means: "The canonical copy written to S3 as a minor version, on a manual save or by autosave."
    - term: reconciliation
      means: "Here, the end-of-session job that replays the session's operations on the last full version to make the next one."
