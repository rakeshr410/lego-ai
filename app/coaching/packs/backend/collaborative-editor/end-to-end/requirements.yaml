# Collaborative editor interview, requirements: "1. Functional requirements" on the left, five lines, and "Non-functional requirements" on the right, three lines, under the title, as the video lays them out. The video calls live co-editing strongly consistent; the pack teaches convergence instead.
id: backend/collaborative-editor/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "434cc6cfc1d9"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/collaborative-editor/end-to-end/problem-statement
  assumes:
    - "Google Docs is an online word processor that several people can edit together in near real time."
  carries:
    - "Functional: create, update and delete documents; several users edit one document at once; see each other's changes in near real time; see cursors and presence; versions."
    - "Non-functional: millions of users and billions of documents; availability over consistency, eventual is fine; edits reach collaborators in about 100 ms."
    - "Live co-editing needs convergence, every copy ending identical, not strong consistency."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system (scale, availability, latency), stated with a number and where it applies."
    - term: convergence
      means: "Every copy of a document reaches the same text once all edits have arrived, though each user saw their own edit first."
    - term: presence
      means: Who has the document open right now.
