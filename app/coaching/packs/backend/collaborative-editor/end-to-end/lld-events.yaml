# Collaborative editor interview, low-level design approach 3, "3. Events passing + websocket Connector": only the change is sent (user A inserts r at position 29) over one websocket, then the video's conflict picture: document BC, user A inserts A at 0, user B inserts D at 2, and applying the raw events gives ABDC on one side and ABCD on the other (users named user A and user B here).
