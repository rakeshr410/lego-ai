context:
  after: backend/collaborative-editor/end-to-end/lld-locking
  assumes:
    - "File replacement fails on payload size and request count; locking fails on simultaneity."
  carries:
    - "Send only the change, as an event, over one persistent websocket per editor."
    - "Applying the other side's raw index diverges: BC becomes ABDC for user A and ABCD for user B."
    - "Sending is solved; reconciliation is the problem, solved by OT or CRDTs."
  terms:
    - term: edit event
      means: "One small change, such as insert r at position 29, sent instead of the file."
    - term: reconciliation
      means: Applying other users' concurrent edits to your own copy so that every copy ends up the same.
