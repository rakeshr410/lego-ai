beats:
  - point: "Fix the payload: send only the change, an event such as user A inserts r at position 29, instead of the whole file."
    kind: mechanism
    weight: core
    teach:
      - "Third approach: fix file replacement's two flaws directly. The payload first. User A types an r between two letters at position 29. Send only that: user A inserts r at position 29. A few bytes instead of the document."
    draw: [lld-events, e-delta]
    check: What does the client send now when user A types one letter?
    answer: One small edit event, such as insert r at position 29, not the file.
  - point: "Fix the request count: one persistent, two-way websocket per editor carries the events up and pushes them down to the others."
    kind: mechanism
    weight: core
    teach:
      - "Then the count. Instead of a request per keystroke and a push back, open a websocket: one persistent, two-way connection per editor."
      - "User A's events go up on it, and the server pushes them down to user B on user B's connection. Both flaws of file replacement are gone."
    draw: [e-tab-a, e-server, e-a-server, e-tab-b, e-server-b]
    check: How does the websocket cut the number of requests?
    answer: One connection stays open and carries every event both ways, instead of a new request and a separate push per keystroke.
  - point: "Now two users edit the same text at once: the document is BC, user A inserts A at position 0 and sees ABC, while user B inserts D at position 2 and sees BCD."
    kind: flow
    weight: core
    teach:
      - "But watch two users edit the same words at once. The document is B C. User A inserts A at position 0 and sees A B C. At the same moment user B inserts D at position 2, the end, and sees B C D. Each sends the event."
    draw: [e-bc, e-a-abc, e-bc-a, e-b-bcd, e-bc-b]
    check: What does each user see right after their own edit?
    answer: User A sees ABC and user B sees BCD.
  - point: "Each applies the other's event as sent: user A puts D at 2 into ABC and gets ABDC, user B puts A at 0 into BCD and gets ABCD. The copies diverge."
    kind: failure
    weight: core
    teach:
      - "User A receives insert D at 2 and applies it to A B C: A B D C. User B receives insert A at 0 and applies it to B C D: A B C D."
      - "Both did exactly what they were told, and the copies differ. User B's position 2 was counted in B C; in user A's copy it points one letter too early."
    draw: [e-a-final, e-a-down, e-b-final, e-b-down, e-inconsistent]
    check: Why do the two copies end up different?
    answer: Each applied the other's raw index, but that index was counted against the old text, so in user A's copy it lands one place too early.
    misconceptions:
      - "The server can fix it by applying events in arrival order -> the indexes themselves are stale; they must be adjusted for the concurrent edits."
  - point: "Sending events over a websocket is right; reconciling them is the problem, and operational transformation and CRDTs are the two known solutions."
    kind: decision
    weight: core
    teach:
      - "So keep the events and the websocket; what is wrong is how we reconcile. Two algorithms solve exactly this: operational transformation, OT, and conflict-free replicated data types, CRDTs. Expect to explain both in the interview."
    draw: [e-verdict]
    check: Which part of approach 3 do we keep, and which part must change?
    answer: Keep sending small events over a websocket; change how concurrent events are applied, using OT or a CRDT.
asks:
  - ids: [e-delta]
    beats: [1]
    question: "File replacement sends the whole file on every change. What could the client send instead?"
    hints:
      - Most of the file did not change.
      - What is the smallest description of one keystroke?
  - ids: [e-server]
    beats: [2]
    question: "And to stop a fresh request for every keystroke, what kind of connection would you use?"
    hints:
      - The server also needs to push other people's edits to us.
      - Something that stays open and works in both directions.
  - ids: [e-a-final, e-b-final]
    beats: [4]
    question: "Each user now applies the other's event exactly as it was sent. What text does each of them end up with?"
    hints:
      - User A applies insert D at 2 to A B C.
      - User B applies insert A at 0 to B C D.
