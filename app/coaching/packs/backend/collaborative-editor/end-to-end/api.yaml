beats:
  - point: "Creating a document is a POST to /v1/api/docs/create that returns its document id; update and delete are the usual CRUD calls beside it."
    kind: flow
    weight: core
    teach:
      - "Step three, the API. Endpoints map one to one, or one to many, onto the requirements. Creating a document submits something new, so it is a POST to v1 api docs create, and it returns the document id."
      - "Update and delete are ordinary CRUD calls; say them, no need to write them all."
    draw: [api, api-post]
    check: What does the create call return, and why that?
    answer: The new document's id, which every later call uses to name the document.
  - point: "Viewing is a GET on the document id that returns the document read-only."
    kind: flow
    weight: core
    teach:
      - "Once it exists, a user opens it: a GET on v1 api docs with the document id. It comes back read-only; viewing changes nothing."
    draw: [api-get]
    check: Why is opening the document a GET?
    answer: It only fetches the document, read-only, and changes nothing.
  - point: "Editing is not a REST call: the client opens a websocket on the document, a two-way connection on which edits flow both ways many times a second."
    kind: decision
    weight: core
    teach:
      - "Editing, alone or together, is the third line, and it is not REST. The client opens a websocket on the document: one long-lived, two-way connection."
      - "Why: edits go up many times a second, and the server must push other people's edits down as they happen, which a request and response cannot do. The low-level design comes back to this, and adds two endpoints for versions."
    draw: [api-ws]
    check: Why is editing done over a websocket rather than a REST endpoint?
    answer: Edits flow both ways many times a second and the server must push others' edits, so one open two-way connection replaces a request per keystroke.
    misconceptions:
      - "Editing can be a PUT of the document on every change -> that resends the whole document per keystroke and cannot push others' edits; a websocket carries small edits both ways."
asks:
  - ids: [api-post, api-get, api-ws]
    beats: [1, 2, 3]
    question: "Looking at the requirements, what endpoints do we need? Give me the method and the path, and I'll write them."
    hints:
      - One creates a document and one opens it.
      - And editing together, does a request per keystroke make sense?
