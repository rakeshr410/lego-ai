beats:
  - point: "At millions of users the design is split into services behind one entry point: a load balancer and API gateway that authenticates, rate-limits and routes each request."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. Draw a few clients on the left. At this scale we split the work into services, so everything enters through one place: a load balancer and API gateway."
      - "Say what it does: authentication and authorization, rate limiting, and routing each path to the right service, spreading the load round robin."
    draw: [hld, hld-c1, hld-c2, hld-c3, hld-gateway, hld-c1-gw, hld-c2-gw, hld-c3-gw]
    check: Name two jobs of the API gateway besides spreading the load.
    answer: "Any two of: authentication and authorization, rate limiting, routing each path to its service."
  - point: "Two services split the requirements: a document metadata service creates documents and changes their metadata, and a document editor service changes their content, over a websocket."
    kind: component
    weight: core
    teach:
      - "First requirement, create, update and delete: a document metadata service. Creating a document only submits its metadata, a title, who made it, when, so this service owns that."
      - "The heart of the system is editing the content: a document editor service. The gateway reaches it over a websocket, two-way, so edits can travel both directions at once."
    draw: [hld-meta, hld-gw-meta, hld-editor, hld-gw-editor]
    check: Why two services instead of one?
    answer: Changing a document's metadata and editing its content are different jobs with different traffic; the editor is the heart of the system and scales on its own.
  - point: "Metadata goes to a database, but the content goes to blob storage such as S3, because a document can run to thousands of lines."
    kind: decision
    weight: core
    teach:
      - "The metadata service writes a metadata database: title, owner, times. That is not the file."
      - "The text itself goes to blob storage, an S3 bucket, because a document can be thousands of lines and keeps growing; a database row is the wrong place. The metadata service creates and reads the file, and the editor service saves it."
    draw: [hld-db, hld-meta-db, hld-blob, hld-meta-blob, hld-editor-blob, hld-why-blob]
    check: Why not keep the document's text in the metadata database?
    answer: A document can be thousands of lines and keeps growing; blob storage holds large files cheaply while the database keeps the small row that points to it.
  - point: "Create goes to the metadata service, which writes the row, creates the file and returns the id; open reads the file through it; edits go to the editor service, which saves the file. Concurrent edits are the open problem."
    kind: flow
    weight: core
    teach:
      - "Walk the flow. Create: the metadata service writes the row, creates an empty file in blob storage and returns the document id. Open: the GET reads the file through the same service. Edit: the editor service takes the edits and, on save, overwrites the file."
      - "It looks simple, but it is not. Say the title reads API designing; user A rewrites the title while user B adds a space at its end, at the same moment. Whose change wins, and do both screens agree? That is the low-level design."
    check: Walk me through creating a document and then opening it.
    answer: Create goes through the metadata service, which writes the metadata row, creates the file in blob storage and returns the id; opening reads the file by that id through the same service.
