# Collaborative editor interview, low-level design approach 4, "Approach 4: Operations Transformation (OT)", as the video draws it: the definition, the same BC example with user B's insert D at 2 transformed to insert D at 3 so both copies read ABCD, and the two limits beneath (users named user A and user B here).
id: backend/collaborative-editor/end-to-end/lld-ot
title: "Approach 4: operational transformation"
source:
  hash: "d7e71031f526"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/collaborative-editor/end-to-end/lld-events
  assumes:
    - "Edit events go over a websocket; applying the other side's raw index diverges (ABDC against ABCD)."
  carries:
    - "OT transforms an incoming operation against the concurrent operations already applied: insert D at 2 becomes insert D at 3."
    - "Client-server OT needs every operation of a document to go through one server; OT is hard to implement."
    - Google Docs uses OT.
  terms:
    - term: operational transformation
      means: "OT: adjusting an operation for the concurrent operations already applied, so that every copy converges."
    - term: transformation function
      means: "The rule that shifts one operation's effect to account for another, such as moving an insert's position past an earlier insert."
