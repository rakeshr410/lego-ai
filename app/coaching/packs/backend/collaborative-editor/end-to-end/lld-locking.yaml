# Collaborative editor interview, low-level design approach 2, a locking protocol, as the video writes it beside the drawing: "2. Locking Protocol", optimistic (git merge) and pessimistic. The video's pessimistic example is banking and ACID; the pack corrects it (ACID is not a kind of lock) and gives checking a file out.
