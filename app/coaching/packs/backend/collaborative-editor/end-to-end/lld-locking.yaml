beats:
  - point: "A locking protocol lets one writer at a time: the document is locked for user A, and user B can edit only after user A releases it."
    kind: mechanism
    weight: core
    teach:
      - "Second idea: if two writers are the problem, allow one. When user A starts writing, lock the document for user A; when user A is done, unlock it, and user B can take the lock."
      - "It is how a ticket booking holds a seat for a few minutes before someone else may book it."
    draw: [lld-lock, l-lock]
    check: What does user B experience while user A holds the lock?
    answer: User B cannot edit until user A releases the document.
  - point: "Optimistic locking writes without a lock and finds the conflict at commit, like a rejected git push; pessimistic locking takes the lock first, like checking a file out."
    kind: mechanism
    weight: supporting
    teach:
      - "Two kinds. Optimistic: no lock, everyone works on a copy, and a conflict is found at commit from a version number, like a git push rejected because someone pushed first, then merged by hand."
      - "Pessimistic: take the lock before writing, like checking a file out. The video's example is banking with ACID; ACID is a property of transactions, not a kind of lock, though banks do lock rows this way."
    draw: [l-optimistic, l-pessimistic]
    check: What is the difference between optimistic and pessimistic locking?
    answer: Pessimistic takes the lock before writing; optimistic takes none and detects a conflicting change when it commits.
    misconceptions:
      - "ACID is a type of pessimistic locking -> ACID describes transactions; pessimistic locking is one way to implement isolation."
  - point: "Locking fails the requirement: one person edits at a time, or conflicts surface late and are merged by hand; neither is simultaneous editing."
    kind: failure
    weight: core
    teach:
      - "Verdict beside it: with a pessimistic lock only one person types at a time; with an optimistic one they type at once but conflicts surface late and are merged by hand. The requirement was simultaneous editing with changes seen in near real time. Not met."
    draw: [l-verdict]
    check: Why does locking not meet our requirements?
    answer: It lets only one writer at a time, or leaves conflicts to manual merges, so users cannot edit simultaneously and see each other live.
