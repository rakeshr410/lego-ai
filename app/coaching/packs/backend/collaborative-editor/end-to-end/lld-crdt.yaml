# Collaborative editor interview, low-level design approach 5, "Approach 5: Conflict Free Replicated Data-types (CRDT)", beside approach 4 as on the video's board: B at 0.5 and C at 0.75, A inserted at 0.25 and D at 0.875, both copies sorted to ABCD. The pack adds the tie-break and the metadata cost the video leaves out.
