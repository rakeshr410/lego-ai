beats:
  - point: "A CRDT is a data structure whose concurrent edits merge in any order with the same result, so no server has to transform them."
    kind: mechanism
    weight: core
    teach:
      - "Approach five, a conflict-free replicated data type, CRDT. Not an algorithm that adjusts operations but a data structure built so that concurrent edits can be merged in any order and still give the same result."
    draw: [lld-crdt, cr-def]
    check: What is the key property of a CRDT?
    answer: Concurrent edits merge in any order and every copy ends with the same result, without transforming operations.
  - point: "Every character gets a position that never changes: B at 0.5 and C at 0.75; user A inserts A at 0.25, below B, and user B inserts D at 0.875, above C."
    kind: mechanism
    weight: core
    teach:
      - "Instead of indexes that shift, give each character a fixed position. B sits at 0.5 and C at 0.75."
      - "User A inserts A before B, so at a position below 0.5, say 0.25. User B inserts D after C, above 0.75, say 0.875."
    draw: [cr-bc, cr-a, cr-bc-a, cr-b, cr-bc-b]
    check: Why does inserting A not change B's position?
    answer: Positions are fixed values, not counts; A takes a new value below B's 0.5, and B keeps its own.
  - point: "Each copy sorts characters by position, so both read ABCD whatever order the inserts arrive in, with no central server."
    kind: mechanism
    weight: core
    teach:
      - "Each copy applies the other's insert and sorts by position: 0.25, 0.5, 0.75, 0.875. Both read A B C D, whatever order the inserts arrived in, and no server had to put them in order."
    draw: [cr-a-final, cr-a-down, cr-b-final, cr-b-down]
    check: Why do both copies agree without a central server?
    answer: Every character's position is fixed, so sorting by position gives the same order in any copy, in any arrival order.
  - point: "Two details: concurrent inserts at the same spot need a tie-break such as the site id, and per-character positions and tombstones cost memory. Google Docs uses OT, so we continue with OT."
    kind: decision
    weight: core
    teach:
      - "Two things to add. If two users insert at the same spot at the same moment they can pick the same number, so real CRDTs break ties with the inserting site's id. And every character carries its position, and deleted ones stay as tombstones, so memory grows."
      - "So: OT needs a central server, CRDTs need more metadata. Google Docs uses OT, and so will we."
    draw: [cr-tie, cr-cost, cr-choice]
    check: Two users insert at the same spot at once and pick the same position. What keeps the order the same everywhere?
    answer: A tie-break that makes positions unique, such as the inserting site's id.
    misconceptions:
      - "CRDTs are simpler and free -> they avoid a central server but carry per-character metadata and tombstones, and need tie-breaks."
asks:
  - ids: [cr-a, cr-b]
    beats: [2]
    question: "B is at 0.5 and C at 0.75. User A wants A before B, and user B wants D after C. What positions would you give them?"
    hints:
      - Positions are numbers you can always fit another number between.
      - Something below 0.5 for A, and above 0.75 for D.
