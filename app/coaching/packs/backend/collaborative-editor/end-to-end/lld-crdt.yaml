  after: backend/collaborative-editor/end-to-end/lld-ot
  assumes:
    - "OT transforms concurrent operations; client-server OT needs one server per document."
  carries:
    - "A CRDT gives every character a fixed position, so edits merge in any order with no central server."
    - "Concurrent inserts at one spot need a tie-break such as the site id; per-character metadata and tombstones cost memory."
