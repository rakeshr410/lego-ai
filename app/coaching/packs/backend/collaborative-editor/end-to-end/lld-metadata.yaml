# Collaborative editor interview, low-level design of the metadata service, under "5. Low level design" as the video draws it: the metadata service sends its updates to Kafka, a metadata consumer writes a Cassandra database, and the document table is written beside it. The video says the metadata write volume needs the queue; the pack says metadata writes are light and the queue optional.
