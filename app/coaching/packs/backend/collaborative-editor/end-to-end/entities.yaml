  - point: "Reading the requirements gives four core entities: the user who edits, the document, the edit, and the cursor."
    kind: component
    weight: core
    teach:
      - "Step two, the core entities: read the requirements and pick out the nouns. The user, or editor, making changes. The document being changed."
      - "Because several users change one document at once, each change matters on its own: the edit. And each user's position in the text: the cursor. More will turn up during the design."
    draw: [entities, ent-user, ent-doc, ent-edit, ent-cursor]
    check: Why is an edit an entity of its own and not just part of the document?
    answer: Several users change one document at once, so each change is sent, ordered, merged and logged by itself.
