beats:
  - point: "The brute-force way: on every change the client sends the whole file to the editor service over HTTP, the service saves it and pushes the change to the other users with server-sent events, and they reload it."
    kind: mechanism
    weight: core
    teach:
      - "Now the heart, the editor service. Start brute force. User A and user B have one file open. User A types abc, and the client sends the whole file to the editor service in an HTTP request; the service saves it."
      - "Then the service pushes a notice to user B over server-sent events, a one-way push from server to browser, and user B's client fetches the file and redraws. Call it file replacement."
    draw: [lld-file, f-user-a, f-user-b, f-file, f-a-file, f-editor, f-file-editor, f-editor-b]
    check: What travels to the server when user A types one letter?
    answer: The whole file, in an HTTP request, and then a push and a fetch of the file for every other user.
  - point: "Two flaws sink it: every change sends the entire file, and every keystroke is a request plus a push and a fetch for each collaborator, millions of round trips."
    kind: failure
    weight: core
    teach:
      - "Two problems. The payload: one letter in a long document sends the entire document, every time."
      - "The count: every keystroke is a request in, then a push and a fetch out to every collaborator. Across millions of users that is millions of round trips. Write both flaws beside it; the next approaches fix them."
    draw: [f-flaw-size, f-flaw-count]
    check: Which two costs make file replacement unworkable?
    answer: The size of each request, the whole file, and the number of requests, one plus a push and fetch per keystroke per collaborator.
asks:
  - ids: [f-flaw-size, f-flaw-count]
    beats: [2]
    question: "So every change sends the whole file and pushes it to everyone. What goes wrong with that at our scale?"
    hints:
      - Think about a long document and a one-letter change.
      - And how many requests does a minute of typing make?
