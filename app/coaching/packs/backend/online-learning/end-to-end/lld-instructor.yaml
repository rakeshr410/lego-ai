beats:
  - point: "Instructors sign up through the same user service as students, into an instructor_profile table that adds a verification status, average rating, and student and course counts."
    kind: decision
    weight: core
    teach:
      - "Follow the content in before going further on the student side. An instructor logs in too, so their sign-up reaches the same user service through their gateway; two services would work, one is simpler."
      - "But the user table cannot tell an instructor from a student. Add an instructor_profile table: name, contact, password hash, average rating, student count, course count, status, and a verification status, the numbers an instructor's page shows."
    draw: [inst, inst-instructors, inst-lb, inst-instructors-lb, inst-user, inst-lb-user, inst-profile-1, inst-profile-2]
    check: Why a separate instructor_profile table?
    answer: The user table cannot tell instructors from students, and instructors carry their own fields such as verification status, rating and counts.
  - point: "Verification checks a government ID through an identity service and stores the result as the verification status; in India Aadhaar is checked through a licensed KYC agency that talks to UIDAI."
    kind: mechanism
    weight: core
    teach:
      - "This came up as a follow-up in the real interview: how do you verify an instructor? The field alone does nothing; something must check an ID document."
      - "The user service sends the ID details to an identity check and keeps the flag it returns. In India that is Aadhaar, run by UIDAI; only registered authentication and KYC agencies may call it, so go through one. Students skip this."
    draw: [inst-uidai, inst-user-uidai, inst-kyc]
    check: Where does the verification status come from?
    answer: From an identity check against a government ID, through a licensed KYC agency for Aadhaar, whose answer the user service stores.
    misconceptions:
      - "Any app can call UIDAI's API to verify Aadhaar -> only registered authentication and KYC agencies can; use one as the provider."
  - point: "The catalog service writes a course and its lessons to the course DB: courses with their status, course_pricing, and a denormalized course_stats for ratings."
    kind: mechanism
    weight: core
    teach:
      - "Creating a course: the instructor creates, say, a system design course with a description, then its lessons one by one. The catalog service writes all that text into the course DB."
      - "Three tables: courses, with owner, title, description, category, level, thumbnail and status; course_pricing, with the amount and currency; and course_stats, denormalized, with the average rating and how many ratings."
    draw: [inst-catalog, inst-lb-catalog, inst-coursedb, inst-catalog-coursedb, inst-courses-1, inst-courses-2, inst-pricing, inst-stats]
    check: Why keep course_stats as a denormalized table?
    answer: The rating figures are read on every course page and search, so they are kept precomputed instead of being worked out from every review each time.
  - point: "Videos go through the media uploader, which hands out a signed URL so the instructor's client uploads the chunks straight to S3, where they are transcoded into several resolutions beside thumbnails and attachments."
    kind: mechanism
    weight: core
    teach:
      - "Then the video. The media uploader service does not carry the bytes: the video is split into chunks, the service gives the client a signed URL, and the client uploads each chunk straight to S3."
      - "In S3 the chunks are transcoded into several resolutions, so the player can switch with the bandwidth, next to thumbnails and attachments. The interviewer may say assume the uploader exists; do not spend time on chunking unless asked."
    draw: [inst-uploader, inst-lb-uploader, inst-s3, inst-uploader-s3, inst-s3-holds, inst-signed]
    check: Why does the client upload to S3 directly instead of through the uploader service?
    answer: The signed URL lets the large file go straight to storage, so the service never carries the bytes and does not become the bottleneck.
  - point: "Quizzes go through the catalog service into a quiz DB: a quizzes table per lesson and a questions table, one quiz to many questions."
    kind: mechanism
    weight: core
    teach:
      - "Courses also have quizzes and assignments, and they need a home: a quiz DB, written by the same catalog service."
      - "Two tables: quizzes, with the course, the lesson, a title and a pass score; and questions, with the quiz, a type such as multiple choice or true or false, and points. One quiz has many questions."
    draw: [inst-quizdb, inst-catalog-quizdb, inst-quizzes, inst-questions]
    check: How are quizzes and questions related?
    answer: One to many; each question carries its quiz's id.
  - point: "Nothing is public yet: an admin or moderator uses a course moderator service that reads the course DB, the videos in S3 and the quiz DB, and publishes or rejects the course."
    kind: flow
    weight: core
    teach:
      - "Udemy checks every course before it goes out, for bad content or language. Add a course moderator service, used by a new actor, the admin or moderator, through the same gateway."
      - "It reads the course's metadata in the course DB, its videos in S3 and its quizzes in the quiz DB; once satisfied, the moderator publishes. The status moves from draft, to in review, to published, or rejected, or later archived."
    draw: [inst-admin, inst-admin-lb, inst-moderator, inst-lb-moderator, inst-moderator-coursedb, inst-moderator-quizdb, inst-moderator-s3, inst-status]
    check: What does the moderator service read before a course is published?
    answer: The course rows in the course DB, the videos in S3 and the quizzes in the quiz DB.
  - point: "The course and quiz data is flat and relational, so Postgres or MySQL; the joins a course page needs are why search reads a precomputed copy."
    kind: decision
    weight: supporting
    teach:
      - "Which database? Flat, relational rows, so Postgres or MySQL. And now you can see why the aggregator exists: a whole course is spread over these tables, and search reads the joined document instead."
    draw: [inst-db-choice]
    check: Why does this table layout explain the aggregator pipeline?
    answer: A course's data is spread over several tables; the aggregator joins them once so search never has to.
asks:
  - ids: [inst-uidai]
    beats: [2]
    question: "The interviewer asks how you would verify that an instructor is who they say. What would you add?"
    hints:
      - A flag alone proves nothing; something has to check a document.
      - Think of a government ID service, or a company that checks it for you.
  - ids: [inst-uploader]
    beats: [4]
    question: "An instructor uploads an hour of video. How would you get it into S3 without your servers carrying it?"
    hints:
      - Could the client write to storage directly, if allowed?
      - What kind of link grants a time-limited upload?
  - ids: [inst-quizdb]
    beats: [5]
    question: "Courses also have quizzes. Where would you keep them?"
    hints:
      - Questions are structured rows, not files.
      - One quiz, many questions.
  - ids: [inst-moderator]
    beats: [6]
    question: "Udemy checks every course before students see it. What would you add for that?"
    hints:
      - Someone has to look at everything the instructor uploaded.
      - Which stores would they need to read?
