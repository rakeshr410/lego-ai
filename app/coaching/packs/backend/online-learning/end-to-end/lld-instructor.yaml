# Online learning interview, deep dive 2: instructors, uploads and moderation. Under "5. Deep dive", the instructor side of the video's picture as it grows it, read right to left: instructors and the admin on the right, their gateway, then the user service (with the identity check), catalog, course moderator and media uploader, and the stores on the left (course DB, quiz DB, S3); the tables written below, as the video writes them beside the picture. The video calls UIDAI directly; this pack goes through a licensed KYC agency.
