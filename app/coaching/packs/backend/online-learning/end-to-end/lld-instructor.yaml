  after: backend/online-learning/end-to-end/lld-search
  assumes:
    - "Instructors have their own gateway, a catalog service writing the course DB, and a media uploader writing blob storage."
    - "Course search reads a precomputed document per course from Elasticsearch."
  carries:
    - "Instructors sign up through the same user service into an instructor_profile table with a verification status from an identity check."
    - "Catalog writes courses, pricing and stats to the course DB, and quizzes and questions to a quiz DB."
