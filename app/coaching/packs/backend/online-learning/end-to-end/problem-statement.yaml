beats:
  - point: "An online learning platform like Udemy or Coursera is a global marketplace: instructors upload courses of videos, quizzes and assignments, and students who join or buy a course work through it."
    kind: rule
    weight: core
    teach:
      - "Write the title: an online learning platform like Udemy or Coursera. Under it, one line: a global marketplace of on-demand online courses."
      - "Instructors anywhere upload videos, questions and assignments; once a student buys or joins a course, they can go through all of it."
    draw: [title, prompt-desc]
    check: In one sentence, what does this platform do?
    answer: Instructors upload courses of videos, quizzes and assignments, and students who enroll or buy them can take them.
  - point: "There are three actors, students, instructors and moderators, each with their own flows, so agree the scope: the student flow and the instructor upload flow."
    kind: decision
    weight: core
    teach:
      - "The question looks easy, but count the actors: students taking lessons, instructors uploading courses, and admins or moderators who check every course before it goes public."
      - "Many actors means many flows, more than forty-five minutes can hold. So ask which side the interviewer cares about, and say what you will design: the student flow and how an instructor's content gets into the backend."
    draw: [prompt-actors, prompt-scope]
    check: Why agree on scope before writing requirements?
    answer: Several actors each bring their own flows; there is no time to design them all, so you pick the core ones with the interviewer.
    misconceptions:
      - "Design every actor's flow to be thorough -> you run out of time; agree the core flows and name the rest as out of scope."
  - point: "The interview runs in five steps: requirements, core entities, API, high-level design, then a deep dive."
    kind: rule
    weight: supporting
    teach:
      - "Say the plan once: functional and non-functional requirements, the core entities, the API, a high-level design, and a deep dive where most of the time goes."
      - Said, not written; each step gets its number on the board when we reach it.
    check: Which step comes after the core entities?
    answer: The API, then the high-level design.
