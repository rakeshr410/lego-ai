  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/online-learning/end-to-end/entities
  assumes:
    - "The core entities are the user or instructor, the course, the payment, the review and the progress."
  carries:
    - "Courses: GET /courses with query and filters, GET /courses/{courseId}, POST /instructor/courses, POST /instructor/courses/{courseId}/publish."
    - "Progress: POST /progress/events, batched, and GET /me/courses/{courseId}/progress."
    - "Enrollments: POST /courses/{courseId}/enroll for free courses, GET /me/entitlements?courseId= for access, GET /me/enrollments."
  terms:
    - term: endpoint
      means: A method and a path the service answers, with what it takes and returns.
