# Online learning interview, requirements: "1. Functional requirements" on the left, student lines then instructor lines, and "Non-functional requirements" on the right, under the problem statement, as the video lays them out; CAP split by part of the system.
id: backend/online-learning/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "253eb96b3815"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/online-learning/end-to-end/problem-statement
  assumes:
    - "Students, instructors and moderators; the scope is the student flow and the instructor upload flow."
  carries:
    - "Functional, students: account; search and filter by category, difficulty, rating, price; enroll; quizzes and assignments; progress and completion; reviews and ratings."
    - "Functional, instructors: onboarding and verification; create courses with videos, quizzes, assignments and resources."
    - "Non-functional: 100K+ courses and millions of students; availability for site and video, strong consistency for payment and enrollment; large files; video starts within 2 s."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, with a number and where it applies."
