beats:
  - point: "The student's core requirements: create an account, search and filter courses by category, difficulty, rating and price, and enroll, free or paid."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: what the system does, the student first. A user can create an account."
      - "They browse, search and filter courses, by category, difficulty, rating and price. And they enroll in a course, which may be free or paid."
    draw: [fr, fr-account, fr-search, fr-enroll]
    check: What does a student need to do before they can watch anything?
    answer: Create an account, find the course by searching or filtering, and enroll in it, free or by paying.
  - point: "Then what the student does inside a course: quizzes and assignments, progress tracking with completion status, and reviews and ratings."
    kind: requirement
    weight: core
    teach:
      - "Inside a course there is an assessment system, quizzes and assignments, and the student's progress is tracked: how much is done, whether it is complete."
      - "And every course has reviews and ratings; without them nobody can tell which course is any good."
    draw: [fr-assess, fr-progress, fr-review]
    check: Why are reviews and ratings a requirement, not a nice-to-have?
    answer: Students choose courses by them; without reviews and ratings they cannot tell a good course from a bad one.
  - point: "The instructor side adds two: instructor onboarding with verification, and creating courses with videos, quizzes, assignments and resources."
    kind: requirement
    weight: core
    teach:
      - "Now the instructor. They are onboarded, and verified, so we know who is teaching."
      - "And they create courses: videos, quizzes, assignments and other resources. Eight lines, six for students and two for instructors."
    draw: [fr-onboard, fr-create]
    check: What are the two instructor requirements?
    answer: Onboarding with verification, and creating courses with videos, quizzes, assignments and resources.
  - point: "Scale comes first among the non-functional requirements: over 100,000 courses and millions of enrolled students."
    kind: metric
    weight: core
    teach:
      - "On the right, the qualities. Ask for the scale first, because it decides the big design choices."
      - "Say the interviewer answers: more than 100,000 courses, and millions of enrolled students, about a million to start."
    draw: [nfr, nfr-scale]
    check: Why ask for the scale before anything else?
    answer: The number of courses and students decides the database and architecture choices that follow.
  - point: "CAP is split by part of the system: the site and its videos favour availability, while payment and enrollment must be strongly consistent."
    kind: requirement
    weight: core
    teach:
      - "Millions of students worldwide means a distributed system, so partitions happen and we choose. For browsing and streaming, availability: a new course passes moderation before anyone sees it, so nobody needs it everywhere instantly."
      - "But a student who pays must get the course; access should not trail the payment. So payment and enrollment favour consistency."
    draw: [nfr-avail, nfr-consistent]
    check: Which part of this platform favours consistency, and why?
    answer: Payment and enrollment, because once a student pays they must get access; the rest favours availability.
    misconceptions:
      - "The whole system picks one side of CAP -> each part chooses; streaming takes availability, payment and enrollment take consistency."
  - point: "The system supports large files, such as hour-long videos, and a video starts within 2 seconds of pressing play."
    kind: metric
    weight: core
    teach:
      - "Large files: an instructor uploads an hour of video, or a big assignment; the system has to take it."
      - "And latency, with a number: when a student presses play, the video starts within two seconds."
    draw: [nfr-files, nfr-latency]
    check: What exactly does the 2-second figure measure?
    answer: The start-up time, from pressing play to the video starting.
asks:
  - list: fr-list
    beats: [1, 2, 3]
    question: "So what should this platform let people do? Start with the student, then the instructor, one feature at a time."
    hints:
      - Think of a student's journey, from signing up to finishing a course.
      - And what does an instructor need to get a course online?
  - list: nfr-list
    beats: [4, 5, 6]
    question: "Now the qualities. How big is it, what must never go wrong, and how fast should a video start?"
    hints:
      - Ask about the number of courses and students.
      - Where would losing consistency hurt, and where would losing availability hurt?
