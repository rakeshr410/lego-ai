# Online learning interview, deep dive 1: the user service and course search. Under "5. Deep dive design", the part of the copied picture the video opens first: the user service with the user table beside its database, then course search reading Elasticsearch, fed by an aggregator CDC pipeline from the course DB, laid out as the video grows it (search, Elasticsearch, aggregator, course DB in a row). Passwords are taught as hashed, not encrypted.
