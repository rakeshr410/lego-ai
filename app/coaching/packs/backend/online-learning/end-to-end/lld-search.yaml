beats:
  - point: "The deep dive opens the design service by service; the user service keeps flat profile rows in a relational user DB, Postgres or MySQL, with the password stored as a slow salted hash."
    kind: decision
    weight: core
    teach:
      - "Step five, the deep dive. We copy the high-level picture down and open each service: how it talks to the others and stores its data. First the user service."
      - "It keeps the user's id, name, email or phone, password, account status and profile metadata: flat relational rows, so Postgres or MySQL."
      - "The password is hashed, with a slow salted hash like bcrypt, not encrypted: nothing should be able to turn it back."
    draw: [dd, dd-user, dd-userdb, dd-user-userdb, dd-user-row-1, dd-user-row-2, dd-hash]
    check: How should the password column be stored, and why not encrypted?
    answer: As a slow salted hash such as bcrypt or Argon2; encryption can be reversed by whoever holds the key, a hash cannot.
    misconceptions:
      - "Encrypt the passwords -> encryption is reversible; store a slow salted hash and compare hashes at login."
  - point: "Search needs free text over titles plus filters on category, difficulty, rating and price, so the course search service asks Elasticsearch instead of the course DB."
    kind: mechanism
    weight: core
    teach:
      - "Course search: users filter by category, difficulty, rating and price, and type any text into the title box. Text search is not a plain database query."
      - "So decouple: the course search service no longer queries the course DB; it asks Elasticsearch, a search engine built for text with filters."
    draw: [dd-search, dd-es, dd-search-es]
    check: Why put a search engine in front, rather than querying the course DB?
    answer: Free-text search over titles with many filters needs a search engine; a database query does it poorly.
  - point: "The filters live in separate tables and joining them on every query is slow, so an aggregator CDC pipeline reads course DB changes, joins them into one JSON document per course, and indexes it in Elasticsearch."
    kind: mechanism
    weight: core
    teach:
      - "Elasticsearch cannot work alone; it needs the data. And the data is spread out: ratings in one table, prices in another, titles and metadata in a third. Joining them on every search would make each one slow."
      - "So precompute. Plain CDC would copy rows across; here an aggregator CDC pipeline reads each change from the course DB, joins the course's tables into one JSON document, and posts it to Elasticsearch. Every search then reads a ready-made document."
    draw: [dd-coursedb, dd-agg, dd-coursedb-agg, dd-agg-es, dd-joins, dd-doc, dd-sync]
    check: What does the aggregator add over a plain CDC pipeline?
    answer: It joins the course's separate tables into one JSON document per course before indexing, so no search has to join.
    misconceptions:
      - "Join the tables at query time; the database is fast enough -> a join on every search grows slow with the catalogue; precompute the document once per change."
asks:
  - ids: [dd-es]
    beats: [2]
    question: "Students type free text and add filters. What would you put behind the course search service?"
    hints:
      - Is a relational query good at free-text search?
      - Think of an engine built for searching documents.
  - ids: [dd-agg]
    beats: [3]
    question: "The search engine needs the course data, but it is spread over several tables. How would you get it there, ready to search?"
    hints:
      - Joining at query time is slow; when else could you join?
      - Something could watch the course DB for changes.
