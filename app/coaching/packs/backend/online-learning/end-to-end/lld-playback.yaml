beats:
  - point: "Before fetching any video, the video playback service checks the course enrollment DB for the student's access; no active access, no video."
    kind: mechanism
    weight: core
    teach:
      - "The student has access and opens the course; the request reaches the video playback service."
      - "Its first job is not fetching: it checks the course enrollment DB for an active access row for this user and course. If there is none, nothing is served."
    draw: [pb, pb-students, pb-lb, pb-students-lb, pb-playback, pb-lb-playback, pb-enrolldb, pb-playback-enrolldb]
    check: What does the playback service check before serving a video?
    answer: That the student has an active access row for the course in the course enrollment DB.
  - point: "With access, it returns a manifest: the list of the video's chunk URLs at each resolution, which the player reads to fetch chunks and switch quality with the bandwidth."
    kind: mechanism
    weight: core
    teach:
      - "With access, the playback service returns a manifest file, the list of the video's chunks in S3 at each resolution."
      - "The player reads it and fetches chunk by chunk, 4K on a good line, dropping to 720p or 480p when the network dips."
    draw: [pb-s3, pb-playback-s3, pb-manifest, pb-abr]
    check: What is in the manifest the playback service returns?
    answer: The URLs of the video's chunks at each resolution, so the player can fetch them and switch quality.
  - point: "A CDN serves the chunks from an edge near the student and fetches from S3 only on a miss, which is what meets the 2-second start; signed chunk URLs stop a shared link from bypassing the access check."
    kind: mechanism
    weight: core
    teach:
      - "Fetching every chunk from one S3 region is a long trip for a student in India watching a video stored in the US. So a CDN: the player asks the nearest edge for each chunk."
      - "If the edge has it, it answers straight away; on a miss it fetches from S3 and keeps it. Popular courses come from nearby: that is the two-second start."
      - "Give the chunk URLs a short-lived signature, so the access check cannot be dodged by passing a link around."
    draw: [pb-cdn, pb-students-cdn, pb-cdn-s3, pb-edge, pb-signed]
    check: How does the CDN help meet the 2-second start?
    answer: Chunks come from an edge near the student; only a miss goes back to S3.
    misconceptions:
      - "Every chunk request goes through the playback service -> the service only checks access and hands out the manifest; chunks come from the CDN."
  - point: "After a lesson a quiz or assignment opens, and an assignment service saves the student's answers to the quiz DB beside the questions."
    kind: component
    weight: supporting
    teach:
      - "After a video, a set of questions or an assignment opens. An assignment service takes the student's answers and saves them in the quiz DB, which now holds both the quizzes and each student's responses."
    draw: [pb-assign, pb-lb-assign, pb-quizdb, pb-assign-quizdb, pb-answers]
    check: Where do a student's quiz answers go?
    answer: Through the assignment service into the quiz DB, beside the quiz's questions.
asks:
  - ids: [pb-enrolldb]
    beats: [1]
    question: "A request to play a video arrives. What must the playback service check first, and where?"
    hints:
      - Not every student may open every course.
      - Which store records who may open what?
  - ids: [pb-cdn]
    beats: [3]
    question: "A student in India opens a video stored in a US bucket. How would you make it start within two seconds?"
    hints:
      - Distance is latency.
      - Something near the student could keep copies of the chunks.
  - ids: [pb-assign]
    beats: [4]
    question: "The student finishes a quiz. What takes their answers?"
    hints:
      - A service of its own, behind the gateway.
      - The answers belong next to the quiz's questions.
