# Online learning interview, deep dive 4: playback, the CDN and assignments. Under "5. Deep dive", the video's playback part: the CDN above the students with its line to S3, the video playback service checking the course enrollment DB and pointing at S3, and the assignment service writing the quiz DB; the manifest and CDN notes below.
id: backend/online-learning/end-to-end/lld-playback
title: "Deep dive, 4: playback, the CDN and assignments"
source:
  hash: "de30793f2410"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/online-learning/end-to-end/lld-enrollment
  assumes:
    - "The course enrollment DB holds the access rows written by enrollment and permission sync."
    - "Videos sit in S3 as chunks transcoded into several resolutions."
    - "A video must start within 2 seconds."
  carries:
    - "The video playback service checks the access row first, then returns a manifest listing the chunks at each resolution."
    - "A CDN serves the chunks from an edge near the student and fills from S3 on a miss; signed chunk URLs keep the access check meaningful."
    - "An assignment service saves students' answers to the quiz DB."
  terms:
    - term: manifest
      means: The file that lists a video's chunks at each resolution, which the player reads to fetch and to switch quality.
    - term: CDN
      means: Edge servers near users that cache content and fetch from the origin on a miss.
