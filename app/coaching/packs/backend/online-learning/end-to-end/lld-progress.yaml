beats:
  - point: "Comments and reviews are simple: the comment and review service writes them to the course DB, where course_stats keeps the rating figures."
    kind: component
    weight: supporting
    teach:
      - "Two requirements are left. Reviews first, the easy one: the comment and review service writes each comment and rating into the course DB, and the course's stats follow."
    draw: [pr, pr-students, pr-lb, pr-students-lb, pr-review, pr-lb-review, pr-coursedb, pr-review-coursedb]
    check: Where do reviews end up, and what keeps the course's rating up to date?
    answer: In the course DB, with course_stats holding the average rating and rating count.
  - point: "To resume a video, the player sends a progress event every 10 to 15 seconds; storing every one would fill the progress DB with rows nobody needs, since only the latest position matters."
    kind: failure
    weight: core
    teach:
      - "Progress is harder. To resume where the student stopped, the front end sends an event every 10 or 15 seconds: at second zero I was here, at second ten here."
      - "Save each one and the progress DB fills with rows nobody reads. We only need the last position."
    draw: [pr-progress, pr-lb-progress, pr-events]
    check: Why not write every progress event to the progress DB?
    answer: There are a great many of them and only the latest position matters, so the rest would be stored for nothing.
  - point: "The user progress service drops the events into Kafka, and a user tracking consumer reads them about once a minute and writes only the latest position per student and video to the progress DB."
    kind: mechanism
    weight: core
    teach:
      - "So the user progress service puts the events on Kafka, which takes the stream easily."
      - "A user tracking consumer reads them in batches, about once a minute, keeps the latest event per student and video, and writes just that to the progress DB. If analytics wants every event, another consumer can keep them elsewhere."
    draw: [pr-kafka, pr-progress-kafka, pr-consumer, pr-kafka-consumer, pr-progressdb, pr-consumer-progressdb, pr-batch]
    check: What does the consumer write to the progress DB?
    answer: Only the latest position for each student and video, about once a minute.
    misconceptions:
      - "Kafka replaces the progress DB -> Kafka buffers the stream; the progress DB keeps the one row per student and video that resuming reads."
  - point: "The progress table keeps, per student, course and video, the duration, the furthest point watched, the last position for resuming, and whether it is completed; the progress service reads it when the student returns."
    kind: decision
    weight: core
    teach:
      - "The progress table, in MySQL: user, course, video, the duration, the maximum position watched, the last position to resume from, and completed."
      - "When the student logs in again, the progress service reads it: the video resumes from the last position, and the course shows its completion."
    draw: [pr-progress-progressdb, pr-table-1, pr-table-2]
    check: Which column does resuming use, and which shows how much was watched?
    answer: The last position is where to resume; the maximum position is the furthest point watched.
  - point: "Follow-up from the real interview: an enterprise version where companies onboard and assign courses; organisations get their own onboarding and a landing page template each, stored as JSON and picked from the SSO token."
    kind: requirement
    weight: supporting
    teach:
      - "After the deep dive the interviewer added a requirement: companies like Microsoft or Walmart join and assign courses to their employees by a deadline."
      - "Onboard organisations through their own onboarding service, as users are. Each wants its own landing page: keep a template per organisation as JSON, and pick it from the organisation in the employee's SSO token."
    draw: [ent-head, ent-onboard, ent-sso]
    check: How does each organisation get its own landing page?
    answer: A template per organisation stored as JSON, chosen from the organisation in the employee's SSO token.
  - point: "The probes behind it: keep each organisation's data apart by sharding on the organisation, and give each its URL as a subdomain, routed by DNS and the Host header; subnets play no part."
    kind: decision
    weight: core
    teach:
      - "Then the probe: one course DB holding every company's data together is not acceptable. Isolate tenants, sharding or partitioning by organisation, so no two share data."
      - "And each organisation wants its own URL: a subdomain per organisation, with wildcard DNS and certificates, routed by the request's Host header. The video mentions subnets; those are IP ranges inside a network, nothing to do with a tenant's URL."
    draw: [ent-shard, ent-domain]
    check: How would you give each organisation its own URL?
    answer: A subdomain per organisation, resolved by wildcard DNS and routed by the Host header.
    misconceptions:
      - "Give each organisation a subnet -> subnets are IP address ranges; tenant URLs are subdomains."
  - point: "Close by reading the non-functional list back against the design: scale, availability where it helps, consistency for payment, large files, and the 2-second start."
    kind: rule
    weight: supporting
    teach:
      - "Read the requirements on the right back. Scale: services scaled apart, search on Elasticsearch, progress buffered by Kafka. Availability for browsing and video; consistency for payment, made safe by the outbox. Large files: chunks straight to S3. Two seconds: the CDN."
    check: Which part of the design meets the 2-second start?
    answer: The CDN serving chunks from an edge near the student, with the manifest from the playback service.
asks:
  - ids: [pr-kafka, pr-consumer]
    beats: [3]
    question: "Events arrive every ten seconds per student, and we only need the last one. How would you get the latest position into the database without writing every event?"
    hints:
      - Something could absorb the stream first.
      - And something else could read it in batches.
  - ids: [ent-shard, ent-domain]
    beats: [6]
    question: "Enterprise customers want their data kept apart and their own URL. How would you do each?"
    hints:
      - Split the data by the organisation.
      - Think of a part of the domain name per organisation.
task:
  prompt: "Draw the final design from the whole deep dive: students, the gateway, search with Elasticsearch, playback behind the access check and a CDN, payment with the outbox and Kafka, and progress through Kafka to the progress DB."
  expects: [3, 4]
