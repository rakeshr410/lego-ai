# Online learning interview, deep dive 5: reviews, progress tracking, and the enterprise follow-up. Under "5. Deep dive", the video's last part: the comment and review service to the course DB, the user progress service to Kafka, the user tracking consumer under Kafka writing the progress DB, the progress table below; then the interviewer's enterprise follow-up, which the video says without drawing, as notes. The video's "subnet" is taught as subdomains.
