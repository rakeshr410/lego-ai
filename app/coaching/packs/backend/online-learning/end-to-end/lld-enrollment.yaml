# Online learning interview, deep dive 3: enrollment, payment and the outbox. Under "5. Deep dive", the payment part of the video's picture: students and their gateway, the enrollment service to the course enrollment DB, the payment service with the payment gateway under it and the payment DB beside it, Kafka to the right with the notification service under it and the permission sync service above it, writing back to the enrollment DB; the tables below. The video's "outlook" table is the transactional outbox, and its reason (Kafka down) is replaced by the dual write.
id: backend/online-learning/end-to-end/lld-enrollment
title: "Deep dive, 3: enrollment, payment and the outbox"
source:
  hash: "09d9500671bd"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/online-learning/end-to-end/lld-instructor
  assumes:
    - "A paid enrollment writes the payment DB and grants access in the course enrollment DB: two writes for one purchase."
    - "Payment and enrollment must be strongly consistent."
  carries:
    - "Free courses: the enrollment service writes an access row. Paid: the payment service charges through a payment gateway."
    - "On success the payment row and an outbox row are written in one atomic transaction; CDC publishes outbox rows to Kafka."
    - "A notification service sends the receipt; a permission sync service writes the access row, idempotently, keyed by the order."
    - "Access lands within seconds of the payment and is never lost."
  terms:
    - term: dual write
      means: Writing two systems one after the other with no shared transaction, so one can succeed and the other fail.
    - term: transactional outbox
      means: "A table in the service's own database, written in the same transaction as the business row, whose rows a relay publishes as events."
    - term: idempotent
      means: Safe to apply twice; a repeated event changes nothing.
