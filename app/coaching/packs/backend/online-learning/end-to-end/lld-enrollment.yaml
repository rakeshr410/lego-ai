beats:
  - point: "Enrollment is a permission: a student opens only courses they joined or bought. A free course is enrolled directly, the enrollment service writing an access row in the course enrollment DB."
    kind: flow
    weight: core
    teach:
      - "A student can open only the courses they joined or paid for, so enrollment is really a permission: which user may open which course. That is the course enrollment DB."
      - "A free course: the student presses enroll, the enrollment service writes the row, done."
    draw: [enr, enr-students, enr-lb, enr-students-lb, enr-enroll, enr-lb-enroll, enr-enrolldb, enr-enroll-enrolldb]
    check: Why is the course enrollment DB really a permissions table?
    answer: It records which user may open which course, and playback checks it before serving anything.
  - point: "A paid course goes through the payment service, which calls a payment gateway that does the transaction with the bank and reports success or failure."
    kind: flow
    weight: core
    teach:
      - "A paid course: the front end asks the student to pay, and the request goes to the payment service, which calls a payment gateway to do the transaction with the bank."
      - "How the gateway works is its own design; here, the result comes back to the payment service, success or failure."
    draw: [enr-payment, enr-lb-payment, enr-gateway, enr-payment-gateway]
    check: Who talks to the bank?
    answer: The payment gateway, called by the payment service, which gets back success or failure.
  - point: "Writing the payment DB and then the enrollment DB is a dual write that can half-fail, leaving a paid student without access; instead the payment service writes the payment row and an outbox row in one atomic transaction."
    kind: failure
    weight: core
    teach:
      - "On success, the obvious move is two calls: save the payment, then grant access. But if the second fails, the student has paid and has no course. That is a dual write, and it can half-fail."
      - "So the payment service makes one atomic transaction in its own payment DB: the payment row, and a row in a payment_outbox table saying this user bought this course. The video calls it an outlook table; the pattern is the transactional outbox. The orders table sits beside it."
    draw: [enr-paymentdb, enr-payment-paymentdb, enr-atomic, enr-orders]
    check: What goes wrong if the payment service writes the payment DB and then the enrollment DB?
    answer: The second write can fail after the first succeeded, so the student is charged but gets no access.
    misconceptions:
      - "Wrap both databases in one call and it is safe -> two databases share no transaction; only one local transaction cannot half-fail."
  - point: "Change data capture reads each new outbox row and publishes it to Kafka, and a notification service consumes it to send the receipt."
    kind: mechanism
    weight: core
    teach:
      - "Now the event leaves. Change data capture watches the outbox table and publishes each new row as an event to Kafka."
      - "Consumers react. A notification service sends the student an email or text that the payment went through."
    draw: [enr-kafka, enr-paymentdb-kafka, enr-notify, enr-kafka-notify]
    check: How does the purchase event get from the payment DB to Kafka?
    answer: Change data capture reads the new outbox row and publishes it to Kafka.
  - point: "A permission sync service consumes the purchase event and writes the access row, user, course, scope and status, into the course enrollment DB."
    kind: mechanism
    weight: core
    teach:
      - "And a permission sync service reads the same event, the purchase, the course and the student, and writes the access row into the course enrollment DB."
      - "The access table: access id, user, course, scope type, lifetime or subscription, status, active, revoked or expired, and the purchase date."
    draw: [enr-perm, enr-kafka-perm, enr-perm-enrolldb, enr-access-1, enr-access-2, enr-scope]
    check: Which service grants access after a payment, and from what?
    answer: The permission sync service, from the purchase event it consumes from Kafka.
  - point: "Publishing to Kafka straight from the payment service is the same dual write; with the outbox, delivery is at least once, so permission sync is idempotent, and access lands within seconds and is never lost."
    kind: decision
    weight: core
    teach:
      - "Why not publish to Kafka straight from the payment service? Because the service can crash after committing the payment and before publishing, and the event is gone. The video blames Kafka being down; Kafka is replicated, the real gap is between the two writes."
      - "With the outbox, the event exists the moment the payment does, and the relay keeps its place, so unsent rows go out after any failure. That means an event can arrive twice: permission sync must be idempotent, keyed by the order."
      - "And be honest about timing: the payment is consistent at once, the access follows within seconds and is never lost. The page can poll the entitlement until it shows."
    draw: [enr-dual, enr-idem, enr-seconds]
    check: Why must the permission sync service be idempotent?
    answer: The outbox delivers at least once, so the same purchase event can arrive again; keyed by the order, a repeat changes nothing.
    misconceptions:
      - "The outbox gives the student access in the same instant -> it guarantees the access is never lost; it lands seconds later."
asks:
  - ids: [enr-atomic]
    beats: [3]
    question: "The payment succeeded. If you save it and then grant access as two separate writes, what can go wrong, and how would you make it safe?"
    hints:
      - What if the second write fails?
      - Could both facts go into one database, in one transaction?
  - ids: [enr-kafka]
    beats: [4]
    question: "The purchase is recorded with an outbox row. How does the rest of the system hear about it?"
    hints:
      - Something could read new rows from the database.
      - Several services want the same event.
  - ids: [enr-perm]
    beats: [5]
    question: "Who should write the student's access row now?"
    hints:
      - A consumer of the purchase event.
      - Its only job is to keep permissions in step with payments.
  - ids: [enr-idem]
    beats: [6]
    question: "The relay may send the same purchase event twice. What must the access writer do about that?"
    hints:
      - What happens if it inserts a second access row?
      - Is there a key that makes the second write a no-op?
