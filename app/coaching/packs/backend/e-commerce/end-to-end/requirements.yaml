# E-commerce interview, requirements: "1. Functional requirements" on the left, six lines, and "Non-functional requirements" on the right, scale, the CAP choice per module and latency, as the video lays them out.
id: backend/e-commerce/end-to-end/requirements
title: Six features, and how well
source:
  hash: "ebfbcccfabfc"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/e-commerce/end-to-end/problem-statement
  assumes:
    - "We design the shopper's flow of an online shop like Amazon."
  carries:
    - "Functional: search by title or name; view details; add a quantity to the cart; pay and check out; order status; handle items in limited stock."
    - "Non-functional: 10M monthly users and 10 orders a second; search and viewing highly available; payment, orders and inventory consistent; search about 200 ms."
  terms:
    - term: functional requirement
      means: What the system does for its user.
    - term: non-functional requirement
      means: "A quality of the system (scale, availability, consistency, latency), stated with a number or a choice."
    - term: CAP theorem
      means: "During a network partition a replicated system either answers, perhaps stale, or refuses until its copies agree."
