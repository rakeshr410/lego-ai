beats:
  - point: "The four core steps of the shopper's flow: search by title or name, view a product's details, pick a quantity and add it to the cart, then pay and check out."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: functional requirements. Follow a shopper. They search for a product by its title or name, then open one and see its details: description, images, how many are available, reviews."
      - "They pick a quantity and add it to the cart, and finally pay and check out. Those four are the heart of it."
    draw: [fr, fr-search, fr-details, fr-cart, fr-pay]
    check: Walk me through the four core things a shopper does.
    answer: Search for a product, view its details, add a quantity to the cart, pay and check out.
  - point: "Two more: check the status of an order, and handle purchases of items in limited stock, such as thousands of buyers for five iPhones in a flash sale."
    kind: requirement
    weight: core
    teach:
      - "After buying, the shopper wants to track the order's status."
      - "And the hard one: items in limited stock. A flash sale on iPhones, thousands of buyers, five or six phones. The design must handle that race."
    draw: [fr-status, fr-limited]
    check: Why is limited stock a requirement of its own?
    answer: Because many buyers at once for a few units is a race; without care the same unit is sold more than once.
  - point: "Scale first: 10 million monthly active users and 10 orders a second, too much for one server, so the design will be microservices."
    kind: metric
    weight: core
    teach:
      - "On the right, the non-functional requirements. Ask for the scale first: say 10 million monthly active users and 10 orders a second."
      - "No single server carries that, so we will split the system into services: a distributed system, which brings us to CAP."
    draw: [nfr, nfr-scale]
    check: Why ask for the scale at all?
    answer: It decides the architecture; at this scale no one server is enough, so we go to microservices.
  - point: "CAP is chosen per module: search and viewing highly available, payment, orders and inventory strongly consistent; and search answers in about 200 ms."
    kind: requirement
    weight: core
    teach:
      - "CAP says what a distributed system does when the network between its machines splits: keep answering, maybe stale, or refuse until the copies agree. The shop needs both, in different places."
      - "Search and product pages must stay up, a slightly stale result is fine. Payment, orders and the inventory must be right: no money without an order, no unit sold twice."
      - "Then latency, with a number: a search in about 200 milliseconds."
    draw: [nfr-available, nfr-consistent, nfr-latency]
    check: Which modules favour consistency, and why?
    answer: Payment and orders, and the inventory, because money and stock must never be wrong; search can be a little stale and stay up.
    misconceptions:
      - "CAP means a distributed system can never be both available and consistent -> both hold until a partition; CAP is the choice made during one, and it can differ per module."
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should a shopper be able to do here? Tell me one feature at a time, and I'll write it down."
    hints:
      - Follow one shopper from looking for a phone to it arriving.
      - And what happens when a thousand people want the last five phones?
  - list: nfr-list
    beats: [3, 4]
    question: "Now the qualities. How big, how fast, and where must it stay up versus stay exact?"
    hints:
      - Think of users and orders per second, and how long a search may take.
      - Is a stale search result as bad as a wrong payment?
