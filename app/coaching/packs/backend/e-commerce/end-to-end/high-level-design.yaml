  assumes:
    - "Endpoints for search, product details, add to cart, checkout then payment, and order status."
    - "Scale: 10M monthly users, 10 orders a second."
  carries:
    - "Clients reach a round-robin load balancer and an API gateway that routes, authenticates and rate-limits."
    - "One microservice per requirement: user, search, product, cart, order status, checkout, payment, each with its database."
    - "Checkout calls payment, payment calls the third-party payment gateway; order status reads the order DB."
  terms:
    - term: microservice
      means: A small service owning one function and its own data, scaled on its own.
    - term: API gateway
      means: "The single entry point: routes each path to its service, checks who the caller is, limits their rate."
