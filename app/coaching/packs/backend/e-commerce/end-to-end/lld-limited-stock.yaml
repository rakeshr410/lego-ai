beats:
  - point: "Services run as replicas: with ten checkout instances for 10 orders a second and one iPhone left, ten shoppers at once land on ten instances, and each asks the inventory service."
    kind: mechanism
    weight: core
    teach:
      - "One requirement is still open: items in limited stock. Every service runs as replicas; say the checkout service has ten, for 10 orders a second."
      - "A flash sale, one iPhone left, and ten shoppers check out at the same moment, each on a different instance. All ten ask the inventory service."
    draw: [lld-stock, s-sale, s-ck1, s-ck2, s-ck10, s-inventory, s-ck1-inv, s-ck2-inv, s-ck10-inv, s-inventorydb, s-inv-db]
    check: Ten checkouts ask the inventory service at the same moment. What does each one hear?
    answer: One left, because none of them has bought it yet.
  - point: "All ten hear one left, all ten go on to pay, and nine pay for a phone that does not exist: the stock check and the purchase are separate steps, a race condition."
    kind: failure
    weight: core
    teach:
      - "Each sees the quantity it wants is there, so each goes on to payment. Ten payments, one phone."
      - "The check and the purchase are two steps, and nothing stops others passing the check in between. That is the race to handle."
    draw: [s-race-1, s-race-2]
    check: Why doesn't the stock check before payment stop the oversell?
    answer: All the checks happen before any purchase reduces the stock, so each sees the same last unit.
  - point: "Fix it with a Redis lock keyed by the product, set only if absent, holding the buyer and quantity: the first checkout takes it, the next is refused."
    kind: mechanism
    weight: core
    teach:
      - "Take a lock in a Redis cluster when a checkout starts. Its key is the product, its value the user and the quantity, and it is set only if absent, SET with NX, one atomic step."
      - "User 1's checkout takes the lock. User 2's finds it held and fails. The key must be the product alone: a key with the user in it gives every user their own lock, and the race stays."
    draw: [s-u1, s-u2, s-lock, s-u1-lock, s-u2-lock, s-key, s-nx]
    check: Why must the lock's key be the product, not the product and user together?
    answer: Different keys never conflict; with the user in the key every buyer gets a lock and they all pass.
    misconceptions:
      - "Lock on product, user and quantity -> two users then hold two different keys; the key is the product, the user and quantity are the value."
  - point: "The lock has a TTL of 30 seconds to a minute, the longest a checkout takes, so a shopper who never pays frees it; the refused shopper is told it is sold out or retries."
    kind: rule
    weight: core
    teach:
      - "What if user 1 walks away? Give the lock a TTL, 30 seconds to a minute, the longest a checkout takes. Unpaid, it expires by itself."
      - "User 2 is told there are not enough items, or retries when the lock is gone."
    draw: [s-ttl, s-retry]
    check: Why does the lock need a TTL?
    answer: So an abandoned checkout cannot hold the item for ever; the lock expires after 30 seconds to a minute.
  - point: "With several units, one lock per product makes buyers wait in line; reserve instead with an atomic conditional decrement, quantity minus n only where the quantity is at least n."
    kind: decision
    weight: supporting
    teach:
      - "One lock per product lets one buyer in at a time. With five phones left, reserve instead: one atomic update, quantity minus n only where at least n are left, in the inventory DB or a Redis counter."
      - "Five buyers succeed, the sixth's update matches nothing and fails, and nobody waits on a lock."
    draw: [s-reserve]
    check: Five phones left, six buyers. How does the conditional decrement decide?
    answer: Each decrement runs only if enough are left, so five succeed and the sixth finds too few and fails.
asks:
  - ids: [s-race-1]
    beats: [2]
    question: "Ten checkouts all hear one iPhone left. What happens next?"
    hints:
      - Each one thinks the phone is there.
      - Who reduces the stock, and when?
  - ids: [s-lock]
    beats: [3]
    question: "How would you make sure only one of them gets the last phone?"
    hints:
      - Something all the checkout instances can see.
      - Only one should be able to claim the product at a time.
  - ids: [s-ttl]
    beats: [4]
    question: "User 1 took the lock and then closed the app. What stops the phone being stuck for ever?"
    hints:
      - The lock shouldn't live for ever.
      - How long does a checkout take at most?
