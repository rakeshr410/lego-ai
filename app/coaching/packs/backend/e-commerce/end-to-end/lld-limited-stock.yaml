# E-commerce interview, low-level design: limited stock. The video explains the race by voice over ten checkout replicas and draws a Redis lock beside checkout; here the race is drawn (three of ten checkouts, one inventory service saying one left), then the fix under it: two checkouts and the Redis lock, with its key, set-if-absent and TTL written beside it. Corrected: the lock is keyed by the product alone, not product, user and quantity; several units are reserved by an atomic conditional decrement.
id: backend/e-commerce/end-to-end/lld-limited-stock
title: "Low-level design: limited stock"
source:
  hash: "c1679ee4a3ec"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/e-commerce/end-to-end/lld-checkout
  assumes:
    - "Checkout asks the inventory service for stock before payment; the inventory DB is the only source of truth."
    - "Every service runs as several replicas."
  carries:
    - "Ten checkout replicas checking one last iPhone at once all see one left and all sell it: a race between check and purchase."
    - "A Redis lock keyed by the product, set only if absent with a TTL of 30 s to 1 min, lets one checkout at a time take the last units."
    - "For several units, an atomic conditional decrement (qty minus n where qty is at least n) reserves stock without a lock."
  terms:
    - term: race condition
      means: A result that depends on the timing of concurrent requests, here many passing one stock check before any buys.
    - term: TTL
      means: "Time to live: the key deletes itself after it, so an abandoned lock frees itself."
