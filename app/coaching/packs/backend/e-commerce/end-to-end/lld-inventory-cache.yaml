    question: "Every order reads the inventory DB. How would you take that load off it?"
    hints:
      - Most reads ask the same question, how many are left.
      - Something in memory, in front of the database.
  - ids: [f-fresh]
    beats: [5]
    question: "The cache now lags the database after a sale. How would you keep it fresh?"
    hints:
      - Who changes the stock? They could update both.
      - Or follow the database's own change log.
  - ids: [f-productdb]
    beats: [6]
    question: "The product page shows a quantity from the product DB. How does it learn that stock sold?"
    hints:
      - The truth is in the inventory DB.
      - We used the same trick for Elasticsearch.
  - ids: [f-status]
    beats: [7]
    question: "Last requirement, order status. What reads it, and from where?"
    hints:
      - The order consumer already writes every order.
      - Look it up by its id.
