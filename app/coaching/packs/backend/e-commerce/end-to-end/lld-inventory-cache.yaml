# E-commerce interview, low-level design: the inventory cache, and finishing. As in the video's last minutes: the order side drawn again with the lock, inventory and Kafka from before; a Redis cache in front of the inventory DB, the stale-cache problem, write-through or CDC to fix it, the inventory DB feeding the product DB's qty by CDC, and the order status service reading the order DB. Corrected: the sale is decided by the database and the lock, never by the cache.
id: backend/e-commerce/end-to-end/lld-inventory-cache
title: "Low-level design: the inventory cache, and finishing"
source:
  hash: "7b1610e3b03c"
review:
