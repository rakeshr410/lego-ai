context:
  after: backend/e-commerce/end-to-end/lld-limited-stock
  assumes:
    - "Checkout takes a Redis lock per product, checks stock with the inventory service, pays, and publishes one event to Kafka."
    - "Order, inventory and notification consumers apply the event; the inventory DB is the only source of truth."
  carries:
    - "A Redis cache in front of the inventory DB absorbs the stock reads; write-through or CDC keeps it fresh, and the sale is still decided in the DB."
    - "The product DB's qty, shown to shoppers, is copied from the inventory DB by CDC."
    - "The order status service reads the order DB by orderId; then the non-functional list is read back against the board."
  terms:
    - term: write-through
      means: The writer updates the database and the cache together, so the cache never lags a write it made.
    - term: single point of failure
      means: One component whose failure stops the whole system.
