beats:
  - point: "The order side so far: checkout takes the lock, checks stock, pays and records the payment; every order reads the one inventory DB, a hot spot and a single point of failure."
    kind: failure
    weight: core
    teach:
      - "Every requirement is met; now make it resilient. Here is the order side: checkout takes the Redis lock, asks the inventory service, pays through the payment service, which records the payment."
      - "Look at the inventory DB, the backbone of the shop. All 10 orders a second, far more in a sale, read it. Too many hits on one database, and if it goes down nobody can check stock: a single point of failure."
    draw: [lld-final, f-lock, f-checkout, f-ck-lock, f-inventory, f-ck-inv, f-inventorydb, f-inv-db, f-payment, f-ck-pay, f-paymentdb, f-pay-db, f-hot]
    check: Why is the inventory DB a single point of failure?
    answer: Every order's stock check reads it, so if it is overloaded or down no order can go through.
  - point: "After payment, checkout publishes the event to Kafka, and the inventory consumer, the order consumer and the notification service apply it, as designed before."
    kind: flow
    weight: supporting
    teach:
      - "And from before: checkout publishes one event to Kafka, the inventory consumer reduces the stock, the order consumer writes the order DB, and the notification service tells the shopper."
    draw: [f-kafka, f-ck-kafka, f-inv-cons, f-k-inv, f-ic-db, f-order-cons, f-k-order, f-orderdb, f-oc-db, f-notify, f-k-notify]
    check: Which consumer reduces the stock after a sale?
    answer: The inventory consumer, through the inventory service, idempotent by order id.
  - point: "Put a Redis cache in front of the inventory DB: the inventory service reads stock from the cache first and goes to the database only on a miss."
    kind: mechanism
    weight: core
    teach:
      - "Add a caching layer, a Redis cache in front of the inventory DB. The inventory service checks the cache first for how many are left and goes to the database only on a miss."
      - "Most stock reads now come from memory, and the database sees far fewer calls. Run the database with replicas too, so losing one machine does not stop the shop."
    draw: [f-cache, f-inv-cache]
    check: How does the cache take load off the inventory DB?
    answer: Stock reads are answered from Redis first; only misses reach the database.
  - point: "The cache can go stale: one iPhone is cached as 1, it sells, the database says 0 and the cache still says 1. So the cache serves reads; the sale is decided in the database and the lock."
    kind: failure
    weight: core
    teach:
      - "But now there are two copies. One iPhone, cached as 1. It sells, the inventory consumer sets the database to 0, and the cache still says 1. Not consistent."
      - "So use the cache to show and pre-check stock, but let the database's conditional update and the lock decide the sale; a stale cache cannot fool those."
    draw: [f-stale, f-decide]
    check: The cache says one left, the database says zero. Can the shop sell it?
    answer: No; the sale is decided by the database's conditional update and the lock, which see zero.
    misconceptions:
      - "With the cache in place the checkout can trust it for the sale -> a cache may lag; the decision that must be right is made against the source of truth."
  - point: "Keep the cache fresh by write-through, the inventory service updating database and cache together, or by CDC from the database's change log."
    kind: mechanism
    weight: core
    teach:
      - "Two ways to keep it fresh. Write-through: whenever the inventory service changes the stock it updates the database and the cache together."
      - "Or CDC again: the inventory DB's change log updates the cache in near real time. Either keeps the window of staleness tiny."
    draw: [f-cdc-cache, f-fresh]
    check: What does write-through mean here?
    answer: The inventory service writes every stock change to both the database and the cache.
  - point: "The qty shown on the product page lives in the product DB and never changes as stock sells, so it is copied from the inventory DB by CDC."
    kind: mechanism
    weight: core
    teach:
      - "One more stale copy: the qty field in the product DB, which the product page shows. Sales change the inventory DB, not Mongo."
      - "Feed it by CDC from the inventory DB, or a cron job or a Kafka consumer, so the shopper sees a count seconds behind the truth, sold or returned."
    draw: [f-productdb, f-cdc-product, f-qty]
    check: Which store is the truth for stock, and which shows it to shoppers?
    answer: The inventory DB is the truth; the product DB holds a copy for display, refreshed by CDC.
  - point: "The order status service looks the order up by orderId in the order DB and returns its status."
    kind: flow
    weight: supporting
    teach:
      - "Last service, the simplest: order status. It finds the order by its id in the order DB and returns the status."
    draw: [f-status, f-status-db, f-status-note]
    check: Where does the order status service read from?
    answer: The order DB, by order id.
  - point: "Read the non-functional list back: services scaled on their own for scale, Elasticsearch and the CDN for available, 200 ms search, one source of truth, a lock and one event per order for consistency."
    kind: rule
    weight: core
    teach:
      - "Close by reading the requirements on the right against the board. Scale: services behind the gateway, each scaled on its own. Availability and latency for search: Elasticsearch and the CDN, inside 200 milliseconds."
      - "Consistency for money and stock: one source of truth for stock, a lock or atomic reservation per product, and one event per checkout that every consumer applies once."
    draw: [f-back-1, f-back-2]
    check: Which parts of the design give consistency for payment and stock?
    answer: The inventory DB as the one source of truth, the lock or atomic reservation per product, and one Kafka event per checkout applied idempotently.
