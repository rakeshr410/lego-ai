beats:
  - point: "The user service stores simple account rows that must be right, so MySQL: name, email, password hash, mobile, addresses; login returns a JWT the gateway checks on every later call."
    kind: decision
    weight: core
    teach:
      - "Step five, the low-level design. Copy the picture down and open one service at a time, starting where a shopper starts: the user service."
      - "The data is simple and must be consistent, so MySQL. A user has a name, an email, a password, stored as a salted hash, a mobile and a list of delivery addresses."
      - "On login it checks the credentials and returns a JWT. Every later call carries it, and the gateway checks it before routing."
    draw: [lld1, l1-users, l1-gw, l1-users-gw, l1-user, l1-gw-user, l1-userdb, l1-user-db, notes1, n1-user, n1-jwt]
    check: Who checks the JWT on a call to, say, the cart service?
    answer: The API gateway, before it routes the request; the user service only issues it at login.
  - point: "Searching the product database directly means a scan per search, and an index on the title only helps exact or prefix matches, not keywords, typos or ranking."
    kind: failure
    weight: core
    teach:
      - "Next, search, which must be highly available and answer in about 200 milliseconds. Today the search service queries the product DB, and the product service writes it."
      - "Without help, every search scans every product, top to bottom. An index on the title helps an exact or prefix match, but shoppers type words in any order, misspelled, and want the best match first. A normal index cannot do that."
    draw: [l1-search, l1-gw-search, l1-product, l1-gw-product, l1-productdb, l1-product-db, n1-scan, n1-index]
    check: Why doesn't an index on the title fix search?
    answer: It helps exact or prefix matches only, not keywords anywhere in the text, typos or ranking by relevance.
    misconceptions:
      - "An index makes the database scan the whole table anyway -> an index is a direct look-up; it just answers the wrong question for keyword search."
  - point: "The search service queries Elasticsearch instead: an inverted index from each word to the products containing it, built for keyword search with ranking."
    kind: mechanism
    weight: core
    teach:
      - "So bring in a search engine, Elasticsearch, and point the search service at it instead of the database."
      - "It keeps an inverted index, a map from every word to the products containing it, so a keyword search is a look-up, ranked by relevance, typos tolerated."
    draw: [l1-es, l1-search-es, n1-es]
    check: What structure lets Elasticsearch answer keyword searches fast?
    answer: An inverted index, from each word to the documents that contain it.
  - point: "Elasticsearch is kept in step with the product DB by change data capture: a connector reads the database's change log and streams each change through Kafka to the index."
    kind: mechanism
    weight: core
    teach:
      - "New problem: how does Elasticsearch see new products, price changes, stock? The product DB is the source."
      - "Use a CDC pipeline. A connector captures every change in the product DB's log and pushes it to Kafka, and from Kafka it is applied to Elasticsearch, within seconds. Search can be a moment stale, which availability allows."
    draw: [l1-cdc, n1-cdc]
    check: Why use CDC rather than having the product service write to both stores?
    answer: Two writes can half-fail and drift; CDC copies whatever the database committed, from its log, so the index follows the truth.
  - point: "The product DB is MongoDB, a document per product, because a phone, a shirt and a book carry different fields: productId, name, description, category, qty, price, currency, image URLs."
    kind: decision
    weight: core
    teach:
      - "Which database for products? A phone, a shirt and a book have different details, so a document database, MongoDB: each product a JSON document with whatever fields its category needs."
      - "Every product has a product id, name, description, category, quantity, price, currency, and the URLs of its images. Speed of search comes from Elasticsearch, not from Mongo."
    draw: [n1-mongo, n1-product-1, n1-product-2]
    check: Why a document database for products?
    answer: Products of different categories have different fields, and a document per product holds them without a fixed schema.
  - point: "Images go to an S3 bucket, with only their URLs in the product document, and S3 is replicated to a CDN so the browser loads them from nearby."
    kind: mechanism
    weight: core
    teach:
      - "Images: say 2 MB each and seven or eight per product. Millions of those in the database is far too much data. Put them in an S3 bucket and keep only their URLs in the product."
      - "Better, replicate S3 to a CDN. Search returns the CDN URLs, and the browser loads each image straight from the copy nearest the shopper, so the page renders fast."
    draw: [l1-s3, l1-product-s3, l1-cdn, l1-s3-cdn, l1-users-cdn, n1-s3, n1-cdn]
    check: When a search result shows ten products, where do their images come from?
    answer: The browser fetches them from the CDN using the URLs in the results; the services never carry the image bytes.
asks:
  - ids: [l1-es]
    beats: [3]
    question: "Scanning the product DB is too slow and an index doesn't help keywords. What would you put the search service on instead?"
    hints:
      - Think of a system built only for searching text.
      - It maps words to the products that contain them.
  - ids: [n1-cdc]
    beats: [4]
    question: "Now Elasticsearch has to see every product change. How would you keep it in step with the product DB?"
    hints:
      - The database already logs every change it makes.
      - Something could read that log and stream it on.
  - ids: [n1-mongo]
    beats: [5]
    question: "What kind of database would you choose for the products, and why?"
    hints:
      - Does a shirt have the same details as a phone?
      - Which kind of database doesn't force one schema on every row?
  - ids: [l1-s3, l1-cdn]
    beats: [6]
    question: "Every product has seven or eight 2 MB images. Where would you keep them, and how do they reach the shopper fast?"
    hints:
      - Large files rarely belong in the database.
      - Static files can be copied close to the user.
