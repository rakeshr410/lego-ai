# E-commerce interview, low-level design: users and search. Under "5. Low Level Design", the high-level picture copied and grown as in the video: the user DB as MySQL with its fields, Elasticsearch beside the search service, CDC from the product DB (MongoDB) to Elasticsearch, S3 for images replicated to a CDN the users load them from; the stores' fields and decisions written to the right. The video's "an index still has to scan" is corrected: a title index can't do keyword search, an inverted index can.
