  after: backend/e-commerce/end-to-end/high-level-design
  assumes:
    - "One microservice per requirement behind a load balancer and API gateway, each with its database."
    - "Non-functional: search highly available and about 200 ms."
  carries:
    - "User service on MySQL (name, email, password hash, mobile, addresses); login returns a JWT the gateway checks."
    - "Search queries Elasticsearch, an inverted index, fed from the product DB by CDC through Kafka."
    - "Product DB is MongoDB for flexible fields per category; images in S3, URLs in the product, served from a CDN."
  terms:
    - term: JWT
      means: A signed token the user service issues at login; the gateway checks it on each later call.
    - term: inverted index
      means: A map from each word to the products containing it, what a search engine answers keyword queries from.
    - term: change data capture
      means: "A connector reads a database's change log and streams each change, here through Kafka, to a copy such as a search index."
    - term: CDN
      means: A content delivery network, copies of static files at locations near the users.
