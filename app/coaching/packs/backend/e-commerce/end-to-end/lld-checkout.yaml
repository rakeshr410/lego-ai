    - "Checkout calls a payment service, which calls a third-party payment gateway and records each payment."
    - "Non-functional: payment, orders and inventory strongly consistent."
  carries:
    - "An inventory service owns a Postgres inventory DB indexed on productId, the only source of truth for stock; checkout checks stock before payment."
