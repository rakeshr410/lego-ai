  terms:
    - term: source of truth
      means: The one store whose value wins when copies disagree.
    - term: idempotent
      means: Applying the same event twice has the same effect as applying it once.
    - term: outbox
      means: "A table written in the same transaction as the change, from which the event is relayed to Kafka."
