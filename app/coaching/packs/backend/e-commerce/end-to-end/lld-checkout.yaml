beats:
  - point: "Before payment, checkout asks an inventory service whether every item is in stock; its inventory DB is Postgres, indexed on productId, the only source of truth for stock, written only by the inventory service."
    kind: component
    weight: core
    teach:
      - "Now the most critical service, checkout. Before taking money, check the stock: three iPhones added to the cart yesterday may not all be there today."
      - "Add an inventory service and an inventory DB: each product and how many are left. It must be strongly consistent and the only source of truth, so Postgres, indexed on product id, and only the inventory service writes to it."
      - "Checkout asks it about every item; if something is short, the shopper is told before paying."
    draw: [lld-checkout, k-checkout, k-inventory, k-check, k-inventorydb, k-inv-db, k-truth]
    check: Why must only the inventory service write to the inventory DB?
    answer: So there is one source of truth for stock and one place that enforces its rules; other services ask it.
  - point: "With stock confirmed, checkout calls the payment service, which takes the payment details and calls the third-party payment gateway."
    kind: flow
    weight: supporting
    teach:
      - "Green light from inventory, so make the payment: checkout calls the payment service, the shopper enters the card details, and the payment service calls the payment gateway to confirm."
    draw: [k-payment, k-pay, k-pg, k-pay-pg, k-paymentdb]
    check: What does checkout do if an item is out of stock?
    answer: It stops before payment and tells the shopper the quantity is not available.
  - point: "After payment three writes are needed, payment record, stock reduction, order: done as three separate calls they can half-fail, taking money with no order or leaving stock unreduced."
    kind: failure
    weight: core
    teach:
      - "After payment, three things: first save the payment, paid or failed, in the payment DB; second reduce the stock; third write the order and its status. I'm drawing them from the payment service to show the flow; really they belong to checkout."
      - "Three calls, three databases, no shared transaction. The payment succeeds and the stock update fails, or the order write fails: money taken, no order. Not consistent, and not safe to retry."
    draw: [k-orderdb, k-step-1, k-step-2, k-step-3, k-flaw-1, k-flaw-2]
    check: What goes wrong if the order write fails after the payment succeeded?
    answer: The shopper has paid but has no order; three separate writes cannot be rolled back together.
  - point: "Replace the three calls with one event: the payment service records the payment and answers checkout, which publishes the cart and payment status to Kafka."
    kind: mechanism
    weight: core
    teach:
      - "Fix it with one event. The payment service still records the payment in its DB and answers the checkout service."
      - "Checkout then publishes a single event to Kafka: the cart and the payment status, success or failure. Nothing else is called directly."
    draw: [e-head, e-checkout, e-kafka, e-publish, e-payment, e-pay, e-paymentdb, e-pay-db]
    check: What does checkout do after the payment answers, in this version?
    answer: It publishes one event with the cart and the payment status to Kafka.
  - point: "Consumers each do one job from the event: an order consumer writes the order DB, an inventory consumer reduces the stock, a notification service tells the shopper."
    kind: flow
    weight: core
    teach:
      - "Now consumers read the topic. An order consumer writes the order and its status to the order DB. An inventory consumer reduces the stock, through the inventory service."
      - "And one more: a notification service tells the shopper whether the order went through. Kafka keeps the event until each has processed it, so one being down only delays it."
    draw: [e-order, e-k-order, e-inventory, e-k-inventory, e-notify, e-k-notify, e-orderdb, e-order-db, e-inventorydb, e-inventory-db]
    check: The inventory consumer is down for a minute. What happens to the stock update?
    answer: The event waits in Kafka and the consumer applies it when it comes back.
  - point: "The order DB is MySQL: orderId, userId, items with the product, quantity, price at purchase and currency, the total, the paymentId and the status."
    kind: decision
    weight: supporting
    teach:
      - "The order DB must be consistent, so MySQL. An order has its id, the user, the items, each a product id, quantity, the price at the time of purchase and currency, then the total, the payment id and the status."
    draw: [e-schema-1, e-schema-2]
    check: Why store the price inside the order but not inside the cart?
    answer: The order records what was actually paid at purchase; the cart must show the current price.
  - point: "Kafka delivers at least once, so each consumer is idempotent by orderId; and an outbox written with the payment makes sure the event itself is never lost."
    kind: rule
    weight: core
    teach:
      - "Two details make it really reliable. Kafka may deliver an event twice, so each consumer is idempotent: keyed by order id, a repeat changes nothing."
      - "And the event must not be lost between saving and publishing: write it to an outbox table in the same transaction, and relay it to Kafka. The three stores then agree within seconds, eventually consistent, instead of never."
    draw: [e-once, e-outbox]
    check: Kafka delivers the same event twice. Why is the stock not reduced twice?
    answer: The consumer is idempotent, keyed by order id, so applying the event again changes nothing.
    misconceptions:
      - "Kafka is highly available, so every event is processed exactly once -> it delivers at least once; idempotent consumers make the effect happen once."
asks:
  - ids: [k-inventory]
    beats: [1]
    question: "Before taking the money, what should checkout make sure of, and who would it ask?"
    hints:
      - The cart may be days old.
      - Something should own how many of each product are left.
  - ids: [k-flaw-1]
    beats: [3]
    question: "After payment, the payment service saves the payment, reduces the stock and writes the order, three calls. What could go wrong?"
    hints:
      - What if the second or third call fails?
      - Can three databases roll back together?
  - ids: [e-kafka]
    beats: [4]
    question: "How could we replace those three calls so none of them is lost?"
    hints:
      - Publish once, and let others react.
      - Something durable that holds the event until everyone has it.
  - ids: [e-order, e-inventory, e-notify]
    beats: [5]
    question: "Who should read that event, and what does each one do?"
    hints:
      - Think of the three writes we just removed.
      - And who tells the shopper?
