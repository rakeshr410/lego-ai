# E-commerce interview, low-level design: the checkout. Under the cart, as in the video: the inventory service and its Postgres inventory DB beside checkout ("check the stock before checkout"), payment and the payment gateway under checkout, then the payment service's three writes numbered 1, 2, 3. The video then erases two of them and adds Kafka; packs cannot erase, so the Kafka version is drawn under the first in the same region, with its consumers (order, inventory, notification) and the order DB's fields. Added to the video: at-least-once delivery, idempotent consumers, an outbox.
