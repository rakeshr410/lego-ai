beats:
  - point: "An e-commerce platform like Amazon or Flipkart is an online shop where people buy mobiles, laptops, books, apparel and shoes."
    kind: rule
    weight: core
    teach:
      - "Write the title: an e-commerce platform like Amazon or Flipkart. Under it, one line on what it is: an online shop where people buy mobiles, laptops, cameras, books, apparel, shoes."
      - "Writing it down lets the interviewer correct you before you design the wrong thing."
    draw: [title, prompt-desc]
    check: In one sentence, what does this platform let people do?
    answer: Buy goods online, from search to payment, mobiles, laptops, books, apparel and so on.
  - point: "Amazon is many systems, so agree the scope first: the shopper's flow, not the warehouse and inventory back office."
    kind: decision
    weight: core
    teach:
      - "Amazon is huge: there is the shopper's side and there is the warehouse and inventory side. Ask which one the interviewer wants."
      - "Here it is the shopper's flow, search to order status, plus the one back-office problem the shopper feels, buying items in limited stock."
    draw: [prompt-scope]
    check: Why ask about the scope before the requirements?
    answer: Because an application that size has many systems; agreeing which one keeps the hour on the part the interviewer wants.
  - point: "The interview runs in five steps: gather the requirements, identify the core entities, write the API, draw the high-level design, then the low-level design."
    kind: rule
    weight: core
    teach:
      - "Say the plan once: requirements, functional and non-functional, then the core entities, then the API, then a high-level design, and last the low-level design, where most of the time goes."
      - Said, not written; each step gets its number on the board when we reach it.
    check: Which step comes after the API?
    answer: The high-level design, then the low-level design.
