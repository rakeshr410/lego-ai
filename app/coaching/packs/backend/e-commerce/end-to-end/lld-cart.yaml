beats:
  - point: "The cart must be right, so it lives in Postgres: a cart id, the user id, and a list of products, each a product id and a quantity."
    kind: decision
    weight: core
    teach:
      - "Next, the cart service. The flow is simple: the shopper picks a quantity and saves the item in the cart."
      - "We want it consistent, so a relational database, Postgres. A cart has a cart id, the user id and a list of products, each a product id and a quantity: one iPhone is the iPhone's id and quantity one."
    draw: [lld-cart, c-cart, c-cartdb, c-cart-db, c-schema-1, c-schema-2]
    check: What does one line of a cart hold?
    answer: A product id and a quantity.
  - point: "The price is not stored in the cart: prices change while items sit there, so the cart service reads the current price from the product DB every time the cart is shown."
    kind: decision
    weight: core
    teach:
      - "Notice what is missing: the price. An iPhone added at one lakh may cost less or more ten days later."
      - "So each time the shopper views the cart, the cart service asks the product DB for the current prices and totals the cart from them."
    draw: [c-productdb, c-cart-price, c-fresh]
    check: Where does the price shown in the cart come from?
    answer: The product DB, read fresh each time the cart is shown; the cart itself stores no price.
    misconceptions:
      - "Store the price in the cart so it is fast -> it goes stale; the shopper must see what they will actually pay."
asks:
  - ids: [c-cartdb]
    beats: [1]
    question: "Where would you keep the carts, and what goes in one?"
    hints:
      - The cart should be consistent.
      - A cart belongs to a user and holds products with quantities.
  - ids: [c-fresh]
    beats: [2]
    question: "Should the cart store each item's price? Why or why not?"
    hints:
      - An item can sit in a cart for days.
      - Where is the current price kept?
