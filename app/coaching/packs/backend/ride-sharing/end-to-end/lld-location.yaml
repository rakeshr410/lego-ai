# Ride-sharing interview, low-level design, live locations: the video's picture at this stage, redrawn: riders and drivers, the API gateway, the notification service and a WebSocket gateway (authentication, session stickiness) under it, the location update service as the WebSocket server, Redis of active drivers between it and the drivers database, ZooKeeper under driver matching, and the loop notes (every 5 to 10 s, top five, 10 s timeout). Corrected here: HTTP is request-response, not one-way, and a WebSocket cuts the cost of each update, not the number of updates.
id: backend/ride-sharing/end-to-end/lld-location
title: "Low-level design: live locations"
source:
  hash: "4357834586ed"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ride-sharing/end-to-end/lld-matching
  assumes:
    - "Matching finds nearby idle drivers by geohash proximity search over the drivers database."
    - "A matching server locks a driver with an ephemeral ZooKeeper znode before offering, and releases it on deny or timeout."
  carries:
    - "Drivers and riders send their location every 5 to 10 seconds over WebSockets, through a dedicated WebSocket gateway with sticky sessions, to the location update service."
    - "Only active drivers' locations go into a Redis cache, a geo index that matching queries instead of the database."
    - "Matching walks the top K = 5 nearest drivers: lock, notify, wait up to 10 s, release on deny or timeout; on accept it sends both sides the details over their sockets."
  terms:
    - term: WebSocket
      means: "One connection, upgraded from HTTP, that carries small messages both ways for as long as it is open."
    - term: sticky session
      means: A client's connection stays on the same server for its whole life.
    - term: top K
      means: "Only the K nearest free drivers are tried, here 5, so the search fits the time limit."
