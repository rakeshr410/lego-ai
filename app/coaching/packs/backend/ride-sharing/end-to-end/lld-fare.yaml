# Ride-sharing interview, low-level design, the fare: under "5. Low level (deep dive) designing", the ride service opened as the video does: the map service above it, the rate database with the bike and car rates beside it, and the ride request database read by a surge calculator service up and to the right. Corrected here: surge weighs demand against free drivers, not demand alone.
