beats:
  - point: "The low-level design starts from the high-level picture and opens the ride service first: it asks the map service for the route distance and the ETA."
    kind: mechanism
    weight: core
    teach:
      - "Step five, the deep dive. We copy the high-level design down and open each service, starting with the ride service."
      - "When a rider asks for a fare, the ride service asks Google Maps for the route between the two points: it returns the distance and the ETA."
    draw: [lld-fare, f-ride, f-maps, f-ride-maps]
    check: Which service does the deep dive open first, and what does it ask the map for?
    answer: The ride service; it asks for the route distance and the ETA.
  - point: "A rate database holds rates per vehicle type, a bike at Rs 20 per km and Rs 1 per waiting minute, a car at Rs 60 per km; distance and time times the rates gives the base fare for each type."
    kind: mechanism
    weight: core
    teach:
      - "The rates are configured, not hard-coded: a rate database with a row per vehicle type. A bike at 20 rupees per kilometre and 1 rupee per waiting minute; a car at 60 rupees per kilometre."
      - "The ride service multiplies the map's distance and time by each type's rates: that is the base fare, one per vehicle type, each with its request ID. A six kilometre bike trip is 120 rupees."
    draw: [f-rates, f-ride-rates, f-rate-bike, f-rate-car, f-base]
    check: "With the rates on the board, what is the base fare for a car over 6 km, ignoring waiting?"
    answer: "6 times Rs 60, which is Rs 360."
  - point: "Surge: every fare request is saved in a ride request database; a surge calculator service reads it and returns a multiplier such as 1.3, 1.5 or 2 that the ride service applies to the base fare."
    kind: mechanism
    weight: core
    teach:
      - "A fixed rate is not the whole story: when many people want rides from one area, the price goes up. Save every fare request in a ride request database; we do not need it to answer, but it is the demand signal, and good for analytics."
      - "A surge calculator service reads it and hands the ride service a multiplier, 1.3, 1.5, 2. The ride service multiplies the base fare and returns the result to the rider."
    draw: [f-requests, f-ride-requests, f-surge, f-surge-requests, f-ride-surge, f-multiplier]
    check: Why save fare requests that were never booked?
    answer: They are the demand signal the surge calculator reads, and useful for analytics.
  - point: "A good surge multiplier weighs demand against the free drivers nearby: many requests with plenty of drivers should not push the price up much."
    kind: decision
    weight: supporting
    teach:
      - "One refinement on the video's version, which counts requests alone: surge exists to balance riders and drivers, so it should weigh demand against the free drivers in that area. Many requests and few drivers, the price rises; many requests and plenty of drivers, it hardly should."
    draw: [f-supply]
    check: Demand doubles in an area that also has twice as many free drivers. Should surge rise much?
    answer: No; supply kept up with demand, and surge weighs one against the other.
    misconceptions:
      - "Surge depends only on how many requests come in -> it depends on demand relative to available drivers."
asks:
  - ids: [f-rates]
    beats: [2]
    question: "The map gives us a distance and a time. How would the ride service turn those into a price for a bike and a car?"
    hints:
      - Each vehicle type has its own price per kilometre.
      - Where would those prices live so they can change without a deploy?
  - ids: [f-surge]
    beats: [3]
    question: "At rush hour the price goes up. What would you add to work out how much?"
    hints:
      - You need some record of how many people are asking for rides.
      - Then something that turns that into a multiplier.
