# Ride-sharing interview, API: "3. API designing" beside the entities, the rider's five endpoints under "User", then the driver's four under "Driver", the location as a WebSocket, as in the video.
id: backend/ride-sharing/end-to-end/api
title: Rider endpoints, then driver endpoints
source:
  hash: "a3d3ac452132"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ride-sharing/end-to-end/entities
  assumes:
    - "Functional: fare estimate, request, categories, accept or decline, matching, tracking, ratings, payment."
    - "The core entities are the rider, the driver, the location, the fare and the ride."
  carries:
    - "GET /v1/api/fare with pick-up and drop latitude and longitude returns a list of fares, each with a requestId, vehicle type and estimate."
    - "POST /v1/api/rides/request with the requestId books; it returns the rideId and driver once a driver accepts."
    - "Rider also has history, cancel and ratings; the driver streams location over a WebSocket, accepts or denies, starts and ends the ride."
  terms:
    - term: requestId
      means: The ID of one fare quote; the rider books by it, so the booking carries the price they saw.
    - term: WebSocket
      means: One long-lived connection that carries messages both ways.
