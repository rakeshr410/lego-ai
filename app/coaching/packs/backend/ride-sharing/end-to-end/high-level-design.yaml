# Ride-sharing interview, high-level design: "4. High level designing" under the API, as in the video: riders and drivers on the left, one tall load balancer and API gateway with its four roles, a column of services (ride, driver matching, rating, payment, location update) with the location map service above and their databases on the right, and the notification service under the gateway.
id: backend/ride-sharing/end-to-end/high-level-design
title: One gateway, a column of services
