beats:
  - point: "At millions of users this is a set of services behind a load balancer and API gateway, which authenticates and authorizes, rate limits, routes, and spreads traffic round robin."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. On the left the two kinds of client, riders and drivers, on their phones."
      - "Millions of them means services, so everything enters through a load balancer and an API gateway: authentication and authorization, rate limiting, routing to the right service, and spreading traffic evenly, round robin."
    draw: [hld, h-riders, h-drivers, h-gateway, h-riders-gw, h-drivers-gw, h-roles-1, h-roles-2]
    check: Name two jobs of the API gateway here.
    answer: "Any two of: authentication and authorization, rate limiting, routing, distributing traffic round robin."
  - point: "The ride service calculates the fare: it asks a third-party map service, Google Maps or Apple Maps, for the distance and the ETA between the two points."
    kind: flow
    weight: core
    teach:
      - "The first requirement is the fare, so a ride service that does the fare calculation from the pick-up and drop latitude and longitude."
      - "Roads and traffic are a map provider's job: it calls a location map service, Google Maps or Apple Maps, which returns the distance and the time. How it becomes money is for the deep dive."
    draw: [h-ride, h-gw-ride, h-maps, h-ride-maps]
    check: What two numbers does the map service give the ride service?
    answer: The route distance between the two points and the ETA, the time it takes.
  - point: "On booking, the driver matching service finds nearby drivers in the drivers database, offers the ride through the notification service, FCM or APNs, and on an accept saves the ride in the ride database."
    kind: flow
    weight: core
    teach:
      - "When the rider accepts a fare, the booking goes to the core: a driver matching service. It looks in a drivers database for drivers near the pick-up."
      - "It offers the ride through a notification service, FCM on Android, APNs on iOS. The driver's accept comes back through the gateway, the request becomes a ride in a ride database, and the rider is told a driver is on the way."
    draw: [h-matching, h-gw-matching, h-drivers-db, h-matching-drivers, h-notify, h-fcm, h-matching-notify, h-notify-drivers, h-ride-db, h-matching-ride]
    check: Walk me through what happens after the rider books.
    answer: Matching finds nearby drivers in the drivers database, notifies them through the notification service, and when one accepts it saves the ride in the ride database and tells the rider.
  - point: "After the trip, a rating service with its rating database and a payment service with its payment database."
    kind: component
    weight: supporting
    teach:
      - "Once the trip ends, two more things: a rating service, with a rating database, so riders and drivers rate each other and future riders see a driver's rating."
      - "And a payment service, with its payment database, that takes the rider's payment."
    draw: [h-rating, h-gw-rating, h-rating-db, h-rating-db-arrow, h-payment, h-gw-payment, h-payment-db, h-payment-db-arrow]
    check: Which two services serve the end of the trip?
    answer: The rating service and the payment service, each with its own database.
  - point: "Real-time tracking needs a location update service that takes positions from drivers and riders and updates the drivers database, so matching sees where drivers are."
    kind: component
    weight: core
    teach:
      - "One requirement is still missing: real-time tracking. A location update service takes positions from drivers and riders periodically."
      - "It updates the location in the drivers database, so the matching service can find drivers where they are now."
    draw: [h-location, h-gw-location, h-location-drivers]
    check: Why does the location update service write to the drivers database?
    answer: So the matching service searches drivers by where they are now.
  - point: "This meets every functional requirement, but matching cannot scan millions of drivers per request, and that is where the low-level design goes."
    kind: failure
    weight: supporting
    teach:
      - "Every functional line now has a box. But it is not as simple as it looks: with millions of drivers, matching cannot scan the whole drivers table for each request. Write that down; the deep dive starts from it."
    draw: [h-gap]
    check: What is the obvious weak spot in this design?
    answer: Matching would scan millions of driver rows per request; it needs a proximity search and fresher locations.
asks:
  - ids: [h-ride, h-matching]
    beats: [2, 3]
    question: "Behind the gateway, what services would you need for the fare and for booking? Name them and I'll draw them."
    hints:
      - One works out the price, the other finds someone to drive.
      - Where would the drivers' details live?
  - ids: [h-location]
    beats: [5]
    question: "We still have real-time tracking to cover. What would keep the drivers' positions up to date?"
    hints:
      - Something has to take a position from every driver, often.
      - Where should those positions end up for matching to read?
task:
  prompt: "Draw the high-level design: riders and drivers, the load balancer and API gateway, the ride service with the map service, driver matching with the drivers and ride databases and the notification service, rating and payment with their databases, and the location update service."
  expects: [1, 2, 3, 5]
