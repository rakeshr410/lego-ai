context:
  after: backend/ride-sharing/end-to-end/api
  assumes:
    - "The rider gets fares by GET and books by POST with a requestId; the driver streams location over a WebSocket and accepts or denies."
    - "Non-functional: millions of users, strong consistency in matching, a driver within 1 minute."
  carries:
    - "Riders and drivers reach a load balancer and API gateway: authentication and authorization, rate limiting, routing, round robin."
    - "Ride service calculates the fare from a map service's distance and ETA; driver matching finds nearby drivers in the drivers database, offers through the notification service and saves the ride."
    - "Rating and payment services each have a database; a location update service writes driver locations into the drivers database."
  terms:
    - term: API gateway
      means: "The single entry for clients: authenticates, rate limits and routes each call to its service."
    - term: FCM and APNs
      means: "Firebase Cloud Messaging for Android and Apple Push Notification service for iOS, which deliver push notifications."
