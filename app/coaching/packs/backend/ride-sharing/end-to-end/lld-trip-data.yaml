# Ride-sharing interview, low-level design, the trip's data: the right side of the video's final board, redrawn: the gateway with the rating and payment services and driver matching in a column, their databases with the rating, estimated fare and ride tables written beside them, the location update service feeding a Kafka queue and a trip update consumer, and the rating aggregator that writes into the drivers database.
id: backend/ride-sharing/end-to-end/lld-trip-data
title: "Low-level design: ratings, payment, the trip's records"
source:
  hash: "49c8fe531061"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ride-sharing/end-to-end/lld-location
  assumes:
    - "Matching walks the top five drivers under a ZooKeeper lock and writes the ride database on an accept."
    - "The location update service receives every active driver's position over WebSockets."
  carries:
    - "Rating table in PostgreSQL: senderId, receiverId, rating, timestamp, rideId."
    - "Payment service calls a third-party payment gateway and writes a relational payment database, for ACID."
    - "Ride database: an estimated fare table written on booking, and a ride table (rideId is the requestId) with its status."
    - "Locations of drivers on a ride go to Kafka; a trip consumer records the route and status; a rating aggregator writes each driver's average into the driver row."
  terms:
    - term: ACID
      means: "Atomic, consistent, isolated, durable transactions; a charge is recorded exactly once, all or nothing."
    - term: Kafka
      means: A durable log of messages that consumers read at their own pace, publish and subscribe.
    - term: aggregator job
      means: A periodic job that combines detailed rows into a summary stored elsewhere.
