# Ride-sharing interview, requirements: "1. Functional requirements" on the left and "Non-functional requirements" on the right, as the video lays them out; the CAP line split between rider and driver, and the one-minute match.
id: backend/ride-sharing/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "f7e2d27f53d9"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ride-sharing/end-to-end/problem-statement
  assumes:
    - "A ride-sharing service is an online platform where a rider requests and books rides from nearby drivers."
  carries:
    - "Functional: fare estimate; request a ride at that fare; choose a category; drivers accept or decline; match a nearby available driver; real-time tracking; mutual ratings; payment."
    - "Non-functional: millions of riders and drivers; availability over consistency for riders; strong consistency in matching; a driver assigned within 1 minute, else the request fails."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system (scale, consistency, latency), stated with a number and where it applies."
    - term: strong consistency
      means: Every reader sees the latest write; here, no two servers can believe the same driver is free.
