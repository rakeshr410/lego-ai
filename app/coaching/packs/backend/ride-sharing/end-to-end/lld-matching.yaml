context:
  after: backend/ride-sharing/end-to-end/lld-fare
  assumes:
    - "Driver matching finds nearby drivers in the drivers database and offers the ride through the notification service."
    - "Non-functional: strong consistency in matching, no driver assigned two rides at once."
  carries:
    - "Matching uses geohash proximity search to list free drivers within 5 to 10 km of the pick-up."
    - "Drivers database in PostgreSQL: a driver table (driverId, name, vehicleInfo, rating, mobileNum, status) and a location table (driverId or userId, latitude, longitude, modifiedTS)."
    - "Two matching servers can offer one driver two rides; a lock per driver prevents it."
    - "ZooKeeper lock: an ephemeral znode per driver under a persistent driver-lock znode; a second create fails with NodeExistsException; deleted on deny, timeout, or when the holder's session ends."
  terms:
    - term: geohash
      means: "A location written as a short string whose shared prefix means nearby cells, so a search reads a few cells instead of every driver."
    - term: znode
      means: "A node in ZooKeeper's tree; persistent ones stay until deleted, ephemeral ones go when their client's session ends."
    - term: lock
      means: A claim only one server can hold at a time; here, the right to offer a ride to one driver.
