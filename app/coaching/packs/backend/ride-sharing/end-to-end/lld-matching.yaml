# Ride-sharing interview, low-level design, driver matching: as the video draws it, the gateway on the left, the driver matching service with geohash proximity search, the ride and drivers databases on the right with the driver and location tables, the five nearby drivers under it and the notification service below; then, under it all, ZooKeeper's driver lock: a persistent znode with an ephemeral child per locked driver, and the lock rules written to its right. Corrected here: ephemeral znodes go when their session times out (heartbeats), and a persistent znode stays until explicitly deleted.
id: backend/ride-sharing/end-to-end/lld-matching
title: "Low-level design: matching, and the ZooKeeper lock"
source:
