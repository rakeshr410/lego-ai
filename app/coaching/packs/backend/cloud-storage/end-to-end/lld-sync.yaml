beats:
  - point: "A sync service consumes the file-changed events from Kafka and pushes each to the online devices that care, the owner's and the sharers': a fan-out."
    kind: mechanism
    weight: core
    teach:
      - "A file was uploaded on the laptop; the phone and the tablet must get it. A sync service consumes the events from Kafka."
      - "Push, or fan-out: for each event it notifies the connected devices interested in that file, the owner's other devices and the people it is shared with, through the gateway. Their apps then download the new version. The same fan-out idea as a news feed."
    draw: [lk-sync, lk-consume, lk-gw-sync, lk-sync-push]
    check: "Which devices does the sync service push a change to?"
    answer: "The online devices interested in that file: the owner's other devices and the users it is shared with."
  - point: "A device that missed the pushes pulls: its sync engine sends the versions in its local metadata index, and the sync service compares them with the metadata DB and answers with the files to download."
    kind: mechanism
    weight: core
    teach:
      - "Push only reaches devices that are online. So the app gets one more part, a sync engine. On start or refresh it pulls: it sends the sync service the versions in its local metadata index."
      - "The sync service asks the metadata service for the latest versions and answers with every file whose version differs; the device downloads those."
    draw: [lc-sync-engine, lk-sync-meta, lk-sync-pull]
    check: "A tablet was off all weekend. How does it catch up?"
    answer: "Its sync engine pulls: it sends its local versions, and the sync service answers with every file whose version in the metadata DB is newer."
    misconceptions:
      - "Kafka keeps the events, so an offline device just reads them later -> devices do not read Kafka; a device that missed pushes pulls by comparing versions with the metadata."
  - point: "Everything hangs on the metadata tables: folders, files with a current version, file versions, each version's chunk list, chunks with their S3 key and checksum, and permissions."
    kind: decision
    weight: core
    teach:
      - "Write the tables beside the metadata database. Folders, with a parent; null marks the root. Files, with their folder, owner, size and current version."
      - "File versions; each version's chunk list, by index; chunks, with the S3 object key and the checksum; and permissions: a resource, file or folder, a user and a role."
    draw: [lk-tables-head, lk-t-folders, lk-t-files, lk-t-files-2, lk-t-versions, lk-t-vchunks, lk-t-chunks, lk-t-perms]
    check: "Which table tells the sync service a device's copy is out of date?"
    answer: "The files table's current version, compared with the version the device sent; the file versions and version chunks tables say what to download."
  - point: "Sync runs after the upload, through Kafka, so other devices catch up a moment later: the eventual consistency agreed in the requirements."
    kind: rule
    weight: supporting
    teach:
      - "Read it back against the right-hand list: because the event goes through Kafka after the upload, the phone sees the photo a second or two later."
      - "That is the eventual consistency on sync we accepted, and the price of keeping uploads fast."
    check: "Why do the other devices see a new file a moment late, and is that a problem?"
    answer: "The change reaches them through Kafka after the upload; a few seconds of lag is the eventual consistency the requirements accepted."
asks:
  - ids: [lk-sync]
    beats: [1]
    question: "The file is saved and the event is in Kafka. What should read it, and how do the online devices hear about it?"
    hints:
      - "A service that consumes the events."
      - "It sends each change out to the devices that care."
  - ids: [lc-sync-engine]
    beats: [2]
    question: "A phone was offline and missed the pushes. How should it catch up when it comes back?"
    hints:
      - "The phone knows which versions it has."
      - "Who could compare them with the latest?"
