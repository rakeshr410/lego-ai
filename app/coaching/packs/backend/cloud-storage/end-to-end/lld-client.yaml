beats:
  - point: "The client is ours: a chunker splits a large file into chunks and an upload manager sends them; a small file skips the chunker and goes up whole."
    kind: component
    weight: core
    teach:
      - "Step five. Copy the high-level picture into the deep dive and open the client first, because here the app is ours."
      - "Drop a 16 MB file, or a 15 GB one, into Dropbox: it is not sent in one piece. A chunker splits it into chunks, like a streaming platform does with video, and an upload manager sends the chunks. A file smaller than one chunk goes up whole."
    draw: [lld-head, lc-client, lc-chunker, lc-upload-mgr]
    check: "Why does the app split a large file before uploading it?"
    answer: "A multi-gigabyte file cannot go up reliably in one request; small chunks use the bandwidth well and a failed one can be sent again alone."
  - point: "Before uploading, the app checks a local metadata index of what is already uploaded, with versions and chunk hashes: a duplicate is skipped, an edit shows what changed."
    kind: mechanism
    weight: core
    teach:
      - "When a file is dropped in, the app first asks: is this already uploaded, or an edited copy of something uploaded?"
      - "To answer it keeps a local metadata index, a small database on the device with every uploaded file's version and chunk hashes. It is also what keeps the devices in sync later."
    draw: [lc-index]
    check: "What is the local metadata index for?"
    answer: "It records what is already uploaded, with versions and chunk hashes, so the app skips duplicates, finds what changed in an edit, and can sync."
  - point: "Every call goes through the gateway; the user service keeps users in Postgres, flat relational data: id, email, password, created date and storage used."
    kind: decision
    weight: supporting
    teach:
      - "The app's calls still go through the gateway. Behind it, the user service, plain as ever: user data is flat and relational, so Postgres."
      - "The table: user id, email, password hash, created date, and one column the upload needs, the storage the user has used."
    draw: [lk-gateway, lk-client-gw, lk-user-svc, lk-gw-user, lk-users-db, lk-user-db, lk-users-1, lk-users-2]
    check: "Which column of the user table will the upload path need, and why?"
    answer: "The storage used, to check a new file against the user's quota."
asks:
  - ids: [lc-chunker, lc-upload-mgr]
    beats: [1]
    question: "A 15 GB file is dropped into the app. What parts would the app need to get it to the backend?"
