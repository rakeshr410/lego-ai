beats:
  - point: "A watcher in the app notices when a file is added or changed and hands it to the upload manager, which runs the same upload steps."
    kind: component
    weight: core
    teach:
      - "Days later the user edits the big file and saves it. Who notices? One more part of the app, a watcher, which sees every file added or changed in the synced folder."
      - "It hands the file to the upload manager, and the same steps run: init, chunk and hash, signed URLs, commit."
    draw: [lc-watcher]
    check: "What starts an upload when a user edits a file in the synced folder?"
    answer: "The watcher in the app notices the change and hands the file to the upload manager."
  - point: "Only the chunks whose hash changed are uploaded: the app compares the new chunk hashes with the ones in its local metadata index."
    kind: mechanism
    weight: core
    teach:
      - "The difference: the app compares each new chunk's hash with the hash in its local metadata index. One paragraph changed inside one 5 MB chunk, so only that chunk differs."
      - "Only that chunk is uploaded, through the same signed URL path. One 5 MB upload instead of 50 MB."
    draw: [lv-changed]
    check: "One paragraph of a 50 MB file changes inside one chunk. What is uploaded?"
    answer: "Only the chunk whose hash changed, 5 MB; the other nine are already there."
  - point: "At commit a new file version is saved whose chunk list names every chunk: the new one where it changed, the same chunk ids as before for the rest."
    kind: decision
    weight: supporting
    teach:
      - "At commit, a new file version. Its chunk list has all ten positions: the new chunk where the edit was, and the old chunk ids everywhere else."
      - "The video says the changed chunk becomes version 2 while the rest stay version 1; strictly, versions belong to the file, and unchanged chunks are reused by id."
    draw: [lv-version]
    check: "What does the new version's chunk list contain?"
    answer: "Every chunk of the file in order: the new chunk for the changed position and the same chunk ids as before for the others."
    misconceptions:
      - "Each chunk has its own version number -> the file has versions; each version lists chunk ids, and unchanged chunks are shared between versions."
asks:
  - ids: [lc-watcher]
    beats: [1]
    question: "The user edits a file already uploaded. How does the app even know it changed?"
    hints:
      - "Something in the app has to watch the folder."
      - "Then it hands the file to which part?"
  - ids: [lv-changed]
    beats: [2]
    question: "Only one paragraph of a 50 MB file changed. What should the app upload, and how does it know?"
    hints:
      - "The file is already in chunks with hashes."
      - "Compare with what the local metadata index holds."
