beats:
  - point: "The clients are the Drive apps on phones, laptops and tablets, and every API call goes through a load balancer and API gateway."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. On the left the clients: the iOS, Android and desktop apps. In this system they matter more than usual."
      - "With several services behind it, every request enters through a load balancer and an API gateway that spreads the traffic and routes each call."
    draw: [hld, hld-phone, hld-laptop, hld-tablet, hld-clients, hld-gateway, hld-phone-gw, hld-laptop-gw, hld-tablet-gw]
    check: "What does the gateway do for the apps?"
    answer: "It is the one entry point: it balances the load and routes each API call to the right service."
  - point: "Three services, one per job: user onboarding for sign-up and sign-in, a file uploader for the bytes, and a file metadata service for folders, renames and permissions."
    kind: component
    weight: core
    teach:
      - "First job, onboarding: a user onboarding service for sign-up and sign-in."
      - "Second, a file uploader service that takes files from the apps into the backend. Third, a file metadata service for every change that is only metadata: create a folder, rename, share."
    draw: [hld-user-svc, hld-gw-user, hld-uploader, hld-gw-uploader, hld-meta-svc, hld-gw-meta]
    check: "A user creates a folder. Which service handles it, and why that one?"
    answer: "The file metadata service, because a folder is only a metadata record."
  - point: "Each service has its own store: a user DB, blob storage such as S3 for file bytes, which are too big for a database, and a metadata DB for the records."
    kind: decision
    weight: core
    teach:
      - "The user service saves users in a user DB."
      - "File bytes can be gigabytes, so they do not go in a relational or NoSQL database: they go to blob storage, an S3 bucket. The metadata is small relational text, so a metadata DB."
    draw: [hld-user-db, hld-user-db-arrow, hld-blob, hld-blob-arrow, hld-meta-db, hld-meta-db-arrow]
    check: "Why do file bytes go to blob storage and not the metadata DB?"
    answer: "Files are gigabytes; object storage is built for large blobs, while the database keeps small records that are queried."
    misconceptions:
      - "Store the files in the database as blobs to keep everything in one place -> gigabyte files belong in object storage; the database keeps the small records about them."
  - point: "This meets every functional line on paper, but not how a 10 GB file is uploaded, how sharing works, or how other devices learn of a change; that is the deep dive."
    kind: rule
    weight: supporting
    teach:
      - "Say what the picture leaves open: a 10 or 15 GB file cannot go up in one request through this path; permissions and links are not designed yet; nothing tells the other devices."
      - "That is what the deep dive is for."
    check: "Name one thing this high-level design does not yet answer."
    answer: "How a 10 GB file gets uploaded, how sharing and permissions work, or how the other devices learn about a change."
