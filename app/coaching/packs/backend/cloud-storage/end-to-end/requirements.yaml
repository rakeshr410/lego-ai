# Cloud storage interview, requirements: "1. Functional requirements" on the left and "Non functional requirements" on the right, under the title, as the video lays them out; collaborative editing named as out of scope.
id: backend/cloud-storage/end-to-end/requirements
title: "Two lists, functional and non-functional"
source:
  hash: "4046a10a3e69"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/cloud-storage/end-to-end/problem-statement
  assumes:
    - "A cloud storage platform uploads, downloads, shares and syncs files across devices."
  carries:
    - "Functional: account; upload of any size, resumable, and download; sync to all devices; share with permission; folder create, delete, rename; a quota per user, 15 GB free."
    - "Non-functional: millions of users, billions of files; availability first for upload and sync, consistency for metadata; large files; low upload and sync latency; no data loss."
    - "Real-time collaborative editing is out of scope."
  terms:
    - term: "functional requirement"
      means: "What the system does."
    - term: "non-functional requirement"
      means: "A quality of the system, stated with a number or where it applies."
    - term: "eventual consistency"
      means: "Other devices see a change a moment later, but they get there."
