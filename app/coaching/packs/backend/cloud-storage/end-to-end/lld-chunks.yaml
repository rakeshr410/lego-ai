# Cloud storage interview, deep dive, steps 2 to 4 as the video writes them under step 1: the chunker cuts and hashes, the client asks for a signed URL per chunk, the uploader records the upload in Redis, and the chunks go straight to S3, three at a time; S3 and Redis added beside the uploader.
