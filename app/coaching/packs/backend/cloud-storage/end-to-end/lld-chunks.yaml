context:
  after: backend/cloud-storage/end-to-end/lld-initiate
  assumes:
    - "Init returns fileId, uploadId, a 5 MB chunkSize and existingChunks."
  carries:
    - "The chunker cuts the file at chunkSize (a 50 MB file is chunks 0 to 9) and computes a SHA-256 of each chunk."
    - "Per chunk the client sends uploadId, chunkId and chunkHash; the uploader validates them and signs a short-lived PUT URL itself."
    - "Redis holds the upload state with a TTL: uploadId, a bitmap of chunks received, the hashes, a retry count."
    - "The client PUTs chunks straight to S3, about three at a time."
  terms:
