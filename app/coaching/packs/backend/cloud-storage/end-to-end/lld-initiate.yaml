beats:
  - point: "The upload manager's first call goes to the uploader service: initiate, with the file name, its size and the folder it goes in."
    kind: flow
    weight: core
    teach:
      - "Now the heart of it, the upload, in numbered steps beside the drawing. Behind the gateway, the uploader service."
      - "Step one, initiate: the upload manager posts to upload init with the file name, video dot mp4, its size, 52,428,800 bytes, which is 50 MB, and the parent folder id."
    draw: [lk-uploader, lk-gw-uploader, s1, s1-post, s1-req-1, s1-req-2, s1-req-3]
    check: "What does the client send to start an upload?"
    answer: "The file name, the file size and the folder to put it in."
  - point: "The uploader checks the quota in the user DB, then answers with a file id, an upload id that ties the upload together, the chunk size, fixed at 5 MB, and the chunks already stored."
    kind: mechanism
    weight: core
    teach:
      - "First the quota: the uploader reads the storage used from the user DB. If the file does not fit in what is left, it answers with an error and nothing is uploaded. It checks again at commit, since two uploads can start at once."
      - "If it fits: a file id, a new upload id, the chunk size the backend chose, 5 MB, the same for every file, and existingChunks, empty because nothing is uploaded yet."
    draw: [lk-quota, s1-quota, s1-resp-1, s1-resp-2, s1-resp-3, s1-resp-4]
    check: "Why does the server, not the client, choose the chunk size?"
    answer: "So it is one fixed size for every file, which the later steps, and deduplication, rely on."
    misconceptions:
      - "Each file can pick its own chunk size -> the backend fixes one size for all files, so equal content cuts into equal chunks."
  - point: "If the connection drops, the client calls init again with resumeUploadId; the server answers with the chunks it already has, and only the rest are sent."
    kind: failure
    weight: core
    teach:
      - "Scenario two: halfway through a 500 MB upload the network fails. Starting over wastes the bandwidth already spent."
      - "So the client calls init again with the same name and size and a resumeUploadId, the upload id from the first call. The server returns the same upload id and existingChunks, say 0 to 4, and the client carries on from chunk 5."
    draw: [s1-resume-1, s1-resume-2, s1-resume-3, s1-resume-4]
    check: "How does a resumed upload avoid sending chunks again?"
    answer: "It sends the earlier upload id as resumeUploadId, and the server answers with existingChunks, the ones it already stored."
asks:
  - ids: [s1-resp-1, s1-resp-2, s1-resp-3, s1-resp-4]
    frame: [lk-quota, s1-quota]
    beats: [2]
    question: "The client has asked to upload a 50 MB file. What should the server check, and what should it send back?"
    hints:
      - "Can this user store 50 MB more?"
      - "The client will cut the file. What does it need to know, and what ties the calls together?"
  - ids: [s1-resume-3, s1-resume-4]
    frame: [s1-resume-1, s1-resume-2]
    beats: [3]
    question: "The connection drops after five chunks. How should the client resume without sending everything again?"
    hints:
      - "What id from the first call could it send back?"
      - "What would the server answer with?"
