  assumes:
    - "The app has a chunker, an upload manager and a local metadata index."
    - "The user table holds each user's storage used."
  carries:
    - "Init sends fileName, fileSize and parentFolderId; the uploader checks the quota in the user DB."
    - "The answer: fileId, uploadId, a fixed chunkSize of 5 MB, and existingChunks, empty on a fresh upload."
    - "A resume sends resumeUploadId and gets back the chunks already stored, so only the rest are sent."
  terms:
