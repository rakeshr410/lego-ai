# Cloud storage interview, deep dive, "Step 1: Initiate Upload (by File Uploader Svc)": the uploader added behind the gateway with its quota check against the users table, and the step written beside the drawing, the init request and response as JSON, then scenario 2, a resume after a dropped connection, as in the video.
