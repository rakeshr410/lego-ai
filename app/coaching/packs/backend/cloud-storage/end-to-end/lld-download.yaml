beats:
  - point: "A read or download service takes the request and asks the metadata service whether the file exists and the user may read it."
    kind: component
    weight: core
    teach:
      - "Last flow, reading. A read or download service behind the gateway."
      - "It does not trust the request: it asks the file metadata service whether the file exists and whether this user may read it."
    draw: [lk-download, lk-gw-download, lk-dl-meta]
    check: "What does the download service ask the metadata service?"
    answer: "Whether the file exists and whether this user is allowed to read it."
  - point: "Permission comes from the permissions table: a row for the file, or a folder above it, naming the user and a role; sharing is writing one such row."
    kind: mechanism
    weight: core
    teach:
      - "The answer is in the permissions table: a row whose resource is the file, or a folder above it, with the user and a role, reader or writer."
      - "So sharing a folder with family is a metadata write: one permission row."
    draw: [lk-dl-perm]
    check: "How is sharing a folder with a family member stored?"
    answer: "As one row in the permissions table: the folder, the family member, and a role such as reader."
  - point: "If allowed, the service returns signed GET URLs and the app downloads straight from storage; the file is stored in chunks, so one URL per chunk of the current version."
    kind: flow
    weight: core
    teach:
      - "If allowed, the same trick as the upload: signed URLs, so the bytes come straight from storage, not through our servers."
      - "The file is stored as chunks, so the answer lists the current version's chunks, each with a URL, and the app joins them. The video draws one signed URL; with chunked storage it is one per chunk."
    draw: [lk-dl-urls]
    check: "Why does a download return several URLs?"
    answer: "The file is stored as chunks, so each chunk of the current version gets its own signed URL and the app joins them."
asks:
  - ids: [lk-download]
    beats: [1]
    question: "Someone opens a shared file to download it. What should happen before any bytes move?"
    hints:
      - "Does the file exist, and may this person read it?"
      - "Who knows the permissions?"
