# Cloud storage interview, deep dive, steps 5 and 6: the commit, every chunk validated against the hashes in Redis, then the file saved through the metadata service and an event published to Kafka; the metadata service, its database and Kafka added to the drawing. The video draws the event from the uploader; here the metadata service publishes it after the save, the arrow the board can draw straight.
