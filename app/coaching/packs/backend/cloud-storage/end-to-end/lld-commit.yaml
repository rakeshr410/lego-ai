beats:
  - point: "Step 5: once every chunk is up, the client sends the commit; then the server checks each stored chunk's SHA-256 against the hash Redis holds, and has any bad or missing chunk sent again."
    kind: mechanism
    weight: core
    teach:
      - "Step five, the commit: a POST to the upload's commit, saying every chunk is up. That ends the client's part."
      - "Then validation. A chunk can be corrupted or cut short on the way. For each chunk in S3 the server hashes the stored bytes and compares with the hash the client sent, which Redis has. Equal means intact. A mismatch, or a chunk missing from the bitmap, goes back to the client to upload again, and the retry count goes up."
    draw: [s5, s5-commit, s5-validate]
    check: "How does the server know chunk 3 arrived intact?"
    answer: "It hashes the stored chunk with SHA-256 and compares it with the hash the client computed and sent, which Redis holds."
  - point: "Step 6: when every chunk checks out, the uploader has the metadata service save the file, a new version and its chunk list in the metadata DB; only then does the file exist."
    kind: flow
    weight: core
    teach:
      - "Step six: all good, so the temporary record in Redis becomes permanent. The uploader calls the metadata service, which saves the file row, a new file version, and the version's chunk list with each chunk's location and checksum."
      - "Until this moment the user does not see the file. Writing it earlier would show a file that cannot be read."
    draw: [lk-meta-svc, lk-gw-meta, lk-up-meta, lk-meta-db, lk-meta-db-arrow, s6-save]
    check: "Why is the file written to the metadata DB only after commit and validation?"
    answer: "Before that it is incomplete or unverified; recording it earlier would show users a file they cannot read."
  - point: "After the save, a file-changed event goes to Kafka, so the other devices can be told without slowing the upload."
    kind: decision
    weight: core
    teach:
      - "Last, the other devices must hear of it. Rather than call them now, publish a file-changed event to Kafka once the save is done."
      - "The video draws this arrow from the uploader; either way the event goes out after the file is saved, so no device hears of a file that is not there."
    draw: [lk-kafka, lk-publish, s6-publish]
    check: "Why publish an event to Kafka instead of notifying the devices inside the upload call?"
    answer: "It decouples the upload from sync: the upload finishes fast, and the event is kept until the sync side consumes it."
