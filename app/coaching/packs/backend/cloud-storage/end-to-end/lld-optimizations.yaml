beats:
  - point: "Re-hashing every chunk as it lands would eat the uploader at millions of chunks, so a separate validator service checks the whole upload once, after commit, asynchronously."
    kind: decision
    weight: core
    teach:
      - "The follow-up you will get: how would you make it better? Start with validation. Chunks are 5 MB, so a 20 GB file is about 4,000 of them, and millions of users upload. Hashing each one as S3 reports it would consume the uploader."
      - "So validate once, after commit, in a separate validator service that reads the chunks from the bucket asynchronously. That is the short processing time after an upload. S3 can also check a SHA-256 sent with each PUT and refuse a bad chunk."
    draw: [lk-validator, lk-validate, lo-validate]
    check: "Why move validation to a separate service after commit?"
    answer: "At millions of chunks, hashing each inline consumes the uploader; one asynchronous pass after commit does the same check off the request path."
    misconceptions:
      - "Validating chunks is optional at this scale -> it still happens; it moves off the request path, and S3 can check each PUT's checksum."
  - point: "Because every chunk has one fixed size, identical content cuts into identical chunks with identical hashes, so a deduplication job keeps one copy: a 20 MB file is 5, 5, 5, 5 MB, a 17 MB file 5, 5, 5, 2 MB."
    kind: mechanism
    weight: core
    teach:
      - "Next, storage. Many users upload the same files. This is why the backend fixes one chunk size: identical content then cuts into identical chunks, and identical chunks have identical SHA-256 hashes."
      - "A 20 MB file is four 5 MB chunks; a 17 MB file is three 5 MB chunks and one of 2 MB. Wherever two chunks hash the same, a deduplication service, an async job, keeps one copy and points both files at it."
    draw: [lk-dedup, lk-dedupe, lo-dedup, lo-20mb, lo-17mb]
    check: "How can the system tell two chunks are duplicates without comparing their bytes?"
    answer: "They have the same size and the same SHA-256 hash, which the fixed chunk size makes possible."
  - point: "Fixed boundaries have a limit: one insertion near the start shifts every later chunk, so nothing after it matches; content-defined chunking cuts by content and keeps the rest equal."
    kind: failure
    weight: supporting
    teach:
      - "Name the limit. Insert a few bytes near the start of a file and every fixed 5 MB boundary after it shifts: no later chunk hashes the same, so neither the edit upload nor dedup saves anything."
      - "Content-defined chunking cuts where a rolling hash of the content says, so only the chunks around the insertion change."
    draw: [lo-insert]
    check: "Why can a small insertion defeat fixed-size chunking?"
    answer: "It shifts every later boundary, so every later chunk's hash changes even though its content did not."
  - point: "More async jobs run on the bucket, a virus scan and thumbnails; then read the non-functional list back against the board."
    kind: rule
    weight: supporting
    teach:
      - "Other jobs run on the bucket the same way: a virus scan, thumbnails, queued through Kafka."
      - "Close by reading the right-hand list against the board: scale from separate services and bytes straight to S3; availability and eventual sync through Kafka; large files in chunks that resume; latency from parallel chunks; durability from S3 and validated hashes."
    draw: [lo-jobs]
    check: "Read one non-functional requirement back against the final board."
    answer: "For example: large files are met by fixed chunks, signed URLs and resume; durability by S3 and hash validation; sync lag is the eventual consistency through Kafka."
