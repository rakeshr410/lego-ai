# Top K leaderboard interview, requirements: "1. Functional requirements" on the left and "Non-functional requirements" on the right, under the problem statement, as the video lays them out; every non-functional line with its number.
id: backend/top-k-leaderboard/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "34ab7816a0d9"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/top-k-leaderboard/end-to-end/problem-statement
  assumes:
    - "A leaderboard returns the K items with the highest score for a board, a region and a time window."
  carries:
    - "Functional: insert, update or delete scores; query the top K by region or group; windows of hour, day, month, all time; real-time updates for live leaderboards."
    - "Non-functional: 1M writes a second, billions of items; availability over consistency; top K in 100 ms, updates within 500 ms; exact, not probabilistic."
    - Requirements are gathered within the first 10 to 15 minutes of 45.
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system (scale, latency, availability, accuracy), stated with a number."
    - term: soft real time
      means: "An update shows up within a bound, here 500 ms, rather than instantly."
