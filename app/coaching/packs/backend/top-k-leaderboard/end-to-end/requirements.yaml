beats:
  - point: "The two core functional requirements: put data in (insert, update or delete a score, view or like) and query the top K by region or group."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: functional requirements. The headline one is to query the top K, songs, videos or players, by region or group."
      - "But without data there is nothing to rank, so ingestion is a requirement of its own: insert, update or delete a player's score, a video's view, a song's like."
    draw: [fr, fr-insert, fr-query]
    check: Why is putting data in a requirement of its own, when the product is a ranking?
    answer: "Without scores, views and likes coming in there is nothing to rank; the system has to ingest them as well as query them."
  - point: "Queries take a time window, the last hour, day or month or all time, and live leaderboards need real-time updates, which trending lists do not."
    kind: requirement
    weight: core
    teach:
      - "A query also picks a window: the top 100 videos of the last 90 days, say. Fix the set: an hour, a day, a month, all time."
      - "And real-time updates, but only for live leaderboards, a game event watching its scores. Trending songs or movies can be a little behind."
    draw: [fr-window, fr-realtime]
    check: Which kind of product needs real-time updates, and which does not?
    answer: "A live game leaderboard needs them; a trending list of songs or videos can lag a little."
  - point: "Scale decides this design: 1 million write requests a second, the score events, over billions of songs, videos or players; and availability over consistency."
    kind: metric
    weight: core
    teach:
      - "On the right, non-functional. Scale first, because here the whole design depends on it: about a million requests a second, and these are writes, likes and views coming in, not top K queries. Over billions of songs, videos or players."
      - "Then CAP. When the network splits we keep answering: a client should always get some list, never a service-unavailable error. A video moving from second to first can show a moment late: eventual consistency."
    draw: [nfr, nfr-scale, nfr-cap]
    check: "The million requests a second: are they top K reads or something else?"
    answer: "Writes: the score, view and like events coming in."
    misconceptions:
      - "CAP means a system can never be both available and consistent -> it is a choice made while the network is partitioned; here we choose to keep answering."
  - point: "Latency: the top K in 100 ms, an update reflected within 500 ms (soft real time); and the results are exact, not probabilistic, agreed up front because it changes the design."
    kind: metric
    weight: core
    teach:
      - "Latency, two numbers: fetching the top K in 100 milliseconds, near real time; an update or delete reflected within 500, soft real time, since it may move ranks."
      - "Last, accuracy. Ask whether they want the exact top K or a probabilistic one. The design changes completely, so settle it now: exact, and we'll say at the end how to go probabilistic."
    draw: [nfr-latency, nfr-exact]
    check: Why settle exact versus probabilistic at the start?
    answer: "Approximate top K uses different structures, sketches in fixed memory, so the choice changes the whole design."
  - point: "Keep requirement gathering inside 10 to 15 minutes of a 45-minute interview."
    kind: rule
    weight: supporting
    teach:
      - "Watch the clock: ten to fifteen minutes for all of this, then move on."
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should this leaderboard service do? Tell me the features one at a time, and I'll write them down."
    hints:
      - What has to come into the system before anything can be ranked?
      - And when someone asks for the top K, what else might they choose?
  - list: nfr-list
    beats: [3, 4]
    question: "Now the qualities. How big, how fast, how reliable, how exact? A number if you have one."
    hints:
      - Think of every like and view on a large video site arriving at once.
      - How long may fetching the top K take, and must it be exact?
