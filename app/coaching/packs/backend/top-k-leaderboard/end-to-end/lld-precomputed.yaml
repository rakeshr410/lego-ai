beats:
  - point: "Second approach: keep the ingestion, score service to Kafka to DB consumer to score DB, and drop Redis, the part that was hard to scale and to keep."
    kind: component
    weight: core
    teach:
      - "Second way. Copy the picture again. The way data comes in does not change: score service, Kafka, DB consumer, score database."
      - "But Redis goes. Its problems were scaling across the globe and keeping the data safe, so this time we answer from data we computed ahead."
    draw: [p2, p-clients, p-gateway, p-clients-gateway, p-score, p-gateway-score, p-ranking, p-gateway-ranking, p-kafka, p-score-kafka, p-dbc, p-kafka-dbc, p-db, p-dbc-db]
    check: What stays from the first approach, and what goes?
    answer: "The ingestion through Kafka and the DB consumer stays; the Redis consumer and sorted set go."
  - point: "The score DB takes a million writes a second, so choose a write-optimized store: Cassandra (Spanner works too); BigQuery is a warehouse for batch scans, not for single writes."
    kind: decision
    weight: core
    teach:
      - "Which database for the scores? It takes a million writes a second, so it must be write-optimized. Cassandra is built for that: its writes are appends. Spanner works too."
      - "BigQuery comes up, but it is an analytics warehouse: good for scanning the data in a batch, not as the store a million single scores land in."
    draw: [p-db-note]
    check: Why Cassandra for the score DB?
    answer: "It is write-optimized, built for heavy append traffic like a million score events a second."
    misconceptions:
      - "BigQuery can be the write store -> it is an analytics warehouse for batch queries, not for a million small writes a second."
  - point: "A processing job, Apache Flink or a Spark job run by Airflow or cron, reads the scores and precomputes the top K for every region and window into an aggregated DB."
    kind: mechanism
    weight: core
    teach:
      - "Under the score database, a processing job: Apache Flink, or Spark on a schedule from Airflow or cron. It reads the scores and computes the top K for every board, region and time window, hourly or daily."
      - "It writes the results into a separate aggregated database. Everything a client may ask for is already there."
    draw: [p-flink, p-db-flink, p-agg, p-flink-agg, p2n, p2n-job, p2n-where]
    check: What does the processing job write, and where?
    answer: "The top K for every board, region and window, into the aggregated database."
    misconceptions:
      - "Splunk can do the precompute -> Splunk searches logs; the job is a stream or batch processor such as Flink or Spark."
  - point: "The ranking service reads only the aggregated DB; a time-series DB such as InfluxDB fits, since every query is a window and a region (PostgreSQL works with partitioning and indexes)."
    kind: decision
    weight: core
    teach:
      - "The ranking service now queries the aggregated database, always by window and region. That shape suits a time-series database such as InfluxDB."
      - "PostgreSQL would work too, but you would partition and index it by country, region and window yourself."
    draw: [p-ranking-agg, p-agg-note]
    check: Why does a time-series database suit the aggregated data?
    answer: "Every query asks for one region over one time window, which is how a time-series database organises and reads data."
  - point: "The flaw: rankings are as old as the last job run, minutes or more, the job needs Airflow, Spark or cron, and every dimension is computed whether asked or not. Durable and scalable, though."
    kind: failure
    weight: core
    teach:
      - "Write the pros and cons. Pro: it is stored in a database, durable and backed up, and scales out horizontally."
      - "Con: the data is not real time. Scores land, then the job runs every few minutes or hours, so the top K lags. It also needs a scheduler and computes every dimension in advance."
    draw: [p2n-pro, p2n-stale, p2n-every]
    check: What does a user see between two runs of the job?
    answer: "The rankings from the last run: new scores do not move them until the next run, minutes or hours later."
  - point: "Mitigate with shorter batches, Flink for faster processing, and a cache in front of the aggregated DB so popular lists are not read from the database each time."
    kind: mechanism
    weight: core
    teach:
      - "To soften it: run shorter batches, use Flink to process faster, and put a cache in front of the aggregated database."
      - "The ranking service reads the cache first, so the most asked-for lists come from memory."
    draw: [p-cache, p-ranking-cache, p2n-fix]
    check: What does the cache in front of the aggregated DB save?
    answer: "Repeated reads of the same popular precomputed lists from the database."
  - point: "Precomputing fits when the queries are known ahead: which windows and regions users will look at, and when a short delay is acceptable."
    kind: decision
    weight: supporting
    teach:
      - "Where it fits: when you know the queries ahead, which dimensions users will view, and the product does not need real-time rankings."
    draw: [p2n-fits]
    check: For which kind of product is precomputing a good fit?
    answer: "One whose queries are known in advance and which can tolerate rankings a few minutes old, such as trending lists."
asks:
  - ids: [p-db-note]
    beats: [2]
    question: "The score database takes a million writes a second. Which database would you choose for it, and why?"
    hints:
      - Think of a store built for heavy writes.
      - Its writes are appends, and it spreads over many nodes.
  - ids: [p-flink, p-agg]
    beats: [3]
    question: "We want the answers ready before anyone asks. What would compute them, and where would they go?"
    hints:
      - Something that processes the scores on a schedule or as a stream.
      - The results need a store of their own for the ranking service.
  - ids: [p-cache]
    beats: [6]
    question: "The same popular lists are read again and again from the aggregated database. How would you speed that up?"
    hints:
      - Something in memory.
      - In front of the aggregated database.
