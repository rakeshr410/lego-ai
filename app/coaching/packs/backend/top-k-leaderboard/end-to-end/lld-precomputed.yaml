# Top K leaderboard interview, deep dive 2: precomputed rankings. The video's second picture, drawn fresh under the kept requirements: the same ingestion (clients, gateway, score service, Kafka, DB consumer, score DB with its Cassandra note), Redis gone, a Flink diamond under the score DB writing an aggregated DB (a time-series DB) to its left, the ranking service reading it with a cache above; to the right the "Precomputed" notes, pro, cons, mitigation and where it fits. The video lists BigQuery as a write store and Splunk as a processor; this pack says Cassandra and Flink or Spark.
id: backend/top-k-leaderboard/end-to-end/lld-precomputed
title: "Deep dive, 2: precompute the rankings"
source:
  hash: "b4b3b718fd66"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/top-k-leaderboard/end-to-end/lld-redis-sorted-set
  assumes:
    - "Score events go through Kafka; a DB consumer writes the score DB."
    - "A Redis sorted set answers top K from memory but is hard to scale globally and fragile."
  carries:
    - "Scores live in a write-optimized store, Cassandra; a Flink or Spark job precomputes top K per region and window into an aggregated DB."
    - "The aggregated DB is a time-series DB such as InfluxDB (or partitioned PostgreSQL), with a cache in front."
    - "Precomputing is durable and scales out, but rankings are as stale as the last job run; it fits when the queries are known ahead."
  terms:
    - term: precompute
      means: "Compute every answer ahead of time on a schedule, so a query only reads a stored result."
    - term: write-optimized database
      means: "A store built for heavy append traffic, such as Cassandra, whose writes are sequential appends."
    - term: time-series database
      means: "A store organised by time, such as InfluxDB, fast at reading a window of time for a series."
