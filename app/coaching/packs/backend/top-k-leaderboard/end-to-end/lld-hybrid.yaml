context:
  after: backend/top-k-leaderboard/end-to-end/lld-precomputed
  assumes:
    - "A Redis sorted set gives top K from memory in real time but is fragile and hard to scale."
    - "Precomputing with Flink into an aggregated DB is durable but minutes stale."
  carries:
    - "The hybrid runs both paths from Kafka: Redis for recent windows in real time, the aggregated DB for past windows and as Redis's backup."
    - "Rolling windows in Redis are time-bucket keys, one per hour or day, each with a TTL; a window is the union of its buckets."
    - "Live leaderboards get updates from a WebSocket server reading Redis; a probabilistic top K uses a count-min sketch or RedisBloom Top-K."
  terms:
    - term: TTL
      means: "Time to live: a timeout on a whole Redis key, after which the key and everything in it is deleted."
    - term: time bucket
      means: "A key holding the scores of one hour or one day; a window is the union of its buckets."
    - term: count-min sketch
      means: "A fixed-size table of counters that estimates how often each item occurs, never under-counting, within a bounded error."
