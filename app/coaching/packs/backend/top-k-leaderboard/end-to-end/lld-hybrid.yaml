beats:
  - point: "The first approach was fresh but fragile, the second durable but stale; the hybrid merges both pictures, starting from the precomputed path: Kafka, DB consumer, score DB, Flink, aggregated DB."
    kind: component
    weight: core
    teach:
      - "Third way, and the best: the sorted set was real time but fragile, precomputing durable but stale. Merge the two pictures."
      - "Start with the durable path, as in approach two: score service, Kafka, the DB consumer into the score database, Flink precomputing into the aggregated database."
    draw: [h3, h-clients, h-gateway, h-clients-gateway, h-score, h-gateway-score, h-kafka, h-score-kafka, h-dbc, h-kafka-dbc, h-db, h-dbc-db, h-flink, h-db-flink, h-agg, h-flink-agg]
    check: What did each of the first two approaches lack?
    answer: "The sorted set lacked durability and global scale; precomputing lacked freshness, its rankings were minutes old."
  - point: "Add the real-time path back from approach one: a Redis consumer on the same Kafka topic fills the sorted set, and the ranking service reads it."
    kind: mechanism
    weight: core
    teach:
      - "Now bring back the fast path: the Redis consumer reads the same topic and updates the Redis sorted set as events arrive."
      - "The ranking service reads the sorted set. Every write now feeds both stores."
    draw: [h-rc, h-kafka-rc, h-zset, h-rc-zset, h-ranking, h-gateway-ranking, h-ranking-zset, h3n, h3n-both]
    check: Which stores does one score event reach in the hybrid?
    answer: "Both: the Redis sorted set through the Redis consumer, and the score DB, then the aggregated DB, through the DB consumer and Flink."
  - point: "Redis keeps only recent windows, as time-bucket keys, one per hour or day, each with a TTL; a TTL drops a whole key, so the last 30 days is the union of 30 daily keys."
    kind: mechanism
    weight: core
    teach:
      - "Redis no longer keeps everything forever: only the recent windows, and each key expires with a TTL."
      - "Careful: a TTL removes a whole key, not old scores inside it. A 90-day TTL on a 90-day key would just delete it on day 90. So keep one key per hour or per day, each expiring, and build the last 30 days as the union of 30 daily keys, ZUNIONSTORE."
    draw: [h3n-recent, h3n-ttl, h3n-union]
    check: "You set a 90-day TTL on the 90-day key. What happens?"
    answer: "On day 90 the whole key, every score in it, is deleted; a rolling window needs time-bucket keys that each expire."
    misconceptions:
      - "A TTL on a sorted set removes entries older than the TTL -> it deletes the whole key at once; rolling windows come from bucket keys."
  - point: "The ranking service asks Redis first; a miss means a past window, last January say, which is already precomputed in the aggregated DB."
    kind: flow
    weight: core
    teach:
      - "The read path: the ranking service checks the sorted set first. If the key is there, done, in milliseconds."
      - "A miss only happens for the past: last January's top 10. That is already precomputed, so the ranking service reads the aggregated database. Current data in Redis, past data in the aggregated store."
    draw: [h-ranking-agg, h3n-miss]
    check: A user asks for last January's top 10. Where does the answer come from?
    answer: "The aggregated DB: Redis keeps only recent windows, and past windows are precomputed there."
  - point: "The aggregated DB is also Redis's backup: if a Redis node is lost, its keys are rebuilt from the precomputed data, not from scratch."
    kind: failure
    weight: core
    teach:
      - "One more connection, from the aggregated database to Redis. If a Redis node goes down, a service reloads its keys from the precomputed data."
      - "So Redis gives the near real-time answers, and the aggregated database gives the durability."
    draw: [h-agg-zset, h3n-rebuild]
    check: A Redis node dies. How is it brought back?
    answer: "Its keys are rebuilt from the precomputed rankings in the aggregated DB instead of recomputed from every score."
  - point: "Real-time updates, the last functional requirement: a live leaderboard keeps a WebSocket to a WebSocket server, which pushes changes it reads from the sorted set."
    kind: mechanism
    weight: core
    teach:
      - "The follow-up: real-time updates for a live leaderboard. The client opens a WebSocket, the variant of our top K endpoint, to a WebSocket server."
      - "That server watches the board's sorted set and pushes the new top K when it changes. Trending lists stay plain GETs."
    draw: [h3n-ws]
    check: How does a live leaderboard get its updates without polling?
    answer: "A WebSocket server keeps its connection open and pushes changes it reads from the Redis sorted set."
  - point: "If the interviewer wants a probabilistic top K instead, use approximate structures in fixed memory, a count-min sketch with a small heap or RedisBloom's Top-K, trading a bounded error for memory."
    kind: decision
    weight: supporting
    teach:
      - "We chose exact results. If they ask for probabilistic: replace the exact counts with a count-min sketch, a small fixed table of counters, plus a heap of the current top K, or RedisBloom's Top-K."
      - "They use a fixed amount of memory however many items there are, at the cost of a small, bounded error."
    draw: [h3n-prob]
    check: What does a probabilistic top K give up, and what does it gain?
    answer: "It gives up exactness, a small bounded error, and gains fixed, small memory however many items there are."
  - point: "Close by reading the non-functional list back: Kafka for a million writes a second, a clustered Redis backed by the aggregated DB for availability, recent top K from memory inside 100 ms, exact counts."
    kind: rule
    weight: core
    teach:
      - "Finish by reading the right-hand list back against the board. Scale: Kafka absorbs a million writes a second. Availability: Redis is clustered and backed by the aggregated database."
      - "Latency: recent top K from memory, well inside 100 milliseconds, updates through Kafka within about 500. Accuracy: exact counts in both stores."
    check: Which part of the board meets the 100 ms top K?
    answer: "The Redis sorted sets, which answer recent windows from memory; past windows come precomputed from the aggregated DB."
