# Top K leaderboard interview, deep dive 3: the hybrid, and finishing. The video's third picture, the first two merged, drawn fresh under the kept requirements: ingestion through Kafka to both the DB consumer (score DB, Flink, aggregated DB) and the Redis consumer (sorted set), the ranking service reading Redis and the aggregated DB, and the aggregated DB backing Redis; to the right the "3. Hybrid approach" notes, then real time over a WebSocket and the probabilistic variant. The video puts a 90-day TTL on a window key; this pack teaches time-bucket keys, since a TTL drops a whole key.
id: backend/top-k-leaderboard/end-to-end/lld-hybrid
title: "Deep dive, 3: the hybrid, and finishing"
