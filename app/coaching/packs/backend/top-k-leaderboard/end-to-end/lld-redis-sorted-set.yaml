# Top K leaderboard interview, deep dive 1: under "5. Deep dive, low-level design", the high-level design copied and grown as in the video: clients, a tall gateway, the score service feeding Kafka, a DB consumer over the scores DB on the right, a Redis consumer under Kafka filling a Redis sorted set that the ranking service reads, the window keys written under it; and to the right, the "1. Redis sorted set" notes with the flaws, the fix and where it fits. The video calls a sorted set a heap; this pack teaches it as an ordered set (a skip list).
id: backend/top-k-leaderboard/end-to-end/lld-redis-sorted-set
title: "Deep dive, 1: Kafka and a Redis sorted set"
source:
  hash: "83c33f1919c5"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/top-k-leaderboard/end-to-end/high-level-design
  assumes:
    - "The high-level design: clients, a gateway, a score service writing a score DB, a ranking service reading it."
    - "Non-functional: 1M writes a second, top K in 100 ms, availability over consistency."
  carries:
    - "The score service puts every event on Kafka; a DB consumer writes the score DB at its own pace."
    - "A Redis consumer keeps a Redis sorted set per board, region and window; the ranking service reads the top K from it."
    - "One Redis is a single point of failure and holds everything; mitigate with a cluster partitioned by region, replicas and snapshots."
    - "The sorted set approach fits a small system, 1K to 10K items in one country."
  terms:
    - term: Kafka
      means: "A durable, partitioned log; producers append events and consumers read them at their own pace."
    - term: sorted set
      means: "A Redis type, a ZSET, whose members are kept ordered by score; top K and rank cost log N plus K."
    - term: consumer
      means: A service that reads events from a Kafka topic and acts on them.
