# Notification system interview, requirements: "1. Functional requirements" on the left and "Non-functional requirements" on the right, under the problem statement, as the video's board has them; the functional lines in the board's order.
id: backend/notification-system/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "2d9e76b22991"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/notification-system/end-to-end/problem-statement
  assumes:
    - "The service is a platform other companies call to notify their users by email, SMS and in-app push."
  carries:
    - "Functional: email, SMS and in-app channels; templates with variables; user preferences per channel and type; immediate and scheduled sends; delivery status for reporting."
    - "Non-functional: 1M+ notifications a minute; availability over consistency; OTPs near real time, promotional within 5 to 10 s."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, scale, availability, latency, stated with a number."
    - term: eventual consistency
      means: "A change, such as a new template version, may take a few seconds to apply everywhere, but it gets there."
