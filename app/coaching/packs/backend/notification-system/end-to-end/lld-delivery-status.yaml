# Notification system interview, deep dive 4: status, and reporting. Above the queue, as in the video: a notification consumer writing the notifications DB (its table to the right), a delivery_status Kafka topic that every provider publishes to and a delivery consumer that applies it, then the reporting service reading the notifications DB and the BigQuery events table above it.
