beats:
  - point: "Nothing is stored yet, so status cannot be reported; a notification consumer reads the queue and writes each notification to a notifications DB with status pending."
    kind: mechanism
    weight: core
    teach:
      - "Something critical is missing: nothing in this flow is saved. A client asking about a message gets no answer."
      - "Add a notifications DB, and a notification consumer that reads the queue and writes each notification with status pending: it's here, not yet sent."
      - "Postgres, partitioned by client id. Columns: notification id, client, external user, template, channel, payload, status, priority, scheduled at, last updated."
    draw: [notif-consumer, queue-notif-consumer, notif-db, notif-consumer-db, notif-table-1, notif-table-2, notif-table-3]
    check: What does pending mean in this table?
    answer: The notification has reached the system but no provider has sent it yet.
  - point: "Providers should move the status to sent, but every provider writing one table is a poor design; they publish status events to a delivery_status topic and one delivery consumer applies them."
    kind: decision
    weight: core
    teach:
      - "When a provider hands a message to its sender, the status becomes sent. If each provider updates the table itself, many services write one table: they contend and are tied to its schema."
      - "Instead every provider publishes a status event to another Kafka topic, delivery status, and one delivery consumer updates the database. One writer, with a buffer in front."
    draw: [status-note, writers-note, delivery-kafka, sms-delivery, email-delivery, inapp-delivery, delivery-consumer, delivery-kafka-consumer, delivery-consumer-db]
    check: Why not let each provider update the notifications DB itself?
    answer: "Many services writing one table contend for rows and all depend on its schema; one delivery consumer behind a topic is the single writer."
  - point: "A reporting service behind the gateway answers clients' status and dashboard requests by reading the notifications DB."
    kind: component
    weight: core
    teach:
      - "The status is stored, but clients still can't see it. Add a reporting service: the request comes through the gateway, and it reads the status field from the notifications DB."
    draw: [reporting, gw-reporting, reporting-db]
    check: Where does the reporting service get a notification's status?
    answer: From the status column of the notifications DB, a read.
  - point: "The notifications table keeps only the latest status, so the delivery consumer also appends every change to a BigQuery events table, and reporting reads both."
    kind: mechanism
    weight: core
    teach:
      - "One more gap: the table keeps only the final status. A client who wants when it was scheduled, sent and delivered needs every change."
      - "So the delivery consumer also writes each event into a notification events table in BigQuery. You can split that into an analytics ingester. Reporting reads the history from BigQuery and the current status from Postgres."
    draw: [event-db, delivery-consumer-events, reporting-events]
    check: Why not just read the timeline from the notifications table?
    answer: "It holds only the latest status; the timeline needs every change, which the events table appends."
