  after: backend/notification-system/end-to-end/lld-notification-queue
  assumes:
    - "The notification service publishes to a Kafka queue with a topic per priority and channel."
    - "SMS, email and in-app providers consume their topics and call external senders."
  carries:
    - "A notification consumer writes each notification to the notifications DB (Postgres, partitioned by client) as PENDING."
    - "Providers publish status events to a delivery_status topic; one delivery consumer updates the DB instead of many writers."
    - "A reporting service reads current status from the notifications DB and every change from a BigQuery events table."
