beats:
  - point: "The stored preferences are not used yet: each provider must check the user's preference before calling its external sender, and drop the message if that channel is off."
    kind: mechanism
    weight: core
    teach:
      - "We save every user's preference, but nothing in the sending flow reads it. A user who turned SMS off would still get texts."
      - "So each provider, before it calls Twilio or SendGrid, checks the user's preference; if that channel is false, it drops the message."
    draw: [pref-check]
    check: Why check in the provider and not when the request arrives?
    answer: "It is the last moment before sending, so even a fresh opt-out is honoured, and each provider knows its own channel."
  - point: "A look-up per message, a million a minute, would load the preference DB, so a preference cache sits in front of it; providers read the cache and go to the database only on a miss."
    kind: mechanism
    weight: core
    teach:
      - "That's a look-up for every SMS and every email. With a key on client and user each is an index read, not a scan of the table, but a million a minute still loads the database and slows every send."
      - "Put a preference cache in front. Providers read the cache and fall back to the DB on a miss. A just-changed preference may be stale for a moment, which availability over consistency allows."
    draw: [pref-cache, sms-cache, email-cache, inapp-cache, cache-pref-db]
    check: What does the cache cost us?
    answer: "A changed preference may be served stale briefly, until the entry expires or is refreshed; the requirements accept that."
    misconceptions:
      - "Each preference check scans the whole table -> with a key on client id and user id it is an index look-up; the cache is about the sheer number of look-ups."
asks:
  - ids: [pref-cache]
    beats: [2]
    question: "Every provider now reads the preference DB for every message, a million a minute. How would you take that load off?"
    hints:
      - The same users' preferences are read again and again.
      - Something in memory, in front of the database.
