beats:
  - point: "Thousands of clients, each with millions of users, and roughly half of them changing preferences, means millions of writes a minute; written straight into the database, that does not hold."
    kind: failure
    weight: core
    teach:
      - "Next box: the user preference service; I'll move it to the bottom. Thousands of clients, each with millions of users, and the video reckons 40 to 60 percent of them change their preferences."
      - "That is millions of requests a minute. Each one updating the database directly is not feasible."
    draw: [pref-svc, gw-pref, pref-scale]
    check: What goes wrong if the preference service writes every change straight to the database?
    answer: "Millions of writes a minute arrive in bursts, more than the database should take synchronously."
  - point: "So the service publishes each change to a Kafka topic, user_preference, and a preference consumer reads it and updates the database at a steady pace."
    kind: mechanism
    weight: core
    teach:
      - "Put a buffer in between: a Kafka broker with a topic, user preference. The service publishes the change and answers at once."
      - "A preference consumer reads the topic and slowly updates the preference DB. Publish and subscribe: the bursts wait in Kafka, not in the database. The change lands a moment later, which availability over consistency allows."
    draw: [pref-kafka, pref-svc-kafka, pref-consumer, pref-kafka-consumer, pref-db, pref-consumer-db]
    check: What does the user give up by going through Kafka?
    answer: "Their change applies a moment later rather than instantly: eventual consistency, which the requirements accept."
  - point: "The preference table is a small structured record in Postgres: id, client id, external user id, the preferences per channel, and an updated time."
    kind: decision
    weight: supporting
    teach:
      - "The record is small and structured, so Postgres. Columns: an id, the client id, Amazon or Uber, the external user id, the preferences, email true, SMS false, and updated at."
    draw: [pref-table-1, pref-table-2, pref-table-3]
    check: Which two columns identify whose preference a row is?
    answer: "The client id and the external user id together."
asks:
  - ids: [pref-kafka, pref-consumer]
    beats: [2]
    question: "Millions of preference changes a minute. How would you get them into the database without overloading it?"
    hints:
      - What if the service didn't write the database itself?
      - Something in between that holds the changes until they can be written.
