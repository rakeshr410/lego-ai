# Notification system interview, deep dive 3: providers, and a queue between them. In the middle band of the deep-dive region, as in the video: the notification service, the notification queue (Kafka), a column of SMS, email and in-app providers, and the external senders on the right (Twilio or MSG91, SendGrid or Amazon SES, FCM or APNS), with the topic list under the service.
