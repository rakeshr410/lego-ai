beats:
  - point: "The black-boxed provider becomes three microservices, one per channel: an SMS provider, an email provider and an in-app provider."
    kind: component
    weight: core
    teach:
      - "Now the core: the notification service. A client's send request reaches it through the gateway. Open the notification provider we black-boxed."
      - "Split it into three services so each has one job: an SMS provider, an email provider, an in-app provider. A request goes to the one for its channel."
    draw: [notif-svc, gw-notif, sms-prov, email-prov, inapp-prov]
    check: Why split the provider by channel?
    answer: "Each channel has its own protocol and sender, so one service per channel separates the responsibilities and scales each on its own."
  - point: "No provider reaches a phone itself: SMS goes through Twilio or MSG91, email through SendGrid, Amazon SES or SMTP, and push through FCM for Android and APNs for Apple."
    kind: component
    weight: core
    teach:
      - "The providers can't deliver by themselves; each calls an external sender. SMS through Twilio or MSG91. Email through SendGrid, which Twilio owns, Amazon SES, or an SMTP server like Gmail's."
      - "In-app push through FCM, Firebase Cloud Messaging, for Android, and APNS, Apple's push notification service, for iPhones."
    draw: [twilio, sms-twilio, sendgrid, email-sendgrid, fcm, inapp-fcm, fcm-note]
    check: Which external sender reaches an iPhone with a push?
    answer: "APNs, the Apple Push Notification service; FCM covers Android."
  - point: "Routing a million requests a minute from the notification service straight to three providers is a bottleneck; a Kafka notification queue in between lets the service publish and move on while each provider consumes."
    kind: mechanism
    weight: core
    teach:
      - "But the service would have to route a million requests a minute, about sixteen thousand a second, across three servers and wait on each. That is the bottleneck."
      - "Put a Kafka broker in between, the notification queue. The service drops every request in, whatever the channel, and moves on. Each provider is a consumer reading only what is meant for it."
    draw: [queue, notif-queue, queue-sms, queue-email, queue-inapp]
    check: What does the queue buy the notification service?
    answer: "It publishes and returns instead of calling providers synchronously, and each provider consumes at its own pace and scales separately."
  - point: "Topics are priority times channel: critical, standard and promotional, each for email, SMS and push, nine in all, plus bulk email and bulk SMS; the SMS provider subscribes only to the SMS topics."
    kind: mechanism
    weight: core
    teach:
      - "How does a provider know what is its? Topics. The priority in the API, high, medium, low, becomes critical, standard, promotional: OTPs, ordinary events, campaigns."
      - "Each has the three channels, so nine topics, plus bulk email and bulk SMS for mass sends. The SMS provider subscribes to the SMS topics only."
    draw: [topic-critical, topic-standard, topic-promo, topic-bulk]
    check: How many priority and channel topics are there, and why?
    answer: "Nine: three priorities, critical, standard and promotional, times three channels, email, SMS and push."
  - point: "A failed message goes to a retry topic and is tried again after an exponentially growing wait; after two or three failures it lands in a dead letter queue for the support team."
    kind: failure
    weight: supporting
    teach:
      - "Two more topics. A message that fails goes to retry and is tried again after a growing wait, exponential backoff."
      - "After two or three failures it goes to the dead letter queue: it couldn't be sent, and support has to look at why."
    draw: [topic-retry]
    check: Why not retry a failing message forever?
    answer: "A permanently broken message would loop and waste capacity; after a few tries it goes to the DLQ for people to inspect."
