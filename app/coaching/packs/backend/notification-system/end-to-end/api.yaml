  hash: "ce8095e0d487"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/notification-system/end-to-end/entities
  assumes:
    - "Functional: channels, templates, user preferences, immediate or scheduled sends, delivery status."
    - "The client is the calling company; the user is the person."
  carries:
    - "POST /api/v1/notifications { templateId, recipientId, variables, channels?, priority?, scheduledAt? }; GET /api/v1/notifications/{id}/status."
    - "POST /api/v1/templates and GET /api/v1/templates/{id}/{version}, plus update and delete."
    - "PUT /api/v1/preferences { externalUserId, clientId, preferences: { email, sms, inApp } }."
  terms:
    - term: priority
      means: "Low, medium or high on a send request: promotional, standard, or critical like an OTP."
