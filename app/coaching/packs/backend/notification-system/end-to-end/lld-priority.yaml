# Notification system interview, deep dive 7: a fast lane for OTPs, and finishing. As in the video: critical messages go straight from the notification service to Kafka (the first arrow), an OTP service under the providers consumes only the critical topics and reads the preference cache, then the follow-ups: provider webhooks for delivered, and a rate limiter beside the external senders.
