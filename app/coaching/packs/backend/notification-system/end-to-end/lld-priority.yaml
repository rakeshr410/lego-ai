beats:
  - point: "Priority is set on every request but every message takes the same path; critical messages like OTPs skip the outbox and go straight to Kafka, and a lost OTP is simply requested again."
    kind: decision
    weight: core
    teach:
      - "One requirement is still unmet: the priority flag changes nothing, and an OTP through the outbox could take seconds."
      - "So critical messages don't use the outbox: the service puts them straight on Kafka, the path we drew first. If one is lost, the user taps resend and a new request comes through. A separate consumer can still record them in the database."
    draw: [critical-note]
    check: Why is it acceptable for OTPs to skip the durable outbox?
    answer: "An OTP needs near real time, and if one is lost the user asks for a new one, so speed is worth more than durability here."
  - point: "An OTP service consumes only the critical topics, so OTPs never wait behind promotions in the ordinary providers, which now read standard and promotional topics."
    kind: component
    weight: core
    teach:
      - "Still, the SMS provider treats an OTP like any promotion. Add an OTP service, a consumer that reads only the critical topics, whatever the channel."
      - "The SMS, email and in-app providers keep the standard and promotional ones. The OTP service checks preferences through the same cache."
    draw: [otp-svc, queue-otp, otp-cache]
    check: Which topics does the OTP service read, and which do the other providers read?
    answer: "The OTP service reads the critical topics; the SMS, email and in-app providers read standard and promotional."
  - point: "Delay in Kafka is consumer lag, so the OTP service is scaled out further than the others, in several regions, with at least as many partitions on the critical topics as consumers."
    kind: mechanism
    weight: core
    teach:
      - "Delay here means consumer lag: producers writing faster than consumers read. So scale the OTP service out more than the ordinary providers, across regions."
      - "One catch: in a consumer group each partition goes to one consumer, so the critical topics need at least as many partitions as OTP consumers, or the extras sit idle."
    draw: [scale-note]
    check: You run twenty OTP consumers on a topic with six partitions. What happens?
    answer: "Only six consume; each partition is read by one consumer in the group, so add partitions to scale further."
    misconceptions:
      - "Adding consumers always adds throughput -> a group's parallelism is capped by the topic's partition count."
  - point: "Status stops at sent, because only the external sender knows if a message arrived; each provider exposes a webhook that the sender calls with delivered or failed."
    kind: mechanism
    weight: supporting
    teach:
      - "A follow-up: we mark sent, but delivered depends on Twilio or SendGrid. Each provider opens a webhook, the sender calls it with the receipt, and the provider publishes it to the delivery status topic."
    draw: [webhook-note]
    check: How does the system learn an SMS was delivered?
    answer: "The external sender calls the provider's webhook, and the provider publishes the status event for the delivery consumer."
  - point: "Rate limits in two places: at the gateway, so no one floods the public API, and before the external senders, whose own quotas would drop the excess."
    kind: decision
    weight: core
    teach:
      - "Rate limiting, as promised. At the gateway, so a spammer can't flood our public API."
      - "And before the external senders: each has its own limit and drops what goes over. Every provider asks a rate limiter before it sends."
    draw: [rate-limiter, sms-rate, rate-note]
    check: Why a rate limiter before the external senders as well as at the gateway?
    answer: "The external senders have their own quotas and drop excess messages; the gateway's limiter only protects our API."
  - point: "Read the non-functional list back: Kafka between every producer and consumer carries the scale, changes may lag by seconds, OTPs have their own lane and promotions the durable outbox."
    kind: rule
    weight: supporting
    teach:
      - "Close by reading the requirements back. Scale: Kafka everywhere, consumers scaled per channel. Availability: preferences and templates may lag a few seconds. Latency: OTPs on their own topics and service, promotions through the outbox within 5 to 10 seconds."
    check: Which part of the design meets the OTP latency requirement?
    answer: "The critical topics written straight to Kafka and the dedicated, scaled-out OTP service."
