# Notification system interview, deep dive 6: never lose an accepted message. As in the video: the notification service now writes the notifications DB (its notifications and outbox tables) and a CDC pipeline carries new outbox rows to the queue, drawn beside the notifications DB, replacing the notification consumer. The video says Kafka going down loses messages; the pack teaches the narrower real gap and the one-transaction write.
