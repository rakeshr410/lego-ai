beats:
  - point: "The service acknowledges the client as soon as it has handed the message to Kafka, before anything is stored, so an accepted message can be lost."
    kind: failure
    weight: core
    teach:
      - "Amazon sends message ABC. The service drops it in Kafka and tells Amazon: received, it'll go out soon. But nothing is stored yet."
      - "The video's worry is Kafka going down and losing it. Kafka is in fact replicated and keeps acknowledged messages, so the real gap is narrower: acknowledging before the broker durably has it, or crashing in between. Either way Amazon was promised something nobody stored."
    check: What has the client been promised, and what is actually stored at that moment?
    answer: "It was told the message is accepted, while nothing is in the database and the publish may not be durable yet."
    misconceptions:
      - "Messages in Kafka vanish whenever a broker goes down -> Kafka replicates its log across brokers; the risk is acknowledging before a durable write."
  - point: "Fix it with a transactional outbox: the service writes the notification row and an outbox row in one transaction in the notifications DB, and only then acknowledges."
    kind: mechanism
    weight: core
    teach:
      - "Write to the database first. The notifications DB gets a second table, the outbox: outbox id, notification id, event type, payload, published, created at."
      - "The service writes the notification and the outbox row in one transaction, so both are saved or neither, and acknowledges the client after the commit."
    draw: [notif-svc-db, outbox-1, outbox-2, ack-note]
    check: Why one transaction for both rows?
    answer: "So both are saved or neither; two separate writes could leave a notification without its event, or an event without its row."
  - point: "A CDC pipeline reads new outbox rows and publishes them to the queue, replacing the notification consumer; the extra hop costs latency, within the 5 to 10 seconds standard and promotional messages allow."
    kind: mechanism
    weight: core
    teach:
      - "Now a CDC pipeline, change data capture, watches the outbox and publishes each new row to the Kafka queue. The flow after that is unchanged, and the notification consumer is no longer needed: the row is saved before Kafka sees it."
      - "The price: a database write and a CDC hop add latency. For standard and promotional messages that is well under 5 to 10 seconds, so they take this durable path."
    draw: [cdc, db-cdc, cdc-queue]
    check: What does the outbox path cost, and why is that acceptable here?
    answer: "Extra latency from the database write and the CDC hop; standard and promotional messages may take 5 to 10 seconds anyway."
asks:
  - ids: [outbox-1, outbox-2]
    beats: [2]
    question: "How would you make sure that once we tell the client 'accepted', the message can never be lost?"
    hints:
      - Store it before you acknowledge.
      - And the event for Kafka has to be saved in the same step as the row.
  - ids: [cdc]
    beats: [3]
    question: "The event now sits in an outbox table. How does it get to Kafka?"
    hints:
      - Something that watches the database for new rows.
      - Databases keep a log of every committed change.
