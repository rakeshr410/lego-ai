beats:
  - point: "The deep dive starts from the high-level picture; the clients and gateway stay, and the gateway's jobs are authentication and authorization, routing, rate limiting and round-robin load balancing."
    kind: component
    weight: core
    teach:
      - "Step five, the deep dive. Copy the high-level design down here and open each box. Clients and gateway don't change; just say what the gateway is responsible for."
      - "Authentication and authorization of each client, routing to the right service, rate limiting, and spreading requests round robin. Rate limiting matters most on a public API; we come back to it at the end."
    draw: [lld, lld-clients, lld-gw, lld-clients-gw, gw-jobs-1, gw-jobs-2]
    check: Name the gateway's jobs.
    answer: "Authentication and authorization, routing, rate limiting, and load balancing round robin."
  - point: "The template service is a plain CRUD API that saves each template as a row in a Postgres database, which is relational."
    kind: component
    weight: core
    teach:
      - "The template service is simple: an API through which a client creates, reads, updates and deletes templates."
      - "Templates are structured, so a relational database, Postgres. Careful: Postgres is relational, not NoSQL."
    draw: [tpl-svc, gw-tpl, tpl-db, tpl-svc-db]
    check: Why is Postgres a good fit for templates?
    answer: "Templates are small structured rows read by id and version; a relational database fits."
    misconceptions:
      - "Postgres is a NoSQL database -> it is relational; a NoSQL store would be a different choice."
  - point: "A template row holds its id, name, type (transactional or promotional), channel, content, variables, version and active flag, with one template per channel because an SMS must be short and an email can be rich."
    kind: decision
    weight: core
    teach:
      - "The table: template id, name, type, transactional or promotional, then channel, content, variables, version, is active, and the timestamps."
      - "Why a channel? An email can carry a long description and pictures; an SMS must be short or nobody reads it. So each channel gets its own template, in versions."
    draw: [tpl-table-1, tpl-table-2, tpl-table-3]
    check: Why does the template table need a channel column?
    answer: "An SMS must be short and an email can be rich, so a client keeps a separate template per channel."
asks:
  - ids: [gw-jobs-1, gw-jobs-2]
    beats: [1]
    question: "The gateway stays as it was. What is it actually responsible for?"
    hints:
      - Who is calling, and are they allowed?
      - Where does the request go, and what if someone sends too many?
  - ids: [tpl-table-1, tpl-table-2, tpl-table-3]
    beats: [3]
    question: "What columns would the templates table need?"
    hints:
      - Think about what we send in the request, the variables.
      - Is a template the same for an SMS and an email? And can it change over time?
