beats:
  - point: "Reading the functional lines gives the entities: the user, the notification preference, the notification content, the template and the delivery status."
    kind: component
    weight: core
    teach:
      - "Step two: the core entities, read straight off the functional requirements."
      - "The user; the preference the user sets; the notification content, the text that is sent; the template, its format; and the delivery status."
    draw: [entities, ent-user, ent-pref, ent-content, ent-template, ent-status]
    check: Which requirement gives us the delivery status entity?
    answer: Tracking delivery status for the reporting dashboard.
  - point: "There is one more: the client. The client is a company like Amazon calling the API, the user is a person using its app, and preferences belong to the person."
    kind: component
    weight: core
    teach:
      - "In earlier designs client and user were the same. Not here: the client is an organisation, Amazon or Flipkart, using our open API; the user is a person using that app."
      - "Why keep both? Amazon will not store how each customer wants to be reached; that is the person's choice, so we keep it per client and per user."
    draw: [ent-client-is, ent-user-is]
    check: Why must the service know both the client and the user?
    answer: "The client is who calls and pays; the user is who receives, and the preference is the person's own choice, kept per client."
    misconceptions:
      - "The client stores its users' preferences -> the person sets them through the client's app, and this service keeps them per client and user."
asks:
  - list: entity-list
    beats: [1]
    question: "Looking at the requirements, what are the core entities, the things this system keeps track of?"
    hints:
      - Go down the functional list line by line.
      - Who receives, what do they choose, what is sent, in what format, and what happens to it?
