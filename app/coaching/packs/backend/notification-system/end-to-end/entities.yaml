# Notification system interview, core entities: "2. Core entities" under the functional list, five lines, and beside them the client (a company) and the user (a person), as in the video.
id: backend/notification-system/end-to-end/entities
title: Six entities, and client versus user
source:
  hash: "b9a4ce159c01"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/notification-system/end-to-end/requirements
  assumes:
    - "Functional: channels, templates, user preferences, immediate or scheduled sends, delivery status."
  carries:
    - "Core entities: user and client, notification preference, notification content, template, delivery status."
    - "The client is the calling company; the user is the person; preferences belong to the person, per client."
  terms:
    - term: client
      means: "A company or application, like Amazon or Uber, that calls the service's open API."
    - term: user
      means: "A person using a client's app, who receives the notifications."
