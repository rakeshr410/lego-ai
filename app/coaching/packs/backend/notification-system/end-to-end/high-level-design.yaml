beats:
  - point: "The clients are companies, and because this is a set of microservices at large scale, an API gateway and load balancer stands in front of everything."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. First the clients, and remember they are companies, Amazon or Uber, not people."
      - "At this scale it is microservices, not a monolith, so an API gateway and load balancer sits right after the clients."
    draw: [hld, hld-clients, hld-gw, hld-clients-gw]
    check: Why put a gateway in front at all?
    answer: "Many microservices at a large scale need one entry point that authenticates, routes and balances the load."
  - point: "A template service saves templates in a template DB, and a user preference service saves preferences in its own DB; both requests come through the client."
    kind: component
    weight: core
    teach:
      - "Before any send, the client sets up a template: the gateway routes it to a template service, which persists it in a template DB."
      - "Preferences get their own service and database. A person can't call us directly, so the change comes through the client's app."
    draw: [hld-tpl-svc, hld-gw-tpl, hld-tpl-db, hld-tpl-db-arrow, hld-pref-svc, hld-gw-pref, hld-pref-db, hld-pref-db-arrow]
    check: Where does a preference change come from?
    answer: "From the person, through the client's app and our gateway, to the user preference service."
  - point: "Sending goes to a notification service that checks the user's preferences and hands the message to a notification provider, kept as a black box for now."
    kind: flow
    weight: core
    teach:
      - "The core: a notification service. It checks the user's preference and hands the message to a notification provider, a third party, an SMTP server for email, say."
      - "Keep it a black box, email, in-app or SMS. How the hand-off works at a million a minute is the deep dive."
    draw: [hld-notif-svc, hld-gw-notif, hld-provider, hld-notif-provider, hld-notif-pref, hld-provider-note]
    check: What is left black-boxed in this design?
    answer: "The notification provider: how messages are handed over and delivered on each channel."
asks:
  - ids: [hld-tpl-svc, hld-pref-svc, hld-notif-svc]
    beats: [2, 3]
    question: "Behind the gateway, which services do we need to cover the requirements? Name them and I'll draw them."
    hints:
      - Look at the endpoints we wrote; each group has an owner.
      - Templates, preferences, and something that does the sending.
task:
  prompt: "Draw the high-level design: clients, an API gateway and load balancer, a template service with its DB, a user preference service with its DB, and a notification service that checks preferences and hands messages to a notification provider."
  expects: [1, 2, 3]
