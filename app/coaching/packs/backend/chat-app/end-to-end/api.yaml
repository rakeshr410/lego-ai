# Chat app interview, API: "3. API Designing" beside the entities: the register POST on top, the one-to-one calls on the left (WS send, the chat list, a chat's messages), the group calls on the right (create, add, remove, WS send, the group's messages), as in the video; receipts have no endpoint.
id: backend/chat-app/end-to-end/api
title: REST for the rest, a WebSocket for messages
source:
  hash: "0415ae35e684"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/chat-app/end-to-end/entities
  assumes:
    - "Functional: register, one-to-one and group messaging, text and media, history, receipts."
    - "The core entities are the user, the group and the message."
  carries:
    - "POST /v1/user/register with the user's details; WS /v1/messages/send for messages; GET /v1/chat/{userId} and GET /v1/message/{userId}/{receiverId} for history, lazy loaded."
    - "Groups: POST create, add and remove; the same WS send to a group id; GET /v1/groups/{groupId}/messages."
    - Receipts have no REST endpoint; they ride the WebSocket.
  terms:
    - term: WebSocket
      means: "A persistent two-way connection between the app and a server; written WS on the board."
    - term: lazy load
      means: "The next block of older messages is fetched as the user scrolls up, asked for with a cursor."
