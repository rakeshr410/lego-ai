beats:
  - point: "The user service registers users and, at login, checks the user DB and returns a JWT or session id; the user row is flat relational data in Postgres."
    kind: mechanism
    weight: core
    teach:
      - "Step five, the low-level design: we take the high-level picture and open each service, easiest first. The user service registers users, and at login checks the credentials and hands back a JWT or a session id that every later call carries."
      - "User data is flat and relational, so Postgres; MySQL would do just as well. The row: user id, username, email, phone, status, last seen, metadata. WhatsApp needs no email, Messenger no phone."
    draw: [lld-ug, ug-user-head, ug-userdb-1, ug-userdb-2]
    check: What does the user row need for this product, and what can you drop?
    answer: "User id, username, phone or email, status, last seen and metadata; WhatsApp can drop the email, Messenger the phone."
    misconceptions:
      - "Postgres is much easier to scale than MySQL, so it must be Postgres -> both fit flat user rows; neither choice decides the design."
  - point: "The group service creates and edits groups and returns a group's members; its group table holds groupId, groupName, description and metadata."
    kind: mechanism
    weight: core
    teach:
      - "The group service: create a group, change its details, and given a group id, return its members."
      - "Its Postgres database, first table: group id, group name, description, and metadata such as when it was created and its picture."
    draw: [ug-group-head, ug-groupdb-1, ug-groupdb-2]
    check: What question will the chat service ask the group service later?
    answer: "Who are the members of this group id."
  - point: "A group mapping table records membership, one row per member with its own id; group id and user id together are unique."
    kind: decision
    weight: core
    teach:
      - "Second table: which user is in which group. Group id, user id, join date. A group id repeats once per member, so it cannot be the key; the row gets its own id."
      - "And make group id with user id unique, so nobody is added twice, with an index on user id to list a user's groups."
    draw: [ug-map-1, ug-map-2, ug-map-key]
    check: Why can the group id not be the mapping table's key?
    answer: It repeats once per member; each row needs its own id, and the pair of group id and user id is what must be unique.
asks:
  - ids: [ug-userdb-1]
    beats: [1]
    question: "What would you keep about each user, and in what kind of database?"
    hints:
      - Think of what the login and the profile screen need.
      - Is this data flat and relational, or something else?
  - ids: [ug-map-1]
    beats: [3]
    question: "How would you record which users are in which group?"
    hints:
      - A group has many members, and a user is in many groups.
      - What would one row of that table hold?
