  after: backend/chat-app/end-to-end/problem-statement
  assumes:
    - "Users send and receive messages, one-to-one or in groups, in near real time."
  carries:
    - "Functional: register and log in; one-to-one messaging; group messaging; text and media; message history; sent, delivered and read receipts."
    - "Non-functional: 1 billion users, 100 messages a day each, 100 billion messages and about 100 TB a day; availability over consistency; under 300 ms; zero message loss."
  terms:
