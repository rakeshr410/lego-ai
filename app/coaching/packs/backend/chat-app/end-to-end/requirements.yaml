beats:
  - point: "The core functional requirements: users register and log in, and they message one-to-one and in groups."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: what the system does. First, users must register and log in; on WhatsApp that is with a phone number."
      - "Then one-to-one messaging, and on top of it group messaging."
    draw: [fr, fr-register, fr-one, fr-group]
    check: What are the three things a user must be able to do before anything else?
    answer: "Register and log in, message one friend, and message a group."
  - point: "Three more: send media as well as text, see a chat's message history, and get sent, delivered and read receipts."
    kind: requirement
    weight: core
    teach:
      - "Not only text: images and videos too. And the history of every chat, to scroll back through."
      - "Last, the ticks: whether the message reached our server, whether it was delivered to the friend, and whether they read it."
    draw: [fr-media, fr-history, fr-receipts]
    check: Which three states do the receipts show?
    answer: "Sent to the server, delivered to the receiver, and read."
  - point: "Scale first: a billion users sending 100 messages a day is 100 billion messages, and at about 1 KB each, about 100 TB a day."
    kind: metric
    weight: core
    teach:
      - "On the right, the non-functional requirements, and the first to ask for is scale. Say a billion users, each sending a hundred messages a day: a hundred billion messages a day."
      - "Do the arithmetic out loud: at about a kilobyte a message, a kilobyte times a hundred billion is a hundred terabytes a day. One kilobyte is an average for text; photos and videos are far bigger and will live in blob storage."
    draw: [nfr, nfr-scale, nfr-volume]
    check: "A billion users, 100 messages a day each, 1 KB a message. How much data a day?"
    answer: "100 billion messages, about 100 TB a day."
    misconceptions:
      - "1 KB times 100 billion is 1 TB -> it is 100 TB; 100 billion kilobytes is 10^14 bytes."
  - point: "Availability over consistency: the app must be up at any moment, and eventual consistency is fine because this is not a bank."
    kind: requirement
    weight: core
    teach:
      - "Then CAP. In a distributed system, when the network splits we choose availability or consistency. A chat app must always be usable, zero or negligible downtime."
      - "So availability wins, and eventual consistency is enough; we are not moving money."
    draw: [nfr-cap]
    check: Why is eventual consistency acceptable here?
    answer: "It is not a bank; a message that appears a moment late on another device harms no one, while downtime stops everyone."
  - point: "Quantify latency, under 300 ms from sender to receiver, and reliability, zero messages lost."
    kind: metric
    weight: core
    teach:
      - "Low latency, with a number: a message should get from the sender to the receiver in under 300 milliseconds."
      - "And highly reliable: once sent, a message is never lost, even if the friend is offline for days."
    draw: [nfr-latency, nfr-reliable]
    check: How would you state the latency requirement?
    answer: "Under 300 ms from sender to receiver, as a number and where it applies."
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should this chat app let users do? Tell me the features one at a time, and I'll write them down."
    hints:
      - Start with getting into the app, then who you can message.
      - And beyond plain text, and beyond sending, what does a user see?
  - list: nfr-list
    beats: [3, 4, 5]
    question: "Now the qualities. How many users, how fast, how reliable? Numbers if you have them."
    hints:
      - Start with the number of users and how many messages each sends.
      - Then how fast a message must arrive, and whether one may ever be lost.
