# Chat app interview, low-level design, offline users: the video adds a "Redis Stream" (messages, channel) fed by every chat server, a "Message Svc" consumer writing to "Chat DB", the "ChatDB (Cassandra DB) - writeDB" columns beside it, and a "Notification Svc" to "FCM/APN". Corrected: Pub/Sub channels and streams are different Redis tools, Cassandra has no auto-increment.
