context:
  after: backend/chat-app/end-to-end/lld-websocket
  assumes:
    - "Chat servers hold WebSockets behind a WebSocket gateway; a Redis registry maps each user to their server, with a TTL."
    - "Non-functional: 100 billion messages a day, under 300 ms, zero message loss."
  carries:
    - "Chat servers hand messages to a Redis stream; each server also listens on a channel of its own for its online users."
    - "A message service consumes the stream into the chat DB, Cassandra, partitioned by chatId and ordered by a time-ordered messageId."
    - "A notification service pushes offline users a new-message alert through FCM and APNs."
  terms:
    - term: Redis stream
      means: "An append-only log in Redis, read by consumer groups that acknowledge each entry."
    - term: Pub/Sub channel
      means: "Redis delivery to whoever is listening right now; nothing is kept."
    - term: partition key
      means: "The Cassandra column that decides which node holds a row; here the chat id."
