beats:
  - point: "The users are the phone apps, and at a billion users they come in through a load balancer and API gateway that authenticates, routes, rate limits and spreads traffic round robin."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design: just enough to meet the functional list. On the left, the users, which are the apps on their phones."
      - "A billion users need a load balancer and API gateway in front: authentication and authorization, routing, rate limiting, and round robin across the servers behind it."
    draw: [hld, hld-user-1, hld-user-2, hld-user-3, hld-clients-note, hld-lb, hld-u1-lb, hld-u2-lb, hld-u3-lb, hld-lb-note]
    check: What does the gateway do for every call?
    answer: "Authenticates and authorizes it, rate limits it, and routes it, round robin across the servers."
  - point: "Register and log in need a user service that keeps users in a user database."
    kind: component
    weight: core
    teach:
      - "The first requirement, register and log in: a user service, and since it must keep the users, a user database."
    draw: [hld-user-svc, hld-lb-user, hld-userdb, hld-user-db]
    check: Which box handles sign-up, and where does it keep users?
    answer: The user service, in the user database.
  - point: "Messages need a chat service, the heart of the system: text goes to a chat database, images and videos to blob storage such as S3."
    kind: component
    weight: core
    teach:
      - "Sending messages needs a chat service, the core of the system, and whatever it receives must be saved: a chat database."
      - "Media files do not belong in a database. Images and videos go to blob storage, an S3 bucket; the text goes to the chat database."
    draw: [hld-chat-svc, hld-lb-chat, hld-chatdb, hld-chat-db, hld-blob, hld-chat-blob]
    check: Why does the chat service need two stores?
    answer: "Text goes in the chat database; images and videos are large files that belong in blob storage."
  - point: "Group messages ride the same chat service, so groups only need a group service to manage them and a group database."
    kind: component
    weight: core
    teach:
      - "Group messaging follows the same path, through the chat service. What is new is managing the groups: a group service with its own group database."
      - "That meets every functional requirement on paper. How the chat service really gets a message to a friend is the low-level design, and it is far from simple."
    draw: [hld-group-svc, hld-lb-group, hld-groupdb, hld-group-db]
    check: Why is there no separate service for sending group messages?
    answer: They go through the chat service like any message; the group service only manages groups and their members.
asks:
  - ids: [hld-user-svc, hld-userdb]
    beats: [2]
    question: "Behind the gateway, what do we need for register and log in? Name the pieces and I'll draw them."
    hints:
      - Something has to handle the call.
      - And the users have to be kept somewhere.
  - ids: [hld-chatdb, hld-blob]
    beats: [3]
    question: "The chat service receives text and photos. Where would you keep each?"
    hints:
      - Text is small and structured.
      - Would you put a video file in a database row?
  - ids: [hld-group-svc, hld-groupdb]
    beats: [4]
    question: "And for groups, what is missing from the picture?"
    hints:
      - Group messages can travel the same way as any message.
      - But who creates groups and remembers their members?
task:
  prompt: "Draw the high-level design: users, the load balancer and API gateway, the user, chat and group services, and their stores, with the chat service writing text to the chat DB and media to blob storage."
  expects: [1, 2, 3, 4]
