beats:
  - point: "Plain HTTP is request and response: the server cannot speak first, so to see replies the client would send GETs forever, mostly finding nothing."
    kind: failure
    weight: core
    teach:
      - "The chat service is the heart, so before designing it, list the ways a client and server can talk. First, plain HTTP: the client sends a request, the server answers. One direction at a time."
      - "For chat that means a POST to send, then GET after GET to see if the friend replied. If they never reply, every one of those calls is wasted."
    draw: [conn, conn-http, v-http]
    check: Why does plain HTTP fit chat badly?
    answer: "The server cannot push, so the client must keep polling with GETs, most of which find nothing."
  - point: "Long polling holds the request open until data arrives or a timeout, say 30 seconds, then the client asks again: it works, but a quiet friend means a new request every 30 seconds."
    kind: failure
    weight: supporting
    teach:
      - "Long polling: the client asks, and the server keeps the request open until it has something or a timeout, say 30 seconds."
      - "It can work. But nobody knows when the friend will reply, so the client reopens every 30 seconds, and sending is still a separate POST."
    draw: [conn-long, v-long]
    check: What happens with long polling when your friend does not reply for ten minutes?
    answer: "The request times out about every 30 seconds and the client opens a new one, around twenty requests for nothing."
  - point: "Server-sent events let the server push a one-way stream to the client, and an event can carry the message itself; but every message sent still needs its own HTTP request."
    kind: failure
    weight: core
    teach:
      - "Server-sent events: the server pushes events to the client, one way. A new message can arrive in an event, message and all."
      - "The other direction is the problem: each message the user sends is still a separate HTTP call. Two channels for one conversation, at a billion users."
    draw: [conn-sse, v-sse]
    check: What is the real limitation of server-sent events for chat?
    answer: "They only flow from server to client, so every sent message still needs its own HTTP request."
    misconceptions:
      - "An SSE event only says new data exists, so the client must fetch it -> an event can carry the message itself; the gap is sending, which SSE cannot do."
  - point: "A WebSocket is one persistent, full-duplex connection: sending, receiving and receipts all ride it, so the chat service runs on WebSockets."
    kind: decision
    weight: core
    teach:
      - "WebSocket: after a handshake, the connection stays open and both sides send whenever they like, even at the same moment. Full duplex."
      - "One connection does the sending, the receiving and the ticks, with no polling and no waiting. That is why the chat service runs on WebSockets."
    draw: [conn-ws, v-ws]
    check: Why choose a WebSocket for the chat service?
    answer: "One persistent two-way connection carries sends, receives and receipts at once, with no polling."
asks:
  - list: conn-list
    beats: [1, 2, 3, 4]
    question: "What ways do you know for a client and a server to talk? Start from plain HTTP and give me as many as you can."
    hints:
      - "There's a trick where the server holds a request open, and another where it streams events."
      - And one where both sides keep a connection open and talk freely.
