  after: backend/chat-app/end-to-end/lld-user-group
  assumes:
    - "Non-functional: under 300 ms sender to receiver, 1 billion users."
    - "Sending a message is written WS in the API."
  carries:
    - "HTTP: the server cannot speak first, so chat would poll forever."
    - "Long polling: held open until data or a timeout, about 30 s, then reopened."
    - "Server-sent events: the server pushes one way; every send still needs an HTTP request."
    - "WebSocket: one persistent full-duplex connection for sending, receiving and receipts; chosen."
  terms:
    - term: long polling
      means: "The server holds the client's request open until it has data or a timeout, then the client asks again."
    - term: server-sent events
      means: "A one-way stream of events from server to client over HTTP."
    - term: full duplex
      means: Both sides can send at the same time on one connection.
