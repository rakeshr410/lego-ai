# Chat app interview, low-level design, connections: before the chat service, the video lists "1. HTTP 2. Long Polling 3. Server Sent Event (SSE) 4. Websocket" under the diagram and weighs each for chat; here the list, with each one's verdict beside it. The video says an SSE notification makes the client fetch the message; corrected: an event can carry the message, the problem is that sending still needs HTTP.
id: backend/chat-app/end-to-end/lld-connections
title: "Low-level design: four ways to connect"
