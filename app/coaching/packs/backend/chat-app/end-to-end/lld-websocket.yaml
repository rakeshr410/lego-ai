beats:
  - point: "The low-level picture starts as the high-level design copied down: users, the API gateway, the user service and the group service with their databases; the chat service is taken out to be rebuilt."
    kind: component
    weight: supporting
    teach:
      - "Copy the high-level design down: the users, here user 1 and user 4, the load balancer and API gateway, the user service with its UserDB and the group service with its Group DB."
      - "The chat service is the one we rebuild, so it comes out of the copy."
    draw: [w-head, w-user-1, w-user-4, w-lb, w-u1-lb, w-u4-lb, w-lb-note, w-user-svc, w-lb-user, w-userdb, w-user-db, w-group-svc, w-lb-group, w-groupdb, w-group-db]
    check: Which box of the high-level design is being rebuilt, and why?
    answer: "The chat service, because it has to run on WebSockets and is the heart of the system."
  - point: "The chat service becomes several WebSocket chat servers behind a dedicated WebSocket gateway and load balancer, doing authentication, rate limiting and routing; phones talk to both gateways."
    kind: component
    weight: core
    teach:
      - "Millions of users are connected at once, so the chat service is replicated: chat servers one, two and three, each holding WebSocket connections."
      - "Most load balancers handle HTTP and WebSockets alike, but this traffic lives on long connections, so give it a gateway of its own, with the same duties: authentication and authorization, rate limiting, routing. The phones send REST calls to the API gateway and chat to the WebSocket gateway."
    draw: [w-ws-gw, w-u1-ws, w-u4-ws, w-ws-note, w-chat-1, w-ws-c1, w-chat-2, w-ws-c2, w-chat-3, w-ws-c3]
    check: Why give the chat servers a gateway of their own?
    answer: "Their traffic is long-lived WebSocket connections, unlike short REST calls, so a dedicated gateway handles their auth, rate limits and routing."
  - point: "A WebSocket begins as an HTTP request asking to upgrade; the server answers 101 Switching Protocols, then messages flow both ways until either side closes."
    kind: mechanism
    weight: core
    teach:
      - "You cannot open a WebSocket directly. Step one, the client sends an ordinary HTTP request asking to upgrade. Step two, the server validates it and answers 101, switching protocols."
      - "Step three, messages flow both ways on that one connection. Step four, either side closes it. Every WebSocket starts life as an HTTP call."
    draw: [w-hs, hs-1, hs-2, hs-3, hs-4]
    check: How does a WebSocket connection get established?
    answer: "An HTTP request asks to upgrade, the server answers 101 Switching Protocols, and the connection then carries messages both ways."
  - point: "User 1 and user 4 sit on different chat servers, so the sender's server looks user 4 up in a WebSocket registry in Redis, keyed by user id, and forwards the message to user 4's server."
    kind: mechanism
    weight: core
    teach:
      - "User 1 sends: message, from user 1, to user 4. User 1 is on chat server 3, user 4 on chat server 2. Server 3 must find where user 4 is."
      - "So keep a registry in a Redis cache: user id to chat server and connection. It is a key look-up by user id, never a scan, so it stays inside 300 milliseconds. Server 3 finds user 4 on server 2 and forwards the message; server 2 writes it down user 4's socket. The gateway records each new connection there too."
    draw: [w-send, w-registry, w-c3-reg, w-ws-reg, w-c3-c2, w-reg-1, w-reg-2]
    check: How does chat server 3 deliver a message to user 4, who is on chat server 2?
    answer: "It looks user 4 up in the registry by user id, finds chat server 2, and forwards the message there to go down user 4's socket."
    misconceptions:
      - "The server scans the whole user-to-connection map for each message -> it is a key look-up by user id in Redis."
  - point: "Each registry entry has a TTL refreshed by heartbeats, so when a phone drops off its entry expires after about a minute; a reconnect may land on any server, which writes a new entry."
    kind: mechanism
    weight: core
    teach:
      - "Connections are heavy, and phones drop off networks. So each entry carries a TTL: heartbeats refresh it while the app is open, and about a minute after they stop, the entry is gone, so the registry never points at a dead socket."
      - "When user 4 comes back, the new connection may land on any chat server, and that server writes a fresh entry."
    draw: [w-ttl]
    check: User 4 loses signal. What happens to their registry entry?
    answer: "Heartbeats stop, the TTL runs out after about a minute, and the entry disappears until they reconnect and a server writes a new one."
    misconceptions:
      - "A reconnecting user must go back to the same chat server -> any server can take the new connection; it just updates the registry."
asks:
  - ids: [w-ws-gw]
    beats: [2]
    question: "We now have several WebSocket chat servers. What sits in front of them, and why not just reuse the API gateway?"
    hints:
      - Something still has to authenticate and spread the connections.
      - How long does a chat connection live compared with a REST call?
  - ids: [w-registry]
    beats: [4]
    question: "User 1 is on chat server 3, user 4 on chat server 2. How does server 3 know where to send user 4's message?"
    hints:
      - Something must remember which server each user is connected to.
      - It must answer in a millisecond or two, by user id.
