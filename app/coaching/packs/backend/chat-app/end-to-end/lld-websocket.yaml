context:
  after: backend/chat-app/end-to-end/lld-connections
  assumes:
    - "The chat service runs on WebSockets: one persistent full-duplex connection per user."
    - "The high-level design: users, the API gateway, user, chat and group services with their stores."
    - "Non-functional: under 300 ms sender to receiver, 1 billion users."
  carries:
    - "Chat servers are replicated behind a dedicated WebSocket gateway and load balancer; REST calls still go through the API gateway."
    - "A WebSocket starts as an HTTP request asking to upgrade, answered 101 Switching Protocols, then both ways until one side closes."
    - "A WebSocket registry in Redis maps user id to chat server and connection, looked up by key; each entry has a TTL refreshed by heartbeats."
  terms:
    - term: WebSocket registry
      means: "Redis keys from user id to the chat server and connection holding that user."
    - term: TTL
      means: "Time to live: the entry expires unless heartbeats refresh it."
    - term: handshake
      means: "The HTTP exchange that upgrades a connection to a WebSocket."
