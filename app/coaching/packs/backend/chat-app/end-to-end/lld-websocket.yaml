# Chat app interview, low-level design, WebSocket chat servers: the video copies the high-level design, removes the chat service and draws, under the "LB + Gateway", a "WebSocket Gateway+LB" feeding three "Chat Svc (WS)" boxes, the four-step handshake, send(msg, user1, user4), and the "Redis Cache, Websocket Registry" of user to connection with a TTL. Corrected: the registry is a key look-up, not a scan, and a reconnect may land on any server.
id: backend/chat-app/end-to-end/lld-websocket
title: "Low-level design: WebSocket servers and the registry"
