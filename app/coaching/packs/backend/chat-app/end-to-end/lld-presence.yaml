# Chat app interview, low-level design, presence, pending messages and receipts: the video's last additions: a "User management Svc" that updates status and last seen from the "Websocket Registry", a "Msg Svc" that "retrieves all unsend msg" from Chat DB when a user connects, the ticks over the WebSocket, then the data flow read back. Corrected: key-expiry events, not CDC, from Redis; look up by receiver, not a scan; read is blue ticks; order by messageId.
