beats:
  - point: "A user is online while the registry holds their entry; when it expires, a key-expiry event tells a user management service to save their last seen time in the user DB."
    kind: mechanism
    weight: core
    teach:
      - "Who is online falls out of the registry: if your entry is there, your WebSocket is alive, so you are online."
      - "When the TTL runs out, Redis can announce the expiry. A user management service hears it and saves last seen in the user database, which is what friends see as last seen at."
    draw: [p-presence, p-reg-presence, p-pres-1, p-pres-2]
    check: How does the system know when a user was last seen?
    answer: "When their registry entry expires, a key-expiry event reaches the user management service, which saves lastSeen in the user DB."
    misconceptions:
      - "A CDC pipeline on Redis reports the expiry -> Redis has no CDC for this; it can publish key-expiry events, or the chat server reports the disconnect."
  - point: "When a user connects, the chat server asks an undelivered-message service for what is waiting, looked up by receiver and status rather than a scan, and sends it down the new socket."
    kind: mechanism
    weight: core
    teach:
      - "User 4 comes back. Once the WebSocket is up, the chat server asks a message service: anything waiting for user 4? It fetches the undelivered messages from the chat DB and sends them down the socket."
      - "Find them by receiver and status, in a table keyed by receiver, an inbox of undelivered messages, never by scanning the whole chat DB."
    draw: [p-unsent, p-c1-unsent, p-unsent-db, p-unsent-note]
    check: How does a returning user get what they missed?
    answer: "On connect, the chat server fetches their undelivered messages by receiver from the chat DB and sends them over the WebSocket."
  - point: "Receipts ride the WebSocket: one tick when the server has stored the message, two when the receiver's phone acknowledges it, blue when the phone reports it was read; each updates deliveryStatus."
    kind: mechanism
    weight: core
    teach:
      - "The ticks need no endpoint. One tick: the server stored the message. Two ticks: the receiver's phone acknowledged it over its socket, status delivered."
      - "Blue ticks: the receiver opened the chat and the phone reported it, status read. Each change goes back to the sender over their socket."
    draw: [p-r1, p-r2, p-r3]
    check: Which event turns two grey ticks blue?
    answer: "The receiver's phone reporting that the chat was opened; the status becomes read."
    misconceptions:
      - "Read shows as a double tick -> two grey ticks mean delivered; blue ticks mean read."
  - point: "The whole flow: register, connect by upgrade and register in the registry, catch up, then send online through the receiver's server or offline through the stream, groups fanned out, each chat ordered by messageId."
    kind: flow
    weight: core
    teach:
      - "Read the data flow back. Register with the user service. Connect: no registry entry, so the HTTP request upgrades to a WebSocket and an entry is written. Catch up on undelivered messages and ack them."
      - "Send: if the receiver is online, the registry names their server and the message is delivered; if not, the stream stores it and a push goes out. A group is each member in turn. Order each chat by its message id, assigned by the server, not by phones' clocks."
      - "Then check the requirements on the right: scale and writes from Cassandra and the stream, availability with no single box on the path, latency from WebSockets and the registry look-up, no loss from storing before the tick."
    draw: [p-order]
    check: User 1 messages user 4, who is offline. Walk me through it.
    answer: "Chat server finds no registry entry, puts the message in the stream, the message service stores it in Cassandra, a push goes out, and on reconnect it is fetched and delivered."
asks:
  - ids: [p-presence]
    beats: [1]
    question: "How would you show whether a friend is online, and their last seen time?"
    hints:
      - Which store already knows who has a live connection?
      - What happens to that entry when the connection dies?
  - ids: [p-unsent]
    beats: [2]
    question: "User 4 was offline for a day and just opened the app. How do they get the messages they missed?"
    hints:
      - The messages are in the chat DB, marked undelivered.
      - Who should fetch them, and when?
