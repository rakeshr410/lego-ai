context:
  after: backend/chat-app/end-to-end/lld-offline
  assumes:
    - "Online delivery goes through the registry to the receiver's chat server; offline messages go into the Redis stream, the chat DB and a push."
    - "The group service returns a group's members."
  carries:
    - "A group message is sent to each member separately, online or offline, so each has their own receipts."
    - "Media is uploaded over HTTP to a media upload service, stored in S3, and its URL sent as a message."
