# Chat app interview, low-level design, groups and media: as the video goes on, the chat server asks the "Group Svc" for members; a "Media Upload Svc" stores images and video in "S3" and returns the URL; a "Msg Search Svc" reads "Elastic Search", fed from "Chat DB"; a "CDN" in front of S3; phones keep history locally. Corrected: Elasticsearch indexes a CDC copy, it does not query the chat DB; WhatsApp deletes messages once delivered.
id: backend/chat-app/end-to-end/lld-group-media
title: "Low-level design: groups, media, search"
