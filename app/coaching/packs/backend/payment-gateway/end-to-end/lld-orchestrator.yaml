beats:
  - point: "Each merchant chose its processor at onboarding, often on fees; the checkout backend hands the token to an orchestrator service, which reads that choice from a merchant preference DB."
    kind: component
    weight: core
    teach:
      - "The backend holds a token. Which processor gets the payment? The merchant chose when it onboarded, often on price: one processor takes 1 percent, another 2."
      - "So the backend hands the token to an orchestrator service, which first reads the merchant preference DB: this merchant goes to Razorpay, say."
    draw: [dd-orch, dd-backend-orch, dd-prefs, dd-orch-prefs]
    check: How does the gateway know which processor to send a merchant's payment to?
    answer: "The orchestrator reads the merchant preference DB, where the merchant's choice from onboarding is stored."
  - point: "Every processor wants a different request, so the orchestrator talks to them through connectors, one per processor, the adapter pattern."
    kind: decision
    weight: core
    teach:
      - "Each processor's request body is different. Use the adapter pattern: a connector per processor. A Razorpay connector only calls Razorpay, a PayU connector only PayU, a Fiserv connector only Fiserv."
      - "The orchestrator builds one internal request; the connector turns it into its processor's format. A new processor is a new connector, not a change to the orchestrator."
    draw: [dd-razorpay, dd-orch-razorpay, dd-payu, dd-orch-payu, dd-fiserv, dd-orch-fiserv]
    check: What does adding a new processor cost with connectors?
    answer: "One new connector that speaks its format; the orchestrator does not change."
  - point: "Connectors call the processor's gateway, which reaches the processors and the banks; from there on it is outside the design."
    kind: flow
    weight: supporting
    teach:
      - "Each connector calls the processor's gateway, an external system; behind it the processors talk to the banks."
      - "Draw it dashed: up to the connectors is ours, the rest is out of scope."
    draw: [dd-proc-gw, dd-razorpay-gw, dd-payu-gw, dd-fiserv-gw, dd-processors, dd-gw-processors]
    check: Where does our system end?
    answer: "At the connectors; the processor gateway and the processors behind it are external."
  - point: "Before calling, the orchestrator records the transaction in the payment processor DB with status sent: id, intent id, status, amount, currency, merchant, method and the card token."
    kind: mechanism
    weight: core
    teach:
      - "Something I skipped: before the call, the orchestrator saves the transaction in the payment processor DB, the core table of every payment, relational too."
      - "The row: transaction id, intent id, status, amount and currency, merchant, payment method, and the card token, never the card. Status starts as sent."
    draw: [dd-txn-db, dd-orch-txn, dd-txn-row-1, dd-txn-row-2, dd-txn-row-3]
    check: Why write the transaction before calling the processor?
    answer: "So the payment is on record as sent even if the call or the answer is lost; it can then be matched to the result."
  - point: "The result comes back later to a collector callback service, because an outside party cannot answer at once and many methods finish asynchronously; only the orchestrator writes the status, so nothing races, and it becomes done."
    kind: mechanism
    weight: core
    teach:
      - "We cannot expect an outside system to answer in zero seconds; 3-D Secure, UPI and bank redirects finish later. So the result comes back to a collector callback service, thousands of them."
      - "Who updates the status? Only the orchestrator. If other services wrote it too, two could race and leave it duplicated or inconsistent. One writer: sent, then done, succeeded or failed."
    draw: [dd-callback, dd-gw-callback]
    check: Why is the orchestrator the only service that writes the status?
    answer: "One writer means no two services race on the row, so the status can't end up duplicated or inconsistent."
    misconceptions:
      - "The callback service should write the status itself, it gets the result first -> several writers race; one owner keeps it consistent."
  - point: "The hosted page polls the checkout backend for the payment's status and shows success or failure when it changes; the merchant learns by webhook."
    kind: flow
    weight: core
    teach:
      - "How does the buyer's page find out? It polls the checkout backend with the payment id, and the backend reads the status from the payment processor DB. When it changes, the page says success or failed."
      - "The merchant gets the result by webhook, server to server."
    draw: [dd-poll, dd-webhook]
    check: How does the card page learn that the payment went through?
    answer: "It keeps polling the checkout backend, which reads the status from the payment processor DB."
asks:
  - ids: [dd-orch]
    beats: [1]
    question: "The backend now has a token. What would decide which processor gets this payment, and call it?"
    hints:
      - The merchant chose a processor when it signed up.
      - "A service whose job is to direct the payment, like a conductor."
  - ids: [dd-razorpay, dd-payu, dd-fiserv]
    beats: [2]
    question: "Razorpay, PayU and Fiserv each want a different request. How would you keep the orchestrator from knowing all of them?"
    hints:
      - Is there a design pattern for wrapping incompatible interfaces?
      - One small piece per processor.
  - ids: [dd-callback]
    beats: [5]
    question: "The processor won't answer in the same call. How would the result get back to us?"
    hints:
      - The processor calls us back.
      - Something has to be listening for those calls.
