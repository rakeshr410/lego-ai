# Payment gateway interview, deep dive 4: routing to a processor. As in the video, the orchestrator service to the right of the checkout backend, the merchant preference DB beside it, three connectors fanning out to a tall processor gateway with the processors behind it, the payment processor DB the orchestrator writes first, the collector callback service under the processor gateway, and the hosted page polling for the status.
