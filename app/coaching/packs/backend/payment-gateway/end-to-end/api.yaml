beats:
  - point: "A payment is three calls: the merchant sends an intent and gets an intent id; asks for a session and gets the hosted checkout page; then the buyer clicks pay on that page and the card goes straight to the gateway."
    kind: flow
    weight: core
    teach:
      - "Step three. Before listing endpoints, sketch what happens at buy now: the client, the merchant, on one side, the payment gateway on the other."
      - "One: a payment intent. We save it and answer with an intent id. Two: the merchant asks for a session for that intent; we answer with a page, with a timer, where the card is entered."
      - "Three: the buyer fills the card in and clicks pay, and that request comes to us, not to the merchant. We tokenize it and pass it to a processor."
    draw: [api, api-client, api-pg, api-calls, api-step-1, api-step-2, api-step-3]
    check: What does the merchant get back from the first call, and what from the second?
    answer: "An intent id from the first; a session id and the URL of the hosted checkout page from the second."
  - point: "Creating an intent is POST /v1/payment-intents with the amount, currency and order, returning the intent id; creating a session is POST /v1/payment-sessions with that intent id."
    kind: flow
    weight: core
    teach:
      - "Now the endpoints, one per step. POST v1 payment-intents, with the amount, the currency and the order id; no card. It returns the payment intent id."
      - "POST v1 payment-sessions, with the payment intent id. It returns the session id and the page's URL."
    draw: [api-intent, api-intent-body, api-session, api-session-body]
    check: Does the intent call carry any card details?
    answer: "No; it carries the amount, currency and order. The card only ever comes from the hosted page."
  - point: "Paying is POST /v1/checkout/pay from the hosted page with the session id and the card; the status is a GET on /v1/payments/{paymentId}."
    kind: flow
    weight: core
    teach:
      - "POST v1 checkout pay: sent by our page in the buyer's browser, with the session id and the card. The merchant never sends it, so it never handles the card."
      - "And the fourth requirement, tracking: GET v1 payments with the payment id returns the status."
    draw: [api-pay, api-pay-body, api-status]
    check: Why does the pay call come from the hosted page and not from the merchant's server?
    answer: "So the card goes straight from the buyer to the gateway, and the merchant never holds card data."
    misconceptions:
      - "The merchant collects the card and forwards it -> then the merchant handles card data and carries the PCI burden; the hosted page sends it to the gateway."
  - point: "Every POST carries an idempotency key, so a merchant retrying after a timeout gets the first answer back instead of a second intent or a second charge."
    kind: rule
    weight: supporting
    teach:
      - "One addition worth saying: an idempotency key on every POST. A merchant that times out and retries gets the first answer back, never a second charge."
    draw: [api-idem]
    check: The merchant's intent call times out and it retries. What stops a duplicate?
    answer: "The idempotency key: the gateway sees the same key and returns the first answer."
