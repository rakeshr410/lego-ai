  author: claude
context:
  after: backend/payment-gateway/end-to-end/entities
  assumes:
    - "Functional: payment intent, temporary session page, PCI DSS handling, status tracking."
    - "Entities: merchant, transaction, payment method, customer, webhook event, payment session."
  carries:
    - "A payment makes three calls: create an intent (returns an intent id), create a session (returns a session id and the hosted page's URL), pay (the card, from the hosted page)."
    - "Endpoints: POST /v1/payment-intents, POST /v1/payment-sessions, POST /v1/checkout/pay, GET /v1/payments/{paymentId}."
    - Every POST carries an idempotency key so a retry never charges twice.
  terms:
    - term: idempotency key
      means: "A value the client sends with a POST; a retry with the same key gets the first answer instead of doing the work again."
