context:
  after: backend/payment-gateway/end-to-end/lld-payment-intent
  assumes:
    - "The payment intent service writes the intent to PostgreSQL and returns its id."
    - "Non-functional: 10,000 transactions per second, under 200 ms for the gateway's part."
  carries:
    - "The checkout session service keeps each session in Redis with a 10-minute TTL, which is also the page's countdown."
    - "It returns a session id and a redirect URL on the gateway's domain ending in that id; the id is checked again at pay time."
    - "A checkout frontend service, behind its own load balancer and no API gateway, serves the hosted card page."
  terms:
    - term: TTL
      means: "Time to live: Redis deletes the key by itself when it runs out."
    - term: hosted checkout page
      means: "The gateway's own card form, at pay.gateway.com/checkout/{sessionId}, that the merchant redirects the buyer to."
