# Payment gateway interview, deep dive 2: the checkout session. As in the video, the session box is renamed the checkout session service and writes to Redis beside it, the session response JSON written to the right; then the buyer is redirected, and a checkout frontend service behind its own load balancer, drawn under the API gateway, serves the hosted page.
id: backend/payment-gateway/end-to-end/lld-checkout-session
