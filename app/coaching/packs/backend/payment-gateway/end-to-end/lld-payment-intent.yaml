beats:
  - point: "The deep dive redraws the high-level picture and opens it one call at a time; the merchant still reaches an API gateway and load balancer that authenticate, route and balance."
    kind: component
    weight: core
    teach:
      - "Step five. Copy the high-level design down the board and open each box in the order a payment uses it."
      - "The front stays: the merchant who onboarded us, then the API gateway and load balancer, doing authentication and authorization, routing and load balancing."
    draw: [dd-title, dd-merchant, dd-gateway, dd-merchant-gateway]
    check: What does the API gateway do for every call, before any service sees it?
    answer: "Authenticates and authorizes the merchant, routes the call to its service and balances the load."
  - point: "The payment intent service stores the intent in PostgreSQL: the system chose consistency, and a payment wants transactions that commit whole or not at all."
    kind: decision
    weight: core
    teach:
      - "Buy now sends the intent to the payment intent service, which writes the metadata to the payment intent DB."
      - "Which database? We put consistency first, and a payment wants transactions that either commit whole or not at all, so a relational database: Postgres, or MySQL."
    draw: [dd-intent, dd-gateway-intent, dd-intent-db, dd-intent-save, dd-postgres]
    check: Why a relational database for payment intents?
    answer: "Consistency was chosen over availability, and relational databases give transactions that commit whole or not at all."
    misconceptions:
      - "Any database is fine because the data is small -> the choice follows the consistency requirement: transactions matter more than size here."
  - point: "The intent row holds a generated id, the amount, currency, merchant, customer, order id, payment method type and metadata; the response is only the payment intent id."
    kind: mechanism
    weight: core
    teach:
      - "Write the columns beside the database: the payment intent id we generate, the amount and currency, the merchant, the customer, the order id, the payment method type, and more metadata to check the order against later."
      - "The answer to the merchant is just the payment intent id. That is all this service does."
    draw: [dd-intent-row-1, dd-intent-row-2, dd-intent-row-3, dd-intent-resp]
    check: What does the merchant get back from the intent call?
    answer: The payment intent id; the metadata stays in the gateway's database.
asks:
  - ids: [dd-intent-db]
    beats: [2]
    question: "The intent service has to keep each intent. What kind of database would you pick, given what we said about CAP?"
    hints:
      - We put one of consistency or availability first. Which?
      - What gives you transactions that commit whole or not at all?
