# Payment gateway interview, deep dive 5: events and reconciliation. As in the video, a Kafka broker beside the collector callback service with its two topics written under it, the orchestrator consuming it, and a reconciliation service writing a ledger table into the payment processor DB; the whole deep dive is then read back against the non-functional list.
