beats:
  - point: "The callback service publishes every result to a Kafka topic, payment.processor.callback.status, and the orchestrator consumes it and updates the status: publish and subscribe, with Kafka buffering bursts."
    kind: mechanism
    weight: core
    teach:
      - "I drew the callback handing results straight to the orchestrator. In real life, at thousands a second, make it event driven: the callback service puts each status on a Kafka broker."
      - "Topic one, payment processor callback status: every immediate result. The orchestrator consumes it and updates the row. Publish and subscribe; Kafka holds what arrives faster than it is applied."
    draw: [dd-kafka, dd-callback-kafka, dd-kafka-orch, dd-topic-1]
    check: What does Kafka add between the callback service and the orchestrator?
    answer: "A buffer: results are kept on a topic and the orchestrator consumes them at its own pace without losing any."
  - point: "The first answer is not final: a day later the processor sends the settled status of every transaction, on a second topic, payment.processor.status."
    kind: failure
    weight: core
    teach:
      - "The answer we got is that the order was placed with the bank, not that money moved. It can fail for lack of balance or another reason."
      - "After about a day the processor sends a final status for each transaction. It goes to a second topic, payment processor status, T plus 1."
    draw: [dd-topic-2]
    check: Why is a second, next-day status needed?
    answer: "Because the first result can still change at settlement; the next-day status is the processor's final word."
  - point: "A reconciliation service consumes the next-day topic, tallies each final status against the gateway's record, and writes the outcome to a separate ledger table: who paid, how much, when."
    kind: mechanism
    weight: core
    teach:
      - "Add a reconciliation service. It reads the next-day topic and tallies each final status against the transaction we recorded."
      - "It does not overwrite the transaction table; it writes a separate ledger table in the payment processor DB: who paid, how much, and when. Mismatches are refunded or corrected, which is the three or four days a shop quotes for a failed payment that was debited."
    draw: [dd-recon, dd-kafka-recon, dd-recon-txn, dd-ledger]
    check: A payment showed failed but the bank debited the buyer. What catches it?
    answer: "Reconciliation: the next-day status disagrees with the record, so the ledger shows it and the money is refunded or the payment corrected."
    misconceptions:
      - "Reconciliation just copies the status into the same table -> it tallies against the record and writes a separate ledger, so the history stays."
  - point: "Close by reading the non-functional list back against the board: scale from replicated services and Kafka, consistency from Postgres, one status writer and reconciliation, latency from Redis sessions, security from the hosted page, the PCI zone and the HSM."
    kind: rule
    weight: supporting
    teach:
      - "Finish by reading the requirements on the right against the picture. Scale: services behind load balancers, Kafka for bursts. Consistency: Postgres, a single writer, reconciliation."
      - "Latency: sessions in Redis, one internal hop to tokenize. Security: the card typed into our page, tokenized in the PCI zone with keys in the HSM; nothing outside the zone holds a card number."
    check: Which parts of the design answer the security requirement?
    answer: "The hosted page, so the merchant never sees the card; the PCI zone with tokenization; HSM-held keys; mutual TLS; and tokens everywhere outside the zone."
