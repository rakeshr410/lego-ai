# Payment gateway interview, requirements: "1. Functional requirements" on the left with the out-of-scope line under it, and "Non-functional requirements" on the right, under the definitions, as the video lays them out.
id: backend/payment-gateway/end-to-end/requirements
title: "Two lists, functional and non-functional"
source:
  hash: "935a8d5357eb"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/payment-gateway/end-to-end/problem-statement
  assumes:
    - "The gateway collects and tokenizes card details and routes payments; the processor moves the money."
  carries:
    - "Functional: the merchant creates a payment intent; the gateway gives a temporary session page for the card; card data is handled to PCI DSS; the transaction status is tracked and reported."
    - "Out of scope: part payments, returns and refunds."
    - "Non-functional: 10,000 transactions per second; consistency over availability; under 200 ms for the gateway's part; end-to-end encryption and PCI DSS level 1."
  terms:
    - term: payment intent
      means: "The merchant's statement that a buyer wants to pay an amount for an order, made before any card is involved."
    - term: PCI DSS
      means: The global security standard for every system that stores, processes or transmits cardholder data.
