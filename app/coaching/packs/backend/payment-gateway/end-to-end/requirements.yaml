beats:
  - point: "The first two functional requirements follow a payment: the merchant creates a payment intent, and the gateway gives a temporary session, a hosted page where the buyer enters the card."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: what the gateway does. First, a client, which for us is the merchant, a shop, can create a payment intent: this buyer wants to pay this much."
      - "Second, the gateway creates a temporary session, the page with the card form that appears after buy now. That page is the gateway's, not the shop's."
    draw: [fr, fr-intent, fr-session]
    check: Who builds the page where the buyer types the card number?
    answer: "The gateway; it hands the merchant a temporary session page, so the shop never builds its own card form."
  - point: "Card data must be handled to the PCI DSS standard, and the transaction's status must be tracked and reported back to the merchant."
    kind: requirement
    weight: core
    teach:
      - "Third, card data is handled securely, to PCI DSS, the global standard for anyone who stores, processes or transmits cardholder data."
      - "Fourth, once the payment is done, the merchant can see its status: tracked and reported."
    draw: [fr-pci, fr-status]
    check: What is PCI DSS, in a sentence?
    answer: The global security standard every system that stores, processes or transmits cardholder data must meet.
  - point: "Part payments, returns and refunds are out of scope, said and written down."
    kind: rule
    weight: supporting
    teach:
      - "Name what you leave out: part payments, and returns and refunds. Write it under the list and move on."
    draw: [fr-oos]
  - point: "Non-functional: a scale of 10,000 transactions per second, and consistency over availability, because a payment recorded twice or lost is a real loss."
    kind: metric
    weight: core
    teach:
      - "On the right, the qualities. Ask the scale: say 10,000 transactions per second, many merchants talking to many processors."
      - "Then CAP. For money it is consistency first. That does not mean the gateway may sit down; it means that when the two conflict, it refuses rather than record a payment twice or lose one."
    draw: [nfr, nfr-scale, nfr-cap]
    check: Why does a payment gateway pick consistency over availability?
    answer: "A duplicated or lost payment costs real money; a brief refusal can be retried."
    misconceptions:
      - "Consistency first means the gateway can be down -> it should still stay up; consistency only wins when the two truly conflict."
  - point: "The gateway's own part, validation and tokenization, takes under 200 ms; the bank's part is the processor's. And security means end-to-end encryption and PCI DSS level 1."
    kind: metric
    weight: core
    teach:
      - "Latency, with a number and a place: under 200 milliseconds for the gateway's work, validating and tokenizing. The bank's work is the processor's and takes its own time."
      - "Last, security: end-to-end encryption, and PCI DSS level 1, the strictest level, for a provider handling this many cards."
    draw: [nfr-latency, nfr-security]
    check: The latency target is 200 ms. For which part of the payment?
    answer: "The gateway's own steps, validation and tokenization, before the processor and the bank take over."
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should this gateway do? Think about what happens from the buy button on. Tell me the features one at a time, and I'll write them."
    hints:
      - What does the shop tell the gateway before any card is typed?
      - And where does the buyer type the card, and what does the shop need to know afterwards?
  - list: nfr-list
    beats: [4, 5]
    question: "Now the qualities. How much traffic, what matters more when machines fail, how fast, how safe?"
    hints:
      - "Think of a number of transactions per second, and of CAP for money."
      - And what must be true of the card data at every step?
