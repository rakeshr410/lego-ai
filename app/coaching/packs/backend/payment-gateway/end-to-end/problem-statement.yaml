beats:
  - point: "A payment gateway like Stripe or Razorpay sits between a shop's checkout and the networks that move money: it captures the buyer's card details securely and routes each payment between merchants and processors."
    kind: rule
    weight: core
    teach:
      - "Write the title: a payment gateway like Stripe or Razorpay. Under it, one line on what it is: a platform that captures the buyer's payment details securely and orchestrates the payment between merchants and processors."
      - "Warn that this is a domain question; candidates outside payments rarely get it. If it comes, the same five steps work, but the definitions come first."
    draw: [title, prompt-desc]
    check: In one sentence, where does a payment gateway sit in a card payment?
    answer: "Between the merchant's checkout and the processors: it captures the card details securely and routes the payment to a processor."
  - point: "The gateway collects, secures and tokenizes card details and orchestrates the flow, the traffic controller of payments; the processor talks to banks and card networks to authorize, capture and settle, it moves the money, and it is outside our design."
    kind: rule
    weight: core
    teach:
      - "On the left, the gateway: it collects the card number, the CVV and the rest from the buyer, secures and tokenizes them, and sends the token to whichever processor is needed. The traffic controller of payments."
      - "On the right, the processor: the financial network entity that really talks to the bank and the card networks, to authorize, capture and settle. It moves the money."
      - "So we design the gateway only. How money leaves one bank and reaches another is not ours. Say that boundary out loud, or the interviewer expects a card network."
    draw: [def-gateway, def-gateway-2, def-processor, def-processor-2]
    check: Which of the two actually talks to the bank, and which one are we designing?
    answer: "The processor talks to the banks and card networks and moves the money; we design the gateway, which collects, tokenizes and routes."
    misconceptions:
      - "The gateway moves the money between banks -> that is the processor's job; the gateway collects, tokenizes and routes the payment to a processor."
  - point: "The interview still runs in five steps: requirements, core entities, API, high-level design, then the deep dive."
    kind: rule
    weight: supporting
    teach:
      - "Say the plan once: requirements, functional and non-functional; the core entities; the API; a high-level design; then the deep dive, where most of the time goes."
      - "Said, not written; each step gets its number on the board when we reach it."
    check: What comes straight after the requirements?
    answer: The core entities, then the API.
asks:
  - ids: [def-processor]
    beats: [2]
    question: "Before we design anything: what do you think a payment processor does that a gateway does not?"
    hints:
      - Who actually talks to the buyer's bank?
      - Think about who moves the money, rather than who collects the card.
