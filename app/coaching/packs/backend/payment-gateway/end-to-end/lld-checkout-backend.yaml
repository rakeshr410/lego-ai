review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/payment-gateway/end-to-end/lld-checkout-session
  assumes:
    - "Sessions live in Redis with a 10-minute TTL; the hosted page's URL carries the session id."
    - "Non-functional: end-to-end encryption, PCI DSS level 1."
  carries:
    - "The checkout backend service takes the pay call; the card never passes through the merchant."
    - "It checks against Redis: the session exists, has not expired, the intent is valid, the merchant matches, the state is active."
    - "A tokenization service in a PCI zone, over mutual TLS, validates the card, fingerprints it with a keyed hash, encrypts it with an HSM key into the card vault and returns a token."
  terms:
    - term: PCI zone
      means: "The small, isolated, audited part of the system where card numbers may exist."
    - term: token
      means: A stand-in value for a card that is useless outside the gateway.
    - term: HSM
      means: "Hardware security module: tamper-resistant hardware that holds keys and encrypts with them, never letting a key out."
    - term: PAN
      means: "Primary account number, the card number; its first 6 to 8 digits are the BIN, which names the issuing bank."
