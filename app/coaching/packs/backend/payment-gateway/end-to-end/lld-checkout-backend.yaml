# Payment gateway interview, deep dive 3: the pay call. As in the video, the processor service is renamed the checkout backend service, its checks listed under it and validated against Redis; under it, the PCI zone: a tokenization service talking to an HSM and a card vault DB, the steps written below, reached over TLS, with the token returned.
id: backend/payment-gateway/end-to-end/lld-checkout-backend
title: "Deep dive, 3: the pay call and the PCI zone"
