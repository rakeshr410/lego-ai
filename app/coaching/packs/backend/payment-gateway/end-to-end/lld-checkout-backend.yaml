beats:
  - point: "The pay call goes to the checkout backend service, the old processor service renamed; the card was typed into the gateway's page and posted to the gateway, so the merchant never sees it."
    kind: component
    weight: core
    teach:
      - "Step three of the payment: the buyer clicks pay. Rename the payment processor service to the checkout backend service, because it handles what our checkout page sends."
      - "Notice what we bought: the card was typed into our page and posted to our back end. At no point can the merchant see it."
    draw: [dd-backend, dd-gateway-backend]
    check: At what point does the merchant handle the card number?
    answer: "Never; it is typed into the gateway's page and posted straight to the checkout backend."
  - point: "The backend first checks the request against the session in Redis: the session exists, has not expired, the intent is valid, the merchant matches, and the session is still active."
    kind: mechanism
    weight: core
    teach:
      - "Before anything, is this request genuine? Someone may be trying to cheat. Check against Redis: does the session exist? Has it expired, its TTL run out?"
      - "Is the payment intent valid, does the merchant match, is the session still active? Only if all match is the pay request real."
    draw: [dd-check-1, dd-check-2, dd-check-3, dd-backend-redis]
    check: What does the backend check before it touches the card?
    answer: "That the session exists and has not expired, the intent is valid, the merchant matches and the session is active, all against Redis."
  - point: "A valid card still cannot be stored or sent raw; PCI DSS requires it protected, so the backend calls a tokenization service inside a PCI zone, an isolated part of the system, over mutual TLS."
    kind: component
    weight: core
    teach:
      - "Now the card. We cannot store it as it is, and we cannot send it raw to an outside processor. PCI DSS says encrypt or tokenize it."
      - "So the backend makes an internal call into a PCI zone, a small isolated part of the system where card data may exist, to a tokenization service. The call is over mutual TLS: HTTPS is already TLS, and mutual means both sides prove who they are."
    draw: [pci, dd-tokenize, dd-backend-tokenize]
    check: Why keep tokenization in a separate PCI zone?
    answer: "So card numbers exist only in a small, isolated, audited part of the system; everything outside handles tokens."
    misconceptions:
      - "TLS is more secure than HTTPS -> HTTPS is HTTP over TLS; the gain inside is mutual TLS, where both services prove their identity."
  - point: "The tokenization service validates the card number, then makes a fingerprint, a keyed hash of the whole card number, so the same card is recognised later without keeping it readable."
    kind: mechanism
    weight: core
    teach:
      - "First, validate: the card number's length and its Luhn check digit, the expiry."
      - "Then a fingerprint, to recognise the same card next time. Make it a keyed hash of the whole card number. A hash of the BIN, the last four and the expiry would not do: many cards share those, and the BIN, the first 6 to 8 digits, only names the bank."
    draw: [dd-step-1, dd-step-2]
    check: Why make the fingerprint from the whole card number with a secret key?
    answer: "Many cards share a BIN and last four, so those are not unique; and without a key, hashes of card numbers can be brute-forced."
    misconceptions:
      - "A fingerprint of BIN, last four and expiry identifies a card -> many cards share those; use a keyed hash of the full number."
  - point: "The card number is then encrypted with a key held inside a hardware security module, which never lets the key out, and the ciphertext goes to a card vault; the CVV is never stored."
    kind: mechanism
    weight: core
    teach:
      - "Then encrypt the card number, the PAN. A key in a file or a cloud store can be copied, so the key lives in an HSM, a hardware security module, which encrypts with it and never lets it out."
      - "The encrypted number goes into a card vault database inside the zone. The CVV is used for this payment and never stored."
    draw: [dd-hsm, dd-tokenize-hsm, dd-vault, dd-tokenize-vault, dd-step-3, dd-step-4]
    check: Why use an HSM instead of a key stored on a server?
    answer: "A stored key can be stolen and used; an HSM keeps the key inside tamper-resistant hardware and does the encryption itself."
  - point: "The tokenization service answers with a token that stands for the card; only the PCI zone can turn it back into a card number."
    kind: flow
    weight: core
    teach:
      - "The answer to the backend is a token. From here on, only the token travels; when a processor needs the card, the PCI zone is what turns it back."
    draw: [dd-token]
    check: What leaves the PCI zone?
    answer: "A token standing for the card, never the card number itself."
asks:
  - ids: [dd-check-1, dd-check-2, dd-check-3]
    beats: [2]
    question: "The pay request lands on the backend. What would you check before trusting it?"
    hints:
      - Think of what we stored in Redis for the session.
      - "Could it be too late, or the wrong merchant?"
  - ids: [dd-tokenize]
    beats: [3]
    question: "We can't store the card or send it out raw. What would you put in the PCI zone to deal with it?"
    hints:
      - Something that swaps the card for a stand-in value.
      - A service whose only job is that.
  - ids: [dd-hsm]
    beats: [5]
    question: "We encrypt the card number. Where should the encryption key live?"
    hints:
      - A key on a disk can be copied.
      - Is there hardware built to hold keys and never give them out?
