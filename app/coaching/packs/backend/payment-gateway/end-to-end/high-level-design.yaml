beats:
  - point: "Users pay through the merchant, our client; at 10,000 transactions a second the back end is microservices, so an API gateway and load balancer sit in front to route each call."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. On the left, our client, the merchant. Its users are not ours to design, but they are the ones who type the card, so draw them talking to the merchant."
      - "We handle 10,000 transactions a second and several jobs, tokenizing, routing, so the back end is microservices. That means an API gateway and a load balancer in front, routing each call to its service."
    draw: [hld, hld-users, hld-client, hld-users-client, hld-gateway, hld-client-gateway]
    check: Why put an API gateway in front of the services?
    answer: "With several microservices at 10,000 transactions a second, something must authenticate, route each call to its service and balance the load."
  - point: "The intent service takes the first call and saves the payment's metadata, item, amount and currency, in its database; it never touches the card."
    kind: component
    weight: core
    teach:
      - "The first call is the intent, so a payment intent service: it captures the payment's metadata, what is bought, the amount, the currency, into a database, and answers with the intent id."
      - "Keep in mind it never sees card details. That is not its job."
    draw: [hld-intent, hld-gateway-intent, hld-intent-db, hld-intent-save]
    check: What does the intent service store?
    answer: "The payment's metadata, item, amount, currency, merchant, in its database; no card details."
  - point: "The session service takes the second call and returns a secure checkout page; the merchant must not build its own card form, which would pull it into PCI scope."
    kind: component
    weight: core
    teach:
      - "The second call, with the intent id, goes to a payment session service. It creates a session and returns a secure checkout web page where the buyer enters the card."
      - "Why not let the merchant build that form? Then the merchant would handle the card, a big security problem unless it is PCI compliant itself."
    draw: [hld-session, hld-gateway-session, hld-page]
    check: Why does the gateway, not the merchant, provide the card page?
    answer: "So card details go into the gateway's page and the merchant never handles them or carries the PCI burden."
  - point: "The processor service takes the pay call and calls the external processor over a secure connection; what comes back is an acknowledgement, not the last word, and a reconciliation job confirms later."
    kind: flow
    weight: core
    teach:
      - "The pay call goes to a payment processor service, which calls the external processor over a secure connection. The processor talks to the bank."
      - "What comes back is not the final word that the money moved. You have seen a payment fail on screen while the bank shows a debit, or succeed and be declined later. A reconciliation job behind the scenes settles it."
    draw: [hld-processor, hld-gateway-processor, hld-external, hld-processor-external, hld-recon]
    check: The processor answers right away. Is the payment done?
    answer: "Not for certain; the answer can change at settlement, so a reconciliation job confirms the final result later."
    misconceptions:
      - "The processor's first response means the money moved -> it can still fail or reverse at settlement; reconciliation confirms."
asks:
  - ids: [hld-intent, hld-session, hld-processor]
    beats: [2, 3, 4]
    question: "Behind the gateway, what services would you have? Think of the three calls a payment makes."
