beats:
  - point: "The high-level design needs three boxes: a client making requests, a server that generates the short URL, and a database that stores the mapping."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design: just enough boxes to meet the functional requirements. A client making the request. A server to turn the long URL into a short one."
      - "And a database, because without storing the pair we could never redirect. The server's box only says it generates the short URL; how is for later."
    draw: [hld, hld-client, hld-server, hld-db]
    check: Why does even the simplest design need a database?
    answer: Without storing the short-to-long mapping the server could never find the long URL to redirect to.
  - point: "Create: the client sends the long URL, the server makes a code, saves the pair and returns the short URL. Redirect: the client opens the short URL, the server looks it up and redirects to the long one."
    kind: flow
    weight: core
    teach:
      - "Two flows. Create: the client calls generate URL with the long URL, the server makes a short code, saves the pair in the database, and sends the short URL back."
      - "Redirect: the client opens the short URL, the server checks the database for that code and, if it is there, redirects to the long URL."
    draw: [hld-client-server, hld-server-db]
    check: Walk me through what happens when someone opens a short URL.
    answer: The request reaches the server, which looks the code up in the database and, if found, redirects to the long URL.
  - point: "Two tables: url, holding the short code, the long URL, the expiry and whether it is custom, and user, holding the account details including premium."
    kind: decision
    weight: core
    teach:
      - "Write what the database holds beside it. A user table with the account's metadata, so we know who is premium."
      - "And the url table: the short URL, the long URL, the expiry date and the custom URL. That is the whole high-level design: the requirements as a picture."
    draw: [hld-user-table, hld-url-table-1, hld-url-table-2]
    check: Which table and column does the redirect look up?
    answer: The url table, by its short code.
asks:
  - ids: [hld-client, hld-server, hld-db]
    beats: [1]
    question: "What's the smallest set of boxes that can do both, create and redirect? Name them and I'll draw them."
    hints:
      - Someone sends the request, and something does the work.
      - And where would the mapping live between the two calls?
task:
  prompt: "Draw the high-level design: a client, a server that generates the short URL, a database, the create and redirect flows as arrows, and the url and user tables beside the database."
  expects: [1, 2, 3]
