context:
  after: backend/url-shortener/short-links-end-to-end/api
  assumes:
    - "POST /v1/urls creates a short URL; GET /{code} redirects to the long URL."
    - "The core entities are the short URL, the long URL and the user."
  carries:
    - "The high-level design is a client, one server that generates the short URL, and a database holding the mapping."
    - "Create: client sends the long URL, the server makes a code, saves the pair, returns the short URL. Redirect: the server looks the code up and redirects."
    - "Tables: url (short code, long URL, expiry, custom flag, user) and user (account details, premium)."
  terms:
    - term: high-level design
      means: The fewest boxes that meet the functional requirements, with how each box works left for later.
