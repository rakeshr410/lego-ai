beats:
  - point: "A counter makes codes unique by construction: link one gets 1, link two gets 2, encoded in base62, so the look-up before each save disappears and a create drops to about 6 ms."
    kind: mechanism
    weight: core
    teach:
      - "Second way: count. Each new link takes the next number, and we write it in base62, digits and both cases of letters. Seven characters cover over three trillion numbers."
      - "No two links can get the same number, so there is nothing to check: the 10 millisecond look-up goes, and a create is about 6 milliseconds."
    draw: [lld-counter, counter-idea]
    check: Why does the counter remove the database look-up?
    answer: Numbers are handed out once each, so a new code cannot already exist and there is nothing to check.
  - point: "One server cannot carry 100 million daily users, so several servers sit behind a round-robin load balancer; but a counter on each server starts at zero, and two servers hand out the same number."
    kind: failure
    weight: core
    teach:
      - "One server will not take 100 million daily users, and a bigger machine only goes so far, so scale out: three servers behind a load balancer, round robin. Say why it is there and which algorithm."
      - "Now the counter breaks. Each server keeps its own, each starts at zero. Two requests on two servers both get zero: the same code for two URLs."
    draw: [c-client, c-lb, c-client-lb, c-server-1, c-lb-1, c-server-2, c-lb-2, c-server-3, c-lb-3, c-local]
    check: Three servers each keep their own counter. What goes wrong?
    answer: Every server starts at zero, so two servers give the same number, and the same code, to different URLs.
  - point: "Moving the counter into one Redis instance fixes the duplicates: INCR is atomic, so every server gets a different number in about 2 to 3 ms."
    kind: mechanism
    weight: core
    teach:
      - "Take the counter out of the servers into one shared place, a Redis instance. Every server asks Redis for the next number."
      - "INCR on one key is atomic, so no two servers get the same value, and it answers in 2 to 3 milliseconds, much faster than the database check we removed."
    draw: [c-redis, c-1-redis, c-2-redis, c-incr]
    check: Why can two servers not get the same number from Redis?
    answer: INCR on a single key is atomic; Redis runs the increments one at a time.
  - point: "The flaw: one Redis is a single point of failure, and several Redis nodes each counting bring the duplicates back. Named, this design is a passable answer."
    kind: failure
    weight: core
    teach:
      - "The servers still save each pair in the database. But look at Redis: if that one instance goes down, no new link can be made. A single point of failure."
      - "Several Redis nodes, each counting, repeat numbers again. Write the flaw down; with it named this is a passable answer, and the next step removes it."
    draw: [c-db, c-3-db, c-spof]
    check: What breaks if you run three Redis nodes, each with its own counter?
    answer: They repeat each other's numbers, so codes collide again.
    misconceptions:
      - "INCR is not safe with many servers -> INCR is atomic; the problem is that the one instance is a single point of failure."
  - point: "Most users only open links, so split the servers by traffic: encryption (create) servers and decryption (redirect) servers, each scaled to its share, about 20 and 80 percent."
    kind: decision
    weight: core
    teach:
      - "Before fixing Redis, fit the design to the traffic. Of 100 million daily users maybe 20 percent create links and 80 percent only open them."
      - "One kind of server doing both wastes capacity. Split it: encryption servers that create, say three, and decryption servers that redirect, say six. Separation of concerns, each scaled to its own load."
    draw: [s-client, s-lb, s-client-lb, s-encrypt, s-lb-encrypt, s-decrypt, s-lb-decrypt, s-counter, s-encrypt-counter, s-db, s-encrypt-db, s-traffic]
    check: Why split creating and redirecting into separate servers?
    answer: Redirects are most of the traffic, so each fleet can be scaled to its own share instead of scaling both together.
  - point: "A Redis cache in front of the database serves popular codes for the redirect servers in about 2 ms instead of 10, going to the database only on a miss."
    kind: mechanism
    weight: core
    teach:
      - "The redirect still reads the database every time, 10 milliseconds. Put a Redis cache in front of it for the decryption servers: look in the cache first, and only on a miss go to the database."
      - "A popular link comes back from memory in about 2 milliseconds, so a redirect drops from about 15 to about 7 milliseconds. Made-up numbers, real shape."
    draw: [s-cache, s-decrypt-cache, s-decrypt-db]
    check: Which servers read through the cache, and why those?
    answer: The decryption servers, because redirects read the same popular codes again and again.
asks:
  - ids: [c-lb, c-server-1, c-server-2, c-server-3]
    beats: [2]
    question: "One server can't carry a hundred million users. How would you scale this out? Name the pieces and I'll draw them."
    hints:
      - Think of several copies of the same server.
      - Then something has to spread the requests across them.
  - ids: [c-redis]
    beats: [3]
    question: "Each server counting on its own repeats numbers. Where would you keep the counter so every server shares it?"
    hints:
      - Somewhere outside the servers, that all of them can reach.
      - It needs a fast increment that never hands out the same value twice.
  - ids: [s-encrypt, s-decrypt]
    beats: [5]
    question: "About 80 percent of users only open links, and 20 percent create them. What would you change about the servers?"
    hints:
      - Do creating and redirecting need to scale together?
      - What if each had its own group of servers?
  - ids: [s-cache]
    beats: [6]
    question: "Every redirect still reads the database, 10 milliseconds. How would you make popular links faster?"
    hints:
      - The same codes are opened again and again.
      - Something in memory, in front of the database.
