# URL shortener interview, low-level design 2: a counter. Under "5. Low-level design: 2. Counter", the video's two drawings one under the other: client, a tall round-robin load balancer, three servers with local counters, then a Redis counter and the database; below it the same picture split by traffic into encryption (create) and decryption (redirect) servers, a Redis counter, a Redis cache and the database.
id: backend/url-shortener/short-links-end-to-end/lld-counter
title: "Low-level design, 2: a counter"
source:
  hash: "48dd78c65985"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/url-shortener/short-links-end-to-end/lld-hashing
  assumes:
    - "Hash and truncate collides at 1B links and costs a database look-up per try."
    - "Non-functional: about 200 ms, 100M daily users and 1B URLs, every short URL unique, availability over consistency."
  carries:
    - "A counter, base62-encoded, is unique by construction and needs no look-up; under 62^7 it fits in 7 characters."
    - "Local counters behind a load balancer repeat numbers; one Redis counter (atomic INCR) fixes that but is a single point of failure."
    - "Create and redirect split into two services scaled to their traffic (about 20 and 80 percent), with a Redis cache in front of the database for redirects."
  terms:
    - term: base62
      means: "Writing a number with 0-9, A-Z and a-z; 62^7 is about 3.52 trillion, so seven characters hold any counter below it."
    - term: load balancer
      means: Spreads requests across identical servers, here round robin.
    - term: single point of failure
      means: One component whose failure stops the whole system.
