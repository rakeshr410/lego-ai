context:
  after: backend/url-shortener/short-links-end-to-end/lld-counter
  assumes:
    - "A counter in base62 is unique and short; one Redis counter is a single point of failure."
    - "Encryption (create) and decryption (redirect) servers are scaled separately, with a Redis cache for redirects."
  carries:
    - "ZooKeeper hands each create server a range of numbers from a persistent znode; servers count locally, with no call per create."
    - "Snowflake IDs are 64 bits, 11 base62 characters; hashing one down to 7 collides again."
    - "Expiry: a daily cron, a cache TTL no later than the expiry, and a check at read time. Custom URLs insert only if absent."
    - "302 counts every click, 301 is cached by browsers; PostgreSQL or MySQL with the short code as the primary key."
  terms:
    - term: ZooKeeper
      means: A replicated coordination service for configuration, naming, locks and group membership.
    - term: znode
      means: "A node in ZooKeeper's tree; persistent ones stay, ephemeral ones vanish when their client's session ends."
    - term: Snowflake ID
      means: "A 64-bit ID of 1 sign bit, 41 bits of milliseconds, 10 bits of worker and 12 bits of sequence."
