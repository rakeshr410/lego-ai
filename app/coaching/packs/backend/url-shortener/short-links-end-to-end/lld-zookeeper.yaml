# URL shortener interview, low-level design 3: ZooKeeper, and finishing. Under "5. Low-level design: 3. ZooKeeper", as in the video: what ZooKeeper is, its tree of znodes (persistent, and ephemeral drawn dashed), then the final picture with ZooKeeper beside the encryption servers, the range notes, the Snowflake alternative, cron to the database, the database choice and 301 or 302. The video hashes a Snowflake ID down to six characters; this pack teaches leased counter ranges encoded whole, and why the truncated hash fails.
