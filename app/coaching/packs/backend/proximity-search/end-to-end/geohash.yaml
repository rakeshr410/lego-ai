    question: "How would you store restaurants so we can search them by geohash? Give me the columns."
    hints:
      - What does the owner give you when they sign up?
      - What do you compute from it once and keep?
  - ids: [gq-where, gq-or-rest]
    beats: [6]
    frame: [gq-select]
    question: "The user's geohash is sgkztus. Write the condition that finds restaurants near them."
    hints:
      - Nearby places share a prefix; how does SQL match a prefix?
      - Is the user's own cell enough, or what about the cells around it?
