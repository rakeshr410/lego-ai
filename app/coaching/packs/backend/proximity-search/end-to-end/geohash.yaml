# Proximity search, 2. Geohash: "2. Geohash" with the video's three levels left to right (0 to 3, then 00 to 03 inside 0, then 000 to 003 inside 00), the Bangalore walk to tdr1wk96 and the restaurants table under it; on the right, the precision table and the prefix query with the neighbours, as the video lays them out. Corrected: base32 with 32 cells a character, not base64 quarters; neighbours share a prefix, not one changed bit, and the eight neighbour cells are always searched.
id: backend/proximity-search/end-to-end/geohash
title: "2. Geohash"
source:
