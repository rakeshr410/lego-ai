review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/proximity-search/end-to-end/quadtree
  assumes:
    - "Proximity search returns the places within a radius of the user, say 5 km."
    - "A quadtree splits the map into quarters recursively but lives in memory and is hard to keep in sync."
  carries:
    - "Geohash names each cell with a string whose prefix is its parent cell: base32, five bits and 32 smaller cells per character."
    - "Places close together usually share a long prefix; a McDonald's in Koramangala, Bangalore, is tdr1wk96."
    - "Length 5 cells are about 4.9 km, length 6 about 1.2 km by 609 m, length 9 about 4.8 m."
    - "Store the geohash in an indexed column; query the user's cell and its 8 neighbours by prefix, then filter by exact distance."
  terms:
    - term: geohash
      means: "A short base32 string naming a cell of the map; each extra character picks one of 32 smaller cells inside it."
    - term: precision
      means: "The geohash's length; longer means smaller cells."
    - term: neighbours
      means: "The 8 cells around a cell at the same length, searched with it so places just over an edge are not missed."
