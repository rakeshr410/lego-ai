beats:
  - point: "Elasticsearch already does every kind of search, and geo search is built in: a geo_point field and a geo_distance query, no extension to install."
    kind: mechanism
    weight: core
    teach:
      - "Number four, Elasticsearch. It is a search engine, and searching by location comes built in: map the location as a geo_point field. Nothing to install, plug and play."
    draw: [es, es-builtin, es-noext]
    check: What do you have to install to get geo search in Elasticsearch?
    answer: "Nothing; geo_point fields and geo_distance queries are built in."
  - point: "The query names a distance and a centre: geo_distance with distance 5km and the user's latitude and longitude, and it can be combined with text matching and filters."
    kind: flow
    weight: supporting
    teach:
      - "The search body: a geo_distance query with a distance of 5km and the user's location, latitude 12.97 and longitude 77.60."
      - "The same query can also match a name or filter by cuisine, which is where Elasticsearch earns its place."
    draw: [es-json-1, es-json-2, es-json-3]
    check: What two things does a geo_distance query need?
    answer: "A distance, such as 5km, and the centre point, the user's latitude and longitude."
  - point: "Choosing: avoid the quadtree; if the search is by location only, such as the drivers near a rider in Uber or Rapido, geohash is enough and fast."
    kind: decision
    weight: core
    teach:
      - "Now choose. The quadtree is out: easy to explain, hard to run."
      - "Ask one question: does the user search by text too? If not, if it is only what is near, like drivers near a rider in Uber or Rapido, go with geohash."
    draw: [ch, ch-text, ch-geohash, ch-no, ch-quadtree]
    check: You need the drivers near a rider. Which approach, and why?
    answer: Geohash, because the search is by location only and a prefix query on an indexed column is simple and fast.
  - point: "If users also search by text, such as a restaurant by a half-remembered name, use Elasticsearch, or PostgreSQL with PostGIS plus a fuzzy text extension; with both extensions they are about equal."
    kind: decision
    weight: core
    teach:
      - "If they also search by name, location alone does not help; we need fuzzy text matching. Elasticsearch does both natively."
      - "PostgreSQL does both with two extensions: PostGIS for location and a fuzzy one for text. The video names fuzzystrmatch, which compares strings; pg_trgm adds trigram matching an index can serve. With both installed, the two are about equal, so pick what the design already runs."
    draw: [ch-both, ch-yes, pg-fuzzy, ch-equal]
    check: Users search for a restaurant by a misspelled name near them. What fits?
    answer: Elasticsearch, or PostgreSQL with PostGIS plus a fuzzy text extension such as pg_trgm.
    misconceptions:
      - "Geohash handles name search too -> it only narrows by location; fuzzy text needs Elasticsearch or a PostgreSQL text extension."
asks:
  - ids: [ch-geohash]
    beats: [3]
    frame: [ch, ch-text]
    question: "Say the search is by location only, drivers near a rider. Of the four, which would you pick?"
    hints:
      - Which one was hard to run, and which was just a column and a query?
      - Do you need any text matching here?
  - ids: [ch-both]
    beats: [4]
    question: "Now users also type a restaurant's name, sometimes misspelled. What would you use?"
    hints:
      - Which of the four already does text search of every kind?
      - Could PostgreSQL do it too, with one more extension?
task:
  prompt: "Draw the choice: a decision on whether the search is by text too, geohash for location only, and PostgreSQL with PostGIS and a fuzzy extension, or Elasticsearch, for location and text, with the quadtree marked as the one to avoid."
  expects: [3, 4]
