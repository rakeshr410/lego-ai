# Proximity search, 4. Elasticsearch, and choosing: "4. Elastic Search" under PostGIS, a geo_point field and a geo_distance query built in; then the video's conclusion drawn as a choice beside it (avoid the quadtree; location only, geohash; location and text, PostGIS with a fuzzy text extension or Elasticsearch), with the video's "fuzzystrmatch" added beside heading 3. Corrected: pg_trgm is the indexable fuzzy extension; fuzzystrmatch compares strings.
id: backend/proximity-search/end-to-end/elasticsearch
title: "4. Elasticsearch, and choosing"
source:
  hash: "edbf6b61baba"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/proximity-search/end-to-end/postgis
  assumes:
    - "The quadtree is easy to explain but hard to run, an in-memory tree on every server."
    - "Geohash is a prefix-searchable column queried with the user's cell and its 8 neighbours."
    - "PostgreSQL with PostGIS answers ST_DWithin with a GiST index on the location column."
  carries:
    - "Elasticsearch has geo_point fields and geo_distance queries built in, no extension."
    - "Avoid the quadtree; for location-only searches such as drivers near a rider, use geohash."
    - "For location plus text, use Elasticsearch, or PostgreSQL with PostGIS and a fuzzy text extension; with both, they are about equal."
  terms:
    - term: geo_point
      means: "An Elasticsearch field type holding a latitude and a longitude."
    - term: fuzzy search
      means: "Matching text that is close to the query, such as a misspelled restaurant name."
