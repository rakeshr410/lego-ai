context:
  after: backend/proximity-search/end-to-end/problem-statement
  assumes:
    - "Proximity search returns the places within a radius of the user, say 5 km, and needs a spatial index."
  carries:
    - "A quadtree's root is the whole world map; each node has four children, its quarters; a full leaf splits into four."
    - "Real places are uneven, so the tree is deep over cities and shallow over oceans, yet only about 22 levels reach 10 m cells."
    - "Searching 5 km walks from the user's leaf up to parents and across their children, because neighbouring cells sit under other parents."
    - "It lives in memory on every search server, built at start-up, with read and write copies kept in sync: hard to run, so avoid it in the interview."
  terms:
    - term: quadtree
      means: "A tree in which every internal node is a square of the map with four children, its quarters."
    - term: leaf
      means: "A cell that is not split further; it holds one place or a small group."
