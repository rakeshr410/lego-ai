# Proximity search, 1. Quadtree: under the title, "1. Quad Tree" on the left with the tree as the video draws it (the world map at the root, four quarters, one quarter split again, three empty leaves and a dense one that keeps splitting), and on the right the 5 km search the video marks on its grid: the user's empty cell, up to the parent and its children (2, 0, 0), up again; then the costs and the verdict. Corrected: depth is about 22 levels, not thousands; an insert splits one leaf, no rebuild; an R-tree is a different index.
