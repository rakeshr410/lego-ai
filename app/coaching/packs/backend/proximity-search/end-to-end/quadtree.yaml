beats:
  - point: "A quadtree is a tree whose every node has four children: the root is the whole world map, and its children are its four quarters, north-west, north-east, south-west and south-east."
    kind: mechanism
    weight: core
    teach:
      - "Number one, the quadtree. A binary tree node has two children; a quadtree node has four, hence the name."
      - "The root is the whole world map. Split it into four quarters: north-west, north-east, south-west and south-east. Those are the root's four children."
    draw: [qt, qt-root, qt-nw, qt-ne, qt-sw, qt-se, qt-root-nw, qt-root-ne, qt-root-sw, qt-root-se]
    check: What does each child of a quadtree node stand for?
    answer: One quarter of its parent's square of the map.
  - point: "Each quarter splits into four again, recursively, until a leaf holds one place or a small group; because places are uneven, empty areas stay single leaves while a dense city keeps splitting."
    kind: mechanism
    weight: core
    teach:
      - "Keep splitting each quarter into four until a cell holds one restaurant, or a few close together. That cell is a leaf."
      - "But restaurants are not spread evenly. Split the south-west: the ocean quarter holds nothing, the desert quarter nothing, one quarter holds a single restaurant, and the dense city quarter has to split again, and again."
      - "So the tree is deep over cities and shallow everywhere else: unbalanced. That is by design, small leaves where the data is."
    draw: [qt-ocean, qt-desert, qt-one, qt-dense, qt-sw-ocean, qt-sw-desert, qt-sw-one, qt-sw-dense, qt-uneven]
    check: Why does the tree end up unbalanced?
    answer: Places are uneven; empty areas stop splitting at once while dense cities keep splitting, so depth differs by region.
  - point: "The tree is still shallow: each level halves the cell's side, so about 22 levels already reach cells of about 10 metres, not thousands of levels."
    kind: metric
    weight: supporting
    teach:
      - "How deep does it get? Each level halves the side of a cell. Halve the 40,075 kilometre equator 22 times and the cells are about 10 metres across."
      - "So depth grows with the logarithm of the detail, about 22 levels, not the thousands of levels you sometimes hear."
    draw: [qt-depth]
    check: Roughly how many levels does a quadtree need to reach 10 metre cells?
    answer: About 22, because each level halves the cell's side.
    misconceptions:
      - "A world quadtree has thousands of levels -> each level halves the cell, so about 22 levels reach 10 metres."
  - point: "To search 5 km, start at the user's leaf; if it is empty, go up to the parent and check its other children (here 2 restaurants, 0, 0), and if that is not enough, go up again."
    kind: flow
    weight: core
    teach:
      - "Now search. The user sits in a leaf with no restaurants. Go up one level to its parent and look at the parent's four children."
      - "The next cell has two restaurants, the third none, the fourth none. Two found, but the 5 km circle reaches further, so go up again to the grandparent and search its children too."
    draw: [qs, qs-grand, qs-parent, qs-yours, qs-next, qs-third, qs-fourth, qs-up-1, qs-check-next, qs-check-third, qs-check-fourth, qs-up-2]
    check: The user's own leaf has no restaurants. What does the search do next?
    answer: It goes up to the parent and checks the parent's other children, and keeps going up until the 5 km circle is covered.
  - point: "Neighbouring cells on the map can sit under different parents in the tree, so the walk goes up and down; done properly, a range search descends from the root into every cell the circle touches."
    kind: mechanism
    weight: supporting
    teach:
      - "Why so much walking? The circle spills into cells that belong to other parents, even other grandparents, so cells side by side on the map can be far apart in the tree."
      - "The tidy version starts at the root and goes down only into cells the circle touches. It reads a handful of nodes, but finding neighbours is still more work than it looks."
    draw: [qs-spill, qs-range]
    check: Why can't the search stop at the user's parent?
    answer: The circle crosses into cells under other parents, so nearby places can be in a different branch of the tree.
  - point: "The real cost is running it: a quadtree is an in-memory data structure, built from every listing at start-up, kept as a read copy and a write copy on every search server, and every new place must reach every copy."
    kind: failure
    weight: core
    teach:
      - "A quadtree is a data structure, not a database. It lives in the memory of each search server, and with millions of listings it has to be built from all of them when the server starts."
      - "New restaurants keep joining. An insert walks to its leaf and splits that leaf if it overflows; nothing else is rebuilt. But every server's copy must apply it, so designs keep a read copy for searches and a write copy for changes."
    draw: [qs-memory, qs-copies, qs-insert]
    check: What makes a quadtree hard to run in production?
    answer: It lives in memory on every server, must be built from all listings at start-up, and every change must reach every copy, read and write.
    misconceptions:
      - "Adding a restaurant rebuilds the whole quadtree -> it goes into one leaf, which splits if full; the hard part is updating every server's copy."
  - point: "Verdict: easy to explain, hard to run, so avoid it in the interview; the R-tree you may hear about is a different, balanced index of rectangles, the kind databases use."
    kind: decision
    weight: supporting
    teach:
      - "Write the verdict: hard to run, avoid it in the interview unless asked."
      - "You may hear an R-tree suggested instead. It is not an enhanced quadtree but a different index, a balanced tree of bounding rectangles, and spatial databases use it inside. We meet it again in approach three."
    draw: [qs-verdict, qs-rtree]
    check: Why do we avoid the quadtree in an interview answer?
    answer: It is easy to draw but hard to run, an in-memory tree on every server kept in sync as places change.
