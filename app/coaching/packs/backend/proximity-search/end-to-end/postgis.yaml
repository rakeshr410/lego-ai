# Proximity search, 3. PostgreSQL with PostGIS: "3. PostGres DB with GIS extension" with the INSERT of Taco Bell on the left and the ST_DWithin search for 5 km on the right, as the video writes them. Corrected: PostGIS answers with a GiST (R-tree style) index on the location column, not with geohashing.
id: backend/proximity-search/end-to-end/postgis
title: "3. PostgreSQL with PostGIS"
source:
  hash: "26c8ccea131e"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/proximity-search/end-to-end/geohash
  assumes:
    - "Proximity search returns the places within a radius of the user, say 5 km."
    - "Geohash stores a prefix-searchable cell name per place and queries the user's cell and its 8 neighbours."
  carries:
    - "PostGIS is a PostgreSQL extension that adds location types and functions; a location is stored with ST_GeogFromText, longitude first, SRID 4326."
    - "ST_DWithin(location, user point, 5000) keeps the rows within 5000 metres, 5 km, on a geography column."
    - "A GiST index on the location column is what makes it fast."
  terms:
    - term: PostGIS
      means: The PostgreSQL extension that adds spatial types, functions and indexes.
    - term: SRID 4326
      means: "The latitude and longitude system GPS uses; PostGIS points list longitude first."
    - term: GiST index
      means: "PostgreSQL's general search tree, which PostGIS uses as an R-tree style index of bounding boxes."
