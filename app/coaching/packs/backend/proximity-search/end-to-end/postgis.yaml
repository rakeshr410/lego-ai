beats:
  - point: "PostGIS is an extension installed on PostgreSQL that gives it location types and functions; a restaurant's location is inserted with ST_GeogFromText as a point, longitude first, in SRID 4326."
    kind: mechanism
    weight: core
    teach:
      - "Number three, and maybe the simplest: PostgreSQL with the PostGIS extension. Install it and the database itself understands locations and distances."
      - "When a restaurant joins, insert its name and its location: ST_GeogFromText with a point, 77.5946 then 12.9716 for Bangalore. Longitude comes first, then latitude, and SRID 4326 is the system GPS uses."
    draw: [pg, pg-insert, pg-values, pg-point, pg-lonlat]
    check: In the PostGIS point for Bangalore, which number comes first, latitude or longitude?
    answer: "Longitude first (77.5946), then latitude (12.9716)."
    misconceptions:
      - "POINT takes latitude then longitude -> PostGIS points are x then y, longitude then latitude."
  - point: "The search is one query: ST_DWithin(location, the user's point, 5000) keeps the restaurants within 5000 metres, 5 km, because geography distances are in metres."
    kind: flow
    weight: core
    teach:
      - "To search, select from restaurants where ST_DWithin of the location column, the user's current point, and 5000."
      - "On a geography column the distance is in metres, so 5000 is 5 kilometres. No cells, no neighbours: the database does the geometry."
    draw: [pg-select, pg-within, pg-user, pg-radius]
    check: "In ST_DWithin(location, user point, 5000), what is 5000?"
    answer: "5000 metres, 5 km, because geography distances are in metres."
  - point: "It is fast because of a GiST index on the location column, an R-tree style index of bounding boxes, not because it geohashes; without the index it tests every row."
    kind: mechanism
    weight: supporting
    teach:
      - "What makes it fast? Create a GiST index on the location column. PostGIS uses it as an R-tree style index of bounding boxes, so ST_DWithin only looks at nearby rows."
      - "It does not geohash behind the scenes. And without the index, the same query compares every row."
    draw: [pg-gist]
    check: What do you need to add so the ST_DWithin query does not scan every row?
    answer: A GiST index on the location column.
    misconceptions:
      - "PostGIS geohashes everything by default -> it uses a GiST, R-tree style index, which you create on the column."
asks:
  - ids: [pg-within, pg-radius]
    beats: [2]
    frame: [pg-select]
    question: "PostGIS has a function, ST_DWithin, that tests whether two locations are within a distance. How would you use it to find restaurants within 5 km?"
    hints:
      - It takes the column, the user's point, and a distance.
      - In what unit would the distance be?
  - ids: [pg-gist]
    beats: [3]
    question: "That query is correct. What makes it fast on millions of rows?"
    hints:
      - What does any database need to avoid a full scan?
      - Which kind of index suits locations?
