context:
  after: null
  assumes: []
  carries:
    - "Proximity search returns the places (restaurants, drivers, hotels) within a radius of a user's location, say 5 km."
    - "It is a building block of designs like Uber, food delivery or hotel booking, rarely the question itself."
    - "Four approaches, in this order: quadtree, geohash, PostgreSQL with PostGIS, Elasticsearch."
  terms:
    - term: proximity search
      means: "Given a latitude, a longitude and a radius, find the stored places inside that circle."
    - term: spatial index
      means: An index that narrows a search to the part of the map near a point, so not every row is read.
