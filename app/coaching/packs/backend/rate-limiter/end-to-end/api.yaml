beats:
  - point: "Clients never call a rate limiter, so its API is the admin's: create a rule, read a client's rules, and read metrics for a resource."
    kind: flow
    weight: core
    teach:
      - "Step three. First ask whether the interviewer wants endpoints; listing them takes time. If so: the limiter is internal, so no client endpoint. The admin needs three, to keep rules configurable at runtime."
      - "POST v1 admin rules creates a rule. GET v1 admin rules with a client ID reads that client's rules. GET v1 admin rate limit metrics for a resource feeds dashboards and audits."
    draw: [api, api-create, api-get, api-metrics]
    check: Why is there no endpoint for ordinary clients?
    answer: "The limiter sits inside the request path; clients only meet it through the product's own APIs and the 429 it sends back."
    misconceptions:
      - "Clients call the rate limiter to ask if they may proceed -> the gateway calls it on their behalf; clients never see it except as a 429."
  - point: "A blocked client gets 429 with its limit, the requests remaining, when the window resets, and Retry-After, plus an error body saying why."
    kind: flow
    weight: core
    teach:
      - "The response matters as much: a blocked client must know it was limited, not broken. Status 429 Too Many Requests."
      - "Headers: the limit, 100; remaining, 0; the reset time as a Unix timestamp; Retry-After, 30 seconds. And a body: error rate limit exceeded, with a message to retry after 30 seconds, like a chat app saying when you can use it again."
    draw: [resp-status, resp-limit, resp-remaining, resp-reset, resp-retry, resp-body-1, resp-body-2]
    check: Which header tells the client when it may try again?
    answer: "Retry-After, in seconds; X-RateLimit-Reset gives the window's reset time."
asks:
  - ids: [api-create, api-get, api-metrics]
    beats: [1]
    question: "Who calls this system's API, and what endpoints would they need? Give me the method and the path."
    hints:
      - Clients never call a rate limiter directly. Who changes the rules?
      - They need to create rules, read them, and see how the limits behave.
  - ids: [resp-status, resp-retry]
    beats: [2]
    question: "And when a client is over its limit, what exactly do we send back?"
    hints:
      - There is a status code made for this.
      - What would the client need to know to try again sensibly?
