  assumes:
    - "Functional: rules configurable at runtime; over the limit, answer 429."
    - "The core entities are the rule, the client and the request counter."
  carries:
    - "The API is the admin's: POST /v1/admin/rules, GET /v1/admin/rules?clientId=xyz, GET /v1/admin/rate-limit/metrics?resource=url."
