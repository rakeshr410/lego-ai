beats:
  - point: "The token bucket has three settings: the capacity, 10 tokens; the refill rate, 1 token a second; and the cost of a request, normally 1 token."
    kind: mechanism
    weight: core
    teach:
      - "Of the five, interviewers ask most about the token bucket and the leaky bucket, so explain both well. The token bucket needs three numbers."
      - "Capacity, the most tokens the bucket holds: 10. Refill rate, how fast tokens come back: 1 a second. And cost per request, 1 token by default."
    draw: [lld-tb, tb-capacity, tb-refill-rate, tb-cost]
    check: What are the token bucket's three settings?
    answer: "Its capacity, its refill rate, and the cost in tokens of one request."
  - point: "A refiller drips tokens into the bucket at the refill rate and stops when it is full, so the bucket never holds more than its capacity."
    kind: mechanism
    weight: core
    teach:
      - "Draw the bucket, and above it the refiller adding one token a second."
      - "The bucket cannot overflow: at 10 tokens, new ones are thrown away. A quiet client's bucket fills up and stays full."
    draw: [tb-refill, tb-bucket, tb-refill-bucket]
    check: A client sends nothing for a minute. How many tokens does its bucket hold?
    answer: "10, the capacity; refilling stops when the bucket is full."
  - point: "Each request takes a token and goes on to the backend; a request that finds the bucket empty gets 429."
    kind: flow
    weight: core
    teach:
      - "Requests come in from the left. Each takes one token and goes on to the backend."
      - "If the bucket is empty, there is no token to take: the request is refused with 429. Two flows run at once, tokens spent by requests and tokens added by the refiller."
    draw: [tb-req, tb-req-bucket, tb-backend, tb-bucket-backend, tb-reject, tb-bucket-reject]
    check: What decides whether a request passes?
    answer: "Whether the bucket has a token for it; with one, it takes it and passes, with none it gets 429."
  - point: "A full bucket lets a burst of 10 through at once, then one request a second as tokens return, which meets the burst requirement within a cap; Retry-After is the time to the next token."
    kind: mechanism
    weight: core
    teach:
      - "Send ten requests at once into a full bucket: all ten pass. The eleventh finds it empty and gets 429. Stop, and a token comes back each second, so one more passes each second."
      - "That is the burst requirement met with a cap: a client may save up to 10 and spend them together, but never more than 1 a second over time. And the 429's Retry-After is simply the time until the next token, 1 second here."
    draw: [tb-burst, tb-retry]
    check: "Capacity 10, refill 1 a second, full bucket. Fifteen requests arrive at once. What happens?"
    answer: "Ten pass and five get 429; after that one passes each second as tokens return."
    misconceptions:
      - "The token bucket smooths bursts out evenly -> it lets a burst through up to the capacity; smoothing is the leaky bucket."
  - point: "Nothing drips on a timer: each client's state in Redis is tokens left and the last refill time, topped up on each request by the elapsed time times the rate, in one atomic Lua script."
    kind: mechanism
    weight: core
    teach:
      - "The refiller is a picture, not a process per client. Store two numbers per client in Redis: tokens left and when we last refilled."
      - "On each request, add the elapsed seconds times the refill rate, capped at 10, then take a token if there is one. Do the read and the update in one Lua script, or two gateways can spend the same token."
    draw: [tb-state, tb-lazy, tb-atomic]
    check: How do tokens get refilled without a timer for every client?
    answer: "Lazily: on each request, compute the tokens earned since the last refill from the elapsed time and the rate, capped at the capacity."
  - point: "Burst friendly, two numbers per client, one Redis call per decision: the token bucket is the algorithm most production limiters choose."
    kind: decision
    weight: supporting
    teach:
      - "Write the verdict: burst friendly and cheap. It fits all three non-functional lines, which is why it is the common choice in industry."
    draw: [tb-verdict]
    check: Why does the token bucket fit this system's requirements?
    answer: "It allows bursts within a cap, keeps two numbers per client, and decides in one fast Redis call."
asks:
  - list: tb-params
    beats: [1]
    question: "A bucket of tokens, one spent per request. What numbers would you need to configure it?"
    hints:
