# Rate limiter interview, deep dive 4: token bucket. Under "5. Deep dive: 4. Token bucket": the three settings (capacity 10, refill 1 a second, cost 1), then the bucket with its refiller above, incoming requests on the left taking tokens, the backend on the right for the allowed ones and the 429 below for an empty bucket, then the burst, Retry-After, and the state kept in Redis, as the video demonstrates it.
id: backend/rate-limiter/end-to-end/lld-token-bucket
title: "Deep dive, 4: token bucket"
