      - What did we promise to answer when a client is over its limit?
  - ids: [tb-state]
    beats: [5]
    question: "We can't run a timer for every client. What would you store per client in Redis so the refill still works?"
    hints:
      - You need to know how many tokens are left.
      - And how long it has been since you last added any.
