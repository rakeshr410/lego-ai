context:
  after: backend/rate-limiter/end-to-end/lld-sliding-counter
  assumes:
    - "Counters live in one shared Redis, updated atomically."
    - "Functional: handle bursts. Fixed window leaks at edges; the log costs memory; the sliding counter approximates."
  carries:
    - "Token bucket: capacity 10, refill 1 token a second, cost 1 a request; a request takes a token or gets 429."
    - "A full bucket lets a burst of 10 through, then 1 a second; Retry-After is the time to the next token."
    - "State per client in Redis: tokens left and last refill time, refilled lazily, read and updated in one atomic Lua script."
  terms:
    - term: token
      means: "A permit to make one request; requests spend them, the refiller adds them at a fixed rate."
    - term: capacity
      means: "The most tokens the bucket holds, and so the largest burst."
