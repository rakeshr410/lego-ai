beats:
  - point: "A rate limiter is an algorithm run against the client's rule and counter; there are five common ones: fixed window counter, sliding window log, sliding window counter, token bucket and leaky bucket."
    kind: rule
    weight: core
    teach:
      - "Step five, the deep dive. Inside, the limiter is an algorithm that takes the rule and the counter and filters requests."
      - "Name all five first: fixed window counter, sliding window log, sliding window counter, token bucket, leaky bucket. In the interview, name them, say which you would use, then expect to code it."
    draw: [lld-fw, fw-five-1, fw-five-2]
    check: Name the five common rate limiting algorithms.
    answer: "Fixed window counter, sliding window log, sliding window counter, token bucket and leaky bucket."
  - point: "Fixed window: cut time into windows of 10 seconds, keep one counter per client per window, allow up to 5, refuse the sixth with 429, and start again at zero when the next window opens."
    kind: mechanism
    weight: core
    teach:
      - "Cut the time line into fixed windows: 0 to 10 seconds, 10 to 20, 20 to 30. The rule says at most 5 requests per window."
      - "Each request adds one to the client's counter for the current window. Five pass; the sixth gets 429. When the clock reaches the next window, the counter starts again at zero."
    draw: [fw-idea, fw-rule, fw-w1, fw-w2, fw-w3, fw-sixth]
    check: "Limit 5 per 10 seconds. A client sends its sixth request at 7 seconds, then another at 11 seconds. What happens to each?"
    answer: "The one at 7 seconds is refused with 429; the one at 11 seconds is in a new window whose counter started at zero, so it passes."
  - point: "In the shared Redis, the counter is one atomic INCR on a key named for the client and window, set to expire when the window ends."
    kind: mechanism
    weight: supporting
    teach:
      - "Only two numbers per client: the count and its window. In Redis that is one key per client and window, incremented atomically with INCR, and set to expire when the window ends, so old windows clean themselves up."
    draw: [fw-redis]
    check: Why an atomic INCR rather than reading the count and writing it back?
    answer: "Two gateways reading and writing separately can both see 4 and both allow; INCR gives each a distinct count."
  - point: "The flaw is at the edges: 5 requests at 9.9 seconds and 5 at 10.1 seconds all pass, 10 in 0.2 seconds, twice the limit, because the windows reset on the clock."
    kind: failure
    weight: core
    teach:
      - "Now the edge. A client sends 5 at 9.9 seconds: the first window allows them. At 10.1 seconds the counter has reset, so 5 more pass."
      - "Ten requests in two tenths of a second, twice what the rule meant. The problem is not that it cannot take a burst; it lets too much of one through at a boundary."
    draw: [fw-burst-1, fw-burst-2, fw-flaw]
    check: "Limit 5 per 10 seconds. How can a client get 10 requests through in well under a second?"
    answer: "Send 5 just before a window ends and 5 just after it starts; the counter resets in between."
    misconceptions:
      - "The fixed window cannot handle bursts -> it lets too much burst through: up to twice the limit across a window edge."
  - point: "Fixed window is simple and cheap, two numbers per client, but its edges leak; the next algorithms make the window slide."
    kind: decision
    weight: supporting
    teach:
      - "Write the verdict: simple, two numbers per client, but the edges leak. The fix is to stop the windows standing still: let the window slide with time."
    draw: [fw-verdict]
    check: What would fix the edge problem?
    answer: "A window that slides with time, so any 10-second span is checked, not just the clock's windows."
