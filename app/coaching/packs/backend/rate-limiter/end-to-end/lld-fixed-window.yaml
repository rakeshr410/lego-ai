# Rate limiter interview, deep dive 1: fixed window counter. Under "5. Deep dive: 1. Fixed window counter": the five algorithms named, the windows on a time line (0 to 10, 10 to 20, 20 to 30 seconds), the limit of 5, and the edge burst of 5 at 9.9 s and 5 at 10.1 s, as the video draws it. The video says ten pass in 0.3 s and that the algorithm cannot support bursts; this pack teaches 0.2 s and that it lets twice the limit through at an edge.
