beats:
  - point: "A rate limiter refuses a client's requests once they pass a limit within a time window, protecting backends from abuse, overload, bots and runaway cost."
    kind: rule
    weight: core
    teach:
      - "Write the title, then the prompt in one line: a rate limiting system that protects backend services from abuse, overload, unfair use, bot traffic, brute force and cost explosions, by limiting how many requests a client makes in a window."
      - "Then an example. An AI product generates images on a costly model, so each user may make 15 image requests a minute; the sixteenth is refused until the minute moves on."
    draw: [title, prompt-desc, prompt-example]
    check: "In your own words, what does a rate limiter do, and why would an image generation API want one?"
    answer: "It counts each client's requests in a time window and refuses them past a limit; image generation is costly, so unlimited use would overload the backend and the bill."
  - point: "The interview runs in five steps, requirements, entities, API, high-level design, deep dive, and for this question the interviewer often asks for the algorithm as working code at the end."
    kind: rule
