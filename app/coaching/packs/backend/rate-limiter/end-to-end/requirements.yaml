# Rate limiter interview, requirements: "1. Functional requirements" on the left and "Non-functional requirements" on the right, under the prompt, as the video lays them out; five functional lines, three non-functional ones with their numbers.
id: backend/rate-limiter/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "ba89bbcb6a24"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/rate-limiter/end-to-end/problem-statement
  assumes:
    - "A rate limiter refuses a client's requests once they pass a limit within a time window."
  carries:
    - "Functional: limit requests per client by user ID, API key or IP; rules configurable at runtime; 429 over the limit; handle bursts; limits per tier."
    - "Non-functional: 1 million requests per second; availability over consistency, rules may arrive late; under 5 ms per decision."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, stated with a number: scale, availability, latency."
    - term: burst
      means: "Many requests from one client in a short span, such as the first seconds of a sale."
    - term: eventual consistency
      means: "A change, such as a new rule, reaches every copy a little later, but it gets there."
