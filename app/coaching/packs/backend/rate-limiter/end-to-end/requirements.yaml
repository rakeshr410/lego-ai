beats:
  - point: "The core functional requirement is to limit how many requests a client makes, keyed by user ID, API key or IP, with the rules configurable at runtime by an admin."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: what it does. First, limit the number of requests a client makes, say 10 a minute. The client can be keyed by user ID, API key or IP address."
      - "Second, the rules are not constants in code: an admin changes them at runtime, config driven."
    draw: [fr, fr-limit, fr-config]
    check: By what can a limit be keyed?
    answer: "By user ID, API key or IP address, and the rule itself is changed by an admin at runtime."
  - point: "Over the limit, the limiter answers HTTP 429 Too Many Requests, a meaningful response rather than a bare failure."
    kind: requirement
    weight: core
    teach:
      - "When a client is over its limit, tell it so: HTTP 429, Too Many Requests. A client that gets a generic error thinks the service is broken."
    draw: [fr-429]
    check: Which status code does a blocked client get?
    answer: "429, Too Many Requests."
  - point: "It must handle burst traffic, such as the start of a sale, and support different limits per tier, free or paid."
    kind: requirement
    weight: core
    teach:
      - "Bursts: during a sale a client may fire many requests at once, and the limiter must cope. The algorithms later differ most on exactly this line."
      - "Tiers: a product sells a free tier, an 8 dollar tier and a 20 dollar tier, and each gets its own limits."
    draw: [fr-burst, fr-tier]
    check: Give an example of why limits differ by tier.
    answer: "A free user gets fewer requests a minute than a paying one, such as free versus the 8 or 20 dollar plans."
  - point: "Scale first: every request in the company passes the limiter, so plan for about 1 million requests per second."
    kind: metric
    weight: core
    teach:
      - "On the right, the qualities. Ask for the scale first. All traffic passes through a rate limiter, so it is high: say 1 million requests per second."
    draw: [nfr, nfr-scale]
    check: Why is a rate limiter's scale so high compared with the service it protects?
    answer: "Every request into every API passes through it, so it carries all the traffic."
  - point: "Availability over consistency: a new rule may take about a minute to reach every limiter, but the limiter must never be down, since every request depends on it."
    kind: requirement
    weight: core
    teach:
      - "CAP: when the network between machines splits, a distributed system either keeps answering or stays consistent. Here, keep answering."
      - "If the limiter is down, every request behind it is lost. If an admin's rule change reaches all limiters a minute later, nobody is hurt. So availability, with eventual consistency for rules."
    draw: [nfr-cap]
    check: Why is it fine for a rule change to arrive late, but not for the limiter to be down?
    answer: "A slightly stale rule lets a few extra or fewer requests through; a down limiter fails every request in the company."
    misconceptions:
      - "CAP means a system can never be both available and consistent -> the choice is forced only when the network partitions; the limiter chooses to keep answering then."
  - point: "Latency under 5 ms per decision, because the check is added to every request."
    kind: metric
    weight: core
    teach:
      - "Last, latency: ultra low. Decide allow or block within 5 milliseconds, or the whole backend feels the lag."
    draw: [nfr-latency]
    check: Why must the decision take under 5 milliseconds?
    answer: Because it sits in front of every request; its delay is added to every API call.
asks:
  - list: fr-list
    beats: [1, 2, 3]
    question: "So what should this rate limiter do? Give me the features one at a time, and I'll write them down."
    hints:
      - What does it limit, and how do you tell one client from another?
      - And what does a client see when it goes over?
  - list: nfr-list
    beats: [4, 5, 6]
    question: "Now the qualities. How much traffic, how reliable, how fast? A number where you can."
    hints:
      - Every request passes through it. What does that say about its scale and speed?
      - And what matters more when machines fail, staying up or staying exact?
