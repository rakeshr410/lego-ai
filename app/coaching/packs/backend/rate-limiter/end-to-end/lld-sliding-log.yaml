beats:
  - point: "The sliding window log keeps a timestamp for every allowed request of each client, so the window can slide with time instead of standing on the clock."
    kind: mechanism
    weight: core
    teach:
      - "The fixed window leaked at its edges because it stood still. Make it slide: the window is always the last 10 seconds, like the sliding window problems in algorithms practice."
      - "To know what fell in the last 10 seconds, log the time of every allowed request. A client that sent at 0, 2, 4, 6 and 8 seconds has five stamps."
    draw: [lld-sl, sl-idea, sl-s0, sl-s2, sl-s4, sl-s6, sl-s8]
    check: What does the sliding window log keep for each client?
    answer: "A timestamp for every allowed request still inside the window."
  - point: "On each request, drop the stamps older than 10 seconds and count the rest: fewer than 5, allow and log it, otherwise 429; as old stamps expire, room opens again."
    kind: mechanism
    weight: core
    teach:
      - "When a request comes in, first throw away stamps older than 10 seconds, then count. Fewer than 5: allow it and add its stamp. Otherwise 429."
      - "With those five stamps, a sixth at 9 seconds is refused. At 11 seconds the stamp from 0 seconds has expired, so there are four, and one more fits."
    draw: [sl-rule, sl-allow, sl-full, sl-slide]
    check: "Stamps at 0, 2, 4, 6 and 8 seconds, limit 5 per 10 seconds. Does a request at 10.5 seconds pass?"
    answer: "Yes: the stamp at 0 seconds is older than 10 seconds and is dropped, leaving four, so it is allowed and logged."
  - point: "It is exact, any 10-second span holds at most 5, but every request is stored until it ages out, so memory grows with the traffic: too costly at a million requests a second."
    kind: failure
    weight: core
    teach:
      - "It is precise: no span of 10 seconds ever holds more than 5, so the edge burst is gone."
      - "The price is memory and work: a stored stamp for every request, kept and evicted per client. At a million requests a second that is the bulk of the system, so it is rarely used at this scale."
    draw: [sl-exact, sl-cost, sl-verdict]
    check: Why is the sliding window log rarely used at a million requests a second?
    answer: "It stores a timestamp for every request in the window and must evict them, so memory and work grow with the traffic."
    misconceptions:
      - "The log is inaccurate -> it is the exact one; its problem is memory, not accuracy."
asks:
  - ids: [sl-idea]
    beats: [1]
    question: "The fixed window leaks because it stands still. How could we count exactly what happened in the last 10 seconds, at any moment?"
    hints:
      - What would you need to remember about each request?
      - Then which of those still fall in the last 10 seconds?
  - ids: [sl-cost]
    beats: [3]
    question: "It's exact. So what does it cost us, at a million requests a second?"
    hints:
      - What is stored for every single request?
      - How long does each entry stay, and who removes it?
