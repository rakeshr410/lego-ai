# Rate limiter interview, deep dive 2: sliding window log. Under "5. Deep dive: 2. Sliding window log": a timestamp kept per request, five stamps in a row inside a 10-second window, the rule (drop stamps older than 10 s, count the rest, allow under 5), the sixth refused and the slide that lets one more in, then the memory cost, as the video demonstrates it.
