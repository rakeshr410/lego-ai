context:
  after: backend/rate-limiter/end-to-end/lld-fixed-window
  assumes:
    - "Fixed window counts per clock window and lets twice the limit through at an edge."
    - "Non-functional: 1M rps, under 5 ms."
  carries:
    - "Sliding window log: a timestamp per allowed request; drop those older than the window, allow if fewer than the limit remain."
    - "It is exact, with no edge burst, but memory grows with every request kept, too costly at 1M rps."
  terms:
    - term: sliding window
      means: "A window that ends at the current moment and moves with time: the last 10 seconds, always."
