# Rate limiter interview, deep dive 5: leaky bucket, and the choice. Under "5. Deep dive: 5. Leaky bucket": a burst of requests joining a queue of 8 drained at 1 a second into a steady backend, the overflow dropped below the queue, the waiting it costs; then the choice of the token bucket and the code's shape the video walks through: a rule's algorithm read by the factory, which returns the token bucket strategy, which the gateway calls. The video likens the queue to a CDC pipeline; this pack calls it a first-in, first-out queue.
