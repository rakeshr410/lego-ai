beats:
  - point: "The leaky bucket puts incoming requests in a first-in, first-out queue of fixed size, 8, and a worker takes them off at a fixed rate, 1 a second, whatever rate they arrive at."
    kind: mechanism
    weight: core
    teach:
      - "The leaky bucket turns the idea around. Instead of tokens, a queue: every request joins it, and a consumer takes them off in order at a steady rate."
      - "Here the queue holds 8 and drains at 1 a second. A burst arrives, the queue fills, and the backend still sees exactly one request a second."
    draw: [lld-lk, lk-idea, lk-burst, lk-queue, lk-burst-queue, lk-backend, lk-queue-backend]
    check: "A burst of 6 requests arrives at once at an empty leaky bucket, size 8, draining 1 a second. When does the backend see them?"
    answer: "One a second, over about 6 seconds, in arrival order."
    misconceptions:
      - "The leaky bucket is a CDC pipeline -> it is a bounded first-in, first-out queue drained at a fixed rate; change data capture streams database changes, a different thing."
  - point: "When the queue is full, new requests are dropped with 429."
    kind: failure
    weight: core
    teach:
      - "The queue is bounded. With 8 waiting, a ninth request has nowhere to go: it is dropped, and the client gets 429."
    draw: [lk-drop, lk-queue-drop]
    check: What happens to a request that arrives when all 8 slots are taken?
    answer: "It is dropped, answered with 429."
  - point: "The cost is waiting: a request at the back waits behind everything ahead of it, up to 8 seconds here, so use it only when a backend needs a steady rate."
    kind: failure
    weight: core
    teach:
      - "Queues add latency. The last request in line waits for all the others, up to 8 seconds here, far past a 5 millisecond budget."
      - "So use it when the backend demands a steady rate, a delicate service or a provider that allows a fixed number of calls a second, not in front of an interactive API."
    draw: [lk-wait, lk-when]
    check: Why is the leaky bucket a poor fit for an interactive API gateway?
    answer: "Requests wait in the queue, so a burst adds seconds of delay, far beyond the 5 millisecond budget."
  - point: "Of the five, choose the token bucket: it allows bursts within a cap, keeps two numbers per client and decides in one Redis call."
    kind: decision
    weight: core
    teach:
      - "Now choose, as the interviewer will ask. Fixed window leaks at edges, the log costs memory, the sliding counter approximates, the leaky bucket adds waiting."
      - "The token bucket is the one most used in industry: burst friendly within a cap, systematic, cheap."
    draw: [lk-choice]
    check: Which algorithm would you choose for the gateway, and why not the leaky bucket?
    answer: "The token bucket, for bursts within a cap and a cheap fast decision; the leaky bucket smooths by queueing, which adds delay."
  - point: "Code it with the strategy pattern: one RateLimiterStrategy interface with allowRequest, five strategies behind it, and a factory that reads the rule's algorithm and returns the matching strategy built with that rule's settings."
    kind: mechanism
    weight: core
    teach:
      - "Then the code. Each algorithm is a strategy behind one interface with one method, allow request."
      - "The rule from Redis says which algorithm, say token bucket. A rate limiter factory switches on it and returns a token bucket strategy built with the rule's capacity and refill rate; a window algorithm gets its limit and window instead."
    draw: [st-interface, st-rule, st-factory, st-rule-factory, st-strategy, st-factory-strategy]
    check: Why use the strategy pattern here?
    answer: "Five interchangeable algorithms, chosen per rule at runtime, behind one allowRequest interface, so the caller never changes when the algorithm does."
  - point: "The gateway holds the strategy it was given and calls allowRequest on every request, so changing a rule's algorithm changes behaviour without changing the gateway."
    kind: flow
    weight: core
    teach:
      - "The API gateway is handed the strategy and calls allow request for each incoming request; true forwards it, false answers 429."
      - "It never knows which algorithm runs. An admin switching a rule to sliding window changes only what the factory returns."
    draw: [st-gateway, st-gateway-strategy]
    check: An admin changes a rule from token bucket to sliding window counter. What code in the gateway changes?
    answer: "None; the factory returns a different strategy and the gateway still calls allowRequest."
  - point: "Read the requirements back: gateways scale out to 1 million requests a second with one shared Redis, a decision is one in-memory call under 5 ms, and rules arrive by write-through a moment late."
    kind: decision
    weight: supporting
    teach:
      - "Close by reading the non-functional list on the right against the design: scale from gateway copies sharing one Redis, latency from one in-memory call per decision, availability with rules arriving a moment late and nothing waiting on the policy database during a request."
    draw: [st-readback]
    check: Which part of the design keeps each decision under 5 milliseconds?
    answer: "One atomic call to the in-memory Redis per request, with the rule already cached there."
