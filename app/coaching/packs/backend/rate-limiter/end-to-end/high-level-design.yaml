# Rate limiter interview, high-level design: "4. High level designing" under the requirements, as the video draws it. First any service's picture, clients, a tall load balancer and API gateway, backend services, with the three places the limiter could go noted beside it; then, under it, the redrawn picture: the gateway's copies holding a load balancer and the rate limiter inside the gateway, backend services, Redis under the gateway, the policy service and its Postgres database, the flow and the rule table as notes.
id: backend/rate-limiter/end-to-end/high-level-design
title: Where the limiter sits, and its shared state
source:
  hash: "2c0913636468"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/rate-limiter/end-to-end/api
  assumes:
    - "Functional: limit per client, rules configurable at runtime, 429, bursts, tiers. Non-functional: 1M rps, availability over consistency, under 5 ms."
    - "The admin API creates and reads rules; a blocked client gets 429."
  carries:
    - "The limiter sits in the API gateway: not on the client (tamperable), not per service replica (each counts alone)."
    - "Flow: load balancer, gateway auth check, limit check, then the backend or 429."
    - "Counters live in one shared Redis, updated atomically, because the gateway is replicated."
    - "A policy service saves rules to PostgreSQL, then writes them to Redis (write-through), so rules are eventually consistent."
  terms:
    - term: API gateway
      means: The entry point that authenticates requests and routes each to the right backend service.
    - term: write-through
      means: "Writing a change to the database and then to the cache, so the cache holds what the database holds."
    - term: replica
      means: One of many identical copies of a service, run to carry more traffic.
