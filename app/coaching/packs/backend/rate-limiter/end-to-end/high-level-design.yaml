beats:
  - point: "Start from any service's picture: clients, a load balancer and API gateway that route each request, and backend services such as an image service at 10 a minute and a text service at 100 a minute."
    kind: component
    weight: core
    teach:
      - "Step four. Before placing the limiter, draw where it lives: clients on the left, then the load balancer and API gateway, then the backend services."
      - "The gateway routes each request by its path to the right service; the load balancer spreads it across that service's copies. Here an image service allows 10 images a minute, and a text service 100 conversations a minute."
    draw: [hld, c1, c2, c3, lbgw, c1-lbgw, c2-lbgw, c3-lbgw, svc-image, lbgw-image, svc-text, lbgw-text, svc-other, lbgw-other]
    check: What does the gateway do with a request, and what does the load balancer do?
    answer: "The gateway routes it by its path to the right backend service; the load balancer spreads requests across that service's copies."
  - point: "The limiter could sit on the client, counting clicks in a cookie or local storage, but the user can clear or edit that, so it is never a real control."
    kind: failure
    weight: core
    teach:
      - "First place to try: where the request starts, the button on the client. Count clicks in a cookie or local storage and disable the button after 10 a minute."
      - "But anything on the client belongs to the user: clear the cookie and the count is gone. A courtesy, not enforcement."
    draw: [opt-client]
    check: Why can't the client be trusted to enforce its own limit?
    answer: "Its counter lives in a cookie or local storage the user can clear or change."
  - point: "Inside each backend service fits per-service limits, but each service runs many replicas, and each replica's counter sees only its own share of a client's requests."
    kind: failure
    weight: core
    teach:
      - "Second place: inside each service, so the image service enforces 10 a minute and the text service 100."
      - "At a million requests a service runs thousands of replicas. My first image request lands on replica one, my second on replica two: each counts 1. A shared counter could fix it, but there is a better place."
    draw: [opt-service]
    check: Two requests from one user land on two replicas of the image service. What does each replica's counter say?
    answer: "Each says 1, because neither sees the other's count; the limit is never added up."
  - point: "The usual place is the API gateway, as a plugin, middleware or filter, the one point every request passes; a reverse proxy, sidecar or dedicated service also work."
    kind: decision
    weight: core
    teach:
      - "Third place: where every request first arrives, the gateway. The limiter is a plugin or middleware inside it, and the gateway is the enforcement point."
      - "Other places exist, a reverse proxy, a sidecar, a dedicated rate limiter service, a layer before the database. Now redraw it below: the gateway has copies, each holding a load balancer in front and the rate limiter inside the gateway."
    draw: [opt-gateway, places, tier, g-clients, g-lb, g-clients-lb, g-rl, g-lb-rl]
    check: Why is the gateway the most common place to enforce limits?
    answer: "Every request passes through it before any backend, so one check covers all services, and the client cannot bypass it."
  - point: "The flow: the request passes the load balancer to the gateway, which checks authentication, then asks the limiter; allowed goes on to the backend, rejected gets 429."
    kind: flow
    weight: core
    teach:
      - "Walk one request. Client, load balancer, gateway. The gateway first checks authentication, then calls the limiter for a decision, which reads the client's rule and counter."
      - "True: forward to the backend. False: answer 429 to the client."
    draw: [g-backends, g-rl-backends, flow-1, flow-2]
    check: In what order does the gateway check a request?
    answer: "Authentication first, then the rate limit; if allowed it forwards to the backend, otherwise it answers 429."
  - point: "The gateway is replicated too, so each copy's counter would disagree; keep every counter in one shared Redis, in memory for the 5 ms budget, updated atomically."
    kind: mechanism
    weight: core
    teach:
      - "The same replica problem comes back: at this scale there are many gateway copies, so many limiters, and a client's next request may hit a different one with a fresh counter."
      - "Move the counters outside, to one shared store all copies use. It must answer in well under 5 milliseconds, so it is a cache: Redis. Each check and count is one atomic step, or two copies read the same count and both let a request through."
    draw: [g-redis, g-rl-redis, redis-why, redis-atomic]
    check: Why must the counters move out of the gateways, and why into Redis?
    answer: "Each gateway copy would count a client separately; one shared in-memory store gives every copy the same count within the 5 ms budget."
    misconceptions:
      - "Each gateway can keep its own counter and divide the limit by the number of gateways -> traffic is not spread evenly per client, so local counters still over or under count."
  - point: "A rate limiter policy service serves the admin API and saves rules to a policy database, then writes them to Redis, write-through, so rules arrive a moment later: the eventual consistency agreed earlier."
    kind: mechanism
    weight: core
    teach:
      - "Rules must be configurable, so add a rate limiter policy service behind the gateway to handle the admin endpoints, and a policy database to keep the rules."
      - "But the limiter reads Redis, not the database. So the policy service writes the rule to the database first, then to Redis: write-through. Two writes take a moment; that is why we chose availability over consistency."
    draw: [g-policy, g-rl-policy, g-policydb, g-policy-db, g-policy-redis, eventual]
    check: How does a rule an admin creates reach the limiters?
    answer: "Through the policy service, which saves it to the policy database and then writes it to Redis, where the limiters read it, a moment later."
  - point: "The policy database is PostgreSQL with one rate_limit_rules table: a subject type and value (user, API key, IP, tier, global), the endpoint, the algorithm, and its limits."
    kind: decision
    weight: core
    teach:
      - "Rules are small structured rows, so a relational database: Postgres."
      - "One table, rate limit rules: rule ID; subject type and subject value, such as user ID user 123, API key, IP, tier PREMIUM, or global; the endpoint, star for all; the algorithm; request limit and window seconds; burst capacity and refill rate; enforce by; whether it is active."
    draw: [schema-1, schema-2, schema-3, schema-4, schema-5, schema-6]
    check: How would you store a rule that gives premium users a higher limit on one endpoint?
    answer: "One row with subject type TIER, subject value PREMIUM, that endpoint, the algorithm, and its request limit and window."
asks:
  - ids: [lbgw]
    beats: [1]
    question: "Before placing the limiter, sketch any service for me: clients on the left, backend services on the right. What sits between them?"
    hints:
      - Something has to route each request to the right service.
      - And spread the traffic across copies of it.
  - ids: [opt-client, opt-service, opt-gateway]
    beats: [2, 3, 4]
    question: "Where could the rate limiter go in this picture? Give me every place you can think of, and what's wrong with each."
    hints:
      - Start where the request is created, then follow it in.
      - What happens to a counter when a service has many copies?
  - ids: [g-redis]
    beats: [6]
    question: "The gateway has many copies too, and each would count a client on its own. Where would you keep the counters?"
    hints:
      - Somewhere outside the gateways that all of them can reach.
      - It has to answer well within 5 milliseconds.
  - ids: [g-policy, g-policydb]
    beats: [7]
    question: "Admins must change rules at runtime. What would you add to the picture for that?"
    hints:
      - Something has to serve the admin endpoints.
      - And the rules need a durable home.
task:
  prompt: "Draw the high-level design: clients, a load balancer, the rate limiter inside the API gateway, backend services, Redis for the counters, and the policy service writing rules to its database and through to Redis."
  expects: [4, 6, 7]
