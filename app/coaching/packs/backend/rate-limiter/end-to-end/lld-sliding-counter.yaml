# Rate limiter interview, deep dive 3: sliding window counter. Under "5. Deep dive: 3. Sliding window counter": the previous window (0 to 10 s, 5 requests) and the current one (10 to 20 s, none yet) side by side, the sliding window from 2 to 12 s under them, and the weighted estimate worked out beside it, as the video draws it. The video weights the current window by 20 percent; this pack counts it whole, the standard formula.
