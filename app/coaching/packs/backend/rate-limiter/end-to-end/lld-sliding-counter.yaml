  carries:
    - "Sliding window counter: two counts, previous and current window; estimate = previous times its overlap share, plus current."
    - "At 12 s with 5 before and 0 now: 5 times 0.8 plus 0 is 4, plus this request is 5, allowed."
    - "Two numbers per client; approximate, because it assumes the previous window's requests were even."
  terms:
