beats:
  - point: "The cart service keeps carts in Postgres so a cart survives closing the app: cartId, restId, userId, the items and metadata."
    kind: component
    weight: core
    teach:
      - "The cart is simple: a cart service and a Postgres cart DB, so what the user picked is still there when they come back."
      - "The table: cart id, the restaurant it is for, the user, the list of items with quantities, and metadata."
    draw: [lld-cart, c-svc, c-db, c-save, c-schema]
    check: Why persist the cart in a database at all?
    answer: So it survives the user closing the app and coming back later.
  - point: "A cart belongs to one restaurant: switching restaurants starts a new cart, which is why the row carries the restaurant id and why an order never mixes kitchens."
    kind: rule
    weight: core
    teach:
      - "Notice how the apps behave: add something from a second restaurant and the cart empties and starts again. You cannot mix two restaurants in one order."
      - "That is why the cart carries a restaurant id: one cart per restaurant."
    draw: [c-rule]
    check: What happens when a user adds an item from a different restaurant?
    answer: A new cart is started for that restaurant; one cart, and so one order, never mixes two restaurants.
asks:
  - ids: [c-rule]
    beats: [2]
    question: "The cart row has a restaurant id. Why would a cart need that?"
    hints:
      - Can you order from two restaurants in one go on these apps?
      - What happens to your cart when you switch restaurants?
