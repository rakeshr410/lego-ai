      - How does a restaurant find out it has an order?
  - ids: [hld-matching, hld-location]
    beats: [5]
    question: "And the delivery partners. How would you pick a partner for an accepted order, and keep their positions current?"
    hints:
      - Matching needs to know where partners are and whether they are free.
      - Who tells the system where a partner is?
task:
  prompt: "Draw the high-level design: users through a load balancer and API gateway to user, search, cart and order services with their databases and the payment gateway; the restaurant service and order service on the restaurants' side; delivery matching, the driver DB and location updates from partners."
  expects: [2, 3, 4, 5]
