# Food delivery interview, high-level design: "4. High level designing" under the API. As in the video: users on the left, a tall load balancer and API gateway with its duties, a column of services each with its database to the right (user, search, cart, order with the payment gateway under it); the restaurants' side on the far right (restaurant gateway, restaurant service to the restaurant DB, an order service fed by the order DB); the partners' side at the bottom (delivery matching to the driver DB, location updates from partners through a gateway), and partners' live location back to the users.
id: backend/food-delivery/end-to-end/high-level-design
title: One service per job, for three actors
source:
  hash: "1ec4582ccc14"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/food-delivery/end-to-end/api
  assumes:
    - "Nine endpoints: register, nearby, search, restaurant, menu, cart, order, payment, tracking."
    - "Three actors: the user, the restaurant and the delivery partner."
  carries:
    - "Users reach a load balancer and API gateway (auth, rate limiting, routing, round robin), then user, search, cart and order services, each with its own database."
    - "The order service pays through a third-party payment gateway before the order counts; failed payments are kept as failed orders."
    - "Restaurants have a restaurant service writing the restaurant DB and an order service that pushes new orders and takes accept."
    - "A delivery matching service pairs accepted orders with idle partners from the driver DB, kept current by partners' location updates every 5 s."
  terms:
    - term: API gateway
      means: "The front door: authentication and authorisation, rate limiting and routing by path."
    - term: load balancer
      means: "Spreads requests across a service's instances, here round robin."
