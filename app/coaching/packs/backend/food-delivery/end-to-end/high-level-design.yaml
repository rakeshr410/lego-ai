beats:
  - point: "Every user request reaches a load balancer and API gateway, which authenticates and authorises, rate-limits, routes by path and balances round robin."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. This one differs from simpler designs: three actors, so three flows. Start with the user's: draw the users."
      - "It is a set of services, so the users go through a load balancer and API gateway. Write its duties beside it: authentication and authorisation, rate limiting, routing, and load balancing round robin."
    draw: [hld, hld-users, hld-gateway, hld-users-gw, hld-duties]
    check: Name two things the API gateway does besides routing.
    answer: "Any two of: authentication and authorisation, rate limiting, load balancing across instances."
  - point: "Behind the gateway, a user service with its user DB for accounts, and a search service reading the restaurant DB for the nearby list and searches."
    kind: component
    weight: core
    teach:
      - "One service per requirement. Registration needs a user service, and a user DB for the users' details. The gateway routes by the URL to it."
      - "Nearby and search need a search service, which reads restaurant data: the restaurant DB. It is responsible for finding the relevant restaurants from the location, title and menu the user sends."
    draw: [hld-user-svc, hld-gw-user, hld-user-db, hld-user-to-db, hld-search-svc, hld-gw-search, hld-rest-db, hld-search-to-db]
    check: Which database does the search service read in this first picture?
    answer: The restaurant DB, with the restaurants and their menus.
  - point: "A cart service with a cart DB keeps the cart across visits; an order service calls the payment gateway first, then records the order, a failed payment as a failed order, in the order DB."
    kind: component
    weight: core
    teach:
      - "Adding to the cart needs a cart service, and a cart DB so the cart is still there when the user comes back."
      - "Placing the order is the order service. It is two steps: it first calls a third-party payment gateway, and only when the gateway answers does it write the order DB. A failed payment is written too, marked failed."
    draw: [hld-cart-svc, hld-gw-cart, hld-cart-db, hld-cart-to-db, hld-order-svc, hld-gw-order, hld-payment, hld-order-pay, hld-order-db, hld-order-to-db]
    check: Why does the order service call the payment gateway before writing the order as placed?
    answer: An order counts only once it is paid; the gateway's answer decides whether it is placed or failed.
  - point: "The restaurant side: restaurants come through their own gateway to a restaurant service that writes their listing and menu into the restaurant DB, and to an order service that learns of new orders and asks them to accept."
    kind: component
    weight: core
    teach:
      - "Now the restaurants, on the right, with their own gateway; its duties are the same as before. The listing search reads is uploaded by the restaurants themselves, through a restaurant service writing the restaurant DB."
      - "And an order service for restaurants. When an order lands in the order DB, it is told, and asks the restaurant to accept. That is why you see your order placed, then a minute or two later, accepted."
    draw: [hld-restaurants, hld-rest-gw, hld-rest-in, hld-rest-svc, hld-rgw-svc, hld-rest-write, hld-rest-orders, hld-rgw-orders, hld-new-order]
    check: Who writes the restaurant data that search reads?
    answer: The restaurants themselves, through the restaurant service, into the restaurant DB.
  - point: "The partner side: a delivery matching service reads accepted orders and finds idle partners near the restaurant in the driver DB, which partners keep current by sending their location every 5 seconds through a gateway to a location update service."
    kind: component
    weight: core
    teach:
      - "Once the restaurant accepts, we need a partner. A delivery matching service reads the accepted orders with no partner, checks the driver DB for partners near the restaurant who are idle, and assigns one."
      - "The driver DB holds each partner's location and status. Partners' phones send it, say every 5 seconds, through a gateway to a location update service, which writes the driver DB."
    draw: [hld-matching, hld-match-orders, hld-driver-db, hld-match-drivers, hld-partners, hld-partner-gw, hld-partners-gw, hld-location, hld-pgw-location, hld-location-db, hld-ping]
    check: What does the matching service need to know about each partner?
    answer: Where they are and whether they are idle or already delivering.
  - point: "After pickup, the partner's location flows to the user. Then name what the picture lacks: how the partner learns the food is ready, the notifications, and how hand-offs avoid losing orders."
    kind: flow
    weight: supporting
    teach:
      - "Once the partner picks the food up, their live location goes to the user who ordered."
      - "That covers every requirement at a high level, but say what is missing: nothing tells the partner the food is ready, there is no notification system, and nothing says how these services hand off safely. That is the deep dive."
    draw: [hld-live, hld-gaps]
    check: What is still missing from this high-level picture?
    answer: How the partner learns the food is ready, a notification system for the user, and how the services hand the order on without losing it.
asks:
  - ids: [hld-user-svc, hld-search-svc, hld-cart-svc, hld-order-svc]
    beats: [2, 3]
    question: "Behind the gateway, what services does the user's side need? Go through the requirements and name one per job."
    hints:
      - Accounts, finding restaurants, the cart, and checkout.
      - And where does each one keep its data?
  - ids: [hld-rest-svc, hld-rest-orders]
