beats:
  - point: "The user service registers users and logs them in: it checks the password hash in the user DB and returns a signed JWT the app sends on every later call."
    kind: mechanism
    weight: core
    teach:
      - "Step five, the deep dive: take the high-level picture and open each service, starting with the simplest, users."
      - "It onboards new customers and logs them in. At login it checks the credentials against the user DB and, if they match, returns a JWT, a signed token the app sends with every later request; the gateway checks it."
    draw: [lld-user, u-svc, u-db, u-check, u-jwt]
    check: Why return a JWT at login instead of checking the password on every call?
    answer: The signed token proves who the caller is, so the gateway can verify each request without going back to the user service and database.
  - point: "Users are relational rows with a unique email, so MySQL or Postgres: userId, email, password hash, address and metadata."
    kind: decision
    weight: core
    teach:
      - "The user DB is plainly relational: MySQL or Postgres. Write the table beside it: user id, email, password, address and other metadata."
      - "Say password hash, salted, never the password itself."
    draw: [u-schema]
    check: What is stored for the password?
    answer: A salted hash of it, never the password.
    misconceptions:
      - "Store the password encrypted so it can be emailed back -> store a one-way salted hash; resets replace it."
asks:
  - ids: [u-jwt]
    beats: [1]
    question: "After a user logs in, how do later calls prove who they are without sending the password every time?"
    hints:
      - Something the server signs and hands back.
      - The gateway checks it on every request.
