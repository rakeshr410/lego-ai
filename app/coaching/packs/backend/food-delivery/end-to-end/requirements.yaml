    - { id: nfr-list, in: nfr, at: [63, 7], step: 2, slots: 4, width: 54, items: [nfr-scale, nfr-available, nfr-consistent] }
beats:
  - point: "The user's browsing features: register and log in, see nearby open restaurants by location, search by title and menu item, and open a restaurant's menu."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: functional requirements. When the user opens the app they can sign up and log in."
      - "Then the home page: the nearby restaurants that are open, from the user's location. A search bar, by restaurant title or by dish. And opening a restaurant shows its menu."
    draw: [fr, fr-register, fr-nearby, fr-search, fr-menu]
    check: What does the user see first after logging in?
    answer: The list of nearby open restaurants, found from the user's location.
  - point: "Then ordering and delivery: add items to a cart and pay; the restaurant accepts and a nearby partner is assigned; after pickup the user sees the partner live; notifications at every stage, and past orders."
    kind: requirement
    weight: core
    teach:
      - "Ordering: pick one or more items, add them to the cart, and place the order by paying."
      - "Then the other actors. The restaurant accepts and starts cooking, and a nearby delivery partner is assigned, chosen by location to keep delivery time short. After pickup, the user sees where the partner is, nearly live. And the user is notified at every stage, with past orders in the profile."
    draw: [fr-cart, fr-assign, fr-live, fr-notify]
    check: When is a delivery partner assigned?
    answer: Once the restaurant accepts the order, a nearby partner is found from the partners' locations.
  - point: "Non-functional starts with scale: 50 million users and a million restaurants."
    kind: metric
    weight: core
    teach:
      - "On the right, the non-functional requirements: how big and how well. Ask for the scale; say 50 million users across the globe and a million restaurants listed."
      - "That number is why this becomes a set of services rather than one server."
    draw: [nfr, nfr-scale]
    check: Why ask for the scale at all?
    answer: Because many design decisions, services, search, databases, depend on how many users and restaurants there are.
  - point: "CAP is chosen per part: highly available for searching and browsing, strongly consistent for payment and orders."
    kind: requirement
    weight: core
    teach:
      - "At this scale it is a distributed system, so CAP: when the network splits, each part must choose between answering and staying exact."
      - "The home page and search must always answer, a slightly stale list is fine: available. Payment and placing the order must be exact, never lost or charged twice: consistent."
    draw: [nfr-available, nfr-consistent]
    check: Why choose consistency for payments but availability for search?
    answer: A stale restaurant list costs nothing, but a lost or doubled payment or order is a real failure.
    misconceptions:
      - "The whole app picks one side of CAP -> the choice is made per part: search available, payment and orders consistent."
      - "CAP means you can never have both -> it is about what each part does during a network partition; without one, both hold."
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should this app let people do? Walk me through it from opening the app to getting the food, and I'll write each one down."
    hints:
      - What does the user do before choosing a restaurant?
      - And after paying, what do the restaurant and the delivery partner do?
  - list: nfr-list
    beats: [3, 4]
    question: "Now the qualities. How big is it, and where must it stay up versus stay exact?"
    hints:
      - Think of users and restaurants as numbers.
      - Is a stale restaurant list as bad as a doubled payment?
