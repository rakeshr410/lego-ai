# Food delivery interview, requirements: "1. Functional requirements" on the left, eight lines, and "Non-functional requirements" on the right (scale, then CAP split by part), as the video lays them out.
id: backend/food-delivery/end-to-end/requirements
title: Eight features, and CAP per part
source:
  hash: "a601d8497b03"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/food-delivery/end-to-end/problem-statement
  assumes:
    - "Three actors: the user, the restaurant and the delivery partner."
  carries:
    - "Functional: log in; nearby restaurants; search; menu; cart and pay; restaurant accepts, partner assigned; live location after pickup; notifications and past orders."
    - "Non-functional: 50M users and 1M restaurants; highly available for search and browsing; strongly consistent for payment and orders."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, such as scale, availability or consistency, with a number where there is one."
    - term: CAP
      means: "When the network between copies splits, a part of the system either answers anyway (available) or refuses until the copies agree (consistent)."
