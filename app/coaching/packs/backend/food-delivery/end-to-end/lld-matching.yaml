# Food delivery interview, deep dive 5, matching a delivery partner: as the video draws it, Kafka with the accepted orders above the delivery matching service and its geohash note; Redis to the right with the TTL note and the driver DB below it (write-through); the partners' stack underneath the matching service (location update service, a Kafka for location pings, the gateway, the partners). Corrected: the pings go through an ingestion gateway to Kafka (no "Kafka gateway"), Redis is a shared store, not a local cache, matching is a plain consumer (not Kafka Connect), and the TTL spans a few missed pings.
