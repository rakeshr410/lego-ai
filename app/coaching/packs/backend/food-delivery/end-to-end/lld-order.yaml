# Food delivery interview, deep dive 4, the order flow: as the video draws it, the order service over a payment service and the payment gateway with the payment DB and its schema; Kafka beside the order service with the orderPlaced topic and three consumers (restaurant acceptance, notification, order consumer to the order DB); on the right the restaurants' order service and a second Kafka (the same broker, drawn twice for room) carrying the restaurant's accept back. Corrected: the CVV is never stored; event-driven is not a commit protocol (outbox, idempotent consumers).
id: backend/food-delivery/end-to-end/lld-order
title: "Deep dive: the order flow"
