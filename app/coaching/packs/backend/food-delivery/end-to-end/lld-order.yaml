context:
  after: backend/food-delivery/end-to-end/lld-cart
  assumes:
    - "The order service pays through the payment gateway before the order counts; payments and orders are strongly consistent."
    - "An order service on the restaurants' side asks the restaurant to accept."
  carries:
    - "A payment service hands card details to the payment gateway (tokenised, CVV never stored) and records each attempt in a MySQL payment DB."
    - "Once paid, the order service publishes orderPlaced to Kafka; an order consumer writes the order DB, the notification service tells the user, the restaurant acceptance service asks the restaurant."
    - "The restaurant's accept comes back as an orderStatus confirmed event on the same Kafka."
    - "Write the order and its event together (outbox); consumers are idempotent because delivery is at least once."
  terms:
    - term: Kafka topic
      means: "A named log of events; every consumer group reads all of it, independently."
    - term: consumer
      means: "A service that reads events from a topic and acts on each one."
    - term: idempotent
      means: "Safe to apply twice: a repeated event changes nothing the second time."
