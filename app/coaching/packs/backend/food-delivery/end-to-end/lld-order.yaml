beats:
  - point: "Payment is its own service: it hands the card details to the third-party payment gateway, which charges with the bank and returns a token and a result, and records each attempt in a MySQL payment DB. The CVV is never stored."
    kind: mechanism
    weight: core
    teach:
      - "The order service is where the story starts; checkout begins with payment. Split it out: the order service calls a payment service, which passes the card details to the payment gateway, where the bank charges the card."
      - "The gateway answers success or failure and hands back a token; we never keep the CVV. The payment service records the attempt in a payment DB: payment id, user, order, amount, currency, time. Money needs transactions, so MySQL."
    draw: [lld-order, o-order, o-pay, o-to-pay, o-gw, o-to-gw, o-paydb, o-to-paydb, o-pay-schema, o-cvv]
    check: Why a relational database with transactions for payments?
    answer: Payments must be strongly consistent, exactly one row per attempt, never lost or doubled.
    misconceptions:
      - "The payment service stores card number, CVV and expiry -> card data goes to the gateway, which returns a token; the CVV is stored by no one."
  - point: "Once paid, three things must happen, so the order service publishes one orderPlaced event to Kafka instead of calling three services in turn; the order and its event are written together and every consumer is idempotent."
    kind: decision
    weight: core
    teach:
      - "After payment we must record the order, tell the user, and tell the restaurant. Calling them one by one makes checkout as slow and fragile as the slowest."
      - "So the order service puts one event, orderPlaced, on a Kafka topic, and lets the readers act. It is not a commit protocol: write the order and the event in one transaction, an outbox, and make each consumer safe to run twice, because Kafka delivers at least once."
    draw: [o-kafka, o-publish, o-topics, o-outbox]
    check: Why publish an event instead of calling the order DB, the notifier and the restaurant in turn?
    answer: Each reader works on its own, so checkout does not wait on or fail with the slowest step, and the event is kept until each has handled it.
  - point: "Three consumers read orderPlaced: the order consumer writes the order to the Postgres order DB, the notification service tells the user, and the restaurant acceptance service asks the restaurant."
    kind: component
    weight: core
    teach:
      - "Three readers. First, an order consumer that writes the order DB: order id, user, restaurant, items, price, status, and later the driver id. Postgres."
      - "Second, the notification service tells the user the order is placed. Third, a restaurant acceptance service, to ask the restaurant to accept or decline."
    draw: [o-consumer, o-k-consumer, o-order-db, o-write, o-order-schema, o-notify, o-k-notify, o-accept-svc, o-k-accept]
    check: Name the three consumers of orderPlaced and what each does.
    answer: The order consumer writes the order DB, the notification service tells the user, and the restaurant acceptance service asks the restaurant to accept.
  - point: "The restaurant acceptance service hands the order to the restaurants' order service, which holds the restaurants' connections by HTTP long polling and shows them the order."
    kind: flow
    weight: core
    teach:
      - "The acceptance service does not reach the restaurant's tablet itself. It hands the order to the order service on the restaurants' side, on the right."
      - "That service holds the restaurants' connections, HTTP long polling or a push, and pops the order up for them to accept."
    draw: [o-rest-orders, o-ask, o-restaurants, o-poll]
    check: How does a new order reach the restaurant's tablet?
    answer: The acceptance service passes it to the restaurants' order service, which pushes it over the restaurant's open long-polling connection.
  - point: "The restaurant's accept goes back on the same Kafka as orderStatus confirmed: the order consumer marks the order confirmed, the user is notified, and the order waits for a delivery partner."
    kind: flow
    weight: core
    teach:
      - "When the restaurant accepts, its order service puts an event on Kafka. The same broker; I draw it again only for room. Topic orderStatus, confirmed."
      - "Two things follow: the order consumer updates the order to confirmed, and the user is told; and the order now needs a delivery partner, which is the next part."
    draw: [o-kafka-2, o-accepted, o-topic-2, o-confirmed]
    check: What does the order consumer do when the confirmed event arrives?
    answer: It updates that order's status to confirmed in the order DB, idempotently.
asks:
  - ids: [o-kafka]
    beats: [2]
    question: "After payment, three things must happen for each order: save it, tell the user, tell the restaurant. How would you wire that so none of them slows checkout or gets lost?"
    hints:
      - What if the order service just announced that the order was placed?
      - Something durable that several services can read on their own.
  - ids: [o-consumer, o-notify, o-accept-svc]
    beats: [3]
    question: "Who reads that orderPlaced event? Name the services and what each one does."
    hints:
      - One per thing that has to happen.
      - Saving, telling the user, telling the restaurant.
  - ids: [o-kafka-2]
    beats: [5]
    question: "The restaurant taps accept. How does that get back to the order and the user?"
    hints:
      - The same way the order got out.
      - An event the order consumer can read.
