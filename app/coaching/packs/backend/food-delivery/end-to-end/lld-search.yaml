# Food delivery interview, deep dive 2, search: the search service in front of Elasticsearch, the restaurant DB (Postgres) beside it fed to the index by a CDC pipeline, the S3 bucket for photos, the restaurant service writing the database, and the restaurant and menu tables written underneath, as the video draws them. Corrected: the search service and Elasticsearch never query the database; images load by URL through a CDN.
