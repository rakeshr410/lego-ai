beats:
  - point: "Nearby and search both mix a location with text, so the search service queries Elasticsearch, which filters by distance and matches text in one ranked query."
    kind: decision
    weight: core
    teach:
      - "The search service has two jobs: the nearby list when the app opens, and search by restaurant or dish. Both are location plus text."
      - "So put Elasticsearch behind it: a distance filter and full-text matching in one query. Be ready to say why not a quadtree or Postgres with a geo extension: they do the nearby list, not the text alongside it."
    draw: [lld-search, s-svc, s-es, s-query, s-es-note]
    check: Why Elasticsearch rather than a quadtree for this search?
    answer: The queries combine distance with full-text matching on titles and dishes; a quadtree only answers the location part.
  - point: "The source of truth is a Postgres restaurant DB, written by restaurant owners through the restaurant service, with a restaurant table and a menu table."
    kind: component
    weight: core
    teach:
      - "The data itself is relational, restaurants and their menu items, so a Postgres restaurant DB. Owners write it through the restaurant service."
      - "Two tables, written underneath: restaurant, with id, name, address, status open or closed, latitude and longitude, and image URLs; and menu, with item id, the restaurant it belongs to, title, description, price and image URL."
    draw: [s-db, s-owners, s-restsvc, s-owners-in, s-write, s-tbl-rest, s-tbl-menu]
    check: Why keep a relational database at all when search uses Elasticsearch?
    answer: It is the source of truth for related rows, restaurants and their menu items; the index is a copy built from it.
  - point: "Photos go to an S3 bucket and the tables keep only their URLs; the app loads the images by URL through a CDN."
    kind: decision
    weight: supporting
    teach:
      - "Each restaurant and each dish has photos. Files, not rows: they go to an S3 bucket, and the tables keep the URL."
      - "The app loads them straight from the URL, through a CDN, not through the search service."
    draw: [s-s3, s-photos, s-s3-note]
    check: Where are dish photos stored, and what does the menu table hold for them?
    answer: In an S3 bucket; the table holds only each photo's URL.
  - point: "Neither the search service nor Elasticsearch queries the restaurant DB: a CDC pipeline reads each change from the database log and writes one joined document per restaurant into the index."
    kind: mechanism
    weight: core
    teach:
      - "How does a new dish reach search? Elasticsearch keeps its own copy. A CDC pipeline reads every change from the database's log, and its consumer joins a restaurant with its menu items into one document and writes it to the index."
      - "So the search path never touches the database. The index is a moment behind, which the available-first choice for search allows."
    draw: [s-cdc, s-cdc-note]
    check: A restaurant adds a dish. How does it become searchable?
    answer: The change lands in the restaurant DB, CDC reads it from the log, and the consumer rewrites that restaurant's document in Elasticsearch.
    misconceptions:
      - "Elasticsearch queries the restaurant database on each search -> it holds its own index, kept current by CDC."
      - "The search service reads S3 to return images -> it returns URLs; the app fetches images through a CDN."
asks:
  - ids: [s-es]
    beats: [1]
    question: "Search has to handle 'near me' and 'biryani' at the same time, over a million restaurants. What would you put behind the search service?"
    hints:
      - You need distance and text matching together.
      - Something built for full-text search, with geo queries.
  - ids: [s-cdc-note]
    beats: [4]
    question: "The data lives in Postgres, but search reads the index. How do changes get from one to the other?"
    hints:
      - Every database keeps a log of its changes.
      - And the index wants one document per restaurant, menu included.
