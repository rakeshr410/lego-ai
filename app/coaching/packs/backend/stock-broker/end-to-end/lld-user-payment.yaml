beats:
  - point: "Step five opens the simple services first: the user service has little logic, since a third party does KYC, so what matters is its table, in Postgres."
    kind: component
    weight: core
    teach:
      - "Step five, the deep dive. Take the design above and open each service, the simple ones first. The user service onboards users; KYC is done by the third party, so there is little logic."
      - "What matters is what it stores. User data is plain metadata read by key, so a relational database, Postgres or MySQL."
    draw: [lld-up, lu-kyc, lu-user, lu-user-kyc, lu-userdb, lu-user-db]
    check: Why is the user service simple?
    answer: KYC is done by the third-party provider; the service mostly stores user metadata.
  - point: "The user table keeps userId, email, phone, name, metadata and an is-KYC-verified flag; the PAN, Aadhaar and signature stay with the provider, or are stored encrypted if they must be kept."
    kind: decision
    weight: core
    teach:
      - "The columns: user ID, email, phone, name, metadata, and one flag, is KYC verified, which the provider's true or false answer sets."
      - "The PAN card, the Aadhaar number, the signature: leave them with the provider. If you must keep one, store it encrypted, never as plain text."
    draw: [lu-schema-1, lu-schema-2, lu-docs]
    check: What does the broker keep from the KYC check?
    answer: A verified flag; the documents stay with the provider, or are stored encrypted.
    misconceptions:
      - "Store the PAN and Aadhaar in the user table -> they stay with the provider, or are encrypted if they must be kept."
  - point: "The payment service sends each deposit or withdrawal through the payment gateway, which talks to the banks and answers success or failure, and records the result in a payment DB, Postgres because money must be consistent."
    kind: flow
    weight: core
    teach:
      - "Payments: the service sends the transaction to the payment gateway, which talks to the banks and answers success or failure."
      - "Either way the result is written to the payment DB. It is money, so it must be consistent: MySQL or Postgres."
    draw: [lp-gw, lp-svc, lp-svc-gw, lp-db, lp-svc-db, lp-ack]
    check: Why a relational database for payments?
    answer: Money needs consistency and transactions, which Postgres or MySQL give.
  - point: "The payment table: transactionId, userId, amount, currency, timestamp and metadata."
    kind: decision
    weight: supporting
    teach:
      - "The columns: transaction ID, user ID, the amount, the currency, the timestamp, and metadata such as the status."
    draw: [lp-schema-1, lp-schema-2]
    check: Which column ties a payment to its user?
    answer: The user ID.
asks:
  - ids: [lu-schema-1, lu-schema-2]
    beats: [2]
    question: "What would you store for each user? And what would you rather not store?"
    hints:
      - Think of the sign-up form.
      - What does the KYC provider send back?
  - ids: [lp-schema-1, lp-schema-2]
    beats: [4]
    question: "What does a payment row need?"
    hints:
      - Who paid, how much, in what?
      - And something to find the transaction again with the gateway.
