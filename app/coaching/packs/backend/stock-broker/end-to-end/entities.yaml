beats:
  - point: "Read the entities off the requirements: the user, the stock, the order the user places, and the trade the exchange executes."
    kind: component
    weight: core
    teach:
      - "Step two, the core entities. Go down the requirements: a user, a stock with its prices, an order the user places."
      - "And a trade: what the exchange actually executed. It is not the same as the order; twenty shares ordered may fill five now and fifteen later."
    draw: [entities, ent-user, ent-stock, ent-order, ent-trade]
    check: Why keep an order and a trade apart?
    answer: The order is the request; the trade is what the exchange executed, which can be later, partial or never.
  - point: "Two more: the portfolio, a user's holdings with profit and loss, and the watchlist, a saved list of symbols."
    kind: component
    weight: supporting
    teach:
      - "The dashboard gives the portfolio, holdings with their profit and loss, and the fourth requirement gives the watchlist."
    draw: [ent-portfolio, ent-watchlist]
    check: Which requirement does the portfolio entity serve?
    answer: The dashboard of holdings, trade history, profit and loss and performance.
