beats:
  - point: "Users register, log in and pass KYC before trading, and see stock prices in near real time along with their history."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: functional requirements. First, a user registers, logs in and passes KYC verification; in India no broker lets you trade without it."
      - "Second, prices: the current price of any stock in near real time, and its history over whatever range they pick, a day, a week, a year."
    draw: [fr, fr-kyc, fr-prices]
    check: Why is KYC a requirement before trading at all?
    answer: Brokers must verify who a user is before letting them trade; in India it is mandatory.
  - point: "Users place, modify and cancel market and limit orders with accurate status, keep watchlists with live prices, and see a dashboard of holdings, trades and profit and loss."
    kind: requirement
    weight: core
    teach:
      - "Third, orders: buy or sell, at the market price or at a limit price you name, and modify or cancel them, with the status kept accurate."
      - "Fourth, watchlists that show live prices. Fifth, a dashboard: current holdings, trade history, profit and loss, performance."
    draw: [fr-orders, fr-watch, fr-dash]
    check: What is the difference between a market order and a limit order?
    answer: A market order buys or sells at the current price at once; a limit order only at the price the user names or better, so it may wait.
  - point: "The scale: millions of users, millions of trades a day, and 8 to 10 thousand stocks, since NSE and BSE list about 5 to 6 thousand."
    kind: metric
    weight: core
    teach:
      - "On the right, non-functional requirements. Scale first, because it decides the architecture: millions of users, millions of trades a day, high frequency."
      - "But the number of stocks is small and bounded: about 5 to 6 thousand are listed in India, so plan for 8 to 10 thousand."
    draw: [nfr, nfr-scale]
    check: Which number here is small, and why does that help?
    answer: The number of stocks, 8 to 10 thousand at most; the broker can subscribe to every one of them.
  - point: "Orders and money need consistency over availability, while viewing prices should stay highly available."
    kind: requirement
    weight: core
    teach:
      - "CAP. This system moves money, so on the order path we pick consistency: a few minutes down is acceptable, money taken with no shares booked is not. A wrong balance or a duplicate trade can cost a fortune."
      - "But viewing prices is the other way: showing a price a moment old is better than showing nothing, so that path stays highly available."
    draw: [nfr-cap, nfr-view]
    check: Why choose differently for orders and for viewing prices?
    answer: A wrong balance or duplicate trade is real money lost, so orders need consistency; a slightly stale price on screen harms no one, so price views favour availability.
    misconceptions:
      - "The whole system picks one side of CAP -> the choice is per path: consistency for orders and money, availability for price views."
  - point: "Latency: an order placed in under 100 ms and a price update in under 50 ms, reachable because a broker serves one country from one region."
    kind: metric
    weight: core
    teach:
      - "Latency, with numbers: placing an order under 100 milliseconds, a price change on screen under 50."
      - "That is aggressive for a distributed system, but a broker is national: Zerodha does not serve the US market. Every server and cache can sit in one region, near the users and the exchange."
    draw: [nfr-latency, nfr-region]
    check: What makes those latency targets achievable?
    answer: The broker serves one country, so all its servers and caches are in one region, with no cross-continent hops.
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should a broker app let its users do? Give me the features one at a time, and I'll write them down."
    hints:
      - Think of a new user's first day, from signing up to buying a share.
      - And afterwards, what do they come back to check?
  - list: nfr-list
    beats: [3, 4, 5]
    question: "Now the qualities. How big, how correct, how fast should it be? A number where you can."
    hints:
      - How many users and stocks, and what happens if a balance is wrong?
      - How quickly must a price change reach the screen?
