# Stock broker interview, requirements: "1. Functional requirements" on the left, five lines, and "Non-functional requirements" on the right, scale, CAP (consistency for orders, availability for prices), latency, as the video lays them out.
id: backend/stock-broker/end-to-end/requirements
title: Five features, and the numbers
source:
  hash: "8a5b1b161a05"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/stock-broker/end-to-end/problem-statement
  assumes:
    - "A broker forwards orders to the exchange, a black box, and streams prices to users."
  carries:
    - "Functional: KYC onboarding; live prices and history; place, modify, cancel market and limit orders; watchlists with live prices; a dashboard of holdings, trades, P and L."
    - "Non-functional: millions of users and trades, 8 to 10k stocks; consistency for orders and money; price views available; orders under 100 ms, prices under 50 ms; one region."
  terms:
    - term: KYC
      means: "Know your customer: verifying a user's identity before they may trade."
    - term: limit order
      means: "An order to buy or sell only at a named price or better; a market order takes the current price."
