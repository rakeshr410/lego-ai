beats:
  - point: "A watchlist is a saved list of symbols, kept by the watchlist service in a relational watch DB."
    kind: component
    weight: core
    teach:
      - "Next, the watchlist: a saved list of favourite stocks. The service is plain CRUD over its own database."
      - "The data is relational, users, lists and symbols, so Postgres or MySQL."
    draw: [lld-wl, wl-svc, wl-db, wl-svc-db]
    check: Why a relational database for watchlists?
    answer: Users, their lists and the symbols in them are related rows, a natural fit for Postgres.
  - point: "One user has many watchlists, each with a generated watchlistId as its key, and a second table maps each watchlist to its symbols."
    kind: decision
    weight: core
    teach:
      - "A user may keep several lists, a finance list, a pharma list: one to many. So a watchlist table with the user ID and a generated watchlist ID, which alone is the key; index the user ID."
      - "Each list holds many symbols, so a second table of watchlist ID and symbol."
    draw: [wl-schema-1, wl-schema-2, wl-pg]
    check: What identifies one watchlist row?
    answer: Its generated watchlist ID; the user ID is indexed to find a user's lists.
    misconceptions:
      - "User ID and watchlist ID together form the key -> the generated watchlist ID is unique on its own; index the user ID."
  - point: "An open watchlist gets its live prices from the price tracker, the only reader of InfluxDB and Redis, so every live view stays consistent."
    kind: flow
    weight: core
    teach:
      - "When I open a list of five stocks I want all five live. The watchlist service does not read the price stores itself: it goes through the price tracker, history from InfluxDB, live from Redis, over the user's WebSocket."
      - "Rule of thumb: anything that needs real-time prices goes through the price tracker."
    draw: [wl-svc-tracker, wl-note]
    check: Why does the watchlist service not read Redis itself?
    answer: The price tracker owns the price stores and the subscriptions; going through it keeps one path for every live view.
asks:
  - ids: [wl-schema-1, wl-schema-2]
    beats: [2]
    question: "A user can keep several watchlists, each with many stocks. What tables would you make?"
    hints:
      - Who owns a list, and how is a list identified?
      - Where do the symbols of a list go?
  - ids: [wl-note]
    beats: [3]
    question: "When the user opens a watchlist, where should its live prices come from?"
    hints:
      - Which service already streams prices?
      - Should two services read the price stores?
