beats:
  - point: "Millions of users and many features mean microservices behind one load balancer and API gateway, which authenticates, rate-limits, routes by URL and spreads load round robin."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design: just the services each requirement needs, as abstract boxes. On the left the clients: web, iOS, Android."
      - "Millions of users and high-frequency trades mean microservices, so one front door: a load balancer and API gateway. Four jobs: authentication and authorization, rate limiting, routing by URL, and round robin across instances."
    draw: [hld, h-clients, h-gw, h-clients-gw, h-rr]
    check: Name the gateway's jobs.
    answer: "Authentication and authorization, rate limiting, routing each request by its URL, and spreading load, here round robin."
  - point: "The user service onboards users into a user DB and hands KYC to a licensed third-party provider instead of integrating with the government's service itself."
    kind: component
    weight: core
    teach:
      - "Onboarding needs a user service and a database to keep users in."
      - "KYC is the extra step. You could integrate with the government identity service, but that needs a licence; most brokers use a third-party KYC provider, so draw it as an outside box."
    draw: [h-user, h-gw-user, h-kyc, h-user-kyc, h-userdb, h-user-db]
    check: Why use a third-party KYC provider?
    answer: The government identity service needs a licence to call; licensed providers already do the verification.
  - point: "A price tracker service fetches prices from the exchange, a black box on the right; how it connects is left for the deep dive."
    kind: component
    weight: core
    teach:
      - "Live prices need a service that gets them from the exchange: a price tracker. Draw the exchange, NSE or BSE, as a tall black box on the right."
      - "What kind of connection, and how prices reach the screen, we leave for the deep dive."
    draw: [h-price, h-gw-price, h-exchange, h-price-exchange]
    check: Where does the price tracker get its prices?
    answer: From the exchange, which the design treats as a black box.
  - point: "The watchlist service stores each user's favourite stocks in its own watch DB."
    kind: component
    weight: supporting
    teach:
      - "With prices on screen a user either saves a stock or buys it. Saving is the watchlist service, with its own watch DB."
    draw: [h-watch, h-gw-watch, h-watchdb, h-watch-db]
    check: What does the watchlist service store?
    answer: Each user's saved lists of stocks, in the watch DB.
  - point: "The order service records orders in an order DB and passes them through a validator before the exchange, because exchange calls are costly, limited and slow, so a bad order must stop inside the broker."
    kind: flow
    weight: core
    teach:
      - "To buy or sell: an order service that records each order in an order DB, then forwards it to the exchange, which does the allocation."
      - "But validate first: is the user KYC verified, is there enough money. Exchange access is licensed and limited, and it is an external hop, so an order that will fail should fail here. Validator, then exchange."
    draw: [h-order, h-gw-order, h-validator, h-order-validator, h-validator-exchange, h-orderdb, h-order-db]
    check: Why put a validator before the exchange?
    answer: Exchange calls are costly, limited and an external hop, so orders that would fail are rejected inside the broker.
  - point: "The portfolio service reads the orders to show profit and loss, and the payment service tops up the wallet through a payment gateway and a payment DB."
    kind: component
    weight: core
    teach:
      - "The portfolio service reads the order DB to show profit and loss."
      - "And to trade you need money: a payment service with its own payment DB and a third-party payment gateway that talks to the banks."
    draw: [h-portfolio, h-gw-portfolio, h-portfolio-db, h-payment, h-gw-payment, h-paydb, h-payment-db, h-paygw, h-payment-gw]
    check: Which outside system does the payment service depend on?
    answer: A payment gateway that talks to the banks.
  - point: "This covers every requirement but hides two problems: an order can fill partly or minutes later, and nothing yet says how prices reach the screen in real time."
    kind: failure
    weight: core
    teach:
      - "Read the requirements back: all five covered. But two assumptions are too easy."
      - "An order is not simply accepted at once: 20 shares of Reliance may fill 5 now and 15 ten minutes later. And the price tracker's connection to the exchange and to the users is undecided. The deep dive fixes both."
    check: What does the high-level design assume about orders that is not true?
    answer: That the exchange answers at once with success or failure; fills can be partial and delayed.
