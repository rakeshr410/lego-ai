beats:
  - point: "Onboarding is three POSTs: sign up, log in, and verify KYC."
    kind: flow
    weight: supporting
    teach:
      - "Step three, the API. Each requirement gives one or more endpoints, so group them. Users first: sign up submits data, so a POST; then verify KYC; then log in."
    draw: [api, api-users, api-signup, api-login, api-kyc]
    check: Why are sign-up and KYC POSTs?
    answer: They submit data for the backend to store and verify.
  - point: "Market data: a paginated list of stocks, one stock's details, and its price history; the live price itself will travel over a WebSocket."
    kind: flow
    weight: core
    teach:
      - "Market data. A GET on stocks lists them, paginated, since there are up to 10 thousand. A GET on one symbol gives its details, and a GET on its history gives the past prices for a chart."
      - "Keep in mind the live price will not be a GET: polling it would be far too slow. We will move it to a WebSocket in the deep dive."
    draw: [api-market, api-stocks, api-stock, api-history]
    check: Why paginate the stock list?
    answer: There are up to 10 thousand symbols, too many to send in one response.
    misconceptions:
      - "A GET on the symbol is enough for live prices -> the app would have to poll it; live prices are pushed over a WebSocket."
  - point: "Funds: deposit to and withdraw from the trading wallet, and list its history."
    kind: flow
    weight: supporting
    teach:
      - "Before trading you need money in the wallet: a POST to deposit, a POST to withdraw, a GET for the history."
    draw: [api-funds, api-deposit, api-withdraw, api-funds-history]
    check: Which funds call changes the wallet balance downward?
    answer: The POST to withdraw.
  - point: "Trading: POST an order with symbol, side, order type, quantity and an optional limit price; list orders, get one, PATCH to modify it, DELETE to cancel it."
    kind: flow
    weight: core
    teach:
      - "Trading. Placing is a POST on orders, and its body says what to trade: the symbol, buy or sell, market or limit, the quantity, and a limit price only for limit orders."
      - "Then a GET to list my orders and one for a single order's status. Modify is a requirement too, so a PATCH on the order, and a DELETE cancels it."
    draw: [api-trading, api-order-post, api-order-body-1, api-order-body-2, api-order-list, api-order-get, api-order-patch, api-order-delete]
    check: What goes in the body of the POST that places an order?
    answer: "The symbol, buy or sell, the order type, the quantity, and a limit price for a limit order."
  - point: "Portfolio and watchlists: GETs for the portfolio, holdings, positions and performance, with the user read from the token, and endpoints to create watchlists and add symbols."
    kind: flow
    weight: core
    teach:
      - "Portfolio: GETs for the overview, holdings, positions and performance. No user ID in the path: the gateway reads the user from the auth token in the header, so nobody can ask for someone else's holdings."
      - "Watchlists: list them, create one, and add symbols to one."
    draw: [api-portfolio, api-pf, api-pf-holdings, api-pf-positions, api-pf-performance, api-watchlists, api-wl-get, api-wl-post, api-wl-symbols]
    check: Why is there no user ID in the portfolio paths?
    answer: The user comes from the authenticated token in the header, so a caller cannot read another user's portfolio.
  - point: "That is too many endpoints for an interview: agree to go deep on market data, trading and portfolio, and leave funds and watchlists for later."
    kind: rule
    weight: supporting
    teach:
      - "Be honest about time: you cannot design all of these in an hour. Ask the interviewer what to emphasize; usually market data, trading and the portfolio."
asks:
  - ids: [api-stocks, api-stock, api-history]
    beats: [2]
    question: "For the prices, what endpoints would the app call? Method and path, and I'll write them."
    hints:
      - The app first needs to know which stocks exist.
      - Then one stock's details, and its past prices for a chart.
  - ids: [api-order-post, api-order-list, api-order-get, api-order-patch, api-order-delete]
    beats: [4]
    question: "Now trading. Which endpoints do we need for orders?"
    hints:
      - Look at the requirement, place, modify and cancel.
      - And how would a user see their orders?
