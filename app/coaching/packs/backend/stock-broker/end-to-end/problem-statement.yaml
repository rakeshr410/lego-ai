beats:
  - point: "A stock broker like Zerodha, Groww or Upstox is an online, low-cost platform for trading and monitoring stocks."
    kind: rule
    weight: core
    teach:
      - "Write the title: a stock broker like Zerodha, Groww or Upstox. Under it, what it is: an online, low-cost platform where people trade and track stocks."
      - "Low-cost, not free: Zerodha charges nothing on delivery trades but does charge on intraday and futures and options."
    draw: [title, prompt-desc]
    check: In one sentence, what does a stock broker app let people do?
    answer: Buy and sell stocks and follow their prices, holdings and profit and loss online.
  - point: "A broker is not the exchange: the exchange matches orders and allocates shares, and the broker treats it as a black box behind its interfaces."
    kind: rule
    weight: core
    teach:
      - "Make sure which system is meant. The exchange, NSE or BSE, keeps the order book and matches buyers with sellers. That is a different interview."
      - "The broker sits in front of it: onboarding, prices, orders, the dashboard. For us the exchange is a black box we talk to through what it offers."
    draw: [prompt-example]
    check: Which of the two matches a buy order with a sell order?
    answer: The exchange; the broker validates the order and forwards it.
    misconceptions:
      - "The broker matches orders -> matching happens on the exchange; the broker only forwards and tracks them."
  - point: "The interview runs in five steps: requirements, core entities, API, high-level design, then a deep dive into each service."
    kind: rule
    weight: supporting
    teach:
      - "Say the plan once: requirements, functional and non-functional; the core entities; the API; a high-level design; and a deep dive, service by service. Each step gets its number on the board when we reach it."
    check: What comes right after the requirements?
    answer: Identifying the core entities, then the API.
