  after: backend/stock-broker/end-to-end/lld-watchlist
  assumes:
    - "The exchange gateway is the only door to the exchange and writes its feed into Kafka."
    - "The price tracker serves live prices; orders and money need consistency."
  carries:
    - "Orders go into Kafka topic raw orders; a validator checks KYC, account, funds and margin, market hours, holds the funds, and publishes verified or rejected."
    - "The order service records every order (pending, trade ID empty) and sends only verified ones through the exchange gateway."
    - "Fills are events on Kafka topic order status; an order tracker updates the order DB, writes the trade DB and notifies the user."
    - "The trade DB holds only exchange-accepted trades, is reconciled at the close, and feeds the portfolio's profit and loss with live prices."
  terms:
    - term: partial fill
      means: "Only part of an order executed so far, such as 5 of 20 shares."
    - term: reconciliation
      means: "Comparing the broker's trade records with the exchange's at the close so both agree."
