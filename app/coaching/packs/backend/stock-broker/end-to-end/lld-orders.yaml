# Stock broker interview, deep dive into the order flow: under the kept price picture (the API gateway, the price tracker, Kafka and the exchange gateway), the video's last drawing: Kafka with raw, verified and rejected orders and the validator under it, the order service sending verified orders up to the exchange gateway, the order DB and its columns, the order status topic added to the market Kafka, the order tracker writing the trade DB and the order DB, the notification service, and the portfolio reading trades and live prices. The video says the order service forwards orders to the payment gateway; its board and this pack use the exchange gateway.
