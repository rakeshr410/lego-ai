beats:
  - point: "Millions of users placing orders at once is more than one server can take, and no order may be lost, so every buy or sell goes first into Kafka, topic raw orders."
    kind: component
    weight: core
    teach:
      - "Last and most important, orders. High-frequency trading from millions of users: no single server takes that, and losing an order is unacceptable."
      - "So a buffer: every buy or sell goes from the gateway into Kafka, on a topic called raw orders. Draw two more topics now, verified and rejected; you will see why."
    draw: [lld-orders, or-kafka, or-gw-kafka, or-topic-raw, or-topic-ok, or-topic-bad]
    check: Why put Kafka in front of the order processing?
    answer: It absorbs the burst of orders and keeps every one durably until it is processed, so none is lost.
  - point: "The validator consumes raw orders and checks KYC, an active account, funds and margin and market hours, reading the user and payment DBs, holds the funds, and publishes each order as verified or rejected."
    kind: mechanism
    weight: core
    teach:
      - "The validator from the high-level design now consumes raw orders. Its checks: the user passed KYC, the account is active, funds and margin cover the order, the market is open. For that it reads the user DB and the payment DB."
      - "It should also hold the funds when it accepts an order, or two orders at the same instant could spend one balance. Then it publishes each order to verified orders or rejected orders."
    draw: [or-validator, or-kafka-validator, or-checks-1, or-checks-2, or-checks-3]
    check: Why must the validator hold the funds, not just check them?
    answer: Otherwise two orders validated at the same moment could both spend the same balance.
    misconceptions:
      - "Checking the balance is enough -> two concurrent orders can both pass the check; the funds must be held as the order is accepted."
  - point: "The order service consumes verified and rejected orders and writes every one to the order DB: orderId, userId, stockId, orderType, price, quantity, a trade ID still empty, and status pending."
    kind: decision
    weight: core
    teach:
      - "The order service consumes both topics and writes every order, accepted or not, to the order DB, in Postgres since it is money."
      - "The row: order ID, user ID, stock ID, order type, market or limit, price, quantity, trade ID and status. A new order has no trade ID yet and status pending."
    draw: [or-svc, or-kafka-svc, or-db, or-svc-db, or-schema-1, or-schema-2, or-schema-3]
    check: What do the trade ID and status hold when an order is first written?
    answer: The trade ID is empty and the status is pending, until the exchange confirms.
  - point: "Only verified orders go on, through the exchange gateway; a market order fills at once, but a limit order may wait, and either may fill in parts."
    kind: flow
    weight: core
    teach:
      - "Verified orders go to the exchange through the exchange gateway, the one door to it. Not the payment gateway: that one moves money with banks."
      - "Then the hard part. A market order fills at once at the current price. A limit order may wait fifteen minutes, or never fill. And fills can be partial: 20 ordered, 5 now, 15 later. So the answer is not a reply; it is events."
    draw: [or-svc-exgw, or-fill]
    check: Why can't the order service just wait for the exchange's reply?
    answer: A limit order may fill much later, and fills can come in parts, so results arrive as later events, not one reply.
  - point: "The exchange's acknowledgements come back on the same feed into Kafka, topic order status, and an order tracker consumes them and updates each order's status and trade ID."
    kind: mechanism
    weight: core
    teach:
      - "We already hold an open connection to the exchange. Its acknowledgements arrive there too, so the gateway writes them into the same Kafka, on a second topic, order status."
      - "An order tracker consumes that topic and, for each fill or rejection, updates the order row: status from pending to filled or rejected, and the trade ID the exchange gave."
    draw: [or-status-topic, or-tracker, or-kafka-tracker, or-tracker-db]
    check: How does a fill that happens ten minutes later reach the order DB?
    answer: The exchange sends it on the feed into the order status topic; the order tracker consumes it and updates the row.
  - point: "The order tracker also writes a trade DB with the same columns but only orders the exchange accepted, reconciled with the exchange at the close, and notifies the user through a notification service."
    kind: decision
    weight: core
    teach:
      - "It also writes a trade DB. Same columns, but only what the exchange accepted; the order DB has rejected orders too. At the close the trade DB is reconciled with the exchange's records so both agree."
      - "And it notifies the user through a notification service; the order service notifies too, when the order is placed."
    draw: [or-trade-db, or-tracker-trade, or-trade-note, or-notify, or-tracker-notify, or-svc-notify]
    check: Why keep a trade DB when the order DB has the same columns?
    answer: It holds only exchange-accepted trades, so it can be reconciled with the exchange and used for holdings and profit and loss.
  - point: "The portfolio service reads the trade DB, not the order DB, and asks the price tracker for live prices, so profit and loss counts only shares really held at current prices."
    kind: flow
    weight: core
    teach:
      - "The portfolio service now reads the trade DB, so only shares really bought count. Profit and loss needs the current price too, so it asks the price tracker."
      - "Close by reading the requirements back: Kafka for scale, the validator and reconciliation for consistency, the price feed for availability, one region and push for latency. Settling money with the exchange is a follow-up of its own."
    draw: [or-portfolio, or-portfolio-trade, or-portfolio-tracker]
    check: What two inputs does profit and loss need, and where does each come from?
    answer: The shares bought and their price from the trade DB, and the current price from the price tracker.
asks:
  - ids: [or-kafka]
    beats: [1]
    question: "Millions of orders hit us at the open, and none may be lost. What would you put between the gateway and the order logic?"
    hints:
      - Something that buffers and keeps every message.
      - We already use one for prices.
  - ids: [or-validator]
    beats: [2]
    question: "Before an order goes anywhere, what has to be checked, and by what?"
    hints:
      - Think of the user, the account, the money and the clock.
      - We drew this box in the high-level design.
  - ids: [or-tracker]
    beats: [5]
    question: "Fills arrive on the exchange feed, maybe minutes later. What would consume them and update the order?"
    hints:
      - They land in Kafka like the prices.
      - Something has to read that topic and touch the order row.
  - ids: [or-trade-db]
    beats: [6]
    question: "The portfolio should count only what the exchange really executed. Where would you keep that?"
    hints:
      - The order DB also has rejected orders.
      - At the close, what do we compare with the exchange?
