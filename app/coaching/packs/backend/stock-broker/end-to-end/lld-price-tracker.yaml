    question: "Should every service open its own connection to the exchange? What would you put in between?"
    hints:
      - Think of how the API gateway fronts our services.
      - The exchange should see one client.
  - ids: [pt-kafka]
    beats: [4]
    question: "Millions of price updates arrive every second. What would you put behind the exchange gateway to take them?"
    hints:
      - Something durable that absorbs bursts.
      - Consumers should read at their own pace.
  - ids: [pt-influx, pt-redis]
    beats: [5]
    question: "Each tick has two uses, the chart's history and the live screen. Where would you send it for each?"
    hints:
      - One store built for values over time.
      - One fast way to fan a message out to subscribers.
  - ids: [pt-wsgw]
    beats: [7]
    question: "Every app now holds a long-lived WebSocket. What would you change at the front door?"
    hints:
      - Are REST calls and long-lived sessions the same kind of traffic?
      - What does a session need that a single request does not?
