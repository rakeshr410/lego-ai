beats:
  - point: "Polling the exchange for every stock every second is rejected: thousands of paid, limited calls a second through a six-hour session, and prices still up to a second old."
    kind: failure
    weight: core
    teach:
      - "The heart of the app: live prices. First idea: every second, ask the exchange for the price of all 5 to 10 thousand stocks, page by page, and update the screens."
      - "Count it over a six-hour session: a flood of calls, and exchange access is licensed and costly. And the price is still up to a second stale. Reject it."
    draw: [lld-price, pt-poll]
    check: Why is polling the exchange every second a bad idea?
    answer: Thousands of costly, limited calls every second all day, and the prices are still up to a second old.
  - point: "Push instead: server-sent events push one way, but a WebSocket also carries subscribe messages on the same open connection, and subscriptions change all the time, so WebSocket wins."
    kind: decision
    weight: core
    teach:
      - "Better: let the exchange push each change. Server-sent events do that, one way, over one long-lived response. Many write-ups stop there."
      - "But who you subscribe to keeps changing: a new user wants another stock. Over a WebSocket that is one message on the open socket. Server-sent events cannot carry it back, so you need a second request or a reopened stream. So WebSocket, towards the exchange and later towards the apps."
    draw: [pt-sse, pt-ws]
    check: Prices only flow one way. Why still choose a WebSocket?
    answer: Subscriptions change constantly, and a WebSocket carries those changes on the same open connection; server-sent events cannot.
    misconceptions:
      - "Server-sent events need a whole new connection for every change -> a separate request can change the subscription; the WebSocket just does it on one connection."
  - point: "One exchange gateway is the broker's only door to the exchange; from the 9:15 open it subscribes to every stock, watched or not, at roughly 400 to 500 symbols a socket, about ten sockets."
    kind: component
    weight: core
    teach:
      - "Services should not each talk to the exchange. Add an exchange gateway, a proxy like the API gateway in reverse: the exchange sees one client."
      - "At the open it subscribes to every stock, even ones nobody watches, so history is complete for anyone who opens them later. The video's figure: 400 to 500 symbols a socket, so about ten sockets for 5,000. Illustrative: real feeds come over leased lines in the exchange's own protocols."
    draw: [pt-exgw, pt-exchange, pt-exchange-exgw, pt-sockets, pt-open]
    check: Why subscribe to stocks nobody is watching?
    answer: So their history is recorded and can be charted when someone opens them later.
  - point: "Thousands of stocks changing every second is a flood, so the gateway writes every tick into Kafka, topic stock price, which buffers the burst."
    kind: component
    weight: core
    teach:
      - "Every stock can change every second: millions of updates. No single service should take that directly."
      - "So the gateway writes every tick into Kafka, a durable log, on a topic called stock price. Kafka absorbs the bursts and consumers read at their own pace."
    draw: [pt-kafka, pt-exgw-kafka, pt-kafka-topic]
    check: What does Kafka add between the exchange gateway and everything else?
    answer: A durable buffer for the burst of ticks, read by consumers at their own pace.
  - point: "A price ingester consumes the topic, writes every tick to InfluxDB, a time-series database, for history, and publishes the last traded price to Redis pub/sub for live fan-out."
    kind: mechanism
    weight: core
    teach:
      - "A price ingester consumes the topic and does two things with each tick. One: write it to InfluxDB, a time-series database, so history and charts never cost an exchange call."
      - "Two: publish the last traded price to Redis pub/sub, on that symbol's channel, so whoever is subscribed gets it at once. Pub/sub keeps nothing, which is fine: history is InfluxDB's job."
    draw: [pt-ingester, pt-kafka-ingester, pt-influx, pt-ingester-influx, pt-influx-note, pt-redis, pt-ingester-redis, pt-redis-note]
    check: Why does each tick go to two places?
    answer: InfluxDB keeps every tick for history and charts; Redis pub/sub pushes the latest price to live subscribers right away.
  - point: "The price tracker becomes a WebSocket server: it subscribes to the Redis channels of the symbols its users watch, and reads the earlier part of the day from InfluxDB."
    kind: mechanism
    weight: core
    teach:
      - "The price tracker is now a WebSocket server. User 1 says subscribe ICICI Bank; the tracker subscribes to that channel in Redis and pushes each new price down the socket."
      - "For the chart it needs the morning too: open the app at 2 and the prices from 9:15 to 2 come from InfluxDB, everything after from Redis."
    draw: [pt-tracker, pt-redis-tracker, pt-tracker-influx, pt-history]
    check: A user opens a chart at 2 o'clock. Where does each part of it come from?
    answer: From 9:15 to 2 out of InfluxDB, and every price after that from Redis pub/sub through the WebSocket.
  - point: "Apps hold one WebSocket each, so split the front door: an API gateway for REST and a dedicated WebSocket gateway with sticky sessions for the long-lived connections."
    kind: decision
    weight: core
    teach:
      - "The apps connect over WebSockets too, for the same reason: opening Reliance after ICICI is one more subscribe message."
      - "A WebSocket-heavy app deserves its own gateway: split the front door into an API gateway for REST calls and a WebSocket gateway that holds the sessions and keeps each one stuck to its server."
    draw: [pt-clients, pt-apigw, pt-clients-apigw, pt-wsgw, pt-clients-wsgw, pt-wsgw-tracker, pt-wsgw-note]
    check: Why a dedicated WebSocket gateway?
    answer: Long-lived connections need session handling and sticky routing that a REST gateway is not built around.
