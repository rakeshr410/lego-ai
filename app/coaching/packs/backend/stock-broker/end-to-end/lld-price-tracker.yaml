  assumes:
    - "The price tracker gets prices from the exchange, a black box."
    - "Price updates must reach the screen in under 50 ms, and viewing prices stays available."
  carries:
    - "Polling is rejected; WebSocket beats server-sent events because subscriptions change on the open socket."
    - "One exchange gateway subscribes to every instrument from the open (illustrative 400 to 500 symbols a socket, about 10 sockets)."
    - "Ticks go to Kafka topic stock price; a price ingester writes them to InfluxDB and publishes the last traded price to Redis pub/sub."
    - "The price tracker is a WebSocket server: history from InfluxDB, live prices from Redis; a separate WebSocket gateway holds sticky sessions."
  terms:
    - term: WebSocket
      means: "One long-lived, two-way connection; either side can send at any time."
    - term: server-sent events
      means: "A one-way stream of events from server to client over a long-lived HTTP response."
    - term: time-series database
      means: "A store built for values over time, such as InfluxDB, queried by symbol and time range."
