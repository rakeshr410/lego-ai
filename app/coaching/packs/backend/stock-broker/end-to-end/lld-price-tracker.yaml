# Stock broker interview, deep dive into the price tracker: under "5. Deep dive: price tracker", the three ways to get prices as notes, then the video's picture left to right: clients, the gateway split into an API gateway and a WebSocket gateway, the price tracker as a WebSocket server, Redis pub/sub under InfluxDB, the price ingester above Kafka, the exchange gateway, and the exchange outside on the right with its sockets note.
