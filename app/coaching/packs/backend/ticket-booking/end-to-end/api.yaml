# Ticket booking interview, API: "3. API designing" beside the entities, the search GET, the event GET, and the two booking POSTs (reserve, then confirm) side by side with their bodies as code, as in the video.
id: backend/ticket-booking/end-to-end/api
title: Search, view, reserve, confirm
source:
  hash: "4a2fd389c1eb"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ticket-booking/end-to-end/entities
  assumes:
    - "Functional: search events by title, location and date; view an event's details and seats; book seats."
    - "The core entities are the user, the event, the venue and the ticket."
  carries:
    - "GET /v1/search?q=term&location=place&date=day returns a page of event ids."
    - "GET /v1/event/{eventId} returns the event's details, location and seats."
    - "Booking is two calls: POST /v1/booking/reserve with { seats } returns a bookingId; POST /v1/booking/confirm with { bookingId, paymentDetails } books."
    - The user comes from the auth token in the header, never from the body.
  terms:
    - term: endpoint
      means: A method and a path the service answers, with what it takes and what it returns.
    - term: pagination
      means: Returning a long result one page at a time, with a cursor for the next page.
