beats:
  - point: "The low-level design starts from a copy of the high-level picture, to open each box; the first box to open is the database."
    kind: rule
    weight: supporting
    teach:
      - "Step five, the low-level design. Copy the picture down the board: client apps, the API gateway, and the search, event details and booking services."
      - "The database was a vague box. Now we say which databases, and what they hold."
    draw: [lld-db, l-clients, l-gateway, l-clients-gateway, l-search, l-gateway-search, l-event, l-gateway-event, l-booking, l-gateway-booking]
    check: Why copy the high-level picture instead of drawing something new?
    answer: The low-level design opens the same boxes in detail, so the picture grows from the agreed design.
  - point: "Bookings and payments must be consistent, so they go to a relational database with transactions, MySQL or PostgreSQL."
    kind: decision
    weight: core
    teach:
      - "The data is of two kinds. First, bookings: the payment, the order history, which seats were sold. No two users may get one seat, and a payment must never be half recorded."
      - "That calls for transactions and consistency: a relational database, MySQL or Postgres. The booking service writes there."
    draw: [l-postgres, l-booking-postgres]
    check: Which database do bookings go to, and why?
    answer: MySQL or PostgreSQL, because bookings and payments need transactions and consistency.
  - point: "Event and movie metadata is a huge, read-mostly catalogue that must stay up, so it goes to Cassandra, a replicated store built for availability."
    kind: decision
    weight: core
    teach:
      - "Second, the metadata: every movie, show and concert, the actors, the venues. A huge amount, read far more than written, and the requirement says searching and viewing must stay available."
      - "Cassandra fits: partitioned and replicated, it keeps answering when a node fails, and it writes very fast. The event details service reads it."
    draw: [l-cassandra, l-event-cassandra]
    check: Which non-functional line does putting the metadata in Cassandra serve?
    answer: Highly available for searching and viewing events.
    misconceptions:
      - "Always pick Cassandra when you need availability -> pick it because this data is huge, read by key and must stay up; the reason matters, not the rule."
  - point: "Beside Cassandra go its rows: an event has an id, a venue, an artist, a name, a description and seats; a movie has an id, a title, actors and seats."
    kind: decision
    weight: supporting
    teach:
      - "Write what Cassandra holds. An event row: id, venue, artist id, name, description, and its seats."
      - "A movie row is much the same: id, title, actors, seats. Search, still pointing nowhere, is the next part."
    draw: [l-event-row-1, l-event-row-2, l-movie-row]
    check: Which entity's fields hold the seats an event sells?
    answer: The event and movie rows carry their seats, with the venue they are in.
asks:
  - ids: [l-postgres]
    beats: [2]
    question: "Bookings and payments must never be wrong. Which kind of database would you put them in?"
    hints:
      - Think about a payment and a seat being written together, or not at all.
      - Which databases give you transactions?
  - ids: [l-cassandra]
    beats: [3]
    question: "And the event metadata, millions of movies and shows that must always be readable. Where would that live?"
    hints:
      - It is huge, read far more than written, and must stay up.
      - A store that is partitioned and replicated for availability.
