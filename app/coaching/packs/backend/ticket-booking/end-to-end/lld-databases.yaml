# Ticket booking interview, low-level design 1: the databases. Under "5. Low level designing", the high-level picture copied (client apps, a tall API gateway, Search, Event details, Booking) and its database replaced by Cassandra for event metadata and MySQL or Postgres for bookings, with the event and movie rows written beside Cassandra, as the video draws it. Search's store is left for the next part, as in the video.
