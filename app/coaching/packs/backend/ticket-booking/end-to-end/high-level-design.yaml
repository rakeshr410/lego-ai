beats:
  - point: "At 100 million daily users the work is spread over many machines, so clients reach the backend through an API gateway that authenticates, rate limits and routes each request."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design: the requirements as a picture. First the clients, the website and the apps."
      - "A hundred million daily users is far more than one machine, so the backend runs as many copies. In front of them, an API gateway: it authenticates and authorizes each request, rate limits it, and routes it to the right service."
    draw: [hld, hld-clients, hld-gateway, hld-clients-gateway]
    check: Name the three jobs the API gateway does here.
    answer: Authentication and authorization, rate limiting, and routing each request to the right service.
  - point: "The simplest backend is one booking service that searches, returns event details and books, with one database holding events and bookings."
    kind: flow
    weight: core
    teach:
      - "Behind the gateway, start simple: one service, call it the booking service, doing all three jobs: search, view and book."
      - "And a database with the events and the bookings. A search comes in, the service looks in the database and returns results; a booking is written to the same database."
    draw: [hld-booking, hld-gateway-booking, hld-db, hld-booking-db]
    check: Walk me through a search in this first picture.
    answer: The request passes the gateway to the one service, which searches the database and returns the matching events.
  - point: "One service with every job must be scaled for all of them at once, so split it by responsibility: a search service, an event service and a booking service, each scaled on its own."
    kind: decision
    weight: core
    teach:
      - "That one service carries everything, and must be scaled for the sum. Split it by responsibility: a search service and an event service beside the booking service."
      - "The gateway now routes search requests to search, event requests to the event service, booking requests to booking, and for now all three read the one database. That is separation of concerns, and searching, which is far busier, can grow alone."
    draw: [hld-search, hld-gateway-search, hld-event, hld-gateway-event, hld-search-db, hld-event-db]
    check: Why split the one service into three?
    answer: The jobs have different loads and needs, so each service can be scaled and changed on its own; search is much busier than booking.
    misconceptions:
      - "A single service cannot run on more than one machine -> it can be copied too; the split is about scaling and changing each job separately."
asks:
  - ids: [hld-booking, hld-db]
    beats: [2]
