# Ticket booking interview, low-level design 2: search. Under "5. Low level designing", the picture so far, then Elasticsearch above Cassandra with the search service pointing at it, an arrow up from Cassandra labelled CDC with "change data capture" beside it, the event rows, and the booking service writing the seat count to Cassandra, as the video draws it. The video's rule of thumb that Postgres cannot index several columns is corrected.
