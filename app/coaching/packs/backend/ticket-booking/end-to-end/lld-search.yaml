context:
  after: backend/ticket-booking/end-to-end/lld-databases
  assumes:
    - "Bookings in MySQL or PostgreSQL; event and movie metadata in Cassandra."
    - "Available for search and view, consistent for booking."
  carries:
    - "Search runs on Elasticsearch, because Cassandra reads fast only by key and cannot run ad hoc text, location and date queries."
    - "Change data capture (Debezium, Kafka, a consumer) copies every Cassandra change into Elasticsearch within seconds."
    - "After a booking, the seat count in Cassandra drops (20 to 19) and search shows it moments later; that count is for display only."
  terms:
    - term: Elasticsearch
      means: "A search engine built on an inverted index: free text, filters, location and ranking in one query."
    - term: change data capture
      means: "Reading a database's changes as they happen and sending each one on, here into the search index."
