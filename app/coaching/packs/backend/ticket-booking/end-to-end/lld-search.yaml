beats:
  - point: "The picture so far: client apps, the API gateway, the search, event details and booking services, Cassandra for events and MySQL or Postgres for bookings."
    kind: rule
    weight: supporting
    teach:
      - "Last time we split the database: bookings in MySQL or Postgres, event metadata in Cassandra. Here is that picture again."
      - "One box still points nowhere: search. That is this part."
    draw: [lld-search, s-clients, s-gateway, s-clients-gateway, s-search, s-gateway-search, s-event, s-gateway-event, s-booking, s-gateway-booking, s-cassandra, s-event-cassandra, s-postgres, s-booking-postgres]
    check: Which store holds the events, and which the bookings?
    answer: Cassandra holds the event metadata; MySQL or PostgreSQL holds the bookings.
  - point: "Cassandra reads fast by partition key but cannot run ad hoc text, location and date queries across all events, so search runs on Elasticsearch."
    kind: mechanism
    weight: core
    teach:
      - "A search like Spider-Man, near me, this weekend has to look across millions of events by any mix of text, place and date. Cassandra is quick when you ask for a row by its key, such as an event id, but it has no full-text matching and no free mix of filters."
      - "That is what a search engine is for. The search service queries Elasticsearch and gets back a ranked page of event ids."
    draw: [s-es, s-search-es]
    check: Cassandra is fast. Why not search on it directly?
    answer: It is fast for look-ups by its partition key, but it cannot run ad hoc full-text, location and date queries across every event.
    misconceptions:
      - "Cassandra is slow at reads -> it reads fast by key; what it lacks is ad hoc querying and full-text search."
  - point: "PostgreSQL can index several columns and even do full-text search, but ranked text matching combined with location and date over a huge catalogue is a search engine's job."
    kind: decision
    weight: supporting
    teach:
      - "Why not put the catalogue in Postgres instead? It can carry several indexes, and some full-text search."
      - "But users search by title, place and date in any combination, ranked by relevance, over millions of rows. A search engine does that in one query; that is why Elasticsearch sits beside the store."
    check: What makes Elasticsearch a better fit than indexes in Postgres here?
    answer: Ranked full-text matching combined with location and date filters, in any mix, over a huge catalogue.
    misconceptions:
      - "Postgres cannot have more than one index -> it can have many; the case for a search engine is ranked text plus filters at scale."
  - point: "Change data capture keeps Elasticsearch in step with Cassandra: Debezium reads each change, publishes it to Kafka, and a consumer writes it into the index, within seconds."
    kind: mechanism
    weight: core
    teach:
      - "The events live in Cassandra, so the index is a copy. Copy it with change data capture: every time an event row changes, the change is captured and sent on into Elasticsearch."
      - "In practice Debezium reads Cassandra's change log, publishes each change to Kafka, and a consumer indexes it. The copy trails by seconds, which our availability line allows. These are the rows it copies."
    draw: [s-cdc, s-cdc-note, s-cdc-pipeline, s-event-row-1, s-event-row-2, s-movie-row]
    check: How does a new event added to Cassandra end up in search results?
    answer: Change data capture reads the change, publishes it to Kafka, and a consumer indexes it into Elasticsearch.
  - point: "When a booking is confirmed, the booking service updates the seat count in Cassandra, 20 left becomes 19, and the change reaches search moments later; that count is shown, never trusted to sell a seat."
    kind: flow
    weight: core
    teach:
      - "Seats are real-time data. Say 20 seats are left. Once a booking is confirmed, the booking service also writes to Cassandra: 19 left. Cassandra takes small writes fast, and change data capture carries it to search, so the next user sees 19."
      - "But the index and Cassandra may lag by seconds, so that number is for display. Whether a seat can be sold is decided in the booking path, which is the next part."
    draw: [s-booking-cassandra, s-seats-left, s-display]
    check: Can the booking service trust the seat count in the search index to decide a booking?
    answer: No; it lags by seconds and is for display only. The booking path decides.
asks:
  - ids: [s-es]
    beats: [2]
    question: "Users search by title, place and date, in any mix, across millions of events. Where would you run those searches?"
    hints:
      - Cassandra is fast by key. Is a free-text search a key look-up?
      - A store built around an index of words.
  - ids: [s-cdc-note]
    beats: [4]
    question: "The events live in Cassandra, the searches run on Elasticsearch. How do you keep the two in step?"
    hints:
      - Something has to notice each change in Cassandra.
      - Then send it on to the index, a few seconds later.
