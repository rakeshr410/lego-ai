# Ticket booking interview, low-level design 4: Redis holds that expire, and finishing. Under "5. Low level designing", the picture redrawn without the cron job (the video erases it), a Redis cluster below Postgres with the booking service pointing at it, the paid and unpaid paths as notes, the requirements read back with reads far outnumbering writes, and Kafka as a waiting queue under the gateway for traffic peaks, as the video draws them. The video checks Redis and then sets the key; this pack teaches one atomic set-if-absent with a TTL, and Postgres's unique key as the last guard.
id: backend/ticket-booking/end-to-end/lld-booking-redis
title: "Low-level design, 4: Redis holds, and finishing"
source:
  hash: "dc6a78d6d587"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ticket-booking/end-to-end/lld-booking-cron
  assumes:
    - "A reserve holds seats for 10 minutes while the user pays; a payment gateway confirms."
    - "The cron approach scans every seat every minute and frees holds late."
  carries:
    - "Each held seat is a Redis key set only if absent, with a 10-minute TTL, in one atomic command; one user wins."
    - "Paid: commit in PostgreSQL with a unique key on event and seat, delete the hold, update Cassandra. Unpaid: the key expires."
    - "Reads far outnumber bookings, so search and event services are scaled out more than booking."
    - "For a traffic peak, a waiting queue such as Kafka admits users to booking in batches."
  terms:
    - term: TTL
      means: "Time to live: a key deletes itself when it runs out, here after 10 minutes."
    - term: set if absent
      means: "A write that succeeds only when the key does not exist yet (SET with NX), checked and written in one step."
    - term: waiting queue
      means: "A virtual waiting room that lines users up and lets them into booking in order, in batches it can serve."
