beats:
  - point: "Drop the cron job: the picture is the same without it, and the holds move to a store that expires them by itself."
    kind: rule
    weight: supporting
    teach:
      - "Same picture as before, with the cron job gone: no more scanning every seat every minute."
      - "Instead, the holds will live somewhere that forgets them on time, by itself."
    draw: [lld-redis, r-clients, r-gateway, r-clients-gateway, r-search, r-gateway-search, r-event, r-gateway-event, r-booking, r-gateway-booking, r-es, r-search-es, r-cassandra, r-event-cassandra, r-postgres, r-booking-postgres]
    check: What was wrong with the cron job we are removing?
    answer: It scanned every seat every minute and freed holds late, so it was heavy and not real time.
  - point: "Each held seat becomes a key in a Redis cluster, set only if absent with a 10-minute TTL in one atomic command, so of two users asking at once exactly one gets the seat."
    kind: mechanism
    weight: core
    teach:
      - "Add a Redis cluster. When user 1 asks for L12 and L13, the booking service sets a key per seat, only if it is absent, with a 10-minute time to live, in one atomic command."
      - "If the set succeeds, nobody else is paying for that seat, and user 1 goes to pay. If the key already exists, someone is, and user 2 is told the seat is taken."
    draw: [r-redis, r-booking-redis, r-movie, r-users, r-hold]
    check: Why must the hold be one set-if-absent command rather than a check followed by a set?
    answer: Two users could both check, both see no key, and both set it; one atomic set-if-absent lets exactly one win.
    misconceptions:
      - "First check whether the key is in Redis, then store it -> two requests can pass the check together; use one atomic SET with NX and a TTL."
  - point: "When the payment succeeds, the booking service commits the booking in PostgreSQL, deletes the hold, and updates the seat in Cassandra, which change data capture shows to everyone; a unique key on event and seat is the last guard."
    kind: flow
    weight: core
    teach:
      - "User 1 pays through the payment gateway. On success, the booking service commits the booking in Postgres, deletes the hold keys, and marks the seats taken in Cassandra; change data capture carries that to search."
      - "One more guard: a unique key on event and seat in Postgres. If a slow payment outlived its hold and someone else took the seat, the second commit fails and that payment is refunded."
    draw: [r-payment, r-booking-payment, r-paid, r-booking-cassandra, r-cdc, r-cdc-note, r-guard]
    check: A payment took 12 minutes and the hold expired meanwhile. What stops two bookings of one seat?
    answer: The unique key on event and seat in PostgreSQL rejects the second commit, and that payment is refunded.
  - point: "If the payment fails or the user leaves, the key expires after 10 minutes and the seat is free again, with no job to run."
    kind: mechanism
    weight: core
    teach:
      - "If the payment fails, or the user walks away, nothing has to happen: after 10 minutes the key deletes itself."
      - "The next user who asks finds no key and can hold the seat. No cron job, and the seat comes back on time."
    draw: [r-unpaid]
    check: Who frees the seat when a user abandons the payment?
    answer: Nobody has to; the Redis key's 10-minute TTL expires and the seat is free.
  - point: "Read the functional requirements back: search by title, location and date on Elasticsearch, details and seats from Cassandra kept fresh by change data capture, booking with Redis holds and PostgreSQL."
    kind: rule
    weight: supporting
    teach:
      - "Go back to the requirements at the top. Search by title, location and date: Elasticsearch. Viewing details and seats: Cassandra, kept fresh in search by change data capture."
      - "Booking: Redis holds the seats while the user pays, and Postgres records the booking."
    check: Which part of the design answers the search requirement?
    answer: The search service querying Elasticsearch, fed from Cassandra by change data capture.
  - point: "Read the non-functional lines back: reads far outnumber bookings, so search and event services are scaled out more than booking; Cassandra keeps search available, Redis and PostgreSQL keep booking consistent."
    kind: decision
    weight: core
    teach:
      - "Scale: far more people browse than buy, so reads far outnumber writes. Each service is its own fleet, so run many more search and event copies than booking ones."
      - "CAP: Cassandra and Elasticsearch keep searching and viewing available; the Redis holds and Postgres keep booking consistent."
    draw: [r-reads]
    check: Which service gets the most copies, and why?
    answer: Search, and the event service, because reads far outnumber bookings.
  - point: "A follow-up: for a huge sale, such as an international concert, put a waiting queue, for example on Kafka, in front of booking, letting users in in order and in batches it can serve."
    kind: decision
    weight: core
    teach:
      - "If time is left, expect a follow-up: how do you survive a peak, an international concert going on sale with millions arriving at once?"
      - "Like the queue you wait in on the real sites: a waiting queue, for example on Kafka, in front of booking. Users join the line; when their turn comes they reserve and pay as usual, and booking sees a steady flow, not the spike."
    draw: [r-kafka, r-gateway-kafka, r-kafka-booking]
    check: How does the waiting queue protect the booking service during a peak?
    answer: Users wait in line and are let into booking in order, in batches it can handle, so it sees a steady flow instead of the spike.
asks:
  - ids: [r-redis]
    beats: [2]
    question: "We dropped the cron job. Where could we keep each hold so it disappears on its own after 10 minutes?"
    hints:
      - An in-memory store where a key can carry an expiry.
      - And it must let only one user set the key for a seat.
  - ids: [r-kafka]
    beats: [7]
    question: "A huge concert goes on sale and millions hit booking in the same minute. What would you put in front of the booking service?"
    hints:
      - Think of the line you wait in on the real ticket sites.
      - Something that lets users in a batch at a time.
