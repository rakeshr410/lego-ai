# Ticket booking interview, low-level design 3: holding seats with a cron job. Under "5. Low level designing", the picture so far, then "Spider-Man, L12, L13" and "user 1, user 2" under the clients, a payment gateway below the booking service, and a cron job beside Cassandra that frees unpaid holds, as the video draws its first approach; the verdict written beside it.
id: backend/ticket-booking/end-to-end/lld-booking-cron
title: "Low-level design, 3: holding seats, with a cron job"
