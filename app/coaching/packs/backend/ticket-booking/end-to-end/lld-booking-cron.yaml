beats:
  - point: "The picture so far: search on Elasticsearch, event details on Cassandra, bookings in MySQL or Postgres; now the critical part, the booking service."
    kind: rule
    weight: supporting
    teach:
      - "Here is the design so far: search reads Elasticsearch, event details read Cassandra, booking writes MySQL or Postgres."
      - "Now the most critical service, booking: it must keep the data consistent, so no two users get one seat."
    draw: [lld-cron, b-clients, b-gateway, b-clients-gateway, b-search, b-gateway-search, b-event, b-gateway-event, b-booking, b-gateway-booking, b-es, b-search-es, b-cassandra, b-event-cassandra, b-postgres, b-booking-postgres]
    check: Which non-functional line is the booking service responsible for?
    answer: Highly consistent for booking, so a seat is never sold twice.
  - point: "The problem: two users want the same seats, L12 and L13 for Spider-Man, at the same moment, and exactly one of them may get them."
    kind: failure
    weight: core
    teach:
      - "Picture it: user 1 and user 2 both open Spider-Man and both pick seats L12 and L13. Both requests reach the booking service at about the same time."
      - "Exactly one may succeed. The other must be told the seats are taken."
    draw: [b-movie, b-users]
    check: Two users ask for seat L12 at once. What must the system guarantee?
    answer: Exactly one gets it; the other is told it is taken.
  - point: "A reserve checks the seats are available and marks them reserved for that user for 10 minutes, long enough to pay; a second request finds them reserved and is turned away."
    kind: mechanism
    weight: core
    teach:
      - "Booking is two steps with a delay between: reserve, then pay. So give each seat a state: available, reserved or booked."
      - "User 2's request arrives first: the seats are available, so the booking service marks them reserved for user 2 for 10 minutes. User 1's request then finds them reserved and is turned away; the app shows them grey."
    draw: [b-states, b-hold, b-booking-cassandra]
    check: User 2 reserved L12 a minute ago. What does user 1 see when they ask for it?
    answer: The seat is reserved, so the request is turned away and the seat shows as taken.
    misconceptions:
      - "Reading available and then writing reserved is safe -> two requests can both read available first; the check and the write must be one atomic step."
  - point: "The reserving user is sent to the payment gateway; when it reports success, the booking is recorded and the seats become booked, and change data capture shows it to everyone."
    kind: flow
    weight: core
    teach:
      - "User 2 goes to the payment gateway. When the payment succeeds, the gateway tells the booking service, which records the booking and changes the seats from reserved to booked."
      - "Change data capture carries that to search, so other users stop seeing the seats as free."
    draw: [b-payment, b-booking-payment, b-cdc, b-cdc-note]
    check: What turns a reserved seat into a booked one?
    answer: The payment gateway reporting a successful payment to the booking service.
  - point: "If the user never pays, the seats would stay reserved forever, so a cron job runs every minute and frees seats reserved more than 10 minutes ago."
    kind: mechanism
    weight: core
    teach:
      - "Now the second case: user 2 never pays, or closes the app. The seats would stay reserved forever."
      - "So add a cron job that runs every minute, finds seats reserved more than 10 minutes ago, and makes them available again."
    draw: [b-cron, b-cron-cassandra, b-cron-note]
    check: User 2 closed the app after reserving. What brings the seats back?
    answer: The cron job, within a minute after the 10-minute hold runs out.
  - point: "The cron approach is a poor fit: it scans every seat every minute, a load that grows with the catalogue, and frees seats up to a minute late, so it is not real time."
    kind: decision
    weight: core
    teach:
      - "It works, but look at what the job does: every minute it reads every seat in the database to find the old holds. That load grows with the catalogue, not with the holds."
      - "And seats come back up to a minute late. Not real time, not reliable. Write the verdict beside it; the next approach removes the job."
    draw: [b-verdict]
    check: What are the two flaws of the cron job?
    answer: It scans every seat every minute, a heavy and growing load, and it frees seats late, so it is not real time.
asks:
  - ids: [b-hold]
    beats: [3]
    question: "User 2 needs a few minutes to pay. How do you stop user 1 from taking the same seats meanwhile?"
    hints:
      - What if a seat had more states than free and sold?
      - Something between the two, for a limited time.
  - ids: [b-cron]
    beats: [5]
    question: "And if user 2 never pays, the seats stay reserved. What would bring them back?"
    hints:
      - Something that checks for old holds regularly.
      - A task that runs on a schedule.
