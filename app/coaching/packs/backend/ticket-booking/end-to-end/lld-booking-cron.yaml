  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/ticket-booking/end-to-end/lld-search
  assumes:
    - "Search on Elasticsearch, fed from Cassandra by change data capture; bookings in MySQL or PostgreSQL."
    - "Booking is two calls, reserve then confirm, and must be highly consistent."
  carries:
    - "Seats are available, reserved or booked; a reserve holds them for one user for 10 minutes while they pay."
    - "On a successful payment the seats become booked; a cron job every minute frees holds older than 10 minutes."
    - "The cron approach scans every seat every minute and frees seats late: not real time, and the reserve must be atomic."
  terms:
    - term: hold
      means: "Seats reserved for one user for a few minutes while they pay; nobody else can take them."
    - term: cron job
      means: A task the system runs on a fixed schedule, here every minute.
    - term: payment gateway
      means: A third party that takes the payment and reports whether it succeeded.
