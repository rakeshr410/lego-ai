beats:
  - point: "At 50 million users the design is microservices, and every request first reaches a load balancer and API gateway that authenticates and authorizes, routes by endpoint, rate-limits and balances round robin."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. Many clients, and 50 million users: a monolith will not carry that, so microservices."
      - "In front of them, a load balancer and API gateway. Its jobs: authentication and authorization, routing each endpoint to its service, rate limiting, and spreading traffic round robin."
    draw: [hld, hld-client-1, hld-client-2, hld-client-3, hld-gateway, hld-c1-gw, hld-c2-gw, hld-c3-gw, hld-gateway-does]
    check: Name two things the API gateway does besides routing.
    answer: "Any two of: authentication and authorization, rate limiting, balancing load round robin."
  - point: "One service per requirement, each with its own database: the user service onboards users into UserDB, and the search service finds matching hotels in HotelDB."
    kind: component
    weight: core
    teach:
      - "Now the services, read off the requirements. A user service onboards users and saves their details in a user database."
      - "A search service takes the name, location and date and finds matching hotels in a hotel database, which holds each hotel's details and rooms. Which databases these are is for later."
    draw: [hld-user, hld-gw-user, hld-user-db, hld-user-save, hld-search, hld-gw-search, hld-hotel-db, hld-search-scan]
    check: Which service reads the hotel database in this design, and for what?
    answer: The search service, to find the hotels matching the name, location and date.
  - point: "The booking service books and calls a payment gateway, saving confirmed bookings in BookingDB; a booking info service reads past bookings from it, and a review service keeps reviews in ReviewDB."
    kind: flow
    weight: core
    teach:
      - "Booking is two steps: the booking service sends the guest to a payment gateway, and only on success saves the booking in a booking database."
      - "A booking info service reads that database for a user's past bookings. And a review service, with reviews in their own database, cleaner than mixing them into the hotel database."
    draw: [hld-booking, hld-gw-booking, hld-payment, hld-booking-pay, hld-booking-db, hld-booking-save, hld-info, hld-gw-info, hld-info-read, hld-review, hld-gw-review, hld-review-db, hld-review-save]
    check: Walk me through a booking in this design.
    answer: The request goes through the gateway to the booking service, which takes payment through the payment gateway and, on success, saves the booking in the booking database.
  - point: "This meets every functional requirement but none of the hard ones yet: how availability is stored, how search stays fast, and how double booking is stopped are the low-level design's job."
    kind: decision
    weight: supporting
    teach:
      - "Step back: every requirement on the left has a box. But nothing here says how a room's availability is stored, how search stays fast over a million hotels, or how two guests are stopped from booking one room. That is step five."
    check: What does this high-level design not yet guarantee?
    answer: That no two users book the same room on the same date, and that search is fast; those are designed in the low-level design.
asks:
  - ids: [hld-user, hld-search, hld-booking, hld-info, hld-review]
    beats: [2, 3]
    question: "Behind the gateway, which services do we need? Go down the requirements and name one for each."
    hints:
      - Accounts, search, booking, past bookings.
      - And where do guests leave their opinion of a hotel?
task:
  prompt: "Draw the high-level design: clients, the load balancer and API gateway, the user, search, booking, booking info and review services with the payment gateway under booking, and each service's database."
  expects: [1, 2, 3]
