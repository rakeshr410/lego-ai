# Hotel booking interview, high-level design: "4. High-level designing" under the API, as in the video: a column of clients, a tall load balancer and API gateway with its duties, a column of services (user, search, booking with the payment gateway under it, booking info, review) and their databases on the right.
id: backend/hotel-booking/end-to-end/high-level-design
title: Microservices behind a gateway
source:
  hash: "fe97efe9950c"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/hotel-booking/end-to-end/api
  assumes:
    - "Five endpoints: register, search, hotel details by date, book, past bookings."
    - "Non-functional: 50M users and 1M hotels; search available, booking consistent."
  carries:
    - "50M users call for microservices behind a load balancer and API gateway that authenticates, routes, rate-limits and balances round robin."
    - "Services: user to UserDB, search to HotelDB, booking to BookingDB with a payment gateway, booking info reading BookingDB, review to ReviewDB."
    - "The high-level design meets the functional requirements; storage, search speed and double booking are left for the low-level design."
  terms:
    - term: API gateway
      means: "The single entry point that authenticates, authorizes, routes each endpoint to its service and rate-limits."
    - term: microservice
      means: A small service owning one job and its own database, scaled on its own.
