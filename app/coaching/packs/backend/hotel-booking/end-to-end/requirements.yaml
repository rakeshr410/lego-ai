# Hotel booking interview, requirements: "1. Functional requirements" on the left, five lines, and "2. Non-functional requirements" on the right, the scale and a CAP choice split between searching and booking, as the video lays them out.
id: backend/hotel-booking/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "bf229a103e15"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/hotel-booking/end-to-end/problem-statement
  assumes:
    - "A hotel booking system lets a guest search hotels by location, date and availability, and book a room."
  carries:
    - "Functional: create an account and log in; search hotels by location and name for a date; book an available room; pay to confirm; see past bookings."
    - "Non-functional: 50M users and 1M hotels; search highly available; booking highly consistent, no two users book the same room on the same date."
    - "CAP is a choice made during a network partition, and it can differ by operation."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, such as scale, availability or consistency, with a number where there is one."
    - term: CAP
      means: "During a network partition, an operation either answers with possibly stale data (available) or refuses until copies agree (consistent)."
board:
  keep: [title, prompt-desc]
  elements:
    - { id: fr, kind: region, label: 1. Functional requirements, at: [2, 5], size: [36, 14], dashed: true }
    - { id: fr-account, kind: note, label: create an account and log in, at: [3, 7], in: fr }
    - { id: fr-search, kind: note, label: "search hotels by location and name, for a date", at: [3, 9], in: fr }
