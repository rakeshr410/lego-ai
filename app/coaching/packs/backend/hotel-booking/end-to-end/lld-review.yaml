beats:
  - point: "Reviews are simple rows, so ReviewDB can be MySQL, Postgres or even Cassandra: hotel, user, rating, comments and image URLs, with the photos themselves in S3."
    kind: decision
    weight: core
    teach:
      - "The review service is a quick one. Reviews are simple rows; MySQL is fine, though Postgres or Cassandra would do. Each holds the hotel, the user who wrote it, a rating, the comments and links to photos."
      - "The photos go to S3, like the hotel images; only their URLs are stored here."
    draw: [lld-review, rv-service, rv-db, rv-save, rv-schema-1, rv-schema-2, rv-photos]
    check: Where do a reviewer's photos go?
    answer: To S3, with only their URLs saved in ReviewDB.
