# Hotel booking interview, low-level design, the hotel database: inside the search service's deep dive the video writes "HotelDB (Postgres)" and its tables beside it (hotel, rooms, price), then "Availability" and "Availability (2)", the two ways to store availability, and an S3 store for images. Drawn here in the same order, the tables to the right of the database, the two availability designs side by side under them.
id: backend/hotel-booking/end-to-end/lld-hotel-db
title: "Low-level design: the hotel database"
source:
  hash: "67ec00e854ef"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/hotel-booking/end-to-end/lld-user-service
  assumes:
    - "The search service reads the hotel database to find hotels by name, location and date."
    - "Non-functional: 1M hotels; booking never sells one room twice on a date."
  carries:
    - "HotelDB is Postgres: hotel (id, name, address, geolocation), rooms (type, capacity), price per room per date range."
    - "Availability is either one row per room per day (simple, about 110 billion rows a year at 1M hotels) or one row per date range (fewer rows, but bookings split ranges)."
    - Images go to S3 blob storage; rows keep their URLs.
  terms:
    - term: geolocation
      means: "A hotel's latitude and longitude, what a proximity search reads."
    - term: blob storage
      means: "A store for large files such as images, like S3, addressed by URL."
