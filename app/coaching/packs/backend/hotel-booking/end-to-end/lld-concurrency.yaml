# Hotel booking interview, low-level design, concurrency control: as in the video, the booking service first checks the room availability service before payment (user 1 at t0, user 2 at t0 plus 5 seconds), then holds the room with a Redis lock, TTL 5 minutes, drawn beside the booking service; last the booking info service reading BookingDB and the booking table's columns. The lock is taught as an atomic SET NX, and a conditional write behind it, which the video leaves out.
id: backend/hotel-booking/end-to-end/lld-concurrency
title: "Low-level design: no two users book one room"
source:
  hash: "82873d9c21f0"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/hotel-booking/end-to-end/lld-booking
  assumes:
    - "The booking service takes payment through the payment service and publishes a booking event to Kafka."
    - "The availability service is the only writer of the availability table."
    - "Non-functional: no two users book the same room on the same date."
  carries:
    - "Before payment the booking service asks the availability service whether the room is still free."
    - "A Redis lock per room and night, SET NX with a 5-minute TTL, picks one winner among simultaneous requests and frees the room if payment is abandoned."
    - "A conditional availability write, or a unique key on room and date, is the last guard if a lock expires."
    - "The booking info service reads BookingDB: bookingId, hotelId, userId, roomIds, dates, amount, currency, status."
  terms:
    - term: SET NX
      means: "Redis's set-if-not-exists: of two clients setting one key, exactly one succeeds."
    - term: TTL
      means: Time to live; the key is deleted when it runs out.
