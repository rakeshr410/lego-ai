beats:
  - point: "The flow so far sends a guest to payment without checking the room: user 1 at t0 and user 2 at t0 plus 5 seconds both saw it free, and both would pay."
    kind: failure
    weight: core
    teach:
      - "The last requirement: no two users book the same room on the same date. Look at the flow: the booking service sends the guest to payment without checking anything."
      - "User 1 books at time zero and pays. User 2, five seconds later, saw the same free room in search, and nothing stops them paying too."
    draw: [cc-region, cc-race, cc-race-2]
    check: Where in the current flow can a double booking happen?
    answer: The booking service sends a guest to payment without checking the room is still free, so a second guest who saw it free can pay too.
  - point: "So before payment the booking service asks the availability service whether the room is still free for those dates, and refuses if it is not."
    kind: mechanism
    weight: core
    teach:
      - "Fix one: before sending anyone to payment, the booking service asks the availability service, is this room still free for these dates?"
      - "For user 2, five seconds later, the answer is no, and they get an error at once. That handles bookings seconds apart."
    draw: [cc-check]
    check: What does the booking service do now before payment?
    answer: It asks the availability service whether the room is still free and refuses if not.
  - point: "Two requests at the same instant both pass the check, so the booking service holds the room with a Redis lock per room and night, taken atomically with SET NX: exactly one request wins."
    kind: mechanism
    weight: core
    teach:
      - "But two requests at the same instant can both pass that check before either booking is written. Check then act races."
      - "Fix two: hold the room. The booking service takes a Redis lock on that room and night with SET if not exists. Of two requests, exactly one gets it; the other is told the room is taken. A stay of several nights locks every night."
    draw: [cc-lock, cc-hold, cc-lock-note]
    check: Why must taking the lock be a single atomic SET NX rather than a read, then a write?
    answer: A read then a write lets two requests both see it free; SET NX lets exactly one succeed.
    misconceptions:
      - "Checking availability first is enough -> two simultaneous requests both pass the check; only an atomic step picks one winner."
  - point: "The lock has a TTL of about 5 minutes, the time to pay; if the guest abandons payment the lock expires and the room is free again."
    kind: rule
    weight: core
    teach:
      - "Give the lock a TTL of about five minutes, how long paying takes. If the guest closes the tab, the key expires and the room is bookable again."
      - "This is the same hold-while-you-pay idea as a ticket booking system."
    check: What would happen without the TTL?
    answer: An abandoned checkout would hold the room forever.
  - point: "A lock can expire during a slow payment, so the availability service's write is conditional, booking a night only where it is still free, or rests on a unique key on room and date: the database is the last guard."
    kind: decision
    weight: core
    teach:
      - "One more layer. A lock with a TTL can run out while a slow payment is still going, and then a second guest can take it."
      - "So the availability service marks a night booked only where it is still free, a conditional update, or the table has a unique key on room and date. The second booking then fails instead of overwriting the first."
    draw: [cc-conditional]
    check: The lock expired during a slow payment and a second guest took it. What still stops the double booking?
    answer: The availability write is conditional on the night still being free, or a unique key on room and date rejects the second one.
  - point: "The booking info service reads BookingDB, Postgres or MySQL: booking id as the unique key, hotel, user, a list of rooms, start and end dates, amount, currency and status."
    kind: component
    weight: supporting
    teach:
      - "Last, the booking info service: it reads the booking database for a user's past bookings."
      - "The booking table: booking id as the unique key, hotel id, user id, a list of room ids since one booking can hold several rooms, start and end dates, amount, currency and status."
    draw: [cc-info, cc-info-read, cc-schema-1, cc-schema-2]
    check: Why is the rooms column a list?
    answer: One booking can reserve more than one room.
  - point: "Read the requirements back: search stays available through Elasticsearch and the cache, booking stays consistent through the check, the lock and the conditional write, and every service scales out behind the gateway."
    kind: rule
    weight: supporting
    teach:
      - "Close by reading the right-hand list against the board. Fifty million users: every service scales out behind the gateway. Search available: Elasticsearch and the cache. Booking consistent: the check, the lock, and the conditional write."
    check: Which parts of the design make booking consistent?
    answer: The availability check before payment, the atomic Redis lock with a TTL, and the conditional write in the availability service.
asks:
  - ids: [cc-lock]
    beats: [3]
    question: "Two guests press book at the very same instant and both pass the check. How would you make sure only one of them goes on to pay?"
    hints:
      - Something both requests try to take, that only one can get.
      - In a fast shared store, with an expiry.
task:
  prompt: "Draw the final booking path: the booking service checking the availability service, holding the room with a Redis lock with a 5-minute TTL, paying through the payment service and gateway, publishing to Kafka, and the notification, consumer and availability services writing their databases."
  expects: [2, 3, 4]
