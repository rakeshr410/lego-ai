# Hotel booking interview, low-level design, the search service: as in the video, Elasticsearch goes in front of the search service, fed from HotelDB (the "cdc" arrow), then "Proximity Search" with its four numbered options and the quadtree sketch beside the design, then the two-phase search with a Redis cache above and S3 to the right. The video's "inner join" in Redis is taught as a merge in the service's code.
id: backend/hotel-booking/end-to-end/lld-search
title: "Low-level design: the search service"
source:
  hash: "666c77a1f56c"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/hotel-booking/end-to-end/lld-hotel-db
  assumes:
    - "HotelDB is Postgres with hotel, rooms, price and availability tables; images are in S3."
    - "Search must stay highly available and fast over 1M hotels."
  carries:
    - "Search queries Elasticsearch, not five or six joined Postgres tables."
    - "Proximity search options: Elasticsearch geo queries, quadtree, Postgres with PostGIS, geohash; Elasticsearch wins because one query needs text and location."
    - "Two-phase search: Elasticsearch holds only the hotel table and returns matching hotel ids; rooms, prices and availability for those ids come from a Redis cache keyed by hotel and are merged in code."
  terms:
    - term: proximity search
      means: "Finding the items within a distance of a point, such as hotels within 5 km."
    - term: CDC
      means: "Change data capture: streaming each committed change of a database to other systems."
    - term: quadtree
      means: "A tree that splits the map into four quadrants, then each into four, down to small cells."
