# Hotel booking interview, low-level design, the booking service: the video reorganizes the board to open the booking service. Drawn as there: booking service, payment service under it and the third-party payment gateway under that, PaymentDB with its columns to the right; then Kafka beside the booking service, with the notification service, the consumer writing BookingDB, and the room availability service writing HotelDB. The video calls the direct updates a two-phase commit; this pack calls it a dual write and adds the outbox and idempotent consumers Kafka needs.
id: backend/hotel-booking/end-to-end/lld-booking
title: "Low-level design: the booking service"
source:
  hash: "43e95fc19959"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/hotel-booking/end-to-end/lld-review
  assumes:
    - "Booking is two steps: pay, then confirm; the booking service calls a payment gateway and saves to BookingDB."
    - "HotelDB holds the availability table."
  carries:
    - "The booking service calls a payment service, which calls a third-party payment gateway and records the outcome in PaymentDB on MySQL."
    - "After payment the booking service publishes one booking event to Kafka; a notification service, a consumer writing BookingDB, and the availability service act on it."
    - "The availability service is the only writer of the availability table."
    - "Direct writes to two databases can half-fail; Kafka with an outbox and idempotent consumers gives eventual consistency."
  terms:
    - term: dual write
      means: "One service writing two separate stores in turn, which can leave them disagreeing if one write fails."
    - term: outbox
      means: "A table written in the same transaction as the state change, from which events are relayed to the broker, so none is lost."
    - term: idempotent
      means: Safe to apply twice; a repeated event changes nothing.
