beats:
  - point: "Booking is a two-step flow: the booking service calls a payment service, which takes the card details and calls a third-party payment gateway that moves the money with the bank."
    kind: flow
    weight: core
    teach:
      - "Now the booking service. A guest confirms, and booking is two steps: pay, then confirm."
      - "The booking service calls a payment service, which collects the card details and the one-time password and calls a third-party payment gateway; the gateway does the transaction with the bank and answers success or failure."
    draw: [lld-booking, bk-two-step, bk-gateway, bk-booking, bk-gw-booking, bk-payment, bk-booking-pay, bk-pgw, bk-pay-pgw]
    check: Who actually moves the money?
    answer: The third-party payment gateway, called by the payment service.
  - point: "The payment service records every attempt and its outcome in PaymentDB on MySQL, chosen for ACID transactions: user, booking id, amount, currency and date."
    kind: decision
    weight: core
    teach:
      - "Every payment is logged: the payment service writes the attempt and its result to a payment database."
      - "MySQL, for its ACID transactions: money rows are written once, with their status. The columns: user id, booking id, amount, currency, date."
    draw: [bk-payment-db, bk-pay-db, bk-pay-schema-1, bk-pay-schema-2]
    check: Why a transactional database like MySQL for payments?
    answer: Payment records need ACID transactions so each one is written exactly once with its status.
    misconceptions:
      - "MySQL gives payments both high consistency and high availability -> it is chosen for ACID transactions; under a partition it still has to give up one."
  - point: "After payment, the booking service publishes one booking event to Kafka instead of updating the booking and hotel databases itself, because two direct writes can half-fail."
    kind: mechanism
    weight: core
    teach:
      - "On success, three things must happen: save the booking, mark the room booked, tell the guest. If the booking service wrote the booking database and the hotel database itself, one could succeed and the other fail."
      - "That is a dual write. Instead it publishes a single booking event to Kafka, and each piece of work becomes a consumer of it."
    draw: [bk-kafka, bk-booking-kafka, bk-dual-write]
    check: What goes wrong if the booking service updates both databases directly?
    answer: One write can succeed and the other fail, leaving the databases disagreeing.
  - point: "Consumers do one job each: a notification service tells the guest, a consumer service writes BookingDB, and the availability service, the only writer of availability, marks the room booked in HotelDB."
    kind: component
    weight: core
    teach:
      - "Off Kafka: a notification service that tells the guest it is confirmed. A consumer service that writes the booking and its status to the booking database."
      - "And an availability service that marks the room booked in the hotel database. It is the only service allowed to write the availability table, so no two services race on it."
    draw: [bk-notify, bk-kafka-notify, bk-consumer, bk-kafka-consumer, bk-booking-db, bk-consumer-db, bk-avail, bk-kafka-avail, bk-hotel-db, bk-avail-db]
    check: Why let only one service write the availability table?
    answer: A single writer means no two services race on the same rows.
  - point: "Kafka gives eventual consistency, not a transaction: the event goes through an outbox written with the booking's state, and each consumer is idempotent, keyed by booking id, so a retried event changes nothing."
    kind: mechanism
    weight: core
    teach:
      - "Kafka keeps the event until each consumer has processed it, so a failed consumer retries and the databases converge. Eventual consistency, not a distributed transaction."
      - "Two details make it hold: write the event to an outbox table in the same transaction as the booking's state, so it can't be lost between payment and publish; and make every consumer idempotent by booking id, since an event can arrive twice."
    draw: [bk-outbox]
    check: A consumer writes the booking, then crashes before committing its offset. What protects you?
    answer: The write is idempotent, keyed by booking id, so processing the event again changes nothing.
    misconceptions:
      - "Kafka makes the two updates one atomic commit -> each consumer applies the event on its own; it is eventual consistency, with retries and idempotent writes."
asks:
  - ids: [bk-payment]
    beats: [1]
    question: "The guest clicks confirm. What does the booking service call to take the money?"
    hints:
      - A service of our own that records payments.
      - Which in turn talks to a third party.
  - ids: [bk-kafka]
    beats: [3]
    question: "After payment, the booking must be saved, the room marked booked and the guest told. How would you do all three without one failure leaving things half done?"
    hints:
      - What if the booking service only announced that a booking happened?
      - Something durable that others read from.
  - ids: [bk-notify, bk-consumer, bk-avail]
    beats: [4]
    question: "Who reads that booking event? Name a service for each job."
    hints:
      - One tells the guest.
      - One saves the booking, and one updates availability.
