beats:
  - point: "Step five copies the high-level design and opens each service; the user service only saves users on sign-up and, on login, checks the credentials and issues a JWT for later calls."
    kind: mechanism
    weight: core
    teach:
      - "Step five, the low-level design: take the picture above and open each service in turn, simplest first. The user service saves a new user's details on sign-up."
      - "On a later login it checks the email and the password hash and issues a JWT, a signed token the client sends on every call so the gateway can verify it without asking us again."
    draw: [lld-user, lu-service, lu-jwt]
    check: What does the client get after logging in, and what is it for?
    answer: A JWT, sent with every later call so the gateway can verify who is calling.
  - point: "User data is small and relational, one row per user, so UserDB is MySQL: userId, name, email, password hash, phone and metadata."
    kind: decision
    weight: core
    teach:
      - "The one decision worth stating is the database. One row per user, related data, read by id or email: MySQL, or Postgres."
      - "Write the columns beside it: user id, name, email, a password hash, never the password itself, phone and other metadata."
    draw: [lu-db, lu-save, lu-schema-1, lu-schema-2]
    check: Which database fits the users, and why?
    answer: A relational one like MySQL, since it is small structured rows read by id or email.
    misconceptions:
      - "Store the password so login can compare it -> store a salted hash and compare hashes."
asks:
  - ids: [lu-db]
    beats: [2]
    question: "Which database would you put the users in, and what goes in a row?"
    hints:
      - Is the data structured and related, or loose documents?
      - What does a login need to look up and compare?
