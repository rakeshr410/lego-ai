# Job scheduler interview, low-level design, the services: under "5. Low-level design", the high-level picture copied and opened: the job service split into a job service for writes and a job search service for reads, writes through Kafka to a consumer service, the job database (Postgres) with the jobs and job runs tables beside it, as in the video (the tables sit under the gateway here, for room).
