      means: "A durable log of messages in topics; producers append, consumers read at their own pace."
    - term: consumer service
      means: The one service that reads job writes and status updates from Kafka and writes them to the database.
    - term: job run
      means: "One execution of a job, with its status (queued, running, success, failed), times, executor and attempt number."
