  assumes:
    - "The high-level design: clients, a gateway, a job service, a job database, a job executor."
    - "Non-functional: 10k jobs a second at peak, availability over consistency."
  carries:
    - "A job service takes writes (create, edit, cancel, trigger); a job search service answers reads straight from the database."
    - "Writes go to Kafka, and a consumer service is the only writer to the job database."
    - "PostgreSQL: a jobs table (id, name, scheduleType, status, scheduleTime, cronExpression, payload, maxRetries) and a job runs table (id, jobId, status, times, executorId, attemptNumber, errorMessage)."
  terms:
