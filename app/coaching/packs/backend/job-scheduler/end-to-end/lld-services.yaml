beats:
  - point: "One job service doing every operation is a poor split, so divide it: a job service for writes (create, edit, cancel, trigger) and a job search service for reads (details and status)."
    kind: decision
    weight: core
    teach:
      - "Step five, the low-level design. Copy the high-level picture down and open it. Users, the load balancer and gateway as before; leave user onboarding out, it is not this problem."
      - "The single job service runs every endpoint. Split it: the job service takes every write, create, edit, delete, trigger; a job search service takes every read, a job's details and its status."
    draw: [l-heading, l-users, l-gateway, l-users-gateway, l-job-svc, l-gateway-svc, l-search, l-gateway-search]
    check: Which requests go to the search service, and which to the job service?
    answer: "Reads, a job's details and status, go to the search service; creates, edits, cancels and triggers go to the job service."
  - point: "The search service reads the job database directly: it looks jobs up by id and status, never by free text, so a search engine like Elasticsearch adds nothing."
    kind: decision
    weight: core
    teach:
      - "Does search need Elasticsearch? Look at the queries: a job by its id, a job's status. No titles, no free text."
      - "So the search service reads the job database directly; the database's own indexes answer those."
    draw: [l-db, l-search-db]
    check: Why not put Elasticsearch behind the search service?
    answer: "Reads are by id and status only, which the database answers; a search engine earns its place for free-text search."
  - point: "Writes arrive in bursts of thousands a second, so the job service publishes each write to Kafka, and a consumer service reads it and writes the database, the database's only writer."
    kind: mechanism
    weight: core
    teach:
      - "Ten thousand users may submit jobs in the same second. One service inserting all of that straight into the database would swamp it."
      - "So the job service publishes each create or edit to Kafka, and a consumer service reads the topic and writes the job database at its own pace."
      - "The cost: a create is accepted before it is stored, so the job service makes the jobId itself and returns it at once, and the dashboard may lag a moment, which availability over consistency allows."
    draw: [l-kafka, l-svc-kafka, l-consumer, l-kafka-consumer, l-consumer-db]
    check: What does putting Kafka between the job service and the database buy, and what does it cost?
    answer: "It absorbs bursts, so the database takes writes at its own pace; the cost is that a job is accepted before it is stored, so its id is made up front and the dashboard may lag."
    misconceptions:
      - "Kafka makes the write faster to store -> it makes accepting fast; storing happens a moment later."
  - point: "The job database is PostgreSQL with two tables: jobs, describing each job and its schedule, and job runs, one row per execution with its status, times, executor and attempt."
    kind: decision
    weight: core
    teach:
      - "The data is flat job records, so PostgreSQL. The jobs table: id, name, schedule type, status such as scheduled, paused or cancelled, schedule time, cron expression, payload, and max retries, three by default."
      - "A cron expression says when it repeats: five fields, minute, hour, day of month, month, day of week; 0 9 star star 5 is nine every Friday. Some schedulers add seconds in front."
      - "The job runs table: one row per run. Id, jobId, status queued, running, success or failed, start and end time, modified time, the executor's id, the attempt number, and the error message."
    draw: [s-jobs-1, s-jobs-2, s-jobs-3, s-runs-1, s-runs-2, s-runs-3]
    check: Which table tells you a job is running right now, and where?
    answer: "The job runs table: its status and its executor id."
    misconceptions:
      - "A cron expression starts with seconds -> standard cron has five fields starting at minutes; only some schedulers, such as Quartz, add seconds."
  - point: "A run's row changes as it goes: queued with attempt 1 when picked up, running with a start time when it starts, modified time moving with every update, then success or failed."
    kind: flow
    weight: supporting
    teach:
      - "Follow a run: a Friday nine o'clock job. At nine a row appears, queued, attempt 1, no start time yet. When it starts: running, with a start time. Each update moves the modified time. At the end: success or failed."
    check: When a run is first picked up, what does its row say?
    answer: "Status queued, attempt number 1, no start or end time yet."
