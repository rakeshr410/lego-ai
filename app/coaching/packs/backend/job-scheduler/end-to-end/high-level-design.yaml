beats:
  - point: "Requests from clients reach a load balancer and API gateway, which authenticates and authorizes them, rate-limits them and routes each to its service."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design: just enough boxes to meet the functional requirements. On the left, the clients, the users scheduling jobs."
      - "This is a service for a lot of traffic, so in front of it a load balancer and API gateway: authentication and authorization, rate limiting, and routing each request evenly to the backend."
    draw: [hld, hld-clients, hld-gateway, hld-clients-gateway, hld-gw-note]
    check: Name the three jobs of the API gateway here.
    answer: "Authentication and authorization, rate limiting, and routing requests to the right service."
  - point: "A job service handles the API's operations and saves each job in a job database."
    kind: component
    weight: core
    teach:
      - "Behind the gateway, a job service: the microservice that creates, updates and cancels jobs and answers their status."
      - "Whatever the user creates must survive, so the job service saves it in a job database holding the jobs' metadata."
    draw: [hld-svc, hld-gateway-svc, hld-db, hld-svc-db]
    check: Walk me through what happens when a user creates a job.
    answer: The request goes through the gateway to the job service, which saves the job in the job database.
  - point: "A job executor is the core: it pulls the jobs that are due from the database, runs them, and updates each job's status, which is how the dashboard shows it."
    kind: component
    weight: core
    teach:
      - "Now running. A job is due at 5:30; something must pick it up then. A job executor: it looks in the job database for what is due now, say at 5:00, and runs it."
      - "And it writes back how it went, running, succeeded, failed, so a status request to the job service reads it. Every functional requirement is met; how often it looks, and how thousands run, is the low-level design."
    draw: [hld-exec, hld-exec-db, hld-pull, hld-update]
    check: What are the executor's two responsibilities?
    answer: Pull the jobs that are due from the database, and update each job's status as it runs.
asks:
  - ids: [hld-gateway, hld-svc, hld-db]
    beats: [1, 2]
    question: "What's the smallest set of boxes that lets a user create a job and keep it? Name them and I'll draw them."
    hints:
      - Something in front to check who is calling and route the request.
      - Then something that handles the job, and somewhere to keep it.
  - ids: [hld-exec]
    beats: [3]
    question: "The job is saved. What makes it actually run at its time?"
    hints:
      - Something has to look for the jobs that are due.
      - And it should record how each run went.
task:
  prompt: "Draw the high-level design: clients, a load balancer and API gateway, a job service, a job database, and a job executor that pulls due jobs and updates their status."
  expects: [1, 2, 3]
