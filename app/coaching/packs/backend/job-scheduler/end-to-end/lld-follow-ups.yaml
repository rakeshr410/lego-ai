beats:
  - point: "A Kafka partition is read first in, first out, so a run-now job pushed behind a hundred jobs already queued for the next five minutes waits for all of them, though it is due first."
    kind: failure
    weight: core
    teach:
      - "A senior follow-up. The watcher pushes the next five minutes of jobs to Kafka, sorted by time. Now a run-now job arrives."
      - "Kafka orders a partition by arrival, not by run time. A hundred jobs are queued; job 101 is read after all of them. Name this limit when you choose Kafka; it cannot be fixed inside Kafka."
    draw: [q-fifo, q-late]
    check: Why might a run-now job start late with this design?
    answer: "Kafka reads a partition in arrival order, so it waits behind the jobs already queued for the next five minutes."
  - point: "Ordering by time fixes it: a Redis sorted set scored by run time, which the consumer reads by score, or a delay queue such as Amazon SQS, whose delay is at most 15 minutes."
    kind: decision
    weight: core
    teach:
      - "Two alternatives. A Redis sorted set with the run time as the score: however late a job arrives it sits in time order, and the job consumer takes whatever is due."
      - "Or a managed delay queue like Amazon SQS, which hides a message until its delay passes. Its delay is at most 15 minutes: enough for a five-minute window, not for next Friday. And an interviewer may prefer that you design it rather than plug it in."
    draw: [q-alt, q-sqs]
    check: Can Amazon SQS on its own schedule a job for next Friday?
    answer: "No; its delay is at most 15 minutes, enough for the five-minute window but not for far-future times."
    misconceptions:
      - "SQS can deliver a message at any future time -> its delay caps at 15 minutes; far-future times need a scheduler in front."
  - point: "To show why a job failed, executors ship their logs to a logging service, and the run's error message holds a link to the job's log."
    kind: mechanism
    weight: supporting
    teach:
      - "Last follow-up: a job failed, why? Every executor ships its job's output to a logging service, and the run's error message holds the link to that log, so the dashboard can show it."
    draw: [q-logs]
    check: Where does a user find why their job failed?
    answer: "In the job's log in the logging service, linked from the run's error message."
asks:
  - ids: [q-alt, q-sqs]
    beats: [2]
    question: "So Kafka can't put a late, urgent job first. What would you use instead to keep jobs in run-time order?"
    hints:
      - Is there a structure that keeps members sorted by a number?
      - Or a queue that can hold a message back until its time?
