# Job scheduler interview, low-level design, the edge cases: as in the video, a Redis cache beside the executors for cancel requests with a TTL, the run-now path from the job service straight to the run queue (also taken by jobs due within a minute, closing the polling race), a Redis holding the watcher's last polled time beside the watcher, and the indexes written by the tables. The video draws the cancel arrow from the job service to Redis; here it is a note, as a straight arrow would cross the picture.
id: backend/job-scheduler/end-to-end/lld-edge-cases
title: "Low-level design: cancel, run now, the race, indexes"
source:
  hash: "6eed5e282c2d"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/job-scheduler/end-to-end/lld-failures
  assumes:
    - "Writes go through Kafka to the consumer service; the watcher queues due jobs; the job consumer hands them to executors."
    - "The watcher polls every 20 s for the next 5 minutes, and re-queues runs silent for 15 s."
  carries:
    - "Cancel: future runs through Kafka; a running job through a Redis entry with a TTL of about 30 s that executors check every 10 s."
    - "Run now, and any job due within about a minute, go straight to the run topic, closing the race between two polls."
    - "The watcher keeps its last polled time in Redis, so a restarted watcher carries on."
    - "Indexes: jobs partitioned by next run time and keyed by id; job runs indexed by jobId and by status then modifiedTime."
  terms:
    - term: TTL
      means: "Time to live: the entry deletes itself after it, here about 30 seconds."
    - term: polling race
      means: A job created after one poll and due before the next poll's window starts is never picked up.
