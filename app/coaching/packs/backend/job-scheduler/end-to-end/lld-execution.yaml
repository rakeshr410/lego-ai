# Job scheduler interview, low-level design, the execution path: under the services, as in the video, a watcher reading the job database every 20 s for the next five minutes, a Kafka run queue, a job consumer service and a column of executor services, their status going up through Kafka to the consumer service.
id: backend/job-scheduler/end-to-end/lld-execution
title: "Low-level design: watcher, run queue, executors"
