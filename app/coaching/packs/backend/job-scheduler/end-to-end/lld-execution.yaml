  after: backend/job-scheduler/end-to-end/lld-services
  assumes:
    - "Writes go through Kafka to a consumer service, the job database's only writer."
    - "The job runs table holds each run's status, times, executor and attempt number."
    - "Non-functional: 10k jobs a second, a job starts within 2 s of its time."
  carries:
    - "A watcher reads the database every 10 to 20 s for jobs due in the next 5 minutes, marks each run queued and pushes it to a Kafka run topic."
    - "A job consumer service reads the run topic, holds each job until its time, and hands it to one of many executor services."
    - "Executors report status every 10 s through Kafka; the consumer service writes it, moving modifiedTime."
  terms:
    - term: watcher
      means: The service that moves due jobs from the database to the run queue in bulk; it runs nothing.
    - term: run topic
      means: The Kafka topic of jobs ready to run.
