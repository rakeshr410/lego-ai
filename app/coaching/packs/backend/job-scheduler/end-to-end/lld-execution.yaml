beats:
  - point: "Scanning the job table every second is not feasible, so a watcher service reads it every 10 to 20 seconds for every job due in the next five minutes, and marks each run queued."
    kind: mechanism
    weight: core
    teach:
      - "Now the heart: how does a job get picked up? Scanning the whole table every second for what is due does not scale."
      - "So a watcher service reads less often, every 20 seconds, but looks ahead: every job due between now and five minutes from now, in one bulk read. For each, it adds a job run, status queued."
    draw: [x-watcher, x-watcher-db, x-watcher-note]
    check: Why read five minutes ahead every 20 seconds instead of what is due every second?
    answer: "Scanning every second costs too much; fewer, larger reads move the due jobs out in bulk while the database load stays low."
  - point: "The watcher runs nothing: it pushes the due jobs to a Kafka topic named run, the queue of jobs ready to run."
    kind: component
    weight: core
    teach:
      - "Where do those jobs go? Into a queue: a second Kafka, with a topic named run."
      - "The watcher only moves jobs from the database to the queue. Queued in the table means exactly that: picked, waiting in the run topic."
    draw: [x-run-kafka, x-watcher-kafka, x-topic-run]
    check: What does the watcher do with the jobs it reads?
    answer: "Marks each run queued and pushes the job onto the Kafka run topic; it does not run them."
  - point: "A job consumer service reads the run topic and, when each job's time comes, hands it to one of many executor services, which do the actual work."
    kind: mechanism
    weight: core
    teach:
      - "On the other side, a job consumer service reads the run topic. Kafka delivers a message as soon as it is published, not at a set time, so the consumer holds each job until it is due; that is how a job starts within 2 seconds."
      - "Then it hands the job to an executor service: run a Python script, start a Docker image, update a database. Many executors, as many as ten thousand jobs a second need."
    draw: [x-job-consumer, x-jc-kafka, x-jc-note, x-exec-1, x-jc-exec-1, x-exec-2, x-jc-exec-2, x-exec-3, x-jc-exec-3]
    check: Who makes sure a job queued five minutes early does not start early?
    answer: "The job consumer, which holds each job until its scheduled time before handing it to an executor; Kafka itself delivers at once."
    misconceptions:
      - "Kafka delivers each message at its scheduled time -> Kafka delivers as soon as a message is published; the consumer has to wait for the time."
  - point: "While a job runs, its executor reports status every 10 seconds, not to the database but through Kafka, and the consumer service writes it, moving the run's modified time."
    kind: flow
    weight: core
    teach:
      - "A job may run for ten minutes; the dashboard wants to know. The executor reports every 10 seconds: started, still running, done."
      - "Thousands of executors writing the database every 10 seconds would swamp it, and many writers on one row clash. So they publish to the Kafka we already have, and the consumer service, still the only writer, updates the job run: start time, status running, executor id, and the modified time on every report."
    draw: [x-exec-status]
    check: Why do executors send status through Kafka instead of writing the job runs table?
    answer: "Many executors writing every 10 seconds would load the database and clash; through Kafka, the one consumer service writes them."
asks:
  - ids: [x-watcher]
    beats: [1]
    question: "Scanning the whole table every second won't scale. How would you find the jobs that are about to be due?"
    hints:
      - What if you looked less often, but further ahead?
      - Something whose only job is to watch the table.
  - ids: [x-run-kafka]
    beats: [2]
    question: "The watcher has a batch of jobs due in the next few minutes. Where should it put them?"
    hints:
      - Somewhere that holds them in order until something picks them up.
      - We already use one for writes.
  - ids: [x-job-consumer, x-exec-1, x-exec-2, x-exec-3]
    beats: [3]
    question: "And who takes them off the queue and actually runs them?"
    hints:
      - One service reads the queue.
      - The work itself is spread over many machines.
