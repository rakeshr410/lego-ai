beats:
  - point: "Creating a job is a POST to /v1/jobs with the job and its schedule, a time for a one-off job or a cron expression for a repeating one, and it returns the jobId."
    kind: flow
    weight: core
    teach:
      - "Step three, the API: almost one to one with the requirements. Creating submits data, so a POST to v1 slash jobs."
      - "The body: a name, the schedule type, a schedule time or a cron expression, marked optional because a job has one or the other, the payload the job needs, and its max retries. It answers with a jobId."
    draw: [api, api-post, api-body-1, api-body-2]
    check: Why are scheduleTime and cronExpression both optional?
    answer: "A one-off job has a time, a repeating job has a cron expression, and an immediate job needs neither."
  - point: "Two reads: GET /v1/jobs/{jobId} for the job's details, and GET /v1/jobs/{jobId}/status for its current status, the jobId coming from the create."
    kind: flow
    weight: core
    teach:
      - "Reading needs a GET. The create gave us a jobId, so GET v1 jobs, then the jobId, returns who created it, when, and its schedule."
      - "Monitoring gets its own: GET on the job's status returns running, succeeded or failed, for the dashboard."
    draw: [api-get, api-status]
    check: Where does the jobId in these paths come from?
    answer: The create call returns it.
  - point: "Then PUT /v1/jobs/{jobId} to update a job or its schedule, POST /v1/jobs/{jobId}/cancel to cancel it even while running, and POST /v1/jobs/{jobId}/run-now to run it at once."
    kind: flow
    weight: core
    teach:
      - "Update is a PUT on the job: new metadata or a new schedule."
      - "Cancel is an action, a POST to cancel, for a job due tomorrow or one running right now. And run now, a POST that starts a run immediately, which covers the immediate case of the first requirement."
    draw: [api-put, api-cancel, api-run]
    check: Why is cancel a POST action rather than a DELETE of the job?
    answer: Cancelling changes what happens next and may stop a run, while the job and its history of runs stay.
    misconceptions:
      - "Cancel deletes the job -> the job and its runs stay for the dashboard; cancel stops future runs and the current one."
asks:
  - ids: [api-post, api-get, api-status, api-put, api-cancel, api-run]
    beats: [1, 2, 3]
    question: "Looking at the requirements, what endpoints do we need? Give me the method and the path for each, and I'll write them."
    hints:
      - Start with creating a job; what would its body hold?
      - Then reading it, its status, changing it, cancelling it, and running it now.
