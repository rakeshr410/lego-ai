# Job scheduler interview, requirements: "1. Functional requirements" on the left with the out-of-scope line under it, "Non-functional requirements" on the right, as the video lays them out; every non-functional line with its number.
id: backend/job-scheduler/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "bb7c8a0d4028"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/job-scheduler/end-to-end/problem-statement
  assumes:
    - "A job scheduler runs jobs automatically at set times or intervals."
  carries:
    - "Functional: create and schedule a job (now, later, cron); monitor its status in real time; cancel or update it, even while it runs."
    - "Out of scope: jobs that depend on each other (a DAG)."
    - "Non-functional: 10k jobs a second at peak; availability over consistency; every job runs at least once; a job starts within 2 s of its time."
  terms:
    - term: cron schedule
      means: "A repeating schedule written as a cron expression, such as nine o'clock every Friday."
    - term: at least once
      means: "Every job runs, possibly more than once after a failure; so jobs should be idempotent."
    - term: idempotent
      means: Running it twice leaves the same result as running it once.
board:
  keep: [title, prompt-desc, prompt-use]
  elements:
    - { id: fr, kind: region, label: 1. Functional requirements, at: [4, 5], size: [34, 15], dashed: true }
    - { id: fr-create, kind: note, label: "create and schedule a job, now, later or cron", at: [5, 7], in: fr }
    - { id: fr-monitor, kind: note, label: "monitor a job's status in real time", at: [5, 9], in: fr }
    - { id: fr-cancel, kind: note, label: "cancel or update a job, even while it runs", at: [5, 11], in: fr }
    - { id: fr-scope, kind: note, label: "out of scope, jobs that depend on each other", at: [5, 17], in: fr }
    - { id: nfr, kind: region, label: Non-functional requirements, at: [42, 5], size: [32, 15], dashed: true }
    - { id: nfr-scale, kind: note, label: "scale, 10k jobs a second at peak", at: [43, 7], in: nfr }
    - { id: nfr-cap, kind: note, label: "availability over consistency, eventual", at: [43, 9], in: nfr }
    - { id: nfr-once, kind: note, label: every job runs at least once, at: [43, 11], in: nfr }
    - { id: nfr-latency, kind: note, label: a job starts within 2 s of its time, at: [43, 13], in: nfr }
  arrows: []
