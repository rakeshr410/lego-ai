# Job scheduler interview, low-level design, failures: on the same picture, as in the video, the failed job sent from an executor back to the run queue's retry topic, the topics retry and dead under the queue, the attempt number raised by the consumer service, and the watcher's second query for running jobs silent for 15 s.
id: backend/job-scheduler/end-to-end/lld-failures
title: "Low-level design: retries and dead executors"
source:
  hash: "4fce423d5bca"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/job-scheduler/end-to-end/lld-execution
  assumes:
    - "A watcher queues due jobs on a Kafka run topic; a job consumer hands them to executors."
    - "Executors report status every 10 s through Kafka; the consumer service writes it and moves modifiedTime."
    - "Every job runs at least once."
  carries:
    - "A failed job goes to a retry topic and its attempt number goes up; at maxRetries it goes to a dead topic and is marked failed."
    - "A dead executor reports nothing; the watcher also re-queues runs that are running with modifiedTime older than 15 s."
    - "Both paths can run a job twice, so jobs should be idempotent."
  terms:
    - term: retry topic
      means: The Kafka topic of jobs that failed and will be run again.
    - term: dead topic
      means: "Where a job goes once it has used all its retries; nothing reads it to run it again."
    - term: heartbeat
      means: "The executor's report every 10 s; its absence past 15 s means the executor died."
