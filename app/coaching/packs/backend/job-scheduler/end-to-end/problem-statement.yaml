      means: "Run across many machines, so it can start thousands of jobs a second and survive a machine dying."
board:
  keep: []
  elements:
    - { id: title, kind: note, label: Distributed job scheduler like Airflow or Temporal, at: [27, 0] }
    - { id: prompt-desc, kind: note, label: runs jobs automatically at set times or intervals, at: [8, 2] }
