beats:
  - point: "A job scheduler runs jobs automatically at set times or intervals, for repetitive tasks, scheduled maintenance and batch processing; distributed means on many machines."
    kind: rule
    weight: core
    teach:
      - "Write the title: a distributed job scheduler, like Airflow or Temporal. Under it, what it does: it runs jobs automatically at set times or intervals."
      - "Then what people use it for: repetitive tasks, scheduled maintenance, batch jobs. Clear a staging table every Friday at nine; rebuild an index right now."
      - "Distributed: many machines, because one cannot start thousands of jobs a second, and because the scheduler must keep going when a machine dies."
    draw: [title, prompt-desc, prompt-use]
    check: What does the scheduler need to know about every job?
    answer: "The work to run and when to run it: now, at a set time, or on a repeating schedule."
  - point: "The interview runs in five steps: gather the requirements, identify the core entities, design the API, draw the high-level design, then the low-level design."
    kind: rule
    weight: core
    teach:
      - "Say the plan once: requirements, functional and non-functional; the core entities; the API; a high-level design; then the low-level design, where most of the hour goes."
      - "Said, not written; each step gets its number on the board when we reach it."
    check: Which step comes straight after the requirements?
    answer: Identifying the core entities, then the API.
