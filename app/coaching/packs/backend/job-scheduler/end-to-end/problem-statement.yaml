  assumes: []
  carries:
    - "A job scheduler runs jobs automatically at set times or intervals: repetitive tasks, maintenance, batch jobs."
    - "A job is some work plus when to run it: now, at a time, or on a repeating cron schedule."
    - "The interview runs in five steps: requirements, core entities, API, high-level design, low-level design."
  terms:
    - term: job
      means: "Some work to run (a script, a container, a database task) and when to run it."
