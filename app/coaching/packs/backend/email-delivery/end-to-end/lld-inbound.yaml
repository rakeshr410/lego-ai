beats:
  - point: "Mail from Outlook or Yahoo arrives at an inbound SMTP service, which asks the user service whether the recipient exists and runs the same spam and malware checks."
    kind: component
    weight: core
    teach:
      - "One flow is missing: other providers send mail to our users the same way we send to theirs. An inbound SMTP service accepts those connections."
      - "It asks the user service whether the recipient exists, refusing an unknown address at RCPT TO, and runs the same spam and malware checks before trusting the mail."
    draw: [lld-inbound, i-outside, i-inbound, i-outside-inbound, i-user, i-inbound-user, i-checks]
    check: What must the inbound SMTP service check before accepting an email for one of our users?
    answer: That the recipient exists, via the user service, and that the mail passes the spam and malware checks.
  - point: "It then publishes to the inbound send request topic, and the existing delivery consumer puts the email in the inbox and notifies the recipient."
    kind: flow
    weight: core
    teach:
      - "Then it reuses everything built: publish to Kafka's inbound send request topic, the same one Gmail-to-Gmail mail uses."
      - "The delivery consumer picks it up, writes it into the recipient's inbox and triggers the new-mail alert. Only the front door is new."
    draw: [i-kafka, i-inbound-kafka, i-delivery, i-kafka-delivery]
    check: Why does receiving mail need so little new design?
    answer: After the inbound SMTP service, it reuses the inbound topic and the delivery consumer already built for mail inside our domain.
  - point: "The mailbox items and outbox tables share their columns (user, message, thread, from, to, subject, attachment), the outbox adding a status; the thread ID is what groups replies."
    kind: decision
    weight: core
    teach:
      - "Write the two main tables. Mailbox items: user ID, message ID, thread ID, from, to, subject, has attachment and the attachment's URL."
      - "The outbox holds almost the same, plus a status. And the thread ID on every row is what groups replies into one conversation, our last functional requirement."
    draw: [i-items-1, i-items-2, i-items-3, i-outbox, i-thread]
    check: Which column makes replies show up as one conversation?
    answer: The thread ID stored on every mailbox row.
  - point: "Kafka carries a topic per stage: outbound and internal mail, the SMTP delivery queue, a delay queue for retries, email checks and delivery status."
    kind: component
    weight: supporting
    teach:
      - "And the topics: outbound and internal mail, the SMTP delivery queue for checked mail waiting on a worker, a delay queue for anything to retry later, such as a slow check, the email checks, and delivery status."
    draw: [i-topics-1, i-topics-2]
    check: What is the delay queue for?
    answer: Emails to retry later, such as one waiting on a slow check or a receiving server that did not answer.
  - point: "Close by reading the non-functional list back: scale from many copies and a sharded user DB, availability from asynchronous sending, consistent sign-up from the primary key, durability from the outbox."
    kind: rule
    weight: core
    teach:
      - "Read the requirements on the right back against the board. Scale: every service has many copies behind the gateway, and the user DB is sharded."
      - "Availability: sending is asynchronous through Kafka, and a slow checker holds only its own emails. Consistent sign-up: the email ID is a primary key on its one shard. Durability: every email is saved in the outbox first."
    check: Which part of the design meets the durability requirement?
    answer: The outbox; every email is saved in the outbox table before anything else touches it, so a crash only delays it.
