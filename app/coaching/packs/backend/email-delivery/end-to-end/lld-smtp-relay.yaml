beats:
  - point: "Once the checks pass, the orchestrator checks the recipient's domain: other domains go to the outbound send request topic, our own domain to the inbound send request topic."
    kind: flow
    weight: core
    teach:
      - "The orchestrator has three jobs: consume, validate, and now the domain check. A checked email goes back onto Kafka, ready to deliver."
      - "Recipient at another domain, Outlook or Yahoo: the outbound send request topic. Recipient on Gmail itself: the inbound send request topic. No SMTP needed for those."
    draw: [lld-relay, r-orch, r-orch-jobs, r-kafka, r-orch-kafka, r-topic-out, r-topic-in]
    check: Which topic does a Gmail-to-Gmail email go to after the checks?
    answer: The inbound send request topic, because the recipient is in our own domain.
  - point: "SMTP relay workers consume the outbound topic and hand each email to the recipient domain's mail server, the receiver SMTP."
    kind: component
    weight: core
    teach:
      - "SMTP relay workers consume the outbound topic. Their job: deliver each email to the other provider's mail server."
      - "That server, Outlook's say, is the receiver SMTP, reached on port 25."
    draw: [r-relay, r-kafka-relay, r-receiver, r-relay-receiver]
    check: What do the relay workers consume, and where do they send it?
    answer: The outbound send request topic, and they hand each email to the recipient domain's mail server.
  - point: "To find that server the worker does a DNS MX lookup, dig MX outlook.com, which lists hosts with preference numbers; the lowest is tried first, and the answer is cached for its TTL because MX records change rarely."
    kind: mechanism
    weight: core
    teach:
      - "We do not know where Outlook's mail server is. Ask DNS: dig MX outlook.com. The MX resolver answers with hosts and a number each, 10 and 20. Lower number, higher priority; if it does not answer in time, try the next."
      - "Those records change rarely, so keep the answer in an MX cache for its time to live and skip the lookup next time."
    draw: [r-mx-cache, r-relay-cache, r-mx-resolver, r-relay-resolver, r-steps-head, r-step-dns, r-step-mx, r-mx-ttl, r-mx-order]
    check: The MX answer lists one host at 10 and one at 20. Which do we try first?
    answer: The one at 10; a lower preference number means higher priority, and we fall back to 20 if it does not answer.
    misconceptions:
      - "MX records change daily, so look them up every time -> they change rarely; cache them for their DNS TTL."
  - point: "The conversation opens with a TCP connection on port 25, the receiver's 220 ready, our EHLO, its 250 with extensions, then MAIL FROM with the sender."
    kind: flow
    weight: core
    teach:
      - "Open a TCP connection to that host on port 25. Outlook greets: 220, ready. We say EHLO gmail.com; it answers 250 and the extensions it supports."
      - "Then MAIL FROM, alice at gmail.com, and Outlook says 250 OK."
    draw: [r-step-tcp, r-step-220, r-step-ehlo, r-step-250a, r-step-from, r-step-250b]
    check: What is the first thing the receiving server says after the TCP connection opens?
    answer: 220, that it is ready, before we send EHLO.
  - point: "At RCPT TO the receiving server checks its own directory: 250 if the recipient exists, 550 if not, which our side turns into a bounce to the sender."
    kind: failure
    weight: core
    teach:
      - "Now RCPT TO, bob at outlook.com. Until here we had no idea whether Bob exists; only Outlook knows its users."
      - "It looks him up: 250 recipient OK, or 550 no such user. A 550 is why you get a bounce a few seconds after mailing a wrong address."
    draw: [r-step-rcpt, r-step-check, r-bounce]
    check: Why can't Gmail check whether bob at outlook.com exists before sending?
    answer: Only Outlook knows its own users; it answers at RCPT TO, and a 550 becomes a bounce to the sender.
  - point: "Then DATA, the receiver's 354, the headers, body and attachments MIME encoded, and a final 250 when Outlook accepts the email. SMTP is the protocol for all of it, not a server."
    kind: flow
    weight: supporting
    teach:
      - "We send DATA; Outlook answers 354, start mail input. We stream the headers, body and attachments, MIME encoded, and Outlook answers 250 once it has accepted it."
      - "That whole exchange is SMTP: a protocol, a set of rules, not a server."
    draw: [r-step-data, r-step-354, r-step-body, r-step-done, r-protocol]
    check: What does the final 250 tell our relay worker?
    answer: That Outlook has accepted the email and taken responsibility for delivering it.
