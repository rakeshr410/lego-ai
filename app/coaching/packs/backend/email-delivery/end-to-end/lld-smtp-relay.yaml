# Email delivery interview, deep dive into sending to other domains, as the video draws it: the orchestrator's three jobs, Kafka with its outbound and inbound send request topics, SMTP relay workers with the MX cache and MX resolver above them and the receiver SMTP to the right, then the numbered "Steps to connect SMTP server" (DNS MX lookup, TCP on port 25, 220, EHLO, MAIL FROM, RCPT TO, DATA, 354, 250).
id: backend/email-delivery/end-to-end/lld-smtp-relay
title: "Deep dive: sending to other domains over SMTP"
source:
  hash: "9367e10acee9"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/email-delivery/end-to-end/lld-validation
  assumes:
    - "An orchestrator consumes each email from Kafka and runs the checks, recording them in a validation DB."
    - "Mail to another domain must be handed to that provider's server over SMTP."
  carries:
    - "After the checks the orchestrator routes by the recipient's domain: other domains to the outbound send request topic, our own to the inbound send request topic."
    - "SMTP relay workers consume outbound, find the domain's mail server by an MX lookup (cached for its TTL) and hand the email over by SMTP on port 25."
    - "The receiving server checks the recipient at RCPT TO; an unknown address is refused and becomes a bounce to the sender."
  terms:
    - term: MX record
      means: "A DNS record naming a domain's mail servers, each with a preference number; the lowest is tried first."
    - term: SMTP
      means: "Simple Mail Transfer Protocol, a protocol, not a server: the conversation two mail servers have to hand over an email."
    - term: bounce
      means: A message back to the sender saying the email could not be delivered.
