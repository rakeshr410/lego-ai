  - ids: [r-topic-out, r-topic-in]
    beats: [1]
    question: "The email passed its checks. Some recipients are on Gmail, some on Outlook. How would you split them?"
    hints:
      - Look at the part of the address after the at sign.
      - One stream for each kind of delivery.
  - ids: [r-relay]
    beats: [2]
    question: "Something must take the outbound emails and deliver them to Outlook or Yahoo. What would you put there?"
    hints:
      - Workers that consume the outbound topic.
      - They speak the mail servers' protocol.
  - list: smtp-steps
    beats: [3, 4, 5, 6]
    question: "Walk me through how our worker finds Outlook's mail server and hands it the email, step by step."
    hints:
      - First, where does outlook.com take its mail? Ask DNS.
      - Then a greeting, the sender, the recipient, and the content.
