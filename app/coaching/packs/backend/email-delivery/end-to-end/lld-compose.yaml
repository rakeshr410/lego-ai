# Email delivery interview, deep dive into compose: the compose service saving the draft to the draft DB as the user types, and attachments going to S3 by a signed URL from the client (the video's dashed "signed-url" line), as the video draws it beside the service.
id: backend/email-delivery/end-to-end/lld-compose
title: "Deep dive: compose and drafts"
source:
  hash: "de310d0cb8c9"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/email-delivery/end-to-end/lld-user-service
  assumes:
    - "A compose service saves drafts in a draft DB; attachments are uploaded before the send, which carries only their IDs."
  carries:
    - "The draft (body, to, cc, bcc, attachment links) is saved as the user types, so by send time the email already exists on the server."
    - "Attachments go to an S3 bucket, uploaded by the client directly with a signed URL, in parts; the draft keeps the link."
  terms:
    - term: blob storage
      means: "Storage for large files, such as an S3 bucket, instead of a database."
    - term: multipart upload
      means: A large file sent to blob storage in chunks, each retried on its own.
