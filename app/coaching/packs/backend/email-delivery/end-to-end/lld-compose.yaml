beats:
  - point: "Everything the user types in the compose window is saved as a draft (body, to, cc, bcc, attachment links) in the draft DB, so by the time send is pressed the email already exists on the server."
    kind: mechanism
    weight: core
    teach:
      - "Next, the compose service. Click compose and a window opens; as you type, the service saves what you write as a draft in the draft DB: the body, to, cc, bcc and links to attachments."
      - "Close the window and nothing is lost. And when send is finally pressed, the email is already on the server; sending only has to deliver it."
    draw: [lld-compose, c-client, c-compose, c-client-compose, c-draft, c-compose-draft, c-draft-holds, c-draft-when]
    check: What does pressing send still have to do, if the draft is already saved?
    answer: Only deliver it to the recipients; the content is already stored in the draft DB.
  - point: "Attachments never go into a database: the compose service signs an upload URL and the client uploads the file straight to an S3 bucket, in parts; the draft keeps only the link."
    kind: mechanism
    weight: core
    teach:
      - "Attachments are heavy files: videos, PDFs. They go to blob storage, an S3 bucket, never into the draft DB."
      - "The compose service hands the client a signed URL, and the client uploads straight to the bucket, a big file in parts, so our servers never carry the bytes. The draft keeps the link."
    draw: [c-s3, c-compose-s3, c-client-s3, c-s3-why, c-s3-how]
    check: Why does the client upload the file to S3 itself instead of through our service?
    answer: With a signed URL the bytes go straight to the bucket, so the service never carries large files; it only keeps the link.
    misconceptions:
      - "Store the attachment in the draft row -> large files belong in blob storage; the row keeps a link."
asks:
  - ids: [c-draft]
    beats: [1]
    question: "A user closes the compose window halfway through an email. Where should what they typed be, so nothing is lost?"
    hints:
      - Think of the drafts folder.
      - Saved as they type, on the server.
  - ids: [c-s3]
    beats: [2]
    question: "And a 20 megabyte PDF they attach: where does that go, and how does it get there?"
    hints:
      - Large files do not belong in a database row.
      - Could the client send it somewhere directly?
