# Email delivery interview, deep dive into the user service, under "5. Deep Dive Designing" as in the video: the five cases of the To field, the user cache above the service with what it holds, the user DB with the look-up steps, sharding by email ID with consistent hashing, the primary key and the users table. The video says sharding makes look-ups fast; this pack teaches it is for size and throughput, with an index for the look-up.
