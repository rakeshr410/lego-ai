# Email delivery interview, deep dive into the mail send service: light pre-checks, the draft fetched by ID, a row in the outbox_email table of the mailbox DB, then an outbox consumer publishing to Kafka, laid out as the video grows its picture (Kafka above the outbox consumer, the mailbox DB beside it). The video calls the outbox "highly consistent"; this pack teaches no loss, at least once, with dedupe.
id: backend/email-delivery/end-to-end/lld-outbox
title: "Deep dive: the mail send service and the outbox"
source:
  hash: "dc8ca6a88665"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/email-delivery/end-to-end/lld-compose
  assumes:
    - "The draft is saved in the draft DB before send; attachments are in S3."
    - "Reliable and durable: no sent email may be lost."
  carries:
    - "The mail send service only does light checks, fetches the draft by ID and writes it to the outbox_email table in the mailbox DB."
    - "An outbox consumer reads new outbox rows (change data capture) and publishes them to Kafka; nothing calls SMTP directly."
    - "The outbox means a sent email is never lost; delivery is at least once, so consumers drop message IDs they have seen."
  terms:
    - term: transactional outbox
      means: "Save the message in an outbox table first, and publish it to the broker afterwards, so a crash cannot lose it."
    - term: change data capture
      means: Reading a table's new rows as a stream of events.
