beats:
  - point: "On send, the mail send service does only light checks (file type, format), because thousands of sends a second would back up behind any slow work; the request carries the draft ID and the service fetches the draft."
    kind: mechanism
    weight: core
    teach:
      - "Send is pressed and the request reaches the mail send service. It does only light checks, the file types and the format. Thousands of sends arrive every second; any heavy work here and latency builds up at the very front."
      - "The request does not carry the email, only the draft's ID. The service fetches the content and the attachment links from the draft DB."
    draw: [lld-outbox, o-light, o-request, o-send, o-send-draft]
    check: Why does the mail send service skip the heavy checks?
    answer: It takes thousands of sends a second, so slow work there would back up every send; the heavy checks run later, asynchronously.
  - point: "It writes the email into the outbox_email table of the mailbox DB, the outbox you see for a moment in a mail client before an email moves to sent."
    kind: mechanism
    weight: core
    teach:
      - "Then it saves the email as a row in an outbox table in the mailbox DB: this email has to be sent. That is the outbox you glimpse for a second before an email moves to sent."
      - "The email is still not sent. But it is now durably stored."
    draw: [o-mailbox, o-send-mailbox, o-table]
    check: Where is the email right after the mail send service is done with it?
    answer: In the outbox_email table of the mailbox DB, saved but not yet sent.
  - point: "The mail send service does not call SMTP itself: an outbox consumer reads each new outbox row, by change data capture, and publishes it to Kafka."
    kind: flow
    weight: core
    teach:
      - "In the high-level picture the mail send service called SMTP directly. It does not. An outbox consumer watches the outbox table, change data capture, and each new row becomes an event."
      - "It publishes that event to Kafka, the event stream every later step reads from."
    draw: [o-consumer, o-mailbox-consumer, o-kafka, o-consumer-kafka]
    check: Who puts the email on Kafka, and from where?
    answer: The outbox consumer, which reads the new row from the outbox table and publishes it.
  - point: "This is the outbox pattern: saved first, a sent email is never lost, but it may be published twice after a crash, so every consumer drops a message ID it has already handled."
    kind: decision
    weight: core
    teach:
      - "Why the detour? The email is saved before anything else happens, so a crash anywhere after it only delays it; the consumer just publishes again. That meets our durability line."
      - "It gives at least once, not exactly once: after a crash a row can be published twice. So every consumer downstream checks the message ID and drops one it has seen."
    draw: [o-never-lost, o-dedupe]
    check: The outbox consumer crashes after publishing but before recording it. What happens, and what protects us?
    answer: The row is published again on restart, so the email appears twice on Kafka; consumers drop the duplicate by its message ID.
    misconceptions:
      - "The outbox makes the system strongly consistent -> it makes the email durable and delivered at least once; duplicates are handled by dedupe."
asks:
  - ids: [o-mailbox]
    beats: [2]
    question: "The email must never be lost once send is pressed. Where should the mail send service put it before anything else happens?"
    hints:
      - Think of the folder an email sits in for a second before sent.
      - A table, in a durable database.
  - ids: [o-consumer, o-kafka]
    beats: [3]
    question: "So the email is in the outbox table. How does it get to the rest of the pipeline, without the mail send service calling anyone?"
    hints:
      - Something could watch that table for new rows.
      - And put them on a stream that later steps read.
