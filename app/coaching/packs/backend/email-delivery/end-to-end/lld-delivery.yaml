beats:
  - point: "Mail inside our domain needs no protocol: a delivery consumer reads the inbound topic and copies the email from the outbox table into mailbox items, the sender's sent and the recipient's inbox."
    kind: mechanism
    weight: core
    teach:
      - "Gmail to Gmail: none of the SMTP steps. A delivery consumer listens to the inbound send request topic, nothing else."
      - "It makes one write: copy the email from the outbox table into the mailbox items table. The sender's copy lands in sent, the recipient's in their inbox. The email has left the outbox."
    draw: [lld-delivery, d-kafka, d-consumer, d-kafka-consumer, d-mailbox, d-consumer-mailbox, d-copies]
    check: What does delivering a Gmail-to-Gmail email actually involve?
    answer: A delivery consumer copies it from the outbox table into mailbox items, sent for the sender and inbox for the recipient.
  - point: "For external mail, the relay worker marks the email sent in the mailbox DB once the receiving server answers 250 OK."
    kind: flow
    weight: core
    teach:
      - "Outbound mail ends the same way. When Outlook's server answers the final 250, the relay worker records that and the email moves from the outbox to sent."
    draw: [d-relay, d-relay-mailbox]
    check: When does an email to Outlook move from the outbox to sent?
    answer: When Outlook's server answers the final 250 OK and the relay worker marks it sent.
  - point: "A notification service tells the sender when the spam filter or the policy check blocks an email, and pushes a new-mail alert to the recipient's devices after delivery."
    kind: component
    weight: core
    teach:
      - "If the malware check or the policy check blocks an email, the sender must hear why: a notification service sends them that message."
      - "And when the delivery consumer puts an email in an inbox, the same service pushes a new-mail alert to the recipient's phone or browser."
    draw: [d-filter, d-notify, d-filter-notify, d-consumer-notify, d-device, d-notify-device, d-why]
    check: Name the two kinds of notification in this design.
    answer: A message to the sender when a check blocks their email, and a new-mail alert to the recipient after delivery.
asks:
  - ids: [d-consumer]
    beats: [1]
    question: "A checked Gmail-to-Gmail email is on the inbound topic. What takes it from there into the recipient's inbox?"
    hints:
      - No SMTP is needed inside our own domain.
      - Something consumes the topic and writes to the mailbox DB.
  - ids: [d-notify]
    beats: [3]
    question: "The spam filter blocks an email, or a new one lands in someone's inbox. How do the people involved find out?"
    hints:
      - Both need a message sent to a person, not a service.
      - One service could send both.
