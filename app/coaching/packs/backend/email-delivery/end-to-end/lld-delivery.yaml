# Email delivery interview, deep dive into delivery inside our domain and notifications, as the video draws it: the delivery consumer under Kafka's inbound topic with its long arrow to the mailbox DB (outbox email to mailbox items), the relay's 250 marking external mail sent, and the notification service fed by the checks and by delivery.
