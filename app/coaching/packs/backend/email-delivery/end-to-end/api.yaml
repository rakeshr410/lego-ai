context:
  after: backend/email-delivery/end-to-end/entities
  assumes:
    - "Functional: accounts, compose and send, folders, search, attachments, threads."
    - "The core entities are the user, the email, the thread and the email metadata."
  carries:
    - "POST /v1/accounts/register; POST /v1/emails/send with { to: [], cc: [], bcc: [], subject, body, attachmentIds: [] }; GET /v1/emails/{emailId}; GET /v1/search?q=...&limit=20."
    - "POST /v1/attachments/upload returns an attachment ID and a signed upload URL: files go up first, so the send request stays small."
    - The user always comes from the auth token, never from a parameter.
  terms:
    - term: endpoint
      means: A method and a path the service answers, with what it takes and what it returns.
    - term: signed URL
      means: "A short-lived link that lets the client upload one file straight to blob storage."
