beats:
  - point: "Creating an account is a POST to register; sending is a POST whose body holds to, cc and bcc as arrays, the subject, the body and attachment IDs."
    kind: flow
    weight: core
    teach:
      - "Step three, the API. Ask first whether the interviewer wants it, because it eats time. If yes: creating an account submits data, so a POST to v1 accounts register."
      - "Sending is a POST to v1 emails send. To, cc and bcc are arrays, because one email goes to many people; then subject, body, and the IDs of attachments already uploaded."
    draw: [api, api-register, api-send, api-send-1, api-send-2]
    check: Why are to, cc and bcc arrays?
    answer: Because one email can go to several recipients in each field.
  - point: "Reading is a GET of one email by its unique ID, returning the full email; search is a GET with free text and a limit, returning metadata and snippets."
    kind: flow
    weight: core
    teach:
      - "Opening an email is a GET on its unique ID, a UUID, and returns the whole thing: subject, body, attachment links."
      - "Search is a GET with the free text, q, and a limit of 20, returning metadata and a snippet per match. The user comes from the auth token, not a userId parameter, or anyone could search anyone's mail."
    draw: [api-get, api-search, api-search-1]
    check: Where should the search endpoint get the user from?
    answer: From the authentication token, so a user can only ever search their own mail.
    misconceptions:
      - "Pass userId in the search query -> a caller could name someone else's mailbox; take the user from the token."
  - point: "Attachments are uploaded first in a separate call that returns an attachment ID and a signed URL; the send only carries the ID, so it never becomes a heavy request that times out."
    kind: decision
    weight: core
    teach:
      - "Last, uploading an attachment. Sending a file happens in two steps: upload it first and get back an attachment ID and a signed URL the client puts the file to."
      - "Why? An email body plus a big PDF in one request is a heavy payload that can time out. Split, the send request carries only the ID."
    draw: [api-upload, api-upload-1]
    check: Why is sending an email with an attachment two requests, not one?
    answer: One request with the body and a large file is heavy and can time out; uploading first lets the send carry only the attachment ID.
asks:
  - ids: [api-register, api-send, api-get, api-search, api-upload]
    beats: [1, 2, 3]
    question: "Looking at the requirements, which endpoints do we need? Give me the method and the path, and I'll write them."
    hints:
      - One for each thing a user does, sign up, send, open, search.
      - How would a large attachment get to the server?
