beats:
  - point: "An email platform like Gmail or Outlook lets users reliably send, receive, store, search and manage email across devices, for well over a billion people."
    kind: rule
    weight: core
    teach:
      - "Write the title: an email sending platform, like Gmail or Outlook. Everyone has used one, so do not spend long explaining it."
      - "One line under it: a globally scalable platform to send, receive, store, search and manage email across devices. That line already holds most of the requirements."
    draw: [title, prompt-desc]
    check: In one sentence, what does this platform have to do?
    answer: Let users send, receive, store, search and manage email across their devices, at global scale.
  - point: "The interview runs in five steps: requirements, core entities, API, high-level design, then the deep dive, where most of the time goes."
    kind: rule
    weight: core
    teach:
      - "Say the plan once: requirements first, functional and non-functional, then the core entities, the API, a high-level design, and last the deep dive."
      - "The inbox looks simple, but the deep dive is where the work is: unique sign-ups, never losing a sent email, checking mail without slowing it, and talking to other providers."
      - Said, not written; each step gets its number on the board when we reach it.
    check: Which step gets most of the time, and why?
    answer: The deep dive, because that is where the hard parts are, such as never losing an email and sending to other providers.
