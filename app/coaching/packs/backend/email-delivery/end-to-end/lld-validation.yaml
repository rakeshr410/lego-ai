# Email delivery interview, deep dive into the checks, as the video grows its picture: Kafka feeding the outbox delivery orchestrator, the spam and malware filter and the policy check below it, the validation DB they write to with its columns beside it, and the attachment chain (S3, attachment scanner, S3 validation DB, attachment check service) along the top right.
