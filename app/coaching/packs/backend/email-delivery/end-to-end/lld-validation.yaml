context:
  after: backend/email-delivery/end-to-end/lld-outbox
  assumes:
    - "Each sent email is saved in the outbox table and published to Kafka by the outbox consumer, at least once."
    - "Attachments are uploaded to S3 before the send."
  carries:
    - "An outbox delivery orchestrator consumes each email and runs the spam and malware filter, the policy check and the attachment check in parallel."
    - "Results go into a validation DB row per email (pass, fail, pending), so a slow or down checker holds only its own emails."
    - "Attachments are scanned on upload by a scanner triggered from S3; at send time the attachment check only reads the stored verdict."
  terms:
    - term: orchestrator
      means: A service that drives the steps of a flow, calling the others and tracking where each item is.
    - term: policy check
      means: "An enterprise's own rules on mail, such as no sensitive documents leaving the company."
