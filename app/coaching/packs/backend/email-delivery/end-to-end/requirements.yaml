# Email delivery interview, requirements: "1. Functional requirements" on the left and "Non functional requirements" on the right, as the video lays them out, with the CAP choice made per part (available for mail, consistent at sign-up).
id: backend/email-delivery/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "ed3b49fd24cd"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/email-delivery/end-to-end/problem-statement
  assumes:
    - "An email platform lets users send, receive, store, search and manage email across devices."
  carries:
    - "Functional: create an account; compose and send to one or more recipients; folders (inbox, sent, drafts, spam, trash, custom); search by subject, body, sender; attachments; replies grouped in threads."
    - "Non-functional: 1.8 billion plus users and billions of emails; available over consistent for mail, eventual is fine; strongly consistent at sign-up; reliable and durable."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, scale, availability, durability, ideally with a number."
    - term: eventual consistency
      means: "A sent email may take a moment to show up in the recipient's inbox, but it gets there."
