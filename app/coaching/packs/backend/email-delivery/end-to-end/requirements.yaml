beats:
  - point: "The core functional requirements: a user can create a mailing account, and compose and send email to one or more recipients."
    kind: requirement
    weight: core
    teach:
      - "Step one, on the left: functional requirements, what the system does. First, onboarding: without an account nobody can send or receive anything."
      - "Second, compose and send an email, to one person or to many at once."
    draw: [fr, fr-account, fr-send]
    check: Why is creating an account the first requirement?
    answer: Nobody can send or receive mail until they are onboarded with an address.
  - point: "Then the mailbox: folders (inbox, sent, drafts, spam, trash and custom ones), search by subject, body and sender, attachments, and replies grouped into a conversation."
    kind: requirement
    weight: core
    teach:
      - "Third, view the mail: inbox, sent, drafts, spam, trash, and folders of your own; each email lands in one by its category or status."
      - "Fourth, search by keyword across subject, body and sender. Fifth, attachments: images, documents, PDFs. Sixth, replies are grouped together, so the system keeps threads."
    draw: [fr-folders, fr-search, fr-attach, fr-threads]
    check: Which requirement means the system must store threads?
    answer: Replies grouped together into one conversation.
  - point: "The scale is huge, 1.8 billion plus users and billions of emails, so the system is distributed, a set of services."
    kind: metric
    weight: core
    teach:
      - "On the right, non-functional requirements, the qualities. Ask for the scale: a Gmail-sized service has well over a billion users, say 1.8 billion plus, and billions of emails."
      - "At that size one server is out of the question: it is a distributed system of services."
    draw: [nfr, nfr-scale]
    check: What does a scale of over a billion users tell you about the design?
    answer: It has to be distributed, many services and many copies of each, not one server.
  - point: "CAP is chosen per part: sending mail stays available and may be eventually consistent, but sign-up must be strongly consistent so no two users share an email ID."
    kind: decision
    weight: core
    teach:
      - "CAP is a choice made when the network between replicas splits: answer anyway, or wait until the copies agree. For mail, stay available: an email arriving a minute late harms nobody, an outage does."
      - "Sign-up is different. If two replicas could each accept the same new address during a split, two people would own one email ID. So sign-up chooses consistency."
    draw: [nfr-available, nfr-signup]
    check: Why is sign-up treated differently from sending mail?
    answer: Two users must never get one email ID, so sign-up must be consistent; a late email is harmless, so sending favours availability.
    misconceptions:
      - "A system is either available or consistent as a whole -> the choice is made per part, and only matters during a partition."
  - point: "Reliable and durable: once an email is sent it is never lost. Keep the list to what shapes the design; requirements fit inside a 45 to 50 minute interview."
    kind: requirement
    weight: supporting
    teach:
      - "Last, reliability and durability: an email that was sent is never lost or deleted on its own."
      - "You could add encryption or a latency target, but in 45 to 50 minutes keep to what changes the design, and move on."
    draw: [nfr-durable]
    check: Which requirement will force us to save an email before doing anything else with it?
    answer: Reliability and durability, no sent email may be lost.
asks:
  - list: fr-list
    beats: [1, 2]
    question: "So what should this email platform let a user do? Tell me the features one at a time, and I'll write them down."
    hints:
      - What does a new user need before anything else?
      - And once mail arrives, how do they find, organise and reply to it?
  - list: nfr-list
    beats: [3, 4, 5]
    question: "Now the qualities. How big is it, and what matters when machines fail?"
    hints:
      - Think about how many people use Gmail.
      - Is it worse for an email to arrive late, or for two people to get the same address?
