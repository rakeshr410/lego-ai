beats:
  - point: "At 500 million daily users the backend is many services, so clients reach one API gateway and load balancer that authenticates, rate limits and routes, round robin."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design. On the left the users, mobile apps or browsers."
      - "With 500 million daily users this is a distributed, service-based backend, so everything enters through an API gateway and load balancer: the gateway authenticates and authorizes, rate limits and routes by path; the load balancer spreads each service's traffic round robin."
    draw: [hld, h-clients, h-gateway, h-clients-gw, h-gw-note]
    check: What does the gateway do before a request reaches a service?
    answer: "Authenticates and authorizes it, rate limits it, and routes it to the right service, spread round robin."
  - point: "The user service handles onboarding and keeps accounts in a user DB."
    kind: component
    weight: core
    teach:
      - "First requirement, onboarding: a user service. The gateway routes register and login to it, and it saves the user in a user DB."
      - "How it stores them, the schema and the database, is for the low-level design."
    draw: [h-user, h-gw-user, h-user-db, h-user-userdb]
    check: Which service and store handle sign-up?
    answer: The user service, saving to the user DB.
  - point: "The content service stores a post's text and metadata in a post DB and its image or video in S3, since large files belong in blob storage."
    kind: component
    weight: core
    teach:
      - "Second, posting: a content service handles every kind of content. Text and metadata go to a post DB."
      - "An image or a video is a large file, so it goes to blob storage, an S3 bucket, and the post keeps its URL. Two arrows from the content service."
    draw: [h-content, h-gw-content, h-post-db, h-content-postdb, h-s3, h-content-s3]
    check: Why not keep the video in the post database?
    answer: Large media belongs in cheap blob storage like S3; the post row keeps only its URL.
  - point: "The follower service keeps a follower DB; the feed service reads the user's followees from it, then their posts from the post DB, and merges them."
    kind: flow
    weight: core
    teach:
      - "Third, the feed service, the most important. When the user opens the app, it needs who they follow, so a follower service with its follower DB."
      - "The feed service reads the followees from the follower DB, then their posts from the post DB, merges them and returns them. That is the idea; at this scale it is far from this simple, as the low-level design shows."
    draw: [h-feed, h-gw-feed, h-follower, h-gw-follower, h-follower-db, h-follower-db-arrow, h-feed-followerdb, h-feed-postdb]
    check: Walk me through building a feed in this first design.
    answer: The feed service reads the user's followees from the follower DB, then their posts from the post DB, and merges them.
  - point: "One engagement service records likes and comments in a like DB and a comment DB; in production they would likely be two services."
    kind: component
    weight: supporting
    teach:
      - "Last, likes and comments: one engagement service, writing to a comment DB and a like DB."
      - "In a real system they would likely be separate services. Every functional requirement now has its box."
    draw: [h-engage, h-gw-engage, h-comment-db, h-engage-comment, h-like-db, h-engage-like]
    check: Which stores does the engagement service write to?
    answer: The comment DB and the like DB.
asks:
  - ids: [h-gateway]
    beats: [1]
    question: "Five hundred million users, many services. What sits between the clients and the services?"
    hints:
      - Something has to check who is calling and send each request to the right place.
      - And spread the load across many servers.
  - ids: [h-user, h-content, h-feed, h-follower, h-engage]
    beats: [2, 3, 4, 5]
    question: "Now the services. Looking at the five requirements, what services would you draw behind the gateway?"
    hints:
      - Roughly one service per requirement.
      - Who handles posting, who handles who follows whom, who builds the feed?
task:
  prompt: "Draw the high-level design: clients, the API gateway and load balancer, the user, content, feed, follower and engagement services with their stores, and the feed service reading the follower DB and the post DB."
  expects: [1, 2, 3, 4, 5]
