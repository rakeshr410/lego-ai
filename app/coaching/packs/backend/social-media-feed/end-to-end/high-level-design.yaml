    - "Functional: sign up and log in, create posts, follow, like and comment, see a feed."
    - "500M daily active users, so the backend is distributed."
  carries:
    - "Clients reach an API gateway and load balancer (authentication, routing, rate limiting, round robin) in front of five services."
    - "User service and user DB; content service writing text to a post DB and media to S3; follower service and follower DB; engagement service with comment and like DBs."
    - "The feed service reads the user's followees from the follower DB, then their posts from the post DB, and merges them at read time."
  terms:
    - term: API gateway
      means: "The single entry point that authenticates, rate limits and routes each request to its service."
    - term: blob storage
      means: "Storage for large files such as images and videos (S3), referenced by URL."
