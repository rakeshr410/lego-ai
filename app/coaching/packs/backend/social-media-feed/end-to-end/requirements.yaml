# Social media interview, requirements: "1. Functional requirements" on the left, five lines, and "Non-functional requirements" on the right, three lines, under the title, as the video lays them out.
id: backend/social-media-feed/end-to-end/requirements
title: Five features, three qualities
source:
  hash: "08c6fa3c3f7e"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/social-media-feed/end-to-end/problem-statement
  assumes:
    - "A social platform lets users share posts with friends and followers and see a feed."
  carries:
    - "Functional: sign up and log in; create and share posts (text, image, video); follow each other; like and comment; see a feed of posts from the people you follow."
    - "Out of scope: stories, reels, messaging."
    - "Non-functional: 500M daily active users; availability over consistency, eventual is fine; about 500 ms to upload a post."
  terms:
    - term: functional requirement
      means: What the system does.
    - term: non-functional requirement
      means: "A quality of the system, with a number and where it applies."
    - term: eventual consistency
      means: "A new post may reach followers a little later, but it gets there."
