beats:
  - point: "A platform like Facebook or Instagram lets users share text, photos and videos with friends and followers; everyone knows it, so say it in one line and move on."
    kind: rule
    weight: core
    teach:
      - "Write the title: a social media platform like Facebook or Instagram. Under it one line: users share photos and videos with their friends and followers."
      - "The interviewer knows you know the product, so do not spend minutes describing it. One sentence, then the requirements."
    draw: [title, prompt-desc]
    check: In one sentence, what does this platform let a user do?
    answer: Share text, photos and videos with friends and followers, and see what the people they follow post.
  - point: "Five steps, each numbered on the board when reached: requirements, core entities, API, high-level design, low-level design, with most of the low-level time on the feed."
    kind: rule
    weight: core
    teach:
      - "Say the plan once: requirements, functional and non-functional; core entities; the API; a high-level design; then the low-level design."
      - "Most of this system is ordinary services and tables. The hard part is the feed at this scale, so settle the rest quickly and save time for it."
      - Said, not written; each step gets its number on the board as we reach it.
    check: Which part of this design deserves most of the low-level time?
    answer: Generating each user's feed at scale.
