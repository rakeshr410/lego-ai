# Social media interview, low-level design, the content service: the high-level picture copied down under "5. Low-level design" (gateway, the settled user service), then the content service rebuilt as in the video: Kafka with raw, filtered and blocked topics, a moderator above it, a post consumer to its right writing to the post DB (Cassandra, schema beside it) and S3, and a notification service for blocked posts.
