beats:
  - point: "Building the feed on open, followees from the follower DB then their posts from the post DB, is far too slow with thousands of followees, so feeds must be precomputed."
    kind: failure
    weight: core
    teach:
      - "Now the feed service. The first design built a feed on open: fetch, say, 10,000 followees, then each one's posts, then merge them. Across two services' stores that is not one join, it is thousands of reads while the screen hangs."
      - "So the feed must be ready before the user opens the app: precomputed."
    draw: [feed-svc, gw-feed]
    check: Why not build the feed when the user opens the app?
    answer: Fetching thousands of followees' posts and merging them per open is far too slow; the work has to happen beforehand.
    misconceptions:
      - "One SQL join between follows and posts solves it -> the two tables live in different services' stores, and even one join over 10,000 followees per open is too slow."
  - point: "Feeds are generated by fan-out: push (fan-out on write) for authors with a small circle, pull (fan-out on read) for celebrities, since one post to a million followers would be a million writes."
    kind: decision
    weight: core
    teach:
      - "The pattern is the fan-out model, two ways. Push, fan-out on write: when I post with about a thousand followers, the post is written into each of their feeds now, so it is there when they open the app."
      - "Pull, fan-out on read, for celebrities: one post to a million followers would be a million writes, so nothing is written; followers get it when their feed is built."
    draw: [fanout-head, fanout-push, fanout-pull, fanout-ratio]
    check: Why are celebrity posts pulled rather than pushed?
    answer: Pushing one post to a million followers is a million writes; pulling costs nothing at post time.
  - point: "The feed service reads precomputed feeds from a feed cache in front of a feed DB."
    kind: component
    weight: core
    teach:
      - "If feeds are precomputed, they are stored: a feed DB holding each user's feed."
      - "Reading a database on every open is still slow, so put a feed cache in front. The feed service reads the cache, and only a miss goes to the feed DB."
    draw: [feed-cache, feed-db, feed-cache-read, cache-db]
    check: Where does the feed service read a feed from?
    answer: The feed cache, falling back to the feed DB on a miss.
  - point: "A fan-out service consumes filtered posts; for an author who is not a celebrity, it reads the author's followers and writes the post id with their ids to a second Kafka topic."
    kind: mechanism
    weight: core
    teach:
      - "Who fills it? A fan-out service, a second consumer of filtered post. It only acts when the author is not a celebrity: that is the push."
      - "It reads who follows the author from the follower DB and writes one entry to another Kafka topic: this post, and the list of follower IDs whose feeds should get it."
    draw: [fanout-svc, kafka-fanout-svc, fanout-followers, kafka-fanout, fanout-kafka, fanout-entry]
    check: What does the fan-out service write, and for which authors?
    answer: An entry of the post id and the follower ids, for authors who are not celebrities.
  - point: "A fan-out consumer reads each entry, fetches the post from the post DB, and writes it into every listed follower's feed DB row and feed cache."
    kind: flow
    weight: core
    teach:
      - "A fan-out consumer reads those entries. For each it fetches the post's data from the post DB."
      - "Then it writes the post into the feed DB and the feed cache of every follower listed. When my friend opens the app, the feed is waiting in the cache."
    draw: [fanout-consumer, kafka-fanout-consumer, consumer-read-post, consumer-feed-db, consumer-feed-cache]
    check: Walk me from my new post to it being in my friend's cache.
    answer: "Filtered post, fan-out service reads my followers and writes an entry to Kafka, the fan-out consumer reads the post and writes it into each follower's feed DB and cache."
  - point: "The cache keeps only the newest 50 to 100 posts per user, capped by trimming each list; when a reader scrolls past them, the feed service calls a backfill service for more."
    kind: mechanism
    weight: core
    teach:
      - "The cache cannot hold everything, so each user gets the newest 50 to 100 posts. Cap the list by trimming it after each insert; a TTL only lets idle users' feeds expire, it does not bound a busy one."
      - "When the app sees the reader is nearly through those, the feed service calls a backfill service to build the next part of the feed in near real time, so scrolling never ends."
    draw: [feed-cap, backfill, feed-backfill]
    check: How is the cache kept to 100 posts per user, and what happens after the 100th?
    answer: Each list is trimmed to the newest entries after an insert; past them, the feed service asks the backfill service for more.
    misconceptions:
      - "A TTL keeps the feed cache small -> a TTL only expires feeds nobody reads; trimming each list bounds an active user's."
  - point: "A post materializer keeps each author's 100 latest posts in Redis; backfill reads the reader's followees, takes their latest posts from Redis, and writes user id plus post ids to Kafka for the fan-out consumer. Celebrity posts arrive this way."
    kind: mechanism
    weight: core
    teach:
      - "Near real time needs precomputed inputs too. A post materializer, a third consumer of filtered post, keeps each author's recent activity, their latest 100 posts, in a Redis cache."
      - "Backfill reads the reader's followees, fetches their latest posts from Redis instead of scanning the post DB, and writes an entry to the fan-out topic: this user, these post IDs. The fan-out consumer fills the cache. A celebrity's posts are never pushed; backfill pulls them in this way."
    draw: [materializer, kafka-materializer, redis-latest, materializer-redis, redis-note, backfill-redis, backfill-followers, backfill-kafka]
    check: Why can backfill build a feed in near real time?
    answer: It reads each followee's latest posts from Redis, kept by the post materializer, instead of scanning the post DB.
  - point: "People mostly see posts from the 100 or 200 accounts they interact with most, so a followers cache keeps each reader's top followees, and backfill makes two cache reads; fan-out still reads every follower of the author."
    kind: decision
    weight: supporting
    teach:
      - "One more optimization. With thousands of followees, people mostly see posts from the 100 or 200 they interact with most. A followers cache keeps each reader's top followees, ranked by interaction, a model can keep it updated."
      - "Backfill now makes two cache reads, top followees and their latest posts. Fan-out asks the other question, who follows this author, and needs all of them, or at least the active ones, so it keeps reading the follower table."
    draw: [followers-cache, followerdb-cache, backfill-followers-cache, followers-note]
    check: What does the followers cache hold, and who reads it?
    answer: Each reader's top followees, the accounts they interact with most; the backfill service reads it.
    misconceptions:
      - "The fan-out can push only to a reader's top followees -> fan-out needs the author's followers, the opposite direction, so it reads the follower table."
