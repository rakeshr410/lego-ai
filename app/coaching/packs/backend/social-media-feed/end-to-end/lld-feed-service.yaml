# Social media interview, low-level design, the feed service: the band between the content pipeline and the follower service, as the video draws it: the feed service reading a feed cache over a feed DB, a push fan-out service off the post topics writing post and follower ids to a second Kafka, a fan-out consumer filling feeds, the fan-out notes on the right, then a backfill service fed by a post materializer's Redis of latest posts, and a followers cache. Corrected: the cache is capped by trimming, not a TTL, and fan-out keeps reading every follower from the follower DB.
