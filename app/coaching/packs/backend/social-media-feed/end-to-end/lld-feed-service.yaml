    - "Filtered posts flow through Kafka topic filtered_post and are stored in the post DB."
    - "The follower table is indexed both ways: who a user follows, who follows an author."
    - "Kafka buffers work for consumers that run at their own pace."
  carries:
    - "Feeds are precomputed: merging thousands of followees' posts on every open is too slow."
