beats:
  - point: "The user service registers users and checks logins; when the credentials match it returns a JWT, which the client sends to every other service."
    kind: mechanism
    weight: core
    teach:
      - "Step five, the low-level design. Copy the high-level picture down and open each service, simplest first: the user service."
      - "On sign-up it stores the user's details. On login it checks the credentials and, if they match, returns a JWT, a signed token the client sends with every request so the other services can trust it."
    draw: [lld-user, u-svc, u-jwt]
    check: What does a successful login return, and why?
    answer: A JWT, a signed token the client sends with later requests so services can verify the caller themselves.
  - point: "User data is flat, so PostgreSQL holds it: user ID, username, email, password hash, phone, profile URL and counts; the password is a salted hash, never stored as typed."
    kind: decision
    weight: core
    teach:
      - "The data is flat metadata, so a relational database is plenty: Postgres, easy to scale with replicas later."
      - "The table: user ID, username, email, the password, phone, profile picture URL, follower and friend counts. Store the password as a salted hash from a slow function like bcrypt, never as typed."
    draw: [u-db, u-svc-db, u-schema-1, u-schema-2]
    check: How should the password be stored?
    answer: As a salted hash from a slow password hash such as bcrypt, never as typed.
    misconceptions:
      - "Encrypt the password so it can be checked -> hash it; nothing should be able to recover it, and login compares hashes."
asks:
  - ids: [u-db]
    beats: [2]
    question: "What database would you put the users in, and what goes in the table?"
    hints:
      - Is user data relational and flat, or something more exotic?
      - Think of what sign-up and the profile page need.
