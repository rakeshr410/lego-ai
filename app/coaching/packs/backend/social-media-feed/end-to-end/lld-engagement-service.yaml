beats:
  - point: "Likes and comments arrive at millions a second, more than any server writes directly, so they go to a Kafka topic first."
    kind: mechanism
    weight: core
    teach:
      - "The engagement service. At any moment there are millions of likes and comments, and no server, however replicated, can write them straight in."
      - "When the volume is huge, use publish and subscribe: put a Kafka broker in front, holding every like and comment in a buffer."
    draw: [kafka-engage, gw-kafka-engage]
    check: Why put Kafka in front of the engagement service?
    answer: Millions of events a second would overwhelm direct writes; Kafka buffers them durably so none are lost.
  - point: "The engagement service consumes the likes and comments at its own pace and writes them to the comment DB and the like DB."
    kind: flow
    weight: core
    teach:
      - "The engagement service consumes from Kafka and registers each event in its store: comments in the comment DB, likes in the like DB."
      - "Here one service does both; it could as easily be two, one for comments and one for likes and shares."
    draw: [engage-svc, kafka-engage-svc, comment-db, engage-comment, like-db, engage-like]
    check: Where does a like go after Kafka?
    answer: The engagement service consumes it and writes it to the like DB.
  - point: "Comments live in Cassandra (comment ID, post ID, user, text, like count), being write heavy; likes in Postgres, one row per reaction on a post or a comment."
    kind: decision
    weight: core
    teach:
      - "The comment table: comment ID, post ID, the user, the text and a like count. Comments are write heavy, so Cassandra again."
      - "The like table in Postgres: a like ID, the target, which is a post or a comment, the user, and the reaction type, a like or a heart."
    draw: [comment-schema-1, comment-schema-2, like-schema-1, like-schema-2]
    check: What can a like point at?
    answer: Either a post or a comment, recorded as its target, with the reaction type.
  - point: "Kafka delivers at least once, so an event can arrive twice after a crash; a like is unique per user and target, and a replay changes nothing."
    kind: failure
    weight: core
    teach:
      - "Kafka does not lose a like if the consumer commits only after writing. That is at-least-once delivery: after a crash the same like can be delivered again."
      - "So make the write idempotent: one like per user and target, enforced by a unique key, and a replayed like changes nothing."
    draw: [like-unique]
    check: A consumer crashes and Kafka redelivers a like. How does the count stay right?
    answer: The like is unique per user and target, so the second insert changes nothing.
    misconceptions:
      - "Kafka guarantees each event is processed exactly once -> by default it is at least once; the writes must tolerate duplicates."
  - point: "Counting like rows on every read is slow, so a separate job sums likes into the like_count kept on the comment and the post."
    kind: mechanism
    weight: supporting
    teach:
      - "A popular comment can have thousands of likes. Counting rows on every read is slow, so the comment carries an aggregated like count."
      - "A separate job reads the like table and keeps those counts up to date."
    draw: [like-job]
    check: Where does like_count come from?
    answer: A separate job aggregates the like rows into it.
