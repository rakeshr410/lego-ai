# Social media interview, low-level design, the engagement service: at the bottom, as in the video, a Kafka broker in front of the engagement service, which writes to a comment DB (Cassandra) and a like DB (Postgres) with their schemas beside them, and a job that sums likes. The video says Kafka guarantees delivery; it is at least once, so likes are unique per user and target.
