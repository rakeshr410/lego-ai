  after: backend/social-media-feed/end-to-end/lld-follower-service
  assumes:
    - "One engagement service records likes and comments in a like DB and a comment DB."
    - "Kafka is a durable buffer that consumers read at their own pace."
  carries:
    - "Likes and comments go through Kafka first; the engagement service consumes them and writes the stores."
    - "Comments in Cassandra, likes in Postgres with a reaction type; a job sums likes into like_count."
