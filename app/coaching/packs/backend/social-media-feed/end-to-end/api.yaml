beats:
  - point: "User onboarding takes four endpoints: POST register, POST login, and GET and PUT on the user's profile."
    kind: flow
    weight: core
    teach:
      - "Step three, the API. Group it by requirement. First, onboarding: registering submits name, email and the rest, so a POST to users register. Logging in submits credentials, another POST."
      - "Then reading a profile, a GET on the user's profile, and editing it, a PUT. Cover photo and profile picture endpoints exist too; leave them out and say so. One requirement, four endpoints."
    draw: [api, api-user-head, api-register, api-login, api-profile-get, api-profile-put]
    check: Why is register a POST and editing a profile a PUT?
    answer: Register creates something new on the server; the profile edit replaces existing data.
  - point: "Posts get create, read, edit and delete: POST, GET, PUT and DELETE on posts."
    kind: flow
    weight: core
    teach:
      - "Second group, posts. Creating is a POST to posts. Reading one is a GET by its ID, which brings back the description, the like count and the comments."
      - "Editing is a PUT, removing is a DELETE."
    draw: [api-post-head, api-post-create, api-post-get, api-post-put, api-post-delete]
    check: What does the GET on a single post return?
    answer: "The post with its metadata: description, media, like count and comments."
  - point: "The feed and a user's own posts are huge lists, so both are paginated, 30 to 50 posts at a time, with a cursor rather than an offset."
    kind: decision
    weight: core
    teach:
      - "The most important endpoint: the feed, a GET with a limit. Someone with thousands of friends has a huge pool of posts, so the app loads 30 to 50 and asks for the next page as you scroll."
      - "Use a cursor, the position of the last post seen, not an offset: new posts keep arriving at the top, and an offset would shift and repeat or skip posts. A user's own posts, by user ID, are paginated the same way."
    draw: [api-feed, api-user-posts]
    check: Why paginate the feed with a cursor rather than an offset?
    answer: New posts arrive at the top while the user scrolls, so an offset shifts and repeats or skips posts; a cursor marks the last one seen.
    misconceptions:
      - "Load the whole feed at once so scrolling is smooth -> thousands of posts would make the first load slow; pages of 30 to 50 load fast."
  - point: "Interaction: like and unlike, comments (add, read, edit, delete), follow and unfollow; unliking and unfollowing are DELETEs on the like and the follow."
    kind: flow
    weight: core
    teach:
      - "Third group, interaction. A POST likes a post, and unliking is a DELETE on that same like; keep the path a resource and let the method say the action."
      - "Comments get a POST, a GET for a post's comments, and PUT and DELETE on a comment. Following is a POST on the user, unfollowing a DELETE."
    draw: [api-int-head, api-like, api-unlike, api-comment, api-comments-get, api-comment-put, api-comment-delete, api-follow, api-unfollow]
    check: How do you write unliking a post?
    answer: A DELETE on the post's like, not a separate unlike path.
    misconceptions:
      - "Unlike needs its own POST /unlike path -> the like is the resource; removing it is a DELETE on it."
