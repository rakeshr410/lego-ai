# Distributed logging interview, API: "3. API design" beside the entities. First the video's drawing of how a log leaves a service (Log4j, stdout and stderr, a file on the node, the Fluent Bit agent, the platform), then the endpoints in its four groups as code lines: agent, API ingestion, file ingestion, search. The video says kubectl writes the node file and calls Fluent Bit Splunk's agent; the pack says the container runtime and names Fluent Bit as one agent among several.
