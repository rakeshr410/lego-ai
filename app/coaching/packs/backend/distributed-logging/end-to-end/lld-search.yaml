# Distributed logging interview, deep dive, search: on the same picture, the search service at the bottom of the column with Elasticsearch beside it ("14 days"), Flink writing to it as well as to Cassandra instead of a CDC pipeline, older searches going to the log DB, and the three Cassandra tables written beside the log DB as the video does.
