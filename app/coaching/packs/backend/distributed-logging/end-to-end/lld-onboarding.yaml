beats:
  - point: "On the client side, two pieces send logs: an agent for real-time upload, such as Fluent Bit, OpenTelemetry or our own, and a file uploader for offline batches."
    kind: component
    weight: core
    teach:
      - "Step five, the deep dive. Copy the high-level design down and start on the left, with the client. Two pieces run there: an agent for real-time upload, Fluent Bit, an OpenTelemetry collector, or an agent of our own."
      - "And a file uploader for the offline, batch path. How the agent is built is out of scope; just tell the interviewer it is needed."
    draw: [lld-ob, ob-agent, ob-file, ob-clients]
    check: What are the two ways logs leave a client machine?
    answer: An agent streaming them in near real time, and a file uploader sending offline batches.
  - point: "The API gateway authenticates and authorizes, rate-limits and routes; the load balancer spreads requests round robin."
    kind: component
    weight: core
    teach:
      - "Requests reach the load balancer and API gateway. The gateway's duties: authentication and authorization, rate limiting, and routing by path."
      - "The load balancer uses round robin. Write the duties beside it."
    draw: [ob-gw, ob-clients-gw, ob-gw-1, ob-gw-2]
    check: Name the gateway's three jobs here.
    answer: Authentication and authorization, rate limiting, and routing.
  - point: "An organisation onboards once, not each service: it registers and gets a client ID and a token that all its services use, checked at the gateway."
    kind: mechanism
    weight: core
    teach:
      - "Onboarding is done by the organisation, once. Say a large retailer signs up: it registers, and we return a client ID and a token."
      - "Every one of its hundreds of services sends logs with those two, and the gateway checks them at the very edge. Nobody registers service by service."
    draw: [ob-svc, ob-gw-svc, ob-response]
    check: An organisation with 300 microservices joins. How many times does it onboard?
    answer: Once, as an organisation; all its services send the same client ID and token.
    misconceptions:
      - "Each microservice registers itself -> the organisation onboards once and its services share the credentials."
  - point: "The client DB is PostgreSQL, since the data is small and flat: client ID, name, token, token TTL, environment and metadata; tokens expire and renew, one per environment."
    kind: decision
    weight: core
    teach:
      - "What we keep is small, flat and relational, so PostgreSQL. Columns: client ID, client name, token, token TTL, environment, metadata."
      - "The TTL because a token that never expires is dangerous if stolen; when it expires a renew flow issues a new one. And one token per environment, dev, QA, staging and production, so a test service never writes into production's logs."
    draw: [ob-db, ob-svc-db, ob-schema-1, ob-schema-2, ob-ttl, ob-env]
    check: Why does each token carry a TTL?
    answer: So a stolen token stops working; expiry plus a renew flow limits how long a leak is useful.
asks:
  - ids: [ob-gw-1]
    beats: [2]
    question: "Every request now passes the API gateway. What would you have it do?"
    hints:
      - Who is calling, and are they allowed?
      - And how fast may they call, and where does the request go?
  - ids: [ob-svc, ob-response]
    beats: [3]
    question: "How would a client get onboarded, so its agents may send us logs? Who registers, and what do they get back?"
    hints:
      - Think of an organisation with hundreds of services.
      - What could every one of those services send to prove who it is?
  - ids: [ob-db]
    beats: [4]
    question: "Where would you keep the clients and their tokens, and what columns would you need?"
    hints:
      - The data is small and flat. What kind of database fits?
      - What would you need besides the token itself?
