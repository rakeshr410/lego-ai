# Distributed logging interview, requirements: "1. Functional requirements" on the left and "Non-functional requirements" on the right, under the title, as the video lays them out.
id: backend/distributed-logging/end-to-end/requirements
title: Two lists, functional and non-functional
source:
  hash: "0508a217d01f"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: backend/distributed-logging/end-to-end/problem-statement
  assumes:
    - "A logging platform collects logs from many services into one searchable place."
  carries:
    - "Functional: ingest from many sources; real-time streaming and batch; validate, parse and normalize; search in a dashboard in near real time."
    - "Non-functional: millions of events per hour; near real time; availability over consistency for ingestion; no data loss within a 30 to 45 day retention."
  terms:
    - term: batch ingestion
      means: "Logs kept on an offline device and uploaded together when it reconnects."
    - term: normalize
      means: Turn each client's own log format into the platform's one standard structure.
