# Distributed logging interview, deep dive, retention: on the same picture, the cron service beside the log DB ("delete older than 45 days") and S3 below Flink as cold storage, then the three lifetimes in one line, as the video adds them. The video calls the S3 copy a soft delete and says Splunk keeps 45 days; the pack calls it an archive and says Splunk's retention is set per index.
