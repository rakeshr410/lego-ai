  assumes:
    - "Flink writes every clean log to Cassandra and to Elasticsearch, which keeps 14 days."
    - "Non-functional: no data loss within a stated retention."
  carries:
    - "Cassandra keeps 45 days; a daily cron deletes older rows (a TTL per row does the same)."
    - "Flink also writes every log to S3, the cheapest copy, so retention can be extended later."
    - "Three lifetimes: Elasticsearch 14 days, Cassandra 45 days, S3 long term."
  terms:
