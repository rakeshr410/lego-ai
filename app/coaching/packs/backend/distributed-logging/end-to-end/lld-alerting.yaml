# Distributed logging interview, deep dive, alerting and finishing: the video's follow-up on the same picture: alert_topic under Kafka, the alert service above Kafka with the alert preference DB beside it, the notification service at the top right with its channels and an arrow to the client DB for the new pref column; then the live tail written under the picture, and the requirements read back.
