beats:
  - point: "Clients send everything through a load balancer and an API gateway, because each module is a microservice that scales on its own."
    kind: component
    weight: core
    teach:
      - "Step four, the high-level design, and it is small. On the left the clients, the services and devices our logs come from."
      - "At millions of events an hour each module must scale on its own, so these are microservices, and microservices sit behind a load balancer and an API gateway that routes each path to its service."
    draw: [hld, hld-clients, hld-gw, hld-clients-gw]
    check: Why does a microservice design need the gateway in front?
    answer: One entry point that routes each path to the right service, and checks and limits callers, while the services scale independently.
  - point: "A client onboarding service registers each client first, and keeps it in a client DB; without it no agent may send logs."
    kind: component
    weight: core
    teach:
      - "The first service: client onboarding. The agent cannot send anything until its client is known and trusted, so onboarding comes first."
      - "What it records goes in a client DB. Which database and which columns, we decide in the deep dive."
    draw: [hld-onboard, hld-gw-onboard, hld-clientdb, hld-onboard-db]
    check: Why does onboarding come before any log is accepted?
    answer: The agent's requests must be authenticated as a known client before the platform takes its logs.
  - point: "The ingestion service takes the agents' logs, normalizes them and writes them to a log DB."
    kind: component
    weight: core
    teach:
      - "Next, the most important one: the ingestion service. Agents post their logs, and it validates, parses and normalizes them."
      - "Then it writes the final form to a log DB that holds every log we get."
    draw: [hld-ingest, hld-gw-ingest, hld-logdb, hld-ingest-db]
    check: Walk me through a log from the agent to storage in this design.
    answer: The agent posts it through the gateway to the ingestion service, which normalizes it and writes it to the log DB.
  - point: "The dashboard is a search service reading the same log DB: a search bar that returns matching logs."
    kind: component
    weight: core
    teach:
      - "Last, the dashboard. Open Splunk and there is a search bar: type, and matching logs come back. So the dashboard is a search service."
      - "It reads from the same log DB the ingestion service writes to. That meets every functional requirement."
    draw: [hld-search, hld-gw-search, hld-search-db]
    check: Where does the search service read from?
    answer: The log DB that the ingestion service writes to.
  - point: "The weak box is the ingestion service: both kinds of traffic, every processing step and every write at millions an hour; the deep dive splits it."
    kind: failure
    weight: supporting
    teach:
      - "Name the problem before moving on. The ingestion service takes real-time and batch traffic, validates, parses, normalizes and writes, all at millions of events an hour. One service doing all that is a bottleneck that will crash."
    check: Which box will break first, and why?
    answer: The ingestion service, because it does every step and every write for all the traffic.
asks:
  - ids: [hld-onboard, hld-ingest, hld-search]
    beats: [2, 3, 4]
    question: "Behind the gateway, what services do we need to meet the four requirements? Name them and I'll draw them."
    hints:
      - Before an agent sends anything, someone must know who the client is.
      - Then logs have to come in, and people have to read them.
task:
  prompt: "Draw the high-level design: clients, a load balancer and API gateway, a client onboarding service with its client DB, and an ingestion service and a search service sharing one log DB."
  expects: [1, 2, 3, 4]
