beats:
  - point: The browser's scroll anchoring keeps ordinary pages steady, but it backs off for the way a virtual list moves its rows, so the list turns it off with overflow-anchor none and anchors by hand.
    kind: mechanism
    weight: core
    teach:
      - Every scroller picks an anchor node, preferring one fully in view, and when layout above it changes the browser shifts the scroll position by the same distance before anything is shown. That is why an image loading above an article no longer shoves the paragraph away. overflow-anchor auto turns it on, none turns it off.
      - A virtualizer trips its brakes. The adjustment is cancelled when top, transform, height and the like change between the anchor and the scroller, which is exactly how rows are placed. A scroll offset of zero also cancels it, so prepending history at the very top gets no help, and older browsers on users' devices have none of it.
      - Recycled rows add a fight, the node the browser chose may show another line after the next render, and two corrections of the same scrollTop make a visible double jump. Only the list knows which line each row shows, so it sets none and does the job.
    draw: [browser-anchoring, anchor-auto, anchor-none, list-sets, suppressed-path, double-jump]
    check: "Why does Logscope's scroller set overflow-anchor: none?"
    answer: The browser's adjustment is suppressed when rows are moved by top or transform and at a scroll offset of zero, and recycled rows mean its anchor node may show another line, so two corrections would fight; only the list knows which line each row holds.
    misconceptions:
      - "Browser scroll anchoring covers any change above the reader -> it is suppressed when top or transform change on the anchor's path and at scroll offset zero, which is the virtual list's usual case."
  - point: The list anchors on the id of the first row at the viewport top plus that row's offset from the edge, captures it before a change, and restores scrollTop from the rebuilt offset table in the same task.
    kind: flow
    weight: core
    teach:
      - Each Logscope line has an id from ingest, and its store index is that id minus the first id still held, so a trim renumbers everything while ids never change. The reader sits on line 182,004, index 122,003, its top 6 px above the edge.
      - The store trims its oldest 5,000 lines. With scrollTop untouched, the same indices now hold lines 5,000 later, and every row on screen is one they never scrolled to.
      - The order is the trick. Capture the id and offset, apply the trim, rebuild the offsets and resize the container so the next scrollTop is not clamped, look up the id's new index, 117,003, and set scrollTop to its top minus the saved offset, then render. All in one task, so only the corrected frame is painted; split across two frames, one flickers.
      - At the bottom the list is following the tail, keeps no anchor and simply scrolls to the end after each append.
    draw: [by-hand, capture, trim, then-trim, rebuild, then-rebuild, index-shift, restore, look-up-id, one-task, following]
    check: Logscope trims 5,000 lines above a reader on line 182,004. What do they see with no anchoring, and what does the list capture so they stay on that line?
    answer: With no anchoring the same scrollTop maps to the same indices, which now hold lines 5,000 later. The list captures the line's id and its top's offset from the viewport edge, then after the trim and rebuild sets scrollTop to the id's new top minus that offset, in the same task.
    misconceptions:
      - "Anchor on the row's index -> the index changes with every trim; the id does not, so anchor on the id plus an offset."
      - "Correct the position on the next frame -> one frame of wrong lines gets painted, a flicker; capture, change and restore in one task before paint."
  - point: Jumping to a line reads its top from the offset table and sets scrollTop, then treats the target as the anchor so measuring the rows near it cannot push it away.
    kind: flow
    weight: core
    teach:
      - A virtual list cannot scroll past 180,000 lines to reach one, and need not. The offset table already gives line 180,412 a top, measured where rows were seen and estimated elsewhere. Look it up, set scrollTop, render the window around it.
      - The estimate said 2,486,140 px; once the traces above it are measured the real top is 2,486,460, and without care the match slides 320 px down the screen. Treat the target as the anchor, here 120 px below the edge for context, and restore it before paint. A jump and a trim are the same mechanism.
      - Finish the job. Move focus to the match only once its row exists, and say where the reader is in a short polite status outside the list, Match 3 of 57, line 180,412. Find-in-page cannot help, the browser only searches rows that exist.
    draw: [jump, est-top, real-top, drifts, target-anchor, focus-after, match-status, then-status]
    check: After a jump to line 180,412 the rows above it are measured 320 px taller than estimated. What keeps the match where the reader expects it?
    answer: The target is treated as the anchor with the offset wanted, 120 px below the top edge, and after measuring the list restores that position before paint, as it does after a trim.
    misconceptions:
      - "The browser's find-in-page can jump to any line -> it only searches rows in the DOM; Logscope searches the store in a worker and jumps by index."
  - point: A focused row must never be unmounted or recycled, so the rendered set is the window plus the focused row, and keys move focus by index.
    kind: rule
    weight: core
    teach:
      - Focus lives on a DOM node. The reader tabs into a line, then turns the wheel, and a naive list unmounts that row, so focus falls back to the body and the next Tab starts from nowhere they chose. Reusing the node is worse, focus sits on a row now showing another line.
      - Logscope renders the window plus the focused index. The focused row stays mounted at its true offset even far off screen and is taken out of the row pool, so recycling never rebinds it.
      - Arrow and Page keys compute the next index, make sure that row is rendered, scrolling it in if needed, and only then call focus on it.
    draw: [focus-aria, row-pool, pool-a, pool-b, pool-c, lost-focus, focused-row, leaves-pool, keys-by-index]
    check: The reader has focus on a log line and scrolls it far out of the window with the wheel. What goes wrong in a naive virtualizer, and what is Logscope's rule?
    answer: The row is unmounted, so focus falls back to the body, or it is reused for another line, so focus sits on the wrong line. Logscope keeps the focused row mounted and out of the recycling pool, rendering the window plus the focused index.
    misconceptions:
      - "Arrow keys can move focus to the next DOM sibling -> the next line may not be rendered; move by index, render the row, then focus it."
  - point: When only some rows exist, the list must state the real size and each row's position with ARIA, and announce events through a separate polite status, never by making the list live.
    kind: rule
    weight: core
    teach:
      - With every item in the DOM the browser counts sizes and positions itself; with a window it cannot. Logscope is a grid, so the container carries aria-rowcount, 250,000 lines plus one header row, 250,001, and each rendered row its aria-rowindex. Line 180,412 is index 115,411, so its row index is 115,413.
      - A list variant uses aria-setsize and aria-posinset on each rendered item instead. During a batch such as a trim, aria-busy lets assistive technology wait for the finished list.
      - Events are spoken through one visually hidden status element outside the list. A log role or live region on the list itself would queue speech for every appended line of a 40 lines a second tail.
    draw: [aria-region, rowcount, rowindex, list-variant, busy, status-region, no-live-list]
    check: Logscope's grid has 250,000 lines and a header row. What aria-rowcount does it carry, and what aria-rowindex does line 180,412, at store index 115,411, get?
    answer: aria-rowcount 250,001, counting the header row; aria-rowindex 115,413, its 1-based position after the header.
    misconceptions:
      - "Make the list a live region so changes are announced -> on a fast tail it would queue speech for every new line; announce one short summary per event through a separate role=status element."
      - "Screen readers count the rows themselves -> they only see the rows in the DOM, so the list must supply the real count and positions."
