# Keeping the reader's place in a virtual list: the browser's scroll anchoring and its limits, anchoring by id and offset, jumping to an index, focus and ARIA for a partial DOM.
id: virtualization/anchoring-and-accessibility/how-it-works
title: Anchoring, jumping and accessibility
source:
  hash: 5c079cec26b1
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: virtualization/variable-heights/how-it-works
  assumes:
    - A windowed list keeps only the rows in view plus an overscan in the DOM and recycles row nodes for other entries.
    - An offset table of running totals gives every index a top, from measured heights or estimates, and finds the entry at a pixel by binary search.
    - When rows above an anchor entry change height, the list adds the change to scrollTop before paint.
  carries:
    - A virtual list usually turns the browser's scroll anchoring off with overflow-anchor none and anchors by hand.
    - The anchor is a line id plus the offset of its top from the viewport edge, captured before a change and restored in the same task.
    - Jumping to an index sets scrollTop from the offset table, then treats the target as the anchor once rows near it are measured.
    - The rendered set is the window plus the focused row, and keys move focus by index.
    - A partial list states its real size and positions with ARIA and announces events through a separate polite status.
  terms:
    - term: scroll anchoring
      means: The browser keeping a chosen anchor node still by adjusting the scroll position when layout above it changes.
    - term: overflow-anchor
      means: The CSS property that turns the browser's scroll anchoring on (auto) or off (none) for a scroller.
    - term: following mode
      means: The reader is at the bottom, so no anchor is kept and the list sticks to the end after each append.
    - term: aria-rowcount
      means: The full number of rows in a grid or table, header rows included, set on the container when only some rows exist.
    - term: aria-rowindex
      means: A rendered row's real 1-based position among all the rows.
