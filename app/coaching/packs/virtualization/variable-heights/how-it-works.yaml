# Rows whose height is only known once rendered: the estimate, measuring with ResizeObserver, the offset table and its binary search, and correcting scrollTop.
id: virtualization/variable-heights/how-it-works
title: Unknown and changing heights
source:
  hash: 019413c8ae6e
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - A windowed list keeps only the rows in view plus an overscan in the DOM, with a spacer that gives the scrollbar the full list's height.
    - Reading a size right after changing the DOM forces the browser to lay out early.
  carries:
    - Every unmeasured row needs an estimated height; summed, the estimates set the scrollbar and where a jump lands.
    - A ResizeObserver reports each rendered row's border-box height after layout and before paint, at no extra layout cost.
    - Measured heights are stored by entry id, not index, and kept when a row unmounts.
    - An offset table of running totals answers which entry sits at a pixel by binary search, about log2(n) probes.
    - When rows above an anchor entry change height, the list adds the change to scrollTop before paint.
  terms:
    - term: estimate
      means: The height a row is given before it has ever been rendered and measured.
    - term: offset table
      means: An array where offsets[i] is the top of entry i, the running total of every height before it.
    - term: anchor
      means: The entry the reader is looking at, normally the first whose top is in view, kept still while heights change.
    - term: ResizeObserver
      means: A browser observer that reports an element's size after the frame's layout and before paint.
