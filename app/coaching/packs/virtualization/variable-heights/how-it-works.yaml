beats:
  - point: Every row the list has not yet rendered still needs an estimated height, because the scrollbar and the landing spot of any jump are sums of those numbers.
    kind: mechanism
    weight: core
    teach:
      - The spacer's height and every offset past the measured rows are sums of heights, so a row Logscope has never drawn still needs a number. Summed over the whole list it sizes and places the scrollbar thumb; summed up to one index it decides where a jump to that index lands.
      - Walk the ladder of guesses. One constant, 20 px for Logscope's commonest row, costs nothing but the thumb drifts as rows get measured. A running mean of the measured heights gets close but nudges the thumb with every update.
      - Best is a guess per row from its own data, newlines times the line height, with wrapping worked out from one character width measured once in the monospace font. Where the server knows sizes, as with media, it can send them, at the cost of payload bytes.
    draw: [estimate, est-list, measured-a, measured-b, guessed-a, guessed-b, est-sum, est-constant, est-mean, est-per-row, est-server]
    check: Logscope guesses 20 px for every row it has not measured. What two things does that guess decide before anything is measured?
    answer: The scrollbar, since the spacer is the sum of every height, and where a jump to an index lands, since that entry's offset is the sum of the heights before it.
    misconceptions:
      - "The estimate only matters until a row is drawn -> it sets the scrollbar and every offset past the measured rows, so a poor one makes the thumb drift and jumps land in the wrong place."
  - point: A ResizeObserver collects each rendered row's real height after the browser's layout and before paint, and the height is stored under the entry's id and kept after the row unmounts.
    kind: mechanism
    weight: core
    teach:
      - The tempting way is to mount the new rows and read each one's height straight away. In a script that just changed the DOM, each read forces a layout, and row after row repeats it.
      - Instead observe each row as it mounts. After the frame's layout and before paint, the observer reports every row whose size changed, plus each row the first time it is seen. The numbers come from the layout already done, so measuring is free. Read the border-box height so padding and borders count.
      - File the height under the entry's id, not its position, because positions move when entries are inserted or filtered. When a row unmounts, stop observing it but keep its height, so scrolling back reuses the measurement.
    draw: [measuring, rendered-row, heights-by-id, observes, ro-timing, keep-height]
    check: Why does Logscope store a measured height under the entry's id instead of its index?
    answer: Indexes shift when entries are inserted, removed or filtered, so a height filed by index would end up describing another entry; an id stays with the entry it was measured on.
    misconceptions:
      - "Read each new row's height right after mounting it -> that read forces layout in the middle of the script, row by row; a ResizeObserver hands over sizes from the layout the browser already did."
      - "Drop a row's height when it unmounts -> keep it, so scrolling back uses the real height instead of the guess."
  - point: An offset table of running totals places any entry with one array read and finds the entry at a scroll position by binary search, about log2(n) probes.
    kind: mechanism
    weight: core
    teach:
      - Keep a second array beside the heights. offsets[0] is 0 and each next offset is the previous one plus that entry's height, so offsets[i] is where entry i starts. The spacer is the last offset plus the last height.
      - Where does entry 182,640 go? One read. Which entry is at the top of the viewport? The largest i whose offset is at or below scrollTop. Offsets only grow, so halve the candidates on each probe, about 18 probes for 250,000 entries.
      - Work the article's small case. Entries 5 to 8 start at 360, 460, 480 and 500. At scrollTop 490 the search settles on entry 7, which spans 480 to 500, with 10 px of it scrolled out of view. Then walk forward adding heights to fill the viewport, and add the overscan.
      - When one height changes, everything after it is stale. Lowering a valid-up-to mark and rebuilding on the next read past it suits most lists, because changes and reads cluster near the viewport.
    draw: [offsets, offsets-array, sums, offsets-rule, probes, entry-5, entry-6, viewport-490, entry-7, entry-8, scrolltop-490, search]
    check: Entries 5 to 8 start at 360, 460, 480 and 500 px. Which entry is first visible at scrollTop 490, how is it found, and about how many probes would 250,000 entries need?
    answer: Entry 7, the largest entry whose offset is at or below 490; a binary search over the offsets finds it, about log2(250,000), roughly 18 probes.
    misconceptions:
      - "Find the top row by walking down the list adding heights -> offsets only increase, so a binary search finds it in about log2(n) probes instead of touching every entry."
  - point: When rows above the anchor are measured at a different height than guessed, the list adds the total change to scrollTop inside the ResizeObserver callback, so the frame that reaches the screen shows the anchor where it was.
    kind: rule
    weight: core
    teach:
      - The reader has just jumped to entry 120, and entries 116 to 119 sit above it at 28 px guesses. Measured, three come back 8 px shorter, and entry 117 is a stack trace of 280 px. Net, +228 px above the anchor, so entry 120 now starts 228 px lower while scrollTop has not moved, and they are staring into the trace.
      - Add up the changes of every measured row before the anchor and add that to scrollTop in the same callback. It is still before paint; the browser lays out again and the painted frame has entry 120 in place. A row that grows at or below the anchor grows downward, away from the reader, and needs nothing.
      - Do not defer it to the next animation frame, that paints one frame of shifted content and shakes on a fast fling. And do not count on the browser's own scroll anchoring, it backs off when rows are moved by top or transform, which is how a virtualizer places them.
    draw: [correcting, anchor-120, rows-above, e-116, trace-117, e-118, pushes, add-delta, below-anchor, one-frame-late, browser-suppressed]
    check: Entry 122, below the reader's anchor, is measured 72 px taller than its estimate. What should the list do to scrollTop?
    answer: Nothing. A row below the anchor grows downward, so the anchor does not move; only changes above the anchor are added to scrollTop.
    misconceptions:
      - "Fix the shift on the next animation frame -> that paints one frame of shifted content first; correct inside the ResizeObserver callback, before paint."
      - "The browser's scroll anchoring will keep the reader in place -> its adjustment is suppressed when top or transform changes on the anchor's path, which is how virtual rows are positioned."
  - point: A grid whose rows line up is virtualised with one row per item, as tall as its tallest cell, while masonry needs one offset table per column and heights known before render.
    kind: rule
    weight: supporting
    teach:
      - Treat each row of cells as one item whose height is its tallest cell and keep one table of row offsets; a second table of widths windows the columns too, as a big spreadsheet does.
      - Masonry has no single table, each column stacks its own items, and placement is only cheap and stable when sizes are known before render, which is why image feeds send width and height with each item.
    draw: [grid-rows, masonry]
    check: Why does a masonry feed want each item's size before it renders?
    answer: Each column keeps its own offset table and an item's position depends on the column it was placed in, so placement is only cheap and stable when heights are known up front.
task:
  prompt: Draw an offset table for entries 5 to 8 starting at 360, 460, 480 and 500 px, mark the entry at scrollTop 490, then show rows above the anchor growing by 228 px and what the list does to scrollTop.
  expects: [3, 4]
