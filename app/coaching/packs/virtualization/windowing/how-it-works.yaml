beats:
  - point: With fixed row heights the range needs no measuring, the first visible row is scrollTop divided by the row height rounded down, the last is the row holding the pane's bottom pixel, then clamp and widen by the overscan.
    kind: metric
    weight: core
    teach:
      - Row i always starts at i × 20 pixels, and scrollTop says how many pixels of list are above the pane. Divide and round down for the first row even partly visible.
      - The last visible row holds the pixel just above the bottom edge, scrollTop + 760 − 1. At scrollTop 24,440 that is lines 1,222 to 1,259, 38 of them.
      - Clamp the end to the last line, so a short list never asks for line 250,003, and widen by 10 each side, 1,212 to 1,269.
      - No loop over the data and no measurement is needed; that is why fixed heights are the easy case.
    draw: [range-math, scroll-top, worked-visible, to-visible, first-formula, last-formula, clamp-note, worked-mounted, widen]
    check: The pane is 760 pixels, rows are 20 and scrollTop is 24,440. Which lines are visible, and which are mounted with an overscan of 10?
    answer: "Visible 1,222 to 1,259 (24,440 ÷ 20 = 1,222, and (24,440 + 759) ÷ 20 rounds down to 1,259); mounted 1,212 to 1,269."
    misconceptions:
      - "The range needs each row measured -> with fixed heights it is pure arithmetic on scrollTop; measuring is only needed when heights vary."
  - point: The mounted rows sit over the spacer either each at top = i × 20 or inside one wrapper moved down by start × 20 with a transform; both put line 1,212 at 24,240 pixels, but only the wrapper keeps DOM order equal to screen order.
    kind: decision
    weight: core
    teach:
      - Point at the spacer from the first part. The rows have to appear at the right height inside it.
      - One way positions every row absolutely at top = i × 20. When the range shifts by five, five rows get a new top and text, and a recycled row can stay where it is in the DOM, so DOM order can drift from what is on screen.
      - The other keeps the rows in normal flow in one wrapper and moves the wrapper by translateY(start × 20). DOM order matches the screen, so text selection and Tab order follow what user 1 sees.
    draw: [placement, abs-rows, abs-order, wrapper, wrap-row-a, wrap-row-b, wrap-row-c, or-move, wrapper-order]
    check: Why might a team move one wrapper with a transform instead of placing every row absolutely?
    answer: The wrapper keeps DOM order equal to screen order, so text selection and Tab order follow the screen; absolutely placed rows can be in any DOM order.
  - point: The compositor scrolls first and the scroll event reaches the main thread at most once a frame, so every trigger goes through one requestAnimationFrame callback that reads scrollTop once and touches the DOM only if the range changed.
    kind: mechanism
    weight: core
    teach:
      - The compositor moves the painted layer on its own and the scroll event arrives afterwards on the main thread, batched once per frame. The range can never be fresher than the last frame the main thread produced.
      - Scroll is not the only trigger. A resize, a filter that changes the line count, a jump from search and a live append all need the same recompute, and two can land in one frame.
      - So each asks for one animation frame if none is pending. The callback reads scrollTop, runs the arithmetic and writes only if start or end changed. The listener is passive, and the pane height comes from a ResizeObserver, not a layout read.
    draw: [frame-loop, compositor, raf, rebind-rows, scroll-event, range-changed, triggers, read-first]
    check: Why read scrollTop before writing any row in the frame callback, and why make the scroll listener passive?
    answer: Reading before writing keeps the frame free of forced layouts; a passive listener never calls preventDefault, so the compositor never waits for it.
    misconceptions:
      - "Recompute on every scroll event -> scroll events are batched per frame; one scheduler serves every trigger and recomputes at most once a frame."
  - point: Rows that leave the range go back to a small pool and come out bound to the entering lines, so a scroll costs a text update, not new elements; per-line state must live in the store, keyed by line id.
    kind: rule
    weight: core
    teach:
      - Creating and discarding rows costs allocation, style matching and garbage collection; rebinding one costs a text update. Scroll 100 pixels and the rows for 1,212 to 1,216 become 1,270 to 1,274. The pool tops out around 59 rows.
      - In a framework the key decides which you get. Key by line id and it unmounts five and mounts five; key by slot and it patches the same five in place.
      - Slot keys have a sharp edge. User 1 expands the stack trace on line 1,224; they scroll on, the slot is rebound to 1,284, a plain request log, and it still shows expanded. Keep that flag in LogStore by line id and read it on every bind.
    draw: [pool, row-leaving, row-rebound, rebound, slot-key, slot-leak, state-in-store]
    check: User 1 expanded a stack trace on line 1,224, scrolled on, and now line 1,284 shows as expanded. What went wrong, and where should that flag live?
    answer: The flag was kept in the row, which belongs to a slot that was rebound to line 1,284; it should live in LogStore keyed by line id and be read back whenever a row is bound.
    misconceptions:
      - "Keying rows by line id is always right -> in a windowed list it makes the framework unmount and mount rows on every scroll; slot keys reuse them, with state kept in the store."
  - point: Overscan is how far the list can move between the compositor scrolling and the range being recomputed; too little shows blank edges, too much gives the savings back.
    kind: decision
    weight: core
    teach:
      - Because the compositor scrolls first, there is always a short delay before rows exist for new pixels. Without overscan any scroll shows a sliver of empty spacer for a frame.
      - Logscope's 10 rows are 200 pixels. A 50-millisecond task during a 300-pixel fling moves 15 lines, uses up the 10 and leaves 5 blank lines until the next frame.
      - Count it in rows or in pixels, and it can lean ahead in the direction of travel. Libraries often default to 1 and expect you to raise it for fast-scrolling content.
    draw: [overscan-why, overscan-10, fling-math, fling-uses, used-up, leaves-blank, balance, defaults]
    check: A 50-millisecond task holds the main thread while user 1 flings 300 pixels. With 20-pixel rows and an overscan of 10, what do they see?
    answer: "15 lines move past; the 10 rows of overscan cover 10 of them and 5 lines show as blank space until the next frame recomputes the range."
    misconceptions:
      - "More overscan is always safer -> each extra row is mounted, styled and laid out, and enough of it turns the window back into the full list."
task:
  prompt: For a 760-pixel pane with 20-pixel rows and an overscan of 10, work out the visible and mounted lines at scrollTop 24,440, then draw the rows that move when user 1 scrolls 100 pixels down.
