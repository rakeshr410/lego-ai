# How windowing works: the range from the scroll offset, the spacer and two ways to place rows, one recompute per frame, recycled rows and where their state lives, and overscan.
id: virtualization/windowing/how-it-works
title: Window arithmetic and recycling
source:
  hash: c87e2b7376f3
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: virtualization/windowing/key-idea
  assumes:
    - A windowed list keeps all items in a JavaScript array and mounts only the rows that overlap the viewport, plus an overscan.
    - One empty spacer as tall as the whole list keeps the scrollbar honest.
    - The compositor can scroll a painted layer without waiting for the main thread.
    - Reading a layout value after writing to the DOM forces the browser to lay out early.
  carries:
    - With fixed heights the first visible row is floor(scrollTop ÷ row height), the last is the row holding the pane's bottom pixel, clamped and widened by the overscan.
    - Mounted rows are placed over the spacer either one by one at top = i × height or by moving one wrapper with a transform, which keeps DOM order equal to screen order.
    - Every trigger goes through one requestAnimationFrame scheduler that reads scrollTop once and writes only if the range changed.
    - Rows leaving the range are rebound to entering lines from a pool; per-line state lives in the store, keyed by line id.
    - Overscan covers the delay between the compositor scrolling and the range being recomputed; too little shows blank edges, too much gives the savings back.
  terms:
    - term: scrollTop
      means: How many pixels of the list sit above the pane's top edge.
    - term: row pool
      means: The set of row elements reused as lines enter and leave the range; it grows only to the largest range needed.
    - term: slot key
      means: Keying a row by its position in the pool rather than by line id, so a framework patches it instead of remounting it.
    - term: passive listener
      means: An event listener that promises never to call preventDefault, so the compositor never waits for it.
