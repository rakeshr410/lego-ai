# Windowing's idea: the data can be as long as it likes, the DOM holds only the rows in view plus a margin, one tall empty element keeps the scrollbar, and rows are rebound as the reader scrolls.
id: virtualization/windowing/key-idea
title: The DOM holds the view, not the data
source:
  hash: 85e1c1d6d508
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - Every node in the DOM is styled and laid out, so a bigger tree makes every later change cost more.
    - Infinite scroll only appends, so a long list keeps growing in the DOM unless it is windowed.
  carries:
    - Mounting one row element per item makes the tree, the memory and every later change scale with the data.
    - A windowed list keeps all items in a JavaScript array and mounts only the rows that overlap the viewport, plus an overscan on each side.
    - One empty spacer as tall as the whole list keeps the scrollbar, Page Down and dragging as if every row existed.
    - On scroll, the range is recomputed and rows that leave one end are rebound to the lines entering at the other.
    - What is not mounted is invisible to the browser, so find-in-page misses it and search has to run over the data.
  terms:
    - term: windowing
      means: Rendering only the rows that intersect the viewport, plus a margin, while the rest of the list exists only as data.
    - term: overscan
      means: The extra rows mounted above and below the visible ones, 10 on each side in Logscope.
    - term: spacer
      means: An empty element as tall as the full list, so the scroll container scrolls as far as if every row were there.
    - term: mounted range
      means: The first and last line that currently exist as row elements.
