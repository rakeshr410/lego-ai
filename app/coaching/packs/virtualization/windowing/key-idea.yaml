beats:
  - point: Mounting one row per line asks the browser for a tree that grows with the data, so 250,000 log lines become about 1.5 million elements, a frozen tab and a cost that every later change pays again.
    kind: failure
    weight: core
    teach:
      - It is 2 a.m. and user 1 opens Logscope on an outage. The query returns 250,000 lines, and the first version appended a row per line, each row a handful of elements.
      - That is about one and a half million elements. The tab locked up for seconds, memory went past half a gigabyte, and every filter, highlight or hover afterwards paid again for the size of the tree.
    draw: [everything, all-rows, heavy, frozen]
    check: Why does rendering every one of user 1's 250,000 lines hurt even after the first frame?
    answer: The DOM holds about 1.5 million elements, so every later change, a filter, a highlight or a hover, pays again for the size of the tree, not just the first render.
  - point: The pane only shows 38 lines, so the app keeps all lines in a JavaScript array and mounts only the rows that overlap the visible part, plus 10 above and 10 below, 58 rows in all.
    kind: mechanism
    weight: core
    teach:
      - The pane is 760 pixels tall and a line is 20, so user 1 sees 38 lines at a time. The other 249,962 do nothing for them.
      - Keep every line in LogStore, an array that costs a few dozen megabytes and no rendering at all. Mount only the rows whose positions overlap the visible pane, and ten more on each side.
      - That is 58 row elements, a few hundred elements in total, whatever the query returned.
    draw: [pane, visible, above-unmounted, below-unmounted, logscope-data, store, cheap-store, overscan-above, overscan-below, binds, mounted-count]
    check: User 1's pane is 760 pixels tall, lines are 20 pixels and the overscan is 10 rows on each side. How many row elements are mounted?
    answer: "58: 760 ÷ 20 = 38 visible lines, plus 10 above and 10 below."
    misconceptions:
      - "Windowing throws the off-screen data away -> every line stays in the JavaScript array; only the row elements are limited."
  - point: One empty spacer as tall as the whole list, 250,000 × 20 = 5,000,000 pixels, keeps the scrollbar, Page Down and dragging behaving as if every line were there.
    kind: component
    weight: core
    teach:
      - A scroll container scrolls only as far as its content is tall. With 58 rows inside, the scrollbar would end after 58 rows.
      - So the pane gets one empty element 5,000,000 pixels tall. The thumb is as small, and dragging lands where it would, as if all 250,000 lines were mounted, for the cost of one element.
    draw: [spacer]
    check: Why does a windowed list need an empty element as tall as the whole list?
    answer: The scroll container only scrolls as far as its content is tall; without the spacer the scrollbar would end after the few mounted rows.
  - point: As the reader scrolls, the new scroll offset decides the new first and last line, and the rows that slide out of one end are moved to the other and given the incoming lines' text.
    kind: mechanism
    weight: core
    teach:
      - When user 1 scrolls, the pane reports its new offset and a quick calculation picks the new first and last line.
      - The rows that left the top are moved to the bottom and handed the text of the lines coming into view. Nothing new has to be built.
      - She sees a list that opens at once and scrolls smoothly, whether the query returned two hundred lines or two hundred thousand.
    draw: [recycle-note]
    check: User 1 scrolls down a few lines. What happens to the rows that leave the top of the mounted range?
    answer: They are moved to the bottom and rebound to the lines entering the range, with those lines' text; no new rows are created.
  - point: Lines that are not mounted do not exist for the browser, so find-in-page misses them and a fast fling can show a blank band for a frame; search has to run over the store and jump by setting the scroll offset.
    kind: failure
    weight: core
    teach:
      - User 1 presses Ctrl+F for pool exhausted. The browser searches the DOM, which holds 58 lines, and finds 1 match out of the 141 in the query.
      - Logscope's own search runs over LogStore, finds all 141, and jumps to the last one by setting scrollTop so line 183,907 sits mid-pane; the window is recomputed around it.
      - A hard fling while a filter update runs can also outrun the rows. The browser keeps scrolling, the range is from an older offset, and the bottom shows empty space until the next frame catches up.
    draw: [store-search, jump, find-miss, blank-band]
    check: Why does the browser's find bar miss most matches in a windowed list, and how does Logscope find them?
    answer: Find-in-page searches the DOM, which holds only the mounted rows; Logscope searches the data in LogStore and scrolls to a match by setting scrollTop.
    misconceptions:
      - "Ctrl+F still sees the whole list -> it searches the DOM, and the DOM holds only the mounted window."
