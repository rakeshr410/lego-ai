# How polling, long polling and server-sent events work: who waits, where the old price stays on screen, and the cursor that keeps a watcher from missing a bid.
id: client-server-protocols/polling-and-server-sent-events/how-it-works
title: Polling and server-sent events
source:
  hash: deccae5037dd
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - Methods, paths, headers and status codes mean the same in HTTP/1.1, HTTP/2 and HTTP/3; page code does not change.
  carries:
    - "Short polling: the client asks on a timer and the server answers at once; the interval is the worst staleness and requests = watchers ÷ interval."
    - A 304 to If-None-Match shrinks an empty poll's answer, never the request or its round trip.
    - "Long polling: the server holds the request until there is news or a timeout, then the client asks again at once."
    - Every event carries an increasing id, and a request that names the last id it saw cannot miss events published in between.
    - "Server-sent events: one GET whose text/event-stream response stays open, one way, server to client."
    - EventSource reconnects by itself with Last-Event-ID, and the server replays the log after that id.
  terms:
    - term: short polling
      means: An ordinary GET on a timer; the server answers at once, usually with no change.
    - term: long polling
      means: A GET the server holds open until there is something new or its timeout fires; the page then asks again.
    - term: cursor
      means: The id of the last event the page has, sent with each request so the server can answer with everything newer.
    - term: server-sent events (SSE)
      means: A single HTTP response of type text/event-stream that never finishes, carrying events from server to page.
    - term: Last-Event-ID
      means: The header EventSource adds on reconnecting, holding the id of the last event it received.
