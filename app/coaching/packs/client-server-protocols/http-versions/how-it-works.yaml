  prompt: Draw one packet of lot.json being lost on HTTP/2 and on HTTP/3, show which responses wait in each, and write when the first byte arrives on a new TCP + TLS 1.3 connection and on a new QUIC connection with a 40 ms round trip.
  expects: [1, 4]
