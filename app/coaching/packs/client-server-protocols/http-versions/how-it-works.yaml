beats:
  - point: Over TCP a new connection pays a round trip for TCP's handshake and another for TLS 1.3 before the request goes out, while QUIC does both in one, so with a 40 ms round trip the first byte lands at 120 ms versus 80 ms.
    kind: metric
    weight: core
    teach:
      - Before any response byte, a new connection must learn that both ends are there and agree on keys. Over TCP these happen one after the other, SYN and SYN-ACK, then TLS 1.3's hello and reply.
      - With Gavelry's 40 ms round trip on 4G, that is two round trips of setup and a third for the GET itself, first byte at 120 ms.
      - QUIC's first packet already carries the TLS hello, so the connection is keyed after one round trip and the answer arrives at 80 ms.
    draw: [handshakes, tcp-hs, tls-hs, then-tls, get-tcp, then-get, quic-hs, get-quic, quic-then]
    check: With a 40 ms round trip, when does the first response byte arrive on a brand-new TCP + TLS 1.3 connection, and on a new QUIC connection?
    answer: 120 ms on TCP + TLS (one round trip each for TCP, TLS and the request) and 80 ms on QUIC, which merges transport and TLS setup into one round trip.
    misconceptions:
      - "The three-way handshake is TLS's -> SYN, SYN-ACK is TCP's handshake; TLS 1.3 adds its own round trip on top."
      - "HTTP/3 has no handshake -> QUIC still does one, with TLS folded into it, so it costs one round trip instead of two."
  - point: A resumed connection can send a GET in its very first flight (0-RTT), but that flight can be replayed, so only safe requests may use it; once a connection is open any version costs one round trip per request.
    kind: rule
    weight: core
    teach:
      - A browser that visited before holds a resumption ticket, and with it QUIC sends the request in the first flight, so the answer lands at 40 ms.
      - The catch is that someone who captured that flight can send it again and the server may act twice. So only safe methods such as GET go in early data; a server that is unsure answers 425 Too Early and the client retries after the handshake.
      - Gavelry's GET for the lot page may ride in 0-RTT; the POST that leaves an absentee bid must not.
      - And note the warm case. On an already open connection every version costs one round trip per request, which is why reusing one connection matters more than how it started.
    draw: [zero-rtt, replay, too-early, warm-conn]
    check: Why may the browser send GET /api/lots/118 as 0-RTT data but not POST /api/absentee-bids?
    answer: 0-RTT data can be replayed; replaying a GET is harmless, but replaying a bid would place it twice.
    misconceptions:
      - "0-RTT is free speed for any request -> the first flight can be replayed, so a POST that places a bid must wait for the full handshake."
  - point: Fetching twelve requests on warm connections, HTTP/1.1 sends two waves of six and finishes at 120 ms, while HTTP/2 sends all twelve as streams and finishes by 82 ms.
    kind: metric
    weight: core
    teach:
      - Take twelve of the lot page's requests, each needing a 40 ms round trip and about 20 ms of transfer.
      - On HTTP/1.1 a connection is reused but carries one exchange at a time, and pipelining stays off because proxies mishandled it. Six go out, six queue, which DevTools shows as Queueing or Stalled. The second wave ends at 120 ms.
      - On HTTP/2 all twelve leave at once on one connection and their frames interleave, so they finish between 60 and 82 ms. There is no six-connection limit; the server says how many streams it accepts, and at least 100 is recommended.
    draw: [twelve, h1-waves, pipelining, h1-wave2, h1-then, h1-last, h1-ends, h2-wave, h2-last, h2-ends, stream-limit]
    check: Why does the twelfth request finish at 120 ms on HTTP/1.1 but by 82 ms on HTTP/2?
    answer: On 1.1 only six connections exist, so requests 7 to 12 wait for the first wave to finish; on HTTP/2 all twelve are streams on one connection from the start and their frames interleave.
    misconceptions:
      - "HTTP/1.1 opens a new connection per request -> connections are persistent and reused, but each carries one exchange at a time."
  - point: Head-of-line blocking lives at the HTTP layer in 1.1, in TCP's single ordered byte stream under HTTP/2, and only inside the affected stream on QUIC, because QUIC packets say which stream they carry.
    kind: mechanism
    weight: core
    teach:
      - Head-of-line blocking means the front of a queue holds up everything behind it. HTTP/2 removed HTTP's queue but TCP is one numbered sequence of bytes and the kernel hands them over only in order. TCP has no idea streams exist.
      - Walk the loss. Packet 4, part of lot.json, disappears at 50 ms and is resent at 110 ms. Over TCP packets 5 to 12 sit in the buffer and app.js and the photo stop too.
      - QUIC tags every packet with its stream and offset and reassembles each stream separately, so only the later lot.json packets wait and the other eleven responses finish on time.
    draw: [hol, hol-def, tcp-order, tcp-lost, tcp-held, tcp-gap, quic-order, quic-lost, quic-held, quic-gap, quic-free]
    check: Packet 4, part of lot.json, is lost. Over HTTP/2 the photo's bytes in packets 5 and 6 have already arrived. Why can't the browser use them?
    answer: TCP releases bytes only in order and does not know about streams, so everything after the gap is held until packet 4 is resent; on QUIC the photo's packets would be released at once.
    misconceptions:
      - "HTTP/2 multiplexing removed head-of-line blocking -> it removed it at the HTTP layer; TCP's in-order delivery still stalls every stream on a loss."
  - point: On HTTP/1.1 the same loss stalls only connection 3, so the rest of the page loses just one connection from the queue, which is why several 1.1 connections can cope with loss better than one HTTP/2 connection.
    kind: failure
    weight: supporting
    teach:
      - Replay the loss on HTTP/1.1. Only connection 3, carrying lot.json, stalls; the others carry on.
      - At 60 ms five connections free up for six queued requests, so icons.svg has to wait for connection 3 and finishes at 170 ms. That isolation is the one thing several 1.1 connections do better.
    draw: [h1-loss, icons-late, h1-gap]
    check: In the HTTP/1.1 loss, why does icons.svg wait until 110 ms when the other queued requests start at 60?
    answer: Only five connections are free at 60 ms for six queued requests, and the sixth must wait for connection 3, which is stuck on lot.json's lost packet.
  - point: HTTP/2 and HTTP/3 send the same GET as lowercase pseudo-header fields compressed against a table of fields already sent, HPACK for HTTP/2 and QPACK for HTTP/3, because HPACK assumes in-order delivery.
    kind: mechanism
    weight: core
    teach:
      - The request line and Host header become four pseudo-header fields, method, scheme, authority and path, and all field names are lowercase.
      - The list is compressed against a table of what the connection already sent, so the second request's long cookie costs a few bytes of index.
      - HPACK expects header blocks in the order they were sent, which only a single ordered stream guarantees. Once QUIC delivers streams independently, HTTP/3 needs QPACK, which copes with that.
      - The priority field carries an urgency from 0, most urgent, to 7, default 3, plus i for responses useful in pieces.
    draw: [wire, h1-text, pseudo, becomes, hpack, to-hpack, table-saves, qpack, to-qpack, qpack-why, priority]
    check: Why does HTTP/3 use QPACK instead of HPACK?
    answer: HPACK relies on header blocks arriving in order, which independent QUIC streams do not guarantee; QPACK is built to tolerate out-of-order streams.
    misconceptions:
      - "HTTP/2 headers are sent as plain text like 1.1 -> they become pseudo-header fields plus lowercase fields, compressed with HPACK."
