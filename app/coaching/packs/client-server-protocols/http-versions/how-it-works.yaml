# How the HTTP versions work: handshake round trips, twelve requests on each version, where head-of-line blocking lives, and one GET on each wire.
id: client-server-protocols/http-versions/how-it-works
title: Connections, streams and blocking
source:
  hash: 2c9f60db2e84
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: client-server-protocols/http-versions/key-idea
  assumes:
    - HTTP/1.1 carries one exchange at a time per connection, so browsers open about six per origin and the rest queue.
    - HTTP/2 interleaves every request as frames on numbered streams over one TCP connection.
    - Over TCP one lost packet stalls every HTTP/2 stream behind it; HTTP/3 on QUIC stalls only the stream that lost it.
  carries:
    - A new TCP + TLS 1.3 connection gives the first response byte after 3 round trips, a new QUIC connection after 2, a resumed one with 0-RTT after 1.
    - 0-RTT data can be replayed, so only safe requests such as GET may ride in it.
    - Once a connection is open, every version costs one round trip per request, so reusing a warm connection matters most.
    - Head-of-line blocking lives at the HTTP layer in 1.1, in TCP's byte order under HTTP/2, and only inside one stream on QUIC.
    - HTTP/2 and HTTP/3 send the same request as lowercase pseudo-header fields, compressed with HPACK or QPACK.
  terms:
    - term: TLS handshake
      means: The exchange that agrees the encryption keys; over TCP it follows TCP's own handshake, in QUIC it is merged into the transport's.
    - term: 0-RTT
      means: Sending the request in the very first flight on a resumed connection, before the handshake finishes; it can be replayed.
    - term: pseudo-header field
      means: A field such as :method or :path that replaces HTTP/1.1's request line and Host header in HTTP/2 and HTTP/3.
    - term: HPACK / QPACK
      means: The header compressors of HTTP/2 and HTTP/3; both index fields already sent, QPACK tolerates out-of-order streams.
