beats:
  - point: A request means the same thing in every HTTP version, so the page's fetch() and the server's routing do not change; only how the bytes travel does.
    kind: rule
    weight: core
    teach:
      - Open Gavelry's lot 118 page. The browser has some sixty things to fetch from bid.example.com, the HTML, scripts, a stylesheet, eight photos of a coffee pot, the lot's JSON, the bid history.
      - Each is an ordinary HTTP exchange. Method, path, status code and headers like Cache-Control are defined once and mean the same over 1.1, 2 or 3.
      - So moving the edge to a new version changes nothing in page code. The browser's network stack does the framing; the page never learns which version carried the bytes.
    draw: [semantics, lot-requests, same-get, rfc-9110]
    check: Gavelry moves its edge from HTTP/2 to HTTP/3. What must change in the lot page's fetch('/api/lots/118') call?
    answer: Nothing; the method, path, headers and status codes mean the same in every version, and the browser handles the framing.
    misconceptions:
      - "HTTP/2 needs a different URL scheme or binary requests from page code -> the scheme and the call stay the same; the network stack frames the request."
  - point: HTTP/1.1 carries one exchange at a time on a connection, so browsers open about six connections per origin and the seventh request waits for one to free up.
    kind: mechanism
    weight: core
    teach:
      - HTTP/1.1 sends a request as lines of text, and that connection can carry the next request only once the whole answer is back.
      - "Browsers work around it with parallel connections, about six per origin. Six requests go out; request seven waits for one of them to finish."
      - That is the first kind of waiting, waiting for a free connection.
    draw: [h1, h1-conns, h1-c1, h1-c2, h1-c6, h1-queue, all-busy, h1-rule]
    check: On HTTP/1.1, the lot page has 60 requests for one origin. Why does the seventh one wait?
    answer: Each connection carries one exchange at a time and the browser keeps about six per origin, so the seventh request queues until one of the six finishes.
  - point: HTTP/2 cuts every exchange into binary frames tagged with a stream number, so all of the page's requests share one TCP connection at once.
    kind: mechanism
    weight: core
    teach:
      - HTTP/2 gives each request a numbered stream and slices responses into small frames, so the edge can send a bit of app.js, then a bit of a photo, then a bit of the lot JSON.
      - All sixty requests are in flight on a single TCP connection. Request seven no longer queues behind six busy connections.
    draw: [h2, h2-conn, h2-js, h2-photo, h2-json]
    check: What kind of waiting does HTTP/2 remove that HTTP/1.1 has?
    answer: Waiting for a free connection; many requests share one connection at the same time as interleaved streams.
    misconceptions:
      - "HTTP/2 opens one connection per stream -> all streams share a single TCP connection; that is the point of multiplexing."
  - point: HTTP/2 keeps one wait, TCP delivers bytes strictly in order, so one lost packet holds back every stream on the connection until it is resent.
    kind: failure
    weight: core
    teach:
      - TCP hands bytes to the browser only in order, and all sixty streams share that one ordered sequence.
      - On a bad train connection one packet carrying part of the lot JSON goes missing. Every stream behind it stops until the gap is filled, even the photos whose own bytes already arrived.
      - That is head-of-line blocking at the TCP layer. HTTP/2 removed the queue for a connection but kept TCP's.
    draw: [h2-stall, one-order]
    check: On HTTP/2, one packet carrying part of lot.json is lost. What waits?
    answer: Every stream on that TCP connection, until the retransmit arrives, because TCP releases bytes only in order.
    misconceptions:
      - "Multiplexing means a loss only affects its own stream -> over TCP every stream shares one byte order, so all of them stall; only HTTP/3 confines it."
  - point: HTTP/3 moves the streams onto QUIC over UDP, which recovers each stream on its own, and does the transport and TLS setup together so a new connection is ready a round trip sooner.
    kind: mechanism
    weight: core
    teach:
      - HTTP/3 runs on QUIC, a transport over UDP. Each stream is put back together separately, so a lost packet delays only the response it belonged to.
      - It also folds the encryption handshake into the transport handshake, so a new connection is usable one round trip earlier than TCP plus TLS.
      - It leaves a smaller wait of its own, the stream that lost a packet still waits, and some networks block UDP.
    draw: [h3, h3-conn, h3-js, h3-photo, h3-json, h3-stall, own-order, h3-ready, h3-udp]
    check: The same lot.json packet is lost on HTTP/3. What waits now, and why?
    answer: Only lot.json's stream; QUIC knows which stream each packet belongs to and reassembles every stream on its own.
    misconceptions:
      - "HTTP/3 is HTTP/2 over a faster TCP -> it runs over QUIC on UDP, not TCP."
      - "HTTP/3 skips the TLS handshake -> it still does TLS, combined with QUIC's own setup in one exchange."
  - point: Each version deleted one kind of waiting and left a smaller one, and knowing which queue a page is standing in is most of what a frontend engineer needs from the protocol.
    kind: rule
    weight: supporting
    teach:
      - Sum it up along the board. 1.1 waits for a free connection; 2 removes that but waits on TCP's single byte order; 3 confines a loss to one stream.
      - Promise the next part, where the round trips, the twelve-request waterfall and the lost packet get numbers.
