# HTTP versions' idea: the meaning of a request never changed; each version changed what a request waits behind.
id: client-server-protocols/http-versions/key-idea
title: Three versions, one browser
source:
  hash: "912669635900"
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes: []
  carries:
    - Methods, paths, headers and status codes mean the same in HTTP/1.1, HTTP/2 and HTTP/3; page code does not change.
    - HTTP/1.1 carries one exchange at a time per connection, so browsers open about six per origin and the rest queue.
    - HTTP/2 interleaves every request as frames on numbered streams over one TCP connection.
    - Over TCP one lost packet stalls every HTTP/2 stream behind it; HTTP/3 on QUIC stalls only the stream that lost it.
    - HTTP/3 runs over QUIC on UDP and does the transport and TLS setup together, so a new connection is ready a round trip sooner.
  terms:
    - term: stream
      means: One request and its response inside a shared HTTP/2 or HTTP/3 connection, cut into frames tagged with its number.
    - term: head-of-line blocking
      means: Something at the front of a queue holding up everything behind it.
    - term: QUIC
      means: A transport over UDP that knows about streams and recovers each one separately; HTTP/3 runs on it.
    - term: round trip (RTT)
      means: The time for a message to reach the server and an answer to come back.
