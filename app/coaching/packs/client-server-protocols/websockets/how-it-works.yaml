# How a WebSocket works: the HTTP upgrade, frames and masking, a small message protocol with ids and sequence numbers, a heartbeat, close codes and the reconnect loop.
id: client-server-protocols/websockets/how-it-works
title: WebSockets
source:
  hash: f3e6d33b1e2a
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: client-server-protocols/polling-and-server-sent-events/how-it-works
  assumes:
    - "Server-sent events: one GET whose text/event-stream response stays open, one way, server to client."
    - Every event carries an increasing id, and a request that names the last id it saw cannot miss events published in between.
  carries:
    - A WebSocket starts as an HTTP/1.1 GET with Upgrade, and after 101 Switching Protocols the same TCP connection carries frames both ways.
    - Browser-to-server frames are masked with 4 random bytes to protect old proxies; it is not encryption, wss:// is.
    - The socket is a pipe; the app adds a protocol with client ids to match replies and server sequence numbers to order and catch up.
    - The page cannot see protocol pings, so liveness needs an application heartbeat with a deadline.
    - Reconnect with capped exponential backoff and full jitter, stop on codes that say retrying cannot help, and catch up before sending.
  terms:
    - term: upgrade
      means: The HTTP/1.1 request with Upgrade websocket that, answered by 101, switches the same connection to WebSocket frames.
    - term: frame
      means: The WebSocket unit on the wire; its opcode says text, binary, close, ping or pong.
    - term: masking
      means: XORing every browser-sent frame with 4 fresh random bytes so a script cannot choose how its bytes look on the wire.
    - term: sequence number (seq)
      means: The number the server stamps on every event of a lot, in the order it decided them; the only order the client trusts.
    - term: full jitter
      means: Waiting a random time between zero and the current backoff cap, so clients that failed together come back spread out.
