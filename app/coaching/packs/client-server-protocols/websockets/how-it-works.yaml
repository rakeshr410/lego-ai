beats:
  - point: A WebSocket starts as a plain HTTP/1.1 GET asking to upgrade; the server answers 101 Switching Protocols, and from then on the same TCP connection carries WebSocket frames either way at any time.
    kind: flow
    weight: core
    teach:
      - Unlike the event stream, this pipe runs both ways. The bidder's browser sends GET /ws with Upgrade websocket, Connection Upgrade, a random Sec-WebSocket-Key and always its Origin. It is ordinary HTTP so it passes the same ports, proxies and TLS terminators.
      - The room server answers 101 Switching Protocols with Sec-WebSocket-Accept, the key plus a fixed GUID hashed with SHA-1. That proves it understood a WebSocket upgrade; anyone can compute it, so it is not security.
      - The constructor takes only a URL and subprotocols, so script cannot add an Authorization header. Authentication rides on what the upgrade already carries, the session cookie.
    draw: [upgrade, ws-page, ws-server, ws-get, ws-101, key-sent, accept-check, cookie-auth, ws-frames, ws-push, from-here]
    check: What does the browser send to open Gavelry's socket, what comes back, and what does the connection carry afterwards?
    answer: An HTTP/1.1 GET with Upgrade websocket and a Sec-WebSocket-Key (plus Origin and the cookie); a 101 Switching Protocols with Sec-WebSocket-Accept; afterwards WebSocket frames in both directions on the same TCP connection.
    misconceptions:
      - "The connection upgrades from HTTP to TCP -> it was TCP all along; the HTTP request switches that same connection to the WebSocket protocol."
      - "Sec-WebSocket-Accept authenticates the server -> it only shows the server understood the upgrade; anyone can compute it."
  - point: Every message travels in frames whose opcode says text, binary, close, ping or pong, and frames from the browser are masked with 4 random bytes to protect old proxies, which is not encryption.
    kind: mechanism
    weight: core
    teach:
      - Opcode 1 is text and must be valid UTF-8, 2 is binary, and 8, 9 and 10 are close, ping and pong. A 47-byte bid fits the 7-bit length, so its header is just 6 bytes, 2 of flags and length and 4 of mask key.
      - Masking exists because a page chooses its bytes. Without it a hostile page could craft bytes an old transparent proxy would misread as an HTTP request and cache. XOR with fresh random bytes makes the wire bytes unpredictable. Server frames are never masked.
      - Privacy comes from wss://, TLS, not from masking.
    draw: [opcodes, bid-header, fr-head, masking, fr-payload, not-encryption]
    check: Why does the browser mask every frame it sends, and does that keep a bid private?
    answer: So a script cannot control how its bytes appear on the wire and trick an old proxy into caching them as an HTTP request; it is not encryption, only wss:// keeps bids private.
    misconceptions:
      - "Masking encrypts the frames -> it only scrambles them with a key sent in the same frame; TLS (wss://) is what encrypts."
  - point: The socket is only a pipe, so Gavelry puts a small protocol on top, where a client id matches each reply to its request and a server sequence number is the only order the client trusts and the way it catches up.
    kind: mechanism
    weight: core
    teach:
      - Messages are JSON text frames with a type. The page joins lot 812 saying the last seq it saw, 4180, and gets a resync with 4181 to 4186.
      - "The bid carries a client id, c-17, invented by the browser. The ack carries the same id, so the pending row is found, and a resend after a reconnect is recognisable."
      - The seq, 4187, is stamped by the server on every lot event in the order it decided them. The client keeps the highest seq applied, ignores anything at or below it, and spots a gap when one skips ahead.
      - The protocol is named through Sec-WebSocket-Protocol; a page offers gavelry.v2 and gavelry.v1 and the server picks the newest it speaks.
    draw: [envelope, env-page, env-server, join-msg, resync-msg, answered-by, bid-msg, ack-msg, same-id, price-msg, env-others, broadcast, id-vs-seq, seq-rule]
    check: A bid goes up as c-17 and comes back acknowledged with seq 4187. What is each number for?
    answer: c-17 is the client's id, used to match the ack to the pending bid and to recognise a resend; 4187 is the server's sequence number, the order of events in the lot and the point to catch up from.
    misconceptions:
      - "Messages arrive in order, so no sequence numbers are needed -> after a reconnect the client must know where it stopped and spot gaps; only the server's seq says that."
  - point: TCP will not report a silently dead connection and the page cannot use protocol pings, so the client sends its own ping every 25 s and treats 10 s without an answer as dead.
    kind: failure
    weight: core
    teach:
      - In a tunnel the mobile network drops the flow and neither side gets a close frame. An idle TCP connection sends nothing, so a vanished peer looks the same as a quiet one; the socket still says OPEN.
      - Without a heartbeat the bidder presses Bid, send() returns normally, and the bid sits pending while TCP retransmits into the void for many minutes.
      - The browser answers a server's ping on its own, but the page can neither send a ping nor see a pong. So Gavelry's heartbeat is a ping and pong message pair, every 25 s, under the edge's 60 s idle limit, with a 10 s deadline. Any incoming frame resets it, and the worst case to Reconnecting is 35 s.
    draw: [liveness, lv-page, lv-server, app-ping, lv-gone, silent-drop, no-pong, worst-35, no-api-ping]
    check: The train enters a tunnel and the connection dies silently. Why does readyState still say OPEN, and how does Gavelry's page find out?
    answer: Nothing is sent on an idle TCP connection, so nothing fails and no close frame arrives; the page's application ping gets no pong within 10 s, so it declares the socket dead and reconnects.
    misconceptions:
      - "send() failing will tell you the line is dead -> send() returns normally and TCP keeps retrying for many minutes."
      - "The page can rely on WebSocket ping frames -> the browser answers them itself, but the page can neither send them nor see them."
  - point: A clean close is a close frame with a code from each side; anything else reaches the page as 1006 with no details, so a server that wants the client to stop retrying accepts the upgrade and then closes with a private code such as 4401.
    kind: rule
    weight: core
    teach:
      - A drop, a dead heartbeat or a refused handshake all show up as close 1006, wasClean false. The browser hides the reason on purpose so pages cannot use WebSocket to probe the visitor's local network.
      - So if the server refused the upgrade over an expired session, the page could not tell it from a tunnel. Gavelry's server accepts the upgrade and closes with 4401, which the client knows means stop retrying and refresh the session.
      - Scripts may close with 1000 or 3000 to 4999 only; 4000 to 4999 is for private agreements like this one.
    draw: [lv-expired, close-4401, close-code, close-1006, script-codes]
    check: Why does Gavelry's server accept the upgrade and then close with 4401, instead of refusing the upgrade when a session has expired?
    answer: A refused upgrade reaches the page as a vague 1006, the same as a network drop, so the client would keep retrying; 4401 is a private code that tells it to stop and fix the credential.
  - point: Reconnecting means waiting a random time up to a capped, doubling limit, stopping on codes where retrying cannot help, and sending the last seq on join so the missed events are applied before anything queued is sent.
    kind: flow
    weight: core
    teach:
      - The wait is random between zero and min(30 s, 1 s times 2 to the attempt), with a 5 s base after a restart (1012) or overload (1013) close. A failing client waits longer each time, and three thousand bidders who dropped together come back spread out.
      - Reset the attempt count only when the socket reaches Live, not on the raw open, or a server that accepts and immediately closes is hammered at the base delay. Stop on 1008, 4401 and 4409.
      - Catch up before you speak. join carries the last seq, the server answers with the missing events or a snapshot, and only then does the outbox of queued bids go out, so no bid is judged against a price the bidder has not seen.
    draw: [backoff, retry-1006, catch-up, reconnects, reset-live]
    check: The bidder's laptop wakes after twenty minutes and a bid is waiting in the outbox. In what order does the client reconnect, catch up and send?
    answer: It backs off a random delay, opens a new socket, sends join with its last seq, applies the resync in seq order, and only then flushes the outbox with the bid.
    misconceptions:
      - "Retry immediately, or on a fixed delay -> thousands of clients would return at once; use a random delay under a growing cap."
      - "Send queued bids as soon as the socket opens -> first apply the resync, or a bid is judged against a price the bidder has not seen."
task:
  prompt: Draw Gavelry's socket from the upgrade to its first acknowledged bid, then a silent drop, and show how the client notices, waits and catches up before it resends.
  expects: [1, 3, 4, 6]
