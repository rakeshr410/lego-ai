beats:
  - point: An element never lays itself out; it is placed by the context its parent runs, and it places its own children by the context it runs itself.
    kind: mechanism
    weight: core
    teach:
      - Recall display's two halves. The outer half is how the box takes part in what its parent is doing; the inner half is what it does for its own children, flow, flow-root, flex, grid or table.
      - "Take one span. Inside a paragraph it sits on a line like a word. Move it directly into a flex container and it becomes a flex item: its inline display is computed as block and the flex algorithm sizes it. The span did not change; its parent's context did."
    draw: [span-demo, para-ctx, span-in-p, flex-ctx, span-in-flex, moved, parent-decides]
    check: A span with display inline is moved from inside a paragraph to directly inside a display flex container. How is it laid out now?
    answer: As a flex item; its display is blockified and the flex algorithm sizes it, while its inner flow still lays out its own text.
    misconceptions:
      - "The span keeps sitting on a line because its own display says inline -> the parent's context decides; children of a flex container are items and are blockified."
  - point: "Four contexts do the work in an app: block stacks boxes down the page and pulls floats aside, inline packs words into line boxes, flex shares one axis, grid places items in tracks."
    kind: mechanism
    weight: core
    teach:
      - Block, started by the root, flow-root, floats and several others, puts block boxes one after another down the page and pulls floats to a side so later content flows around them.
      - Inline is what a block container runs when all its children are inline-level, text, spans, images, packed into line boxes and wrapped.
      - Flex lines items up on one main axis, each starting from its basis and growing or shrinking. Grid places items into rows and columns sized from lengths, content and fr shares.
    draw: [four-contexts, ctx-block, blk-one, blk-two, ctx-inline, line-full, line-wrap, ctx-flex, flex-item-1, flex-item-2, main-axis, ctx-grid, cell-1, cell-2, cell-3, cell-4]
    check: Which context does a block container run when all of its children are text, spans and images?
    answer: An inline formatting context, which packs them into line boxes and wraps them.
  - point: "A Slatework screen is contexts inside contexts: html starts the root BFC, the shell and the board run grid, each column runs flex, and each card, as a flex item, is a new BFC."
    kind: component
    weight: core
    teach:
      - Draw from the outside in. html starts the first block formatting context. The app shell is display grid, so the top bar, sidebar, board and activity panel are grid items placed in areas, not stacked by block rules.
      - The board is a grid item of the shell and a grid container itself, with a column per track. A column is a flex column, so its cards are flex items, and that alone makes each card a new BFC.
      - Inside a card the header and attachment rows run their own flex layout, and the body, with overflow hidden, is a BFC that also clips, which matters when a menu inside it gets cut off.
    draw: [root-bfc, app-shell, top-bar, sidebar, board, column, task-card, card-header, card-body, attachment-row]
    check: Why is a Slatework card a new block formatting context, though nobody wrote anything on it to make one?
    answer: It is a flex item of its column, and a flex item is enough to start a new block formatting context.
  - point: Most block boxes continue the context they sit in, but a new context is a wall, laid out by fresh rules inside and seen as one rectangle outside; flex and grid containers are always walls, and flow-root builds one for ordinary blocks.
    kind: rule
    weight: core
    teach:
      - "A div inside a div joins the same block formatting context. That is why a float in one can reach into the other, and why margins can merge across their edges."
      - Some boxes open a new context instead, a wall. Everything inside starts fresh, and the outside sees one rectangle.
      - "Flex and grid containers are always walls. For plain block content you choose to build one, most cleanly with display: flow-root. Put it on each comment in the activity panel and the floated avatar is contained, with the text beside it in its own inline context."
    draw: [walls, same-bfc, flow-root, opt-in, always-walls, activity, comment, avatar, comment-text]
    check: Why does a div inside another div usually share its parent's block formatting context?
    answer: A plain block box with display block and overflow visible continues the context it sits in; a new one starts only when something on the list, such as flow-root, overflow, a float or a flex parent, applies.
    misconceptions:
      - "Every div starts its own layout context -> plain block boxes continue the surrounding BFC, so floats and margins cross between them."
      - "overflow: clip starts a BFC like overflow hidden -> it clips without becoming a scroll container and starts no BFC."
  - point: "Slatework's two bugs, an avatar dangling into the next activity entry and a Review column swollen by one unbroken file name, both come down to asking whose rules are laying the element out."
    kind: failure
    weight: supporting
    teach:
      - Name the two bugs and the question that cracks both. The avatar is fixed by making the comment a wall; why the column swells, the board being a grid of columns, is for the next part.
task:
  prompt: "Draw Slatework's screen as nested formatting contexts, from html down to one card and one comment, and write which context each box runs."
  expects: [3, 4]
