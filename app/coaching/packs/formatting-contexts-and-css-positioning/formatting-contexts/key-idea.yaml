# Formatting contexts, the idea: a box is placed by its parent's context and runs one for its children; a new context is a wall.
id: formatting-contexts-and-css-positioning/formatting-contexts/key-idea
title: Layout happens in rooms
source:
  hash: 85271985c7cc
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - display has an outer half (how the box sits among siblings) and an inner half (how it lays out its children).
    - Normal flow stacks block boxes and wraps inline content into lines.
    - Touching vertical margins of blocks in normal flow collapse to the larger one.
  carries:
    - A box is placed by the formatting context its parent runs, and lays out its children by the context it runs itself.
    - "The four contexts in an app: block (BFC), inline (IFC), flex and grid."
    - "Children of a flex or grid container are items; an inline display is turned into block."
    - Most block boxes continue the context they sit in; a new context is a wall the outside sees as one rectangle.
    - "Flex and grid containers are always walls; display: flow-root builds one for block content and does nothing else."
    - Flex and grid items each start a new block formatting context.
  terms:
    - term: formatting context
      means: The layout algorithm a box runs for its children, block, inline, flex or grid.
    - term: block formatting context (BFC)
      means: A context where block boxes go one after another down the page and floats are pulled to a side.
    - term: inline formatting context (IFC)
      means: A context where words and inline boxes are packed into line boxes.
    - term: blockified
      means: An item of a flex or grid container whose inline outer display is computed as block.
