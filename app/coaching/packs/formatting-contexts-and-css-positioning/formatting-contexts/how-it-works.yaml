# Formatting contexts, how it works: what opens a BFC, its three effects, blockified items, the min-width auto trap, and contain.
id: formatting-contexts-and-css-positioning/formatting-contexts/how-it-works
title: What starts a context and what it contains
source:
  hash: fcc653aaebde
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: formatting-contexts-and-css-positioning/formatting-contexts/key-idea
  assumes:
    - A box is placed by the formatting context its parent runs, and lays out its children by the context it runs itself.
    - Most block boxes continue the context they sit in; a new context is a wall the outside sees as one rectangle.
    - "Flex and grid containers are always walls; display: flow-root builds one for block content and does nothing else."
    - Touching vertical margins of blocks in normal flow collapse to the larger one.
  carries:
    - "Many properties open a BFC as a side effect; only display: flow-root does nothing else, and overflow: clip opens none."
    - "overflow hidden, auto or scroll makes a box a scroll container that clips its content, menus included."
    - "A new BFC contains its floats, sits beside floats outside it, and stops margins collapsing through its edge."
    - "Flex and grid items are blockified; float and vertical-align do nothing to them, and each item starts a new context."
    - "A flex item's automatic minimum width is its min-content size, so an unbreakable string stops it shrinking."
    - "min-width: 0 or overflow-wrap: anywhere lowers that floor; in grid, minmax(0, 1fr) does."
    - "contain: layout also makes a containing block for absolute and fixed descendants and a stacking context."
  terms:
    - term: min-content size
      means: The narrowest a box can get with every soft wrap opportunity taken, usually its longest unbreakable run.
    - term: max-content size
      means: The width a box's content takes with no wrapping at all.
    - term: automatic minimum
      means: "What min-width: auto means on a flex item along the main axis: its content-based minimum, in practice its min-content."
    - term: scroll container
      means: A box with overflow hidden, auto or scroll; it clips what overflows and may scroll.
