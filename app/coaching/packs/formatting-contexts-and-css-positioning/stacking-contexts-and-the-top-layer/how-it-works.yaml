# Stacking, how it works: the paint order inside one context, what starts a context, settling who is on top, and the top layer.
id: formatting-contexts-and-css-positioning/stacking-contexts-and-the-top-layer/how-it-works
title: Stacking contexts and the top layer
source:
  hash: 00b242c039fa
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: formatting-contexts-and-css-positioning/positioning-and-containing-blocks/how-it-works
  assumes:
    - "An absolute box measures against the padding box of its nearest positioned ancestor, or the initial containing block if there is none."
    - "A fixed box uses the viewport unless an ancestor with a transform, filter, contain or similar captures it; such an ancestor captures absolute boxes too."
    - A clipping ancestor cuts a positioned box only if the box's containing block is the clipper or below it.
  carries:
    - "A stacking context paints its members in seven fixed steps, and paints each child context as one unit in its slot."
    - "A box that is a context through transform, opacity or filter paints at step 6, like positioned z-index 0."
    - "z-index works on positioned boxes and flex or grid items; auto starts no context, any integer does."
    - "Two boxes are compared through the members of their nearest shared context, so an inner z-index never beats an outer one."
    - "The top layer paints after the whole root context, in order of arrival, with the viewport as containing block and no ancestor clipping or fading it."
    - A stacking context is part of the CSS paint order, not the same thing as a compositor layer.
  terms:
    - term: stacking context
      means: A box whose descendants are painted together, in their own order, as one unit in the parent context.
    - term: level 0
      means: "Paint step 6: positioned boxes with z-index auto or 0, and contexts made by transform, opacity and the like, in tree order."
    - term: top layer
      means: A list the browser keeps beside the stacking tree, painted after the whole root context, last added on top.
    - term: "::backdrop"
      means: A viewport-sized pseudo-element painted directly under each top-layer entry.
