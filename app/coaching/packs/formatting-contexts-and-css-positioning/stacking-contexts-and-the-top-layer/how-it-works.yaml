beats:
  - point: "A stacking context paints its members in seven fixed steps, from its own background through negative z-index, blocks, floats, inline content and level 0 to positive z-index, and each child context is painted whole in its slot."
    kind: mechanism
    weight: core
    teach:
      - "Walk Slatework's root context bottom to top: the page background, any negative z-index contexts, in-flow blocks such as the sidebar and the columns, floats, inline content like column headings, then level 0, then positive z-index, the top bar at 10."
      - Card A and card B are transformed, and a box that is a context through something other than z-index, a transform, opacity below 1, a filter, paints at step 6 as if it were positioned with z-index 0. So the cards sit above every plain block and below anything with a positive z-index.
      - A context is one unit. Everything in card A is painted, in its own seven steps, at card A's slot, and nothing inside can be interleaved with card B or the top bar, however large its numbers.
    draw: [paint-order, step-1, step-2, step-3, step-4, step-5, step-6, step-7]
    check: A card is transformed but has no z-index. Where in its parent context's paint order does it land?
    answer: At step 6, level 0, in tree order with positioned boxes of z-index auto or 0; above plain blocks and inline content, below positive z-index.
    misconceptions:
      - "A negative z-index can slide a box under its parent context's background -> it goes under the parent's in-flow content, never under the context's own background."
  - point: "z-index only works on positioned boxes and flex or grid items; auto means level 0 with no new context, any integer including 0 starts one, and many other properties start a context on their own."
    kind: rule
    weight: core
    teach:
      - On a plain static block z-index does nothing, the other classic reason it seems ignored. Slatework's cards are flex items, so they can take a z-index without being positioned.
      - "relative and absolute start a context only with a z-index other than auto. fixed and sticky always do. So do opacity below 1, any transform, filter, clip-path or mask, will-change naming one of them, contain layout or paint, container-type, and an animation that fills forwards on one of these."
      - "isolation: isolate does nothing but start one, the deliberate way. Putting it on the board means nothing inside can ever be compared with the shell's header or toasts, and small local numbers are enough."
    draw: [starts-context, sc-positioned, sc-fixed, sc-item, sc-opacity, sc-transform, sc-isolate, static-z]
    check: "Does position: relative on its own start a stacking context? What about position: sticky?"
    answer: Relative does only together with a z-index other than auto; sticky, like fixed, always does, even with z-index auto.
    misconceptions:
      - "position: relative creates a stacking context -> only with a z-index other than auto; on its own it starts none."
      - "z-index: 0 is the same as auto -> 0 sets level 0 and starts a context; auto starts none."
  - point: "To settle who is on top, find the nearest context both boxes share and compare the two members of it that contain them; the inner z-index is not in that comparison."
    kind: rule
    weight: core
    teach:
      - "Four moves. List the contexts above each box. Find the nearest one they share, here the root. Take the member of it that holds each box, card A for the menu and the bar itself for the top bar. Compare those by the paint steps."
      - Card A is a transformed context at step 6; the top bar has z-index 10, step 7. The bar wins and paints over everything inside card A, the menu's z-index of 9999 included.
      - "Only three things change the result: make the menu a member of the shared context by removing what made card A a context, raise card A itself, or take the menu out of the tree."
    draw: [who-on-top, root-context, card-a, top-bar-10, member-a, member-bar, menu-9999]
    check: The More menu has z-index 9999 inside card A, which has a transform. The top bar has z-index 10. Which paints on top, and why does raising the menu's number not help?
    answer: The top bar; the comparison is between card A, level 0 at step 6, and the bar at step 7 in the root context. The menu's 9999 only ranks it inside card A.
    misconceptions:
      - "A higher z-index always wins -> numbers compare only inside one context; the menu's 9999 never meets the top bar's 10."
  - point: "The top layer is a list beside the stacking tree, painted after the whole root context in order of arrival; z-index is ignored, ancestors cannot clip or fade its entries, and their containing block is the viewport."
    kind: mechanism
    weight: core
    teach:
      - An element in the top layer paints as if it were a sibling of html, so no ancestor's context can hold it down. overflow and opacity on ancestors stop affecting it, and its containing block becomes the viewport rather than a transformed parent. It stays where it was in the DOM, so selectors, inheritance and events work as before.
      - "Only the browser adds entries, when a page asks: showModal on a dialog, a popover shown with popover auto or manual, requestFullscreen. Each entry gets a ::backdrop painted right beneath it, which is what dims the page behind a modal."
      - Order is arrival. Open the More menu as an auto popover, then a manual Link copied toast. Opening the card drawer with showModal first closes the open auto menu, then adds the drawer and its backdrop above the older toast, which is now dimmed.
    draw: [top-layer, tl-toast-1, tl-backdrop, tl-drawer, tl-order, tl-escape]
    check: Two popovers are open in the top layer, and the first has z-index 9999. Which paints on top?
    answer: The second; z-index is ignored in the top layer, where the element added last paints on top.
    misconceptions:
      - "z-index orders top-layer elements -> it is ignored; arrival order decides."
  - point: A toast shown while the modal drawer is open arrives after it and paints above it, but sits outside the modal, so it is inert.
    kind: flow
    weight: supporting
    teach:
      - "Show Moved to Review while the drawer is open. It lands last in the list, above the drawer, but showModal made the rest of the document inert, so the toast cannot be clicked or focused. A manual popover suits toasts, it never closes other popovers and ignores Esc."
    draw: [tl-toast-2, tl-inert]
    check: A manual toast is shown while a modal dialog is open. Where does it paint, and can the user click it?
    answer: Above the dialog, since it arrived later, but it is inert outside the modal, so it cannot be clicked or focused.
  - point: A stacking context decides paint order in the CSS model, while a compositor layer is an engine's private choice of what to rasterise separately; they often appear together but do not map one to one.
    kind: rule
    weight: supporting
    teach:
      - will-change transform both starts a context and asks for a layer, which is why the two get confused. Slatework's archived cards at opacity 0.6 are contexts usually painted into their parent's layer, and a box can get a layer just for overlapping one, with no change to stacking. Layering bugs are about contexts; layers are covered in Layers and compositing.
    draw: [not-a-layer]
    check: Is every stacking context its own compositor layer?
    answer: No; a context sets paint order in the CSS model, a layer is an engine's choice of what to rasterise apart, and the two do not map one to one.
