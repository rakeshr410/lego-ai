# Positioning, how it works: the walk up the tree for each position value, who may clip the box, fixed inside a transform, and sticky's conditions.
id: formatting-contexts-and-css-positioning/positioning-and-containing-blocks/how-it-works
title: Positioning and containing blocks
source:
  hash: 97c2fccd93fa
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: null
  assumes:
    - "Every element is laid out as four nested rectangles: content, padding, border, margin."
    - "overflow hidden, auto or scroll makes a box a scroll container that clips its content, menus included."
    - "contain: layout also makes a containing block for absolute and fixed descendants and a stacking context."
  carries:
    - "A static, relative or sticky box measures against the content box of its nearest block container ancestor."
    - "An absolute box measures against the padding box of its nearest positioned ancestor, or the initial containing block if there is none."
    - "A fixed box uses the viewport unless an ancestor with a transform, filter, contain or similar captures it; such an ancestor captures absolute boxes too."
    - A clipping ancestor cuts a positioned box only if the box's containing block is the clipper or below it.
    - "A sticky box keeps its space in flow and needs an inset, the right scroll container and room in its parent."
  terms:
    - term: containing block
      means: The rectangle a box's position, percentage widths and offsets are measured against.
    - term: positioned
      means: "Having a position of relative, absolute, fixed or sticky."
    - term: initial containing block
      means: A viewport-sized rectangle anchored at the top of the document, where an absolute box's walk ends if nothing qualifies.
    - term: padding box
      means: The content box plus its padding, inside the border.
    - term: scrollport
      means: The scroll container a sticky box sticks to, its nearest ancestor with overflow hidden, scroll or auto.
