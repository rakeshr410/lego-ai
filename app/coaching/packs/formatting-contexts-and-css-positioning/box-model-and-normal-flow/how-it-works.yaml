# How the box model works: display's two halves and the box tree, how a block is sized, line boxes, and margins that merge.
id: formatting-contexts-and-css-positioning/box-model-and-normal-flow/how-it-works
title: How boxes are made, sized and spaced
source:
  hash: ca57485a4fa2
review:
  status: draft
  provenance: ai-drafted
  author: claude
context:
  after: formatting-contexts-and-css-positioning/box-model-and-normal-flow/key-idea
  assumes:
    - Every element is laid out as four nested rectangles, content, padding, border and margin.
    - Normal flow stacks block boxes and wraps inline content into lines.
  carries:
    - display has an outer half (how the box sits among siblings) and an inner half (how it lays out its children).
    - Elements generate a box tree; loose inline text beside blocks gets an anonymous block box, display none generates nothing.
    - Across the inline axis a block's margins, borders, padding and width add up to its containing block.
    - Inline boxes live in line boxes; their vertical padding paints but does not push.
    - Touching vertical margins of blocks in normal flow collapse to the larger one.
  terms:
    - term: outer display type
      means: How a box behaves among its siblings, block-level or inline-level.
    - term: inner display type
      means: How a box lays out its own children, flow, flow-root, flex, grid or table.
    - term: anonymous block box
      means: A block box with no element behind it, made to wrap loose inline content beside block children.
    - term: line box
      means: A strip as wide as the block's content box that holds one line of inline content.
    - term: margin collapsing
      means: Two touching vertical margins in block layout merging into one the size of the larger.
