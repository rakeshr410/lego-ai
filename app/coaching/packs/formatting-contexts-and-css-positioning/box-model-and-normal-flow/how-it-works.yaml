beats:
  - point: display packs two answers into one word, the outer type says how the box sits among its siblings and the inner type how it lays out its own children.
    kind: mechanism
    weight: core
    teach:
      - It is tempting to read display flex as a description of the element itself. It is really two answers. The outer half says block, it takes a line of its own, or inline, it sits in a line of text.
      - The inner half says how its children are arranged, ordinary flow, flow-root, flex or grid. flex is block outside and flex inside; inline-flex is inline outside and flex inside.
    draw: [display, outer, inner, flex-pair]
    check: "What do the two halves of display: inline-flex say?"
    answer: Outer inline, so the box sits in a line of text beside its neighbours; inner flex, so it lays out its own children as a flex row.
    misconceptions:
      - "display: flex says how the element itself is placed -> that is the outer half, block; flex is the inner half, for its children."
  - point: Elements generate a box tree, and a block that holds both block children and loose inline content wraps that content in an anonymous block box; display none generates no box at all.
    kind: mechanism
    weight: core
    teach:
      - Layout works on boxes, not elements. The card's article, heading and list each generate a block box.
      - The loose line, Due Fri and the QA chip, sits beside those blocks, and a block container holds either blocks or inline content, not both. So the browser wraps the loose run in an anonymous block box with no element behind it.
      - A hidden draft flag with display none generates nothing, takes no space, and nothing points to it.
    draw: [box-tree, article-box, heading-box, list-box, to-heading, to-list, anon-box, contains, inline-run, none-rule]
    check: A card holds a heading and, after it, a loose line of text. What box does the browser make for that loose text, and why?
    answer: An anonymous block box around the inline content, because a block container's children are either all block boxes or all inline content.
    misconceptions:
      - "display: none just hides the box -> it generates no box, so the element takes no space at all."
  - point: Across the inline axis a block's margins, borders, padding and width add up to its containing block's width, so width auto takes what is left, auto margins centre it, and an auto height comes from the content.
    kind: rule
    weight: core
    teach:
      - Slatework's column is 360 wide with 12 of padding on each side, so its content box, the cards' containing block, is 336.
      - The seven inline parts of a card must add up to 336. Leave width auto and it soaks up the remainder, so the card's border box is exactly 336. Give it a width and both inline margins auto, and they split the leftover, which centres it.
      - Height runs the other way, it follows the content. That is why a percentage height inside a parent whose height is auto is treated as auto, there is nothing fixed to take a share of.
    draw: [sizing, inline-sum, column-cb, card-auto, centre-rule, pct-parent, pct-height]
    check: A column's content box is 336 pixels. A card in it has width auto, padding 16 and a 1-pixel border. How wide is its content?
    answer: "302 pixels: 336 minus 2 × 16 of padding minus 2 × 1 of border; its border box is exactly 336."
    misconceptions:
      - "A percentage height always works -> only when the parent's height is fixed; against an auto height it is ignored."
      - "Percentage top padding is measured against the height -> padding and margin percentages use the containing block's width on all four sides."
  - point: Inline content is laid out in line boxes, an inline box's vertical padding and border only paint, and inline-block makes a box the line has to make room for.
    kind: mechanism
    weight: core
    teach:
      - Inside a block of inline content the browser fills line boxes, strips as wide as the content box, and starts a new one underneath when the next piece does not fit.
      - A plain span has no say in that height. width and height are ignored, and its vertical padding paints up and down, overlapping the line above, while the lines stay where line-height put them.
      - When a chip needs real height, make it inline-block. It becomes one atomic box, and its line grows to hold it.
    draw: [inline-demo, span-demo, span-above, span-line, inline-paint, blk-demo, blk-above, blk-line, inline-block-rule]
    check: Why does a padded QA chip overlap the line above instead of pushing it down, and how do you make its line make room for it?
    answer: Vertical padding on an inline box only paints; the line's height comes from line-height. Making the chip inline-block turns it into a box with real height that the line grows to fit.
  - point: When two vertical margins of blocks in normal flow touch, they collapse into one the size of the larger, unless something sits between them or the boxes are not in block flow.
    kind: rule
    weight: core
    teach:
      - Card A has a bottom margin of 16 and card B, under it, a top margin of 24. In a block column the gap is 24, not 40, the larger one wins.
      - Margins also merge between a parent and its first or last child when no border, padding or content separates them, and through an empty block.
      - Anything between the edges stops it, a border, padding, a line of text, or a parent that starts its own formatting context like flow-root. Flex and grid items never collapse, so in a flex column the same cards are 40 apart. Inline margins never collapse.
    draw: [collapse, block-col, card-a, gap-24, card-b, flex-col, card-a-flex, flex-40, card-b-flex, stoppers]
    check: Card A has a bottom margin of 16 and card B, right under it, a top margin of 24. What is the gap in a block column, and in a flex column?
    answer: 24 in a block column, because the touching margins collapse to the larger; 40 in a flex column, where margins never collapse.
    misconceptions:
      - "Margins always add up -> touching vertical margins of blocks in normal flow collapse to the larger."
      - "Padding collapses like margins -> padding and border always add; only margins collapse."
