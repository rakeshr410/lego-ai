context:
  after: null
  assumes: []
  carries:
    - "Every element is laid out as four nested rectangles: content, padding, border, margin."
    - By default width sizes the content box; box-sizing border-box makes it size the border box.
    - A box's size comes from its content, its own properties and its containing block.
    - Normal flow stacks block boxes and wraps inline content into lines.
  terms:
    - term: content box
      means: The innermost rectangle, holding text and child boxes; width sizes it by default.
    - term: border box
      means: Content plus padding plus border; what the reader sees as the element's edge.
    - term: containing block
      means: The rectangle a box is measured against; for a box in flow, its parent's content box.
    - term: normal flow
      means: Layout with no flex, grid, floats or positioning; blocks stack, inline content wraps.
