      - { lane: l-size, from: 16.7, to: 33.4, label: 154 px, tone: orange }
      - { lane: l-size, from: 33.4, to: 50.1, label: 146 px, tone: blue }
      - { lane: l-size, from: 50.1, to: 66.8, label: 154 px, tone: orange }
      - { lane: l-size, from: 66.8, to: 84, label: 146 px, tone: blue }
      - { lane: l-look, from: 0, to: 16.7, label: square, tone: gray }
      - { lane: l-look, from: 16.7, to: 33.4, label: round, tone: orange }
      - { lane: l-look, from: 33.4, to: 50.1, label: square, tone: gray }
      - { lane: l-look, from: 50.1, to: 66.8, label: round, tone: orange }
      - { lane: l-look, from: 66.8, to: 84, label: square, tone: gray }
    marks:
      - { lane: l-err, at: 16.7, label: loop error, kind: error, verdict: error }
      - { lane: l-err, at: 33.4, label: loop error, kind: error, verdict: error }
      - { lane: l-err, at: 50.1, label: loop error, kind: error, verdict: error }
      - { lane: l-err, at: 66.8, label: loop error, kind: error, verdict: error }
    scenarios:
      - name: Decide on the content box
        note: "The callback reads contentBoxSize, which stays 146 px whether or not the ring is drawn. The tile turns round once and stays round; one delivery, no error."
        spans:
          - { lane: l-size, from: 0, to: 16.7, label: 146 px content, tone: blue }
          - { lane: l-size, from: 16.7, to: 84, label: '146 px content (154 outer)', tone: green }
          - { lane: l-look, from: 0, to: 16.7, label: square, tone: gray }
          - { lane: l-look, from: 16.7, to: 84, label: round, tone: green }
        marks:
          - { lane: l-err, at: 16.7, label: no error, kind: ok, verdict: ok }
  - __component: sd.rich-text
    key: ro-other-uses
    body:
      - type: paragraph
        children:
          - type: text
            text: "Two other uses come up constantly in system design answers. A virtualized list with rows of unknown height observes each rendered row and caches its measured height by item id, so offsets are corrected from real sizes without any forced read (see unknown and changing heights). And a masonry or chart grid observes only its own container's width and derives column counts from it. A common instinct is to debounce the callback; usually that is a mistake. The callback already runs at most once per frame per target, and delaying it means frames painted with the old layout. Keep the callback cheap and idempotent, and debounce only the expensive work it triggers, such as refetching a chart's data at a new resolution once the drag has stopped."
  - __component: sd.quiz
    key: observers-quiz-ro
    questions:
      - question: A panel's width changes because the sidebar collapsed; the window did not change size. Which of these runs your JavaScript with the panel's new width?
        optionA: window resize event
        optionB: ResizeObserver on the panel
        optionC: A media query
        optionD: Both A and B
        answer: B
        explanation: The resize event only describes the window. ResizeObserver reports the element's own size, whatever caused it to change. Media queries run no script.
      - question: "A tile observed with { box: 'border-box' } gets a 4 px border from its own callback whenever it is under 150 px. Its content box is 146 px. What happens?"
        optionA: It turns round once and stays round
        optionB: It alternates between square and round every frame and logs the loop error
        optionC: The browser ignores style written by the callback
        optionD: The border is applied after paint, so nothing visible happens
        answer: B
        explanation: The border makes the border box 154 px, which undoes the condition, and removing it makes 146 px again. A callback that changes its own target's size cannot settle within a frame, so the change waits and the error event fires each time.
      - question: In writing-mode vertical-rl, what does entry.contentBoxSize[0].inlineSize measure?
        optionA: The width
        optionB: The height
        optionC: The diagonal
        optionD: It is always 0
        answer: B
        explanation: Inline size runs along the direction text flows. In vertical writing modes that is top to bottom, so inlineSize is the height.

  # ────────────────────────────────────────────────────────────────── 4. In practice
  - __component: sd.section
    key: in-practice
    title: In practice.
    railLabel: In practice
    intro: Pick the observer by the question you are asking, share one per kind, write only when something changes, and disconnect when the component goes away.
  - __component: sd.table
    key: choose-observer
    title: Which tool answers which question
    columns:
      - { label: Question, style: strong }
      - { label: Tool, style: mono-strong }
      - { label: Why, style: muted }
    rows:
      - ['Should this restyle when its container narrows?', '@container', 'No script, no loop risk']
      - ['What size is this element now, as a number my code needs?', ResizeObserver, 'Size from the layout already done, delivered before paint']
      - ['Is this element on screen, or within 600 px of it?', IntersectionObserver, 'No scroll handler; one observer for many targets; rootMargin for the look-ahead']
      - ['Did nodes, attributes or text change, possibly from code I do not own?', MutationObserver, 'Batched records after the script that changed them']
      - ['What did the user just type, paste or delete?', 'beforeinput / input events', 'They carry the intent (inputType) and can be cancelled']
      - ['Where exactly is the scroll position, every frame?', 'scroll event (passive) or a scroll-driven animation', 'Observers report threshold crossings, not continuous positions']
  - __component: sd.subsection
    key: intersection-brief
    title: IntersectionObserver in one paragraph
  - __component: sd.rich-text
    key: intersection-text
    body:
      - type: paragraph
        children:
          - type: text
            text: "The third observer answers 'is this element visible within a root, and by how much'. Its options belong to the constructor: root (the viewport by default, or a scroll container), rootMargin to grow or shrink that root, and threshold, the fraction or list of fractions of the target that must be visible for a change to be reported. Each entry has isIntersecting, intersectionRatio and target, and observing an element always produces one first entry with its current state. Ledgerleaf's chart loader observes all six panels with rootMargin '600px 0px' and fetches a chart's series the first time its panel comes within 600 px of the viewport, then unobserves it. The same machinery drives infinite-scroll sentinels, image lazy loading and 'seen' analytics; how a sentinel, its margin and one-request-at-a-time fit together is worked through in infinite scroll mechanics."
  - __component: sd.code
    key: chart-loader-code
    title: Lazy chart data with one IntersectionObserver
    snippets:
      - label: chart-loader.js
        language: javascript
        code: |
          const nearScreen = new IntersectionObserver((entries) => {
            for (const entry of entries) {
              if (!entry.isIntersecting) continue;
              nearScreen.unobserve(entry.target);         // load once
              loadSeries(entry.target.dataset.chartId);
            }
          }, { rootMargin: '600px 0px', threshold: 0 });

          for (const panel of document.querySelectorAll('.panel[data-chart-id]')) {
            nearScreen.observe(panel);
          }
  - __component: sd.subsection
    key: cleanup
    title: Sharing and cleaning up
  - __component: sd.rich-text
    key: cleanup-text
    body:
      - type: paragraph
        children:
          - type: text
            text: "In a component framework the natural mistake is one observer per component instance: 6 panels, 6 ResizeObservers, 6 callbacks a frame. It works, but a shared observer with a Map from element to handler gives one callback per frame and one place to reason about loops. Each component registers on mount and unregisters on unmount. Unobserving matters: an element that has been removed from the page but is still in an observer's target list stays referenced by the observer and cannot be collected, and its handler keeps closures alive with it."
  - __component: sd.code
    key: shared-observer-code
    title: One ResizeObserver shared by every component
    snippets:
      - label: use-element-size.js
        language: javascript
        code: |
          import { useEffect, useRef, useState } from 'react';

          const handlers = new Map(); // element -> (entry) => void
          const shared = new ResizeObserver((entries) => {
            for (const entry of entries) handlers.get(entry.target)?.(entry);
          });

          export function useElementWidth() {
            const ref = useRef(null);
            const [width, setWidth] = useState(0);
            useEffect(() => {
              const el = ref.current;
              if (!el) return;
              handlers.set(el, (entry) => {
                const w = Math.round(entry.contentBoxSize[0].inlineSize);
                setWidth((prev) => (prev === w ? prev : w)); // no re-render when unchanged
              });
              shared.observe(el);
              return () => {                                   // on unmount
                shared.unobserve(el);
                handlers.delete(el);
              };
            }, []);
            return [ref, width];
          }
  - __component: sd.table
    key: practice-checklist
    title: Habits that keep observers cheap
    columns:
      - { label: Habit, style: strong }
      - { label: Why, style: text }
    rows:
      - ['One observer per kind and configuration, many targets', 'One callback per delivery, batched entries, less bookkeeping']
      - ['Narrowest MutationObserver config on the smallest root', 'Records are built synchronously for every matching change, read or not']
      - ['Write only when the derived value changes', 'Unchanged writes still make mutation records and can still trigger layout']
      - ['Never change the size a ResizeObserver callback reads', 'It cannot settle in the frame: loop error and a flickering layout']
      - ['Add hysteresis around size thresholds', 'Scrollbars and wrapping text nudge sizes back across a single threshold']
      - ['unobserve on removal, disconnect on teardown', 'Observed elements and their handlers stay alive otherwise']
      - ['Prefer CSS (container queries) when the change is only visual', 'No script, no loop, no frame of the wrong layout']
      - ['Do not ship polyfills by default', 'All three are Baseline: MutationObserver for over a decade, IntersectionObserver since 2019, ResizeObserver since 2020']
  - __component: sd.qa-reveal
    key: interview-angle
    title: Saying it in an interview
    items:
      - label: Design
        question: "Your dashboard's chart widgets must adapt to the space they get. How do you know each widget's size?"
        answer: "Restyling alone (hiding labels, stacking) goes in container queries. Where code needs the number, such as the chart's pixel width for tick density or the canvas bitmap, one shared ResizeObserver watches every widget. It reports content-box sizes after layout and before paint, so the adapted chart is in the same frame and nothing forces a layout. The callback writes only when a derived mode changes, with a hysteresis band around thresholds so a scrollbar cannot make it flap, and never changes the size it reads. Expensive work like refetching data at a new resolution is debounced, the layout response is not."
      - label: Follow-up
        question: The error tracker shows thousands of 'ResizeObserver loop completed with undelivered notifications'. Ignore it?
        answer: "Not without a look. It means a callback changed the size of an element at or above the depth it was reported at, so the change was deferred to the next frame and a frame was painted with stale layout. Find callbacks that resize their own target or a parent, or toggle between two states. Make them idempotent, decide from a box their write does not change, or move the write into requestAnimationFrame if the one-frame delay is acceptable."
      - label: Follow-up
        question: How would an editor notice that a browser extension or spellcheck changed the document?
        answer: "A MutationObserver on the editor root with subtree, childList and characterData. Records arrive in a microtask after whatever made the change, before the frame is drawn. The editor maps them back to operations on its model, or reverts what it does not accept. For the person's own typing, beforeinput and input events give the intent; the observer is the safety net for everything else. Keep the root as small as the editable region and ignore records the editor's own renderer caused."
      - label: Follow-up
        question: Why not just listen to scroll and check getBoundingClientRect for lazy loading?
        answer: "Scroll can fire every frame while the person scrolls, the handler runs on the main thread, and each getBoundingClientRect may force layout. An IntersectionObserver computes intersections in the rendering steps from the layout already done, batches targets, and only calls you when a threshold is crossed. rootMargin gives the look-ahead so content is ready before it is visible."
  - __component: sd.card-grid
    key: where-it-shows-up
    title: Where this shows up in system designs
    columns: 2
    cards:
      - title: Block and rich-text editors
        text: A MutationObserver on the editable root reads changes the browser made (IME, spellcheck, paste, extensions) back into the document model; input events carry the person's intent.
      - title: Dashboards and canvases
        text: One ResizeObserver per grid sizes every chart and canvas from its own box, with device-pixel sizes for sharp bitmaps; container queries handle the purely visual changes.
      - title: Virtualized lists
        text: Rows of unknown height are measured by a ResizeObserver as they render and cached by id, so offsets are corrected without forced reads.
      - title: Feeds and media
        text: IntersectionObserver with a generous rootMargin starts fetching the next page or the next image before it is visible, and reports what was actually seen for analytics.
      - title: Third-party embeds
        text: A narrow MutationObserver notices nodes injected by scripts you do not control and disconnects once it has its answer.
      - title: Responsive components
        text: Components adapt to the space they are given, not the window, so the same widget works in a sidebar, a modal and a full-width page.
  - __component: sd.quiz
    key: observers-quiz-practice
    questions:
      - question: A card component only needs to hide its labels when it is narrower than 300 px. What is the best first choice?
        optionA: A ResizeObserver per card
        optionB: A container query
        optionC: A window resize handler
        optionD: A MutationObserver on the card
        answer: B
        explanation: The change is purely visual and depends on the space the card gets, which is what container queries do, with no script and no loop risk.
      - question: A panel component observes itself with a shared ResizeObserver but never unobserves on unmount. What is the cost?
        optionA: None; observers forget removed elements immediately
        optionB: The removed panel and its handler stay referenced, so they cannot be garbage collected
        optionC: The page throws an error
        optionD: The observer stops working for other panels
        answer: B
        explanation: The observer keeps the element in its target list and the handler map keeps the closure. Unobserve and delete the handler in the component's cleanup.
      - question: Which question is an IntersectionObserver the wrong tool for?
        optionA: Has this panel come within 600 px of the viewport?
        optionB: Is at least half of this video visible?
        optionC: What is the exact scroll offset on every frame?
        optionD: Has the sentinel at the end of the list become visible?
        answer: C
        explanation: It reports threshold crossings, not continuous positions. A passive scroll listener or a scroll-driven animation fits a value needed every frame.
