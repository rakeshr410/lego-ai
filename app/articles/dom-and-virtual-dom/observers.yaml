# yaml-language-server: $schema=../../../../lego/content-kit/schema/topic.schema.json
# provenance: ai-drafted by claude-opus-5-5 on 2026-10-26
#
# Concept topic in four sections: key-idea → mutation-observer → resize-observer → in-practice.
# Running example (our own): Ledgerleaf, a fictional analytics notebook at ledgerleaf.example.
# Ines is writing the page "Q3 churn review": 40 editable text blocks and 6 chart panels in a
# two-column grid she resizes by dragging. Text blocks turn "# " and "## " into headings
# (MutationObserver); each panel picks a full or compact toolbar from its own width and each chart
# canvas sizes its bitmap from its rendered size (ResizeObserver); charts below the fold fetch their
# data as they come near the viewport (IntersectionObserver, linked, not retaught); a third-party
# support widget injects its launcher late (MutationObserver with a narrow config).
# Shape: why observers replaced polling and per-event measuring, the shared shape and where each
# observer delivers in the event loop (key-idea); MutationObserver options, records, microtask
# delivery, the heading shortcut, the late widget, feedback loops and subtree cost (mutation-observer);
# the four ways to react to size, boxes and entries, delivery after layout and before paint, the depth
# rule and the loop error, the panel toolbars with hysteresis, canvas sizing, the flapping tile
# (resize-observer); choosing a tool, one shared observer per kind, cleanup, the interview answer
# (in-practice). Infinite-scroll sentinels belong to infinite-scroll-vs-pagination/infinite-scroll-mechanics;
# measured row heights to virtualization/variable-heights; read/write ordering to
# rendering-performance/layout-thrashing. Pixel and millisecond figures are illustrative
# assumptions for Ledgerleaf unless a source is named next to them.
catalogVersion: 5
title: "Observers: watching the page without polling"
shortTitle: Observers
summary: "MutationObserver, ResizeObserver and IntersectionObserver let the browser tell you what changed, in batches, at fixed points in the frame, instead of you polling or measuring inside every scroll and resize event."
group: core
order: 4
xp: 180
difficulty: intermediate
tags: [performance, editors]
prerequisites: [the-dom-as-a-live-tree]
related:
  - events-and-delegation
  - how-browsers-render-content/the-frame-and-the-event-loop
  - rendering-performance/layout-thrashing
  - infinite-scroll-vs-pagination/infinite-scroll-mechanics
  - virtualization/variable-heights
  - virtualization/windowing
  - notion/block-editor
  - google-docs/rich-text-editing
  - pinterest/masonry-home-feed
  - figma/infinite-canvas
eyebrow: DOM and virtual DOM
breadcrumb: [Core]
lede: "For years the only way to know that an element had changed size, scrolled into view or gained a child was to keep asking: a timer that measured every 100 ms, or a scroll and resize handler that measured on every event. Observers turn the question around. You say once which elements you care about, and the browser, which already knows what it changed and already computed the layout, hands you a batch of answers at a fixed point in its work. Knowing when each of the three delivers, and what a callback must not do with the answer, is the whole skill."
