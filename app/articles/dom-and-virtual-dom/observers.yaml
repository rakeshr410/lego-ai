sources:
  - title: "DOM Standard: mutation observers (WHATWG)"
    url: https://dom.spec.whatwg.org/#mutation-observers
    note: "Records are queued per mutation and delivered from one queued microtask; observe() options and the TypeError rules; takeRecords() empties the queue; disconnect() stops observing and empties the queue."
  - title: "MutationObserver.observe() (MDN)"
    url: https://developer.mozilla.org/en-US/docs/Web/API/MutationObserver/observe
    note: "Options childList, attributes, characterData, subtree, attributeFilter, attributeOldValue, characterDataOldValue; one of childList, attributes or characterData must end up true; subtree extends the others to every descendant."
  - title: "MutationRecord (MDN)"
    url: https://developer.mozilla.org/en-US/docs/Web/API/MutationRecord
    note: "type, target, addedNodes, removedNodes, previousSibling, nextSibling, attributeName, attributeNamespace, oldValue."
  - title: "Mutation events will be removed from Chrome (Chrome for Developers)"
    url: https://developer.chrome.com/blog/mutation-events-deprecation
    note: "The synchronous DOMNodeInserted / DOMSubtreeModified family hurt performance and was removed in Chrome 127 (2024); MutationObserver is the replacement."
  - title: "Resize Observer (W3C Editor's Draft)"
    url: https://drafts.csswg.org/resize-observer/
    note: "Boxes content-box (default), border-box, device-pixel-content-box; observations gathered after layout at increasing depth; skipped observations raise an error event and are delivered next time."
  - title: "ResizeObserver (MDN)"
    url: https://developer.mozilla.org/en-US/docs/Web/API/ResizeObserver
    note: "Callbacks run after layout and before paint; loops are cut off with 'ResizeObserver loop completed with undelivered notifications'; fires on observe when the element is rendered and not 0 × 0; Baseline since 2020."
  - title: "ResizeObserverEntry (MDN)"
    url: https://developer.mozilla.org/en-US/docs/Web/API/ResizeObserverEntry
    note: "borderBoxSize, contentBoxSize and devicePixelContentBoxSize are arrays of { inlineSize, blockSize } (arrays for future fragmented boxes); contentRect is the older, content-box-only form."
  - title: "ResizeObserver: it's like document.onresize for elements (web.dev)"
    url: https://web.dev/articles/resize-observer
    note: "Why per-element size observation was needed; what does and does not trigger an observation; avoiding loops by only changing descendants or deferring work."
  - title: "HTML Standard: update the rendering (WHATWG)"
    url: https://html.spec.whatwg.org/multipage/webappapis.html#update-the-rendering
    note: "Order of the rendering steps: resize and scroll steps, animation frame callbacks, style and layout with resize observations, intersection observations, then paint."
  - title: "IntersectionObserver (MDN)"
    url: https://developer.mozilla.org/en-US/docs/Web/API/IntersectionObserver
    note: "root, rootMargin, threshold set in the constructor; entries with isIntersecting and intersectionRatio; an entry is delivered on observe; Baseline since 2019."
  - title: "Window: resize event (MDN)"
    url: https://developer.mozilla.org/en-US/docs/Web/API/Window/resize_event
    note: "Fires only on window, for the viewport; to watch an element's size use ResizeObserver."
  - title: "CSS container queries (MDN)"
    url: https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_containment/Container_size_and_style_queries
    note: "Style a component from its container's size with no script; Baseline since 2023."
  - title: "prosemirror-view DOMObserver (GitHub)"
    url: https://github.com/ProseMirror/prosemirror-view/blob/master/src/domobserver.ts
    note: "A production editor reading changes the browser made inside contenteditable back through a MutationObserver."
tutorBrief: >-
  Observers exist because the old answers were polling (setInterval measuring getBoundingClientRect
  or offsetWidth) and per-event measuring (scroll and resize handlers): both run on the main thread,
  both read layout (forcing it if anything is dirty), polling is late by up to its interval and works
  when nothing changed. Observers are registered once; the engine tracks the change it already knows
  about and delivers batches. Shared shape: new X(callback[, options]); observe(target[, options]);
  unobserve(target) on ResizeObserver and IntersectionObserver only (MutationObserver has none);
  disconnect(); takeRecords() on MutationObserver and IntersectionObserver only; callback(entries,
  observer) receives an array. IntersectionObserver takes root, rootMargin, threshold in the
  constructor; the others take options in observe(). Timing: MutationObserver records are created
  synchronously per mutation and delivered in one microtask after the current script (before
  rendering). ResizeObserver runs inside update the rendering after style and layout and before paint,
  synchronously, and may loop. IntersectionObserver is computed in the rendering steps after layout and
  its callback is queued as a task. MutationObserver options: childList (direct children),
  attributes, characterData (Text/Comment data), subtree (extends the others to all descendants; it
  does not conflict with childList, the lecture-style claim that it does is wrong), attributeFilter,
  attributeOldValue, characterDataOldValue; at least one of childList/attributes/characterData must
  be true (filter or oldValue options imply theirs) or observe throws TypeError. Records: type,
  target, addedNodes, removedNodes, previousSibling, nextSibling, attributeName, oldValue. Writing
  the same value still queues a record; a callback that writes into what it observes re-queues
  itself in the same checkpoint and freezes the tab (microtasks drain fully). disconnect discards
  pending records, so call takeRecords first if they matter. Predecessor: synchronous Mutation
  Events, removed in Chrome 127. ResizeObserver: box content-box (default), border-box,
  device-pixel-content-box; entries' contentBoxSize/borderBoxSize/devicePixelContentBoxSize are arrays
  (one item today, reserved for fragments) of {inlineSize, blockSize}; inline is width in horizontal
  writing modes and height in vertical ones (direction rtl changes nothing). Fires on observe when
  rendered and not 0x0; not for position or transform changes. Depth rule: after delivery, layout
  runs again and only targets deeper than the shallowest reported one are delivered; the rest wait a
  frame and raise the window error 'ResizeObserver loop completed with undelivered notifications'
  (older Chrome: 'loop limit exceeded'). Window resize fires on window only, at most once per frame
  in current engines; its cost is that it ignores element sizes and handlers read layout. Container
  queries style by container size with no script. Ledgerleaf: Ines's page has 40 text blocks and 6
  panels. Old code polled 6 panel widths every 100 ms (60 reads/s). Heading shortcut: one
  MutationObserver on the editor root, subtree + characterData, converts '# ' and '## ' blocks into
  h1/h2 with replaceWith, guarded by isConnected; its own replaceWith makes childList records it does
  not watch. Late support widget: childList on body only, disconnect when found. Panel toolbar:
  compact below 360 px content width, full above 380 px (hysteresis band against the scrollbar
  flapping 15 px), write only on change. Canvas: device-pixel-content-box, fallback contentBoxSize ×
  devicePixelRatio (Safari lacks device-pixel-content-box). Flapping KPI tile: deciding on border-box
  while the callback adds a 4 px border swings 146 ↔ 154 px every frame with a loop error; deciding
  on content-box ends it. Debouncing a ResizeObserver callback delays the layout change; keep it
  cheap and idempotent instead, debounce only expensive follow-up work like refetching data.

