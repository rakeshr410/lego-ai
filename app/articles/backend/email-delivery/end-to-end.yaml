  - __component: sd.rich-text
    key: inbound-text
    body:
      - type: paragraph
        children:
          - type: text
            text: "Outlook and Yahoo send mail to our users the same way we send to theirs. An inbound SMTP service takes those connections, asks the user service whether the recipient exists (refusing an unknown address at RCPT TO), runs the same spam and malware checks, and publishes the email to the inbound send request topic. From there the existing delivery consumer puts it in the inbox and notifies the recipient."
  - __component: sd.db-schema
    key: mailbox-tables
    stores:
      - key: mailbox-store
        engine: "A wide-column or sharded relational store, partitioned by user"
        component: mailbox-db
        why: Every read is one user's mail.
        tables:
          - name: mailbox_items
            columns:
              - { name: user_id, type: uuid, role: partition }
              - { name: message_id, type: uuid, role: clustering }
              - { name: thread_id, type: uuid, role: index }
              - { name: from_email, type: text }
              - { name: to_emails, type: "text[]" }
              - { name: subject, type: text }
              - { name: has_attachment, type: bool }
              - { name: url_attachment, type: text }
          - name: outbox_email
            note: The same columns, plus the send status.
            columns:
              - { name: user_id, type: uuid, role: partition }
              - { name: message_id, type: uuid, role: clustering }
              - { name: thread_id, type: uuid }
              - { name: from_email, type: text }
              - { name: to_emails, type: "text[]" }
              - { name: subject, type: text }
              - { name: status, type: text }
              - { name: has_attachment, type: bool }
              - { name: url_attachment, type: text }
  - __component: sd.event-contract
    key: topics
    title: Kafka topics
    broker: Kafka
    topics:
      - { name: outbox events, delivery: at-least-once, producers: [outbox-consumer], consumers: [orchestrator], note: Every new outbox row. }
      - { name: outbound send request, partitionKey: recipient domain, delivery: at-least-once, producers: [orchestrator], consumers: [smtp-relay], note: Checked mail for other domains. }
      - { name: inbound send request, delivery: at-least-once, producers: [orchestrator, inbound-smtp], consumers: [delivery-consumer], note: Mail for our own users. }
      - { name: delay queue, delivery: at-least-once, producers: [orchestrator, smtp-relay], note: "Emails to retry later: a slow check, a receiving server that did not answer." }
      - { name: delivery status, delivery: at-least-once, producers: [smtp-relay, delivery-consumer], note: "Sent or bounced, for the mailbox and the notifications." }
  - __component: sd.rich-text
    key: wrap-up
    body:
      - type: paragraph
        children:
          - type: text
            text: "The thread ID on every row is what groups replies into a conversation. Close by reading the non-functional list back against the board. Scale: every service runs many copies behind the gateway, and the user DB is sharded. Availability: sending is asynchronous through Kafka, and a slow checker holds only its own emails. Consistent sign-up: the email ID is a primary key on the one shard that owns it. Durability: every email is saved in the outbox before anything else touches it."
  - __component: sd.quiz
    key: inbound-quiz
    title: Quick check
    questions:
      - question: An email arrives from Yahoo for one of our users. What new part does that need?
        optionA: A whole second delivery pipeline
        optionB: An inbound SMTP service that checks the recipient exists and publishes to the inbound topic; the existing delivery consumer does the rest
        optionC: Nothing; the relay workers receive it
        optionD: The search service
        answer: B
        explanation: Receiving reuses the delivery flow; only the front door is new.
      - question: What groups an email with its replies?
        optionA: The subject line
        optionB: A thread ID stored on every mailbox row
        optionC: The Kafka topic
        optionD: The attachment URL
        answer: B
        explanation: Subjects change and repeat; a thread ID is explicit.
