#
# Proximity search, the building block behind "find restaurants, drivers or hotels near me", taught the way
# InterviewWithBunny's System Design 7 teaches it: the problem in one line, then four numbered approaches on
# one board, each built and judged before the next: 1 a quadtree, 2 geohash, 3 PostgreSQL with the PostGIS
# extension, 4 Elasticsearch, and the choice between them. It is rarely the whole interview question; it is the
# part of Uber, a food delivery app or a hotel booking design that answers "what is near this point".
# Every latency figure is an illustrative round number, not a measurement.
# A backend system of lego-ai's own (app/articles/backend): it stands alone and links to no main-site topic.
