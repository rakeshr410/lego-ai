  - __component: sd.quiz
    key: choice-quiz
    title: Quick check
    questions:
      - question: You are designing Uber and need the drivers near a rider. Which approach does the walkthrough pick?
        optionA: A quadtree
        optionB: Geohash, since the search is by location only
        optionC: Elasticsearch, always
        optionD: A full table scan
        answer: B
        explanation: Location only, simple and fast; no text search is needed.
      - question: Users search restaurants by a misspelled name near them. What fits?
        optionA: Geohash alone
        optionB: Elasticsearch, or PostgreSQL with PostGIS plus a fuzzy text extension
        optionC: A quadtree
        optionD: Sort by distance and read the names
        answer: B
        explanation: Location narrows the area; fuzzy text matching finds the name. Both stores can do both.
