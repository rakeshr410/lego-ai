#
# A whole backend system design interview for an OTT streaming platform like Netflix, Prime Video or
# Hotstar, run step by step on one whiteboard. The order and the board follow InterviewWithBunny's
# System Design 4 (requirements, core entities, API, high-level design), then a low-level design
# that copies the high-level picture and opens one service at a time, in the video's order: the user
# service, the subscription service with payments and Kafka, the search service with Elasticsearch
# and CDC, then the play service, split here into the processing pipeline (chunker, encoder,
# manifests) and playback (manifest, adaptive bitrate, CDN, a Redis cache, HLS or DASH).
# Every latency or size figure not from the video is an illustrative round number.
# A backend system of lego-ai's own (app/articles/backend): it stands alone and links to no main-site topic.
catalogVersion: 5
title: Designing an OTT streaming platform, end to end
shortTitle: OTT streaming interview
summary: "A backend design interview for a streaming service like Netflix, step by step on one board: requirements with numbers, entities, six endpoints, the high-level design, then each service opened in turn: users, subscriptions and payments, search, the video processing pipeline, and adaptive playback from a CDN."
group: design
order: 4
xp: 280
difficulty: intermediate
tags: [interview, video-streaming, adaptive-bitrate, cdn, event-driven, search]
eyebrow: Design
breadcrumb: [Streaming, Interview walkthrough]
lede: "You have about an hour and one whiteboard to design a service like Netflix: people sign up, pay for a plan, search a catalogue of ten thousand titles and press play, and the film must start fast and never stall, on a phone on a train or a 4K television. This walkthrough runs the interview the way a strong candidate runs it: requirements with numbers, the entities and endpoints, the simplest picture that works, then each service opened in turn, ending with the part the interviewer is really asking about: how one huge video file becomes thousands of small segments that a player fetches one by one, at the quality the network allows."
reviewStatus: draft
author: rakeshr410
provenance: ai-drafted
sources:
  - title: "System Design 4: Design OTT Platform like Netflix / Amazon Prime / Hotstar (InterviewWithBunny, YouTube)"
    url: https://www.youtube.com/watch?v=NH-f955mvGg
    note: "Order and drawings. Corrected: HLS uses .ts or fMP4; m3u8 is text; manifests follow encoding; players switch by buffer, not I-frame; 2 Mbps is ~480p; HLS is multi-bitrate too; search hits the ES index; Kafka consumers, not Connect; hashed passwords."
  - title: "RFC 8216, HTTP Live Streaming"
    url: https://www.rfc-editor.org/rfc/rfc8216
    note: "The HLS playlist format: a multivariant (master) playlist listing renditions by bandwidth and resolution, and media playlists listing segments in order."
  - title: DASH Industry Forum
    url: https://dashif.org/
    note: "MPEG-DASH, the open standard for adaptive streaming over HTTP, with its XML Media Presentation Description (MPD)."
  - title: Debezium (change data capture)
    url: https://debezium.io/
    note: "Streams every committed change of a database to Kafka, the usual way to keep a search index in step with its source."
  - title: Apache Kafka documentation
    url: https://kafka.apache.org/documentation/
    note: "Topics, partitions and consumer groups: each consumer group reads every event, so notification and user updates run independently."
  - title: Netflix Open Connect
    url: https://openconnect.netflix.com/
    note: "Netflix's own CDN: appliances inside internet providers' networks that serve most video bytes close to the viewer."
tutorBrief: >-
  Interview walkthrough for an OTT platform like Netflix, Prime Video or Hotstar. Five numbered steps on
  the board, top to bottom: 1 requirements (functional left, non-functional right), 2 core entities,
  3 API (beside the entities), 4 high-level design, 5 low-level design (the high-level diagram copied
  and each service opened in turn). Functional: create an account and opt for a subscription (monthly
  or yearly; no viewing without one, as on Netflix); search movies and shows by title or name (genre
  too); watch a video at 480p, 720p, 1080p or 4K. Out of scope: the recommendation engine (an ML
  problem of its own), and uploading, done by an internal team. Non-functional: 200M users worldwide;
  10,000 videos of about an hour each (a curated catalogue, not user uploads); availability over
  consistency for browsing and playback (a new title can appear minutes late), but payments and
  subscriptions consistent; zero or negligible buffering. The scale means microservices, not a
  monolith. Entities: user, user metadata (plan, status, expiry), video, video metadata (title,
  description, thumbnail). API: 1 POST /v1/user/register (plus login, logout, update profile); 2 GET
  /v1/subscription/plans returns all plans; 3 POST /v1/subscription with the user and the plan id; 4
  GET /v1/videos/search?q={name} returns a paginated list of video ids with partial metadata
  (thumbnail, title, short description); 5 GET /v1/videos/{videoId} returns the full metadata as JSON;
  6 GET /v1/videos/play/{videoId} starts playback (returns the manifest). High-level design: users,
  a load balancer (round robin) and API gateway (authentication and authorization, routing, rate
  limiting), four services: user (user DB), subscription (user DB, third-party payment gateway),
  search (video DB), play (blob storage); an internal uploader writes metadata to the video DB and
  video files and thumbnails to blob storage (S3). Low-level design. 1 User service: MySQL user table
  (userId, name, email, password hash, subscription status, expiry date); login checks the hash and
  issues a JWT the other services verify. 2 Subscription: subscription DB in MySQL (subscriptionId,
  name, price, currency, validity) behind GET plans; checkout goes to a payment service that calls the
  payment gateway (card details go to the gateway, which returns a token and a result); payment DB in
  MySQL (paymentId, userId, amount, currency, time) because payments must be consistent; the result
  goes back to the subscription service, which publishes an event to Kafka; two consumer groups read
  it: a notification service tells the user, a consumer service updates the user's subscription
  status and expiry in the user DB. 3 Search: a LIKE scan of the video DB is slow, so Elasticsearch
  holds an inverted index of titles, genres and descriptions; a CDC pipeline (e.g. Debezium) streams
  every video DB change into it, near real time; results are paged. 4 Processing: the uploader puts
  the master file in S3 (a 4K master of an hour can be tens of GB; the video says about 40 GB, so
  nobody downloads the whole file to play it); S3 notifies a chunker that splits it into 2 to 10 s
  segments (a 20 min video in 10 s segments is 120); segments go through Kafka to video encoders that
  transcode each into a bitrate ladder (480p, 720p, 1080p, 4K) with H.264 or H.265, packaged as .ts
  or fragmented MP4 (HLS takes either; DASH uses fMP4), and write them back to S3. Manifests: HLS
  .m3u8 (plain text) and DASH .mpd (XML); a master playlist lists each rendition with its bandwidth
  and resolution (low.m3u8, medium.m3u8, high.m3u8), and each media playlist lists that rendition's
  segments in order. They are written once the renditions exist and are kept with the title in the
  video DB, MongoDB (films and series differ in shape): title, description, metadata, manifest. 5
  Playback: play service reads the manifest from the video DB (later through a Redis cluster, which
  cuts start-up time) and returns it; the player measures its throughput and buffer, picks a
  rendition, and fetches segments one by one ahead of the playhead: at 2 Mbps a 480p segment, still 2
  Mbps another, at 10 Mbps it steps up to 1080p (4K needs about 15 Mbps or more); it switches only at
  segment boundaries, where each segment starts with a keyframe. Segments come from a CDN near the
  viewer, which caches popular segments per region and fetches from S3 on a miss. HLS (Apple, required
  natively on Apple devices, .m3u8, about 6 s segments recommended) and DASH (open ISO standard, .mpd,
  often 2 to 4 s segments) are both adaptive and multi-bitrate and both buffer several segments
  ahead; services ship both.
components:
  - key: client
    name: Viewer's device
    tone: sand
    kind: client
    summary: A phone, a browser or a TV app that signs in, searches, and plays video with an adaptive player.
    owns: [the playback buffer, the JWT]
    talksTo: [api-gateway, cdn]
  - key: api-gateway
    name: Load balancer and API gateway
    tone: blue
    kind: gateway
    summary: Spreads traffic round robin and, as the gateway, authenticates and authorizes each call, routes it to its service and rate-limits it.
    owns: [routes, rate limits]
    talksTo: [user-service, subscription-service, search-service, play-service]
  - key: user-service
    name: User service
    tone: blue
    kind: service
    summary: Registers users, checks logins against a password hash and issues the JWT the other services trust.
    owns: [accounts]
    talksTo: [user-db]
  - key: subscription-service
    name: Subscription service
    tone: blue
    kind: service
    summary: Lists the plans, starts checkout, and publishes the payment result as an event.
    owns: [plans]
    talksTo: [subscription-db, payment-service, kafka]
  - key: payment-service
    name: Payment service
    tone: blue
    kind: service
    summary: Calls the payment gateway for a charge and records every result in the payment database.
    owns: [payment records]
    talksTo: [payment-gateway, payment-db]
  - key: payment-gateway
    name: Payment gateway
    tone: gray
    kind: external
    summary: A third party that takes the card details, talks to the bank and answers success or failure.
    owns: [card details]
    talksTo: []
  - key: kafka
    name: Kafka
    tone: gray
    kind: queue
    summary: The event log between services; payment events for subscriptions, and segments waiting to be encoded.
    owns: [payment events, segment jobs]
    talksTo: []
  - key: notification-service
    name: Notification service
    tone: blue
    kind: worker
    summary: Reads payment events and tells the user whether the plan is active.
    owns: [nothing durable]
    talksTo: [kafka]
  - key: subscription-consumer
    name: Consumer service
    tone: blue
    kind: worker
    summary: Reads payment events and writes the user's subscription status and expiry date.
    owns: [nothing durable]
    talksTo: [kafka, user-db]
  - key: user-db
    name: User DB
    tone: yellow
    kind: datastore
    summary: MySQL; one row per user with the subscription status and expiry.
    owns: [user]
    talksTo: []
  - key: subscription-db
    name: Subscription DB
    tone: yellow
    kind: datastore
    summary: MySQL; the plans on offer, their price, currency and validity.
    owns: [subscription]
    talksTo: []
  - key: payment-db
    name: Payment DB
    tone: yellow
    kind: datastore
    summary: MySQL; every payment attempt and its result, kept consistent.
    owns: [payment]
    talksTo: []
  - key: search-service
    name: Search service
    tone: blue
    kind: service
    summary: Answers title and genre searches from Elasticsearch, a page at a time.
    owns: [nothing durable]
    talksTo: [elasticsearch]
  - key: elasticsearch
    name: Elasticsearch
    tone: orange
    kind: datastore
    summary: An inverted index of titles, genres and descriptions, kept in step with the video DB by CDC.
    owns: [the search index]
    talksTo: []
  - key: cdc
    name: CDC pipeline
    tone: gray
    kind: worker
    summary: Change data capture; streams every change of the video DB into Elasticsearch.
    owns: [nothing]
    talksTo: [video-db, elasticsearch]
  - key: video-db
    name: Video DB
    tone: yellow
    kind: datastore
    summary: MongoDB; each title's metadata and its manifests.
    owns: [video]
    talksTo: []
  - key: uploader
    name: Uploader
    tone: gray
    kind: service
    summary: The internal team's upload tool; writes the metadata to the video DB and the master file and thumbnails to S3.
    owns: [nothing]
    talksTo: [video-db, blob-storage]
  - key: blob-storage
    name: Blob storage (S3)
    tone: yellow
    kind: datastore
    summary: The master files, thumbnails and every encoded segment.
    owns: [video files, thumbnails, segments]
    talksTo: []
  - key: chunker
    name: Chunker
    tone: blue
    kind: worker
    summary: Notified of a new upload; splits the master into segments of 2 to 10 seconds and queues them for encoding.
    owns: [nothing]
    talksTo: [blob-storage, kafka]
  - key: encoder
    name: Video encoder
    tone: blue
    kind: worker
    summary: Transcodes each segment into every rung of the bitrate ladder and writes the results back to S3.
    owns: [nothing]
    talksTo: [kafka, blob-storage]
  - key: play-service
    name: Play service
    tone: blue
    kind: service
    summary: Returns a title's manifest, from the Redis cache or the video DB; the player then fetches segments from the CDN.
    owns: [nothing durable]
    talksTo: [manifest-cache, video-db]
  - key: manifest-cache
    name: Redis cluster
    tone: green
    kind: cache
    summary: Manifests of titles being played, so pressing play skips the database.
    owns: [hot manifests]
    talksTo: []
  - key: cdn
    name: CDN
    tone: green
    kind: cache
    summary: Servers near the viewer holding the segments people in that region watch; a miss is fetched from S3.
    owns: [popular segments]
    talksTo: [blob-storage]
content:
  # ────────────────────────────────────────────────────────────────── Problem statement
  - __component: sd.section
    key: problem-statement
    title: Understanding the problem.
    railLabel: Problem
    intro: "The prompt is one line: design an OTT platform like Netflix, Prime Video or Hotstar. Say what it is in a sentence, then ask what exactly is to be designed, because a streaming service touches billing, search and video processing, and the interviewer wants some of it, not all."
  - __component: sd.rich-text
    key: problem-why
    body:
      - type: paragraph
        children:
          - type: text
            text: "An OTT (over-the-top) platform delivers films and shows straight to viewers over the internet, without a cable or satellite operator in between. The viewer signs up, pays for a plan, finds something and presses play; the service must start it quickly and keep it playing on whatever network the viewer has."
      - type: paragraph
        children:
          - type: text
            text: "Nobody outside video engineering is expected to know codecs in depth, which makes this a kind question: the design is mostly familiar backend pieces, and the one special part, how a large video reaches a phone without stalling, can be explained with a few ideas: segments, a bitrate ladder, a manifest and a CDN. Run the interview in five steps and number them on the board as you go: requirements, core entities, API, high-level design, low-level design."
  - __component: sd.card-grid
    key: board-steps
    title: The board, in the order you fill it
    columns: 3
    cards:
      - title: 1. Requirements
        text: Functional on the left, non-functional on the right, each with a number where there is one.
      - title: 2. Entities
        text: User, user metadata, video, video metadata.
      - title: 3. API
        text: Six endpoints, one group per functional requirement.
      - title: 4. High-level design
        text: "Gateway, four services, their stores, and the internal uploader."
      - title: 5. Low-level design
        text: "The picture copied and each service opened: users, subscriptions, search, then processing and playback."
  - __component: sd.quiz
    key: problem-quiz
    title: Quick check
    questions:
      - question: The interviewer says only "design Netflix". What do you do first?
        optionA: Explain H.264
        optionB: Ask which parts to design and at what scale, and write the answers as requirements
        optionC: Draw a CDN
        optionD: Pick a database
        answer: B
        explanation: A streaming service is many systems. Agreeing the scope and the numbers first is what makes the rest of the design checkable.
  # ────────────────────────────────────────────────────────────────── 1. Requirements
  - __component: sd.section
    key: requirements
    title: Requirements.
    railLabel: Requirements
    intro: "Two lists side by side: what the platform does, and how well. Then say what is out of scope."
  - __component: sd.subsection
    key: functional-sub
    title: Functional requirements
    railLabel: Functional
  - __component: sd.checklist
    key: functional
    idPrefix: FR-
    items:
      - text: A user creates an account and opts for a subscription, monthly or yearly.
        note: As on Netflix, nothing plays without a plan.
      - text: A user searches movies and shows by title or name.
      - text: "A user watches a video at the resolution the device and network allow: 480p, 720p, 1080p or 4K."
      - text: "Out of scope: the recommendation engine, and uploading, which an internal team does."
        note: Ask about recommendations; they are an ML system of their own and usually left out.
  - __component: sd.subsection
    key: non-functional-sub
    title: Non-functional requirements
    railLabel: Non-functional
  - __component: sd.requirement-table
    key: non-functional
    rows:
      - area: Scale
        requirement: A global audience on a curated catalogue.
        targets: [200M users, "10,000 videos of about an hour"]
        note: The catalogue is small because only the company uploads; the audience is what is huge.
      - area: Availability
        requirement: Browsing and playback stay up through failures.
        targets: [availability over consistency]
        note: A new title may appear a few minutes late. Payments and subscriptions are the exception and must be consistent.
      - area: Playback
        requirement: Video starts fast and never stalls.
        targets: [zero or negligible buffering]
        note: Quality may drop for a moment; the picture must not freeze.
  - __component: sd.rich-text
    key: requirements-scale
    body:
      - type: paragraph
        children:
          - type: text
            text: "At 200 million users no single server can take the traffic, let alone stream video, so say it now: this is a distributed design of separate services, not a monolith. The CAP choice is split by module. A film published a few minutes late harms nobody, so the catalogue and playback favour availability; a payment recorded twice or not at all is a real failure, so billing stays consistent."
  - __component: sd.quiz
    key: requirements-quiz
    title: Quick check
    questions:
      - question: Why can the video side choose availability over consistency?
        optionA: Videos never change
        optionB: Only the company publishes, with time to process; a title appearing minutes late costs nothing, downtime costs every viewer
        optionC: Because it uses S3
        optionD: Consistency is impossible
        answer: B
        explanation: Contrast payments, where a charge must be recorded exactly once.
      - question: Which requirement is usually left out of scope?
        optionA: Search
        optionB: The recommendation engine
        optionC: Subscriptions
        optionD: Playback
        answer: B
        explanation: Recommendations are a machine learning system of their own; ask, and usually park it.
  # ────────────────────────────────────────────────────────────────── 2. Entities
  - __component: sd.section
    key: entities
    title: Core entities.
    railLabel: Entities
    intro: "The nouns the system keeps. Four, read straight off the requirements."
  - __component: sd.table
    key: entities-table
    columns:
      - { label: Entity, style: strong }
      - { label: What it is, style: text }
    rows:
      - [User, The person who signs in and watches.]
      - [User metadata, "The user's plan, subscription status and expiry date."]
      - [Video, "The video file itself, in segments and renditions."]
      - [Video metadata, "Title, description and the thumbnail image; the home page is mostly a grid of thumbnails."]
  - __component: sd.quiz
    key: entities-quiz
    title: Quick check
    questions:
      - question: Why is the thumbnail part of the video metadata worth naming?
        optionA: It is not
        optionB: The home page and search results are lists of thumbnails, so they are read far more often than the video
        optionC: It holds the subtitles
        optionD: It is stored in MySQL
        answer: B
        explanation: Every page the user browses is built from metadata and thumbnails before any video plays.
  # ────────────────────────────────────────────────────────────────── 3. API
  - __component: sd.section
    key: api
    title: API.
    railLabel: API
    intro: "One group of endpoints per functional requirement: account and subscription, search, then the details page and play."
  - __component: sd.endpoint
    key: register
    method: POST
    path: /v1/user/register
    summary: "Creates the account. Login, logout and update profile are sibling endpoints; name them and move on."
    requestBody:
      name: user 1
      email: user1@example.com
      password: "********"
    responses:
      - label: Created
        status: "201"
        body:
          userId: u_1001
  - __component: sd.endpoint
    key: plans
    method: GET
    path: /v1/subscription/plans
    summary: Lists every plan on offer.
    responses:
      - label: OK
        status: "200"
        body:
          plans:
            - { subscriptionId: monthly, price: 9.99, currency: USD, validity: 1 month }
            - { subscriptionId: yearly, price: 99, currency: USD, validity: 12 months }
  - __component: sd.endpoint
    key: subscribe
    method: POST
    path: /v1/subscription
    summary: "Opts the signed-in user into a plan and starts checkout."
    requestHeaders: ["Authorization: Bearer <token>"]
    requestBody:
      userId: u_1001
      subscriptionId: monthly
    responses:
      - label: Accepted
        status: "202"
        body:
          status: payment_pending
  - __component: sd.endpoint
    key: search
    method: GET
    path: "/v1/videos/search?q={name}&cursor={cursor}"
    summary: "Matching videos, a page at a time, each with partial metadata: id, title, thumbnail, a short description."
    responses:
      - label: OK
        status: "200"
        body:
          results:
            - { videoId: v_42, title: The Long Night, thumbnail: "https://img.example.com/v_42.jpg" }
          nextCursor: c_2
  - __component: sd.endpoint
    key: details
    method: GET
    path: "/v1/videos/{videoId}"
    summary: The full metadata of one title, as JSON, for its details page.
    responses:
      - label: OK
        status: "200"
        body:
          videoId: v_42
          title: The Long Night
          description: A short description of the title.
          genres: [drama]
          thumbnail: "https://img.example.com/v_42.jpg"
  - __component: sd.endpoint
    key: play
    method: GET
    path: "/v1/videos/play/{videoId}"
    summary: "Starts playback: returns the title's manifest, which tells the player where every segment of every rendition is."
    responses:
      - label: OK
        status: "200"
        body:
          manifestUrl: "https://cdn.example.com/v_42/master.m3u8"
          format: HLS
  - __component: sd.quiz
    key: api-quiz
    title: Quick check
    questions:
      - question: Why is the search result paginated and partial?
        optionA: Search engines require it
        optionB: A query can match many titles; a page of ids with a title and thumbnail is all the results list needs, and the full metadata comes from the details endpoint
        optionC: To hide videos
        optionD: Because of CAP
        answer: B
        explanation: Sending everything at once overwhelms the client; the details page fetches the rest for one title.
  # ────────────────────────────────────────────────────────────────── 4. High-level design
  - __component: sd.section
    key: high-level-design
    title: High-level design.
    railLabel: High level
    intro: "Users, a load balancer with an API gateway, one service per requirement and the stores they need. Uploading is not the user's job, so assume an internal uploader already exists."
  - __component: sd.component-diagram
    key: hld-diagram
    title: The first design
    direction: LR
    nodes:
      - { key: client, details: [users] }
      - { key: api-gateway, details: [round robin, "auth, routing, rate limiting"] }
      - { key: user-service }
      - { key: subscription-service }
      - { key: payment-gateway }
      - { key: search-service }
      - { key: play-service }
      - { key: user-db }
      - { key: video-db, details: [metadata, text only] }
      - { key: uploader, details: [internal team] }
      - { key: blob-storage, details: [video files, thumbnails] }
    edges:
      - { from: client, to: api-gateway }
      - { from: api-gateway, to: user-service }
      - { from: api-gateway, to: subscription-service }
      - { from: api-gateway, to: search-service }
      - { from: api-gateway, to: play-service }
      - { from: user-service, to: user-db }
      - { from: subscription-service, to: user-db }
      - { from: subscription-service, to: payment-gateway }
      - { from: search-service, to: video-db }
      - { from: play-service, to: blob-storage }
      - { from: uploader, to: video-db }
      - { from: uploader, to: blob-storage }
  - __component: sd.rich-text
    key: hld-flows
    body:
      - type: paragraph
        children:
          - type: text
            text: "The load balancer spreads traffic round robin; the API gateway authenticates and authorizes each call, routes it to the right service and rate-limits it. The user service onboards users into the user DB. The subscription service takes the payment through a third-party payment gateway and, on success, records the plan against the user. The search service finds titles; the play service plays them."
      - type: paragraph
        children:
          - type: text
            text: "Where does the content come from? An internal uploader, out of scope, writes each title's text metadata to a video DB and the heavy files, the video and its thumbnails, to blob storage such as S3. Search reads the video DB; play reads blob storage. That meets every functional requirement, but sending a whole video file from S3 to a phone cannot meet the buffering requirement; that is what the low-level design is for."
  - __component: sd.quiz
    key: hld-quiz
    title: Quick check
    questions:
      - question: Why are the videos in blob storage and not in the video DB?
        optionA: Databases cannot store bytes
        optionB: Video files and thumbnails are large immutable blobs; the DB keeps the small text metadata that is queried
        optionC: S3 is faster than any database
        optionD: For consistency
        answer: B
        explanation: Big files go to object storage; searchable text goes to a database.
  # ────────────────────────────────────────────────────────────────── 5. LLD 1: user service
  - __component: sd.section
    key: lld-user-service
    title: "Low-level design, 1: the user service."
    railLabel: LLD 1, users
    intro: "Copy the high-level picture down the board and open the services one at a time, the easiest first: the user service registers users and authenticates them."
  - __component: sd.db-schema
    key: user-table
    stores:
      - key: user-store
        engine: MySQL
        component: user-db
        why: Simple relational rows that must stay consistent.
        tables:
          - name: user
            columns:
              - { name: user_id, type: bigint, role: primary }
              - { name: name, type: text }
              - { name: email, type: text, role: unique }
              - { name: password_hash, type: text, note: "bcrypt or argon2, never the password itself" }
              - { name: subscription_status, type: text }
              - { name: expiry_date, type: timestamp }
  - __component: sd.rich-text
    key: user-login
    body:
      - type: paragraph
        children:
          - type: text
            text: "Registering writes a row. Logging in checks the password against the stored hash; on success the user service issues a JWT, a signed token the client sends with every later call, so the gateway and the other services can trust who is calling without asking the user service each time. Store a salted password hash, never the password."
  - __component: sd.quiz
    key: user-quiz
    title: Quick check
    questions:
      - question: After login, how do the other services know who is calling?
        optionA: They query the user DB on every request
        optionB: The client sends the signed JWT the user service issued, and the gateway verifies it
        optionC: By IP address
        optionD: They do not need to
        answer: B
        explanation: A signed token is checked without a call to the user service.
  # ────────────────────────────────────────────────────────────────── 5. LLD 2: subscription
  - __component: sd.section
    key: lld-subscription
    title: "Low-level design, 2: subscriptions and payments."
    railLabel: LLD 2, subscriptions
    intro: "The subscription service shows the plans, takes the payment through a payment service and a gateway, and then two things must happen: tell the user, and update their record. An event on Kafka does both."
  - __component: sd.db-schema
    key: subscription-tables
    stores:
      - key: subscription-store
        engine: MySQL
        component: subscription-db
        why: A handful of plan rows, read on every visit to the plans page.
        tables:
          - name: subscription
            columns:
              - { name: subscription_id, type: text, role: primary }
              - { name: name, type: text }
              - { name: price, type: decimal }
              - { name: currency, type: text }
              - { name: validity, type: text }
      - key: payment-store
        engine: MySQL
        component: payment-db
        why: Payments must be consistent; a transaction per result.
        tables:
          - name: payment
            columns:
              - { name: payment_id, type: text, role: primary }
              - { name: user_id, type: bigint, role: index }
              - { name: amount, type: decimal }
              - { name: currency, type: text }
              - { name: time, type: timestamp }
  - __component: sd.component-diagram
    key: subscription-diagram
    title: Checkout, then an event
    direction: LR
    nodes:
      - { key: subscription-service }
      - { key: subscription-db }
      - { key: payment-service }
      - { key: payment-gateway }
      - { key: payment-db }
      - { key: kafka, details: [payment events] }
      - { key: notification-service }
      - { key: subscription-consumer }
      - { key: user-db, details: [status, expiry] }
    edges:
      - { from: subscription-service, to: subscription-db, label: plans }
      - { from: subscription-service, to: payment-service, label: checkout }
      - { from: payment-service, to: payment-gateway, label: charge }
      - { from: payment-service, to: payment-db, label: save result }
      - { from: subscription-service, to: kafka, label: payment result }
      - { from: kafka, to: notification-service }
      - { from: kafka, to: subscription-consumer }
      - { from: subscription-consumer, to: user-db, label: "status, expiry" }
  - __component: sd.rich-text
    key: subscription-flow
    body:
      - type: paragraph
        children:
          - type: text
            text: "GET plans reads the subscription DB. When the user picks a plan, the payment service hands the charge to a third-party payment gateway, which takes the card details itself (so they never touch our servers), talks to the bank, and answers success or failure. The payment service saves the result in the payment DB, MySQL because a payment must be recorded exactly once, and acknowledges the subscription service."
      - type: paragraph
        children:
          - type: text
            text: "Two things follow a successful payment: notify the user, and set their subscription status and expiry date. Rather than the subscription service doing both in turn, it publishes one event to Kafka. Two consumer groups read every event independently: a notification service sends the message, and a consumer service updates the user DB. If notifications are slow or down, the user's plan is still activated, and a missed event is read again when the consumer recovers, so the update must be idempotent (keyed by the payment id)."
  - __component: sd.quiz
    key: subscription-quiz
    title: Quick check
    questions:
      - question: Why publish the payment result to Kafka instead of calling the notifier and the user DB directly?
        optionA: Kafka is faster than HTTP
        optionB: Each consumer group reads the event independently, so one slow or failed step does not block the other, and events are kept to be retried
        optionC: The payment gateway requires it
        optionD: To avoid MySQL
        answer: B
        explanation: Decoupling and replay. The update must still be idempotent, since an event can be read twice.
      - question: Why does the payment DB need consistency when the catalogue does not?
        optionA: It is smaller
        optionB: A payment recorded twice or lost is real money; a title appearing late is not
        optionC: MySQL is required by law
        optionD: It does not
        answer: B
        explanation: The CAP choice is per module.
  # ────────────────────────────────────────────────────────────────── 5. LLD 3: search
  - __component: sd.section
    key: lld-search
    title: "Low-level design, 3: search."
    railLabel: LLD 3, search
    intro: "Searching titles by scanning the video DB reads every row. Put a search engine between the search service and the data."
  - __component: sd.component-diagram
    key: search-diagram
    title: Search through an index
    direction: LR
    nodes:
      - { key: search-service }
      - { key: elasticsearch, details: [inverted index] }
      - { key: cdc, details: [every change, near real time] }
      - { key: video-db }
    edges:
      - { from: search-service, to: elasticsearch, label: query }
      - { from: video-db, to: cdc }
      - { from: cdc, to: elasticsearch, label: index }
  - __component: sd.rich-text
    key: search-text
    body:
      - type: paragraph
        children:
          - type: text
            text: "A title search with a pattern such as LIKE '%night%' cannot use an ordinary index, so the database scans the table. Elasticsearch keeps an inverted index, from each word to the titles that contain it, and answers full-text, fuzzy and ranked queries from that index, not from the database."
      - type: paragraph
        children:
          - type: text
            text: "The index has to follow the video DB. A CDC (change data capture) pipeline, Debezium for example, reads the database's change log and streams every insert and update into Elasticsearch within seconds, so a newly published title becomes searchable without the uploader writing to two places. Results go back a page at a time, with partial metadata."
  - __component: sd.quiz
    key: search-quiz
    title: Quick check
    questions:
      - question: Where does Elasticsearch run the user's query?
        optionA: Against the video DB
        optionB: Against its own inverted index, which CDC keeps in step with the video DB
        optionC: Against S3
        optionD: In the browser
        answer: B
        explanation: The database is the source; the index is a copy built for searching.
  # ────────────────────────────────────────────────────────────────── 5. LLD 4: video processing
  - __component: sd.section
    key: lld-video-processing
    title: "Low-level design, 4: processing the video."
    railLabel: LLD 4, processing
    intro: "The play service cannot send a whole film: a 4K master of an hour is tens of gigabytes. Before a title is published, it is cut into short segments, each encoded at several qualities, and described by a manifest."
  - __component: sd.component-diagram
    key: processing-diagram
    title: From upload to segments
    direction: LR
    nodes:
      - { key: uploader }
      - { key: blob-storage }
      - { key: chunker, details: [2 to 10 s segments] }
      - { key: kafka, details: [for further processing] }
      - { key: encoder, details: ["H.264 or H.265", "480p, 720p, 1080p, 4K"] }
      - { key: video-db, details: [MongoDB, manifests] }
    edges:
      - { from: uploader, to: video-db, label: metadata }
      - { from: uploader, to: blob-storage, label: master file }
      - { from: blob-storage, to: chunker, label: new upload }
      - { from: chunker, to: kafka, label: segments }
      - { from: kafka, to: encoder }
      - { from: encoder, to: blob-storage, label: renditions }
      - { from: chunker, to: video-db, label: manifest }
  - __component: sd.rich-text
    key: processing-text
    body:
      - type: paragraph
        children:
          - type: text
            text: "The video's sizes: a 4K hour is about 40 GB, a two-and-a-half-hour film about 100 GB. Those are master-file sizes; even the compressed 4K stream a viewer receives is several gigabytes an hour. No phone downloads that before playing, and many networks could not keep up with the top quality all the time. So the uploader puts the master in S3, S3 notifies the chunker, and the chunker splits it into segments of 2 to 10 seconds: a 20-minute video in 10-second segments is 120 of them."
      - type: paragraph
        children:
          - type: text
            text: "The segments go onto Kafka, and a fleet of video encoders works through them in parallel. Each segment is transcoded into a bitrate ladder, 480p, 720p, 1080p and 4K, with H.264 or the more efficient H.265, and packaged for the streaming protocols: HLS accepts MPEG-TS (.ts) or fragmented MP4 segments, DASH uses fragmented MP4. Every rendition is written back to S3."
      - type: paragraph
        children:
          - type: text
            text: "Thousands of files need an order. The manifest gives it: for HLS an .m3u8 playlist, plain text; for DASH an .mpd, XML. A master playlist lists each rendition with its bandwidth and resolution (low, medium, high), and each rendition's own playlist lists its segments in order. It is written once the renditions exist, and stored with the title in the video DB. MongoDB fits that DB: a film, a series with seasons and a single episode have different shapes."
  - __component: sd.table
    key: manifest-example
    title: A master playlist, in outline
    columns:
      - { label: Rendition, style: text }
      - { label: Bandwidth, style: mono }
      - { label: Resolution, style: mono }
      - { label: Playlist, style: mono }
    rows:
      - [Low, "500 kbps", 640x360, low.m3u8]
      - [Medium, "1 Mbps", 1280x720, medium.m3u8]
      - [High, "3 Mbps", 1920x1080, high.m3u8]
  - __component: sd.quiz
    key: processing-quiz
    title: Quick check
    questions:
      - question: Why encode every segment at several bitrates?
        optionA: For backup
        optionB: So the player can pick, segment by segment, the quality its network can sustain
        optionC: To save storage
        optionD: Because HLS requires 4K
        answer: B
        explanation: The ladder is what makes adaptive streaming possible; it costs storage, not saves it.
      - question: What does the master manifest hold?
        optionA: The video bytes
        optionB: Each rendition's bandwidth, resolution and the address of its own playlist of segments
        optionC: The user's plan
        optionD: Only the title
        answer: B
        explanation: The player reads it first and then follows one rendition's playlist.
  # ────────────────────────────────────────────────────────────────── 5. LLD 5: playback
  - __component: sd.section
    key: lld-playback
    title: "Low-level design, 5: playback and the CDN."
    railLabel: LLD 5, playback
    intro: "Pressing play now fetches a manifest, not a video. The player does the rest: it measures its network and fetches one segment at a time, at the quality that keeps the buffer full, from a CDN near the viewer."
  - __component: sd.component-diagram
    key: playback-diagram
    title: The final design for playback
    direction: LR
    nodes:
      - { key: client, details: [measures throughput and buffer] }
      - { key: play-service }
      - { key: manifest-cache }
      - { key: video-db }
      - { key: cdn, details: [popular segments per region] }
      - { key: blob-storage }
    edges:
      - { from: client, to: play-service, label: play }
      - { from: play-service, to: manifest-cache, label: manifest }
      - { from: manifest-cache, to: video-db, label: on a miss }
      - { from: client, to: cdn, label: segments }
      - { from: cdn, to: blob-storage, label: on a miss }
  - __component: sd.rich-text
    key: playback-text
    body:
      - type: paragraph
        children:
          - type: text
            text: "The play service reads the manifest from the video DB and returns it. The player estimates its throughput and looks at its buffer, chooses a rendition, and requests segments ahead of the playhead. The video's example, with the resolutions corrected: at 2 Mbps the first 10-second segment comes at 480p; at 2 Mbps still, the second does too; when the network rises to 10 Mbps, the next segment comes at 1080p (4K needs about 15 Mbps or more). The player only switches between segments, and each segment begins with a keyframe so it can be decoded on its own. The next request is driven by how full the buffer is, not by a keyframe."
      - type: paragraph
        children:
          - type: text
            text: "Fetching every segment through the gateway, the play service and S3 is a long trip. Segments are served by a CDN instead: servers in the viewer's region that hold the segments people there watch, filled from S3 on a miss. Then one small speed-up: a Redis cluster in front of the video DB holds the manifests of titles being played, so pressing play does not wait on the database."
  - __component: sd.table
    key: hls-dash
    title: HLS and DASH
    columns:
      - { label: "", style: strong }
      - { label: HLS, style: text }
      - { label: DASH, style: text }
    rows:
      - [Manifest, ".m3u8, plain text", ".mpd, XML"]
      - [Segments, "MPEG-TS or fragmented MP4", fragmented MP4 (or TS)]
      - [Typical segment length, about 6 seconds, 2 to 4 seconds]
      - [Origin, "Apple; native on Apple devices", open ISO standard]
      - [Adaptive bitrate, "yes, many renditions, buffers ahead", "yes, many renditions, buffers ahead"]
  - __component: sd.rich-text
    key: playback-close
    body:
      - type: paragraph
        children:
          - type: text
            text: "Both protocols are adaptive, both list many bitrates and both let the player buffer several segments ahead, so the choice is about devices: large services ship both, HLS for Apple devices and DASH elsewhere, often from the same fragmented-MP4 segments. Close by reading the non-functional list back: scale from services behind a gateway and a CDN; availability from replicated stores and Kafka; negligible buffering from short segments, a bitrate ladder and nearby caches."
  - __component: sd.quiz
    key: playback-quiz
    title: Quick check
    questions:
      - question: The network drops from 10 Mbps to 2 Mbps mid-film. What does the player do?
        optionA: Pauses to buffer the 4K stream
        optionB: Requests the next segment from a lower rendition in the manifest, so the picture softens but keeps playing
        optionC: Asks the play service for a new film
        optionD: Nothing
        answer: B
        explanation: Switching happens at segment boundaries, chosen from throughput and buffer level.
      - question: Why serve segments from a CDN instead of S3 through the play service?
        optionA: S3 cannot serve files
        optionB: A server near the viewer cuts the round trip for every segment, and popular segments stay cached per region
        optionC: The CDN encodes the video
        optionD: For payments
        answer: B
        explanation: A miss goes to S3 once; later viewers in the region are served locally.
      - question: Which is a real difference between HLS and DASH?
        optionA: Only DASH supports several bitrates
        optionB: HLS uses an .m3u8 text playlist and is native on Apple devices; DASH uses an XML .mpd and is an open standard
        optionC: HLS cannot buffer ahead
        optionD: DASH has no manifest
        answer: B
        explanation: Both are adaptive and multi-bitrate; the manifest format and device support differ.
