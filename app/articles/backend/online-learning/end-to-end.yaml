  - __component: sd.quiz
    key: progress-quiz
    title: Quick check
    questions:
      - question: The player sends progress every 10 seconds. Why not write each event to the progress DB?
        optionA: MySQL cannot store integers
        optionB: Only the latest position is needed, so the consumer batches the events and writes the last one
        optionC: Events are too large
        optionD: Kafka forbids it
        answer: B
        explanation: Kafka absorbs the stream; the database gets one row per student and video, overwritten.
      - question: Each enterprise customer wants its own URL. What do you use?
        optionA: A subnet per customer
        optionB: A subdomain per organisation, with wildcard DNS and routing by the Host header
        optionC: A separate CDN
        optionD: A new database per request
        answer: B
        explanation: Subnets are IP ranges inside a network; tenant URLs are a DNS and routing matter.
