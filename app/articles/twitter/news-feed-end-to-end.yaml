#
# A whole frontend system design interview for the Twitter news feed, run section by section on
# one whiteboard: approach, mock-up, requirements, application state, API, then the three
# performance buckets (network, rendering, JavaScript) and the wrap-up.
# Running example: Twitter's web feed (the user asked for the real name). Its internals here are illustrative, not how Twitter is built.
# (pages and /api on the same origin, images on img.twitter.example behind a CDN). Its tweets
# are short posts with up to four images. Every size, count and timing for Twitter is an
# illustrative assumption for the exercise, not a measurement of any real product.
# The main-site topic twitter/home-timeline designs the backend that fills this feed; this one is the
# client interview walkthrough, chronological and time-boxed.
