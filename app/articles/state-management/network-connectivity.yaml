# yaml-language-server: $schema=../../../../lego/content-kit/schema/topic.schema.json
# provenance: ai-drafted by claude-opus-5-5 on 2026-10-26
#
# Concept topic in five sections: key-idea → how-it-works (knowing the state) →
# retries-and-queued-writes → live-updates-and-slow-links → in-practice.
# Running example (our own): Stallhand, a made-up app for market stallholders at stallhand.example
# (RFC 2606 name). Nell Arden runs a cheese stall at the back of a covered Saturday market. Her
# phone shows click-and-collect pre-orders as they arrive (polled), records walk-up cash sales,
# marks orders collected and carries a chat with her helper Arlo. The hall's cell gets crowded
# and drops data; the café next door has Wi-Fi with a sign-in page.
# Key-idea: connectivity is a piece of state with a shape (status, since, lastOkAt, rtt,
# saveData, pending writes) and five situations the user meets. How-it-works: navigator.onLine
# and its events (false is trustworthy, true is not), confirming with a probe and with real
# requests, captive portals under HTTPS, link quality from the Network Information API
# (Chromium only) and from the app's own timings; a monitor state machine with hysteresis.
# Retries-and-queued-writes: timeouts, backoff with full jitter, what to retry, the outbox with
# idempotency keys, optimistic rows and rollback. Live-updates-and-slow-links: pausing polling and
# sockets offline or hidden, catching up with a cursor, what a timer poll costs a phone's radio
# (the RRC tail), connection setup and network switches, adapting to slow links and Save-Data.
# In-practice: the screen through each state, queue or disable per action, stale markers,
# testing, failure modes, the interview answer.
# Every timing, count and battery figure is Stallhand's own assumption unless a source is named;
# API behaviour comes from MDN, the WICG Network Information draft and Chrome's docs; radio power
# figures from Huang et al. (MobiSys 2012) and High Performance Browser Networking.
# Owners elsewhere: retry loops and AbortSignal in depth (data-retrieval/races-dedupe-and-cancellation),
# optimistic writes (data-retrieval/mutations-and-optimistic-updates), offline caching of the app
# itself (network-performance/service-worker-caching), long polling and SSE
# (client-server-protocols/polling-and-server-sent-events), socket heartbeats
# (client-server-protocols/websockets), document-level offline merge (google-docs/offline-and-conflicts),
# a cross-tab outbox (facebook/messenger-chat).
catalogVersion: 5
title: "Network connectivity: when the network drops and comes back"
shortTitle: Network connectivity
summary: "Treat the connection as state the whole app reads: know it from real requests rather than navigator.onLine, then retry with backoff, queue writes made offline, pause live updates and resync, and tell people what still works."
group: core
order: 3
xp: 240
difficulty: intermediate
tags: [offline, sync, retries, networking]
prerequisites: [kinds-of-state]
